<script id="quiz-data" type="application/json">{"schema":"chem-quiz-public/v3","nodes":[{"id":"central-0-1-ch1-sec1-1-topic01","title":"1.1-01 化學的原子與分子觀點","version":"B01-G03-v1-f1088904791c514d","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.1 化學研究"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-1-topic01-G03-S001","stem":"以空氣為例，下列哪一組條件能說明它屬於物質？","concept":"物質的基本判準是具有質量並占有空間，不要求肉眼一定看得到。空氣中的粒子雖然看不見，整份空氣仍有質量，也會占據容器內的空間。流動性、顏色與是否含氧都是額外特徵，不能代替物質的兩項基本條件。因此判斷氣體是否為物質時，應回到質量與空間。","correct":"B","options":[{"id":"A","text":"可以流動，且沒有固定形狀","explanation":"錯誤。這組描述流動及形狀，沒有涵蓋物質的完整定義。"},{"id":"B","text":"具有質量，且占有空間","explanation":"正確。質量與所占空間正是物質的兩項基本條件。"},{"id":"C","text":"含氧，且能支持燃燒","explanation":"錯誤。物質不一定含氧，也不一定支持燃燒。"},{"id":"D","text":"沒有顏色，且能透光","explanation":"錯誤。透明與無色是光學外觀，並非物質的定義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S002","stem":"同一種由完整分子構成的均勻液體在相同溫度下，取樣量加倍，且沒有反應或物態改變。下列哪一量不因取樣量加倍而改變？","concept":"質量與體積本身都是可量測的物理量；本題要分辨的是是否隨取樣量改變。相同條件下，同種均勻液體取兩倍的量，質量和體積都變為兩倍，分子總數也加倍；密度則為質量除以體積，兩倍質量除以兩倍體積，所得比值不變。要用這個關係，須保留同種物質、均勻及相同條件的前提。","correct":"D","options":[{"id":"A","text":"樣品的總體積","explanation":"錯誤：取樣量加倍，同條件下所占的液體總體積也加倍。"},{"id":"B","text":"樣品的總質量","explanation":"錯誤：取用兩倍的同種液體，樣品總質量也加倍。"},{"id":"C","text":"樣品的分子總數","explanation":"錯誤：分子本身不變，但整份樣品含有的分子個數加倍。"},{"id":"D","text":"樣品質量除以體積的比值","explanation":"正確：密度為m/V；(2m)/(2V)=m/V，因此不因取樣量加倍而變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S003","stem":"甲、乙液體外觀皆無色，但甲容易燃燒、乙不易燃燒。哪一項結論成立？","concept":"一種物質可以同時具有顏色、密度、可燃性等多個性質。某一個特徵相同，不表示其他特徵也相同。本題兩液體的顏色一致，卻在可燃性上不同，正好說明只靠外觀無法完成物質判斷。若要解釋這項差別，還要比較分子的組成與結構，不能直接推成沒有共同元素。","correct":"A","options":[{"id":"A","text":"顏色相同不足以判斷兩者具有相同的全部性質","explanation":"正確。已知可燃性不同，顏色相同不能推出全部性質相同。"},{"id":"B","text":"兩者顏色相同，所以分子組成必相同","explanation":"錯誤。相同顏色不能決定分子中有哪些原子。"},{"id":"C","text":"可燃性不同，所以兩者一定沒有共同元素","explanation":"錯誤。不同物質仍可含有相同元素，例如乙醇與乙二醇。"},{"id":"D","text":"只要測得顏色相同，就可忽略可燃性的結果","explanation":"錯誤。可燃性是有效的性質資料，不因顏色一致而失效。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S004","stem":"在相同條件下描述某物質「黏稠、易燃」，這兩個詞分別提供哪一類資訊？","concept":"黏稠描述液體流動時的表現，易燃描述物質參與燃燒的特徵，兩者都是物質性質的資料。它們並沒有逐一列出構成分子的原子，也不是化學式。化學研究會先觀察這些巨觀性質，再以微觀組成與結構尋找原因；觀察到某性質本身，還不等於已知道完整分子結構。","correct":"C","options":[{"id":"A","text":"原子種類與原子個數","explanation":"錯誤。兩詞都沒有給出元素清單或各原子數。"},{"id":"B","text":"分子式與結構式","explanation":"錯誤。分子式、結構式是符號表示，與這兩個性質詞不同。"},{"id":"C","text":"流動特徵與燃燒特徵","explanation":"正確。黏稠關於流動，易燃關於燃燒。"},{"id":"D","text":"分子數與元素種類數","explanation":"錯誤。這些性質沒有說明樣品內有幾個分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S005","stem":"一個水分子含有2個氫原子與1個氧原子。若只計元素種類，共有幾種？","concept":"元素種類看的是原子所屬的元素，不是原子個體的總數。水分子中的兩個氫原子都屬於氫元素，所以只算一種類；氧原子屬於另一種類。因此水共有氫與氧兩種元素，單一分子則共有三個原子。這兩種計數回答的是不同問題，不能混為一談。","correct":"B","options":[{"id":"A","text":"1種","explanation":"錯誤。水除了氫還有氧，並非只含一種元素。"},{"id":"B","text":"2種","explanation":"正確。兩個氫仍只算氫這一種，加上氧共兩種。"},{"id":"C","text":"3種","explanation":"錯誤。3是每個水分子的原子總數。"},{"id":"D","text":"4種","explanation":"錯誤。題示原子只分屬氫與氧，沒有另外兩種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S006","stem":"氧氣O₂與水H₂O都含氧原子。關於兩者中的氧，下列敘述何者正確？","concept":"每種元素對應其特定種類的原子。氧原子與另一氧原子結合形成O₂，或與氫原子組成H₂O，都仍屬於氧元素。改變的是原子組合成哪種分子，而不是僅因鄰近原子不同就成為另一元素。辨認元素種類與辨認整個分子，是化學中不同層次的工作。","correct":"D","options":[{"id":"A","text":"水中的氧因連著氫，改屬氫元素","explanation":"錯誤。與氫連接不會使氧變成氫。"},{"id":"B","text":"O₂中有兩個氧，因此屬兩種氧元素","explanation":"錯誤。兩個原子個體可以屬於同一種元素。"},{"id":"C","text":"水中與氧氣中的氧屬不同元素，因為物質名稱不同","explanation":"錯誤。物質名稱不同不能把共同的氧改成不同元素。"},{"id":"D","text":"兩者含有同一種氧元素，但所在分子的組成不同","explanation":"正確。兩者共享氧這個元素，但整個分子組成不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S007","stem":"氧氣O₂由兩個氧原子結合而成。下列哪一項最能避免把「原子數」與「元素種類數」混淆？","concept":"分子是由原子結合形成的粒子；一個分子中的原子可以屬於同一種元素。O₂的下標2表示每一個氧分子含兩個氧原子，兩者都用O表示，所以元素種類只有一種。看到兩個原子時，必須再看它們的種類，不能把原子數直接當成元素種類數。","correct":"A","options":[{"id":"A","text":"每分子有2個原子，但只含1種元素","explanation":"正確。兩個O原子屬同一種氧元素。"},{"id":"B","text":"每分子有1個原子，但含2種元素","explanation":"錯誤。把原子數與元素種類數對調了。"},{"id":"C","text":"每分子有2個原子，也含2種元素","explanation":"錯誤。原子數2正確，但兩個O不是兩種元素。"},{"id":"D","text":"每分子有1個原子，也只含1種元素","explanation":"錯誤。元素種類1正確，原子數應為2。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S008","stem":"物質種類遠多於元素種類，最合理的原子層次解釋為何？","concept":"元素提供組成物質的基本原子種類，而物質的組成還包括原子數量與比例，結構則包含連接及排列。同一組元素可以用不同方式組合，例如乙醇與乙二醇都含碳、氫、氧，卻是不同物質。有限的元素種類不會把物質種類限制成同樣少的數量，辨認新物質也不等於發現新元素。","correct":"C","options":[{"id":"A","text":"每遇到一種新物質，就必須新增一種元素","explanation":"錯誤。新物質可由已知元素重新組合而成。"},{"id":"B","text":"元素只能單獨存在，不能參與不同組合","explanation":"錯誤。元素的原子可以參與不同物質的組成。"},{"id":"C","text":"相同元素可用不同原子數量與排列組成多種物質","explanation":"正確。原子數量與排列的多樣性可產生不同物質。"},{"id":"D","text":"同一元素的所有原子只能形成一種分子","explanation":"錯誤。同一元素能出現在許多不同分子中。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S009","stem":"「每個分子含2個碳、6個氫、1個氧」最直接描述物質的哪一方面？","concept":"組成關心分子含哪些元素，以及每種元素有多少原子。本題把碳、氫、氧的數量列出，屬於完整的單分子組成資訊，能寫成C₂H₆O。但清單沒有交代原子誰連著誰，仍不能單靠它決定結構與全部性質。組成與結構需分開讀取，再合起來理解物質。","correct":"A","options":[{"id":"A","text":"組成","explanation":"正確。原子種類及數量就是組成資訊。"},{"id":"B","text":"連接順序","explanation":"錯誤。數量清單沒有說哪個碳與氧直接連接。"},{"id":"C","text":"空間形狀","explanation":"錯誤。沒有原子在空間的排列資料。"},{"id":"D","text":"沸騰溫度","explanation":"錯誤。沸點是性質，不能從這份數量清單直接讀出。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S010","stem":"已知某分子的原子種類與個數，若進一步得知「氧接在哪個碳上」，新增的是哪一類資訊？","concept":"結構描述原子彼此的連接、排列或形狀。原先已知道有哪些原子與各有幾個，便已掌握組成；新增氧與哪個碳相連的資訊，補足的是連接結構。即使原子種類及數目不變，連接方式也可能有差別。因此討論結構不能只把分子式的下標重數一次。","correct":"C","options":[{"id":"A","text":"樣品數量","explanation":"錯誤。連接資料沒有增加樣品或分子的數量資訊。"},{"id":"B","text":"物質密度","explanation":"錯誤。密度需質量與體積資料。"},{"id":"C","text":"分子結構","explanation":"正確。氧與碳的直接連接屬結構。"},{"id":"D","text":"元素種類","explanation":"錯誤。題目已給原子種類，新資料不是增加元素清單。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S011","stem":"兩種分子具有相同分子式，單憑這項資料可確定何者？","concept":"分子式表示一個分子中各元素的原子數，因此分子式相同可確定單分子組成相同。然而分子式通常不交代原子連接方式，相同組成仍可能有不同結構。密度及生物作用屬性質，還受結構等因素影響，不能只由式子相同保證相同。讀式子時應分清已知組成與尚未提供的結構。","correct":"B","options":[{"id":"A","text":"所有原子的連接方式相同","explanation":"錯誤。分子式相同並不提供完整連接關係。"},{"id":"B","text":"每分子各元素的原子數相同","explanation":"正確。同一分子式的元素種類及各原子數一致。"},{"id":"C","text":"兩種物質在同溫的密度相同","explanation":"錯誤。相同組成不保證不同結構物質的密度相同。"},{"id":"D","text":"兩種物質的生物作用相同","explanation":"錯誤。生物作用不能僅由相同分子式判定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S012","stem":"已確認甲、乙具有相同原子種類及每分子原子數，但連接方式不同。兩者最直接的差異是？","concept":"比較分子時可先列原子數，再檢查連接。題目已排除種類及數量差異，所以兩者的組成相同；剩下已明確指出的不同，是原子之間如何連接，也就是結構。這種差異可能影響物質性質，不應因分子式相同而忽略，但本題資料沒有決定各性質差多少。","correct":"D","options":[{"id":"A","text":"元素種類","explanation":"錯誤。題目已說原子種類相同。"},{"id":"B","text":"原子總數","explanation":"錯誤。每分子的原子數也已確定相同。"},{"id":"C","text":"分子數","explanation":"錯誤。題目比較連接，沒有給樣品內分子數差異。"},{"id":"D","text":"結構","explanation":"正確。相同組成下的連接差異就是結構差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S013","stem":"甲分子C₂H₆O，乙分子C₂H₆O₂。哪一項比較正確？","concept":"判斷組成要同時看元素種類和各元素的原子數。兩式都只有C、H、O三種符號，元素種類相同；碳都是2、氫都是6，但氧分別是1與2。多出一個氧仍是已有的氧元素，不會增加元素種類。這也提醒我們，元素種類相同只是組成比較的第一步。","correct":"C","options":[{"id":"A","text":"乙比甲多一種元素","explanation":"錯誤。新增的是氧的個數，不是新的元素種類。"},{"id":"B","text":"兩者只有結構差異，組成完全相同","explanation":"錯誤。氧原子數不同，已構成組成差異。"},{"id":"C","text":"兩者元素種類相同，但每分子的氧原子數不同","explanation":"正確。兩者都含C、H、O，而氧數是1與2。"},{"id":"D","text":"乙的碳、氫、氧原子數都是甲的兩倍","explanation":"錯誤。只有每分子的氧數為兩倍，碳與氫相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S014","stem":"比較H₂O與H₂O₂的分子式，下列何者可直接判定？","concept":"分子式的下標只指定緊鄰元素在一個分子中的原子數，未寫下標則是1。H₂O含2H與1O，H₂O₂含2H與2O，因此兩者共享氫、氧兩種元素且氫數相同，氧數不同。組成差異已足以排除「只是同一分子換寫法」的解讀，至於具體性質差異仍需要其他資料。","correct":"A","options":[{"id":"A","text":"兩者每分子的氫原子數相同，氧原子數不同","explanation":"正確。兩式的氫下標都是2，氧分別為1與2。"},{"id":"B","text":"兩者每分子的氫原子數不同，氧原子數相同","explanation":"錯誤。它把相同與不同的元素對調了。"},{"id":"C","text":"兩者原子種類與個數都相同","explanation":"錯誤。氧原子個數並不相同。"},{"id":"D","text":"兩者只因寫法不同，必為同一種分子","explanation":"錯誤。不同的氧下標表示不同組成，不能視為純書寫差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S015","stem":"下列哪一組敘述依序屬於「組成」與「結構」？","concept":"組成回答「有哪些原子、各有多少」，結構回答「原子如何連接或排列」。數目比2：6：1屬於組成，而兩碳直接相連屬於結構。顏色、可燃性與黏性則是性質，與原子清單不同。用這三個問題分別檢查，可避免把性質、組成與結構混寫成同一類。","correct":"B","options":[{"id":"A","text":"液體無色；容易燃燒","explanation":"錯誤。無色與可燃都是性質，並非組成接結構。"},{"id":"B","text":"含碳、氫、氧且數目比2：6：1；兩個碳直接相連","explanation":"正確。前者列種類與比例，後者列連接關係。"},{"id":"C","text":"分子中氧連著氫；液體具有黏性","explanation":"錯誤。前者是結構，後者是性質。"},{"id":"D","text":"分子呈彎曲排列；每分子共三個原子","explanation":"錯誤。前者是結構，後者是組成計數，順序相反。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S016","stem":"關於分子組成、結構與性質的關係，下列何者正確？","concept":"物質性質與原子種類、數目及排列有關。比較兩個分子時，不能只用元素清單或總原子數決定一切。乙醇與乙二醇共享C、H、O，卻在組成、結構與生物作用上有差異，說明分子差異大小與性質差異大小不必成比例。「可能改變」也不等於保證所有性質都會改變。","correct":"D","options":[{"id":"A","text":"性質只取決於元素種類，與原子數無關","explanation":"錯誤。原子數和排列也屬理解性質的重要資訊。"},{"id":"B","text":"只要原子總數相同，性質必完全相同","explanation":"錯誤。相同總數可以由不同元素或連接方式組成。"},{"id":"C","text":"組成差異小時，不可能有明顯性質差異","explanation":"錯誤。教材的相近分子例子正說明小差異可有明顯影響。"},{"id":"D","text":"組成或結構的微小改變，也可能帶來明顯性質差異","explanation":"正確。這保留組成與結構影響性質的可能性，未過度保證全部性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S017","stem":"一個乙二醇分子的分子式為C₂H₆O₂，其中共有多少個原子？","concept":"分子式列出每一種元素在單一分子中的原子數。C₂H₆O₂含2個碳、6個氫、2個氧，全部原子應把三者相加，得到2＋6＋2＝10個。3代表元素種類數，6只代表氫原子數，都不是題目所問的總原子數。這裡的計數基準是一個完整分子。","correct":"C","options":[{"id":"A","text":"3個","explanation":"錯誤。3是C、H、O的元素種類數。"},{"id":"B","text":"6個","explanation":"錯誤。6只計了氫原子。"},{"id":"C","text":"10個","explanation":"正確。2C＋6H＋2O合計10個原子。"},{"id":"D","text":"12個","explanation":"錯誤。各下標應相加，並沒有12個原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S018","stem":"阿斯匹靈的分子式為C₉H₈O₄。每個分子中碳原子比氧原子多幾個？","concept":"分子式的下標分別給出各元素原子數。阿斯匹靈每分子有9C、8H、4O；題目比較碳與氧的數量差，所以用9−4＝5個。氫雖然也是分子的組成部分，但不參加這次兩類原子的差值計算。差值、某元素的個數與兩者總數應分開辨認。","correct":"A","options":[{"id":"A","text":"5個","explanation":"正確。碳9個減氧4個，差5個。"},{"id":"B","text":"4個","explanation":"錯誤。4是氧原子數。"},{"id":"C","text":"9個","explanation":"錯誤。9是碳原子數，尚未扣除氧數。"},{"id":"D","text":"13個","explanation":"錯誤。13是碳與氧的總數，不是相差數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S019","stem":"一個CO₂分子含有哪一組原子？","concept":"元素符號後沒有下標，表示每分子含該元素1個原子；右下標2只屬於其前方的O。因此CO₂表示1個碳與2個氧，共3個原子。它不是兩個CO分子，也不是碳和氧都乘2。讀分子式時應逐一將元素符號與其下標配對。","correct":"B","options":[{"id":"A","text":"2個碳、1個氧","explanation":"錯誤。下標2跟在O後，不能移到C。"},{"id":"B","text":"1個碳、2個氧","explanation":"正確。C省略下標1，O的下標為2。"},{"id":"C","text":"1個碳、1個氧","explanation":"錯誤。這組原子對應CO，漏掉一個氧。"},{"id":"D","text":"2個碳、2個氧","explanation":"錯誤。C沒有下標2，不能一起加倍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S020","stem":"乙醇的縮寫結構式為CH₃CH₂OH。每個分子中共有幾個氫原子？","concept":"縮寫結構式會把氫分散寫在不同原子或原子團旁，計數時要把所有H加總。CH₃給3H，CH₂給2H，最後OH再給1H，因此共有3＋2＋1＝6H。OH中的氫不能漏掉，也不能因看見兩個含氫碳就只計碳旁的氫。全式可整理為C₂H₆O。","correct":"D","options":[{"id":"A","text":"3個","explanation":"錯誤。3只計CH₃中的氫。"},{"id":"B","text":"5個","explanation":"錯誤。5漏掉OH中的1H。"},{"id":"C","text":"7個","explanation":"錯誤。全式列出的H相加為6，沒有第7個氫。"},{"id":"D","text":"6個","explanation":"正確。3＋2＋1＝6個氫。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S021","stem":"對單一乙醇分子C₂H₆O而言，氫與氧的原子數比為何？","concept":"原子數比需先指定比較的兩類原子。乙醇每分子有6H與1O，因此H：O＝6：1。碳雖有2個，這裡不在比值中；全部原子共9個，也不能拿來替代氧的個數。這是原子個數比，並沒有使用原子質量，因此不能當成質量比。","correct":"A","options":[{"id":"A","text":"6：1","explanation":"正確。每分子的氫6個、氧1個。"},{"id":"B","text":"3：1","explanation":"錯誤。3：1 是乙醇的 H：C 原子數比，不是本題的 H：O。"},{"id":"C","text":"2：1","explanation":"錯誤。2：1是C：O的原子數比。"},{"id":"D","text":"6：9","explanation":"錯誤。6：9是氫對全部原子的比，不是H對O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S022","stem":"下列哪一個分子含有最多的元素種類？","concept":"元素種類由不同元素符號的數量決定，與下標大小無關。O₂只有O一種，H₂O有H、O兩種，CO₂有C、O兩種，C₂H₆O則有C、H、O三種。因此乙醇在這組分子中種類最多。比較的是種類，不是原子總數或分子的實際大小。","correct":"D","options":[{"id":"A","text":"氧氣O₂","explanation":"錯誤。O₂只有氧一種元素。"},{"id":"B","text":"水H₂O","explanation":"錯誤。水只有氫、氧兩種。"},{"id":"C","text":"二氧化碳CO₂","explanation":"錯誤。CO₂只有碳、氧兩種。"},{"id":"D","text":"乙醇C₂H₆O","explanation":"正確。C₂H₆O包含碳、氫、氧三種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S023","stem":"2個完整水分子H₂O總共含有多少個氧原子？","concept":"一個H₂O分子包含1個O，兩個完整分子就包含2×1＝2個O。分子數增加時，每一種原子的數量都按相同倍數增加，但每分子的組成仍是2H、1O。這裡不要把下標2看成氧的數量，它屬於H；兩個水分子中的氫總數才是4個。","correct":"B","options":[{"id":"A","text":"1個","explanation":"錯誤。1只是一個水分子的氧數。"},{"id":"B","text":"2個","explanation":"正確。兩個分子各有1O，共2O。"},{"id":"C","text":"3個","explanation":"錯誤。3是一個水分子的總原子數。"},{"id":"D","text":"4個","explanation":"錯誤。4是兩個水分子中的氫總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S024","stem":"下列哪一個分子同時含碳、氫、氧，且每分子只有1個氧原子？","concept":"判斷分子組成時需同時檢查元素種類與指定原子數。C₂H₆O包含C、H、O，O沒有下標表示1，符合兩個條件。H₂O雖有1O卻不含碳；另兩式的氧都是2個。題目並非只問含氧，不能漏掉碳與氫都必須存在的要求。","correct":"C","options":[{"id":"A","text":"H₂O","explanation":"錯誤。H2O只有氫與氧，沒有碳，未滿足三種元素同時存在的條件。"},{"id":"B","text":"CO₂","explanation":"錯誤。CO₂沒有氫，而且有2O。"},{"id":"C","text":"C₂H₆O","explanation":"正確。C、H、O俱全，且O為1個。"},{"id":"D","text":"C₂H₆O₂","explanation":"錯誤。它含三種元素，但每分子有2O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S025","stem":"C₉H₈O₄中的下標9，表示哪一個數量？","concept":"分子式中每個下標只指定緊鄰元素在單一分子中的原子數。C₉H₈O₄的9跟在C後，表示每分子9個碳；氫及氧需另讀8與4。整個分子的總原子數是9＋8＋4＝21，而元素種類是3。樣品含幾個分子則需要式子之外的數量資料。","correct":"A","options":[{"id":"A","text":"一個分子中的碳原子數","explanation":"正確。9屬於C的下標。"},{"id":"B","text":"整份樣品的分子數","explanation":"錯誤。分子式本身不給整份樣品的分子數。"},{"id":"C","text":"一個分子中的元素種類數","explanation":"錯誤。種類由C、H、O三個不同符號決定。"},{"id":"D","text":"一個分子中的原子總數","explanation":"錯誤。原子總數還要加上氫8個與氧4個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S026","stem":"乙二醇寫成HOCH₂CH₂OH。將全部原子整理為分子式，應為何？","concept":"整理縮寫結構式時，要逐段計數，再合併相同元素。兩個CH₂提供2C、4H，兩端的HO與OH合計再提供2H、2O，所以全分子是2C、6H、2O。兩端各有一個氫，不可漏算；結構式的各片段也不可當成彼此獨立的分子。","correct":"D","options":[{"id":"A","text":"C₂H₄O₂","explanation":"錯誤。漏算兩端與O相連的2H。"},{"id":"B","text":"C₂H₆O","explanation":"錯誤。氫數正確，但漏掉一個O。"},{"id":"C","text":"C₂H₈O₂","explanation":"錯誤。氫共4＋2＝6個，不是8個。"},{"id":"D","text":"C₂H₆O₂","explanation":"正確。合計C₂H₆O₂。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S027","stem":"一個完整分子模型中，白球代表H、紅球代表O。模型有2白球與1紅球，對應何種分子式？","concept":"讀模型時先依圖例辨認元素，再分別計數。2顆白球代表2個氫原子，1顆紅球代表1個氧原子，因此組成為H₂O。球的顏色是表示原子種類的符號，不是實際物質的顏色。題目已說模型完整，因此這些計數涵蓋整個分子。","correct":"A","options":[{"id":"A","text":"H₂O","explanation":"正確。2H和1O寫成H₂O。"},{"id":"B","text":"HO₂","explanation":"錯誤。它表示1H、2O，將個數對調。"},{"id":"C","text":"H₂O₂","explanation":"錯誤。它需要2顆紅球，與模型不符。"},{"id":"D","text":"O₃","explanation":"錯誤。3球不代表全部都是氧，仍須讀圖例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S028","stem":"模型約定黑球是C、紅球是O，某分子由1黑球與2紅球組成。哪一項判斷正確？","concept":"模型的球數與球所代表的元素種類要分開計數。1黑球是1C，2紅球是2O，因此總數是3個原子，但只有碳、氧2種元素。題目已指明它們組成一個分子，不能把兩種顏色當成兩個分子。模型可同時提供組成與分子分組資訊。","correct":"C","options":[{"id":"A","text":"含3種元素","explanation":"錯誤。球有3個，但顏色對應的元素只有2種。"},{"id":"B","text":"只含1個原子","explanation":"錯誤。一個分子不等於一個原子。"},{"id":"C","text":"含2種元素，共3個原子","explanation":"正確。元素為C、O，原子總數為1＋2。"},{"id":"D","text":"含2個分子，共3種元素","explanation":"錯誤。題目是一個分子，元素種類也不是3種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S029","stem":"使用彩色球分子模型時，球的顏色主要用來表示什麼？","concept":"彩色球模型是把微觀粒子轉成易讀表示法的工具。依圖例，不同顏色可代表氫、碳或氧等元素，使讀者能分辨原子種類並計數。顏色本身並非測量原子溫度或樣品外觀的結果；要知道液體實際顏色，仍需觀察物質。讀模型的關鍵是使用題目提供的圖例。","correct":"B","options":[{"id":"A","text":"樣品加熱後的顏色","explanation":"錯誤。模型球色並未表示加熱後的外觀。"},{"id":"B","text":"原子所屬元素的種類","explanation":"正確。球色透過圖例區分元素。"},{"id":"C","text":"每種原子的實際溫度","explanation":"錯誤。未提供溫度色階，球色不是原子溫度。"},{"id":"D","text":"液體肉眼可見的顏色","explanation":"錯誤。樣品顏色與模型的元素色碼是不同資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S030","stem":"白、黑、紅球分別表示H、C、O。要表示一個乙醇分子C₂H₆O，應使用哪一組球數？","concept":"模型要忠實表達分子式，必須先把每個符號轉成圖例中的顏色。C₂需要2黑球、H₆需要6白球、O需要1紅球，合計9球。這項翻譯不會改變原子數，只是把文字符號換成模型表示。數量正確後仍須依結構資料連接，不能單靠球數決定所有連線。","correct":"D","options":[{"id":"A","text":"白2、黑6、紅1","explanation":"錯誤。把碳與氫的個數對調。"},{"id":"B","text":"白6、黑1、紅2","explanation":"錯誤。黑球與紅球個數不符合C₂及O₁。"},{"id":"C","text":"白6、黑2、紅2","explanation":"錯誤。多出一個氧球，組成會變成C₂H₆O₂。"},{"id":"D","text":"白6、黑2、紅1","explanation":"正確。6H、2C、1O與乙醇分子式一致。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S031","stem":"模型表示一個氧氣分子O₂時，若每球代表一個原子，應採哪種方式？","concept":"氧分子O₂由兩個氧原子結合而成。在每球代表一個原子的模型中，需有兩個代表O的球，並表示它們同屬一個分子。這與「兩個分子」或「兩種元素」不同。模型的單位由圖例決定；本題已限定球代表原子，不能臨時改成一球代表整個分子。","correct":"C","options":[{"id":"A","text":"一個O球","explanation":"錯誤。一球只表示一個氧原子。"},{"id":"B","text":"兩個不同元素的球相連","explanation":"錯誤。O₂中的兩個原子都屬氧元素。"},{"id":"C","text":"兩個代表O的球相連","explanation":"正確。兩個O原子結合成一個O₂分子。"},{"id":"D","text":"兩個各代表完整O₂分子的球相連","explanation":"錯誤。與題目一球代表一原子的約定不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S032","stem":"兩幅完整分子模型球數相同，但一幅含H、O，另一幅含C、O。下列何者可確定？","concept":"總球數相同只表示所表示的總原子數相同。組成還包括原子種類；H、O與C、O兩組元素清單不同，所以兩分子的組成不同。例如H₂O與CO₂每分子都共有3個原子，卻不是相同組成。性質也不能只由總球數相等推斷相同。","correct":"A","options":[{"id":"A","text":"兩分子的組成不同","explanation":"正確。氫與碳的差異已使元素組成不同。"},{"id":"B","text":"兩分子的分子式相同","explanation":"錯誤。不同元素清單不能有相同分子式。"},{"id":"C","text":"兩分子的密度相同","explanation":"錯誤。密度需要性質資料，總球數相同不足以判斷。"},{"id":"D","text":"兩分子的原子種類相同","explanation":"錯誤。共同含氧，但另一元素分別為氫與碳。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S033","stem":"某模型以球的種類與連線表示一個分子，沒有提供性質測量資料。哪項資訊最能由模型直接讀取？","concept":"分子模型主要表示原子種類與排列；連線若按圖例代表連接，就能提供哪些原子相連的結構資訊。沸點、密度及燃燒表現是物質性質，不能把圖上的球數或連線直接當成測量值。模型有助理解或推測性質，但題目沒有提供額外關係，不能讀出精確物性。","correct":"B","options":[{"id":"A","text":"樣品的精確沸點","explanation":"錯誤。模型未給沸點測值或換算關係。"},{"id":"B","text":"哪些原子彼此相連","explanation":"正確。連線可依圖例表達直接連接。"},{"id":"C","text":"樣品的精確密度","explanation":"錯誤。沒有質量與體積資料。"},{"id":"D","text":"可燃性的定量大小","explanation":"錯誤。沒有燃燒測量資料，不能直接定量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S034","stem":"模型圖例明示紅球代表O。某分子有3個紅球，最直接的意義為何？","concept":"同一圖例中的同色球代表同一元素，每球則代表一個原子。3個紅球因此表示3個氧原子，而不是3種元素或3個分子。這只是一部分組成資訊；如果模型還有其他顏色，需另加那些原子。球的色碼也不能用來判斷樣品真正的顏色。","correct":"D","options":[{"id":"A","text":"分子含3種元素","explanation":"錯誤。3個O仍只是一種元素。"},{"id":"B","text":"樣品共有3個分子","explanation":"錯誤。球是原子單位，不是分子單位。"},{"id":"C","text":"樣品必呈紅色","explanation":"錯誤。紅色是氧的圖例色碼，非樣品顏色。"},{"id":"D","text":"這個分子含3個氧原子","explanation":"正確。依每球一原子與紅球為O的約定直接得到。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S035","stem":"乙醇為C₂H₆O，乙二醇為C₂H₆O₂。各取一個分子比較，哪種原子的個數不同？","concept":"比較兩個分子的組成，應把相同元素的下標逐一配對。乙醇和乙二醇的碳都是2，氫都是6，只有氧分別為1與2。兩者共享三種元素，但不能說組成完全相同。這個差別以每一個分子為基準，不能直接延伸為等質量或等體積樣品的氧總數比較。","correct":"C","options":[{"id":"A","text":"碳","explanation":"錯誤。兩者每分子的碳都是2個。"},{"id":"B","text":"氫","explanation":"錯誤。兩者每分子的氫都是6個。"},{"id":"C","text":"氧","explanation":"正確。氧的個數分別為1與2。"},{"id":"D","text":"碳與氫","explanation":"錯誤。碳和氫的個數均相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S036","stem":"乙醇與乙二醇都含碳、氫、氧，卻具有不同的生物作用。這最能說明何者？","concept":"元素清單只能提供組成的一部分。還需要知道各元素有多少原子，以及原子如何連接，才能進一步理解物質性質。乙醇與乙二醇的氧數與結構不同，生物作用也不同，因此不能因都含C、H、O就當成可互換的液體。本題不需記藥理機制，重點是避免從共有元素過度推論。","correct":"A","options":[{"id":"A","text":"元素種類相同，不足以決定物質的生物作用相同","explanation":"正確。相同元素清單沒有排除數量與結構差異。"},{"id":"B","text":"含有氧原子的物質必有相同毒性","explanation":"錯誤。含氧不是毒性相同的充分條件。"},{"id":"C","text":"分子中的氫原子不會影響組成","explanation":"錯誤。氫的種類與個數也是組成資訊。"},{"id":"D","text":"分子外觀相似即可作相同用途","explanation":"錯誤。相近模型不保證性質或用途相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S037","stem":"下列哪組分子式與名稱配對正確？","concept":"本節比較的乙醇分子含2C、6H、1O；乙二醇含2C、6H、2O。因此正確分子式分別為C₂H₆O與C₂H₆O₂。判斷時同時核對碳、氫與氧，不應只看到名稱中多一個「二」就把所有下標加倍。兩者的共同元素與不同氧數是這組例子的重點。","correct":"B","options":[{"id":"A","text":"乙醇C₂H₆O₂；乙二醇C₂H₆O","explanation":"錯誤。兩者的分子式對調了。"},{"id":"B","text":"乙醇C₂H₆O；乙二醇C₂H₆O₂","explanation":"正確。碳氫個數相同，乙二醇比乙醇每分子多1O。"},{"id":"C","text":"乙醇CH₄O；乙二醇C₂H₆O₂","explanation":"錯誤。乙醇的碳應為2、氫應為6。"},{"id":"D","text":"乙醇C₂H₆O；乙二醇C₂H₄O₂","explanation":"錯誤。乙二醇的氫應有6個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S038","stem":"乙醇的縮寫結構式CH₃CH₂OH，與乙二醇HOCH₂CH₂OH相比，哪項敘述正確？","concept":"縮寫結構式不只列總數，也提示原子分組與連接。乙醇末端OH表示一處氧與氫相連；乙二醇左端HO及右端OH各有一處O—H，共兩處。OH由氧與氫兩種元素構成，並非新的元素符號。兩個CH₂仍含與碳相連的氫，不能因兩端有OH而忽略。","correct":"D","options":[{"id":"A","text":"乙二醇完全不含與碳連接的氫","explanation":"錯誤。兩個CH₂仍共有4個寫在碳旁的氫。"},{"id":"B","text":"乙醇含兩個氧，乙二醇含一個氧","explanation":"錯誤。實際是乙醇1O、乙二醇2O。"},{"id":"C","text":"兩者式子中的OH是另一種元素符號","explanation":"錯誤。OH是O與H的組合，不是一種元素。"},{"id":"D","text":"乙二醇的兩端都有O—H，乙醇只有一處O—H","explanation":"正確。依縮寫式可逐端找到O—H。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S039","stem":"某同學只根據乙醇與乙二醇都有2個碳，便認為兩者可互相替代。其判斷缺少哪一項關鍵比較？","concept":"一個元素的原子數相同，只是局部組成相同。乙醇和乙二醇雖都有2C，卻有不同氧數及連接結構，並有不同用途與生物作用。要判斷是否可替代，需把完整組成、結構和相關性質一起比較。相同取樣量或相近名稱都不能補足這些化學資料。","correct":"A","options":[{"id":"A","text":"其他原子的數目、連接與實際性質","explanation":"正確。只核對碳數遺漏了其他組成與結構差別。"},{"id":"B","text":"液體容器是否裝相同體積","explanation":"錯誤。同體積不代表物質的組成或性質相同。"},{"id":"C","text":"兩者所含元素的種類數是否相同","explanation":"錯誤。兩者元素種類數已同為三種，仍須補查各元素原子數與連接。"},{"id":"D","text":"每份樣品是否恰有2個分子","explanation":"錯誤。分子數相同也無法使不同物質變得可互換。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S040","stem":"已知乙醇是酒類中的酒精，乙二醇常用於汽車防凍液且高度有毒。若要用微觀觀點解釋兩者的差異，應優先比較什麼？","concept":"酒精或防凍液用途與毒性屬於巨觀性質及生物作用的描述。要用原子分子觀點尋找原因，應比較每分子的原子種類、數量與連接。乙醇和乙二醇共享C、H、O，氧數和結構卻不同。這支持由微觀資訊理解性質差異，但不表示單靠氧數便能預測任何物質的毒性。","correct":"B","options":[{"id":"A","text":"相同體積樣品的總質量","explanation":"錯誤。整份樣品的質量是巨觀資料，尚未描述分子內部。"},{"id":"B","text":"分子的組成與結構","explanation":"正確。組成及結構是本題要追查的微觀資訊。"},{"id":"C","text":"兩種液體的密度測量結果","explanation":"錯誤。密度是巨觀性質，並非分子的組成及連接資訊。"},{"id":"D","text":"兩種液體是否看起來相近","explanation":"錯誤。外觀比較仍是巨觀層次，未解釋微觀原因。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S041","stem":"化學家以既有物質為起點，製得性質不同的新分子。哪一項最符合這個過程的原子分子觀點？","concept":"製造不同分子需要在原子種類、數目或連接排列上發生實質改變。化學家可藉控制組成及結構，得到性質不同的新物質；教材以天然產物改良為例。分裝、增加樣品量或放大模型都不必改變單個分子的組成與結構，因此不能單憑那些動作宣稱製得新分子。","correct":"C","options":[{"id":"A","text":"只把相同樣品分裝到不同容器","explanation":"錯誤。分裝不必改變分子身分。"},{"id":"B","text":"只增加同一種分子的取用量","explanation":"錯誤。增加取用量只增加分子數，不是改變每個分子。"},{"id":"C","text":"有控制地改變分子的組成或結構","explanation":"正確。組成或結構的改變能形成不同分子。"},{"id":"D","text":"只把同一分子模型放大","explanation":"錯誤。放大圖像不等於改造實際分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S042","stem":"阿斯匹靈C₉H₈O₄與乙醇C₂H₆O各取一個分子。哪個分子含碳較多，且有幾個碳？","concept":"比較碳原子數時應只讀C的下標。阿斯匹靈的C₉表示9個碳，乙醇的C₂表示2個碳，因此阿斯匹靈碳較多。阿斯匹靈的全部原子數是21，乙醇的全部原子數是9，但這些都不是碳數。分子式可以直接完成比較，不需要查看原書的球模型。","correct":"A","options":[{"id":"A","text":"阿斯匹靈，9個","explanation":"正確。阿斯匹靈每分子9C，大於乙醇的2C。"},{"id":"B","text":"阿斯匹靈，21個","explanation":"錯誤。21是阿斯匹靈全部原子的總數。"},{"id":"C","text":"乙醇，6個","explanation":"錯誤。乙醇的6是氫數，而且碳只有2個。"},{"id":"D","text":"乙醇，9個","explanation":"錯誤。乙醇的9是全部原子數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S043","stem":"教材以阿斯匹靈說明改良天然產物可得到不同性質的物質。下列哪項理解正確？","concept":"化學家研究物質的組成與結構，是為了理解並嘗試調整性質。從天然產物出發改變分子，可得到具有不同特徵的新物質；來源相近不等於分子相同。這個概念不保證每次改變都更好，更不保證所有性質同時改善，是否達成目標仍要根據相關性質的研究結果。","correct":"B","options":[{"id":"A","text":"來自相同天然來源的分子必有相同結構","explanation":"錯誤。同一來源不保證所有產物連接結構相同。"},{"id":"B","text":"改變組成或結構，可作為調整物質性質的方法","explanation":"正確。組成與結構可作為改變性質的途徑。"},{"id":"C","text":"天然來源足以決定所有分子的性質","explanation":"錯誤。來源不能取代分子組成與結構資訊。"},{"id":"D","text":"分子一經合成，所有性質必同時改善","explanation":"錯誤。合成不保證每項性質都朝希望的方向改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S044","stem":"下列哪一項主要描述巨觀層次的現象？","concept":"巨觀層次描述普通尺度可觀察或量測的物質現象，例如杯中液體沸騰。微觀層次則描述原子、分子的組成、排列及行為。雖然兩層互相關聯，直接觀察到沸騰並不等於用肉眼看見每個水分子。學習化學要能將觀察連到粒子原因，並用符號表達。","correct":"D","options":[{"id":"A","text":"一個水分子含2H與1O","explanation":"錯誤。這是單一分子的微觀組成。"},{"id":"B","text":"氧原子與兩個氫原子相連","explanation":"錯誤。這是原子連接的微觀結構。"},{"id":"C","text":"水分子之間的平均距離改變","explanation":"錯誤。分子間距屬微觀粒子描述。"},{"id":"D","text":"杯中的水受熱後沸騰","explanation":"正確。杯中水沸騰是普通尺度的物質現象。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S045","stem":"下列哪一項是在描述水的微觀行為？","concept":"微觀層次關注原子與分子的行為。水汽化時，描述水分子彼此距離改變是在微觀層次解釋現象；量得一份水的體積或觀察沸騰則屬巨觀資料。紙上的化學式和箭頭是符號表示，用來表達同一變化。判斷時要看敘述的對象，而不是句子有沒有數字。","correct":"A","options":[{"id":"A","text":"水分子在汽化時彼此距離增大","explanation":"正確。它直接描述分子的間距變化。"},{"id":"B","text":"液體水的體積測量值為20 mL","explanation":"錯誤。20 mL是整份樣品的巨觀體積。"},{"id":"C","text":"紙上寫有H₂O(l)→H₂O(g)","explanation":"錯誤。紙上的式子是符號表示。"},{"id":"D","text":"觀察到液體水正在沸騰","explanation":"錯誤。沸騰觀察屬於巨觀現象。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S046","stem":"化學式H₂O屬於哪種表達方式？","concept":"H₂O利用元素符號與下標表示每個水分子含2H、1O，是符號層次的化學語言。它所指向的是微觀組成，但寫在紙上的式子本身仍是表示法，並不是分子的真實照片。它也沒有給出密度或樣品外觀。符號、所代表的粒子及實際樣品應連結理解，但不混成同一種資料。","correct":"C","options":[{"id":"A","text":"杯中水的巨觀外觀","explanation":"錯誤。化學式沒有描述杯中水的外觀。"},{"id":"B","text":"單一水分子的實際照片","explanation":"錯誤。式子是文字表示，不是影像拍攝。"},{"id":"C","text":"表示水分子組成的符號","explanation":"正確。元素符號和下標表達單分子組成。"},{"id":"D","text":"水的密度測量結果","explanation":"錯誤。密度需要質量和體積，H₂O沒有那些數值。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S047","stem":"水沸騰時，下列何者同時符合微觀描述與符號H2O(l)→H2O(g)？","concept":"判讀物態符號時，先核對箭頭兩側的分子式：兩側都是H2O，因此描述的分子組成相同；l與g分別表示液態與氣態。本節的微觀說明著重完整分子彼此的間距及分布，不能把物態變化當作分解、新增分子，或主要發生在分子內部的原子分離。","correct":"B","options":[{"id":"A","text":"H2O分解成H2與O2，狀態符號記錄分解結果","explanation":"錯誤：若分解為H2與O2，右側的物質就不再是題示H2O(g)。"},{"id":"B","text":"水分子保持原組成，分子之間的平均距離改變","explanation":"正確：組成由兩側H2O保持，物態差異以分子間距與分布理解。"},{"id":"C","text":"每個分子仍為H2O，但相同一批水的分子總數必增加","explanation":"錯誤：同一批完整分子不會僅因物態改變而增加總數。"},{"id":"D","text":"每個分子仍有三個原子，主要改變是分子內的原子彼此遠離","explanation":"錯誤：應區分分子之間與分子內部；本例主要不是把每個水分子內的原子拉開。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S048","stem":"H₂O(l)與H₂O(g)的符號中，l與g主要指出哪項差異？","concept":"化學式H₂O指出分子組成，括號內的狀態標記提供另一項資訊：l代表液態，g代表氣態。兩個式子的元素符號及下標相同，因此每分子仍為2H、1O。狀態改變不應靠改動分子式的原子數來表示，這是巨觀狀態與微觀組成之間的重要區別。","correct":"D","options":[{"id":"A","text":"氫原子的種類","explanation":"錯誤。狀態標記不改變氫元素種類。"},{"id":"B","text":"氧原子的個數","explanation":"錯誤。兩式的氧都為1個。"},{"id":"C","text":"每個分子的原子總數","explanation":"錯誤。每分子都共3個原子。"},{"id":"D","text":"物質所處的狀態","explanation":"正確。l與g分別表示液態與氣態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S049","stem":"『液體黏性不同，可能與分子的組成及排列不同有關。』這句話由前半到後半，依序連結哪兩類資訊？","concept":"黏性描述整份液體流動時的表現，屬於巨觀物質性質；分子由哪些原子構成、原子如何排列，屬於微觀的組成與結構。題目把前者連到後者，嘗試從分子資訊理解性質差異。這裡的排列指原子或分子的實際關係，並不是化學式中文字的書寫順序；『可能』也表示尚需資料驗證原因。","correct":"A","options":[{"id":"A","text":"巨觀物質性質；微觀組成與結構","explanation":"正確：先描述液體的巨觀黏性，再提出分子組成與結構的微觀解釋。"},{"id":"B","text":"巨觀物質性質；分子式中文字的排列順序","explanation":"錯誤：後半的排列是物質的微觀結構，不是字母或文字在分子式中的順序。"},{"id":"C","text":"微觀原子性質；巨觀樣品的排列方式","explanation":"錯誤：液體黏性不是單一原子的性質；後半也不是在說整份樣品如何擺放。"},{"id":"D","text":"化學符號表示；微觀分子的移動行為","explanation":"錯誤：前半是性質敘述而非化學式符號；後半重點是組成與排列，沒有描述移動行為。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-S050","stem":"對同一份水，甲觀察杯中液體的外觀，乙描述一個水分子由兩氫一氧組成，丙寫下H2O。甲、乙、丙主要對應的層次依序為何？","concept":"判斷層次要看每段敘述實際處理的對象。甲直接觀察普通尺度的液體，是巨觀資料；乙說明單一分子的原子組成，是微觀描述；丙使用元素符號及下標表達組成，是符號表示。乙與丙可以傳達相關資訊，但描述微觀對象與使用化學式表達，是此題要區別的兩種層次。","correct":"B","options":[{"id":"A","text":"巨觀、符號、微觀","explanation":"錯誤：甲的分類正確，但乙描述分子組成，丙才是化學符號，後兩者顛倒。"},{"id":"B","text":"巨觀、微觀、符號","explanation":"正確：樣品外觀、單分子組成、化學式依序對應巨觀、微觀、符號。"},{"id":"C","text":"微觀、巨觀、符號","explanation":"錯誤：杯中外觀是巨觀，單分子的原子組成是微觀，前兩者顛倒。"},{"id":"D","text":"符號、微觀、巨觀","explanation":"錯誤：甲沒有書寫化學式，丙也沒有提供直接觀察樣品的資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-1-topic01-G03-B001","stem":"某液體在指定溫度下，15 mL的質量為18 g。依密度＝質量÷體積，其密度為何？","concept":"密度表示單位體積的質量，計算時將樣品質量除以同一份樣品的體積。代入18 g÷15 mL＝1.2 g/mL，表示每1 mL該液體有1.2 g質量。反算1.2×15＝18 g可核對。將體積除質量會得到另一種單位，不能標成密度；也不能用質量乘體積。","correct":"B","options":[{"id":"A","text":"0.83 g/mL","explanation":"錯誤。15÷18約0.83是體積除質量，單位應為mL/g。"},{"id":"B","text":"1.2 g/mL","explanation":"正確。18÷15＝1.2 g/mL。"},{"id":"C","text":"3.0 g/mL","explanation":"錯誤。18與15相減不構成密度。"},{"id":"D","text":"270 g/mL","explanation":"錯誤。270來自相乘，並非單位體積的質量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B002","stem":"同溫下某液體25 mL的質量是20 g。若取同種液體40 mL，密度保持相同，質量應為何？","concept":"先由已知樣品得到密度20÷25＝0.80 g/mL，再以質量＝密度×體積計算40 mL的質量，得0.80×40＝32 g。密度保持相同，不代表每份樣品質量相同；體積放大為40/25＝1.6倍，質量也放大為1.6倍。這是同種液體在題設相同條件下的基本比例。","correct":"D","options":[{"id":"A","text":"20 g","explanation":"錯誤。體積增加，質量不會仍停在原25 mL的20 g。"},{"id":"B","text":"25 g","explanation":"錯誤。25是原體積的數值，不能直接當新質量。"},{"id":"C","text":"50 g","explanation":"錯誤。用40÷0.80會把質量公式倒用。"},{"id":"D","text":"32 g","explanation":"正確。0.80 g/mL×40 mL＝32 g。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B003","stem":"甲、乙液體各18 g，在同溫下體積分別15 mL與20 mL。甲的密度是乙的幾倍？","concept":"密度是質量除以體積。甲為18/15＝1.2 g/mL，乙為18/20＝0.9 g/mL，密度比為1.2/0.9＝4/3。也可因質量相同，直接用乙體積除甲體積20/15。等質量時占的體積越小，單位體積的質量越大；不能把體積比當成同方向的密度比。","correct":"A","options":[{"id":"A","text":"4/3倍","explanation":"正確。密度比為20/15＝4/3。"},{"id":"B","text":"3/4倍","explanation":"錯誤。3/4是甲對乙的體積比，方向相反。"},{"id":"C","text":"1倍","explanation":"錯誤。質量相同但體積不同，密度不相同。"},{"id":"D","text":"5倍","explanation":"錯誤。5是兩體積數值相差，不是密度倍數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B004","stem":"同溫下甲液體12 mL重9.6 g，乙液體30 mL重24 g。僅根據這些資料，何者正確？","concept":"分別計算兩液體密度：甲9.6/12＝0.80 g/mL，乙24/30＝0.80 g/mL，所以這項性質相同。總質量與總體積較大可能只是取樣較多。另一方面，單一性質相同並不一定能唯一識別物質；未提供分子資訊時，不能保證兩者的組成與結構相同。","correct":"C","options":[{"id":"A","text":"甲的密度較低，因為質量較小","explanation":"錯誤。要比較質量與體積之比，不能只比較總質量。"},{"id":"B","text":"乙的密度較高，因為體積較大","explanation":"錯誤。體積較大不表示密度較高。"},{"id":"C","text":"兩者密度相同，但尚不能保證分子組成與結構相同","explanation":"正確。兩比值均0.80，但缺少分子身分的證據。"},{"id":"D","text":"兩者密度相同，所以必為同一物質","explanation":"錯誤。把一項性質相同過度推成物質完全相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B005","stem":"一個剛性容器抽去部分空氣後重新密閉，總質量由52.8 g降為52.2 g。容器本身的質量、形狀及體積均未改變，且只有空氣被移出。下列推論何者正確？","concept":"在容器本身不變且只有空氣移出的條件下，前後總質量差可歸於移出的空氣：52.8−52.2=0.6 g。空氣原先占據容器內的空間，並具有可量得的質量，因此符合物質的基本判準。容器尺寸不變不代表其中物質的量不變；若要求移出氣體的密度，還需要對應體積及條件，不能只用質量差。","correct":"B","options":[{"id":"A","text":"移出的空氣不具有質量，差值只表示容器內的空間變少","explanation":"錯誤：公克的差值是質量資料，不是空間大小；題設只有空氣移出，故差值正說明空氣具有質量。"},{"id":"B","text":"移出的空氣質量為0.6 g；它原先占有空間，也屬於物質","explanation":"正確：52.8−52.2=0.6 g，且空氣有質量、占空間，符合物質定義。"},{"id":"C","text":"移出的空氣密度為0.6 g/mL，可直接由總質量差求得","explanation":"錯誤：密度是質量除以體積；沒有相應的氣體體積資料，不能直接把0.6 g改寫成0.6 g/mL。"},{"id":"D","text":"容器外部體積未改變，因此抽氣前後總質量理應相同","explanation":"錯誤：固定的容器體積仍可裝入或移出不同量的物質，不能因此要求總質量固定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B006","stem":"某液體密度在題設條件下為1.20 g/mL，取其36.0 g，體積為何？","concept":"密度ρ＝m/V，求體積時改寫為V＝m/ρ。代入36.0 g÷1.20 g/mL＝30.0 mL，公克相消後留下mL。再以30.0×1.20＝36.0 g確認一致。密度大於1 g/mL時，同樣質量所需的mL數小於質量的g數，結果也符合這個方向。","correct":"C","options":[{"id":"A","text":"43.2 mL","explanation":"錯誤。43.2來自質量乘密度，並非體積。"},{"id":"B","text":"0.0333 mL","explanation":"錯誤。1.20÷36.0將比值倒置，單位也不對。"},{"id":"C","text":"30.0 mL","explanation":"正確。36.0÷1.20＝30.0 mL。"},{"id":"D","text":"36.0 mL","explanation":"錯誤。質量與體積數值相同需密度1 g/mL，題設不是。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B007","stem":"甲、乙各取20 g，同溫下甲密度2.0 g/mL、乙密度1.0 g/mL。甲、乙的體積分別為何？","concept":"由V＝m/ρ，甲的體積為20/2.0＝10 mL，乙為20/1.0＝20 mL。兩份質量一樣，較高密度的甲每1 mL含較多質量，因此需要較少體積。密度不是總質量的別名；比較時必須同時考慮質量與體積，不能用密度乘質量求體積。","correct":"A","options":[{"id":"A","text":"10 mL、20 mL","explanation":"正確。兩份各以質量除各自密度。"},{"id":"B","text":"20 mL、10 mL","explanation":"錯誤。密度較高的甲應占較小體積，這組顛倒。"},{"id":"C","text":"40 mL、20 mL","explanation":"錯誤。甲的40來自20×2，公式用反。"},{"id":"D","text":"10 mL、10 mL","explanation":"錯誤。乙密度只有甲一半，同質量需兩倍體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B008","stem":"在相同條件下，甲與乙各10 mL、質量都8 g，但甲易燃、乙不易燃。下列比較何者完整？","concept":"由兩份樣品的8 g與10 mL，都算出密度0.8 g/mL；題目另外給出可燃性不同。物質可以在一項性質上相同、在另一項上不同，不能把密度一致當成全部性質一致。分子的組成與結構仍須另外檢查，這些資料沒有給出它們完全相同的結論。","correct":"D","options":[{"id":"A","text":"密度與可燃性都相同","explanation":"錯誤。題設已明確指出可燃性不同。"},{"id":"B","text":"密度不同，但可燃性相同","explanation":"錯誤。8/10的比值相同，可燃性反而不同。"},{"id":"C","text":"密度相同，因此分子結構也相同","explanation":"錯誤。一項物性一致不能保證結構相同。"},{"id":"D","text":"密度都是0.8 g/mL，但可燃性不同","explanation":"正確。密度計算與可燃性資料都被保留。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文1–2/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B009","stem":"某粒子示意包含4個O₂分子和2個H₂O分子。整體含有幾種元素、多少個原子？","concept":"先看不同元素符號：O₂含O，H₂O含H與O，合起來只有H、O兩種，重複的O不另算新種類。再算原子，4O₂提供8O，2H₂O提供4H與2O，總數8＋4＋2＝14。分子數為6，與原子數14不同。這種分步計數可避免把分子種類或分子個數當元素種類。","correct":"A","options":[{"id":"A","text":"2種、14個","explanation":"正確。H、O兩種，原子4×2＋2×3＝14。"},{"id":"B","text":"3種、14個","explanation":"錯誤。兩式共有的氧不能重複算成新元素。"},{"id":"C","text":"2種、6個","explanation":"錯誤。6是分子總數，不是原子總數。"},{"id":"D","text":"6種、14個","explanation":"錯誤。6個分子不表示6種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B010","stem":"甲有3個CO₂分子，乙有2個乙醇C₂H₆O分子。甲有而乙沒有的元素種類數為何？","concept":"甲的元素清單是C、O；乙的清單是C、H、O。甲的碳與氧都已在乙的清單中，因此甲沒有任何乙所缺少的元素種類，答案0種。分子數3與2只影響各原子的總個數，不會增加新的元素種類。若反過來問乙有而甲沒有，才是H一種。","correct":"D","options":[{"id":"A","text":"1種","explanation":"錯誤。H是乙有而甲沒有，方向相反。"},{"id":"B","text":"2種","explanation":"錯誤。甲的兩種元素都同時存在於乙。"},{"id":"C","text":"3種","explanation":"錯誤。3是甲的分子數，非差異元素種類數。"},{"id":"D","text":"0種","explanation":"正確。甲的C與O全部包含於乙的元素清單。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B011","stem":"甲組含2個H₂O與1個CO₂；乙組含1個乙醇C₂H₆O。比較兩組元素種類與氫原子總數，何者正確？","concept":"甲組由H₂O及CO₂共同提供H、C、O三種元素；乙醇也包含同樣三種。甲的氫只來自兩個水分子，共2×2＝4H；乙一個乙醇有6H，所以乙多2H。元素種類相同不保證各原子總數相同，必須分別列種類清單及計算個數。","correct":"B","options":[{"id":"A","text":"種類不同；氫一樣多","explanation":"錯誤。兩組都含C、H、O，氫也不是相同數。"},{"id":"B","text":"種類相同；乙比甲多2H","explanation":"正確。種類均三種，氫分別4與6。"},{"id":"C","text":"種類相同；甲比乙多2H","explanation":"錯誤。氫多2個的是乙，非甲。"},{"id":"D","text":"種類不同；乙比甲多2H","explanation":"錯誤。氫差正確，但元素清單其實相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B012","stem":"甲僅含2個O₂，乙僅含1個CO₂。對氧元素的種類與氧原子個數，下列何者正確？","concept":"「一種氧元素」與「幾個氧原子」必須區分。甲有2×2＝4O，乙有1×2＝2O，氧原子數比為2：1；但兩組的氧都屬同一種氧元素。乙雖還有碳，這不會把其中的氧轉成新的元素。比較元素種類與個數時應各用自己的基準。","correct":"C","options":[{"id":"A","text":"甲的氧元素種類是乙的兩倍","explanation":"錯誤。原子數加倍不會使氧元素種類加倍。"},{"id":"B","text":"兩組氧原子個數相同","explanation":"錯誤。甲4O、乙2O。"},{"id":"C","text":"兩組都只有一種氧元素，甲的氧原子數是乙的兩倍","explanation":"正確。同種氧元素，原子個數為4與2。"},{"id":"D","text":"乙的氧原子因與碳結合，應另算一種氧元素","explanation":"錯誤。與碳連接仍是氧原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B013","stem":"甲組有2個CH4分子，乙組有3個H2O分子。合看兩組的元素種類數，以及甲組獨有元素在甲組中的原子總數，依序為何？","concept":"先把元素名稱合併：甲含C與H，乙含H與O，合起來是C、H、O三種，不能把兩組共同的H重複計為兩種。再找甲有而乙沒有的元素，只有C；每個CH4有一個C，兩個分子共兩個C。元素種類用名稱去重，原子個數則要乘分子數，兩種計數步驟不同。","correct":"D","options":[{"id":"A","text":"4種；2個","explanation":"錯誤：共同的H不能重複算成兩種元素，因此不是四種。"},{"id":"B","text":"3種；8個","explanation":"錯誤：八個是甲的氫原子數，但H也存在於乙，不是所問獨有元素。"},{"id":"C","text":"2種；6個","explanation":"錯誤：合計有C、H、O三種，六個又是乙的氫數。"},{"id":"D","text":"3種；2個","explanation":"正確：元素聯合為三種，甲獨有的C共有2×1＝2個原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B014","stem":"甲分子O₂與乙分子H₂O各取5個。下列哪組比較正確？","concept":"甲和乙都取5個分子，所以分子數相同。甲只有O一種元素，5O₂共10個原子；乙含H與O兩種，5H₂O共15個原子。因此乙的種類及原子總數較多。不同的計數結果來自每分子組成不同，而不是多取了分子，也不是氧變成了兩種。","correct":"A","options":[{"id":"A","text":"甲、乙分子數相同，乙的元素種類及原子總數都較多","explanation":"正確。5對5分子；種類1對2；原子10對15。"},{"id":"B","text":"甲、乙原子總數相同，元素種類不同","explanation":"錯誤。原子總數是10與15，並不相同。"},{"id":"C","text":"甲的元素種類較多，乙的分子數較多","explanation":"錯誤。種類較多的是乙，分子數則相同。"},{"id":"D","text":"乙的氧元素種類是甲的兩倍","explanation":"錯誤。氧始終是一種元素，不能因水中有兩種元素而加倍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47；部分1 PDF頁 49；已審筆記頁 正文3–4/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B015","stem":"已知甲為 CH3CH2OH，乙為 CH3OCH3。僅由這兩種寫法，哪個比較正確？","concept":"先分別清點原子，再觀察相鄰原子如何連接。甲的氫數為 3+2+1=6，乙為 3+3=6，因此兩者都是 C2H6O。甲的氧位在碳鏈末端並接氫，乙的氧連接兩個碳。這說明組成相同不保證結構相同；分子式回答『有什麼、多少個』，不能單獨代替連接資訊。","correct":"B","options":[{"id":"A","text":"甲比乙多一個氧原子","explanation":"錯誤：兩式中的 O 都省略下標，均為一個。"},{"id":"B","text":"兩者組成相同，但氧與碳的連接方式不同","explanation":"正確：碳、氫、氧數相同，但氧的相鄰原子不同。"},{"id":"C","text":"兩者必為同一種分子，因分子式相同","explanation":"錯誤：相同分子式只保證相同原子組成，未保證相同連接。"},{"id":"D","text":"乙含有較多種類的元素","explanation":"錯誤：兩者均只含碳、氫、氧三種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B016","stem":"一個分子的分析結果為2 C、6 H、1 O。下列哪項新增資料最能區分CH3CH2OH與CH3OCH3這兩個候選結構？","concept":"先展開兩個候選式：CH3CH2OH含2C、6H、1O，CH3OCH3也含2C、6H、1O。因此原子比例無法在這兩個候選中作區分。差異是氧的相鄰原子：前者的氧接C與H，後者接兩個C。此題需要把組成相同與連接不同一起運用，而不是用樣品量或重新計數已有比例來判斷結構。","correct":"C","options":[{"id":"A","text":"整份樣品含有多少個分子","explanation":"錯誤：整份樣品的分子數不指出單一分子的原子如何連接。"},{"id":"B","text":"氧原子占單分子全部原子的比例","explanation":"錯誤：兩者氧都占1/9，這個比例無法區分兩個候選。"},{"id":"C","text":"氧直接連接的是C與H，還是兩個C","explanation":"正確：氧的鄰接關係不同，可區分C—O—H與C—O—C。"},{"id":"D","text":"單分子中碳與氫原子數之比","explanation":"錯誤：兩者C：H都為2：6=1：3，組成比例仍相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B017","stem":"兩個分子各含 2 個碳及 6 個氫；甲有 1 個氧，乙有 2 個氧。下列推論何者成立？","concept":"組成不只列出元素種類，也包括各種原子的數量。甲、乙都含 C、H、O，卻分別是 C2H6O 與 C2H6O2；單一分子的原子總數也由 9 變成 10。比較時須逐項對照，而不是看到元素名稱相同就結束。組成的差異可伴隨性質差異，但不能據此算出具體物性數值。","correct":"A","options":[{"id":"A","text":"兩者元素種類相同，組成仍不同","explanation":"正確：種類皆為三種，氧的數量不同使組成不同。"},{"id":"B","text":"兩者只有結構不同，組成必相同","explanation":"錯誤：尚未比較結構前，氧數已顯示組成不同。"},{"id":"C","text":"兩者原子總數相同","explanation":"錯誤：甲 9 個、乙 10 個原子。"},{"id":"D","text":"兩者物性必相同","explanation":"錯誤：元素種類相同不足以保證物性相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B018","stem":"對 H2O 與 CO2 的單一分子進行比較，何者正確？","concept":"原子總數只是把各元素數目加總，會失去元素身分資訊。H2O 為 2 H、1 O，CO2 為 1 C、2 O，總數雖都為 3，組成卻不同。兩者的元素種類數恰好也相同，但『都是兩種』不等於『是相同的兩種』。應建立逐元素的清單再比較。","correct":"D","options":[{"id":"A","text":"因各有 3 個原子，兩者組成相同","explanation":"錯誤：相同總數不能抹去 H 與 C 的差異。"},{"id":"B","text":"因各有 2 種元素，兩者結構必相同","explanation":"錯誤：種類數相同不能推得原子連接相同。"},{"id":"C","text":"兩者皆含氧，因此氫原子數相同","explanation":"錯誤：水有 2 H，二氧化碳沒有 H。"},{"id":"D","text":"原子總數相同，但元素種類及各元素數目不同","explanation":"正確：總數皆 3；水含 H、O，二氧化碳含 C、O，氧數亦不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B019","stem":"兩種分子的元素種類與每種元素的原子數完全相同，但相同條件下測得某項物性不同。哪個結論有合理依據？","concept":"相同分子式表示每種元素的原子數相同，卻不唯一指定原子的連接或排列。因此兩物質有不同物性時，結構差異是值得進一步查證的可能原因。這並不是只憑一項物性就證明完整結構，也不能回頭否定題目已確認的組成相同。作推論時要同時保留已知數據與尚未確認的部分。","correct":"B","options":[{"id":"A","text":"相同分子式已排除結構差異，因此物性差異只能由樣品量造成","explanation":"錯誤：相同組成沒有排除不同結構；題目也沒有足夠資料把差異全部歸於樣品量。"},{"id":"B","text":"相同組成仍可能有不同連接或排列，應進一步比較結構","explanation":"正確：連接或排列可能不同，需補充結構證據來檢驗解釋。"},{"id":"C","text":"物性不同已足以證明兩者至少有一種元素不同","explanation":"錯誤：物性可因結構不同而有差別，不必伴隨元素種類改變。"},{"id":"D","text":"只要物性不同，兩者每分子的原子總數必定不同","explanation":"錯誤：題設各元素原子數完全相同，原子總數也相同，不能由物性差異推翻這項已知條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B020","stem":"甲的縮寫式為CH3CH2OH；乙只報告每分子2C、6H、1O，另指出氧直接連接兩個碳。下列比較何者有依據？","concept":"甲的CH3、CH2、OH合計為2C、6H、1O，且氧接一個碳和一個氫。乙的原子數與甲逐一相同，但題目另給氧接兩個碳，因此兩者在同一組成下有不同連接。氧的鄰接原子數不能誤當氧自己的數量；是否寫成OH也不能決定是否含H或O元素。","correct":"C","options":[{"id":"A","text":"兩者原子總數都為九個，因此連接方式相同","explanation":"錯誤：九個原子只固定總數，不能取消已知的氧連接差異。"},{"id":"B","text":"乙含兩個碳與氧相接，因此乙每分子必有兩個氧","explanation":"錯誤：一個氧可以連接兩個碳；連接對象有兩個不表示氧有兩個。"},{"id":"C","text":"兩者各元素原子數相同，但氧的連接對象不同","explanation":"正確：先加總甲的原子數，再比較氧接C/H與C/C，組成同而連接異。"},{"id":"D","text":"甲有OH而乙沒有OH，因此兩者元素種類不同","explanation":"錯誤：乙已明示含C、H、O，沒有OH的連接不等於缺少H或O元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B021","stem":"三種分子的縮寫式為甲CH3CH2OH、乙CH3OCH3、丙HOCH2CH2OH。若要比較『組成相同但連接不同』的兩個分子，應選哪一組？","concept":"組成相同要求各元素的種類及數量都相同，不能只比碳數或元素清單。甲與乙各為C2H6O，丙則為C2H6O2。再比較連接：甲的氧連C與H，乙的氧連兩個C。因此甲乙保留相同組成又有不同連接，符合指定的比較條件；丙多一個氧，會同時引入組成差異。","correct":"D","options":[{"id":"A","text":"甲與丙；每分子的碳氫數相同，氧相鄰的原子種類也相同","explanation":"錯誤：甲丙雖同為兩碳，氧數卻分別為一與二，組成不相同。"},{"id":"B","text":"乙與丙；元素種類相同，但氧相鄰的原子種類不同","explanation":"錯誤：共有三種元素不代表各元素原子數相同，乙丙氧數不同。"},{"id":"C","text":"三組皆可；三種分子的氫數相同，而縮寫式各不相同","explanation":"錯誤：只核對氫數六仍不完整，丙的氧數與甲乙不同。"},{"id":"D","text":"甲與乙；各元素原子數相同，但氧相鄰的原子種類不同","explanation":"正確：甲乙逐元素計數一致，氧鄰接卻為C/H與C/C，符合組成同、連接異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B022","stem":"已知 CH3CH2OH 與 HOCH2CH2OH 的連接寫法。下列哪項同時反映兩者差異？","concept":"先展開乙醇：CH3、CH2、OH 合計 C2H6O，有一個碳連接 OH。乙二醇的 HO、CH2、CH2、OH 合計 C2H6O2，兩個碳各連接一個 OH。兩者同為三種元素，碳與氫數相同，但氧數及相應連接不同；這正是不能只看『都有 C、H、O』的例子。","correct":"A","options":[{"id":"A","text":"氧原子數不同，且帶 OH 的碳原子數不同","explanation":"正確：氧數為 1 與 2，連 OH 的碳數亦為 1 與 2。"},{"id":"B","text":"碳原子數不同，但氫原子數相同","explanation":"錯誤：兩式碳數都為 2，並無碳數差異。"},{"id":"C","text":"元素種類不同，但氧原子數相同","explanation":"錯誤：元素種類相同，氧的數量才不同。"},{"id":"D","text":"原子總數相同，只有名稱不同","explanation":"錯誤：原子總數是 9 與 10，並非只換名稱。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B023","stem":"要檢驗『只要元素種類相同，物質性質就完全相同』，下列哪組資料可以直接作為反例？","concept":"反例必須同時滿足原說法的前提，並推翻其結論：這裡要找元素種類相同、性質卻不全相同的兩種物質。乙醇與乙二醇都含C、H、O，卻有不同生物作用與用途，因此符合。只比較原子總數、共同一種元素或同物質不同取樣量，沒有直接完成這個反證。","correct":"B","options":[{"id":"A","text":"H2O與CO2的原子總數相同，且性質不同","explanation":"錯誤：H2O與CO2並非元素種類相同，未符合被檢驗說法的前提。"},{"id":"B","text":"乙醇C2H6O與乙二醇C2H6O2的元素種類相同，但毒性及用途不同","explanation":"正確：同為C/H/O卻有性質差異，同時符合前提並否定結論。"},{"id":"C","text":"同一乙醇樣品在同溫分成10 mL與20 mL，兩份密度相同","explanation":"錯誤：兩份同物質密度相同不是性質不同的反例。"},{"id":"D","text":"H2O與O2都含氧，但每分子的元素種類不同","explanation":"錯誤：只有共同氧不等於元素種類集合相同，且此項也未給所需物性反例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B024","stem":"甲分子為C2H6O，乙分子為C2H6O2。比較元素種類及氧占各自全部原子的比例，何者正確？","concept":"元素種類看符號是否出現，甲乙都含C、H、O三種。氧的原子比例則需各用自己的總數作分母：甲共2+6+1=9個原子，氧占1/9；乙共2+6+2=10個，氧占2/10=1/5。多一個氧會同時改變氧數與原子總數，不能沿用甲的分母。","correct":"D","options":[{"id":"A","text":"元素種類相同；氧所占比例均為1/3","explanation":"錯誤：三種元素不表示每種元素的原子數各占三分之一。"},{"id":"B","text":"元素種類不同；氧所占比例分別為1/9與1/5","explanation":"錯誤：比例數值正確，但氧從一個變兩個沒有新增元素種類。"},{"id":"C","text":"元素種類相同；氧所占比例分別為1/9與2/9","explanation":"錯誤：乙的總原子數是十個，不能用甲的九個作分母。"},{"id":"D","text":"元素種類相同；氧所占比例分別為1/9與1/5","explanation":"正確：元素名稱相同，數量比例仍不同；分母分別為九與十。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B025","stem":"某分子只含C、H、O，共九個原子，其中有六個H及一個O。下列哪項推論成立？","concept":"由總數扣掉已知元素可補足組成：C=9−6−1=2，因此分子式為C2H6O。組成求出後仍要保留資訊界線：這個式子沒有交代氧連接哪些原子，不能單憑分子式確定就是乙醇的連接。計數時也要扣除氧，且不能把全部原子都當成碳。","correct":"A","options":[{"id":"A","text":"每分子有兩個C，但尚不能唯一確定原子連接","explanation":"正確：兩個碳由差額求得；原子數資訊仍不足唯一決定結構。"},{"id":"B","text":"每分子有三個C，因為總原子數扣除六個H後剩三個","explanation":"錯誤：九減六剩下的是碳與氧合計，還要扣掉一個氧。"},{"id":"C","text":"每分子有兩個C，因此已能確認連接必為CH3CH2OH","explanation":"錯誤：C2H6O還可能有不同連接，不能跳過結構資料直接確認乙醇。"},{"id":"D","text":"每分子有九個C，因為報告指出原子總數為九個","explanation":"錯誤：九個是所有元素的原子總數，已知其中七個屬H或O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B026","stem":"甲與乙單一分子皆有10個原子且都含三種元素。若要確認兩者是否有相同的分子組成，還需要哪項資料？","concept":"總原子數與元素種類數都相同，仍未保證組成相同：三種元素的身分可能不同，即使都是C、H、O，十個原子也可能有不同數量分配。必須逐一比對每種元素及其原子數，才能確認單分子的組成。密度是物性，樣品體積與分子總數描述整份樣品，這些都不能代替所缺的逐元素清單。","correct":"C","options":[{"id":"A","text":"兩份樣品的分子總數是否相同","explanation":"錯誤：相同分子總數只表示取樣的粒子量相同，不保證每個分子的組成。"},{"id":"B","text":"兩種物質在同溫下的密度是否相同","explanation":"錯誤：同一密度可能由不同物質共享，不能唯一確認分子組成。"},{"id":"C","text":"各分子的元素名稱及每種元素的原子數","explanation":"正確：元素身分與各自數目一一相同，才符合分子組成相同的要求。"},{"id":"D","text":"兩份樣品在同溫下所占的體積是否相同","explanation":"錯誤：相同樣品體積沒有直接給出單一分子中的原子種類及數量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B027","stem":"僅根據分子式C2H6O，下列哪項數量與結構判斷正確？","concept":"C2H6O提供2C、6H、1O，因此H：O=6：1。若求氫占全部原子的比例，分母為2+6+1=9，結果是6/9=2/3；若求氧占非氫原子的比例，分母是2C+1O=3，結果為1/3。這些都是組成計算，不能唯一給出氧的連接對象；C—O—H與C—O—C仍需結構資訊來區分。","correct":"B","options":[{"id":"A","text":"可確定氧一定直接連接兩個碳","explanation":"錯誤：相同C2H6O可有不同連接，分子式未指定氧必連兩個碳。"},{"id":"B","text":"H：O原子數比為6：1，但氧的連接對象仍未唯一確定","explanation":"正確：數量比直接由6H與1O得到，但組成式不是完整連接圖。"},{"id":"C","text":"氫原子占全部原子數的比例為3/4","explanation":"錯誤：全部原子共九個，氫占6/9=2/3，不是3/4。"},{"id":"D","text":"氧原子占非氫原子數的比例為1/2","explanation":"錯誤：非氫包含兩碳與一氧共三個，氧占1/3，不是1/2。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B028","stem":"一項研究保持分子的各種原子數不變，只改變其連接方式，再測量性質。此設計主要比較什麼？","concept":"研究設計先固定每分子各元素的原子數，因此元素種類與組成都保持。被改動的是原子如何相接，也就是結構；再測量性質，便是在比較同組成不同結構的物質。這與增加樣品量、增加單分子氧數或用另一元素取代原子不同，後兩者已改動題設固定的組成。","correct":"D","options":[{"id":"A","text":"相同分子連接下，增加樣品分子總數的效果","explanation":"錯誤：題目改變的是單分子連接，不是只增加同種分子的取樣量。"},{"id":"B","text":"相同元素種類下，增加每分子氧原子數的效果","explanation":"錯誤：增加每分子氧數會改變組成，違反各元素原子數固定。"},{"id":"C","text":"相同原子總數下，更換其中一種元素的效果","explanation":"錯誤：更換元素即改變元素種類，不符合本次控制條件。"},{"id":"D","text":"相同組成下，不同結構可能伴隨的性質差異","explanation":"正確：固定組成而調整連接，主要考察結構差異與性質的關係。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B029","stem":"教材說明可透過改變分子的組成與結構，發展具有不同性質的物質。哪項延伸最合理？","concept":"分子層次的改變能影響物質性質，是設計新物質的重要出發點，但不等於所有改變都帶來改善。性質好壞也與使用目的有關，必須用實際資料確認。解題時要區分『可能改變』和『一定朝某方向改變』；本節沒有建立用氧數單獨預測毒性的規則。","correct":"A","options":[{"id":"A","text":"微小結構差異值得研究，但新物質性質仍應實際確認","explanation":"正確：保留結構影響性質的觀念，也保留實驗驗證的必要。"},{"id":"B","text":"每多加一個氧原子，毒性一定降低","explanation":"錯誤：氧數與毒性沒有本題所說的單向必然關係。"},{"id":"C","text":"分子原子總數相同便無須測量性質","explanation":"錯誤：相同總數可能有不同組成或結構，仍需測量。"},{"id":"D","text":"只要改變組成，新物質一定更適合原用途","explanation":"錯誤：改變不保證改善，還要依用途評估結果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B030","stem":"兩種分子的組成不同，但測得某一條件下密度相同。這能否否定組成與結構會影響物質性質？","concept":"性質包括密度、可燃性、毒性等多個面向。『組成與結構影響性質』並不要求任意兩種物質的每個測量值都不同。即使某條件下密度相同，其他性質仍可能不同，因此單一相同數值不足以否定此觀念，也不足以識別同一物質。要留意結論是否超過資料範圍。","correct":"C","options":[{"id":"A","text":"能，因密度相同就表示所有性質相同","explanation":"錯誤：一項相同無法推出所有性質相同。"},{"id":"B","text":"能，因不同組成的物質不可能有相同性質數值","explanation":"錯誤：不同物質可能在指定條件下共享某個數值。"},{"id":"C","text":"不能，因單項性質相同不代表全部性質相同","explanation":"正確：只比較密度，尚不能概括全部物質性質。"},{"id":"D","text":"不能，但可直接據此判定兩者毒性相同","explanation":"錯誤：前半句正確，但密度不足以判定毒性相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B031","stem":"甲記錄『每分子 2 C、6 H、1 O』；乙記錄『同一氧原子連接兩個碳』。以下哪項判讀正確？","concept":"原子清單描述單一分子的組成，而指出氧與兩個碳相接，描述局部結構。兩種資訊可以同時為真，例如 CH3OCH3 就符合 C2H6O，且氧位在兩碳之間。此題不需要命名或反應知識；重點是分辨資訊層次，以及不把局部結構誤當成完整性質資料。","correct":"B","options":[{"id":"A","text":"甲已完整給出結構，乙只給出元素種類","explanation":"錯誤：甲沒有誰接誰的資訊，乙已超出單純元素清單。"},{"id":"B","text":"甲與乙分別提供組成及局部結構，可互補使用","explanation":"正確：一份列數量，一份列連接，兩者能互補。"},{"id":"C","text":"兩者都只提供巨觀性質","explanation":"錯誤：兩者都描述分子層次，沒有密度等巨觀測量。"},{"id":"D","text":"甲與乙必互相矛盾，因氧不能與兩個碳連接","explanation":"錯誤：CH3OCH3 正是可符合兩段資訊的連接寫法。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B032","stem":"同一均勻乙醇樣品在相同條件下分成10 g與20 g兩份，分裝時分子本身沒有改變。比較兩份樣品，哪一項相同？","concept":"分裝改變的是整份樣品有多少物質。20g這份含有的相同乙醇分子比10g這份多，在同條件、同種均勻液體下所占總體積也較大。但每個分子仍保持原有C2H6O組成與連接，不能把樣品量增加誤解成每分子多出原子。先分清單一分子與整份樣品，才能正確比較。","correct":"D","options":[{"id":"A","text":"樣品的總質量","explanation":"錯誤：題目直接給定10g與20g，總質量不同。"},{"id":"B","text":"樣品的分子總數","explanation":"錯誤：在分子相同的前提下，較多乙醇質量包含較多分子。"},{"id":"C","text":"樣品的液體總體積","explanation":"錯誤：同條件下同種液體的密度相同，兩倍質量對應兩倍總體積。"},{"id":"D","text":"單一分子的組成與連接方式","explanation":"正確：題設分子本身不變，故單分子的元素數量及原子連接均相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文5–6、12/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B033","stem":"3 個 CO2 分子與 4 個 H2O 分子合計有多少個氧原子？","concept":"化學式下標給出每個分子的原子數，分子個數則乘在整個分子外。3 個 CO2 提供 3×2=6 個 O，4 個 H2O 提供 4×1=4 個 O，合計 10 個。計算時先各別展開，再只加題目指定的元素；不要把分子總數或全部原子數當成氧原子數。","correct":"B","options":[{"id":"A","text":"7","explanation":"錯誤：7 是分子總數 3+4，未計入每分子的氧數。"},{"id":"B","text":"10","explanation":"正確：氧數為 6+4=10。"},{"id":"C","text":"14","explanation":"錯誤：把水也算成每分子兩個氧，才會得到 14。"},{"id":"D","text":"21","explanation":"錯誤：21 是這些分子的全部原子數，而非氧數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B034","stem":"2 個乙醇分子 C2H6O 與 3 個乙二醇分子 C2H6O2 的氧原子總數為何？","concept":"先分別讀出乙醇每分子 1 O、乙二醇每分子 2 O，再乘以各自分子數。兩類提供 2×1=2 與 3×2=6 個 O，共 8 個。雖然兩者每分子的碳、氫數相同，氧數仍須分開計算。核對時可確認答案在 5 個與 10 個之間，因每分子有一或兩個氧。","correct":"C","options":[{"id":"A","text":"5","explanation":"錯誤：這是分子總數，忽略乙二醇有兩個氧。"},{"id":"B","text":"7","explanation":"錯誤：7 可由交換兩種分子的氧數得到，配對錯誤。"},{"id":"C","text":"8","explanation":"正確：2+6=8 個氧原子。"},{"id":"D","text":"10","explanation":"錯誤：把全部 5 個分子都當作各有兩個氧。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B035","stem":"幾個 CO2 分子的碳原子總數，才等於 2 個阿斯匹靈分子 C9H8O4 的碳原子總數？","concept":"阿斯匹靈每分子有 9 個碳，2 個分子共有 18 個碳；CO2 每分子只有 1 個碳，因此需 18 個 CO2。這裡比較的是碳原子的個數，並非比較兩種分子的質量或全部原子數。遇到『相等』題，可先算一側指定元素的總數，再除以另一側每分子的數量。","correct":"B","options":[{"id":"A","text":"9","explanation":"錯誤：9 只對應一個阿斯匹靈分子的碳數。"},{"id":"B","text":"18","explanation":"正確：2×9÷1=18 個 CO2 分子。"},{"id":"C","text":"21","explanation":"錯誤：21 是一個阿斯匹靈分子的全部原子數。"},{"id":"D","text":"42","explanation":"錯誤：42 是兩個阿斯匹靈分子的全部原子數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B036","stem":"一個乙二醇分子 C2H6O2 中，非氫原子占全部原子數的比例為何？","concept":"非氫原子指除氫以外的所有原子，因此本題包含 2 C 與 2 O，共 4 個。全部原子為 2+6+2=10 個，比例是 4/10=2/5。這是依原子『個數』計算的比例，不是質量百分比；分母必須使用全部原子，不能只用氫數或元素種類數。","correct":"B","options":[{"id":"A","text":"1/5","explanation":"錯誤：1/5 只計了兩個碳或兩個氧，漏掉另一種非氫原子。"},{"id":"B","text":"2/5","explanation":"正確：(2+2)/(2+6+2)=2/5。"},{"id":"C","text":"3/5","explanation":"錯誤：3/5 是氫原子所占比例。"},{"id":"D","text":"4/5","explanation":"錯誤：非氫原子只有 4 個，沒有占 10 個中的 8 個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B037","stem":"3 個阿斯匹靈分子 C9H8O4 中，碳原子比氫原子多幾個？","concept":"每個阿斯匹靈分子的碳與氫數差為 9−8=1。相同差額重複 3 次，總差為 3；也可分別算 27 C 與 24 H，再相減驗算。不要把單分子的差直接套用到整組分子，也不要用碳總數代替『比氫多多少』。先抓比較對象，最後確認問的是差而非總數。","correct":"B","options":[{"id":"A","text":"1","explanation":"錯誤：1 是單一分子的碳氫差，未乘以 3。"},{"id":"B","text":"3","explanation":"正確：27−24=3。"},{"id":"C","text":"9","explanation":"錯誤：9 是單一分子的碳數。"},{"id":"D","text":"27","explanation":"錯誤：27 是三個分子的碳總數，還未減去氫數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B038","stem":"2 個 CH3CH2OH 分子共有多少個氫原子？","concept":"縮寫結構中的氫要逐段相加。CH3 有 3 H，CH2 有 2 H，OH 還有 1 H，因此每個分子為 6 H，兩個分子為 12 H。常見錯誤是只計碳上的氫而漏掉 OH，或把已計入的 OH 再多算一次。先求每分子數，再乘分子個數最不易遺漏。","correct":"C","options":[{"id":"A","text":"6","explanation":"錯誤：6 是一個分子的氫數。"},{"id":"B","text":"10","explanation":"錯誤：漏掉每個 OH 的氫，會算成 2×5=10。"},{"id":"C","text":"12","explanation":"正確：2×(3+2+1)=12。"},{"id":"D","text":"14","explanation":"錯誤：每分子多算一個氫，才會得到 14。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B039","stem":"一個 HOCH2CH2OH 分子中，直接寫在兩個 OH 部分的氫占全部氫的幾分之幾？","concept":"HO 與 OH 的寫法各含一個氫，合計 2 個；兩個 CH2 又提供 4 個氫，所以總氫數是 6。指定部分所占比例為 2/6=1/3。此題分母只問全部『氫』，不是全部原子；計算前先圈出被比較的那一類粒子，避免把 10 個原子誤用為分母。","correct":"B","options":[{"id":"A","text":"1/6","explanation":"錯誤：1/6 只計入其中一端的 OH 氫。"},{"id":"B","text":"1/3","explanation":"正確：兩端提供 2 H，總共 6 H，比例為 1/3。"},{"id":"C","text":"1/2","explanation":"錯誤：1/2 把兩端氫與碳上四個氫直接相比，分母不符。"},{"id":"D","text":"2/3","explanation":"錯誤：2/3 是兩個 CH2 上的氫所占比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B040","stem":"一組只含 H2O 與 CO2 的分子共有 4 個碳原子與 10 個氫原子。這組分子共含多少個氧原子？","concept":"碳只來自 CO2，因此 4 個碳表示 4 個 CO2；氫只來自 H2O，因此 10 個氫表示 5 個 H2O。再回算氧：4×2+5×1=13 個。這是由不同元素追溯分子數的兩步題。每一步都使用題目限定的兩種分子，不可加入未給定的其他含碳或含氫物質。","correct":"C","options":[{"id":"A","text":"9","explanation":"錯誤：9 是分子數 4+5，不是氧數。"},{"id":"B","text":"10","explanation":"錯誤：10 是氫數，不能直接套作氧數。"},{"id":"C","text":"13","explanation":"正確：CO2 的 8 O 加上水的 5 O，共 13 O。"},{"id":"D","text":"18","explanation":"錯誤：把全部九個分子都算成兩個氧，得到 18。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B041","stem":"只含乙醇 C2H6O 與乙二醇 C2H6O2 的一組分子共有 5 個分子、8 個氧原子。其中乙二醇有幾個分子？","concept":"若五個分子全是乙醇，會有 5 個氧。每把其中一個換成乙二醇，氧數就多 1，而分子總數不變。要由 5 增至 8，需有 3 個乙二醇；其餘 2 個為乙醇。代回檢查：3×2+2×1=8，且分子數 3+2=5，兩個條件同時滿足。","correct":"C","options":[{"id":"A","text":"1","explanation":"錯誤：1 個乙二醇搭配 4 個乙醇只有 6 O。"},{"id":"B","text":"2","explanation":"錯誤：2 個乙二醇搭配 3 個乙醇只有 7 O。"},{"id":"C","text":"3","explanation":"正確：3 個乙二醇與 2 個乙醇共有 8 O。"},{"id":"D","text":"4","explanation":"錯誤：4 個乙二醇搭配 1 個乙醇會有 9 O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B042","stem":"2 個 O2 分子與 1 個 C2H6O2 分子合計的氧原子數，等於幾個 H2O 分子的氧原子數？","concept":"兩個 O2 有 4 O，一個乙二醇有 2 O，總共 6 O。水每分子有 1 O，因此需要 6 個水分子來達到相同氧數。此比較只表示某種原子數相等，不表示分子種類、氫數或樣品性質相同。最後可用 6×1 回代核對。","correct":"C","options":[{"id":"A","text":"3","explanation":"錯誤：3 是左側分子數，未按氧數計算。"},{"id":"B","text":"4","explanation":"錯誤：4 只算了兩個 O2，漏掉乙二醇。"},{"id":"C","text":"6","explanation":"正確：(2×2+2)÷1=6。"},{"id":"D","text":"8","explanation":"錯誤：左側只有 6 O，並沒有 8 O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B043","stem":"相同分子個數的 CO2 與 C2H6O，兩份分子群的氫原子總數之比為何？","concept":"CO2 的式子沒有 H，故不論取幾個 CO2，氫原子數都為零。乙醇每分子有 6 H，取正數個分子便有氫，因此兩群的氫數比可寫成 0：1。化學式未列出的元素代表此分子不含該元素，不能把省略下標等於 1 的規則套到根本未出現的符號。","correct":"A","options":[{"id":"A","text":"0：1","explanation":"正確：前者無氫，後者有氫，為 0：1。"},{"id":"B","text":"1：2","explanation":"錯誤：CO2 沒有一個氫，不能給非零前項。"},{"id":"C","text":"1：3","explanation":"錯誤：把總原子數或其他元素數當成氫數。"},{"id":"D","text":"1：6","explanation":"錯誤：只有已寫出的元素省略下標才代表 1；CO2 未寫 H。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B044","stem":"一個阿斯匹靈分子 C9H8O4，與幾個 H2O 分子含有相同的氫原子數？","concept":"阿斯匹靈分子式的 H8 表示每分子 8 H，水每分子為 2 H。所需水分子數是 8÷2=4。注意題目問的是『水分子數』，答案不等於氫原子總數；阿斯匹靈中的氧數雖也為 4，但本題必須以氫數計算，不能靠數字巧合推理。","correct":"B","options":[{"id":"A","text":"2","explanation":"錯誤：2 個水分子只有 4 H。"},{"id":"B","text":"4","explanation":"正確：4 個水分子共有 8 H。"},{"id":"C","text":"8","explanation":"錯誤：8 是指定的氫數，8 個水分子反而有 16 H。"},{"id":"D","text":"12","explanation":"錯誤：把阿斯匹靈的氫與氧數相加，並未回答氫數相等的條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B045","stem":"2 個 C2H6O 與 1 個 C9H8O4 分子合計的 C：O 原子數比為何？","concept":"先按元素分欄加總：碳為 2×2+9=13，氧為 2×1+4=6，因此 C：O=13：6。混合不同分子時，不能直接把各分子的原子比平均，也不能忽略分子個數。算完應確認兩邊都已計入乙醇及阿斯匹靈，而非只計其中一類。","correct":"B","options":[{"id":"A","text":"11：5","explanation":"錯誤：11：5 是各取一個乙醇與一個阿斯匹靈的比。"},{"id":"B","text":"13：6","explanation":"正確：碳 13、氧 6，比例為 13：6。"},{"id":"C","text":"4：1","explanation":"錯誤：未把阿斯匹靈提供的 9 C 與 4 O 正確加入。"},{"id":"D","text":"2：1","explanation":"錯誤：2：1 只是單個乙醇的 C：O，不能代表整組。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B046","stem":"一組含 6 個 CO2 分子的模型中，拿走 2 個完整 CO2 模型後，剩下多少個原子球？","concept":"每個 CO2 模型有一個碳球與兩個氧球，共 3 球。拿走兩個完整分子後剩 6−2=4 個分子，所以剩 4×3=12 球。操作以完整分子為單位，不是只拿走兩顆原子球。解題時應把分子數與每分子的原子數分開列，最後再相乘。","correct":"C","options":[{"id":"A","text":"4","explanation":"錯誤：4 是剩下的分子數。"},{"id":"B","text":"8","explanation":"錯誤：8 只計了剩下的氧球，漏掉 4 顆碳球。"},{"id":"C","text":"12","explanation":"正確：4 個分子各有 3 球，共 12 球。"},{"id":"D","text":"18","explanation":"錯誤：18 是拿走之前的原子球總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B047","stem":"同時含有 2 個乙醇與 2 個乙二醇分子時，氫原子總數減去碳原子總數等於多少？","concept":"乙醇與乙二醇雖然氧數不同，每分子卻同樣有 2 C、6 H。因此四個分子合計有 8 C、24 H，差為 16。可先辨認哪些元素數相同，再合併計算。氧的差異在本題不影響答案，但不能把這項局部相同擴大解讀為兩者整體組成相同。","correct":"C","options":[{"id":"A","text":"4","explanation":"錯誤：4 是一個分子的 H−C，未計四個分子。"},{"id":"B","text":"8","explanation":"錯誤：8 是四個分子的碳總數。"},{"id":"C","text":"16","explanation":"正確：24−8=16。"},{"id":"D","text":"24","explanation":"錯誤：24 是氫總數，尚未減去碳總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B048","stem":"一個含 C、H、O 的分子共有 23 個原子，已知其中有 9 C、4 O。其氫原子數及分子式何者正確？","concept":"全部原子由 C、H、O 三類構成，且題目排除其他元素，因此氫數可以用總數減去碳與氧：23−9−4=10。將結果逐項放回分子式得到 C9H10O4，再相加 9+10+4=23 驗證。此題只核對給定組成，不據此指定物質名稱；若未限定元素種類，也不能把剩餘原子全部當成氫。","correct":"A","options":[{"id":"A","text":"10；C9H10O4","explanation":"正確：扣除碳與氧後剩 10 H，總數回算為 23。"},{"id":"B","text":"14；C9H14O4","explanation":"錯誤：14 只扣掉碳，漏扣 4 O。"},{"id":"C","text":"13；C9H13O4","explanation":"錯誤：13 是碳加氧的數量，並非剩餘氫數。"},{"id":"D","text":"19；C9H19O4","explanation":"錯誤：19 只扣掉氧，漏扣 9 C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B049","stem":"4 個 H2O 與 2 個 O2 分子放在同一示意框中。氧原子占框內全部原子數的幾分之幾？","concept":"水提供 8 H、4 O，氧氣提供 4 O，因此框中有 8 H、8 O，共 16 個原子。氧所占比例為 8/16=1/2。分子總數雖為 6，卻不是求原子比例的分母；兩種分子每個包含的原子數不同，需先各別展開才能正確加總。","correct":"B","options":[{"id":"A","text":"1/3","explanation":"錯誤：1/3 是單個水分子的氧原子比例，忽略 O2。"},{"id":"B","text":"1/2","explanation":"正確：氧 8 個、全部 16 個，比例為 1/2。"},{"id":"C","text":"2/3","explanation":"錯誤：不能以某類分子數代替原子數的分子或分母。"},{"id":"D","text":"3/4","explanation":"錯誤：氫與氧各有 8 個，氧並未占四分之三。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B050","stem":"某模型組只含完整的乙醇分子 C2H6O，數得共有 12 個碳原子。模型組中的氧原子數為何？","concept":"乙醇每分子有 2 C 與 1 O。先由 12÷2=6 求出分子數，再乘每分子的 1 O，得到 6 個氧。也可直接使用固定 C：O=2：1 檢查結果。題目限定全部為乙醇，這個限制讓我們能由碳數唯一回推氧數；若混入其他分子就不一定成立。","correct":"B","options":[{"id":"A","text":"2","explanation":"錯誤：2 是每分子的碳數，不是整組氧數。"},{"id":"B","text":"6","explanation":"正確：6 個乙醇分子共有 6 O。"},{"id":"C","text":"12","explanation":"錯誤：將碳氧數誤當成 1：1。"},{"id":"D","text":"36","explanation":"錯誤：36 是這六個乙醇分子的氫總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B051","stem":"相同數量的阿斯匹靈 C9H8O4 與乙二醇 C2H6O2 分子，其氧原子總數之比為何？","concept":"當兩份樣品的分子個數相同且不為零，比較指定原子總數時，共同分子數可以約去。因此只需比較每分子的氧數 4：2，化簡為 2：1。此便利方法只適用於題目已給相同分子數；若質量相同或體積相同，不能直接套用。","correct":"B","options":[{"id":"A","text":"1：2","explanation":"錯誤：把阿斯匹靈與乙二醇的先後順序顛倒。"},{"id":"B","text":"2：1","explanation":"正確：相同分子數下，氧數比為 4：2=2：1。"},{"id":"C","text":"4：1","explanation":"錯誤：乙二醇每分子有 2 O，不是 1 O。"},{"id":"D","text":"9：2","explanation":"錯誤：9：2 比較的是碳數，題目指定氧數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B052","stem":"3 個乙醇分子所含的原子總數，比 2 個乙二醇分子多多少？","concept":"乙醇每分子有 2+6+1=9 個原子，三個共 27；乙二醇每分子有 2+6+2=10 個，兩個共 20。差額為 27−20=7。不能只比較每分子 9 與 10 就認為乙二醇那一組一定較多，因題目給定的分子個數不同。先展開兩群，再求差。","correct":"C","options":[{"id":"A","text":"1","explanation":"錯誤：1 是兩種單分子的原子總數差，未計分子數。"},{"id":"B","text":"3","explanation":"錯誤：3 未由兩群全部原子數相減得到。"},{"id":"C","text":"7","explanation":"正確：3×9−2×10=7。"},{"id":"D","text":"9","explanation":"錯誤：9 是一個乙醇分子的原子數，不是兩群差額。"}],"source":"Chemistry: The Central Science in
