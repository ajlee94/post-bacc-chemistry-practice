nation":"改名不建立適用性。"},{"id":"D","text":"原模型對A的資料立即全部無效","explanation":"新對象缺口不否定原範圍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B172","stem":"政府與公司各有一組研究污染物運輸；二者任職場域不同。若兩組當前都在測量物質性質，應如何登錄？","correct":"C","options":[{"id":"A","text":"兩組都須改成大學才算化學研究","explanation":"政府與產業也可研究。"},{"id":"B","text":"同做測量就表示兩組是同一機構","explanation":"共同活動不合併組織身分。"},{"id":"C","text":"場域各自記錄，工作類別可同為測量","explanation":"組織不同不必使科學活動不同。"},{"id":"D","text":"公司只能記製造，政府不能記測量","explanation":"以場域限制活動不符來源。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B173","stem":"展覽展示清潔用品、包裝與顯示材料，三者用途不同。哪個總結最合宜？","correct":"D","options":[{"id":"A","text":"用途不同就不可能共享任何化學原理","explanation":"本節正強調廣泛連結。"},{"id":"B","text":"三者都必須是同一物質","explanation":"共同涉及化學不代表相同物質。"},{"id":"C","text":"只要是日用品就不需要研究其性質","explanation":"日常物品也可成為化學研究對象。"},{"id":"D","text":"不同日常用途仍可涉及物質性質及化學研究","explanation":"共同的物質研究基礎不要求用途相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49、50；部分1 PDF頁 50、51、52；已審筆記頁 PNG10／正文08；PNG04、06／正文02、04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B174","stem":"假設某材料的用途要求指標至少10，甲實測8、乙實測12，值均精確。兩者距10同為2。哪個判斷正確？","correct":"A","options":[{"id":"A","text":"甲低於要求，乙達到要求；差額大小相同但方向不同","explanation":"至少10須看高低方向。"},{"id":"B","text":"兩者都合格，因距離相同","explanation":"距離不保留門檻方向。"},{"id":"C","text":"兩者都不合格，因都不是恰好10","explanation":"題設要求至少，不是恰等於。"},{"id":"D","text":"可交換甲乙數據使兩者一致","explanation":"會改寫測量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B175","stem":"原計畫涵蓋健康與環境，最後只完成健康部分，環境沒有結果。結案文字卻沿用「兩面向皆已評估」。應如何修正？","correct":"B","options":[{"id":"A","text":"否定健康部分已完成的有效資料","explanation":"另一面向未完成不取消健康結果。"},{"id":"B","text":"把完成範圍改為健康，明示環境尚未完成","explanation":"文字應與實際成果一致。"},{"id":"C","text":"保留兩面向，因原計畫曾列出","explanation":"規劃不等於完成。"},{"id":"D","text":"把健康結果拆成兩頁就等於兩面向","explanation":"頁數不能替代研究範圍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B176","stem":"核對原始實驗紀錄後，確定表格把乙批的測量值抄到甲批名下，數值本身抄對。哪個修正最合理？","correct":"C","options":[{"id":"A","text":"同時稱甲乙都有這筆實測","explanation":"沒有甲批相應測量。"},{"id":"B","text":"只刪掉批號讓錯誤看不出來","explanation":"會失去追溯而非改正。"},{"id":"C","text":"改正該筆所屬批次，保留原始對照與修正理由","explanation":"已知錯誤在身分歸屬，不能任意改值。"},{"id":"D","text":"把數值改成甲批希望得到的值","explanation":"改成期望值不是修正轉錄。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B177","stem":"兩種使用方式都達到題設用途利益，但安全資料只對方式甲取得。哪句不超出證據？","correct":"D","options":[{"id":"A","text":"方式乙必然與甲安全結果完全相同","explanation":"缺方式乙資料。"},{"id":"B","text":"方式甲的資料因乙未研究而無效","explanation":"未研究乙不否定甲的資料。"},{"id":"C","text":"方式乙必定有害","explanation":"資料不足也不等於已證明有害。"},{"id":"D","text":"兩者有明示利益；方式乙的安全影響仍需相應資料","explanation":"用途成效相同不保證接觸影響已同被評估。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B178","stem":"顧客同時問「如何使用產品」與「這批是否符合要求」。哪種回應流程更完整？","correct":"A","options":[{"id":"A","text":"服務說明使用，分析團隊提供對應批次的規格資料","explanation":"兩個問題各有相應資訊來源。"},{"id":"B","text":"只回答如何使用，就宣布該批合格","explanation":"使用說明不等於檢驗。"},{"id":"C","text":"只說批次編號，就視為使用方式已解釋","explanation":"編號不是操作資訊。"},{"id":"D","text":"把兩問題都交給廣告口號回答","explanation":"口號不補具體資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B179","stem":"紀錄已保存材料製作及實際性質資料，但研究問題是「為何出現此性質」，尚無解釋。哪項工作最直接補目前缺口？","correct":"B","options":[{"id":"A","text":"宣布只要材料做出就沒有可問的問題","explanation":"化學也測量與解釋性質。"},{"id":"B","text":"建立並檢查能解釋該性質的模型","explanation":"目前已有實物與觀察，缺的是相應解釋。"},{"id":"C","text":"只再次登錄已完成的製作日期","explanation":"不解釋性質。"},{"id":"D","text":"把已有資料全部稱為原因","explanation":"觀察表本身不自動提供原因。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B180","stem":"報告列「節省水10公升」和「節省材料5公斤」，未定義綜合指標。能否直接寫「總共節省15公斤」？","correct":"C","options":[{"id":"A","text":"不能，所以沒有任何資源節省成果","explanation":"不可直接加總不否定個別成果。"},{"id":"B","text":"能，把水欄單位刪掉即可","explanation":"刪單位不建立轉換依據。"},{"id":"C","text":"不能，兩種資源及單位不同，應分別報告或先定義合理指標","explanation":"10公升不可直接當10公斤材料相加。"},{"id":"D","text":"能，只要都是資源就能直接加","explanation":"忽略資源類型與單位。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B181","stem":"同一塊太陽能板在展覽照片中作能源應用例子，在研究室則接受性質量測。照片能直接替代那份量測報告嗎？","correct":"D","options":[{"id":"A","text":"能，只要照片拍到同一塊板","explanation":"相同對象不使所有資料形式等價。"},{"id":"B","text":"不能，因此照片無法說明任何應用","explanation":"照片仍可作用途例子。"},{"id":"C","text":"能，教材曾列此物品就提供了所有後續讀值","explanation":"來源例子不包含每個實物的測量。"},{"id":"D","text":"不能，展示用途與取得性質資料是不同目的","explanation":"同一物品可出現在不同工作中。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG04、06／正文02、04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B182","stem":"材料表有一列數值，沒有「實測/模型預測」欄。兩種方式都可能產生這些數值。要正確引用，最直接應查哪項？","correct":"A","options":[{"id":"A","text":"原工作紀錄中數值如何取得","explanation":"取得方式才決定證據類型。"},{"id":"B","text":"數值是否很整齊","explanation":"整齊程度不識別來源。"},{"id":"C","text":"檔案是否很大","explanation":"大小不識別取得方式。"},{"id":"D","text":"作者是否喜歡理論","explanation":"喜好不是這筆資料的來源證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B183","stem":"公司依新資料停止宣稱材料適用於用途乙，但沒有改製材料，用途甲的證據仍有效。哪個更新正確？","correct":"B","options":[{"id":"A","text":"用途乙退出表示用途甲結果必須同時作廢","explanation":"題設說甲證據有效。"},{"id":"B","text":"修正用途乙的服務說明，保留有依據的用途甲資訊","explanation":"改宣稱範圍不等於製造新材料。"},{"id":"C","text":"把同一材料登記為全新合成成果","explanation":"沒有新製造事實。"},{"id":"D","text":"繼續保留乙宣稱，只在內部知道限制","explanation":"對外資訊仍失真。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B184","stem":"某材料的環境問題是污染物會移往何處。團隊目前只有產品銷售表。哪項研究最直接補上所缺的資訊？","correct":"C","options":[{"id":"A","text":"只製作一個新商品名稱","explanation":"名稱不追蹤物質。"},{"id":"B","text":"只背螢火蟲發光的例子","explanation":"同涉及化學不代表回答同一問題。"},{"id":"C","text":"研究污染物在環境中的運輸；單有產品銷售表不足以回答","explanation":"所需是物質行為資料。"},{"id":"D","text":"統計產品廣告出現幾次","explanation":"廣告次數不表示污染物去向。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG05／正文03；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B185","stem":"團隊根據材料資料提出一個可能解釋，報告明寫尚需檢查。摘要如何寫才不誇大？","correct":"D","options":[{"id":"A","text":"已證明這是所有情況下唯一原因","explanation":"從可能解釋跳到全面唯一。"},{"id":"B","text":"因仍需檢查，所以根本沒提出任何模型","explanation":"提出與已驗證是不同狀態。"},{"id":"C","text":"把待檢查三字刪去即可變成證明","explanation":"刪文字不增加證據。"},{"id":"D","text":"已提出待檢查的解釋模型","explanation":"保留模型目前的證據狀態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B186","stem":"材料計畫宣稱「節省更多自然資源」，卻未說與哪個方案相比。已有目前用量資料，應如何補強？","correct":"A","options":[{"id":"A","text":"補上明確比較方案與對應資料","explanation":"更多是比較主張，需知道比較對象。"},{"id":"B","text":"只再量目前方案一次便自動有比較對象","explanation":"重測目前方案不提供另一方案。"},{"id":"C","text":"刪掉所有目前用量資料","explanation":"已有資料仍有價值。"},{"id":"D","text":"把更多改成非常多就不需依據","explanation":"形容強度不補基準。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B187","stem":"兩位畢業生一人進工程公司分析材料，一人在化學公司只排員工旅遊。若只問這兩項明示活動何者直接需要物質性質知識，應如何選？","correct":"B","options":[{"id":"A","text":"工程公司不能運用化學知識","explanation":"來源明確連結工程與化學。"},{"id":"B","text":"工程公司的材料分析活動","explanation":"工作內容比公司名稱更能對應所需知識。"},{"id":"C","text":"化學公司的旅遊排程，因公司名有化學","explanation":"機構名稱不能替代活動內容。"},{"id":"D","text":"兩項必然同等涉及性質分析","explanation":"題幹描述的活動不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG06／正文04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B188","stem":"報告使用新規格下的合格標記，附件卻只放未被用來判定的舊批次數據。要讓結論可查核，最需要哪項？","correct":"C","options":[{"id":"A","text":"只把舊數據附件標成最新","explanation":"改標不改事實。"},{"id":"B","text":"增加與該批無關的分析報告","explanation":"更多無關資料不補此缺口。"},{"id":"C","text":"補上實際判定所用的批次數據與規格對照","explanation":"讀者需能從資料追到判定。"},{"id":"D","text":"讓兩份文件封面顏色相同","explanation":"樣式不建立資料關係。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B189","stem":"材料銷售量很高，但題設沒有健康或環境研究。哪個回應最符合本節的公民消費者觀點？","correct":"D","options":[{"id":"A","text":"銷量高就表示所有使用都安全","explanation":"缺影響證據。"},{"id":"B","text":"銷量高就表示一定有害","explanation":"同樣不受資料支持。"},{"id":"C","text":"只要被販售，就不再需要任何材料知識","explanation":"日常產品仍需要理解與判斷。"},{"id":"D","text":"銷售情況不能替代對正負面影響的理解","explanation":"受歡迎與實際影響是不同資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B190","stem":"研究原有甲乙兩材料並完成測量，後來把丙加入清單，但丙尚未量測。哪個紀錄最準確？","correct":"A","options":[{"id":"A","text":"甲乙測量完成，丙新增待測","explanation":"工作清單增加不會自動增加既有實測。"},{"id":"B","text":"三材料均測量完成，因都在同一清單","explanation":"名單不等於結果。"},{"id":"C","text":"甲乙因新增丙而變成未測","explanation":"新對象不取消已完成工作。"},{"id":"D","text":"把甲的資料複製給丙就算完成","explanation":"不能替代丙的測量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B191","stem":"假設計畫明定「原料用量降低且能源用量不增加」才達標。結果原料降低、能源增加。依明示規則應如何報告？","correct":"B","options":[{"id":"A","text":"把能源增加改叫改善就通過","explanation":"更名不改結果。"},{"id":"B","text":"原料部分改善，但整體未達這套雙要求","explanation":"能源不增加的條件未滿足。"},{"id":"C","text":"全部達標，因原料已經降低","explanation":"漏掉另一必要條件。"},{"id":"D","text":"原料一定未降低，因整體未達標","explanation":"整體失敗不否定局部結果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B192","stem":"博物館要用本節製作入門導覽，目標是讓觀眾看出化學與現代生活連結。哪種內容選擇最合適？","correct":"C","options":[{"id":"A","text":"把螢火蟲說成工業精製糖的產物","explanation":"混淆不同例子。"},{"id":"B","text":"完全不提用途，只讓觀眾背檔名","explanation":"檔名不能達成學習目的。"},{"id":"C","text":"用已給產品與生物例子說明領域連結，避免自編未提供的製造細節","explanation":"內容對應導覽目標及來源深度。"},{"id":"D","text":"只增加一套未查證的OLED製程","explanation":"不受本節來源支持。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B193","stem":"同一模型對甲乙材料使用不同輸入資料，得到不同預測。僅由輸出不同，能否斷定模型計算出錯？","correct":"D","options":[{"id":"A","text":"能，所有材料的預測必須相同","explanation":"來源沒有此要求。"},{"id":"B","text":"不能，所以任何輸出都必定正確","explanation":"仍需查核計算與適用性。"},{"id":"C","text":"能，把兩份輸入改成同樣就可掩蓋錯誤","explanation":"改資料不算驗證。"},{"id":"D","text":"不能，先核對輸入及模型如何使用它們","explanation":"不同輸入可能對應不同輸出。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B194","stem":"公司收到一份新材料，要求回答「好不好用」，卻沒有說用途。即使已有性質表，首先最應澄清什麼？","correct":"A","options":[{"id":"A","text":"預期用途及所需性質","explanation":"有資料仍需知道判斷目標。"},{"id":"B","text":"材料名字能否更好聽","explanation":"不定義適用需求。"},{"id":"C","text":"把所有性質一律叫優點","explanation":"性質是否有利需看用途。"},{"id":"D","text":"先寫適合一切用途","explanation":"沒有相應依據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B195","stem":"資料夾同時有一份舊影響摘要與一份明示更正舊錯誤的新摘要。引用時哪個處理恰當？","correct":"B","options":[{"id":"A","text":"只刪日期便不再有版本差異","explanation":"差異仍存在。"},{"id":"B","text":"查明更正內容與依據，使用適用的更正結果並保留版本關係","explanation":"不能只挑符合立場的版本。"},{"id":"C","text":"一律選對產品最有利者","explanation":"立場不能替代來源核對。"},{"id":"D","text":"兩個版本平均一下就成真","explanation":"文字結論不能靠無依據平均處理。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B196","stem":"學生說「我是因課程必修才學」，教師說「這些原理也可幫助你理解日常材料」。兩句如何理解？","correct":"C","options":[{"id":"A","text":"學生的話證明化學只在學校有用","explanation":"個人修課原因不限制學科用途。"},{"id":"B","text":"只能刪掉其中一句才無矛盾","explanation":"兩句回答不同面向。"},{"id":"C","text":"前者說目前修課原因，後者說知識用途，可同時成立","explanation":"動機與可得用途不是互斥選項。"},{"id":"D","text":"教師的話證明學生沒有必修課","explanation":"用途不否定課程要求。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG06／正文04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B197","stem":"同一份有效性質表供甲組改進模型，乙組核對用途要求。哪種說法最精確？","correct":"D","options":[{"id":"A","text":"兩組必須給相同格式的結論","explanation":"後續目的不同。"},{"id":"B","text":"一組使用後，另一組就不能再閱讀","explanation":"資料用途不具這種互斥性。"},{"id":"C","text":"兩份引用代表原始測量自動增加兩次","explanation":"引用次數不增加測量次數。"},{"id":"D","text":"資料可支援兩種後續工作，仍應各自保留推理與判斷依據","explanation":"共同輸入不等於同一輸出或相同操作。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06；PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B198","stem":"團隊名為研發組，但本次交付只有三份性質測量表，沒有製作新材料或提出模型。哪句摘要符合本次紀錄？","correct":"A","options":[{"id":"A","text":"本次有測量成果；其他活動是否完成需另有紀錄","explanation":"部門名稱不替代實際工作證據。"},{"id":"B","text":"本次三類根本工作都完成，因組名是研發","explanation":"名稱不能補缺活動。"},{"id":"C","text":"沒有新材料所以三份表都不算化學成果","explanation":"測量本身是根本工作。"},{"id":"D","text":"三份表等於三個新物質","explanation":"表格數不是物質種類數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B199","stem":"兩篇研究都談節省能源，卻分別服務完全不同且未被證明等價的材料用途。可以只用一個節能數字宣布某方法全面勝過另一方法嗎？","correct":"B","options":[{"id":"A","text":"可以，只需去掉研究用途文字","explanation":"刪限定條件不增加證據。"},{"id":"B","text":"不能，需先說明比較用途與條件是否合適","explanation":"同屬能源目標不表示可直接跨用途排序。"},{"id":"C","text":"可以，公共目標同名就等於條件相同","explanation":"名稱不建立可比較性。"},{"id":"D","text":"不能，所以兩篇各自的結果都無效","explanation":"各自結果可有效，只未支持所提廣泛比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B200","stem":"會議已知道兩材料都達用途要求，也有兩者健康資料；尚未能依既定環境目標選擇，因乙的環境資料缺少。哪項新增工作最直接回應未決問題？","correct":"C","options":[{"id":"A","text":"把乙的環境欄填成甲的值","explanation":"兩材料不能無依據共用結果。"},{"id":"B","text":"宣告乙必然最差","explanation":"缺資料不等於已知不佳。"},{"id":"C","text":"補乙在相應條件下的環境資料","explanation":"能填入當前決策缺少的比較項。"},{"id":"D","text":"只再宣傳甲的用途好處","explanation":"用途要求已知，不補乙環境欄。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"central-0-1-ch1-sec1-2-topic01","title":"1.2-01 物質的狀態","version":"B01-G02-v1-4d1f57cda0768e46","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.2 物質的分類"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-2-topic01-G02-S001","stem":"杯底有一小灘液體，杯口有把手。下列哪一部分必須算入「液體取得的容器形狀」？","correct":"A","options":[{"id":"A","text":"液體接觸的杯底與側壁輪廓","explanation":"液體貼合實際占據區域的邊界。"},{"id":"B","text":"杯子外側的把手輪廓","explanation":"把手不在液體占據的區域。"},{"id":"C","text":"液面上方所有杯壁的完整輪廓","explanation":"未占據區域不屬液體外形。"},{"id":"D","text":"整個杯子連同杯蓋的外輪廓","explanation":"容器外輪廓不等於液體外形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S002","stem":"同一個未變形的長方體固體轉動90度，照片上的長邊方向改變。三態分類中的「形狀固定」應如何判讀？","correct":"C","options":[{"id":"A","text":"已變成氣體","explanation":"轉動不提供可膨脹的證據。"},{"id":"B","text":"已變成液體","explanation":"轉動本身不表示內部粒子可滑動。"},{"id":"C","text":"形狀可保持，改變的是朝向","explanation":"幾何外形與擺放朝向是不同事項。"},{"id":"D","text":"必須先停止所有粒子運動才有固定形狀","explanation":"固體粒子仍能振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S003","stem":"一個密閉瓶中只有氣體。瓶外標籤寫「最大容量」，要描述當時氣體所占體積，最直接還須知道什麼？","correct":"B","options":[{"id":"A","text":"瓶身的顏色","explanation":"顏色不決定可占據空間。"},{"id":"B","text":"當時氣體可到達的瓶內空間","explanation":"氣體充滿當時可到達的容器空間。"},{"id":"C","text":"瓶口貼紙的面積","explanation":"貼紙面積不是內部體積。"},{"id":"D","text":"分子畫成哪一種顏色","explanation":"模型配色不提供容積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S004","stem":"教材比較三態時，「可壓縮」最直接描述哪一種操作結果？","correct":"D","options":[{"id":"A","text":"把樣品移到另一張桌子","explanation":"搬移不比較體積改變。"},{"id":"B","text":"把同一樣品改成另一種顏色","explanation":"顏色不是壓縮的判據。"},{"id":"C","text":"把樣品分成兩份","explanation":"分樣改變比較的樣品量。"},{"id":"D","text":"施壓使同一份樣品占據較小體積","explanation":"這是可壓縮性的直接觀察。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S005","stem":"用高倍模型說明固體時，把「位置固定」改寫成下列哪句最準確？","correct":"B","options":[{"id":"A","text":"完全不能有任何位移","explanation":"固體粒子仍在平衡位置附近振動。"},{"id":"B","text":"主要受限在各自位置附近","explanation":"這保留固定排列與微小運動兩者。"},{"id":"C","text":"每顆都能在整個容器自由穿梭","explanation":"這不是固體的典型內部運動。"},{"id":"D","text":"只有容器壁旁的粒子能動","explanation":"教材沒有這種空間限制。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S006","stem":"少量液體放在大瓶底部，瓶內仍有空餘空間。哪項行為才是液體「沒有固定形狀」的重點？","correct":"C","options":[{"id":"A","text":"自行增加體積填滿瓶子","explanation":"液體具有一定體積，不因空瓶大而增加。"},{"id":"B","text":"每個粒子伸長成瓶形","explanation":"變的是粒子集合的外形。"},{"id":"C","text":"接觸部分隨瓶底輪廓改變","explanation":"液體的外形配合所占容器區域。"},{"id":"D","text":"液體完全失去占據空間的能力","explanation":"沒有固定形狀仍有體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S007","stem":"有人把液體粒子畫得靠近，卻在圖說寫「因此不能互相越過」。哪個字句應先改正？","correct":"D","options":[{"id":"A","text":"把靠近改為相隔整個容器","explanation":"液體粒子本來就彼此靠近。"},{"id":"B","text":"把粒子改為不存在","explanation":"液體仍由粒子構成。"},{"id":"C","text":"把液體改為任何狀態都相同","explanation":"三態的運動限制不同。"},{"id":"D","text":"把不能互相越過改為可滑過彼此","explanation":"靠近並不排除相對滑動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S008","stem":"氣體的一張瞬間粒子圖剛好沒有兩顆粒子接觸。依教材，下一句何者合理？","correct":"A","options":[{"id":"A","text":"這不排除稍後發生碰撞","explanation":"粒子持續移動，瞬間未接觸不代表永不接觸。"},{"id":"B","text":"這證明所有粒子已固定","explanation":"單張圖不能建立固定位置。"},{"id":"C","text":"這證明粒子沒有速度","explanation":"未接觸不表示未運動。"},{"id":"D","text":"這證明氣體不能壓縮","explanation":"接觸瞬間與壓縮能力不是同一項觀測。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S009","stem":"一個密閉直立容器內的樣品始終為氣體。教材的均勻分布模型是否要包含容器上部？","correct":"C","options":[{"id":"A","text":"不用，氣體必定只貼底部","explanation":"這把氣體誤畫成只占底部的樣品。"},{"id":"B","text":"不用，只畫在壁上即可","explanation":"氣體並非只分布於壁面。"},{"id":"C","text":"要，氣體可分布於整個可達空間","explanation":"上部也是氣體可占據的容器空間。"},{"id":"D","text":"只有把分子變大才能到上部","explanation":"分子平移即可進入，不需膨大。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S010","stem":"兩片平板暫時把液體限制成薄片狀。若移除限制、條件仍適合維持液態，哪項特徵仍應用來描述它？","correct":"B","options":[{"id":"A","text":"永久保持原薄片形","explanation":"液體自身沒有固定形狀。"},{"id":"B","text":"可重新改變外形","explanation":"解除幾何限制後，液體不必保留原外形。"},{"id":"C","text":"必定變為氣體","explanation":"解除形狀限制本身不保證相變。"},{"id":"D","text":"所有分子變成平板","explanation":"巨觀外形不是單一分子形狀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S011","stem":"為同一種物質製作三態觀察紀錄，哪一組欄位最有助於日後理解為何狀態不同？","correct":"D","options":[{"id":"A","text":"樣品名稱的字數、標籤字體","explanation":"這些不是引發相變的物理條件。"},{"id":"B","text":"拍攝檔名、照片排序","explanation":"排序不能取代物理條件。"},{"id":"C","text":"容器品牌、桌面花紋","explanation":"這些不足以解釋物態。"},{"id":"D","text":"觀察時的溫度、壓力","explanation":"教材指出溫度及壓力變化可能造成相變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S012","stem":"模型以一個完整H₂O圖示代表一個水分子。要把氣態水改畫成液態水，哪個部分適合保留為追蹤單位？","correct":"A","options":[{"id":"A","text":"原來的完整H₂O圖示","explanation":"凝結保留水分子身分。"},{"id":"B","text":"拆開後單獨的H與O","explanation":"這會表示分子拆解，超出單純凝結。"},{"id":"C","text":"新造出的H₂圖示","explanation":"凝結不生成氫氣分子。"},{"id":"D","text":"新造出的O₂圖示","explanation":"凝結不生成氧氣分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S013","stem":"一張流程圖的終點都是「液態水」。僅憑這個終點，能否確定過程必為凝結？","correct":"C","options":[{"id":"A","text":"能，所有液態水只能由凝結產生","explanation":"冰融化也會到達相同終點。"},{"id":"B","text":"能，終點足以決定所有起點","explanation":"相變名稱需辨識起點狀態。"},{"id":"C","text":"不能，起點也可能是冰","explanation":"固態到液態為融化，與凝結不同。"},{"id":"D","text":"不能，因為液態水不存在","explanation":"液態水正是教材的三態範例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S014","stem":"仍維持氣態的樣品進入較大可用空間。學生想把單個分子畫成更大的球來表示膨脹，問題在哪裡？","correct":"B","options":[{"id":"A","text":"膨脹應只用更多分子表示","explanation":"同份樣品無進出時不增加分子。"},{"id":"B","text":"應主要呈現分子間空間增加","explanation":"氣體膨脹不是每個分子本身放大。"},{"id":"C","text":"分子必須全部消失","explanation":"膨脹不使物質消失。"},{"id":"D","text":"較大的空間一定不能有氣體","explanation":"氣體能占據較大容器空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S015","stem":"用刀把固體切成兩塊後外形改變，是否足以反駁固體有固定形狀？","correct":"D","options":[{"id":"A","text":"足以，切開後全部成為氣體","explanation":"切開不等於氣化。"},{"id":"B","text":"足以，固定形狀表示不能被切割","explanation":"固定形狀不是抵抗任意外力的承諾。"},{"id":"C","text":"足以，兩塊必定能像液體互相滑過","explanation":"宏觀碎塊移動不等於粒子液態運動。"},{"id":"D","text":"不足，切割已主動破壞原形","explanation":"三態比較不表示固體永不能被外力改形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S016","stem":"在水的三態模型中，哪一項差異應由「不同的狀態」來解釋？","correct":"A","options":[{"id":"A","text":"分子的排列與運動自由度","explanation":"這些是相同水分子在不同物態的差別。"},{"id":"B","text":"每個分子的H原子都換成另一種原子","explanation":"這會改變化學身分。"},{"id":"C","text":"液態分子不再是H₂O","explanation":"液態水分子仍為H₂O。"},{"id":"D","text":"固態水完全沒有分子","explanation":"冰仍由水分子構成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S017","stem":"液體倒出時，靠近容器出口的粒子可以先離開。這最直接需要哪種內部行為？","correct":"C","options":[{"id":"A","text":"所有粒子永久鎖在原相對位置","explanation":"固定相對位置不能解釋液體流出。"},{"id":"B","text":"各粒子都化學分解","explanation":"液體流動不需分解。"},{"id":"C","text":"粒子可以相對移動","explanation":"相對滑動使液體能連續通過出口。"},{"id":"D","text":"每個粒子都變成出口形狀","explanation":"個體不必依出口改形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S018","stem":"一份氣體由圓球形容器改到長管狀容器，且仍為氣體。描述樣品的外形時，最應更新哪項資訊？","correct":"B","options":[{"id":"A","text":"每顆分子的化學身分","explanation":"換容器不要求改變分子身分。"},{"id":"B","text":"氣體當時占據區域的輪廓","explanation":"氣體外形由當時的容器空間決定。"},{"id":"C","text":"每顆分子的原子種類","explanation":"普通搬移不改變原子種類。"},{"id":"D","text":"教材對固體的定義","explanation":"此次並未觀察固體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S019","stem":"觀察到樣品成為氣態，同時確認其分子身分已改變。哪個分類語句最穩妥？","correct":"D","options":[{"id":"A","text":"只要成為氣態就必為單純相變","explanation":"單純相變不能解釋分子身分改變。"},{"id":"B","text":"所有氣體都是新生成的物質","explanation":"氣態本身不表示新物質。"},{"id":"C","text":"氣態樣品不可能有化學身分","explanation":"氣體仍有粒子與化學身分。"},{"id":"D","text":"不能只用單純狀態轉換解釋全過程","explanation":"存在身分改變，超過單純相變的範圍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S020","stem":"氣體模型中的長方框表示密閉容器壁，框內小球表示分子。哪個動作對應「分子撞到容器壁」？","correct":"A","options":[{"id":"A","text":"小球移動到框的內邊界附近並改變運動方向","explanation":"這可表示與容器壁碰撞。"},{"id":"B","text":"整個框改換顏色","explanation":"框的配色不能表示分子碰撞。"},{"id":"C","text":"小球變成整個框","explanation":"粒子不會變為容器。"},{"id":"D","text":"在框外加上標題","explanation":"標題不是碰撞事件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S021","stem":"把一份液體攤成較扁的形狀，沒有流失且體積近乎不變。能否稱這是「體積被明顯壓縮」？","correct":"C","options":[{"id":"A","text":"能，變扁一定等於體積減少","explanation":"高度降低可能由橫向展開補償。"},{"id":"B","text":"能，形狀與體積是同一量","explanation":"形狀和占據空間的量不同。"},{"id":"C","text":"不能，只確定外形改變","explanation":"體積近乎不變，不構成明顯壓縮。"},{"id":"D","text":"不能，因為液體不能改變外形","explanation":"液體本來就無固定外形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S022","stem":"照片中的固體邊緣看似不動，放大的粒子模型卻有小幅振動。兩者是否矛盾？","correct":"B","options":[{"id":"A","text":"矛盾，粒子一動整塊必立刻流走","explanation":"小幅振動不等於大尺度流動。"},{"id":"B","text":"不矛盾，兩種觀察描述不同尺度","explanation":"巨觀形狀可穩定，粒子仍在位置附近動。"},{"id":"C","text":"矛盾，固體只能在照片中存在","explanation":"固體可用巨觀及微觀描述。"},{"id":"D","text":"不矛盾，因為粒子不存在","explanation":"教材明確用粒子解釋物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S023","stem":"「氣體均勻填滿容器」中的「均勻」在基本模型中主要指什麼？","correct":"D","options":[{"id":"A","text":"每顆分子都變成容器一部分","explanation":"分子不會變成容器壁。"},{"id":"B","text":"每個分子永久停在固定格子","explanation":"氣體粒子持續運動。"},{"id":"C","text":"所有分子都擠在同一角落","explanation":"角落聚集不符合均勻分布。"},{"id":"D","text":"氣體分散至整個可用空間","explanation":"描述整體空間分布，不是永久位置。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S024","stem":"實驗紀錄寫「體積下降」，要用來支持同一份氣體可壓縮，下列何者必須排除？","correct":"A","options":[{"id":"A","text":"一部分氣體從出口流走","explanation":"氣體量減少也可使所占體積變小。"},{"id":"B","text":"容器外的標籤更換","explanation":"標籤更換不是樣品量改變。"},{"id":"C","text":"改用同樣精度的刻度","explanation":"等精度刻度不構成流失。"},{"id":"D","text":"觀察者換位置","explanation":"觀察位置本身不使氣體量改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S025","stem":"冰融化後，液態水仍困在原來形狀的模具內。沒有看出外形改變，是否代表沒有融化？","correct":"C","options":[{"id":"A","text":"是，外形必須大變才有融化","explanation":"模具可能限制液體的當時外形。"},{"id":"B","text":"是，模具內不可能有液體","explanation":"液體能存在於模具內。"},{"id":"C","text":"否，還要看內部運動或是否成為可流動液體","explanation":"外形受限時，僅看輪廓不足判斷狀態。"},{"id":"D","text":"否，所有有模具的樣品都是氣體","explanation":"模具不決定唯一物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S026","stem":"透明瓶中下部可見液態水，上部有氣態水。只問上部氣態水本身的形狀特性，何者正確？","correct":"B","options":[{"id":"A","text":"有自己的固定外形","explanation":"氣體沒有自身固定外形。"},{"id":"B","text":"取決於它可占據的上部空間","explanation":"已有液態水的空間不能再當作氣體容積。"},{"id":"C","text":"與瓶底液體外形永遠相同","explanation":"兩區占據的位置與邊界不同。"},{"id":"D","text":"必須先移去液體才有形狀","explanation":"可在氣液共存時描述氣體區域。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S027","stem":"甲杯只有少量液體，乙杯同種液體較多。哪一句對兩杯都適用，且不把「固定體積」誤解成全世界液體等體積？","correct":"D","options":[{"id":"A","text":"兩杯必須一樣多","explanation":"固定體積不是不同樣品量相等。"},{"id":"B","text":"兩杯液面必須同高","explanation":"液面還受容器和份量影響。"},{"id":"C","text":"較少的那杯不算液體","explanation":"少量液體仍有液態特性。"},{"id":"D","text":"各份樣品都有其自身的體積","explanation":"固定體積針對指定份量與條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S028","stem":"固體粒子旁的小短線表示原位附近振動。若把每顆粒子的箭頭全部改成跨越整個盒子，最可能造成哪個誤導？","correct":"A","options":[{"id":"A","text":"把受限振動畫成大範圍遷移","explanation":"箭頭範圍不再符合固體模型。"},{"id":"B","text":"表示固體有固定形狀","explanation":"跨盒位移反而削弱固定位置的表達。"},{"id":"C","text":"表示粒子數必定增加","explanation":"箭頭不代表新增粒子。"},{"id":"D","text":"表示容器消失","explanation":"容器是否存在與箭頭長度無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S029","stem":"在「固態水、液態水、氣態水」三個名稱中，前面的狀態詞最主要用來指出什麼？","correct":"C","options":[{"id":"A","text":"水分子含幾種新原子","explanation":"物態詞不改變分子組成。"},{"id":"B","text":"哪個一定含最多分子","explanation":"狀態不決定樣品總量。"},{"id":"C","text":"同一物質當時的物理表現","explanation":"三者仍是水，形狀體積與運動表現不同。"},{"id":"D","text":"哪個完全沒有粒子","explanation":"三態都有粒子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S030","stem":"只記到「溫度降低」，沒有任何物態觀察。下列哪一筆新增結論應暫緩寫入？","correct":"B","options":[{"id":"A","text":"溫度是影響物態的條件之一","explanation":"這由教材支持。"},{"id":"B","text":"已確定全部樣品轉成固態","explanation":"降溫不必然跨過相變條件。"},{"id":"C","text":"可以接著觀察形狀與流動","explanation":"這是合理補證方法。"},{"id":"D","text":"可能發生狀態改變","explanation":"可能性不等於已確認轉態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S031","stem":"氣體粒子正朝向密閉容器右壁運動。哪個教材觀念容許它後來出現在容器左側？","correct":"D","options":[{"id":"A","text":"分子一定會穿牆消失","explanation":"密閉壁不是開放出口。"},{"id":"B","text":"只有液體粒子能改變位置","explanation":"氣體粒子也持續運動。"},{"id":"C","text":"氣體粒子永遠只能直走一個方向","explanation":"碰撞可改變其運動方向。"},{"id":"D","text":"移動與碰撞使運動路徑改變","explanation":"氣體會撞壁與互撞，不固定單一路徑。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S032","stem":"要為「粒子彼此靠近」選一項相容的巨觀性質，下列何者最合理？","correct":"A","options":[{"id":"A","text":"通常不容易被明顯壓縮","explanation":"液體與固體皆粒子靠近且不易壓縮。"},{"id":"B","text":"必定沒有體積","explanation":"靠近的粒子集合仍占體積。"},{"id":"C","text":"必定充滿任意大容器","explanation":"這是氣體的典型行為。"},{"id":"D","text":"必定每個粒子完全不動","explanation":"液態可滑動，固態可振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S033","stem":"觀察窗內看不見液滴或冰塊，卻知道有氣態水。哪一句最符合教材圖1.4？","correct":"C","options":[{"id":"A","text":"看不見就等於沒有水","explanation":"氣態水本身不可見。"},{"id":"B","text":"氣態水必定由肉眼可見大球組成","explanation":"粒子模型不是肉眼尺寸。"},{"id":"C","text":"不可見不妨礙它仍為水的氣態","explanation":"可見性不是是否為水的判據。"},{"id":"D","text":"只有固態水才有H₂O","explanation":"各態水均保留H₂O身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S034","stem":"圖例中的solid、liquid、gas依序應讀成哪組中文？","correct":"B","options":[{"id":"A","text":"氣態、固態、液態","explanation":"三個英文名稱都配錯位置。"},{"id":"B","text":"固態、液態、氣態","explanation":"這是教材三態的名稱對應。"},{"id":"C","text":"液態、氣態、固態","explanation":"此順序不對應原英文。"},{"id":"D","text":"固態、氣態、液態","explanation":"後兩個名稱互換了。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S035","stem":"同學把固體模型想成粒子用位置框各自圈住。哪項補充能避免把模型誤解成絕對靜止？","correct":"D","options":[{"id":"A","text":"移除所有粒子","explanation":"這不再是固體粒子模型。"},{"id":"B","text":"把粒子改畫在盒外","explanation":"不能表達固體內部結構。"},{"id":"C","text":"要求各粒子每天只動一次","explanation":"教材沒有指定這種頻率。"},{"id":"D","text":"允許粒子在位置框附近小幅振動","explanation":"位置受限與微觀運動可同時存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S036","stem":"為冰融化的箭頭寫圖說，下列哪個內容應刪掉？","correct":"A","options":[{"id":"A","text":"水分子必先拆成氫氣與氧氣","explanation":"這不是融化的必要過程。"},{"id":"B","text":"終點為液態水","explanation":"這符合融化方向。"},{"id":"C","text":"粒子運動自由度增加","explanation":"液體粒子比固體更能相對移動。"},{"id":"D","text":"原先的固態形狀限制解除","explanation":"液態水不具有自身固定外形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S037","stem":"液體能連續通過彎曲管道，最能支持哪項判斷？","correct":"C","options":[{"id":"A","text":"液體沒有任何體積","explanation":"流動不取消體積。"},{"id":"B","text":"液體分子全都被拉成管道長度","explanation":"分子不需依管道伸長。"},{"id":"C","text":"液體外形能適應通過的區域","explanation":"能流動與無固定外形相容。"},{"id":"D","text":"液體能任意被壓縮至零","explanation":"流動不是無限壓縮。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S038","stem":"只想表現氣體在較小空間內仍為氣態，以下哪個圖說最應避免？","correct":"B","options":[{"id":"A","text":"粒子仍可移動","explanation":"壓縮後未轉態仍有氣體運動。"},{"id":"B","text":"分子必定全部黏成一整塊","explanation":"這誤加了凝聚或固化行為。"},{"id":"C","text":"粒子間距比原先小","explanation":"可描述氣體壓縮。"},{"id":"D","text":"單個分子的大小保持","explanation":"教材明示壓縮不改分子尺寸。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S039","stem":"一個容器被整個傾斜，裡面的單一固體塊滑出。僅這個動作能支持哪個結論？","correct":"D","options":[{"id":"A","text":"固體內粒子必定像液體滑動","explanation":"整塊滑動不揭示內部相對運動。"},{"id":"B","text":"固體一定已融化","explanation":"移出不等於融化。"},{"id":"C","text":"固體已均勻填滿容器","explanation":"滑出與氣體填滿不同。"},{"id":"D","text":"整塊樣品的位置改變了","explanation":"這是動作直接提供的資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S040","stem":"剛把氣體引入空容器入口，還沒有讓它散布開來。哪個描述較符合教材基本模型的使用方式？","correct":"A","options":[{"id":"A","text":"應給予散布時間後觀察整體分布","explanation":"教材的充滿描述不要求注入瞬間已均勻。"},{"id":"B","text":"注入瞬間未均勻就永遠不會均勻","explanation":"初始不均勻不能否定後續散布。"},{"id":"C","text":"氣體必在入口凝固","explanation":"沒有給出凝固條件。"},{"id":"D","text":"入口以外的空間不能容納氣體","explanation":"只要可達，氣體可進入。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S041","stem":"一般三態表中，一筆紀錄同時寫「固定形狀」與「倒入另一容器後自行流成新形」。沒有外力變形或相變，應先怎麼做？","correct":"C","options":[{"id":"A","text":"只憑字數較多的一句決定","explanation":"字數不決定觀察正確性。"},{"id":"B","text":"直接宣稱兩者必定都對","explanation":"兩句在既定條件下不相容。"},{"id":"C","text":"重新核對形狀測試與樣品狀態","explanation":"需先釐清矛盾，不能硬分類。"},{"id":"D","text":"刪除所有觀察重新猜","explanation":"應保留並查核證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S042","stem":"把水蒸氣模型中的完整H₂O小組彼此拉開，而每組內部保持原樣，這主要表示什麼？","correct":"B","options":[{"id":"A","text":"每個水分子已變成不同物質","explanation":"完整小組身分沒有改變。"},{"id":"B","text":"水分子之間距離增加","explanation":"變的是小組間的相對位置。"},{"id":"C","text":"水分子內原子已全部斷開","explanation":"題設明確保留小組內部。"},{"id":"D","text":"水分子數必定加倍","explanation":"拉開間距不代表新增小組。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S043","stem":"同一份水由液態變成氣態，資料表保留「物質名稱：水」。哪個欄位一定需要更新？","correct":"D","options":[{"id":"A","text":"來源書名","explanation":"物態改變不改教材名稱。"},{"id":"B","text":"樣品編號","explanation":"可用同編號追蹤同份樣品。"},{"id":"C","text":"觀察者姓名","explanation":"狀態變化不要求更換觀察者。"},{"id":"D","text":"物理狀態","explanation":"液態已變氣態，這個欄位必須更新。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S044","stem":"模具能讓液體暫時呈星形。這個星形主要由何者決定？","correct":"A","options":[{"id":"A","text":"模具中被液體占據的邊界","explanation":"液體依容器的局部空間成形。"},{"id":"B","text":"每個液體分子都是星形","explanation":"巨觀輪廓不表示個別分子形狀。"},{"id":"C","text":"液體必定具有永久星形","explanation":"沒有固定形狀意味外形可隨條件改變。"},{"id":"D","text":"液體已失去粒子運動","explanation":"受容器限制不表示停止內部滑動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S045","stem":"用「外形是否必須由當時容器限制」比較一般固體塊與氣體，哪句正確？","correct":"C","options":[{"id":"A","text":"兩者都只能有容器形狀","explanation":"固體塊保留自身形狀。"},{"id":"B","text":"兩者都一定忽略容器","explanation":"氣體外形取決於容器空間。"},{"id":"C","text":"固體塊可有自身外形，氣體則隨可達空間","explanation":"這區分兩者的形狀來源。"},{"id":"D","text":"兩者都必定呈球形","explanation":"三態性質不限定球形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S046","stem":"示意氣體的粒子相距遠。哪個附加字句會把這個正確特徵說過頭？","correct":"B","options":[{"id":"A","text":"粒子可移動","explanation":"符合氣體模型。"},{"id":"B","text":"容器內絕不可能有任何粒子互撞","explanation":"相距遠不阻止快速移動後碰撞。"},{"id":"C","text":"粒子可撞壁","explanation":"教材支持。"},{"id":"D","text":"粒子間有可縮減空間","explanation":"符合可壓縮性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S047","stem":"同一份水先後放進三個不同容器，三次都確認仍為液態。這份紀錄明確出現了什麼？","correct":"D","options":[{"id":"A","text":"三次不同物態","explanation":"題設三次均為液態。"},{"id":"B","text":"水分子身分必定改變","explanation":"換容器不提供化學改變證據。"},{"id":"C","text":"三次必然凝結","explanation":"沒有氣態起點證據。"},{"id":"D","text":"容器改變，但記錄的物態相同","explanation":"容器數量不等於物態數量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S048","stem":"要把固體粒子的「原位附近」畫成可理解的模型，何者合理？","correct":"A","options":[{"id":"A","text":"以每顆粒子的平均位置作小範圍活動中心","explanation":"此畫法表現受限振動。"},{"id":"B","text":"要求所有粒子共用同一個點","explanation":"粒子各有其位置，不重疊為一點。"},{"id":"C","text":"把附近定義為整個房間","explanation":"這不符合小幅振動。"},{"id":"D","text":"只顯示容器外的活動","explanation":"無法描述固體內部。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S049","stem":"流程圖寫「冰 → 液態水」但箭頭旁貼了「凝結」。最小而正確的修正是什麼？","correct":"C","options":[{"id":"A","text":"把液態水改成氫氣","explanation":"這會改成非單純相變。"},{"id":"B","text":"把冰改成不存在","explanation":"冰是有效起點。"},{"id":"C","text":"把凝結改成融化","explanation":"固態水轉為液態水是融化。"},{"id":"D","text":"只更換箭頭顏色","explanation":"配色不能修正名稱錯誤。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-S050","stem":"一般三態辨識卡只記「樣品無色」，下列哪項補充觀察最能直接推進物態判斷？","correct":"B","options":[{"id":"A","text":"名字有幾個字","explanation":"名稱長度不是物態性質。"},{"id":"B","text":"轉移後是否保留自身形狀與體積","explanation":"這直接使用三態的基本判據。"},{"id":"C","text":"標籤價格高低","explanation":"價格不是物態判據。"},{"id":"D","text":"拍照使用哪個字型","explanation":"字型不描述樣品性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-2-topic01-G02-B001","stem":"甲樣品完全填滿方形模具，當時外形固定。要檢驗這是否為樣品自身固定形狀，且不改變溫壓，最有判別力的是哪項操作？","correct":"B","options":[{"id":"A","text":"拍更多同一角度的照片","explanation":"同一限制下的照片無法區分容器與自身形狀。"},{"id":"B","text":"拆開模具並觀察樣品是否自行改形","explanation":"解除限制可檢驗樣品是否保留自身外形。"},{"id":"C","text":"只量模具外邊長","explanation":"這量的是容器。"},{"id":"D","text":"更換標籤後仍留在模具","explanation":"標籤不解除形狀限制。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B002","stem":"硬瓶內空間為120 mL，液體占35 mL。忽略溶解與相變，剩餘空間皆可由上方氣體到達。氣體區的體積應記為何？","correct":"D","options":[{"id":"A","text":"35 mL","explanation":"這是液體體積。"},{"id":"B","text":"120 mL","explanation":"其中35 mL已由液體占據。"},{"id":"C","text":"155 mL","explanation":"不能把液體加到固定容器空間之外。"},{"id":"D","text":"85 mL","explanation":"120−35＝85 mL，是剩餘可達空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B003","stem":"總容積分成甲30、乙40、丙50 mL三室。同一份待計氣體僅在甲、乙兩室，甲乙相通；丙室不含本份氣體且被不透氣隔板隔離。無相變，這份氣體充分分布後占多少容積？","correct":"A","options":[{"id":"A","text":"70 mL","explanation":"可到達甲乙兩室，30＋40＝70。"},{"id":"B","text":"120 mL","explanation":"丙室被隔離，不在可達範圍。"},{"id":"C","text":"30 mL","explanation":"忽略相通的乙室。"},{"id":"D","text":"50 mL","explanation":"這是被隔離的丙室。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B004","stem":"直壁容器甲底面積12 cm²，液體深2 cm；同份液體在同溫、壓力近似不變且無相變下，無損轉入底面積8 cm²的乙容器。給定V＝底面積×深度，乙液體深度應為何？","correct":"C","options":[{"id":"A","text":"2 cm","explanation":"若底面積變小仍等高，體積會減少。"},{"id":"B","text":"4 cm","explanation":"8×4＝32 cm³，不是原24 cm³。"},{"id":"C","text":"3 cm","explanation":"原V＝12×2＝24，24÷8＝3 cm。"},{"id":"D","text":"12 cm","explanation":"12是原底面積數值，不是高度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B005","stem":"密閉氣體模型有24顆粒子，壓縮後仍24顆。可用空間由12格變6格，每格體積相等。哪一項量增加？","correct":"B","options":[{"id":"A","text":"全盒粒子總數","explanation":"題設全盒仍24顆。"},{"id":"B","text":"每格平均粒子數","explanation":"24÷12＝2，24÷6＝4，平均值增加。"},{"id":"C","text":"單個分子的尺寸","explanation":"壓縮不要求分子變大。"},{"id":"D","text":"容器總格數","explanation":"總格數由12降為6。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B006","stem":"甲流程為冰融化成水；乙流程為水蒸氣凝結成水。下列哪項比較正確？","correct":"D","options":[{"id":"A","text":"兩流程起點的粒子都被鎖在固體位置","explanation":"乙起點為氣態，並非固態鎖定。"},{"id":"B","text":"兩流程都把H₂O拆開","explanation":"兩者皆為單純相變。"},{"id":"C","text":"兩流程都必使粒子間距大幅增加","explanation":"凝結使氣態粒子靠近。"},{"id":"D","text":"終點都可相對滑動，但起點的運動限制不同","explanation":"終點皆液態；固態與氣態起點不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B007","stem":"氣體在整盒充分分布，觀察者只追蹤固定小區域。某時刻4顆、稍後6顆，整盒始終密閉。哪個機制足以解釋局部增加？","correct":"A","options":[{"id":"A","text":"粒子移動穿過該區域的想像邊界","explanation":"局部區域可與盒內其他區域交換粒子。"},{"id":"B","text":"整盒必定新增2顆粒子","explanation":"局部變化不能直接當整盒總數變化。"},{"id":"C","text":"所有分子同時膨大","explanation":"尺寸變化不是計數增加的原因。"},{"id":"D","text":"密閉代表每個子區也不能交換","explanation":"想像邊界不是實體隔板。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B009","stem":"一份液體從寬盤移入窄管後，收集體積較少，並確認盤壁留有液體。哪項結論得到直接支持？","correct":"B","options":[{"id":"A","text":"液體沒有固定體積","explanation":"前後不是完整同份樣品，不能這樣推論。"},{"id":"B","text":"體積差可能來自未完整轉移","explanation":"殘留明確提供液體損失來源。"},{"id":"C","text":"液體一定被明顯壓縮","explanation":"未提供施壓及密閉證據。"},{"id":"D","text":"較少液體必定成為固體","explanation":"份量減少不決定物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B010","stem":"固體模型每顆粒子都繞自己的中心位置小幅往返。動畫編輯卻把所有中心位置隨機交換，再說只是振動。哪項修正必要？","correct":"D","options":[{"id":"A","text":"將粒子半徑增倍","explanation":"半徑不能修復中心位置交換。"},{"id":"B","text":"只把動畫播放慢一半","explanation":"放慢不改變粒子互換位置的本質。"},{"id":"C","text":"把所有粒子刪掉","explanation":"無粒子就無法說明模型。"},{"id":"D","text":"保留各中心位置，把小幅位移畫在中心附近","explanation":"這才表現固體受限振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B011","stem":"一塊恰好與小盒內腔等大的固體把盒子完全塞滿。有人據此用「填滿盒子」判定為氣體。哪個補充測試能直接揭露誤判？","correct":"A","options":[{"id":"A","text":"將它移到更大盒子，觀察是否自行擴展填滿","explanation":"固體仍保持自身體積，氣體則可擴散。"},{"id":"B","text":"只量原盒是否真的滿","explanation":"偶然塞滿仍不能區分。"},{"id":"C","text":"確認盒子不是透明的","explanation":"透明與否不影響狀態判準。"},{"id":"D","text":"以更大的字寫滿盒","explanation":"重寫結論不增加證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B012","stem":"兩份水蒸氣最後所占空間都變小。只補充哪項觀察最能區分「仍為氣體」與「已凝結成液體」？","correct":"C","options":[{"id":"A","text":"瓶外顏色是否改變","explanation":"顏色不直接提供物態判據。"},{"id":"B","text":"試驗日期是否相同","explanation":"日期相同仍可有不同物態。"},{"id":"C","text":"終態粒子是否仍疏遠，或已靠近且可滑動","explanation":"這直接區分氣態與液態模型。"},{"id":"D","text":"總樣品編號是否換過","explanation":"編號不是物態證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B013","stem":"密閉模型中，水由冰全部融化，所有H₂O圖示數量和結構保留。哪項新增動畫最符合融化後？","correct":"B","options":[{"id":"A","text":"全部H₂O仍永遠保持原鄰居","explanation":"這保留了固態固定相對位置的限制。"},{"id":"B","text":"H₂O彼此靠近但能更換鄰居","explanation":"液態允許相對滑動。"},{"id":"C","text":"H₂O全部變成H₂和O₂","explanation":"這不是融化。"},{"id":"D","text":"只有空盒在動，分子不存在","explanation":"這不能表現液態水。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B014","stem":"模型把容器分四格，長時間平均每格粒子數相近。有人說每顆粒子必永久停在自己那格，才能保持均勻。何者正確？","correct":"D","options":[{"id":"A","text":"平均相近表示粒子沒有碰撞","explanation":"平均分布不排除碰撞。"},{"id":"B","text":"永久不動才有氣態","explanation":"氣態恰有持續運動。"},{"id":"C","text":"四格一定要用牆隔開","explanation":"實體隔牆不是均勻分布的必要條件。"},{"id":"D","text":"粒子可跨格交換，平均分布仍可相近","explanation":"均勻是統計分布，不是固定個體位置。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B015","stem":"同一份液體在同溫、壓力近似不變且無相變下，無損放入甲乙容器。甲容量50 mL時約占一半；乙容量100 mL時約占四分之一。哪個結論正確？","correct":"A","options":[{"id":"A","text":"兩次液體都是約25 mL","explanation":"50×1/2與100×1/4皆為25；原占比為約數，所以體積也保留「約」。"},{"id":"B","text":"乙液體是甲的一半","explanation":"不能只比較占容器比例而忽略容量。"},{"id":"C","text":"乙液體體積加倍","explanation":"容量加倍不代表液體量加倍。"},{"id":"D","text":"兩次都必定是氣體","explanation":"液體可只占部分容器，比例變而量不變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B016","stem":"固體樣品敲裂為三塊，每塊仍保持自身形狀，粒子模型仍顯示原位附近振動。對這次觀察，何者最完整？","correct":"C","options":[{"id":"A","text":"裂成多塊等於氣化","explanation":"氣態需要不同體積及運動特徵。"},{"id":"B","text":"裂成多塊等於液化","explanation":"題設仍保留固態特徵。"},{"id":"C","text":"塊數改變，但證據仍支持各塊為固體","explanation":"外力破碎不等於內部粒子轉為液態。"},{"id":"D","text":"原位振動證明每塊是液體","explanation":"固體振動不等於滑動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B017","stem":"一張圖畫「水蒸氣 → 液態水」，註明凝結。學生把箭頭反向閱讀後仍稱凝結。哪項修改正確？","correct":"B","options":[{"id":"A","text":"保留名稱，方向完全不影響相變","explanation":"方向決定起終態，不能忽略。"},{"id":"B","text":"反向是液態變氣態，不能仍稱凝結","explanation":"凝結特指氣態到液態。"},{"id":"C","text":"反向一定生成氫氣","explanation":"液態到氣態可仍為水。"},{"id":"D","text":"把兩端都改成固體","explanation":"這不保留原圖資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B018","stem":"液體薄袋被輕壓後高度降低、寬度增加，獨立測得液體體積不變。哪個粒子模型最相容？","correct":"D","options":[{"id":"A","text":"每顆粒子被壓扁","explanation":"巨觀變扁不表示粒子變扁。"},{"id":"B","text":"粒子消失一半","explanation":"體積與份量未損不支持消失。"},{"id":"C","text":"粒子間距變成氣體般大","explanation":"題設仍是液體且體積不變。"},{"id":"D","text":"粒子保持靠近並滑動重排外形","explanation":"這可改外形而保留液體體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B019","stem":"氣體在透明硬瓶中呈瓶內輪廓，液體在模具中也呈模具輪廓。兩者這項觀察共同缺少什麼，不能據此認定有自身固定形狀？","correct":"A","options":[{"id":"A","text":"解除或更換幾何限制後的表現","explanation":"目前輪廓可由容器強制產生。"},{"id":"B","text":"樣品標籤的售價","explanation":"價格不屬形狀證據。"},{"id":"C","text":"觀察者年齡","explanation":"年齡不改物態判據。"},{"id":"D","text":"容器外標誌","explanation":"外標誌不證明樣品自身形狀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B020","stem":"甲粒子位移很小但頻繁往返；乙粒子靠近且可以持續滑過鄰居。不能只用「都有運動」合併為同態，主要原因是什麼？","correct":"C","options":[{"id":"A","text":"速度一樣就一定同態","explanation":"題目沒有速度相同證據，且限制也重要。"},{"id":"B","text":"運動中的粒子一定都是氣態","explanation":"液態、固態也有運動。"},{"id":"C","text":"運動是否局限在各自位置附近不同","explanation":"位置限制區分固態振動與液態滑動。"},{"id":"D","text":"粒子靠近就不可能運動","explanation":"液態、固態皆可動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B021","stem":"氣體由一室擴展進入相通空室，擴展後仍為氣體。把「原室粒子數較少」解釋為分解，還缺少何種關鍵查核？","correct":"B","options":[{"id":"A","text":"只看空室外牆","explanation":"不能追蹤粒子身分。"},{"id":"B","text":"檢查完整兩室的粒子總數與身分","explanation":"粒子可能只是轉移到新增空間。"},{"id":"C","text":"把原室縮小一倍","explanation":"改容器不能取代觀測。"},{"id":"D","text":"把原室粒子畫大","explanation":"尺寸不解決總數與身分問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B022","stem":"同一份液體換容器時，除了形狀不同，實驗還使它部分變為氣態。只比較剩餘液體體積，能否驗證「液體體積與容器無關」？","correct":"D","options":[{"id":"A","text":"可以，剩多少都能代表原份量","explanation":"剩餘液態量已改變。"},{"id":"B","text":"可以，部分氣化不影響液體部分量","explanation":"液態水轉出會減少液態部分。"},{"id":"C","text":"不可以，因為任何液體都沒有體積","explanation":"液體確有體積。"},{"id":"D","text":"不可以，需排除相變或把各部分完整追蹤","explanation":"不能混淆容器作用與相變造成的份量改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B023","stem":"兩張密閉氣體示意圖各畫10個完整相同分子。後圖外框各邊在紙上縮為前圖一半；標示相同實際長度的比例尺線段，在紙上也縮為一半。何者正確？","correct":"A","options":[{"id":"A","text":"紙上縮小不足證明真實壓縮","explanation":"外框的紙面長度與表示相同實際長度的比例尺同步縮放；還原後的長度未因此減少。"},{"id":"B","text":"必定真實體積減半","explanation":"須依尺度還原，不能看紙面大小。"},{"id":"C","text":"分子必定減少","explanation":"兩圖均為10個。"},{"id":"D","text":"必定發生凝結","explanation":"未有終態液體特徵。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B024","stem":"資料表只列「可流動」與「形狀隨容器」。想避免把液體與氣體混淆，下一欄最適合增加什麼？","correct":"C","options":[{"id":"A","text":"容器的牌子","explanation":"品牌不能區分液氣。"},{"id":"B","text":"觀察照片張數","explanation":"張數不是物態特徵。"},{"id":"C","text":"同份樣品是否自行擴展占滿更大的空間","explanation":"氣體可擴展，液體維持自身體積。"},{"id":"D","text":"樣品名稱字數","explanation":"字數不屬物理性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B025","stem":"模型中上下兩區都用完整H₂O小組，上區疏遠且可到處移動，下區靠近且可滑動。哪項描述最適合？","correct":"B","options":[{"id":"A","text":"上下必須是同一物態，因分子相同","explanation":"相同分子可處於不同物態。"},{"id":"B","text":"上為氣態水、下為液態水，可共享水分子身分","explanation":"間距及運動可不同，H₂O仍相同。"},{"id":"C","text":"上區必定是H₂和O₂","explanation":"完整H₂O與此不同。"},{"id":"D","text":"下區一定完全靜止","explanation":"液態仍可滑動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B026","stem":"測試液體壓縮性時，液體內有一顆可見氣泡。推壓後體積下降，且氣泡明顯變小。要改善這個測試，最優先的處理為何？","correct":"D","options":[{"id":"A","text":"只增加容器刻度字體","explanation":"這不去除氣泡造成的影響。"},{"id":"B","text":"把總體積下降全算液體壓縮","explanation":"題設已有氣泡縮小的直接證據。"},{"id":"C","text":"將液體先全部氣化","explanation":"這改變了原待測狀態。"},{"id":"D","text":"排除氣泡後在相同條件重測","explanation":"可避免將氣體壓縮誤算成液體壓縮。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B027","stem":"未知單一樣品在一般三態中，先確認能保持自身外形。若量測又顯示可像氣體般大幅改變體積，下一步何者最妥當？","correct":"A","options":[{"id":"A","text":"查核兩次是否為同一樣品、同一物態及一致的比較條件","explanation":"同一物態的兩項紀錄與一般三態表衝突，應先核對樣品和條件，而非直接套入另一狀態。"},{"id":"B","text":"直接認定是普通液體","explanation":"液體本無自身固定外形。"},{"id":"C","text":"直接認定是普通氣體","explanation":"氣體不具有自身固定外形。"},{"id":"D","text":"刪掉形狀結果只留另一項","explanation":"應釐清衝突，不能任意選證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B028","stem":"觀察甲樣品有固定外形；模型乙畫疏遠粒子在全盒快速移動。若兩者被說成同一份普通固體，哪個問題最直接？","correct":"C","options":[{"id":"A","text":"固定外形表示沒有粒子","explanation":"固體仍有粒子。"},{"id":"B","text":"全盒移動是固體振動的必要表現","explanation":"固體通常限於位置附近振動。"},{"id":"C","text":"模型的運動限制與巨觀固體性質不相容","explanation":"疏遠全盒移動較符合氣態。"},{"id":"D","text":"模型粒子必須畫成實物顏色","explanation":"配色不是此處核心問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B029","stem":"甲乙兩瓶可達內空間相同，且各有氣體充滿。只由「占同樣容積」能推出哪項結論？","correct":"B","options":[{"id":"A","text":"兩瓶分子總數一定相同","explanation":"本節沒有提供溫壓或數量條件，不能推總數。"},{"id":"B","text":"兩瓶氣體當時占據的空間量相同","explanation":"這是題設直接提供的資訊。"},{"id":"C","text":"兩瓶每顆分子的大小一定相同","explanation":"容器空間不決定分子尺寸。"},{"id":"D","text":"兩瓶都具有自身固定體積","explanation":"氣體體積相同可只是相同容器限制。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B030","stem":"液態水先移入窄杯，再降溫直至觀察到固態。若要知道外形改變出現在哪一步，哪種紀錄最有用？","correct":"D","options":[{"id":"A","text":"只存最後照片","explanation":"最後照片不能分離兩步變化。"},{"id":"B","text":"只記杯子的品牌","explanation":"品牌不能提供轉態時間。"},{"id":"C","text":"只記最初液體量","explanation":"份量不給兩個步驟的狀態。"},{"id":"D","text":"在換杯後、降溫後各記形狀及物態","explanation":"分步觀察可區分容器改形與相變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B031","stem":"甲粒子靠近且能滑動，乙粒子疏遠並移至容器各處。下列哪項可同時描述甲乙，而無法單靠它區分兩者？","correct":"A","options":[{"id":"A","text":"沒有自身固定外形","explanation":"液態與氣態都符合。"},{"id":"B","text":"能保有固定體積","explanation":"乙為氣態，不符合。"},{"id":"C","text":"容易被明顯壓縮","explanation":"甲為液態，通常不符合。"},{"id":"D","text":"粒子長期受限於原位附近","explanation":"兩者都不是典型固態模型。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B032","stem":"追蹤某固體粒子相對自身平均位置的坐標依序為0、+0.02、0、−0.02、0。哪項是這筆紀錄的恰當摘要？","correct":"C","options":[{"id":"A","text":"完全沒有動過","explanation":"中間坐標明顯改變。"},{"id":"B","text":"沿一方向離開位置不再返回","explanation":"紀錄反覆回到零。"},{"id":"C","text":"在固定位置附近往返運動","explanation":"位移小且有正負往返，符合振動。"},{"id":"D","text":"已證明整塊固體變成氣體","explanation":"一筆局部振動不支持氣化。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B033","stem":"液體中圈定一個想像區域。連續追蹤顯示原先的粒子逐漸被其他同種粒子取代，樣品體積仍近乎固定。哪項解釋最符合？","correct":"B","options":[{"id":"A","text":"固定體積要求每區粒子永不移動","explanation":"固定體積不等於固定個體位置。"},{"id":"B","text":"液體粒子可滑動進出局部區域","explanation":"這與液體體積近乎固定相容。"},{"id":"C","text":"換鄰居就等於化學分解","explanation":"改相對位置不必改粒子身分。"},{"id":"D","text":"液體必須先變氣體才能移動","explanation":"液態本來可相對移動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B034","stem":"兩個腔室對外密閉，但中間有可開關通道。把通道打開後，氣體可在兩室間移動。哪個說法正確？","correct":"D","options":[{"id":"A","text":"對外密閉表示內部通道也永遠封閉","explanation":"內外邊界是不同限制。"},{"id":"B","text":"打開內部通道必使分子數減少","explanation":"沒有對外出口，不因此減少總數。"},{"id":"C","text":"氣體只能留在原室","explanation":"開通道後另一室可達。"},{"id":"D","text":"兩室合為可達空間，總系統仍可保持密閉","explanation":"內部重新分布不等於流失。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B035","stem":"同一份液體由杯A完整倒入杯B，再倒回杯A，各次溫壓與物態相同。回A時外形恢復，哪項解釋最合理？","correct":"A","options":[{"id":"A","text":"容器再次提供相同的形狀限制","explanation":"這不要求液體記住先前形狀。"},{"id":"B","text":"液體具有記憶並變成固體","explanation":"題設仍為液態，無固化證據。"},{"id":"C","text":"H₂O必先分解再重新組合","explanation":"普通轉移不需要化學變化。"},{"id":"D","text":"液體回到A後體積必為零","explanation":"回杯不使物質消失。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B036","stem":"甲影片粒子靠近但能互換位置，乙影片粒子疏遠、方向持續改變。若挑選「可容易壓縮且能自行擴展填滿大盒」的樣品，應選哪個？","correct":"C","options":[{"id":"A","text":"甲，因能移動即易壓縮","explanation":"液體能動但粒子靠近，不易壓縮。"},{"id":"B","text":"甲乙皆可，因方向可變","explanation":"方向變化不是大幅壓縮判據。"},{"id":"C","text":"乙，因粒子間空間較大且能分布到全盒","explanation":"微觀特徵支持氣體兩項性質。"},{"id":"D","text":"皆不可，因移動會阻止壓縮","explanation":"氣體移動與壓縮可同時成立。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B037","stem":"實驗保持壓力固定，只改變溫度，最後觀察到冰融化。有人說這違反「溫度或壓力可引發相變」。何者正確？","correct":"B","options":[{"id":"A","text":"確實違反，溫壓必須一起改","explanation":"教材用或，沒有要求同時。"},{"id":"B","text":"沒有違反，改變其中一項可以造成轉態","explanation":"溫度改變符合教材所述可能條件。"},{"id":"C","text":"確實違反，冰不能融化","explanation":"冰融化是教材範例。"},{"id":"D","text":"沒有違反，因任何升溫都必融化","explanation":"能引發不等於每次都必發生。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B038","stem":"同一份密閉氣體全程仍為氣態、無反應。長方體容器的長與寬保持不變，高度由8 cm降至4 cm。給定體積＝長×寬×高，下列何者正確？","correct":"D","options":[{"id":"A","text":"單個分子直徑必減半","explanation":"外框高度改變不表示分子縮小。"},{"id":"B","text":"粒子總數必減半","explanation":"密閉同份量不因壓縮減少粒子。"},{"id":"C","text":"各個粒子運動都停止","explanation":"仍為氣態時不會因此全停。"},{"id":"D","text":"容器可用體積減半","explanation":"長寬固定，體積與高度成正比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B039","stem":"教材把看不見的水分子放大畫在氣體容器中。學生量出紙上球的直徑，直接說是真實水分子大小。問題是什麼？","correct":"A","options":[{"id":"A","text":"未有真實比例尺，示意尺寸不能直接當實際尺寸","explanation":"放大示意需尺度才能換回真實長度。"},{"id":"B","text":"氣態水沒有分子可畫","explanation":"氣態水仍有水分子。"},{"id":"C","text":"分子只有液態才有大小","explanation":"各態的分子都有尺寸。"},{"id":"D","text":"用直尺永遠不能量任何圖","explanation":"有明確比例尺的圖可量，問題在缺尺度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B040","stem":"某粒子在一個位置附近反覆振動，觀察者只截取它通過中心的畫面做成靜圖。若要完整呈現固體模型，最應補什麼？","correct":"C","options":[{"id":"A","text":"把粒子改畫到盒外","explanation":"這偏離原位附近運動。"},{"id":"B","text":"宣稱照片外的時間都不動","explanation":"沒有這項證據。"},{"id":"C","text":"加上振動範圍或前後連續位置","explanation":"能顯示靜圖省略的微小運動。"},{"id":"D","text":"加上氣體填滿全盒的標籤","explanation":"這與受限振動不相容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B041","stem":"上方氣體粒子畫得稀疏、下方液體粒子畫得密集。若題目只處理三態，哪項圖說最合適？","correct":"B","options":[{"id":"A","text":"下區粒子靠近表示完全不能移動","explanation":"液體仍可滑動。"},{"id":"B","text":"兩區粒子間距及可占空間的方式不同","explanation":"這是氣液兩態的基本比較。"},{"id":"C","text":"上區的小球都是容器上的污點","explanation":"圖例已定義為粒子。"},{"id":"D","text":"下區一定是固體，因粒子密集","explanation":"密集也可能液態，需看運動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B042","stem":"柔性密閉袋的外形改變，但量測可用容積相同，袋內始終為氣體。哪項判斷適當？","correct":"D","options":[{"id":"A","text":"氣體分子形狀隨袋變形","explanation":"巨觀輪廓不改分子形狀。"},{"id":"B","text":"沒有體積改變就證明氣體有固定形狀","explanation":"形狀和體積是不同性質。"},{"id":"C","text":"袋變形必造成全部凝結","explanation":"沒有液態特徵證據。"},{"id":"D","text":"氣體可換外形而體積這次剛好不變","explanation":"無固定體積不表示每次操作體積都必改。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B043","stem":"兩幅圖的粒子間距同樣小，甲加上可滑過鄰居的箭頭，乙加上局限各位置的小往返線。若僅保留間距欄，會失去哪種判別資訊？","correct":"A","options":[{"id":"A","text":"是否能持續更換相對位置","explanation":"運動限制是液固的重要差異。"},{"id":"B","text":"粒子是否存在","explanation":"兩圖原本都有粒子。"},{"id":"C","text":"容器文字是否繁體中文","explanation":"語言不是此處物態維度。"},{"id":"D","text":"每個粒子的化學式一定不同","explanation":"間距或箭頭不要求化學式不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B044","stem":"同一份水蒸氣全部凝結為液體。只依本節，不用任何物性表，哪項預測最可靠？","correct":"C","options":[{"id":"A","text":"液體可任意擴展填滿更大空間","explanation":"這是氣體特性。"},{"id":"B","text":"液體粒子全部停止","explanation":"液體仍可快速移動與滑動。"},{"id":"C","text":"粒子靠近，樣品較不易明顯壓縮","explanation":"終態液體的典型性質支持此預測。"},{"id":"D","text":"每個H₂O變成兩個H₂O","explanation":"凝結不複製分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B045","stem":"未知樣品一次倒入杯中恰好填滿，另一次轉入較大杯只占底部且量不變。第二次觀察使哪項推論更合理？","correct":"B","options":[{"id":"A","text":"第一次填滿已足以證明氣態","explanation":"第二次顯示不自行擴展。"},{"id":"B","text":"樣品較符合液體的固定體積和可變外形","explanation":"第二次提供容量改變下的關鍵區分。"},{"id":"C","text":"兩次不可能是同份樣品","explanation":"量不變且可變外形並不矛盾。"},{"id":"D","text":"第二次必把分子壓小","explanation":"沒有施壓或分子尺寸證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B046","stem":"研究者替模型的每個H₂O編號，冰融化後各編號仍存在，但位置順序改變。哪句可同時解釋兩項觀察？","correct":"D","options":[{"id":"A","text":"編號不變表示位置也不能變","explanation":"身分與位置是不同資訊。"},{"id":"B","text":"順序改變表示每個分子都分解","explanation":"位置順序改變不等於分子破壞。"},{"id":"C","text":"編號只是證明樣品仍固態","explanation":"編號可用於任何物態。"},{"id":"D","text":"分子身分保留，液態允許更大相對運動","explanation":"這把化學身分與物態改變分開。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B048","stem":"兩個不變形固體塊相隔擺放，外面包絡它們的最小長方盒較大。把兩塊靠攏後外框縮小。能否用此外框變化證明固體本身被明顯壓縮？","correct":"C","options":[{"id":"A","text":"能，外框就是兩塊材料的體積","explanation":"外框還包括兩塊間空隙。"},{"id":"B","text":"能，靠攏必使粒子消失","explanation":"宏觀移動不減少粒子。"},{"id":"C","text":"不能，需分開材料本身體積和塊間空隙","explanation":"減少的可能只是樣品塊之間的空間。"},{"id":"D","text":"不能，因為固體沒有體積","explanation":"固體具有體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B049","stem":"資料只說某物質由條件甲改到條件乙，沒有甲乙的溫度、壓力或物態。哪項預測超過現有資料？","correct":"B","options":[{"id":"A","text":"可再記錄形狀與體積","explanation":"這是補充觀察方法。"},{"id":"B","text":"末態必定為氣體","explanation":"沒有足夠條件可決定終態。"},{"id":"C","text":"溫壓變化可能與轉態有關","explanation":"教材支持可能關係。"},{"id":"D","text":"需補前後物態證據","explanation":"這符合資訊不足的狀況。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B050","stem":"分類表假設比較同份樣品、一般條件且沒有外力永久變形。若測試時把固體用力壓扁，最應在報告加哪項說明？","correct":"D","options":[{"id":"A","text":"固體定義已失效","explanation":"異常操作不直接否定一般三態比較。"},{"id":"B","text":"所有固體都是液體","explanation":"外力改形不等於液態。"},{"id":"C","text":"可刪掉使用外力的紀錄","explanation":"操作條件正是判讀所需資訊。"},{"id":"D","text":"這次改形含外力作用，不是無限制時自行改形","explanation":"應把主動變形和自身形狀穩定性分開。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B051","stem":"圖的橫軸為不同容器容量，縱軸為同份液體的體積；各次在同溫、壓力近似不變、無損失且未轉態的條件下比較。符合本節的圖線應如何？","correct":"A","options":[{"id":"A","text":"在適用容器容量範圍內大致水平","explanation":"液體體積不因換容器而變。"},{"id":"B","text":"通過原點隨容器容量等比例增加","explanation":"這會把液體誤當成總是填滿容器的樣品。"},{"id":"C","text":"必定降到負體積","explanation":"體積不能是負量。"},{"id":"D","text":"容器越大液體體積一定為零","explanation":"容器變大不使液體消失。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B052","stem":"橫軸為可到達的容器空間，縱軸為充分分布後氣體占據的空間，兩軸同體積單位且仍維持氣態。下列哪組點相容？","correct":"C","options":[{"id":"A","text":"(20,5)、(40,5)、(60,5)","explanation":"這未呈現氣體占滿可達空間。"},{"id":"B","text":"(20,0)、(40,0)、(60,0)","explanation":"有氣體不等於體積為零。"},{"id":"C","text":"(20,20)、(40,40)、(60,60)","explanation":"氣體占據全部可達容器空間。"},{"id":"D","text":"(20,60)、(40,80)、(60,100)","explanation":"所占空間不能超過可達容器容量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B053","stem":"硬瓶原有液體與上方氣體，現在加入10 mL液體。假設液體體積可相加、忽略液體壓縮、溶解與相變，全程沒有化學反應，且原氣體沒有逸出。氣體可占空間如何改變？","correct":"B","options":[{"id":"A","text":"氣體分子必減少","explanation":"未有氣體出口或反應。"},{"id":"B","text":"氣體可用空間減少10 mL","explanation":"新增液體占去了相同大小的空間。"},{"id":"C","text":"瓶內總空間增加10 mL","explanation":"剛性瓶的內部空間保持。"},{"id":"D","text":"單顆氣體分子縮小10 mL","explanation":"容積差不是分子本體大小的改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B054","stem":"從硬瓶抽走一部分氣體後關閉閥門，剩下的氣體仍維持氣態並充分散布。哪個圖像正確？","correct":"D","options":[{"id":"A","text":"剩餘氣體只維持原先一小角落","explanation":"氣體仍會分布於可達全瓶。"},{"id":"B","text":"剩餘每個分子縮小為原來一半","explanation":"抽氣不使分子尺寸必變。"},{"id":"C","text":"瓶中空出完全不能到達的區域","explanation":"未有隔板，空間仍可達。"},{"id":"D","text":"較少的粒子仍分散於全瓶空間","explanation":"粒子總量減少不表示所占容器範圍縮成局部。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B055","stem":"兩份樣品分別為液體與氣體，無相變。各取一部分放入遠大於其原占量的容器，達穩定後何者會自行占滿新增可達空間？","correct":"A","options":[{"id":"A","text":"氣體部分","explanation":"氣體沒有固定體積，可擴展。"},{"id":"B","text":"液體部分","explanation":"液體保留指定份量的體積。"},{"id":"C","text":"兩者必定都占滿","explanation":"不能由分裝推出液體無固定體積。"},{"id":"D","text":"兩者必定只貼原小區域","explanation":"氣體可進入新增空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B056","stem":"動畫中氣體分子撞到另一分子後改變方向，但數量、尺寸與結構不變。這一格是否必須畫成化學反應？","correct":"C","options":[{"id":"A","text":"必須，任何碰撞都拆分子","explanation":"本節的氣體運動碰撞不表示每次反應。"},{"id":"B","text":"必須，改方向就改化學身分","explanation":"方向是運動資訊。"},{"id":"C","text":"不必，普通運動碰撞足以解釋","explanation":"題設沒有分子結構改變。"},{"id":"D","text":"不必，因碰撞時粒子都不存在","explanation":"碰撞是粒子互動，不是消失。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B057","stem":"甲乙為不同形狀且沒有刻度的容器，液面在照片中等高。若想比較液體量，哪項主張最合理？","correct":"B","options":[{"id":"A","text":"等高必定等體積","explanation":"不同容器的橫截面可能不同。"},{"id":"B","text":"需知道容器內部形狀或另量體積","explanation":"液面高度單獨不足決定體積。"},{"id":"C","text":"較亮的照片液體一定較多","explanation":"亮度不是量的依據。"},{"id":"D","text":"液體無固定體積所以永遠不能量","explanation":"液體有可測量體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B058","stem":"三張新繪的水三態示意圖分別畫6、20、18個H₂O，但沒有交代圖示與真實分子數的比例，也不確定是否涵蓋各樣品全部。能否直接用圖示個數比較三份實際樣品的水分子總數？","correct":"D","options":[{"id":"A","text":"能，圖上最少就是整份最少","explanation":"未有代表全樣品的條件。"},{"id":"B","text":"能，氣態物質天生粒子少","explanation":"總數取決於樣品量，不由物態決定。"},{"id":"C","text":"不能，因氣態水沒有粒子","explanation":"氣態水仍有粒子。"},{"id":"D","text":"不能，須先釐清各圖代表範圍與計數比例","explanation":"不同示意範圍不適合直接比總量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B059","stem":"一份水蒸氣凝結成液態水。在一般三態模型中，比較凝結前後的「自身固定形狀」與「固定體積」，哪一組前後變化正確？","correct":"B","options":[{"id":"A","text":"形狀由固定轉為不固定；體積前後都固定","explanation":"氣態原本就沒有自身固定形狀及固定體積；兩個起點都判錯。"},{"id":"B","text":"形狀前後都不固定；體積由不固定轉為固定","explanation":"氣體與液體都隨容器改變形狀；液體比氣體多了固定體積這項性質。"},{"id":"C","text":"形狀由不固定轉為固定；體積前後都不固定","explanation":"液體並未取得固體般的自身固定形狀，而且液態具有固定體積。"},{"id":"D","text":"形狀與體積前後都不固定","explanation":"這保留了氣態的體積描述，漏掉凝結後液體的固定體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B060","stem":"某固體完全融成液體，沒有後續氣化。只依一般三態表，哪一項可以同時描述相變前後的樣品？","correct":"C","options":[{"id":"A","text":"都具有自身固定外形","explanation":"液態不具自身固定形狀。"},{"id":"B","text":"都可任意填滿大空間","explanation":"固態液態均有各自體積。"},{"id":"C","text":"通常都不容易被明顯壓縮","explanation":"固態與液態皆是靠近的粒子系統。"},{"id":"D","text":"粒子都只能固定原位不動","explanation":"液體可滑動，固體也可振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B061","stem":"某圖中兩顆氣體粒子偶然很靠近，但盒中其餘粒子仍疏遠。能否只量這一對間距就宣稱整份氣體已被壓縮？","correct":"B","options":[{"id":"A","text":"能，任何一對靠近都代表全盒變小","explanation":"局部相遇不能代全體或容器資料。"},{"id":"B","text":"不能，須看可用體積或具代表性的全體間距","explanation":"碰撞可讓一對短暫接近。"},{"id":"C","text":"能，兩顆靠近表示分子變小","explanation":"間距與尺寸不同。"},{"id":"D","text":"不能，因氣體粒子不可能靠近","explanation":"氣體會互撞，短暫靠近可能。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B062","stem":"某樣品體積近乎固定且不易壓縮。觀察者還想標示「粒子只能原位振動」。最需要哪項額外資訊？","correct":"D","options":[{"id":"A","text":"樣品標籤大小","explanation":"標籤無法區分液固。"},{"id":"B","text":"容器價格","explanation":"價格不提供運動證據。"},{"id":"C","text":"外部燈光明暗","explanation":"亮度不是基本物態判據。"},{"id":"D","text":"樣品自身形狀或內部相對運動","explanation":"前兩項是液固共同特徵，需補區分資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B063","stem":"同一份密閉氣體沒有進出、反應或相變。動畫以固定比例畫全部粒子，活塞內移後卻刪掉一半粒子來表示壓縮。哪項修正必要？","correct":"A","options":[{"id":"A","text":"讓粒子重新分布在縮小空間內並保留總數","explanation":"活塞壓縮不消滅氣體粒子。"},{"id":"B","text":"保留刪除，因活塞碰到就消失","explanation":"碰到邊界不代表物質消滅。"},{"id":"C","text":"把被刪粒子都改成液體","explanation":"題設未轉態，不能擅自增加液態。"},{"id":"D","text":"將所有粒子固定在活塞上","explanation":"氣體粒子仍能運動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B064","stem":"模型前圖每個小組含一個O連兩個H，後圖仍如此，但小組由疏遠變靠近且可滑動。最符合哪種描述？","correct":"C","options":[{"id":"A","text":"每組已失去水分子身分","explanation":"小組結構保留。"},{"id":"B","text":"只有容器換顏色","explanation":"題設提供了間距及動態改變。"},{"id":"C","text":"水由氣態變液態，未把分子拆開","explanation":"微觀終態支持凝結。"},{"id":"D","text":"水由液態變固態且完全不動","explanation":"前態疏遠是氣態，後態仍可滑動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B065","stem":"往杯中再加入同種液體，液體總體積增加。這是否反駁液體有固定體積？","correct":"B","options":[{"id":"A","text":"是，任何增加體積都否定液態","explanation":"固定體積需限定同份樣品。"},{"id":"B","text":"否，增加樣品量後不是原先同一份量","explanation":"新液體加入可增加總占量。"},{"id":"C","text":"否，因新增液體沒有體積","explanation":"加入的液體也有體積。"},{"id":"D","text":"是，加液必使原液體變氣體","explanation":"沒有氣化證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B066","stem":"題目要用氣體模型解釋壓縮後間距縮短，卻未交代是否發生凝結。哪項補充最能確保仍適合單純氣體壓縮的題意？","correct":"D","options":[{"id":"A","text":"題目字體改大","explanation":"不能補物態條件。"},{"id":"B","text":"讓容器照片更亮","explanation":"明亮不證明仍為氣態。"},{"id":"C","text":"換成另一個名字","explanation":"名稱不決定終態。"},{"id":"D","text":"明確給出全程維持氣態、沒有進出或反應","explanation":"這固定了純壓縮的樣品及物態條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B067","stem":"一顆固體粒子在實驗室坐標向右移5.02單位，同一時間整塊固體向右移5.00單位。相對整塊樣品的位移是多少？","correct":"A","options":[{"id":"A","text":"+0.02單位","explanation":"5.02−5.00＝0.02，扣除整體平移。"},{"id":"B","text":"+10.02單位","explanation":"應相減，不是相加。"},{"id":"C","text":"+5.02單位","explanation":"這仍包含整塊平移。"},{"id":"D","text":"−5.00單位","explanation":"這是錯把整體位移直接取負。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter >
