ns":[{"id":"A","text":"兩者皆為純水","explanation":"錯誤（本題不選）：乙未形成H₂O，不能稱純水。"},{"id":"B","text":"甲是純化合物，乙是兩種元素物質的混合物","explanation":"正確（本題應選）：粒子身分顯示甲一種、乙兩種物質。"},{"id":"C","text":"甲是混合物，乙是化合物","explanation":"錯誤（本題不選）：甲乙的分類被顛倒了。"},{"id":"D","text":"只要原子總比相同，粒子組合方式就無關","explanation":"錯誤（本題不選）：化學結合方式是區分水與氣體混合物的關鍵。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"元素清單和總比例相同，仍須檢查實際是哪種粒子。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B005","stem":"純化合物Z中A：B原子數比為3：2，A、B是不同元素。一份純Z的完整樣品共有15個A與10個B；加入5個游離B原子且未反應。最適當的判斷為何？","concept":"加入後總計A 15、B 15，但題幹說未反應，原有Z並未改變，新增B以另一成分存在。因此總原子比1：1描述的是混合整體，不能用來改寫每個Z的化學身分。","correct":"C","options":[{"id":"A","text":"總比變成1：1，因此原有Z也全改為化合物AB","explanation":"錯誤（本題不選）：整體總比改變不代表既有化合物全部轉化。"},{"id":"B","text":"仍只含Z，因為新增的B原本就是Z的組成元素","explanation":"錯誤（本題不選）：游離B與Z中的B所屬物質身分不同。"},{"id":"C","text":"含Z與額外B，原有Z組成仍為3：2","explanation":"正確（本題應選）：保留原Z加上未反應B，形成混合物。"},{"id":"D","text":"只有B原子才算純物質，Z原本就是混合物","explanation":"錯誤（本題不選）：化合物可為純物質，不限單原子元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"向純水加入另一成分，不會自動改寫每個水分子的H₂O。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B006","stem":"同一批材料三次取樣，元素A的質量比例依序為40%、40%、40%。未提供完整化學物質身分。下列何者是資料能支持的最強結論？","concept":"三次一致支持取樣組成的重現性；均勻且配方固定的混合物也可能得到相同結果。因此證據只能到『這三份該比例一致』，不能跳到單一物質、化合物或排除混合物，還需查完整成分。","correct":"D","options":[{"id":"A","text":"已證明只含一種物質","explanation":"錯誤（本題不選）：比例一致無法直接給出物質種類數。"},{"id":"B","text":"已證明一定是化合物","explanation":"錯誤（本題不選）：元素A可能存在於多種物質共存的樣品，尚未證明只有一種化合物。"},{"id":"C","text":"已證明不可能是固定配方混合物","explanation":"錯誤（本題不選）：固定配方混合物正能產生重複比值。"},{"id":"D","text":"已觀察到這三份的A比例一致，但仍未單獨證明純度","explanation":"正確（本題應選）：保留觀察範圍與推論界線最合理。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"重複量到相同結果，提高重現性，並不自動增加成分種類的資訊。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B007","stem":"A、B、C為三種不同元素。純化合物P只含A、B，A占總質量20%。某未知樣品10 g含A 2 g、B 7 g、C 1 g，分析完整且無誤。它可否是純P？","concept":"未知樣品的A確實為2/10＝20%，但P限定只含A、B，未知樣品卻另有C。固定組成包括元素種類及比例，不是只核對其中一個百分比；所以它不能是題定純P，至於是否另一純物質仍需資料。","correct":"A","options":[{"id":"A","text":"不可以，除A比例外，完整元素清單也與P不符","explanation":"正確（本題應選）：多出C已違反P的組成限制。"},{"id":"B","text":"可以，因A仍占20%","explanation":"錯誤（本題不選）：只比對A會漏掉明確存在的C。"},{"id":"C","text":"可以，把C視為B便可","explanation":"錯誤（本題不選）：不同元素不能任意合併成同一元素。"},{"id":"D","text":"可以，因A、B、C質量加總等於樣品總質量","explanation":"錯誤（本題不選）：總量吻合不消除C與P只含A、B的衝突。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"符合一個數字不能抵銷與另一項必要條件的衝突。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B008","stem":"兩份已確認的同一純化合物都只含A、B兩種元素。第一份含A 4 g與B 6 g，第二份總質量25 g。依固定組成，第二份的A質量應為多少？","concept":"第一份總量10 g，A占4/10＝0.4。相同純化合物的質量組成比例不變，所以第二份A＝25×0.4＝10 g，B為15 g。要按總量同比放大，不是把第一份的A克數固定沿用。","correct":"B","options":[{"id":"A","text":"4 g","explanation":"錯誤（本題不選）：4 g只是在第一份中的量，不能直接照抄。"},{"id":"B","text":"10 g","explanation":"正確（本題應選）：25 g的40%為10 g。"},{"id":"C","text":"15 g","explanation":"錯誤（本題不選）：15 g對應第二份B的量。"},{"id":"D","text":"20 g","explanation":"錯誤（本題不選）：20 g代表80%，不是原來40%。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"固定的是A占40%，而不是每份一定只有4 g的A。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B009","stem":"A、B為不同元素。甲樣品的A：B質量比為6：9，乙為4：6，丙為3：6。只按此比值，哪兩份與『同一固定組成』相容？","concept":"將比值約分：6：9＝2：3，4：6＝2：3，3：6＝1：2。甲乙相同比例而丙不同。因此甲乙可通過這一項必要條件比較，但仍不能只靠比值就斷言兩份都純或一定同一物質。","correct":"D","options":[{"id":"A","text":"甲丙","explanation":"錯誤（本題不選）：甲2：3與丙1：2不同。"},{"id":"B","text":"乙丙","explanation":"錯誤（本題不選）：乙2：3與丙1：2不同。"},{"id":"C","text":"三份皆相容","explanation":"錯誤（本題不選）：丙的相對A含量較低，不與前兩份同組成。"},{"id":"D","text":"甲乙","explanation":"正確（本題應選）：兩份約分皆為2：3。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"比較組成要比較比值，不能只比某一元素的克數。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B010","stem":"純化合物P只含A、B兩種不同元素，A占總質量60%。未知樣品R的A也占總質量60%，但完整分析顯示其中有兩種不同化合物。R應如何判斷？","concept":"先採用直接成分證據：R已知有兩種化合物，故為混合物。整體A占60%只是一個合計值，可恰與P吻合，卻不代表R只有P。物質種類資訊比單一元素百分比更直接回答純或混合。","correct":"C","options":[{"id":"A","text":"是純P，因百分比吻合","explanation":"錯誤（本題不選）：一項百分比相符不足忽略兩種化合物。"},{"id":"B","text":"是元素，因A占多數","explanation":"錯誤（本題不選）：元素占多數不會使整份變成元素物質。"},{"id":"C","text":"是混合物；比例吻合不足推翻兩種物質共存的證據","explanation":"正確（本題應選）：成分身分與單項數字相似性被正確區分。"},{"id":"D","text":"不能是混合物，因混合物比例永遠不會相同","explanation":"錯誤（本題不選）：混合物可有相同或固定配比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"判純度時，不能用合計組成數字抹去已確認的第二種物質。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B011","stem":"X、Y是不同元素。反應前有X₂與Y₂兩種元素物質，反應後完整粒子清單為XY共8個及Y₂共2個。反應後樣品為何？","concept":"分類應以反應後實際存在的物質種類為準。雖然形成XY，清單仍有未消失的Y₂，所以反應後含兩種物質，屬化合物與元素物質的混合物。產物較多或反應曾發生，都不保證反應完成後只剩一種物質。","correct":"C","options":[{"id":"A","text":"純XY，因XY數量較多","explanation":"錯誤（本題不選）：少數Y₂仍須計入，不能只看多數。"},{"id":"B","text":"純Y₂，因仍有元素物質","explanation":"錯誤（本題不選）：XY同時存在，不能稱純Y₂。"},{"id":"C","text":"XY與Y₂的混合物","explanation":"正確（本題應選）：完整清單有兩種粒子身分。"},{"id":"D","text":"只要發生反應就必為單一化合物","explanation":"錯誤（本題不選）：發生反應與得到純產物是不同條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"若還有未反應原料，成品可同時含原料與產物。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B012","stem":"已知P與Q是兩種不同化合物，即使其分子式都寫成X₂Y₂，結構及物質身分仍不同。完整樣品同時含P與Q，如何分類？","concept":"本題已明定P與Q為不同化合物，不需自行推測結構。判純物質必須只有一種物質，因此兩者共存仍是混合物。相同分子式不應推翻題定的不同身分，兩者量相等也不會化為一種物質。","correct":"A","options":[{"id":"A","text":"混合物，因有兩種已確認的物質身分","explanation":"正確（本題應選）：直接依已知兩種化合物身分判斷。"},{"id":"B","text":"純物質，因分子式相同就只算一種","explanation":"錯誤（本題不選）：分子式相同不能覆蓋已知結構與身分不同。"},{"id":"C","text":"元素，因只有X與Y字母","explanation":"錯誤（本題不選）：兩元素字母不是一種元素物質的條件。"},{"id":"D","text":"只有P、Q數量不等時才是混合物","explanation":"錯誤（本題不選）：是否等量不決定物質種類數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"只看化學式字串而忽略題幹已給的物質身分，可能誤判純度。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B013","stem":"粒子圖例寫明圓圈與方框都表示同一種元素X的原子，連線均表示相同X—X物質。圖中既有圓圈對也有方框對，完整樣品如何分類？","concept":"必須先依圖例解讀符號，而不是把不同形狀自動當成不同元素。圖例已說兩種符號都表示同一X，且所有連結都代表相同X—X物質，所以整份只有一種元素物質。視覺樣式不是獨立的化學身分。","correct":"D","options":[{"id":"A","text":"兩種元素的混合物","explanation":"錯誤（本題不選）：不同印刷符號在本題不表示不同元素。"},{"id":"B","text":"至少兩種化合物","explanation":"錯誤（本題不選）：所有粒子只有X，沒有化合物所需不同元素。"},{"id":"C","text":"元素與化合物的混合物","explanation":"錯誤（本題不選）：圖中未提供第二種物質身分。"},{"id":"D","text":"X元素物質的純樣品","explanation":"正確（本題應選）：按圖例，所有粒子皆同一X—X。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"圖例定義優先於單靠顏色或形狀猜成分。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B014","stem":"一張完整粒子圖共有10組相同X₂Y粒子，圖上每一組代表100個實際分子。實際樣品的物質種類數與分子數依序為何？","concept":"圖上10組各代表100分子，故實際分子數為10×100＝1000。每一組的化學身分都相同，物質種類仍只有1。放大或縮小示意的代表倍率，只改變數量換算，不增加化學種類。","correct":"B","options":[{"id":"A","text":"10種、100個","explanation":"錯誤（本題不選）：把圖示組數誤當種類，且少乘10。"},{"id":"B","text":"1種、1000個","explanation":"正確（本題應選）：一種相同分子，總數由10×100得到。"},{"id":"C","text":"100種、10個","explanation":"錯誤（本題不選）：代表倍率不是種類數，也非實際只有10分子。"},{"id":"D","text":"1000種、1000個","explanation":"錯誤（本題不選）：每個分子不各自算一種物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"一千個同樣分子仍可以是一種純物質。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B015","stem":"樣品甲完整含XY與X₂Y兩種化合物；從甲取出的一小部分恰好只觀察到XY。以下何者正確？","concept":"整體成分已明確包含兩種化合物，甲就是混合物。小部分只見XY可能是取樣未涵蓋另一成分，不能拿局部缺席覆蓋完整已知清單。若另談該取出部分是否純，也需要確認其全部成分，而非只看有限觀察。","correct":"C","options":[{"id":"A","text":"局部只見XY就推翻整體有X₂Y的已知資訊","explanation":"錯誤（本題不選）：局部未見不等於整體不存在。"},{"id":"B","text":"整體甲必純，因至少存在一種純粒子","explanation":"錯誤（本題不選）：一種粒子存在不能排除其他種類。"},{"id":"C","text":"甲仍為混合物，局部觀察不足代表完整成分","explanation":"正確（本題應選）：保留完整成分證據，避免局部推全體。"},{"id":"D","text":"取出部分必與原整體成分比例相同，不需確認代表性","explanation":"錯誤（本題不選）：有限局部樣本不保證涵蓋全部成分，必須先確認取樣是否具代表性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"取樣視野與整份材料的範圍必須分清。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B016","stem":"粒子圖中只畫了一個彼此相連的三原子團，但未說明三原子是否同種元素，也未說明是否代表完整樣品。能作哪個判斷？","concept":"三個原子相連只提供一個局部粒子的原子總數。若三者同元素，可能是元素物質；若不同元素，可能是化合物。又未確認圖涵蓋完整樣品，因此連整份是否只有這種物質也不能確定。","correct":"D","options":[{"id":"A","text":"一定是化合物型純物質","explanation":"錯誤（本題不選）：缺元素種類與全樣品範圍兩項資訊。"},{"id":"B","text":"一定是元素型純物質","explanation":"錯誤（本題不選）：不能假定三原子同元素，也不能假定沒有其他粒子。"},{"id":"C","text":"一定是三種物質的混合物","explanation":"錯誤（本題不選）：三個原子不等於三種各自存在的物質。"},{"id":"D","text":"資訊不足以判定整份的純度與元素／化合物分類","explanation":"正確（本題應選）：兩個分類面向都缺必要的圖例或完整性資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"要讀粒子圖，先查符號含義，再查圖是否代表全部成分。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B017","stem":"有四種已知純物質：甲只有X原子；乙為X₂；丙為XY；丁為X₂Y₃，X與Y不同元素。元素物質有幾種？","concept":"元素物質只要求涉及一種元素，不要求每個粒子只有一原子。甲與乙都只含X，故為元素物質；丙、丁均有X和Y化學結合，屬化合物。純物質資格四者都有，與下一層分類要分開。","correct":"A","options":[{"id":"A","text":"2種：甲與乙","explanation":"正確（本題應選）：甲乙皆只含X一種元素。"},{"id":"B","text":"1種：只有甲","explanation":"錯誤（本題不選）：漏算由相同元素雙原子構成的乙。"},{"id":"C","text":"3種：甲、乙、丙","explanation":"錯誤（本題不選）：丙有X、Y兩元素，不能列為元素物質。"},{"id":"D","text":"4種","explanation":"錯誤（本題不選）：丙丁都是不同元素組成的化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"元素的『一種』修飾元素種類，不修飾每粒子的原子數。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B018","stem":"X、Y代表不同元素。完整模型甲有5個XY，乙有10個XY，丙有5個XY與1個Y₂；所有符號含義一致。哪些模型是同一種純化合物的不同用量？","concept":"甲乙皆只有XY，差別只是分子總數，所以可代表同一純化合物的不同用量。丙多出Y₂這種元素物質，已變成混合物，不能將它當作只是取較多或較少XY。","correct":"C","options":[{"id":"A","text":"甲丙","explanation":"錯誤（本題不選）：丙另含Y₂，與純XY成分清單不同。"},{"id":"B","text":"乙丙","explanation":"錯誤（本題不選）：丙不是只有XY，故不能與乙並列純化合物。"},{"id":"C","text":"甲乙","explanation":"正確（本題應選）：兩者都是單一XY，數量可以不同。"},{"id":"D","text":"三者皆是","explanation":"錯誤（本題不選）：多出一種物質不能由用量差解釋。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"同種粒子數變動是量變；新增粒子身分是成分種類改變。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B019","stem":"X、Y是不同元素。一份樣品只有化合物XY，部分XY經反應轉化成X₂與Y₂，最終只含XY、X₂、Y₂且三者皆存在。反應後有幾種物質？","concept":"最終清單是XY、X₂、Y₂三種物質，故為三成分混合物。元素種類仍只有X、Y兩種，但元素清單不等於物質清單。分類只計當下存在的物質，不把歷史上的整份樣品另算成一種。","correct":"B","options":[{"id":"A","text":"1種，因元素種類沒變","explanation":"錯誤（本題不選）：元素未改變不表示物質身分未改變。"},{"id":"B","text":"3種，依現存化學物質身分計數","explanation":"正確（本題應選）：最終三種化學式在此已代表三種不同物質。"},{"id":"C","text":"2種，因只有X與Y兩元素","explanation":"錯誤（本題不選）：兩種是元素數，而非物質種類數。"},{"id":"D","text":"4種，把反應前樣品也算一種","explanation":"錯誤（本題不選）：反應前的樣品名稱不是另一個現存成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"同樣兩種元素可以分別存在於一種化合物及兩種元素物質中。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B020","stem":"X、Y是不同元素。某粒子模型被標示為『只有相同XY₂粒子的純物質』。檢查模型時，哪項發現才會真正否定這個標示？","concept":"粒子方向、間距和總數可改變圖像表現，但都不必改變化學身分。若又確認存在X₂，就有第二種不同物質，才直接違反只有一種物質。判純度重點是種類，不是圖中位置排得是否整齊。","correct":"D","options":[{"id":"A","text":"有些粒子轉了方向","explanation":"錯誤（本題不選）：旋轉不改變XY₂的元素組成。"},{"id":"B","text":"某區域粒子比較密集","explanation":"錯誤（本題不選）：局部疏密不同本身不增加物質種類。"},{"id":"C","text":"圖上共畫了很多粒子","explanation":"錯誤（本題不選）：大量同種粒子仍是單一物質。"},{"id":"D","text":"另外確認有X₂粒子也存在","explanation":"正確（本題應選）：X₂與XY₂不同，兩者共存便非單一物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"粒子圖的排版變化不能代替化學身分變化。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B021","stem":"一張NaCl概念圖用相同大小的Na⁺與Cl⁻符號表示離子，並註明『大小未按實際比例；只表示1：1組成』。依這項限定，哪個結論正確？","concept":"圖例限定此圖只表示Na⁺與Cl⁻的1：1組成計數，沒有承諾真實尺寸或分子邊界。因此可核對離子個數比例，不能推實際半徑相同，也不能把相鄰符號當成獨立NaCl分子。計數比亦不等於元素質量比。","correct":"A","options":[{"id":"A","text":"圖可表達組成比例，但不能用來判斷真實離子大小","explanation":"正確（本題應選）：圖例只承諾離子計數比，且明言未按實際大小繪製，所以不能用符號大小推真實半徑。"},{"id":"B","text":"兩種符號一樣大，所以實際Na⁺與Cl⁻半徑必相同","explanation":"錯誤（本題不選）：圖例明言未按實際大小比例，不能據符號尺寸推實際離子半徑。"},{"id":"C","text":"圖中的1：1也表示Na與Cl的質量比為1：1","explanation":"錯誤（本題不選）：NaCl式子的1：1為離子組成計數比，不等於元素質量比。"},{"id":"D","text":"每一對相鄰符號都證明存在獨立NaCl分子","explanation":"錯誤（本題不選）：鄰近配置並非獨立分子存在的證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"化學圖的圖例能告訴你哪些特徵可核對、哪些只是示意。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B022","stem":"理想NaCl組成模型要求Na⁺：Cl⁻＝1：1。模型已有18個Na⁺與14個Cl⁻，若只能補入Cl⁻，至少應補幾個才符合？","concept":"先以相同數目滿足1：1：Na⁺固定18個，Cl⁻也要18個。已有14個，因此需補18−14＝4個。這只是在修正題定組成模型，不能單靠計數就主張已驗證真實晶體的所有結構。","correct":"B","options":[{"id":"A","text":"2個","explanation":"錯誤（本題不選）：補2後為18：16，仍非1：1。"},{"id":"B","text":"4個","explanation":"正確（本題應選）：補4後兩者各18，符合題定組成。"},{"id":"C","text":"14個","explanation":"錯誤（本題不選）：補14後Cl⁻為28，超過Na⁺數。"},{"id":"D","text":"18個","explanation":"錯誤（本題不選）：18是所需總數，不是新增數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"區分『最後要有多少』與『現在還差多少』。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B023","stem":"完整成分分析指出甲為純NaCl晶體，乙含NaCl與另一種鹽KCl。兩者都含Cl元素。何者正確？","concept":"成分的共同元素不等於共同化學身分。NaCl與KCl是題定兩種鹽，乙同時含兩者，屬混合物；甲只有NaCl，仍是純化合物。甲內的Na⁺與Cl⁻則是同一化合物組成，不能直接當作兩種鹽。","correct":"C","options":[{"id":"A","text":"共有Cl元素，所以必為同一純物質","explanation":"錯誤（本題不選）：部分元素相同不足證明物質相同。"},{"id":"B","text":"甲含兩種離子，所以比乙更不純","explanation":"錯誤（本題不選）：離子種類數不能直接當成混合物成分數。"},{"id":"C","text":"乙有兩種化合物，共同元素不使它們成為同一物質","explanation":"正確（本題應選）：乙的完整清單有兩種不同鹽類物質。"},{"id":"D","text":"甲乙都只有Cl這種物質","explanation":"錯誤（本題不選）：Cl是組成元素，非兩樣品唯一物質身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"不同化合物可以含有相同的某一元素。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B024","stem":"一份NaCl樣品的Na⁺與Cl⁻總數相等。除此之外，分析還確定含少量水。下列哪項判斷正確？","concept":"1：1可核對NaCl的組成特徵，但不能排除額外物質。此處水已確定存在，故整份至少有NaCl及水兩個成分。不能用NaCl本身的正確組成比例，代替全樣品只有NaCl的純度證據。","correct":"D","options":[{"id":"A","text":"離子數相等就證明整份只有NaCl","explanation":"錯誤（本題不選）：比例相等不能排除不影響這項比值的水。"},{"id":"B","text":"水只改變外觀，不須列入成分","explanation":"錯誤（本題不選）：水是另一種物質，必須計入。"},{"id":"C","text":"因為有水，NaCl內的1：1必已改為2：1","explanation":"錯誤（本題不選）：含水不等於NaCl化學式自行改變。"},{"id":"D","text":"整份含NaCl與水；NaCl比例相符不代表樣品純","explanation":"正確（本題應選）：分開判定化合物內比例與樣品成分種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"化學式寫對，與樣品沒有其他成分，是兩件事。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B025","stem":"甲圖畫8個H₂O，乙圖把每顆H₂O的兩個H合併成一顆較大的『H』且未註明倍率。若圖例說每個符號代表一個原子，乙圖主要錯在哪？","concept":"依圖例每符號一原子，乙每個粒子只剩1個H和1個O，表示的組成便不是H₂O。放大單一符號不能自行代表兩個原子；若要合併表示，必須有明確圖例，否則化學數量已被改寫。","correct":"B","options":[{"id":"A","text":"O原子總數已被加倍","explanation":"錯誤（本題不選）：改圖只合併H符號，題幹沒有增加O符號。"},{"id":"B","text":"H原子數表示不再符合每分子2個H","explanation":"正確（本題應選）：一個H符號只能代表一個H，少了一個。"},{"id":"C","text":"用量不夠多，無法代表純物質","explanation":"錯誤（本題不選）：純度與畫出多少顆相同粒子無直接關係。"},{"id":"D","text":"H₂O中的2應修飾O，主要問題是少畫O","explanation":"錯誤（本題不選）：下標2修飾前面的H，O省略下標1，不能把2移到O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"圖示放大與原子數增加不是同一件事。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B026","stem":"某容器內只有12個H₂O分子。若取走3個完整水分子，剩下的H與O原子數依序為何？","concept":"取走完整水分子後，剩12−3＝9個H₂O。每個含2個H及1個O，所以H為18個、O為9個。不能只扣某一元素，也不能保留原來H總數不變；完整分子移出時兩元素按固定比例一起移出。","correct":"A","options":[{"id":"A","text":"18、9","explanation":"正確（本題應選）：9個H₂O給18個H與9個O。"},{"id":"B","text":"21、9","explanation":"錯誤（本題不選）：21相當只從原24個H扣3，漏算每分子2H。"},{"id":"C","text":"24、9","explanation":"錯誤（本題不選）：取走水分子也會取走H，不能仍24。"},{"id":"D","text":"9、18","explanation":"錯誤（本題不選）：氫氧數目對調，違反H₂O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"移除一個H₂O，就同時移出2個H及1個O。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B027","stem":"對純NaCl與純水的共同點，哪個敘述最準確？","concept":"NaCl與水都是化合物，也都可成為單一純物質；共同核心是固定化學組成。它們的微觀構成不同：水可用H₂O分子描述，NaCl以離子晶體描述。因此不能把水的分子表示方式硬套給NaCl。","correct":"C","options":[{"id":"A","text":"兩者都必須以獨立分子存在才算純","explanation":"錯誤（本題不選）：NaCl的純物質資格不以獨立分子為必要條件。"},{"id":"B","text":"兩者都只有一種元素","explanation":"錯誤（本題不選）：兩者各含兩種不同元素。"},{"id":"C","text":"兩者都是具有固定化學組成的化合物","explanation":"正確（本題應選）：固定組成及化合物分類是正確共同點。"},{"id":"D","text":"兩者都由Na⁺和Cl⁻組成","explanation":"錯誤（本題不選）：水由H、O構成，不含題列Na⁺和Cl⁻。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"相同分類不要求相同粒子構造類型。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B028","stem":"兩個密閉瓶各只含H₂O且沒有其他成分：甲是冰和液態水共存，乙只有液態水。按化學身分分類何者正確？","concept":"兩瓶都只有H₂O；甲雖同時呈現固態與液態，化學身分仍是水。物態數與物質種類數不同，所以甲乙皆可歸為同一純物質。分類時應比較完整化學成分，而不是把每一種狀態分別算成新的化學物質。","correct":"B","options":[{"id":"A","text":"甲混合物、乙純物質，因甲有兩種狀態","explanation":"錯誤（本題不選）：把兩種狀態誤當兩種化學物質。"},{"id":"B","text":"甲乙皆純物質，兩種狀態不等於兩種化學物質","explanation":"正確（本題應選）：兩瓶完整化學成分都只有H₂O。"},{"id":"C","text":"甲是化合物、乙是元素","explanation":"錯誤（本題不選）：液態水仍為化合物，不是元素。"},{"id":"D","text":"甲乙必為不同化合物，因外觀不同","explanation":"錯誤（本題不選）：外觀差異可源自狀態而非化學式差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"兩種狀態的同一物質，不必是兩成分混合物。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B029","stem":"有人說『NaCl含兩類帶電粒子，H₂O含兩種元素，所以兩者都是混合物』。最完整的修正為何？","concept":"原說法混淆構成物質的粒子或元素種類，與樣品中不同物質的種類。NaCl的離子及H₂O的原子皆能組成各自固定的化學物質。若樣品只含其中一種化合物，便可純；若另有其他物質，才屬混合。","correct":"D","options":[{"id":"A","text":"NaCl是純物質，但H₂O必為混合物","explanation":"錯誤（本題不選）：水含兩元素仍可為純化合物。"},{"id":"B","text":"H₂O是純物質，但NaCl必為混合物","explanation":"錯誤（本題不選）：離子晶體NaCl仍可為單一純化合物。"},{"id":"C","text":"只要有多個原子或離子，都是混合物","explanation":"錯誤（本題不選）：原子或離子數量不能代替物質種類判斷。"},{"id":"D","text":"多種元素或離子可構成單一化合物；須另看樣品物質種類","explanation":"正確（本題應選）：同時修正兩個例子背後的分類層次錯誤。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"不能用『構成單位有兩類』直接推出『樣品有兩種物質』。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B030","stem":"一份樣品完整成分為水與另一種只由H、O構成、但化學式不同的化合物R，兩者未反應。即使總元素只有H、O，哪項結論正確？","concept":"混合物不需要第三種元素。不同化合物可以由同一組元素以不同組成或身分形成；題幹已知水與R不同，因此共存就是兩種物質。化學式不同不能只用元素名相同來忽略，也不能臆測它們已發生反應。","correct":"B","options":[{"id":"A","text":"因都含H、O，所以必為純水","explanation":"錯誤（本題不選）：相同元素集合不足確認相同化學物質。"},{"id":"B","text":"同時含水與R，屬於兩種化合物的混合物","explanation":"正確（本題應選）：依題定不同身分，兩成分共存為混合物。"},{"id":"C","text":"只有發現第三種元素才算混合物","explanation":"錯誤（本題不選）：混合物要求兩種或以上物質，不要求元素種類達到三種。"},{"id":"D","text":"R會因接觸水就自動變成H₂O","explanation":"錯誤（本題不選）：沒有反應資訊不能假定R變水。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"元素種類沒有增加，物質種類仍可能增加。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B031","stem":"兩份已確認相同純液體在相同溫度與壓力下，甲質量12 g、體積10 mL；乙質量30 g、體積25 mL。密度＝質量／體積。何者正確？","concept":"依定義甲12/10＝1.2，乙30/25＝1.2 g/mL。它們總量不同，但密度這項在相同條件下的比較一致。這說明總質量及總體積能隨取樣量改變，不能把其差異誤當固定組成或物質身分改變。","correct":"D","options":[{"id":"A","text":"質量不同，必為不同物質","explanation":"錯誤（本題不選）：質量屬取樣量，不直接決定物質身分。"},{"id":"B","text":"體積不同，乙必含雜質","explanation":"錯誤（本題不選）：體積增大可只是取更多相同液體。"},{"id":"C","text":"甲密度1.2、乙密度0.83 g/mL","explanation":"錯誤（本題不選）：乙把體積除質量會得倒數，與密度定義相反。"},{"id":"D","text":"兩者密度均1.2 g/mL，總量不同不衝突","explanation":"正確（本題應選）：計算兩份都得1.2 g/mL。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"總量一起放大，質量與體積的比值仍可保持。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B032","stem":"未知液體只可能是純P或純Q。P、Q在同溫同壓下密度都為0.90 g/mL，在同壓下沸點分別70°C與95°C。未知物在對應相同條件下密度0.90 g/mL、沸點95°C。題定候選中應選哪個？","concept":"密度同時符合P與Q，因此這項資料沒有區分力；沸點95°C只符合Q。題幹已限定未知物是二選一的純物質，故綜合兩項資料可選Q。這個結論依賴候選限制及相同條件，不能擴張為任意未知樣品的普遍純度證明。","correct":"B","options":[{"id":"A","text":"P，因密度相同","explanation":"錯誤（本題不選）：P的沸點70°C與觀察不符。"},{"id":"B","text":"Q，因沸點能排除P","explanation":"正確（本題應選）：在限定二候選中，95°C唯一對應Q。"},{"id":"C","text":"無法在P、Q間分辨，兩者密度相同","explanation":"錯誤（本題不選）：第二項沸點資料已提供區分資訊。"},{"id":"D","text":"P與Q的混合物，因密度無法區分兩者","explanation":"錯誤（本題不選）：題幹限定純P或純Q，並未納入混合物；沸點資料已能在兩個純物質候選間區分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"一項無法區分時，可利用另一項能區分候選的特性。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B033","stem":"以下密度均在相同壓力下量測，樣品都為液態。純P在20°C時密度1.05 g/mL、40°C時1.02 g/mL；樣品X在40°C測得1.02 g/mL。哪個比較正確？","concept":"要先選條件相符的基準。X在40°C測得1.02，與P在同溫的資料一致；若拿20°C的1.05直接比較，會把溫度效應混入。相符只通過這項物性比較，尚未單獨確認全成分或唯一身分。","correct":"A","options":[{"id":"A","text":"應與P在40°C的1.02相比，結果相符但仍需其他身分證據","explanation":"正確（本題應選）：對齊溫度且保留單項證據的界線。"},{"id":"B","text":"應只與20°C資料比，差0.03便可斷定不是P","explanation":"錯誤（本題不選）：比較不同溫度可能造成錯誤否定。"},{"id":"C","text":"兩個P數值不同，故P不可能是純物質","explanation":"錯誤（本題不選）：同一純物質的密度可隨條件改變。"},{"id":"D","text":"X密度較小，代表X必為元素","explanation":"錯誤（本題不選）：密度大小不是元素或化合物的判準。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"先找同條件資料，再討論數值相符與否。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B034","stem":"甲、乙的沸點測量同時改變了外界壓力與樣品來源，結果不同。若想判斷差異是否只由壓力造成，最適合先做哪件事？","concept":"原比較把壓力與來源一起改變，不能分辨原因。先在共同壓力重測甲乙，可排除這項已知條件差；同時仍需成分資訊，才能評估是否同一物質。把樣品混合會改變比較對象，無法直接回答原兩份差異。","correct":"C","options":[{"id":"A","text":"直接以沸點不同宣告來源決定化學式","explanation":"錯誤（本題不選）：原資料沒有分離壓力與來源的影響。"},{"id":"B","text":"只增加兩份樣品量，仍用不同壓力","explanation":"錯誤（本題不選）：改用量不會消除壓力不一致。"},{"id":"C","text":"在相同壓力下重新比較甲乙，並保留成分確認","explanation":"正確（本題應選）：控制相關條件後才有可解讀的比較。"},{"id":"D","text":"將兩份混合後只量一次沸點","explanation":"錯誤（本題不選）：混合後測的是新整體，不是兩原樣品的平行比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"一次改變多項條件，通常不利於辨認觀察差異的來源。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B035","stem":"樣品X與已知純P在相同條件下密度相同，但完整成分分析顯示X含P與Q兩種不同物質。如何處理兩項證據？","concept":"完整成分分析直接回答X是否只有一種物質：X含P與Q，所以是混合物。密度相同不會使Q消失，也不能倒推已知純P的分類錯誤。應理解單項性質可能重合，而非讓一個數字凌駕成分身分證據。","correct":"B","options":[{"id":"A","text":"忽略Q，因密度相同已證明純P","explanation":"錯誤（本題不選）：物性重合不是排除Q的理由。"},{"id":"B","text":"判X為混合物；密度吻合只是單項巧合或相符","explanation":"正確（本題應選）：同時尊重成分結果與物性可能重合。"},{"id":"C","text":"判P為混合物，因X與它密度相同","explanation":"錯誤（本題不選）：X的成分不能反向改寫另一份已知P。"},{"id":"D","text":"判兩份皆元素，因密度一致","explanation":"錯誤（本題不選）：密度相同不提供元素種類的結論。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"兩份物質碰巧有同密度，仍可能一份純、一份混合。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B036","stem":"同一純物質的兩份樣品與試劑R比較反應情形，甲在20°C、乙在60°C，其他資料不足。若觀察不同，何者最合理？","concept":"反應表現也需在可比較的條件下討論。甲乙溫度不同，不能把觀察差異直接歸於物質身分不同。應先對齊溫度，再確認試劑與其他相關條件是否一致，才能減少把條件效應誤當化學組成差異的風險。","correct":"D","options":[{"id":"A","text":"化學反應表現不可能受條件影響","explanation":"錯誤（本題不選）：反應表現通常需要指定條件，不能假定毫無影響。"},{"id":"B","text":"較熱的乙必已不是原純物質","explanation":"錯誤（本題不選）：升溫不必然使原物質化學身分改變。"},{"id":"C","text":"只要反應快慢不同，就一定是不同元素","explanation":"錯誤（本題不選）：反應速度不直接判定元素種類。"},{"id":"D","text":"先使溫度等條件相同，再討論反應表現的可比性","explanation":"正確（本題應選）：對齊溫度才能減少比較中的條件差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"比較『會如何反應』也需交代試劑及條件。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B037","stem":"兩份均一液體在同溫同壓下的密度分別為1.00與1.30 g/mL，數值精確且無測量誤差。若有人主張兩份是相同純物質，應如何評估？","concept":"在題定同溫同壓、均一液態且無誤差下，密度差異與兩份為同一純物質的主張不相容。這足以要求重新檢查身分，但不能直接指定哪份混合：它們也可能各自純而是不同物質，更不能直接判為元素。","correct":"A","options":[{"id":"A","text":"這項差異不符合相同條件下同一純物質的密度特徵，應查明","explanation":"正確（本題應選）：指出與主張不相容，且沒有超推分類。"},{"id":"B","text":"一定是兩種元素，不能是化合物","explanation":"錯誤（本題不選）：密度差異不能判元素或化合物。"},{"id":"C","text":"只要總質量不同，密度就必不同，所以主張毫無問題","explanation":"錯誤（本題不選）：密度是質量與體積比，不因總量不同必變。"},{"id":"D","text":"至少其中一份必是混合物","explanation":"錯誤（本題不選）：兩種不同純物質也能有不同密度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"否定『相同純物質』不等於證明『一定有混合物』。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B038","stem":"P、Q已確認為兩種不同純物質。它們在相同條件下對試劑R的反應表現不同，卻測得相同熔點。哪個解釋最合理？","concept":"已確認的不同化學身分與反應差異，不會因一項熔點相同而自動失效。不同物質可以有某項數值重合，所以應綜合成分與其他特性判斷。純物質有特定性質，不表示每一單項數值都只可能對應唯一物質。","correct":"C","options":[{"id":"A","text":"熔點相同代表成分分析與反應觀察必定全錯","explanation":"錯誤（本題不選）：一項物性相同可與其他差異證據並存，不能據此推翻全部觀察。"},{"id":"B","text":"反應表現不同，表示至少一份必是混合物","explanation":"錯誤（本題不選）：不同純物質本可有不同反應表現，不須至少一份混合。"},{"id":"C","text":"不同物質的某一性質可重合，單項熔點不是唯一身分證據","explanation":"正確（本題應選）：單項熔點可能重合，不能凌駕已確認的不同身分與其他特性。"},{"id":"D","text":"熔點相同代表兩者必由同一種元素構成","explanation":"錯誤（本題不選）：相同熔點不能決定元素種類，更不能推兩者都只有同一元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"一項特性吻合，可視為線索，未必足夠唯一辨識。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B039","stem":"實驗表列出X在20°C、1 atm的密度及Y在20°C、2 atm的密度。若要直接比較並作身分判斷，表格最需要補足哪項資料？","concept":"兩列溫度雖一致，壓力仍不同，狀態也須確認。直接比較需要建立相同壓力、同狀態的資料，避免條件差混入身分判斷。用量或透明性不能補上這個缺口，且單項密度相符仍需審慎解讀。","correct":"B","options":[{"id":"A","text":"兩份樣品各自取了幾滴即可，壓力不用管","explanation":"錯誤（本題不選）：滴數不是消除壓力差的資訊。"},{"id":"B","text":"保持20°C，並取得相同壓力與相同狀態下的對照密度","explanation":"正確（本題應選）：補齊共同條件才能合理比較。"},{"id":"C","text":"只補寫X、Y都是透明就足夠","explanation":"錯誤（本題不選）：透明不能對齊壓力或證明成分相同。"},{"id":"D","text":"只要溫度相同，其他條件永遠不影響","explanation":"錯誤（本題不選）：同溫不代表所有其他影響因素已一致。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"物性資料應連同條件一起讀，不能只擷取數值。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B040","stem":"已知兩瓶都是純物質，但未說是否同一種。甲在指定條件下沸點80°C，乙在相同條件下110°C。何者正確？","concept":"『各自純』只限制每瓶含一種物質，沒有要求兩瓶裝同一種物質。相同條件下不同沸點可以反映兩瓶是不同純物質；不能把沸點高低當作純度排名，也不能因此否定題定的各自純。","correct":"D","options":[{"id":"A","text":"兩者既然各自純，沸點就理應相同","explanation":"錯誤（本題不選）：漏掉兩瓶可以是不同純物質的可能。"},{"id":"B","text":"沸點較高的乙一定較純","explanation":"錯誤（本題不選）：沸點大小不是通用純度分數。"},{"id":"C","text":"沸點不同表示甲乙都不可能純","explanation":"錯誤（本題不選）：不同純物質本可有不同沸點。"},{"id":"D","text":"各自純不保證彼此同一物質，沸點可不同","explanation":"正確（本題應選）：正確區分單瓶純度與跨瓶同一性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"一瓶純P與一瓶純Q都純，不表示P必等於Q。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B041","stem":"分析只確定未知樣品含X、Y兩種元素，未確定它們以哪些物質存在。下列哪個結論仍不能成立？","concept":"元素分析說明含哪些元素，未告訴它們是結合成單一化合物，或分散在不同物質內。兩種元素可出現在純化合物，也可出現在混合物，因此『一定是純化合物』超出資訊；其餘敘述都保留了必要界線。","correct":"C","options":[{"id":"A","text":"樣品涉及不只一種元素","explanation":"錯誤（本題不選）：X、Y已知不同，確實超過一種元素。"},{"id":"B","text":"不能只靠元素清單排除混合物","explanation":"錯誤（本題不選）：可能是多種物質共存，尚未排除。"},{"id":"C","text":"樣品一定是純化合物","explanation":"正確（本題應選）：缺少只有一種化學物質的證據。"},{"id":"D","text":"需要更多化學身分資訊才能判純或混合","explanation":"錯誤（本題不選）：現有元素資訊不足回答物質種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"元素清單與完整化學物質清單提供不同層次的資訊。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B042","stem":"未知樣品含X、Y兩種不同元素。另經完整分析確認所有成分都是同一種XY₂化合物且無其他物質。可作哪個判斷？","concept":"原本只知元素種類，無法區分純化合物與混合物；現在完整成分限定為同一XY₂，便補足單一物質身分。XY₂又由不同元素構成，故可同時判純物質與化合物。結論改變來自新證據，不是把原不足資訊硬推。","correct":"A","options":[{"id":"A","text":"可確定是純化合物，因已補足單一物質身分","explanation":"正確（本題應選）：新資訊直接排除第二種物質。"},{"id":"B","text":"仍只能說混合物，因有兩種元素","explanation":"錯誤（本題不選）：不同元素可以在同一化合物內結合。"},{"id":"C","text":"只能確定是元素，因只有一種化學式","explanation":"錯誤（本題不選）：只有一種物質不等於只含一種元素。"},{"id":"D","text":"必須先知道XY₂樣品的總質量，才能判斷是否純物質","explanation":"錯誤（本題不選）：完整成分已限定一種化合物，純度分類不要求指定某個樣品總質量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"『含X、Y』加上『只含同一XY₂』，比元素清單更能限定分類。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B043","stem":"一杯溶液的完整成分為P占總質量65%、Q占35%，兩者為不同物質且未反應。有人因加總為100%而判純。哪個解釋最適合？","concept":"完整配方的各成分比例本來就可加總100%。這個加總只表示沒有遺漏比例，不會把P和Q合併成同一化學物質。由於題幹已明確有兩種未反應成分，分類仍為混合物。","correct":"D","options":[{"id":"A","text":"100%表示各成分已化學結合","explanation":"錯誤（本題不選）：百分比總和不提供化學結合證據。"},{"id":"B","text":"35%太低，不應計入成分","explanation":"錯誤（本題不選）：少於一半的成分仍是真實成分。"},{"id":"C","text":"只要比例固定，就可排除混合物","explanation":"錯誤（本題不選）：固定配方也可有兩種未反應成分。"},{"id":"D","text":"加總100%只表示完整比例，兩種成分仍使它是混合物","explanation":"正確（本題應選）：比例總和與成分種類數須分開判讀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"鹽與水的質量百分比加總100%，不會因此變純鹽或純水。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B044","stem":"密閉容器起初只含純液體P與氣體Q，P、Q為不同且不互相反應的物質。部分P蒸發後，液態P、氣態P與氣體Q都存在。物質種類數如何變化？","concept":"起初的化學物質只有P、Q兩種。蒸發後P有液態與氣態兩部分，但兩者化學身分仍都是P；Q也保留。因此最終仍是P與Q兩種物質的混合物。不能按三個宏觀部分計成三物質，也不能因氣體混勻就合成一種身分。","correct":"B","options":[{"id":"A","text":"由2變3，因為有液態P、氣態P及Q三部分","explanation":"錯誤（本題不選）：液態P與氣態P不是兩種不同化學物質。"},{"id":"B","text":"仍為2，液態與氣態P共屬P，另有Q","explanation":"正確（本題應選）：P的狀態數增加，但原有P與Q兩個身分都保持。"},{"id":"C","text":"由2變1，因為氣態P與Q可以混合均勻","explanation":"錯誤（本題不選）：均勻混合不會消除P與Q的不同身分。"},{"id":"D","text":"只剩Q，因蒸發表示P已離開密閉容器","explanation":"錯誤（本題不選）：密閉且題定P仍以氣液態存在，蒸發不代表P消失。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"一物質以兩態存在再加另一物質，不能把狀態部分數直接當成物質種類數。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B045","stem":"瓶內只有純P。再加入另一來源但已確認同樣純P，未反應也未污染。最合理的描述為何？","concept":"混合是否改變分類取決於加入何種物質。此處新舊都是已確認同一P，合併後仍只有P，因此保持純物質；來源數與倒入次數不是成分種類數。只有混入不同物質且保留身分，才會增加混合成分。","correct":"A","options":[{"id":"A","text":"仍只有P，是純物質；增加的是用量","explanation":"正確（本題應選）：同一身分合併不增加物質種類。"},{"id":"B","text":"來源有兩個，所以一定變混合物","explanation":"錯誤（本題不選）：來源數不等於化學物質種類數。"},{"id":"C","text":"混合兩份材料一定形成化合物","explanation":"錯誤（本題不選）：倒在一起不必化學反應，且此處本就同一P。"},{"id":"D","text":"不同來源的P必具有不同元素組成","explanation":"錯誤（本題不選）：已確認相同純P，其元素組成不因來源而變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"把兩杯純水合在一起且未污染，仍是純水。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B046","stem":"已知固體P與Q雖都只含X元素，卻是結構與物質身分不同的兩種物質。把P、Q未反應地混放後，何者正確？","concept":"P與Q已確認是不同物質，所以它們未反應地共存就是混合物；兩者所用元素都為X，元素種類仍只有一種。這顯示元素清單與物質身分清單並非同一件事，只看X這一個元素符號會漏掉P、Q的身分差異。","correct":"C","options":[{"id":"A","text":"只含X，所以必只有一種物質","explanation":"錯誤（本題不選）：把一種元素誤等同一種化學物質。"},{"id":"B","text":"變成含兩種元素的化合物","explanation":"錯誤（本題不選）：沒有第二元素，也沒有新化學結合條件。"},{"id":"C","text":"仍是兩種物質的混合物，元素種類只有一種","explanation":"正確（本題應選）：正確分開物質種類與元素種類兩個計數。"},{"id":"D","text":"只要P、Q各自純，混放後就一定純","explanation":"錯誤（本題不選）：純原料不同身分共存仍可混合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"讀題時需尊重已給的不同物質身分，不以元素名相同覆蓋。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B047","stem":"純化合物R經反應完全轉化成P與Q兩種不同物質，最終P、Q都留在同一密閉容器，沒有其他成分。對反應前後的說法何者正確？","concept":"反應會改變化學身分，不能把反應後物質種類直接搬回反應前。題定R原為純化合物；完全轉化後若P、Q一起留在系統，整體為兩種物質共存的混合物。P、Q是否元素還需各自組成資訊。","correct":"B","options":[{"id":"A","text":"反應後有P、Q，證明反應前R已是混合物","explanation":"錯誤（本題不選）：化學轉化可以從一種物質產生多種物質。"},{"id":"B","text":"反應前R可純；反應後P、Q共存的整體是混合物","explanation":"正確（本題應選）：分時點分類，符合原始與最終成分資訊。"},{"id":"C","text":"所有能反應的物質都是混合物","explanation":"錯誤（本題不選）：純物質也能參與化學反應。"},{"id":"D","text":"反應後有兩種物質，故它們必都是元素","explanation":"錯誤（本題不選）：兩種產物不代表每種都只有一元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"反應前的單一物質與反應後的多成分狀態可同時成立。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B048","stem":"兩份均一液體的完整元素質量比例相同，但在同溫同壓下的密度確實不同，測量無誤。哪項結論最適合？","concept":"元素比例相同只表示這層組成數據相符，不必然表示同一化學身分。相同條件的密度不同又提示不能直接視為同一純物質。應保留兩項觀察，查明各自成分或結構身分，而不是抹去其中一項。","correct":"D","options":[{"id":"A","text":"兩份一定都是同一純化合物","explanation":"錯誤（本題不選）：相同條件物性差異與該主張不相容。"},{"id":"B","text":"至少一份必為混合物，因兩份密度不同","explanation":"錯誤（本題不選）：相同元素比仍不足限定同一化學身分，不能排除兩份各自是不同純物質。"},{"id":"C","text":"元素比例相同就可忽略密度資訊","explanation":"錯誤（本題不選）：不能只保留支持結論的一項資料。"},{"id":"D","text":"僅憑元素比例不足認定同一純物質，需檢查化學身分","explanation":"正確（本題應選）：指出現有比例證據不充分，並需補查身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"組成數據相符是必要線索，仍需與其他證據一致。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B049","stem":"三瓶樣品：甲完整成分只有X；乙完整成分只有Y；丙完整成分含X與Y。X、Y為不同物質。對『三瓶』的正確說法為何？","concept":"每瓶分類要按各瓶內的成分範圍。甲只有X、乙只有Y，所以各自純；丙同時有X、Y，所以混合。整個實驗室有不同物質，不會讓未混合的每一瓶都變成混合物，配比相等也不能改變丙的兩成分事實。","correct":"A","options":[{"id":"A","text":"甲乙各自純，丙為混合物","explanation":"正確（本題應選）：逐瓶依成分種類數判定。"},{"id":"B","text":"三瓶一起有X與Y，所以甲乙各自也都是混合物","explanation":"錯誤（本題不選）：把跨瓶合計與單瓶成分混淆。"},{"id":"C","text":"甲乙名稱不同，所以至少一瓶不純","explanation":"錯誤（本題不選）：不同身分的兩瓶仍能各自純。"},{"id":"D","text":"丙若X、Y等量就也純","explanation":"錯誤（本題不選）：等量不使兩物質成為一種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"先界定樣品範圍，才有正確的物質種類計數。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-B050","stem":"下列哪一項在題定無誤且完整的前提下，足以排除『這份樣品只有純化合物Z』？","concept":"要排除只有Z，最直接就是確認有非Z物質存在。來源多不保證成分多；Z本來就可含兩種元素；密度相同則不能證明或否定是否另有成分。W的存在才與『只有Z』形成直接矛盾。","correct":"C","options":[{"id":"A","text":"樣品來自兩個來源","explanation":"錯誤（本題不選）：不同來源可提供相同純Z。"},{"id":"B","text":"樣品含Z所需的兩種元素","explanation":"錯誤（本題不選）：化合物可由不同元素構成，這不排除純Z。"},{"id":"C","text":"樣品內另有已確認身分不同於Z的物質W","explanation":"正確（本題應選）：W非Z且存在，直接違反只有Z。"},{"id":"D","text":"樣品具有與Z相同的密度","explanation":"錯誤（本題不選）：單項物性相符不等於發現第二成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"否定『只有某物質』需要成分衝突，而不是只找外觀或來源差。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B051","stem":"甲杯含P與Q，乙杯含P與R；P、Q、R為三種不同物質。全部合併且未反應、未移除成分，最終有幾種物質？","concept":"合併後成分為P、Q、R。P在兩杯都出現，但它是同一身分，種類只計一次，因此共三種。不能把原有兩杯視為兩種物質，也不能把同一P按來源重複計數。","correct":"B","options":[{"id":"A","text":"2種","explanation":"錯誤（本題不選）：漏掉Q或R其中一種，或把杯數當種類。"},{"id":"B","text":"3種","explanation":"正確（本題應選）：合併成分清單去除同一P的重複，共三種。"},{"id":"C","text":"4種","explanation":"錯誤（本題不選）：把同一P按兩個來源重複算了兩次。"},{"id":"D","text":"1種","explanation":"錯誤（本題不選）：未反應不會使三種成分化成一種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"混合兩份混合物時，用現存成分身分合併計數。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B052","stem":"混合物含P 10 g與Q 30 g，兩者不反應。若只加入20 g純Q，哪項敘述正確？","concept":"原總量40 g，P占10/40＝25%；加Q後總量60 g，P仍10 g，占10/60≈16.7%。P、Q身分沒有改變，種類仍為2。這題區分成分的絕對量、相對比例，以及物質種類數三個不同量。","correct":"C","options":[{"id":"A","text":"物質種類由2變3","explanation":"錯誤（本題不選）：加入的仍是原有Q，不新增第三種身分。"},{"id":"B","text":"成品變成純Q","explanation":"錯誤（本題不選）：P沒有被移除，不能稱純Q。"},{"id":"C","text":"仍兩種物質，P占總質量由25%降為約16.7%","explanation":"正確（本題應選）：比例依新總量計算，兩種身分保持。"},{"id":"D","text":"P占比仍25%，因P的克數沒變","explanation":"錯誤（本題不選）：分子不變而分母增大，比例會降低。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"同一成分克數不變，仍可能因總量增加而占比下降。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B053","stem":"一份樣品原含P、Q、R三種物質。理想處理後已確認Q被完全移除，而P與R都完整保留、沒有反應。此時如何分類？","concept":"去掉一種成分不等於只剩一種物質。處理後完整清單仍為P、R兩種，因此仍是混合物。是否經過分離不是純物質保證；需要檢查剩餘物質的完整清單，而不能只根據曾經移除Q這個動作決定純度。","correct":"A","options":[{"id":"A","text":"仍是混合物，因P與R兩種物質存在","explanation":"正確（本題應選）：剩餘兩種不同物質足以判混合。"},{"id":"B","text":"變成純P，因已做過分離","explanation":"錯誤（本題不選）：R仍在，不能說只有P。"},{"id":"C","text":"變成純R，因只剩兩種原料","explanation":"錯誤（本題不選）：P仍在，不能說只有R。"},{"id":"D","text":"變成單一化合物PR，因Q消失","explanation":"錯誤（本題不選）：沒有反應，不能自行創造PR化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"純化程度提高與達到單一物質，是不同門檻。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B054","stem":"原樣品含化合物P與元素物質Q。後來確認P與Q完全反應，最後只剩一種化合物R，沒有其他成分。最終分類為何？","concept":"最終分類依反應後完整成分，而不是依原料數。題幹已排除剩餘原料與副成分，只有R這種化合物，所以可判純。這與部分反應後仍有原料的情形不同，關鍵是題目給出的最終清單。","correct":"D","options":[{"id":"A","text":"仍為混合物，因原料曾有兩種","explanation":"錯誤（本題不選）：歷史原料不等於現存成分。"},{"id":"B","text":"元素，因原料包含元素物質Q","explanation":"錯誤（本題不選）：反應後物質身分已改變，不能沿用Q類別。"},{"id":"C","text":"仍含原來P與Q，因化學反應會保留原料的原子","explanation":"錯誤（本題不選）：原子的保留不表示原料物質的身分保留；題幹已明定P、Q完全轉成R。"},{"id":"D","text":"純化合物R","explanation":"正確（本題應選）：最終只有一種已知化合物，符合純物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"若最終只剩單一產物，可按單一產物分類。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B055","stem":"兩杯同樣透明的液體：甲的完整成分為P；乙為P與Q。加入只會和Q出現可辨識變化的試劑後，乙有變化、甲沒有。何者正確？","concept":"題幹先給成分，再給只對Q有辨識變化的條件。乙含Q所以有變化、甲不含Q所以沒有，這項測試比共同透明外觀更能區分兩份。它支持Q的存在，不把含P與Q的乙改成純Q，也不決定甲是否元素。","correct":"C","options":[{"id":"A","text":"透明性原本已證明兩杯相同","explanation":"錯誤（本題不選）：外觀相同不足推出成分相同。"},{"id":"B","text":"試劑結果證明甲一定是元素","explanation":"錯誤（本題不選）：無變化只表示此測試未見Q，不指定P為元素。"},{"id":"C","text":"依題定成分與試劑特異性，觀察可區分乙含Q，透明性不足區分","explanation":"正確（本題應選）：用題定專一性解讀結果，沒有超推分類。"},{"id":"D","text":"乙有變化所以反應前必是純Q","explanation":"錯誤（本題不選）：乙同時有P，不能因偵測Q就忽略P。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"針對某成分的化學證據，通常比共同外觀更直接。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-B056","stem":"未混勻的P、Q液體上層P較多、下層Q較多；充分攪拌後各處比例一致，且確認未反應。哪項改變確實發生？","concept":"攪拌前後P、Q都存在且未反應，物質種類不變。改變的是不同位置的相對分布，從上、下差異變成各處比例一致。因此可說均勻性改善，不能把它說成成分純化或化學結合。","correct":"B","options":[{"id":"A","text":"物質種類由2變1","explanation":"錯誤（本題不選）：未反應且未移除，兩成分仍在。"},{"id":"B","text":"成分空間分布由不均勻變均勻，仍是混合物","explanation":"正確（本題應選）：區分分布狀態改變與物質身分保持。"},{"id":"C","text":"P與Q形成單一固定比例化合物","explanation":"錯誤（本題不選）：各處比例一致只說明分布均勻，題幹明定未反應，不能宣告生成化合物。"},{"id":"D","text":"P與Q的化學式因攪拌必改變","explanation":"錯誤（本題不選）：題幹明定未反應，不應假定化學式改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"同一混合物可以在充分混合前後有不同的均勻程度。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-B057","stem":"純P與純Q各自單獨放置，後來只有P被分成三份，Q仍一份，未混合且未污染。下列哪項正確？","concept":"分裝改變樣品份數，不必改變每份的化學成分。三份P各只含P，所以仍各自純；Q也仍純。可見容器數、樣品份數與物質種類數必須分開，否則容易把實驗安排誤作成分變化。","correct":"A","options":[{"id":"A","text":"P的三份各自仍純；分裝份數不是物質種類數","explanation":"正確（本題應選）：每份P的完整成分沒有新增物質。"},{"id":"B","text":"P因分成三份而變三種物質","explanation":"錯誤（本題不選）：同一身分按份數拆開不會創造新種類。"},{"id":"C","text":"總共有四份，所以每份都是四成分混合物","explanation":"錯誤（本題不選）：不同份未混合，不能把全局份數塞入每份成分。"},{"id":"D","text":"Q未分裝才純，P分裝後必不純","explanation":"錯誤（本題不選）：題幹排除污染，分裝沒有必然不純。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"一瓶純物質可分裝成多瓶相同純物質。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B058","stem":"一份混合物原含P與Q。取走部分P，但仍確認P、Q都存在。何者最合理？","concept":"純或混合以是否仍有多種物質為準，不以兩者是否等量。取走部分P會改變比例，但題幹說P、Q都留下，因此種類數仍為2。只有完全排除另一物質等條件，才可能判成單一純Q。","correct":"D","options":[{"id":"A","text":"因P減少，剩餘必為純Q","explanation":"錯誤（本題不選）：尚有P存在，不能判只有Q。"},{"id":"B","text":"只有兩者等量時才是混合物","explanation":"錯誤（本題不選）：混合物可有任意合乎條件的不等比例。"},{"id":"C","text":"P若成為少量，就不算物質","explanation":"錯誤（本題不選）：少量的不同成分仍需計入。"},{"id":"D","text":"混合比例可變，但只要兩種仍在就仍是混合物","explanation":"正確（本題應選）：保留成分存在與比例改變兩項資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"減少雜質與完全沒有另一成分，不是同一結論。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B059","stem":"P、Q是不同物質。樣品甲完整成分只有P，兩區顏色差已確認只來自照明；樣品乙看似單色，完整成分為P、Q。何者正確？","concept":"題幹明確說甲的顏色差是照明，兩區化學身分同為P，因此可純；乙雖單色仍含P與Q，為混合物。化學成分證據能解釋外觀的限制，不能僅依肉眼分區或顏色數量分類。","correct":"C","options":[{"id":"A","text":"甲必混合、乙必純","explanation":"錯誤（本題不選）：把外觀數目直接當物質種類，與成分資訊衝突。"},{"id":"B","text":"甲乙皆純，因都含P","explanation":"錯誤（本題不選）：乙除了P還有Q，不是只有P。"},{"id":"C","text":"甲可純、乙混合，外觀區域數不等於成分數","explanation":"正確（本題應選）：依完整成分而非照明與顏色判斷。"},{"id":"D","text":"甲乙都只能判未知，完整成分無助分類","explanation":"錯誤（本題不選）：題幹已給足成分，無須保留不必要未知。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"相同物質可因照明呈不同外觀，不同物質也可看起來相近。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-B060","stem":"P、Q為不同物質。甲樣品只有P；乙樣品含P與Q但總質量與甲相同；丙樣品含較多純P。哪些樣品可為同一純物質的不同用量？","concept":"同一純物質的不同用量，需維持只有同一身分P。甲、丙符合；乙雖與甲等重，卻多出Q，屬混合物。質量相等不能保證成分相同，質量不同也不妨礙兩份是相同純物質。","correct":"B","options":[{"id":"A","text":"甲乙","explanation":"錯誤（本題不選）：乙有Q，等重不能抵銷成分差。"},{"id":"B","text":"甲丙","explanation":"正確（本題應選）：甲丙都只有P，用量不同可接受。"},{"id":"C","text":"乙丙","explanation":"錯誤（本題不選）：乙不是純P，不能與丙並列。"},{"id":"D","text":"三者皆可","explanation":"錯誤（本題不選）：乙是混合物，排除全選。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"比較相同物質，先查身分與成分，再處理樣品量。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B061","stem":"甲糖水為糖12 g與水48 g，乙為糖8 g與水32 g，皆未反應且充分混勻。兩份的糖質量比例與分類依序為何？","concept":"甲糖占12/60＝20%，乙占8/40＝20%，所以配比相同。兩份都含糖和水，比例一致不使它們變成單一化合物。因此可描述為相同配比的混合物，不能把配方重現當純物質證據。","correct":"A","options":[{"id":"A","text":"比例相同，兩者仍是混合物","explanation":"正確（本題應選）：比例皆20%，且兩成分共存。"},{"id":"B","text":"比例不同，所以只有甲純","explanation":"錯誤（本題不選）：分母應取總質量，兩比例實際相同。"},{"id":"C","text":"比例相同，兩者必為同一純化合物","explanation":"錯誤（本題不選）：同配比不能消除糖與水兩種身分。"},{"id":"D","text":"比例不同，兩者都是元素","explanation":"錯誤（本題不選）：糖與水的共存樣品不是元素物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"不同總量可以配出相同濃淡的糖水。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B062","stem":"均勻混合物含P 15 g與Q 45 g。取出其中總質量的三分之一，假設取樣具代表性且未反應。取出份的P、Q質量與分類為何？","concept":"均勻且具代表性的取樣會把兩成分按同一比例取出。P為15/3＝5 g，Q為45/3＝15 g，取出份仍有兩種物質，所以仍是混合物。縮小樣品不等於移除其中一種成分。","correct":"C","options":[{"id":"A","text":"15 g、45 g，純物質","explanation":"錯誤（本題不選）：沒有除以3，而且兩成分不能判純。"},{"id":"B","text":"5 g、15 g，純物質","explanation":"錯誤（本題不選）：計算正確，但分類忽略仍有P、Q。"},{"id":"C","text":"5 g、15 g，混合物","explanation":"正確（本題應選）：按三分之一取出，兩成分都保留。"},{"id":"D","text":"10 g、30 g，混合物","explanation":"錯誤（本題不選）：這是容器內剩餘三分之二的量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"均勻混合物的小份樣品也可維持同樣的混合成分。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B063","stem":"一份糖水含糖5 g、水20 g；再加入糖5 g、水20 g的新一份，未反應。下列哪項保持不變？","concept":"合併前糖占5/25＝20%；合併後糖10 g、總量50 g，仍20%。糖克數與總質量都增加，但同配方同比放大使比例不變。比例不變只說配方相同，合併前後仍是糖水混合物。","correct":"D","options":[{"id":"A","text":"糖的總質量","explanation":"錯誤（本題不選）：糖從5 g增加至10 g。"},{"id":"B","text":"總質量","explanation":"錯誤（本題不選）：總量從25 g增加至50 g。"},{"id":"C","text":"水的總質量","explanation":"錯誤（本題不選）：水從20 g增加至40 g，並未保持不變。"},{"id":"D","text":"糖占總質量的比例","explanation":"正確（本題應選）：10/50與5/25同為20%。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"固定配比可以伴隨總量增加，而不成為純化合物。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B064","stem":"P、Q為不同物質。兩批產品都只用P、Q且未反應。第一批P：Q質量比為1：4，第二批為1：1。這些資料最直接反駁哪項說法？","concept":"兩批由相同成分以不同用量配成，直接顯示未反應混合物並不只允許一個配方比例。這不反駁它們皆含P、Q，反而與保留成分身分及可調配方一致。要讓結論對應實際觀察差異。","correct":"B","options":[{"id":"A","text":"兩批都包含P與Q","explanation":"錯誤（本題不選）：完整成分正支持兩批都含P、Q。"},{"id":"B","text":"未反應的混合配方只能有唯一比例","explanation":"正確（本題應選）：1：4與1：1兩個配比推翻唯一配比。"},{"id":"C","text":"兩批可以都是混合物","explanation":"錯誤（本題不選）：兩批都多成分，與混合物分類相容。"},{"id":"D","text":"混合物中成分可以保留身分","explanation":"錯誤（本題不選）：題幹未反應正保留原成分身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"同成分不同配比，是混合物可變組成的直接示例。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B065","stem":"P、Q為不同物質。產品甲每次將P、Q以質量比1：3配製；產品乙每次以1：4配製，均未反應。對『固定』一詞，下列解讀何者正確？","concept":"兩產品都重複自己的配方，所以在製程意義上可以說固定。但兩者都保留P與Q，依化學分類仍是混合物。固定配方不能和單一化合物本身的固定化學組成混用，小整數比例也不是化學反應證據。","correct":"A","options":[{"id":"A","text":"兩者各有固定配方，但都不能因此當成單一純化合物","explanation":"正確（本題應選）：固定配方與單一化學物質是不同條件。"},{"id":"B","text":"只有甲的整數較小，才屬固定化學組成","explanation":"錯誤（本題不選）：整數大小不決定有無形成化合物。"},{"id":"C","text":"配方各自固定，代表P、Q已在兩產品中化學結合","explanation":"錯誤（本題不選）：題幹明定未反應，配方固定不能推翻此條件。"},{"id":"D","text":"甲乙配比不同，表示其中一份必只有單一成分","explanation":"錯誤（本題不選）：配比不同仍可各有相同兩成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"同兩成分可有多個各自穩定重複的產品配方。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B066","stem":"甲、乙兩種市售原料名稱不同，但完整分析證明兩者都只有相同純物質P。合併時未污染且未反應，應如何分類？","concept":"商品名稱只是稱呼；題幹的完整分析已確認化學身分相同。合併後仍只有P，不論加入比例如何，都不新增另一種成分。因此依化學身分分類為純P，而非依標籤或供應來源計數。","correct":"C","options":[{"id":"A","text":"因商品名稱兩種，必為混合物","explanation":"錯誤（本題不選）：名稱不同不足證明化學物質不同。"},{"id":"B","text":"因來源不同，必形成新化合物","explanation":"錯誤（本題不選）：來源差異不必發生反應。"},{"id":"C","text":"仍為純P，名稱數不等於化學身分數","explanation":"正確（本題應選）：以已確認成分身分而非商業命名判斷。"},{"id":"D","text":"若兩份等量才純，不等量必混合","explanation":"錯誤（本題不選）：同一P的比例分配不影響單一身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"不同稱呼可以指向同一化學物質。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B067","stem":"飲料甲標示『天然』，乙標示『實驗室調配』；完整成分皆為水與糖且未反應。哪項判斷正確？","concept":"天然或調配描述來源和製作，不保證化學成分只有一種。兩飲料都含水與糖，因此均為混合物。調配也不等於發生化學結合；本題明確未反應，應保留兩成分的原身分。","correct":"B","options":[{"id":"A","text":"天然的甲為純物質，乙才混合","explanation":"錯誤（本題不選）：天然材料同樣可能含多種物質。"},{"id":"B","text":"甲乙都是混合物，分類依成分而非取得方式","explanation":"正確（本題應選）：兩份完整成分皆有水、糖兩種物質。"},{"id":"C","text":"乙是化合物，因調配是化學結合的同義詞","explanation":"錯誤（本題不選）：題幹已說未反應，不能把調配當化合物形成。"},{"id":"D","text":"甲乙皆純，因都含天然存在的元素","explanation":"錯誤（本題不選）：組成元素來源不能決定整份是否單一物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"來源標語不能取代完整成分表。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-B068","stem":"鹽水原含NaCl 6 g與水54 g。理想移除18 g水，過程未反應且NaCl全部保留。剩餘NaCl質量比例與分類為何？","concept":"剩水54−18＝36 g，總量6＋36＝42 g，NaCl占6/42約為14.3%。水仍存在，所以仍是混合物；比例增加不等於只剩NaCl。質量比例必須以整份剩餘樣品作分母，不能只用水的36 g當分母。","correct":"D","options":[{"id":"A","text":"10%，純NaCl","explanation":"錯誤（本題不選）：10%是原配比，且水仍在不能判純。"},{"id":"B","text":"約14.3%，純NaCl","explanation":"錯誤（本題不選）：比值正確，但仍有水這一成分。"},{"id":"C","text":"約16.7%，混合物","explanation":"錯誤（本題不選）：16.7%錯把鹽除以水36 g，而非總量42 g。"},{"id":"D","text":"約14.3%，混合物","explanation":"正確（本題應選）：總量42 g、鹽6 g，兩成分共存。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"成分百分比的分母應取整份樣品總量。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B069","stem":"某理想處理後已完整確認：原鹽水中的水被全部移除，NaCl未反應且沒有其他成分殘留。剩餘固體如何分類？","concept":"依題定完整結果，剩餘成分只有未改變的NaCl，所以是純化合物。歷史上曾在混合物中不會永久決定其分類；只剩一種物質也不代表變成元素，NaCl的組成仍涉及不同元素。","correct":"A","options":[{"id":"A","text":"純NaCl化合物","explanation":"正確（本題應選）：最終完整清單只有NaCl這一種化合物。"},{"id":"B","text":"混合物，因它過去曾是鹽水","explanation":"錯誤（本題不選）：分類依當下成分，不沿用過去狀態。"},{"id":"C","text":"元素，因只剩一種物質","explanation":"錯誤（本題不選）：單一物質也可能為化合物。"},{"id":"D","text":"Na⁺與Cl⁻兩種離子共存，所以固體必是混合物","explanation":"錯誤（本題不選）：Na⁺與Cl⁻是同一NaCl離子化合物的組成，不是據此就判兩種物質混合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"若已確認另一成分全無殘留，才可依單一剩餘物質分類。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B070","stem":"甲、乙各自已確認為純化合物，但元素比例不同。下列何者正確？","concept":"固定組成是針對同一種純物質而言，不要求所有純物質彼此同一比例。甲乙可以各自只有一種化合物，卻是不同化合物而比例不同。不能把『各自純』誤解成『彼此相同』。","correct":"C","options":[{"id":"A","text":"只要都是純物質，元素比例就必完全一樣","explanation":"錯誤（本題不選）：不同純物質不必共有同一元素比例。"},{"id":"B","text":"至少一份一定是混合物","explanation":"錯誤（本題不選）：各自純與彼此不同可以同時成立。"},{"id":"C","text":"它們可各自純而屬不同化合物","explanation":"正確（本題應選）：正確限制固定組成概念的適用對象。"},{"id":"D","text":"比例不同表示兩份必都屬元素","explanation":"錯誤（本題不選）：題幹已說化合物，比例不同不改成元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"每種純化合物各有自己的固定組成。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B071","stem":"四張完整粒子圖的符號均已定義為不同物質P與Q。哪張可表示均勻混合物？","concept":"均勻混合物同時要求多種物質及空間組成一致。只有P或Q雖可均勻，卻缺少第二成分；上下分開則有兩成分但不均勻。各區域都有P、Q且同配比，才同時滿足本題兩個條件。","correct":"D","options":[{"id":"A","text":"全圖只有P","explanation":"錯誤（本題不選）：只有一成分，不是混合物。"},{"id":"B","text":"只有Q，排列整齊","explanation":"錯誤（本題不選）：只有Q，可純但不是兩成分混合。"},{"id":"C","text":"上半只有P、下半只有Q，組成明顯不同","explanation":"錯誤（本題不選）：兩成分存在，但各區組成不同。"},{"id":"D","text":"P、Q兩者在各區域都以相同比例分布","explanation":"正確（本題應選）：多成分且空間配比一致。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"判均勻混合物，需分別檢查『多成分』與『各處一致』。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B072","stem":"題定X₂與X₃為兩種不同元素物質，且均只含X元素。完整模型只有X₂、X₃且兩者皆存在。下列何者正確？","concept":"X₂與X₃已指定為兩種不同物質，因此物質種類為二；兩者都只有X，元素種類為一。下標2與3分別表示各粒子內的原子數，不能相加當成物質種類，也不能把原子數、元素種類數與物質種類數互換。","correct":"B","options":[{"id":"A","text":"物質1種、元素2種","explanation":"錯誤（本題不選）：把物質與元素兩種計數顛倒。"},{"id":"B","text":"物質2種、元素1種","explanation":"正確（本題應選）：兩個不同物質身分都由X構成。"},{"id":"C","text":"物質3種、元素3種","explanation":"錯誤（本題不選）：3是X₃的原子數，不是種類數。"},{"id":"D","text":"物質5種、元素1種","explanation":"錯誤（本題不選）：5來自下標相加，與物質種類無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"原子數、元素種類數及物質種類數分別計算。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B073","stem":"完整樣品含P、Q兩種已知化合物，每種分子都含X、Y、Z三種元素。若樣品完全均勻，以下何者正確？","concept":"P與Q已知是不同化合物，共存便是混合物；均勻只補充空間分布資訊。三種元素存在於化合物內，不表示三種元素物質各自存在，也不能用相同元素清單否定P、Q的不同身分。","correct":"A","options":[{"id":"A","text":"仍為兩種化合物的混合物","explanation":"正確（本題應選）：兩個化合物身分仍在，均勻不改變種類數。"},{"id":"B","text":"均勻使它變成一種化合物","explanation":"錯誤（本題不選）：混勻不等於P、Q轉為同一物質。"},{"id":"C","text":"因有三元素，應稱三種元素的混合物","explanation":"錯誤（本題不選）：元素組成不能直接當成游離元素成分。"},{"id":"D","text":"只要每種分子元素相同，P、Q就必同身分","explanation":"錯誤（本題不選）：同元素清單不足保證同一化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"相同元素清單的兩種化合物，也可形成均勻混合物。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B074","stem":"X、Y代表不同元素。完整模型先畫了4個XY分子，後來只把每個分子重新畫成Y—X，並註明連結與身分均未改變。分類應如何處理？","concept":"題幹明確只是把同一XY分子的畫面方向反轉，並未變更原子種類、數目或連結。所有粒子仍屬同一化合物，故純物質分類保持。視覺左右順序不能在沒有化學變化下創造第二種物質。","correct":"C","options":[{"id":"A","text":"由化合物變成元素","explanation":"錯誤（本題不選）：仍有X與Y兩種元素，不會因反轉變元素。"},{"id":"B","text":"由純物質變混合物","explanation":"錯誤（本題不選）：沒有新增不同粒子身分。"},{"id":"C","text":"維持同一純化合物，排列方向不是新身分","explanation":"正確（本題應選）：相同連結與組成表示仍是同一物質。"},{"id":"D","text":"物質種類增加一倍","explanation":"錯誤（本題不選）：重畫方向沒有增加化學種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"同一模型翻轉後要依化學含義判讀，不依畫面順序計數。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B075","stem":"甲是只有Na⁺與Cl⁻按NaCl組成形成的純晶體；乙是該NaCl與水構成的溶液。哪個計數方式最合理？","concept":"NaCl晶體中的兩類離子共同構成單一化合物，不能直接作兩種混合成分；乙則另有水，不能因均勻成一層就忽略水。計數尺度必須對應物質身分，而非離子種類、粒子個數或肉眼層數。","correct":"D","options":[{"id":"A","text":"甲兩種離子所以兩種物質；乙只一層液體所以一種物質","explanation":"錯誤（本題不選）：同時混淆離子種類與物態層數。"},{"id":"B","text":"甲兩種元素所以混合；乙透明所以純","explanation":"錯誤（本題不選）：元素種類和透明外觀都不能如此直接判純。"},{"id":"C","text":"甲、乙都把每個粒子各算成一種物質","explanation":"錯誤（本題不選）：每粒子不各自代表不同化學種類。"},{"id":"D","text":"甲按單一NaCl化合物判純；乙須把水這個成分計入","explanation":"正確（本題應選）：正確分開單一離子化合物與含水的混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"對離子物質，要區分化合物內構成與樣品外加成分。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B076","stem":"完整模型甲只有10個H₂O；乙只有8個H₂O、1個H₂O₂及1個H₂，三者為不同物質且未反應。兩模型的總H：O原子數比都為2：1。何者正確？","concept":"甲全部為水。乙總H＝16＋2＋2＝20，O＝8＋2＝10，總比雖相同，卻有H₂O₂與H₂額外成分，完整物質清單為三種。這顯示整體元素比可與純水吻合，仍不能取代分子或物質身分資訊。","correct":"B","options":[{"id":"A","text":"兩者都純水，因比值相同","explanation":"錯誤（本題不選）：總比相符不能排除乙明示的非水成分。"},{"id":"B","text":"乙仍非純水，因存在H₂O₂和H₂兩種額外物質","explanation":"正確（本題應選）：兩項額外身分使乙不是只有H₂O。"},{"id":"C","text":"甲不是純水，因只有10個分子","explanation":"錯誤（本題不選）：分子總數少不會取消純水資格。"},{"id":"D","text":"兩者都只有兩種物質，因只有H與O","explanation":"錯誤（本題不選）：兩種是元素數；甲一種物質、乙三種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"完整粒子清單比單一總元素比更能判斷是否只有水。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B077","stem":"完整模型含6個XY、3個X₂及2個Z₂，X、Y、Z代表不同元素。按物質類別，正確描述為何？","concept":"XY由不同元素構成，是化合物；X₂與Z₂各只含一種元素，是兩種元素物質。物質種類共3，而粒子總數6＋3＋2＝11。不要把元素種類清單或粒子個數取代每種物質的分類。","correct":"A","options":[{"id":"A","text":"一種化合物和兩種元素物質，共三種物質","explanation":"正確（本題應選）：逐一判XY、X₂、Z₂，類別和總數均正確。"},{"id":"B","text":"三種化合物，共三種物質","explanation":"錯誤（本題不選）：X₂、Z₂不含不同元素，不是化合物。"},{"id":"C","text":"三種元素物質，因有X、Y、Z","explanation":"錯誤（本題不選）：Y存在於XY中，不代表獨立Y元素物質。"},{"id":"D","text":"十一種物質，因共有十一個粒子","explanation":"錯誤（本題不選）：11是粒子數，不是化學種類數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"多成分模型先逐種分類，再計整體種類。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B078","stem":"樣品只含兩種已知物質P、Q。P由單原子粒子構成，Q由分子構成；兩者未反應。哪項結論必然正確？","concept":"題幹已給P與Q是兩種不同物質且共存，因此混合物判定已足夠。Q是分子型仍可能是元素物質或化合物，需元素資訊才知道；但這個尚未確定的小分類不妨礙整體判混合。","correct":"C","options":[{"id":"A","text":"分子構成的Q必為化合物","explanation":"錯誤（本題不選）：同元素原子也可構成分子，Q不必是化合物。"},{"id":"B","text":"單原子P必使整份成為純元素","explanation":"錯誤（本題不選）：Q仍存在，整體不是只有P。"},{"id":"C","text":"整份為混合物，不需先知道Q含幾種元素","explanation":"正確（本題應選）：兩種身分共存足夠判混合。"},{"id":"D","text":"P與Q粒子型態不同，所以不能放在同一樣品","explanation":"錯誤（本題不選）：不同粒子型態可以共存，無此排除規則。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"有些整體分類可以先確定，不需把每個下位類別全部查完。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B079","stem":"圖中相同P粒子聚成兩團，中間沒有粒子；圖例確認只有P且無其他成分。有人把兩團稱為兩種物質。哪項修正正確？","concept":"兩團表示相同物質的空間分布分開，沒有加入另一種化學身分。題幹又排除其他成分，所以仍只有P。空白不自動代表某物質，分團也不能被當成元素或物質種類增加。","correct":"D","options":[{"id":"A","text":"只要分成兩團，就必混合物","explanation":"錯誤（本題不選）：空間分離與化學種類是不同概念。"},{"id":"B","text":"空白處本身應算第二物質","explanation":"錯誤（本題不選）：圖例未將空白定義為成分，不能自行加入。"},{"id":"C","text":"每團至少是一種不同元素","explanation":"錯誤（本題不選）：相同P不因分團就變不同元素。"},{"id":"D","text":"團塊數描述分布，不是物質身分數；仍只有P","explanation":"正確（本題應選）：遵照完整成分限定，不按團數計種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"同一種材料分成兩塊，仍可能是同一純物質。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B080","stem":"『P：Q＝1：2』分別出現在兩份資料：甲明定是兩種液體未反應的混合配方；乙明定是純化合物內兩元素的原子數比。哪項正確？","concept":"符號和比值必須連同定義閱讀。甲的1：2是在配兩種保留身分的液體，乙是單一化合物內的元素原子組成。數值外形相同，所比較對象卻不同，不能把『小整數比』當作萬用分類依據。","correct":"B","options":[{"id":"A","text":"甲乙都必為化合物，因比例是小整數","explanation":"錯誤（本題不選）：混合配方同樣可以使用小整數。"},{"id":"B","text":"同一比值可表達不同層次，需依配方或化學組成語意判讀","explanation":"正確（本題應選）：正確區分物質配方與元素原子組成。"},{"id":"C","text":"甲乙都必為混合物，因各列兩個符號","explanation":"錯誤（本題不選）：兩種元素可構成單一化合物。"},{"id":"D","text":"比值相同就可不讀P、Q代表什麼","explanation":"錯誤（本題不選）：缺少符號含義就無法解讀比例的化學意義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"化學式的下標比與調配原料比不能互相替代。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B081","stem":"X、Y、Z代表不同元素。四份完整成分及其分類如下，哪一項配對有誤？","concept":"每份先數物質身分，再把單一身分分成元素或化合物。X₂只有X，XY含不同元素，皆可各自純；但X₂與XY同時存在時有兩種物質，不是單一化合物。兩種化合物共存的最後一項亦應為混合物。","correct":"C","options":[{"id":"A","text":"只有X₂，X是同一元素：元素型純物質","explanation":"錯誤（本題不選）：一種元素構成單一X₂物質，配對正確。"},{"id":"B","text":"只有XY，X與Y不同元素：化合物型純物質","explanation":"錯誤（本題不選）：不同元素結合成單一XY，配對正確。"},{"id":"C","text":"含X₂與XY且未反應：單一化合物","explanation":"正確（本題應選）：兩種身分共存，應改為元素與化合物的混合物。"},{"id":"D","text":"含XY與YZ兩種化合物：混合物","explanation":"錯誤（本題不選）：兩種不同化合物共存，配對正確。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"遇到分類配對題，不能因所有粒子共享X就合併成一種物質。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B082","stem":"判斷下列敘述：①純物質只能由一種元素構成；②混合物也可以均勻；③同一純物質不同用量仍有相同化學組成。何者正確？","concept":"①把元素的限制套到所有純物質，漏掉化合物，所以錯。②均勻混合物可以各處成分比例一致，正確。③只改用量不改變同一純物質的固定組成，也正確。逐句判完，再選②③的組合。","correct":"C","options":[{"id":"A","text":"只有①","explanation":"錯誤（本題不選）：①錯，且漏掉真正成立的②③。"},{"id":"B","text":"只有①②","explanation":"錯誤（本題不選）：①不成立，而③應納入。"},{"id":"C","text":"只有②③","explanation":"正確（本題應選）：②③均成立，①因純化合物反例而錯。"},{"id":"D","text":"①②③皆正確","explanation":"錯誤（本題不選）：①錯，因此不能全選。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"純水反駁①；均勻糖水支持②；分裝純水支持③。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-B083","stem":"甲、乙在相同條件下具有不同的完整元素比例。若假設它們都是同一純化合物R，哪項推理正確？","concept":"同一純化合物的固定組成不隨來源或取樣量任意改變。資料顯示完整元素比例不同，因此與兩份都是相同純R的假設不相容。此結論只排除該同一性假設，並不替兩份各自指定元素、化合物或混合物。","correct":"B","options":[{"id":"A","text":"不同來源允許同一R有任意不同的組成","explanation":"錯誤（本題不選）：來源不能取消相同化合物的固定組成要求。"},{"id":"B","text":"若同為純R應有相同組成，故此假設與資料衝突","explanation":"正確（本題應選）：正確利用同一純物質應有相同組成的必要條件。"},{"id":"C","text":"兩者外觀相同即可消除組成差異","explanation":"錯誤（本題不選）：外觀相似不能抵銷成分衝突。"},{"id":"D","text":"兩者等重即可證明是同一R","explanation":"錯誤（本題不選）：質量相等不能推出相同元素比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"必要條件不符可排除假設，但未必能立刻指定替代分類。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B084","stem":"實驗已確認起始樣品為單一物質R。R須經化學反應才轉成兩種更簡單物質；單純分裝不改變R。這最支持哪項結論？","concept":"單一物質可在化學反應中形成不同產物，這不表示原先混放那些產物。R能化學轉為更簡單物質，支持化合物概念；分裝只改變樣品量，不能等同化學分解。需對比操作是否改變化學身分。","correct":"D","options":[{"id":"A","text":"R起初就是兩物質的混合物","explanation":"錯誤（本題不選）：把化學生成物誤當原有混合成分。"},{"id":"B","text":"R必是元素，因分裝不改變它","explanation":"錯誤（本題不選）：不受分裝影響並非元素獨有特徵。"},{"id":"C","text":"所有可分裝材料都不能是化合物","explanation":"錯誤（本題不選）：化合物也能在未反應下分裝。"},{"id":"D","text":"R可為化合物；化學轉化與單純分裝應區分","explanation":"正確（本題應選）：同時保留單一物質與可化學分解兩項資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"切小、分杯與化學分解不是同一種變化。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B085","stem":"要在本題理想分類下確認某瓶是純水，下列哪項證據最充分？","concept":"只有H₂O的完整成分結論直接符合純水定義。其餘只提供外觀、來源或單一性質相符，皆無法排除溶解成分或其他身分。題目使用理想完整確認作前提，避免把檢測能力有限的『未見』誤當絕對純。","correct":"A","options":[{"id":"A","text":"完整分析確認瓶內只有H₂O，沒有其他物質","explanation":"正確（本題應選）：明確排除所有其他物質，足以判純水。"},{"id":"B","text":"液體無色透明且沒有沉澱","explanation":"錯誤（本題不選）：透明無沉澱不能排除均勻溶解成分。"},{"id":"C","text":"液體來自標示乾淨的來源","explanation":"錯誤（本題不選）：乾淨來源不是成分只有H₂O的證據。"},{"id":"D","text":"測得一項密度值與純水相同","explanation":"錯誤（本題不選）：密度重合不能單獨排除其他組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"完整成分身分證據比一般外觀或單項物性更直接。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B086","stem":"報告甲說『主要成分是P』；報告乙說『在所討論的完整理想樣品中只有P』。對純度判斷何者正確？","concept":"『主要』描述相對占比最大，不排除次要成分；『只有』則是對完整成分的排他限定。依題定理想完整範圍，乙可支持單一純P，甲尚不足。不能把文字上的程度詞當作全部成分已查明。","correct":"C","options":[{"id":"A","text":"兩報告都同樣證明只有P","explanation":"錯誤（本題不選）：主要與唯一的限制強度不同。"},{"id":"B","text":"甲可直接判純，乙不能","explanation":"錯誤（本題不選）：恰好顛倒兩份報告的證據力。"},{"id":"C","text":"甲未排除少量其他物質；乙才限定單一物質","explanation":"正確（本題應選）：正確分清占比主次與成分唯一性。"},{"id":"D","text":"甲已確定存在其他物質，所以可以直接判混合物","explanation":"錯誤（本題不選）：主要成分是P尚未交代完整成分，既不能證只有P，也不能單憑此確認另一物質一定存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"主要成分很多，與沒有次要成分，並非同義。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B087","stem":"兩份樣品都被標示為『無水純NaCl』。檢查它們是否為同一純物質時，下列哪項差異不能單獨否定此主張？","concept":"晶粒大小和顆數只描述外形、分割或用量；相同NaCl可以有不同大小與數量的晶粒，所以這項差異不足否定兩份為同一純物質。若確認另有水、KCl或物質本身不是NaCl，才會直接衝突於無水純NaCl的標示。","correct":"B","options":[{"id":"A","text":"其中一份另有水這種成分","explanation":"錯誤（本題不選）：若另有水，便與無水單一NaCl條件衝突。"},{"id":"B","text":"兩份晶粒大小和顆數不同","explanation":"正確（本題應選）：同一化合物可以呈現不同晶粒大小或數量。"},{"id":"C","text":"其中一份另含KCl","explanation":"錯誤（本題不選）：額外KCl會增加另一化合物成分。"},{"id":"D","text":"完整化學組成顯示其中一份不是NaCl","explanation":"錯誤（本題不選）：已不是NaCl直接否定同一物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"外形不同不是化學身分不同的充分條件。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-B088","stem":"P是不同於水的可溶固體。P與水剛混合時看得到少量固體P，充分溶解後看不到固體；已知P未反應且都留在水中。何者正確？","concept":"題幹已說明P未反應且留在水中，所以可見固體消失是溶解後的外觀變化，而非成分被移除。最終仍包含P與水，是混合物；不能把看不見單獨的固體當作只剩水的證據。","correct":"D","options":[{"id":"A","text":"看不到P就代表P已不存在","explanation":"錯誤（本題不選）：與P仍留在水中的已知資訊不符。"},{"id":"B","text":"P已與水形成一種新化合物，所以溶液為純物質","explanation":"錯誤（本題不選）：題幹明定未反應，溶解不等於P與水生成單一新化合物。"},{"id":"C","text":"溶解後只能算水一種物質","explanation":"錯誤（本題不選）：水外還有P，應列兩成分。"},{"id":"D","text":"視覺上看不到P，不表示P這個溶解成分消失","explanation":"正確（本題應選）：正確區分可見固體與成分存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"糖粒看不見了，溶液中仍可能有糖。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-B089","stem":"兩份材料都只含P，但其中一份溫度較高、體積較大。以下哪項應優先區分，才不會誤判成不同物質？","concept":"題定兩份只有P，已有相同成分身分資訊。體積可受用量與條件影響，溫度也須納入物性比較，不能直接當成化學式不同。判斷時先把條件與總量分清，才不會由物理外觀差異超推成分改變。","correct":"A","options":[{"id":"A","text":"物理條件與總量的差異，和化學成分身分的差異","explanation":"正確（本題應選）：將可變條件與固定化學身分分開。"},{"id":"B","text":"只依體積較大判為混合物，不需讀成分","explanation":"錯誤（本題不選）：體積大小不提供多成分的直接證據。"},{"id":"C","text":"只依溫度較高判為另一化合物","explanation":"錯誤（本題不選）：溫度不同不等於發生化學身分改變。"},{"id":"D","text":"只要體積不同，P的化學式就必不同","explanation":"錯誤（本題不選）：體積變動沒有必然的化學式轉換。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"一份物質變熱或取更多，未必發生化學變化。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B090","stem":"純P可用分子描述，純Q用離子晶體描述，且兩者均由不同元素以固定比例構成。正確分類為何？","concept":"化合物依不同元素的固定化學組成判定，不要求同一微觀形式。P是分子型，Q是離子型，但兩者都已給定單一純物質且涉及不同元素，因此皆為純化合物。不能把離子種類多或分子存在誤作分類分界。","correct":"C","options":[{"id":"A","text":"P化合物，Q混合物","explanation":"錯誤（本題不選）：離子晶體也可構成單一化合物。"},{"id":"B","text":"P元素，Q化合物","explanation":"錯誤（本題不選）：P既含不同元素，就不是元素物質。"},{"id":"C","text":"P與Q均為化合物型純物質","explanation":"正確（本題應選）：兩者都滿足純化合物的組成條件。"},{"id":"D","text":"P與Q均為元素，因各自純","explanation":"錯誤（本題不選）：純物質不只包含元素，也包括化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"水與NaCl可示範不同微觀表示、相同化合物大類。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B091","stem":"P、Q是不同物質。甲每批只有化合物R且組成固定；乙每批都以同一比例混合P、Q且未反應；丙各批P、Q比例不同且未反應。何者正確？","concept":"甲的固定組成屬於單一R的化學身分。乙是固定配方混合物，丙是配方可變混合物；兩者都仍有P與Q。因此是否固定不是單獨決定純度的充分條件，必須連同物質身分及種類判讀。","correct":"B","options":[{"id":"A","text":"甲乙純、丙混合","explanation":"錯誤（本題不選）：乙雖配方固定，仍有兩種物質。"},{"id":"B","text":"只有甲可依題定成分判純；乙丙皆混合","explanation":"正確（本題應選）：甲單一R，乙丙都為P、Q共存。"},{"id":"C","text":"三者皆純，因都有可描述的比例","explanation":"錯誤（本題不選）：能描述配比不等於單一化學身分。"},{"id":"D","text":"甲混合、乙丙純，因R含不同元素","explanation":"錯誤（本題不選）：R含不同元素仍可純；乙丙各有兩種物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"固定組成純物質與固定配方混合物，可同時存在。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B092","stem":"容器左半只含P，右半只含Q，兩者不同且未反應。若討論整個容器內容，與分別討論左右部分，哪項正確？","concept":"全容器同時含P和Q，所以是混合物；若各半部分確實只含其單一物質，分別可為純樣品。這不是分類矛盾，而是討論範圍不同。共用容器不表示化學結合，也不把每側原本的成分自動改寫。","correct":"C","options":[{"id":"A","text":"整體純，左右各混合","explanation":"錯誤（本題不選）：整體有兩成分，各側才各單一。"},{"id":"B","text":"整體有兩部分，所以左右各都含兩成分","explanation":"錯誤（本題不選）：把整體成分錯套到題定各半區域。"},{"id":"C","text":"整體混合，左右各自可純；須先界定樣品範圍","explanation":"正確（本題應選）：清楚區分整體與局部的完整成分。"},{"id":"D","text":"整體必為化合物，因P、Q位於同一容器","explanation":"錯誤（本題不選）：空間並置不是生成化合物的證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"同一材料的整體與局部，可能因涵蓋成分不同而分類不同。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B093","stem":"比較兩份液體的密度。甲資料為20°C、1 atm；乙提供三次數據：①20°C、2 atm，②30°C、1 atm，③20°C、1 atm。若皆同狀態，應優先拿乙哪次與甲比較？","concept":"甲的參考條件是20°C、1 atm。乙③在這兩項及題定狀態上都一致，最適合直接比較。①或②仍各有一項差異；將不同條件數值平均，也不會自然等於共同條件下的測量。","correct":"D","options":[{"id":"A","text":"①，因只差壓力","explanation":"錯誤（本題不選）：仍有壓力差，不能視為完全對齊。"},{"id":"B","text":"②，因只差溫度","explanation":"錯誤（本題不選）：仍有溫度差，不能視為完全對齊。"},{"id":"C","text":"①②平均，便會變同條件","explanation":"錯誤（本題不選）：平均數值不會自動消除條件差的物理意義。"},{"id":"D","text":"③，因溫度與壓力都對齊","explanation":"正確（本題應選）：兩個控制條件與狀態均匹配。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"找可比資料時，應核對整組條件，而非只看其中一欄。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-B094","stem":"實驗起初含P、Q兩種不同物質。最後檢驗確認P與Q都已不存在，完整樣品只有新化合物R。下列何者可由資料推出？","concept":"資料限定最終只有R，因此可判純化合物R。起初則仍按P、Q的成分分類，不能用最終結果倒改起始身分。原料轉化後不再存在，也不應在最終清單重複保留，物質種類是隨所討論時點判斷。","correct":"A","options":[{"id":"A","text":"最終可判純R，但不能說反應前已只有R","explanation":"正確（本題應選）：分別尊重起始與最終的成分清單。"},{"id":"B","text":"P、Q消失證明最終沒有物質","explanation":"錯誤（本題不選）：原料不存在不表示產物R不存在。"},{"id":"C","text":"最終仍應把P、Q算入成分，所以共三種","explanation":"錯誤（本題不選）：已確認P、Q不存在，不能列現存成分。"},{"id":"D","text":"最終R必是元素，因只剩一種物質","explanation":"錯誤（本題不選）：R是題定化合物，單一不等於元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"完整轉化後計產物，不能把消失的原料當作殘留成分。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-B095","stem":"對一份只含H₂O的完整樣品，四份粒子計數報告如下。哪份在原子比例上相容？","concept":"每個H₂O有2個H和1個O，所以完整樣品H總數必為O的兩倍。22與11滿足2：1，可對應11個水分子；其餘比例分別1：1、1：2及2.2：1，都不相容。比例相符本身仍不取代題定的只有水資訊。","correct":"B","options":[{"id":"A","text":"H 20個、O 20個","explanation":"錯誤（本題不選）：20：20為1：1，缺少相對應的H。"},{"id":"B","text":"H 22個、O 11個","explanation":"正確（本題應選）：22：11為2：1，符合H₂O的必要組成。"},{"id":"C","text":"H 11個、O 22個","explanation":"錯誤（本題不選）：11：22為1：2，將氫氧比例倒置。"},{"id":"D","text":"H 22個、O 10個","explanation":"錯誤（本題不選）：22：10不是2：1，兩者數目不配套。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"先確認『H應為O兩倍』，再檢查各數對。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-B096","stem":"X、Y代表不同元素。完整模型甲只有X₂Y₂分子；乙有等數量的XY與X₂Y₂兩種不同化合物。即使兩模型整體X：Y皆為1：1，何者正確？","concept":"X₂Y₂及XY各自都具有X：Y＝1：1，因此混合後總比也保持1：1。但乙仍明確含兩種化合物，不能因總比不變而判純；甲只有一種分子，可純。此例說明混合可以不改變某項整體元素比。","correct":"C","options":[{"id":"A","text":"甲乙皆同一純物質","explanation":"錯誤（本題不選）：乙有兩個不同物質身分。"},{"id":"B","text":"甲混合、乙純，因乙有兩式相互平衡","explanation":"錯誤（本題不選）：兩化合物並存不是相互抵銷成一物質。"},{"id":"C","text":"甲可純，乙混合；相同總比不等於同一物質清單","explanation":"正確（本題應選）：分別核對完整物質清單與整體比例。"},{"id":"D","text":"只有X：Y不等於1：1時才可能混合","explanation":"錯誤（本題不選）：相同比例的不同物質也能混合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"把兩種各自同元素比的化合物混合，總比仍可能不變。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-B097","stem":"把純元素物質E切成十塊，與把純化合物R經化學反應分成較簡單物質相比，下列哪項正確？","concept":"『分開』在日常語言中可指不同事情。切割E只是把同一材料分成小塊，沒有給出化學轉化；R的化學分解則形成不同物質。不能以物件數增加統一判成反應，也不能把化合物分解等同研碎。","correct":"D","options":[{"id":"A","text":"兩者都是化學分解，因物件數增加","explanation":"錯誤（本題不選）：物件數增加不足證明化學身分改變。"},{"id":"B","text":"切割使E變十種元素","explanation":"錯誤（本題不選）：十塊E仍可全是同一元素物質。"},{"id":"C","text":"化學分解只是在改變R的顆粒大小","explanation":"錯誤（本題不選）：題定化學反應會形成不同物質，非只是改粒徑。"},{"id":"D","text":"切割未必改變E的身分；R的化學分解會改變物質身分","explanation":"正確（本題應選）：正確區分物理分割與化學轉化。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"『能切小』不是否定元素不可化學分解定義的反例。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-B098","stem":"『沒有可見雜質』與『沒有其他化學物質』兩種描述，哪項關係最正確？","concept":"可見雜質描述的是觀察方式的範圍；溶解或難以目視辨認的成分仍可能存在。沒有其他化學物質才是單一物質的成分限制，且該物質可以是元素或化合物。因此不能把外觀乾淨直接等同純度定義。","correct":"A","options":[{"id":"A","text":"前者只限可見範圍，未必推出後者","explanation":"正確（本題應選）：可見與完整成分之間存在證據範圍差。"},{"id":"B","text":"前者一定推出後者","explanation":"錯誤（本題不選）：均勻溶液可無可見雜質卻有第二成分。"},{"id":"C","text":"後者不可能出現在化合物中","explanation":"錯誤（本題不選）：單一化合物也可沒有其他物質。"},{"id":"D","text":"兩者都等於只有一種元素","explanation":"錯誤（本題不選）：單一物質不必單一元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"目視清澈與化學成分單一不能直接畫上等號。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-B099","stem":"純化合物R只含A、B兩種不同元素，A占總質量40%。某10 g樣品的完整元素分析為A 4 g、B 6 g，但尚未確認化學身分。何者正確？","concept":"4/10＝40%，這份樣品通過R的該項元素比例比較。然而元素質量清單尚未說明原子是以單一R存在，還是以不同物質共存。因此比例相容可保留R為候選，不能直接升級為已證明純R。","correct":"B","options":[{"id":"A","text":"10 g與40%已足以證明是純R","explanation":"錯誤（本題不選）：將必要組成相符誤當充分純度證據。"},{"id":"B","text":"元素比例符合R，但仍可能是其他身分或混合物，須補查","explanation":"正確（本題應選）：計算相符但保留化學身分未定的限制。"},{"id":"C","text":"A占總質量4%，因此元素比例已不符合R","explanation":"錯誤（本題不選）：4 g是A的質量；4/10乘100%為40%，不是4%。"},{"id":"D","text":"只要有A與B兩元素，就只能是混合物","explanation":"錯誤（本題不選）：不同元素可以化學結合成純化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"『與R相容』和『確定就是純R』要分開表述。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B100","stem":"X、Y代表不同元素。五份理想樣品完整資料：甲只有H₂O；乙只有NaCl；丙只有X₂；丁含H₂O與糖；戊含X₂及XY兩種物質。哪些為純物質？","concept":"甲水、乙NaCl都是單一化合物，丙X₂是單一元素物質，因此三者皆純。丁有水與糖，戊有X₂與XY，兩者皆多成分混合物。先判物質種類數，再區分純物質內的元素或化合物，可避免漏算任一分支。","correct":"D","options":[{"id":"A","text":"只有甲乙","explanation":"錯誤（本題不選）：漏掉同樣單一物質的元素樣品丙。"},{"id":"B","text":"只有丙","explanation":"錯誤（本題不選）：把純化合物甲乙錯排除。"},{"id":"C","text":"甲乙丙丁","explanation":"錯誤（本題不選）：丁含水與糖，不能納入純物質。"},{"id":"D","text":"甲乙丙","explanation":"正確（本題應選）：甲乙丙各只有一種物質，丁戊各有兩種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"純物質包括元素與化合物，混合物也能包含這兩類作成分。","pointId":"PURE-P02","schools":["CMU"]}]},{"depth":"精讀","target":150,"questions":[]}],"schoolBanks":{"CMU":[["G03-PURE-S001","G03-PURE-S002","G03-PURE-S003","G03-PURE-S004","G03-PURE-S005","G03-PURE-S006","G03-PURE-S007","G03-PURE-S008","G03-PURE-S009","G03-PURE-S010","G03-PURE-S011","G03-PURE-S012","G03-PURE-S013","G03-PURE-S014","G03-PURE-S015","G03-PURE-S016","G03-PURE-S017","G03-PURE-S018","G03-PURE-S019","G03-PURE-S020","G03-PURE-S021","G03-PURE-S022","G03-PURE-S023","G03-PURE-S024","G03-PURE-S025","G03-PURE-S026","G03-PURE-S027","G03-PURE-S schoolCoverage":{"CMU":[{"status":"COMPLETE","reason":"","pointIds":["PURE-P01","PURE-P02","PURE-P03","PURE-P04","PURE-P05","PURE-P06","PURE-P07","PURE-P08","PURE-P09","PURE-P10"]},{"status":"COMPLETE","reason":"","pointIds":["PURE-P01","PURE-P02","PURE-P03","PURE-P04","PURE-P05","PURE-P06","PURE-P07","PURE-P08","PURE-P09","PURE-P10"]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}],"TCU":[{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}],"ISU":[{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}]}},{"id":"central-0-1-ch1-sec1-2-topic03","title":"1.2-03 元素","version":"B01-G03-v1-77e44f040000a044","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.2 物質的分類"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-2-topic03-G03-S001","stem":"按元素質量比較，銀河系、人體及地殼中含量最多的元素依序為何？","concept":"本教材列出118種已知元素。元素的種類數是在數不同元素有幾種；豐度是在指定環境、指定基準下比較各元素占多少。兩者不能互相替代。同一元素在銀河系、地殼與人體的比例可以不同，主要成分也不必相同。\n\n三個環境要分別判斷。銀河系以氫約74%質量居首，氦約24%居次；人體氧約65%高於碳18%及氫10%；含海洋大氣的地殼氧49.5%高於矽25.7%。因此依序為氫、氧、氧，不能用一個環境的主要元素代替另一個環境。","correct":"A","options":[{"id":"A","text":"氫、氧、氧","explanation":"正確。氫在銀河系、氧在人體及地殼各居質量首位。"},{"id":"B","text":"氫、氫、矽","explanation":"錯誤。人體的質量首位是氧而非氫；地殼首位是氧而非矽。"},{"id":"C","text":"氦、氧、矽","explanation":"錯誤。銀河系氦次於氫，地殼矽次於氧。"},{"id":"D","text":"氧、碳、氧","explanation":"錯誤。銀河系首位為氫，人體首位為氧；碳不是人體質量最多者。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、3、4。","example":"","pointId":"EL-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S002","stem":"地殼元素質量表中，五種已單列元素合計90.8%，另有「其他9.2%」。這個「其他」應如何解讀？","concept":"本教材列出118種已知元素。元素的種類數是在數不同元素有幾種；豐度是在指定環境、指定基準下比較各元素占多少。兩者不能互相替代。同一元素在銀河系、地殼與人體的比例可以不同，主要成分也不必相同。\n\n「其他」是資料合併的類別，仍可能包含多種不同元素。已單列90.8%與未單列合計9.2%相加為100%。它沒有指定一種名為「其他」的元素，也沒有給出每一種未單列元素的分率；原資料按質量，不能直接改作原子個數。","correct":"B","options":[{"id":"A","text":"質量排名第六的單一元素占9.2%","explanation":"錯誤。把合併類別誤當單一元素；資料沒有列出第六名的名稱及個別占比。"},{"id":"B","text":"未單列的各種元素質量相加，共占9.2%","explanation":"正確。合計類別的9.2%是全部未單列元素的質量分率總和。"},{"id":"C","text":"未單列的每一種元素各占9.2%","explanation":"錯誤。9.2%是多項合計，不是每一項各有的比例。"},{"id":"D","text":"未單列的各種元素原子數相加，共占9.2%","explanation":"錯誤。原表按質量計，原子數分率還需要單顆原子質量才能換算。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文1、2。","example":"","pointId":"EL-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S003","stem":"銀河系的氫與氦分別約占總質量74%及24%。下列敘述何者正確？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n兩個百分比都使用銀河系總質量作分母，所以74%大於24%可直接推出氫的總質量較大。資料沒有給出個數比例；其餘元素共占2%，也不代表每種各占2%。","correct":"C","options":[{"id":"A","text":"氦的單顆原子質量是氫的24倍","explanation":"錯誤。總體豐度無法直接表示單顆原子質量比。"},{"id":"B","text":"其餘元素各占2%","explanation":"錯誤。2%是所有其他元素的總和。"},{"id":"C","text":"氫的總質量大於氦的總質量","explanation":"正確。共同分母下可直接比較74與24。"},{"id":"D","text":"氫原子個數占74%","explanation":"錯誤。質量占比不能直接換成個數占比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S004","stem":"在以元素質量表示的銀河系組成中，氫占74%、氦占24%。未列出的元素合計約占多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n完整質量分布合計為100%。先合計氫與氦為98%，再用1
