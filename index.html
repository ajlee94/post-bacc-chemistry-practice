 SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B053","stem":"一個乙醇分子中 H：C 為 3：1。若取 5 個完整乙醇分子，H：C 原子數比為何？","concept":"增加相同分子的個數，所有元素原子數都乘上同一倍數，因此數量比維持不變。五個乙醇有 30 H、10 C，H：C=30：10=3：1。常見陷阱是只把比例的一側乘以分子數，或用氫總數與單一碳相比；比例的兩側必須對應同一份樣品。","correct":"A","options":[{"id":"A","text":"3：1","explanation":"正確：30：10 約分後仍為 3：1。"},{"id":"B","text":"5：1","explanation":"錯誤：分子數 5 不是氫碳比。"},{"id":"C","text":"15：1","explanation":"錯誤：只把原比例前項乘以 5，後項也應同步增加。"},{"id":"D","text":"30：1","explanation":"錯誤：30 是氫總數，碳總數是 10 而非 1。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B054","stem":"一組共有 3 個分子，其中 1 個是 O2，其餘全是 H2O。這組分子包含多少個原子及多少種元素？","concept":"先用總分子數扣去氧氣，得到兩個水分子。O2 有 2 個原子，兩個 H2O 有 6 個，合計 8 個；出現的元素只有 H 與 O，所以種類數是 2。分子種類、分子個數、元素種類與原子個數是四種不同的計數，應逐一標明單位避免混淆。","correct":"B","options":[{"id":"A","text":"6 個；2 種","explanation":"錯誤：6 只計兩個水分子，漏掉 O2 的兩個原子。"},{"id":"B","text":"8 個；2 種","explanation":"正確：2+2×3=8 個原子，僅有 H、O 兩種元素。"},{"id":"C","text":"8 個；3 種","explanation":"錯誤：3 是分子個數，不是元素種類數。"},{"id":"D","text":"9 個；2 種","explanation":"錯誤：三個分子並非都各含三個原子，O2 只有兩個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文6–8/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B055","stem":"模型以黑球代表C、白球代表H、紅球代表O。三個完全相同的完整分子合計有6黑、18白、6紅。每個分子的分子式為何？","concept":"先由圖例把顏色轉成元素，再區分整組與單分子：三個相同分子共6C、18H、6O，每個分子便分別為6÷3=2C、18÷3=6H、6÷3=2O。因此分子式是C2H6O2。不能把全組總數直接寫成一個分子的式子，也不能在分組後互換元素下標或漏掉氧。","correct":"C","options":[{"id":"A","text":"C6H18O6","explanation":"錯誤：這是三個分子合計的原子清單，不是每個分子的分子式。"},{"id":"B","text":"C2H6O","explanation":"錯誤：六個氧分給三個相同分子，每個應有兩個氧，不是一個。"},{"id":"C","text":"C2H6O2","explanation":"正確：各元素總數分別除以三，得到2C、6H、2O。"},{"id":"D","text":"C6H2O2","explanation":"錯誤：分組後碳為二、氫為六，此項把碳氫的下標交換。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B056","stem":"一個完整分子模型含2C、6H、1O，且氧直接連接一個碳及一個氫。哪個縮寫式同時符合組成與連接資料？","concept":"先用原子數篩選：CH3OCH3與CH3CH2OH都為C2H6O，HOCH2CH2OH有兩個氧，CH3OH則只有一個碳。再用模型的連接資料判斷：氧接一C與一H符合CH3CH2OH；CH3OCH3中的氧接兩C，不符合。這是模型資訊與結構式的相互核對，缺少任一類資訊都可能留下錯誤候選。","correct":"D","options":[{"id":"A","text":"CH3OCH3","explanation":"錯誤：原子數符合C2H6O，但氧直接連兩個碳，與指定C—O—H不同。"},{"id":"B","text":"HOCH2CH2OH","explanation":"錯誤：這個式子含兩個氧，與完整模型只有一氧不符。"},{"id":"C","text":"CH3OH","explanation":"錯誤：氧的連接可符合C—O—H，但此式只有一碳四氫，組成不符。"},{"id":"D","text":"CH3CH2OH","explanation":"正確：合計C2H6O，且末端OH使氧直接連一碳與一氫，兩個條件都符合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B057","stem":"一個乙醇分子以CH3CH2OH表示。與碳直接相連的氫，占這個分子全部氫原子的比例為何？","concept":"縮寫式同時提供數量與連接線索。CH3及CH2上的氫直接接碳，共3+2=5個；OH中的一個氫接氧，也必須計入全部氫。分母因此為5+1=6，所求比例是5/6。若改問接氧的氫才是1/6；若問氫占全部原子，則要使用九個原子作分母，不能混用。","correct":"B","options":[{"id":"A","text":"2/3","explanation":"錯誤：2/3等於6/9，是氫占全部原子的比例，並非接碳氫占全部氫。"},{"id":"B","text":"5/6","explanation":"正確：接碳的氫五個，全部氫六個，比例為5/6。"},{"id":"C","text":"1/6","explanation":"錯誤：1/6是接氧的一個氫占全部氫的比例，所求對象相反。"},{"id":"D","text":"3/4","explanation":"錯誤：分子全部氫為六個，接碳氫五個，沒有3/4的分子分母。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B058","stem":"使用白 H、黑 C、紅 O 的模型套件，組裝 2 個 CO2 及 1 個 H2O，至少需要哪些球？","concept":"兩個 CO2 各需 1 C、2 O，合計 2 黑與 4 紅；一個水需 2 H、1 O，再加入 2 白與 1 紅。最後總共 2 黑、2 白、5 紅。分子式計數與圖例對應要分成兩步：先求元素數，再選相應顏色，才能避免把不同分子的材料漏加。","correct":"A","options":[{"id":"A","text":"2 黑、2 白、5 紅","explanation":"正確：C2、H2、O5 分別對應 2 黑、2 白、5 紅。"},{"id":"B","text":"2 黑、4 白、3 紅","explanation":"錯誤：氫多算兩個，氧少算兩個。"},{"id":"C","text":"1 黑、2 白、3 紅","explanation":"錯誤：這僅足以組裝一個 CO2 加一個 H2O。"},{"id":"D","text":"2 黑、2 白、6 紅","explanation":"錯誤：水只需一個氧，氧球總數為五個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B059","stem":"模型圖例為黑C、紅O；每一完整分子是一黑球連接兩紅球。若有三個這樣的分子模型且未提供物性測量，哪項判斷正確？","concept":"每組模型表示1C、2O，即一個CO2；三組包含3×1=3C與3×2=6O，共九個原子。分子數仍是三個，不能把九個原子球當九個分子。模型的計數與示意連接也沒有提供實際樣品的質量、體積條件，所以不能從球數直接得到精確密度。","correct":"C","options":[{"id":"A","text":"原子總數為三個，因此可由球數直接求樣品密度","explanation":"錯誤：三個是分子數，原子共有九個；而密度也不是只由球數直接算出。"},{"id":"B","text":"共有三個碳與三個氧，因每個分子只算一次氧元素","explanation":"錯誤：氧只有一種元素，但每個分子有兩個氧原子，不能把種類數當個數。"},{"id":"C","text":"共有三個碳與六個氧，但這些資訊不足直接求精確密度","explanation":"正確：3C、6O依完整分子計得，精確密度仍需相應物性資料。"},{"id":"D","text":"共有九個完整分子，因每一原子球都代表一個分子","explanation":"錯誤：一球代表一原子，多個相連原子才組成此處一個分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B060","stem":"兩個完整模型都含 2 C、6 H、1 O。甲的氧接一個 C 與一個 H；乙的氧接兩個 C。哪項比較正確？","concept":"先以球數確認組成：兩者都是 C2H6O。再檢查指定氧原子的鄰接，甲為 C、H，乙為 C、C，因此連接不同。模型比較應同時保留『有幾個球』和『球如何相接』兩份資訊；第一份相同不會消除第二份的差異，也不能保證兩者性質完全相同。","correct":"B","options":[{"id":"A","text":"甲比乙少一個碳","explanation":"錯誤：題目明確給定兩者都有兩個碳。"},{"id":"B","text":"兩模型表示相同組成與不同連接","explanation":"正確：元素數相同，氧的鄰接關係不同。"},{"id":"C","text":"乙比甲多一種元素","explanation":"錯誤：兩者都只有 C、H、O 三種元素。"},{"id":"D","text":"只要球數相同，連接差異可忽略","explanation":"錯誤：連接本身就是結構資訊，不應因球數相同而略去。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B061","stem":"球棍模型中黑球代表C、白球代表H、紅球代表O。X每個完整分子為2黑6白1紅，Y每個為2黑6白2紅。2個X與3個Y合計的H：O原子數比為何？","concept":"先依圖例把球數轉成元素數：X為C2H6O，Y為C2H6O2。兩X加三Y共有(2+3)×6=30個H，氧則為2×1+3×2=8個，所以H：O=30：8=15：4。兩種分子的氧數不同，不能只把分子總數當氧數，也不能直接使用其中一種分子的比值代表整組。","correct":"D","options":[{"id":"A","text":"6：1","explanation":"錯誤：6：1只是X單分子的H：O，漏掉Y每分子有兩個氧的差異。"},{"id":"B","text":"3：1","explanation":"錯誤：3：1只是Y單分子的H：O，沒有合併兩個X。"},{"id":"C","text":"6：5","explanation":"錯誤：6：5把每分子氫數與整組分子數相比，兩側基準不同。"},{"id":"D","text":"15：4","explanation":"正確：全部H為30、O為8，約分得到15：4。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B062","stem":"白球代表 H、紅球代表 O。某圖有 3 組彼此分開的紅—紅模型，每組代表一個完整分子。應記錄為何？","concept":"題目把每組相連的紅—紅定義為一個完整分子。紅球代表氧，因此每組是 O2，三組即 3 個氧分子、6 個氧原子。分組邊界是辨別分子個數的重要資訊，不能把六顆球全部併成一個分子，也不能把原子球數直接稱為分子數。","correct":"A","options":[{"id":"A","text":"3 個氧分子，6 個氧原子","explanation":"正確：三組 O2，共有六個氧原子。"},{"id":"B","text":"6 個氧分子，3 個氧原子","explanation":"錯誤：把分子個數與原子個數顛倒。"},{"id":"C","text":"3 個水分子，6 個氧原子","explanation":"錯誤：圖中沒有代表氫的白球，不能視為水。"},{"id":"D","text":"1 個 O6 分子","explanation":"錯誤：三組彼此分開，不是六個氧組成的單一分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B063","stem":"一張粒子圖只含完整CO2與H2O分子，共7個分子。黑球代表C、白球代表H、紅球代表O，數得全圖10個紅球。全圖應有多少個白球？","concept":"先由氧數推分子組合。若七個分子都是H2O，會有七個氧；每以一個CO2取代一個水，氧增加一個。現有十個氧，比七多三，所以有三個CO2與四個H2O。氫只來自水，白球數為4×2=8。驗算氧為3×2+4=10，分子數3+4=7，兩條件同時符合。","correct":"B","options":[{"id":"A","text":"4","explanation":"錯誤：4是水分子的個數；每個水有兩個氫，還需乘二。"},{"id":"B","text":"8","explanation":"正確：三個CO2與四個水符合條件，四個水提供八個氫。"},{"id":"C","text":"10","explanation":"錯誤：10是氧的紅球數，不能直接當成氫的白球數。"},{"id":"D","text":"14","explanation":"錯誤：14把七個分子全算成水，會只得到七個氧而非十個氧。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B064","stem":"已知模型圖例為黑 C、白 H、紅 O。甲有 1 黑、2 紅；乙有 2 白、1 紅。兩個模型的比較何者正確？","concept":"甲依圖例為 CO2，乙為 H2O；兩者各有三顆原子球，但甲有 2 O，乙有 1 O。球總數相同不能判定組成相同，因顏色映射的元素身分與各自數目都必須核對。本題也顯示，同樣兩種元素不一定是同一對元素。","correct":"C","options":[{"id":"A","text":"都是三顆球，因此分子式相同","explanation":"錯誤：CO2 與 H2O 的元素身分及數量不同。"},{"id":"B","text":"乙的氧原子比甲多","explanation":"錯誤：乙只有一個氧，比甲的兩個少。"},{"id":"C","text":"甲乙原子總數相同，但氧數與元素組合不同","explanation":"正確：總數皆三，但甲含 C、O，乙含 H、O，氧數亦不同。"},{"id":"D","text":"甲乙都含碳與氫","explanation":"錯誤：甲沒有氫，乙沒有碳。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B065","stem":"一個完整乙醇模型 C2H6O 的九顆原子球中，非白色球占幾分之幾？圖例為白 H、黑 C、紅 O。","concept":"非白色表示不是氫，包含兩顆黑色碳球與一顆紅色氧球，共三顆。全部球為九顆，因此比例是 3/9=1/3。計數時應先把『非白色』轉成元素集合 C 與 O，再加總；不能只選其中一種顏色，也不能把白色氫的比例當成答案。","correct":"C","options":[{"id":"A","text":"1/9","explanation":"錯誤：1/9 只計氧球，漏掉碳球。"},{"id":"B","text":"2/9","explanation":"錯誤：2/9 只計碳球，漏掉氧球。"},{"id":"C","text":"1/3","explanation":"正確：(2+1)/9=1/3。"},{"id":"D","text":"2/3","explanation":"錯誤：2/3 是六顆白色氫球所占比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B066","stem":"完整分子模型X為CH3CH2OH，Y為CH3OCH3，Z為HOCH2CH2OH。下列哪項同時正確比較其組成與氧的連接？","concept":"把三式逐段展開，X與Y同為C2H6O，Z為C2H6O2。X的氧連C與H，Y的氧連兩C；Z的兩個氧則各連C與H。因此同一組成可以有不同連接，而碳氫數相同也不保證整體組成相同。題目需要同時核對元素數量與原子相鄰關係，不能只用其中一項取代另一項。","correct":"D","options":[{"id":"A","text":"X與Y組成不同，因為氧所連原子不同","explanation":"錯誤：氧的連接不同屬結構差異，X與Y的各元素數量仍相同。"},{"id":"B","text":"X與Z組成相同，因為碳、氫個數相同","explanation":"錯誤：X只有一氧、Z有兩氧，不能因碳氫相同就忽略氧數。"},{"id":"C","text":"Y與Z的每個氧都連接兩個碳，因此結構相同","explanation":"錯誤：Z的兩端OH使每個氧連一碳一氫，並非連兩碳；其組成也與Y不同。"},{"id":"D","text":"X與Y均為C2H6O但氧的連接不同；Z比它們各多一個氧","explanation":"正確：X/Y計數皆2C6H1O但鄰接有別；Z為2C6H2O，多一氧。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B067","stem":"一個完整分子模型已確認有9C、8H、4O，但沒有提供原子連接資料。下列哪項可以成立？","concept":"原子數清單可直接寫成C9H8O4，全部原子共9+8+4=21；氧占全部的比例是4/21，碳與氧比是9：4。這些計數都屬組成資訊。沒有連接資料時，即使分子式與教材的阿斯匹靈相同，也不能唯一確認完整結構。應將能算出的組成資料與尚不足以判斷的連接分開處理。","correct":"A","options":[{"id":"A","text":"分子式為C9H8O4，但仍不能僅由此確認完整結構","explanation":"正確：各元素數量直接給出分子式，但分子式不能唯一指定完整連接。"},{"id":"B","text":"分子式與阿斯匹靈相同，因此原子連接也已確定相同","explanation":"錯誤：相同分子式保證相同組成，不是相同完整結構的充分條件。"},{"id":"C","text":"氧原子占全部原子數的比例為4/13","explanation":"錯誤：13只計碳加氧的非氫原子；全部原子為21，氧占4/21。"},{"id":"D","text":"碳與氧的原子數比為4：9","explanation":"錯誤：碳九個、氧四個，C：O應為9：4，此選項顛倒先後。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B068","stem":"某水分子示意使用2個H與1個O，卻把三個原子都畫成互不相連，並聲稱已完整表示H2O。下列評析何者正確？","concept":"要表達完整水分子，既要正確的2H、1O，也要交代它們屬於同一分子且如何連接。三個分離原子只提供組成清單，尚未呈現水中氧與兩氫相連的資訊。原子總數不能直接當分子數；把H與H相連而把O留下，也不是水分子的連接。","correct":"B","options":[{"id":"A","text":"H：O為2：1已足以證明所有原子連接都表達正確","explanation":"錯誤：原子數比正確只檢查組成，不能保證連接資訊完整。"},{"id":"B","text":"原子種類與個數符合H2O，但尚未表達同一分子內的連接","explanation":"正確：先保留已正確的組成，再指出缺少的分子內連接，兩層判斷不混用。"},{"id":"C","text":"三個原子等同三個完整水分子，所以只需要改寫分子數","explanation":"錯誤：三個原子不是三個水分子；三個H2O需六個H及三個O。"},{"id":"D","text":"只要讓兩個H彼此相連、O仍獨立，就能表示完整H2O分子","explanation":"錯誤：H彼此相連、O獨立不符合水的O分別連兩H的結構。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文6–7、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B069","stem":"乙醇與乙二醇每個分子分別為 C2H6O、C2H6O2。若各取 4 個分子，下列何者相同？","concept":"各取四個分子時，兩者都提供 8 C 與 24 H。乙醇提供 4 O，乙二醇提供 8 O，所以總原子數分別為 36、40。比較相同與不同項目時要逐元素計算；某些數量相同不代表整個分子組成相同，更不保證所有性質相同。","correct":"B","options":[{"id":"A","text":"氧原子總數與原子總數","explanation":"錯誤：氧數為 4 與 8，全部原子數為 36 與 40。"},{"id":"B","text":"碳原子總數與氫原子總數","explanation":"正確：兩者均有 8 C、24 H。"},{"id":"C","text":"每個分子的氧所占原子比例","explanation":"錯誤：單分子的氧比例分別為 1/9 與 2/10。"},{"id":"D","text":"兩份分子群的所有物質性質","explanation":"錯誤：相同碳氫數不能保證物質性質相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B070","stem":"乙醇C2H6O與乙二醇C2H6O2都無色且含C、H、O。有人據此認為兩者可互換用途。下列評析何者正確？","concept":"先讀兩式：兩者同為2C、6H，但氧為一與二，原子總數為九與十。共同無色、共同元素種類，只是部分相似，不能保證組成、連接或用途相同。反過來，組成不同也不表示每一項物性數值都必不同；相同體積更不能僅靠元素種類推出相同氧總數。","correct":"A","options":[{"id":"A","text":"這些共同特徵不足保證組成與性質相同，仍須比較氧數、連接及實際性質","explanation":"正確：指出共同特徵的推論上限，並補入真正尚需比較的分子與物性資訊。"},{"id":"B","text":"兩者氫原子數不同，因此只要比較氫數便可解釋全部用途差異","explanation":"錯誤：兩式的氫數同為六，而且不能用一種原子數直接解釋全部性質。"},{"id":"C","text":"兩者每分子原子總數不同，因此任何單項物性數值都不可能相同","explanation":"錯誤：某單項物性可能恰巧相同，不能把組成不同放大成所有數值必不同。"},{"id":"D","text":"兩者含相同元素，因此相同體積的兩種液體必含相同氧原子總數","explanation":"錯誤：樣品分子數及每分子氧數都影響氧總數，元素種類相同不足決定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B071","stem":"由 CH3CH2OH 改以 HOCH2CH2OH 作比較，以下關於單分子原子數的描述何者正確？","concept":"需完整展開兩式，不能只看到多一個 OH 就認為氫必多一個。乙醇氫數 3+2+1=6；乙二醇氫數 1+2+2+1=6。兩者皆為 2 C，而氧由 1 變成 2。這是比較兩種分子的組成，不是宣稱只需直接加一顆氧就完成某個實際反應。","correct":"C","options":[{"id":"A","text":"增加一個 O，同時增加一個 H","explanation":"錯誤：乙二醇多一端 OH，但該端碳上的氫由三變二，總氫未變。"},{"id":"B","text":"增加一個 O，同時減少一個 C","explanation":"錯誤：兩種分子都保留兩個碳。"},{"id":"C","text":"增加一個 O，但 H 與 C 的總數各自不變","explanation":"正確：組成差額是多一個氧，碳氫總數相同。"},{"id":"D","text":"所有元素的原子數都加倍","explanation":"錯誤：碳氫未加倍，只有氧數由一變二。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B072","stem":"某完整分子具有兩個相連的碳，且兩個碳各連一個 OH；其餘氫已補足為 HOCH2CH2OH。依教材例子應辨認為何？","concept":"題目給出完整縮寫式，可按 HO、CH2、CH2、OH 清點：C=2、H=1+2+2+1=6、O=2。這是教材中的乙二醇。乙醇只有一個 OH，並非兩碳各帶一個 OH。辨識例子時應用分子式與連接一起核對，而不是只憑『有兩個碳』下結論。","correct":"D","options":[{"id":"A","text":"H2O","explanation":"錯誤：水不含碳，也沒有題目中的兩碳連接。"},{"id":"B","text":"C2H6O 的乙醇","explanation":"錯誤：乙醇只有一個氧與一個 OH。"},{"id":"C","text":"C9H8O4 的阿斯匹靈","explanation":"錯誤：阿斯匹靈含九個碳，組成不同。"},{"id":"D","text":"C2H6O2 的乙二醇","explanation":"正確：連接寫法與組成都符合教材乙二醇例子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B073","stem":"相同分子數的乙醇與乙二醇，若分別統計各自所有氧原子，乙二醇所得數量是乙醇的幾倍？","concept":"每個乙醇分子有一個氧，每個乙二醇分子有兩個氧。當分子數相同時，氧原子總數保持 2：1，因此乙二醇的氧數是乙醇兩倍。題目說的是相同『分子數』，並非相同質量或體積；不要把這個結論擴張到題目未指定的比較方式。","correct":"C","options":[{"id":"A","text":"1/2","explanation":"錯誤：1/2 是反過來以乙醇氧數除乙二醇氧數。"},{"id":"B","text":"1","explanation":"錯誤：兩者氧數不同，不是同倍數一。"},{"id":"C","text":"2","explanation":"正確：每分子 2 O 相對 1 O，總數也為兩倍。"},{"id":"D","text":"6","explanation":"錯誤：6 是每分子氫數，與氧倍數無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B074","stem":"一個乙醇分子與一個乙二醇分子合計，氫原子占全部原子數的比例為何？","concept":"乙醇有 9 個原子，其中 6 H；乙二醇有 10 個原子，其中也有 6 H。合計氫為 12，全部原子為 19，比例為 12/19。不能直接平均兩個分子的氫比例，因它們的總原子數不同。先合併實際個數，再形成比例，可以保持分母一致。","correct":"B","options":[{"id":"A","text":"6/19","explanation":"錯誤：只計其中一個分子的六個氫。"},{"id":"B","text":"12/19","explanation":"正確：(6+6)/(9+10)=12/19。"},{"id":"C","text":"12/20","explanation":"錯誤：把乙醇也當成十個原子，分母多一。"},{"id":"D","text":"6/10","explanation":"錯誤：6/10 只是單一乙二醇分子的氫比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B075","stem":"比較乙醇與乙二醇時，下列哪個問題不能只靠 C2H6O 與 C2H6O2 兩個分子式回答？","concept":"分子式提供原子種類及數量，故可算出氧差一個、種類均為 C/H/O、總數分別 9 與 10。黏度則是物質在指定條件下的性質，精確值需要相應測量或可靠資料，不能由下標直接算得。分子資訊有助理解性質，但不等於每個性質都可從分子式立即求值。","correct":"D","options":[{"id":"A","text":"每分子氧數相差多少","explanation":"錯誤：氧數 2−1=1，可由兩式直接求得。"},{"id":"B","text":"兩者是否包含相同的元素種類","explanation":"錯誤：兩式的元素符號均為 C、H、O，可以直接判斷。"},{"id":"C","text":"每分子的原子總數各是多少","explanation":"錯誤：逐項下標相加即可得 9 與 10。"},{"id":"D","text":"兩種物質在指定溫度下的精確黏度分別是多少","explanation":"正確：精確黏度需要物性資料與條件，兩個式子未提供。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B076","stem":"一份粒子圖共有 2 個乙醇與 1 個乙二醇分子。欲改成 1 個乙醇與 2 個乙二醇分子的另一份粒子圖，下列數量變化何者正確？","concept":"兩份圖都只有三個分子，且兩種分子每個皆有 2 C、6 H，因此都為 6 C、18 H。第一份氧為 2×1+2=4，第二份氧為 1+2×2=5，增加一個。這只是兩份組成的比較，不描述反應過程；要分別核對固定項目與變動項目。","correct":"B","options":[{"id":"A","text":"總碳數增加 2，總氫數增加 6","explanation":"錯誤：分子總數相同，每分子碳氫也相同，兩者不增加。"},{"id":"B","text":"總碳與總氫數不變，總氧數增加 1","explanation":"正確：C6、H18 不變，O4 變 O5。"},{"id":"C","text":"總氧數不變，總原子數減少 1","explanation":"錯誤：氧增加一，全部原子也由 28 增至 29。"},{"id":"D","text":"三種元素的總數都不變","explanation":"錯誤：氧總數有一個的差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B077","stem":"甲組含2個乙醇C2H6O分子，乙組含1個乙二醇C2H6O2分子。下列對原子數及性質的判斷何者正確？","concept":"甲組兩個乙醇合計4C、12H、2O；乙組一個乙二醇含2C、6H、2O。氧總數雖相同，兩組碳氫總數與分子組成都不相同。整組某元素的數量相同只是計數結果，不能拿來保證兩種物質的分子結構、生物作用或用途相同。","correct":"C","options":[{"id":"A","text":"兩組氧數相同，因此單分子組成及物質用途也相同","explanation":"錯誤：整組氧數相等不表示每分子氧數相同，更不能推出相同用途。"},{"id":"B","text":"兩組氧數不同，但碳與氫的總數相同","explanation":"錯誤：氧皆兩個，甲的碳與氫各為乙的兩倍。"},{"id":"C","text":"兩組氧數相同，甲的碳氫總數較多；相同氧總數不足保證用途相同","explanation":"正確：逐元素計數後保留用途仍需物性證據的界線，沒有過度推論。"},{"id":"D","text":"兩組元素種類相同，因此全部原子總數相同","explanation":"錯誤：甲原子總數為十八、乙為十；元素種類相同不固定個數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B078","stem":"甲為乙醇，乙為乙二醇。若兩份粒子群各含 12 個氫原子，且各自只含指定分子，何者正確？","concept":"兩種分子每個都含六個氫，因此 12 H 各對應兩個分子。甲的氧數為 2×1=2，乙為 2×2=4；兩者碳數均為 2×2=4。先用指定元素回推分子數，再算其他元素，是此題的兩個步驟，不能直接把氫個數當分子個數。","correct":"A","options":[{"id":"A","text":"甲有 2 個分子、乙有 2 個分子，氧數分別為 2 與 4","explanation":"正確：各兩分子，乙二醇氧數為乙醇兩倍。"},{"id":"B","text":"甲有 12 個分子、乙有 12 個分子","explanation":"錯誤：每分子有六個氫，12 H 只對應兩個分子。"},{"id":"C","text":"甲氧數 4，乙氧數 2","explanation":"錯誤：把兩種分子的氧數對調。"},{"id":"D","text":"甲碳數 2，乙碳數 4","explanation":"錯誤：兩者均有四個碳，甲並非只有兩個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B079","stem":"已知某分子只可能為乙醇或乙二醇。以下哪項單分子計數最能直接區分兩者？","concept":"乙醇為 C2H6O，乙二醇為 C2H6O2。逐欄比較可見碳都為二、氫都為六、元素種類都為三，只有氧數是一與二。因題目已把候選物限為這兩者，氧數可直接區分；若候選範圍更大，只知道一個氧或兩個氧便未必足以唯一識別物質。","correct":"D","options":[{"id":"A","text":"碳原子數","explanation":"錯誤：兩者碳數同為二，不能區分。"},{"id":"B","text":"氫原子數","explanation":"錯誤：兩者氫數同為六，不能區分。"},{"id":"C","text":"元素種類數","explanation":"錯誤：兩者都含三種元素，種類數相同。"},{"id":"D","text":"氧原子數","explanation":"正確：氧數一與二在這兩個候選物間不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B080","stem":"某學生把 HOCH2CH2OH 的兩端各當作『一個 O 和一個 H』，兩個 CH2 各當作『一個 C 和兩個 H』。加總結果應為何？","concept":"縮寫結構要按每一段實際出現的符號計數。兩端合計 O2H2，中間合計 C2H4，相加為 C2H6O2。兩端的氫不能遺漏，也不能因為 OH 是一組就再額外添加未寫出的氫。這種逐段展開法適用於題目給出的簡單縮寫式，不需要先學反應機構。","correct":"B","options":[{"id":"A","text":"C2H4O2","explanation":"錯誤：漏掉兩端 HO 與 OH 各一個氫。"},{"id":"B","text":"C2H6O2","explanation":"正確：端部 H2 加中間 H4，共 H6；碳二、氧二。"},{"id":"C","text":"C2H8O2","explanation":"錯誤：兩端各只有一個氫，沒有各兩個氫。"},{"id":"D","text":"C4H6O2","explanation":"錯誤：每個 CH2 只有一個碳，兩段合計兩個碳。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文8–9、12–13/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B081","stem":"2 個阿斯匹靈 C9H8O4 與 1 個乙二醇 C2H6O2 分子合計，氧原子占非氫原子的比例為何？","concept":"非氫原子包含碳與氧。兩個阿斯匹靈提供 18 C、8 O，乙二醇提供 2 C、2 O，合計 20 C、10 O。非氫總數為 30，其中氧為 10，比例為 1/3。分母需排除所有氫，並先合併兩種分子的實際原子數；不能把單一分子的比例直接當作整組比例。","correct":"B","options":[{"id":"A","text":"5/26","explanation":"錯誤：5/26 等於 10/52，是氧占全部原子的比例，未排除氫。"},{"id":"B","text":"1/3","explanation":"正確：氧 10 個、非氫 30 個，比例為 1/3。"},{"id":"C","text":"8/13","explanation":"錯誤：8/13 不是整組氧數除以整組非氫數，未合併兩類分子。"},{"id":"D","text":"2/3","explanation":"錯誤：2/3 是 20 個碳占 30 個非氫原子的比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B082","stem":"研究者由天然物甲設計分子乙，確認兩者的組成與連接均不同，且乙在指定條件下較符合某一項用途需求。哪項推論最合理？","concept":"教材以天然物改良說明可透過分子設計調整物質性質。本題同時改變組成與連接，並觀察到一項目標表現較佳，因此可支持分子改變與目標性質的關聯；但尚不能把效果全部歸於某一項變動，也不能推成所有性質都改善。需要更進一步的比較，才能分辨各因素的影響。","correct":"C","options":[{"id":"A","text":"可將這項改善全部歸因於元素種類改變，不必再比較原子數與連接","explanation":"錯誤：組成差異可能是數量或比例不同，未必元素種類不同；且連接也同時改變，不能直接排除其影響。"},{"id":"B","text":"既然一項用途需求改善，乙的其他物質性質也必全部優於甲","explanation":"錯誤：一項目標表現較佳不保證其他性質也朝相同方向改善。"},{"id":"C","text":"本例支持以分子改變探索目標性質，但仍不足以把改善單獨歸因於某一項結構差異","explanation":"正確：承認本例的設計與評估結果，同時保留多項因素一起改變時的推論限制。"},{"id":"D","text":"甲乙來自相同起始天然物，因此兩者應具有相同的所有物質性質","explanation":"錯誤：起始來源相同不保證改造後分子組成、結構與性質仍相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B083","stem":"比較 1 個阿斯匹靈 C9H8O4 與 2 個乙二醇 C2H6O2 分子，下列何者相同？","concept":"阿斯匹靈提供 C9H8O4；兩個乙二醇合計 C4H12O4。逐元素比對只有氧都為四個，碳與氫都不同；總原子數則是 21 與 20。不同物質或分子群可以共享某一種原子的總數，這不代表組成或性質相同。採用逐元素表列，比只看式子外觀更可靠。","correct":"D","options":[{"id":"A","text":"碳原子總數","explanation":"錯誤：碳數為九與四。"},{"id":"B","text":"氫原子總數","explanation":"錯誤：氫數為八與十二。"},{"id":"C","text":"全部原子總數","explanation":"錯誤：全部原子數為二十一與二十。"},{"id":"D","text":"氧原子總數","explanation":"正確：一個阿斯匹靈有4O，兩個乙二醇共有2×2=4O，氧原子總數相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B084","stem":"一個阿斯匹靈模型若漏放 1 個碳球，其餘原子球均依 C9H8O4 放置，模型總原子數會是多少？","concept":"正確阿斯匹靈模型的原子數應為 9+8+4=21。漏一個碳後變成 8 C、8 H、4 O，共 20 顆，因此同時造成碳數與總數不符。檢查模型不能只確認元素種類是否仍為三種，還必須核對每種元素的數量；種類沒變不代表組成正確。","correct":"B","options":[{"id":"A","text":"13","explanation":"錯誤：13 是正確模型中碳加氧的非氫數，不是漏球後總數。"},{"id":"B","text":"20","explanation":"正確：8+8+4=20，或由 21−1 求得。"},{"id":"C","text":"21","explanation":"錯誤：21 是沒有漏球的正確模型總數。"},{"id":"D","text":"22","explanation":"錯誤：漏掉一球應減少，不會增加為 22。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B085","stem":"兩個分子模型均為C9H8O4，其中一個已確認是阿斯匹靈。要判斷另一個是否表示同一分子，哪項檢查最能補足目前缺少的資訊？","concept":"題目已確認兩個模型有相同分子式，因此碳數九、元素種類C/H/O、氧占非氫的比例4/(9+4)=4/13都已相同。再次檢查這些組成項目不會補足結構。要判斷是否同一分子，還必須比較原子如何連接或排列，避免把組成相同誤當成完整身分相同。","correct":"A","options":[{"id":"A","text":"比較原子之間的連接與排列是否對應","explanation":"正確：連接與排列是分子式之外尚未確認的結構資料。"},{"id":"B","text":"比較兩個模型的碳原子數是否都是九個","explanation":"錯誤：C9已包含在共同分子式中，重數碳不能確認連接。"},{"id":"C","text":"比較兩個模型中氧占非氫原子的比例是否相同","explanation":"錯誤：兩者依分子式都為4/13，這仍是組成比例，不能區分不同連接。"},{"id":"D","text":"比較兩個模型是否都含碳、氫、氧三種元素","explanation":"錯誤：元素種類相同是已知條件，未補上單分子結構。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B086","stem":"新分子與原分子只差一個原子的連接位置。研究者應如何看待這項差異與性質的關係？","concept":"結構關心原子如何連接或排列，單一連接位置的改變也屬於結構資訊。微觀差異可能帶來明顯性質差異，但其方向與幅度不能只靠『改了一個位置』決定。合理做法是確認新結構，並用合適測量評估目標性質；不能預設它一定更好或完全沒有影響。","correct":"C","options":[{"id":"A","text":"差異太小，所有物性必相同","explanation":"錯誤：結構差異小不保證所有物性相同。"},{"id":"B","text":"必定使毒性完全消失","explanation":"錯誤：沒有資料可支持毒性必完全消失。"},{"id":"C","text":"可能影響性質，仍需對新分子進行適當測量","explanation":"正確：承認可能影響，也保留測量驗證。"},{"id":"D","text":"原子種類未變，便不能稱為結構差異","explanation":"錯誤：元素種類不變仍可因連接位置不同而有結構差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文7、9/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B087","stem":"某液體5.0 mL的質量為4.0 g；另一份微觀報告指出每分子2C、6H、1O，未記錄連接。哪組整理同時符合巨觀與微觀資料？","concept":"巨觀密度由樣品質量除以體積：4.0÷5.0=0.80 g/mL。微觀報告的2C、6H、1O可轉成符號C2H6O，但沒有連接資料，仍不能單憑分子式或一項密度唯一決定完整結構。三層資訊可以相互整理，但不可把巨觀測量直接當成充分的分子結構證據。","correct":"A","options":[{"id":"A","text":"密度0.80 g/mL；分子式C2H6O，連接尚未唯一確定","explanation":"正確：密度運算、原子數到化學式的轉換及結構資訊界線皆符合題設。"},{"id":"B","text":"密度1.25 g/mL；分子式C2H6O，連接尚未唯一確定","explanation":"錯誤：1.25是體積除以質量；密度應採質量除以體積。"},{"id":"C","text":"密度0.80 g/mL；分子式C2H6O2，連接尚未唯一確定","explanation":"錯誤：報告只有一個氧，不能在化學式中另加一個氧。"},{"id":"D","text":"密度0.80 g/mL；分子式C2H6O，完整連接已由密度唯一決定","explanation":"錯誤：一項密度及組成不能唯一推出所有原子的連接。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文1–2、5、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B088","stem":"封閉示意系統原有6個完整H2O分子，之後4個進入氣相、2個仍在液相，過程中分子未分解。哪項粒子描述正確？","concept":"先分清氣相部分與全系統。四個完整H2O各含兩氫一氧，因此氣相8H、4O；加上液相兩個H2O的4H、2O，全系統仍為12H、6O。原子總數保持也不代表任何分子分組都正確：把水改成氫氣與氧氣會違反本題完整H2O的條件。","correct":"B","options":[{"id":"A","text":"氣相有4H、4O；全系統仍有12H、6O","explanation":"錯誤：氣相每分子有兩個氫，四個分子應為八個氫。"},{"id":"B","text":"氣相有8H、4O；全系統仍有12H、6O","explanation":"正確：分別計算氣相與全系統，原子與分子都符合既定追蹤條件。"},{"id":"C","text":"氣相的4個H2O已變成4個H2與2個O2，因此原子總數保持","explanation":"錯誤：雖然這組H2與O2的原子數可配合，但題目是物態變化，並未分解水分子。"},{"id":"D","text":"氣相比液相占較大空間，所以全系統的水分子數必超過六個","explanation":"錯誤：所占空間可由間距變化造成，沒有新增分子的條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B089","stem":"封閉示意系統有8個H2O分子，其中3個由液相進入氣相；記作H2O(l)→H2O(g)，且每個分子保持完整。剩餘液相的分子數與氫原子數為何？","concept":"符號兩側的H2O表示汽化時保留水分子組成，l與g區分所處狀態。原本八個分子中三個已進氣相，液相剩8−3=5個；每個仍含兩個氫，因此液相有5×2=10個氫。計數必須先選定液相這個範圍，不能把全系統或氣相的數目代入。","correct":"C","options":[{"id":"A","text":"5個分子；5個氫","explanation":"錯誤：五個是剩餘分子數，每分子兩個氫，氫數還要乘二。"},{"id":"B","text":"8個分子；16個氫","explanation":"錯誤：這是全系統八個完整分子的數量，沒有扣掉離開液相的三個。"},{"id":"C","text":"5個分子；10個氫","explanation":"正確：液相五個H2O各有兩個氫，合計十個氫。"},{"id":"D","text":"3個分子；6個氫","explanation":"錯誤：三個分子與六個氫屬於氣相部分，不是所問液相。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B090","stem":"甲說『杯中液體逐漸減少』，乙說『部分水分子離開液面進入氣相』。這兩句的關係何者正確？","concept":"甲直接描述可見的液體量變化，屬巨觀；乙追蹤分子進入氣相，屬微觀。兩者可以描述同一過程的不同層次。微觀敘述提到分子移動，並不表示分子內部組成被拆開。分類時不要只看句子有沒有科學名詞，而應看它實際在描述哪個尺度的對象。","correct":"A","options":[{"id":"A","text":"甲為巨觀觀察，乙以微觀粒子描述對應過程","explanation":"正確：甲觀察整份樣品，乙轉向構成樣品的水分子。"},{"id":"B","text":"甲乙都只是在列出化學式","explanation":"錯誤：兩句都不是單純的化學式記錄。"},{"id":"C","text":"乙表示水分子必分解成原子","explanation":"錯誤：離開液面不等於分子解離成原子。"},{"id":"D","text":"甲是微觀，乙是巨觀","explanation":"錯誤：把樣品觀察與分子敘述的尺度對調。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B091","stem":"若只追蹤同一批 5 個水分子由液相進入氣相，且分子保持完整，這批粒子的原子數如何變化？","concept":"每個水分子有 2 H、1 O，五個分子便有 10 H、5 O。題目追蹤的是同一批完整分子，物態改變並未使原子出現或消失，所以數量維持不變。分子間距可以改變，但不能因此改寫每分子的下標。先固定追蹤範圍，才能做前後比較。","correct":"D","options":[{"id":"A","text":"由 15 減為 5","explanation":"錯誤：5 是分子數，不是變成氣相後的原子總數。"},{"id":"B","text":"由 10 增為 15","explanation":"錯誤：完整的五個水分子前後都共十五個原子。"},{"id":"C","text":"維持 5 H、5 O","explanation":"錯誤：每分子有兩個氫，五個分子應有十個氫。"},{"id":"D","text":"維持 10 H、5 O","explanation":"正確：5×2=10 H、5×1=5 O，前後相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B092","stem":"兩種液體的黏度測量值不同，分子縮寫式分別為CH3CH2OH與HOCH2CH2OH。下列哪項能正確連結物性資料與分子資訊？","concept":"讀取縮寫式可得兩者皆2C、6H；第一式有一個氧和一處O—H，第二式有兩個氧和兩處O—H。這些屬微觀組成與連接資料，黏度則是巨觀物性。可利用分子差異研究物性差異，但不能否定實測結果，也不能只靠多一個氧就直接算出精確黏度。","correct":"B","options":[{"id":"A","text":"兩式原子總數相同，因此黏度差異必定是測量錯誤","explanation":"錯誤：原子總數分別九與十，且不能因部分組成相似就否定量測。"},{"id":"B","text":"兩式碳氫數相同、氧數及其連接情形不同，可將這些差異與已測物性一起研究","explanation":"正確：先讀出組成與連接差異，再把它們與物性觀察建立可查證的關聯。"},{"id":"C","text":"兩式元素種類不同，因此不用檢查原子個數與連接","explanation":"錯誤：兩者都只含C、H、O；元素種類未增加，個數與連接仍須比較。"},{"id":"D","text":"只要知道第二式多一個氧，就能直接算出其精確黏度","explanation":"錯誤：分子式不直接給出精確黏度數值，仍需適當測量或其他充分資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 47–48；部分1 PDF頁 49–50；已審筆記頁 正文1、8、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B093","stem":"四個相同的完整分子合計有8H與4O。若要用化學式表示其中單一分子的組成，何者正確？","concept":"從整組原子資料轉成單分子符號前，要先按相同分子的個數分配。八個氫分給四個分子，每個兩氫；四個氧分給四個分子，每個一氧，因此寫H2O，氧的一可省略。元素種類只決定有哪些符號，各自下標仍要依原子個數填寫，不能只憑種類數決定。","correct":"C","options":[{"id":"A","text":"H8O4，因為應把整組原子全寫進一個分子式","explanation":"錯誤：H8O4在此是四個分子的合計原子清單，不能直接當作單一分子式。"},{"id":"B","text":"H2O2，因為H與O都要寫上相同下標","explanation":"錯誤：每分子只有一個氧，沒有讓兩種元素下標一律相同的規則。"},{"id":"C","text":"H2O，因為每分子有8÷4個H與4÷4個O","explanation":"正確：把同組總數分別除以四，得到每分子兩氫一氧。"},{"id":"D","text":"HO，因為每分子含兩種元素，各寫一個即可","explanation":"錯誤：只寫每種元素一個會漏掉每個分子的第二個氫。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B094","stem":"學生將6個水分子汽化後的示意，畫成12個H與6個O各自分開。若要同時符合原子計數及普通汽化後的分子身分，應選哪種改法？","concept":"核對模型要同時過兩關：先確認全組仍有12H、6O，再確認每個粒子仍是完整H2O。六組兩氫一氧同時符合；氫氣氧氣或三組H4O2即使原子總數相同，也改變了題設追蹤的分子身分。物態示意還需把主要空間差異放在不同分子之間，而非只拉開單分子內部原子。","correct":"A","options":[{"id":"A","text":"仍畫6組完整H2O，每組O連接兩H，再呈現分子之間較大的間距","explanation":"正確：六組H2O保留數目、組成與連接，以分子間距表達物態差異。"},{"id":"B","text":"改畫6組H2與3組O2，因為氫氧原子總數相同便代表相同物態變化","explanation":"錯誤：這雖守住原子總數，卻把水改成H2與O2，不符合普通汽化。"},{"id":"C","text":"改畫3個完整H4O2分子，因為原子總數不變便表示同一種分子","explanation":"錯誤：每組改成H4O2不再表示題設的單一完整H2O，總數相等不是唯一條件。"},{"id":"D","text":"保留6組H2O但只把每組內的H與O彼此拉遠，分子之間的平均距離維持不變","explanation":"錯誤：只拉開分子內部原子，未表達本節強調的分子之間距離變化。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B095","stem":"同一批完整的水分子由液態變成氣態。依本節的粒子觀點，哪項最能描述這個物態變化？","concept":"普通液態水變成氣態水時，每個分子仍為H2O。要分清分子內部的原子連接與分子彼此之間的距離：本節以後者及分布變化來描述物態差異。題目追蹤同一批完整分子，並未新增分子；所占空間改變不代表分子數必須增加，也不是以拆開水分子來產生氣態。","correct":"D","options":[{"id":"A","text":"水分子主要分解為氫氣與氧氣，因而占據較大的空間","explanation":"錯誤：普通物態改變不表示H2O分解為H2與O2，分子身分仍保持。"},{"id":"B","text":"H2O組成雖保留，但主要是每個分子內部的原子間距大幅增大","explanation":"錯誤：把分子之間的變化誤放到分子內部；本題並非靠H與O在單分子內大幅分離來描述汽化。"},{"id":"C","text":"每個H2O保持不變，但分子總數必隨氣體所占體積增大而增加","explanation":"錯誤：同一批分子未新增，體積變大可以由分子間距改變造成，不要求分子數增加。"},{"id":"D","text":"H2O分子保持完整，主要差異在分子之間的平均距離與分布","explanation":"正確：保留每個H2O的組成與連接，以分子群的間距及分布解釋物態差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B096","stem":"追蹤4個完整水分子由液態進入氣態，並以H2O(l)→H2O(g)記錄。關於g及汽化後的粒子數，何者正確？","concept":"l與g是物態標記，沒有更動前面的H2O組成。題目追蹤四個完整分子，每分子2H+1O=3個原子，所以全組4×3=12個原子，其中8H、4O。氣態所占空間改變不會自動增加粒子，也不能把元素種類數二當成單分子的原子數二。","correct":"B","options":[{"id":"A","text":"g表示氣態，所占空間增加使這批分子數必多於四個","explanation":"錯誤：g指出狀態，不表示新增分子；此處始終追蹤同一批四個完整分子。"},{"id":"B","text":"g表示氣態，仍有四個H2O及十二個原子","explanation":"正確：物態標記與數量分別判讀，四個分子共十二個原子。"},{"id":"C","text":"g表示每個原子各自成為氣體，因此只剩四個分離原子","explanation":"錯誤：H2O(g)仍是完整水分子，並非各自分離的H與O原子。"},{"id":"D","text":"g表示氣態，每個分子只計H與O兩種元素，因此全組有八個原子","explanation":"錯誤：每分子有兩種元素但三個原子，四個分子不能只算八個原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B097","stem":"兩份液體在指定條件下測得相同黏度，但微觀分析分別得到C2H6O與C2H6O2。哪項結論符合巨觀與微觀資訊的關係？","concept":"先保留兩種來源各自提供的資訊：測量說明在指定條件下黏度相同，分子式卻指出氧數一與二的組成差異。某項巨觀性質相同，不要求分子組成完全相同；反過來，組成不同也不保證每項測值必不同。兩個分子式仍沒有完整連接資料，不能推得所有結構細節。","correct":"A","options":[{"id":"A","text":"單項巨觀物性可以相同，而分子組成仍不同；尚不能據此確認完整結構","explanation":"正確：單項物性相同與組成不同可以並存，而且目前資料不足決定完整連接。"},{"id":"B","text":"黏度既然相同，第二份分子式就應改成C2H6O","explanation":"錯誤：不能為了使物性與組成一一對應，就改寫已有的微觀分析資料。"},{"id":"C","text":"分子式不同已足以證明所有條件下的黏度都不可能相同","explanation":"錯誤：分子式不同不代表任一物性數值在任何條件都不可能相同。"},{"id":"D","text":"兩式都含C、H、O，因此各元素個數及原子連接皆相同","explanation":"錯誤：氧數一與二已不同；元素種類相同更不能固定連接。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B098","stem":"示意框甲與乙各有4個完整H2O分子，乙的分子間距較大，且兩框每個分子的連接相同。下列比較何者正確？","concept":"每框先按完整水分子計數：四個分子各含2H、1O，故都是8H、4O，共十二個原子。相同粒子總數與相同單分子連接不會固定群體的平均間距，仍可有不同分布。不能從較大的空間另增分子，也不能將元素種類各一種誤讀為原子各一個。","correct":"C","options":[{"id":"A","text":"兩框皆有12個原子，因此分子間距也必須相同","explanation":"錯誤：十二個原子只固定數量，不能推出分子彼此必保持同一間距。"},{"id":"B","text":"乙所占空間較大，因此必有8個分子、16H與8O","explanation":"錯誤：題目已固定每框四個完整分子，空間較大沒有新增分子的含義。"},{"id":"C","text":"兩框均有8H、4O，差異在分子的分布","explanation":"正確：粒子組成與總數相同，示意差異位於不同分子之間的分布。"},{"id":"D","text":"兩框均有4H、4O，因為每分子各含一種H與一種O","explanation":"錯誤：水分子雖只有一種氫元素，每個仍含兩個氫原子，故每框八個氫。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B099","stem":"追蹤同一批n個水分子由液態進入氣態，分子都保持H2O且未流入或流出。學生因氣態所占空間較大，推論這批水的原子總數增加。哪項修正最恰當？","concept":"原子總數等於分子數乘以每分子的原子數。題目固定追蹤n個完整H2O，每個有2H與1O，因此前後都是2n個H、n個O，共3n個原子。氣態所占空間較大，應從分子間的距離及分布理解，不能在沒有新增粒子的情況下把體積增加當成數量增加。此式只做粒子計數，不使用氣體定律。","correct":"D","options":[{"id":"A","text":"每個水分子原子數不變，但分子總數會隨所占空間增加，所以原子總數仍增加","explanation":"錯誤：題設未有分子流入流出，且追蹤同一批完整分子，不能另假設分子總數增加。"},{"id":"B","text":"分子總數維持n，但每個分子由三個原子增加為更多原子，才會使體積增加","explanation":"錯誤：每個分子保持H2O，仍只有三個原子，不能藉增加單分子原子數解釋體積。"},{"id":"C","text":"分子與原子總數都不變，因此氣態所占的空間也必須與液態相同","explanation":"錯誤：粒子總數固定不表示間距固定；相同數目的完整分子仍可有不同分布與所占空間。"},{"id":"D","text":"分子數維持n、每分子仍三個原子，原子總數為3n；空間變化應從分子間距理解","explanation":"正確：固定n個分子各含三原子，總數3n不變；間距改變與原子數改變是不同概念。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic01-G03-B100","stem":"要比較兩種液體的差異，哪條推理最符合原子與分子觀點？","concept":"理解物質差異要把巨觀性質、微觀組成結構及符號表示連起來。相同顏色、相同原子總數或相同元素種類，都只是一部分相似，不能唯一決定完整分子結構與全部性質。較完整的比較先保留實際性質資料，再逐一核對元素數量與連接，最後確認式子或模型忠實表達這些資訊。","correct":"B","options":[{"id":"A","text":"兩液體都無色，因此可判定它們具有相同的分子連接","explanation":"錯誤：不同組成或結構的液體也可能同樣無色，顏色不是連接結構的唯一證據。"},{"id":"B","text":"先記錄物質性質，再比較分子組成與結構，並核對化學式或模型是否相符","explanation":"正確：物性、分子資訊與表示法互相核對，能保留各層次所提供的證據。"},{"id":"C","text":"兩分子的原子總數相同，因此可判定它們的連接與物質性質相同","explanation":"錯誤：相同總原子數仍可能有不同元素組合或連接，不能推出相同結構與性質。"},{"id":"D","text":"兩液體含有相同元素種類，因此可省略各元素原子數及連接的比較","explanation":"錯誤：元素種類相同不保證原子數量或連接相同，這兩項仍必須比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 / 1.1 / The Atomic and Molecular Perspective of Chemistry；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、10–11、14/14。","example":"","pointId":"central-0-1-ch1-sec1-1-topic01-AMP08","schools":["CMU"]}]},{"depth":"精讀","target":150,"questions":[]}],"schoolBanks":{"CMU":[["central-0-1-ch1-sec1-1-topic01-G03-S001","central-0-1-ch1-sec1-1-topic01-G03-S002","central-0-1-ch1-sec1-1-topic01-G03-S003","central-0-1-ch1-sec1-1-topic01-G03-S004","central-0-1-ch1-sec1-1-topic01-G03-S005","central-0-1-ch1-sec1-1-topic01-G03-S006","central-0-1-ch1-sec1-1-topic01-G03-S007","central-0-1-ch1-sec1-1-topic01-G03-S008","central-0-1-ch1-sec1-1-topic01-G03-S009","central-0-1-ch1-sec1-1-topic01-G03-S010","central-0-1-ch1-sec1-1-topic01-G03-S011","central-0-1-ch1-sec1-1-topic01-G03-S012","central-0-1-ch1-sec1-1-topic01-G03-S013","central-0-1-ch1-sec1-1-topic01-G03-S014","central-0-1-ch1-sec1-1-topic01-G03-S015","central-0-1-ch1-sec1-1-topic01-G03-S016","central-0-1-ch1-sec1-1-topic01-G03-S017","central-0-1-ch1-sec1-1-topic01-G03-S018","central-0-1-ch1-sec1-1-topic01-G03-S019","central-0-1-ch1-sec1-1-topic01-G03-S020","central-0-1-ch1-sec1-1-topic01-G03-S021","central-0-1-ch1-sec1-1-topic01-G03-S022","central-0-1-ch1-sec1-1-topic01-G03-S023","central-0-1-ch1-sec1-1-topic01-G03-S024","central-0-1-ch1-sec1-1-topic01-G03-S025","central-0-1-ch1-sec1-1-topic01-G03-S026","central-0-1-ch1-sec1-1-topic01-G03-S027","central-0-1-ch1-sec1-1-topic01-G03-S028","central-0-1-ch1-sec1-1-topic01-G03-S029","central-0-1-ch1-sec1-1-topic01-G03-S030","central-0-1-ch1-sec1-1-topic01-G03-S031","central-0-1-ch1-sec1-1-topic01-G03-S032","central-0-1-ch1-sec1-1-topic01-G03-S033","central-0-1-ch1-sec1-1-topic01-G03-S034","central-0-1-ch1-sec1-1-topic01-G03-S035","central-0-1-ch1-sec1-1-topic01-G03-S036","central-0-1-ch1-sec1-1-topic01-G03-S037","central-0-1-ch1-sec1-1-topic01-G03-S038","central-0-1-ch1-sec1-1-topic01-G03-S pointIds":[]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}]}},{"id":"central-0-1-ch1-sec1-1-topic02","title":"1.1-02 為什麼要學化學","version":"B01-G03-v1-d5b0b9e809931c56","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.1 化學研究"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S001","stem":"某團隊希望減少清洗製程排入河川的有害物質。下列哪項研究最直接結合化學與環境保護？","concept":"清洗時，清洗劑會與污垢及接觸物共同構成使用後的廢液。原液分析和配方提供起點資訊，卻不能直接代表排入河川的全部物質。要讓材料同時達成清潔與環境目標，應比較去除污垢的效果，並分析實際廢液的成分；只追蹤其中一種成分仍可能漏掉其他影響。","correct":"B","options":[{"id":"A","text":"分析使用前原液的成分，據此推定全部廢液成分","explanation":"錯誤：使用後可能帶入其他物質，原液不代表全部廢液。"},{"id":"B","text":"比較清洗劑對污垢的去除能力與廢液成分","explanation":"正確：同時檢查清潔用途和進入河川的物質。"},{"id":"C","text":"只量廢液中原清洗成分，略過清洗時帶入的物質","explanation":"錯誤：只看原清洗成分會漏掉使用中帶入的物質。"},{"id":"D","text":"依原料配方估計廢液成分，省略使用後的分析","explanation":"錯誤：配方估計未直接確認實際廢液的成分。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S002","stem":"回收廠希望從廢棄材料中取回可再使用的原料。化學最直接可提供哪項資訊？","concept":"回收可降低原料需求，但回收物是否能再用，仍取決於實際含有哪些成分、可取得多少，以及是否具有用途所需的性質。總質量不一定全是可用原料，原產品規格也未必代表回收後狀態。因此材料分析應與使用性能一起核對，才能判斷回收物的利用價值。","correct":"C","options":[{"id":"A","text":"只核對回收物的主要成分名稱，略過其含量與使用性能","explanation":"錯誤：成分名稱相同，不保證含量或性能已符合再用要求。"},{"id":"B","text":"只測回收物的總質量，將全部質量視為可用原料","explanation":"錯誤：回收物總量可能包含不適合原用途的成分。"},{"id":"C","text":"可回收成分的種類、含量與可用性質","explanation":"正確：成分、含量及性質直接決定原料能否再利用。"},{"id":"D","text":"只核對原產品的材料規格，直接沿用為回收後品質","explanation":"錯誤：回收後的組成與性能仍須確認，不能只沿用原規格。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S003","stem":"研發一種接觸皮膚的醫療材料時，哪組研究方向最能同時支持功能與人體接觸的用途判斷？","concept":"皮膚接觸材料需要能完成預期功能，也要了解接觸人體時的影響。純度、耐久性和特定條件下的測試都提供有用資訊，但各自回答的問題不同。不能由某一性質良好就推定人體接觸影響，也不能把一種測試條件推廣成所有方式都適用；應把功能與相應的接觸研究一起評估。","correct":"C","options":[{"id":"A","text":"材料的預期功能與接觸前純度，並以純度代替人體接觸研究","explanation":"錯誤：純度說明組成，不能直接代替人體接觸影響。"},{"id":"B","text":"材料在一種接觸條件下的表現，並外推到所有接觸方式","explanation":"錯誤：一種接觸條件的結果未涵蓋所有接觸方式。"},{"id":"C","text":"材料的預期功能與接觸人體的影響","explanation":"正確：用途與人體影響都屬健康照護材料的核心資訊。"},{"id":"D","text":"材料的預期功能與耐久性，並以耐久性代替人體接觸研究","explanation":"錯誤：耐久性與人體接觸影響是不同的材料資訊。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S004","stem":"研究太陽能板的材料時，哪種做法最能使改良對準裝置的使用需求？","concept":"能源裝置需要具有適當功能的材料，化學研究可協助選擇與改良所需性質。原料純度、投入量及處理前性質可以支援設計，但不等於處理後材料的實際表現。判斷能源用途是否改善，仍應回到裝置所需的材料功能，以相應資料檢查設計是否達到目的。","correct":"A","options":[{"id":"A","text":"研究如何改良材料，使其更適合裝置所需功能","explanation":"正確：改良所需材料性質可支援能源裝置。"},{"id":"B","text":"只提高材料的原料純度，便判定裝置功能必定改善","explanation":"錯誤：純度提高不直接保證能源用途所需的性能提高。"},{"id":"C","text":"只測製作前原料的性質，直接當成處理後材料的性能","explanation":"錯誤：處理可能改變材料表現，原料資料不能直接代替成品。"},{"id":"D","text":"只降低單片材料的用量，便判定能源裝置功能必定改善","explanation":"錯誤：用量減少與能源裝置功能改善是不同判斷。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S005","stem":"工廠使用較少原料製作同樣耐用的包裝。這項化學材料改良最直接回應哪個目標？","concept":"同樣耐用的包裝使用較少原料，直接減少這項用途對物質資源的需求，因此回應資源保育。這項比較已控制題設的耐用功能，卻沒有同時量測材料對其他液體的耐受性、人體接觸影響或棄置後果。用途相同下的減量有明確意義，但不能取代其他性質的研究。","correct":"B","options":[{"id":"A","text":"降低材料棄置後每種成分的有害影響","explanation":"錯誤：少用原料未直接測得每種棄置成分的影響。"},{"id":"B","text":"保育自然資源","explanation":"正確：相同功能耗用較少原料，直接對應資源保育。"},{"id":"C","text":"提升包裝對不同液體的耐受性","explanation":"錯誤：題目沒有不同液體接觸的測試。"},{"id":"D","text":"減少包裝材料接觸人體時的影響","explanation":"錯誤：減量資料未直接回答人體接觸後果。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S006","stem":"經特殊處理的矽可用於太陽能板。這個例子最能支持哪項材料研究觀念？","concept":"材料的用途需要相應性質支持，處理方式可以成為取得所需性質的一部分。經特殊處理的矽能用於太陽能板，說明化學研究可連接物質、處理與能源功能。這不表示所有含矽樣品都相同，也不由天然來源或一項用途直接證明全部性能；具體材料仍須對照其需求判斷。","correct":"A","options":[{"id":"A","text":"材料經適當處理，可取得符合特定用途的性質","explanation":"正確：此例把材料處理與能源用途所需性質連在一起。"},{"id":"B","text":"只要主要成分都是矽，不同樣品就可直接互換","explanation":"錯誤：主要成分相同不保證處理狀態及性能相同。"},{"id":"C","text":"矽具有天然來源，就能免除能源用途的性能測試","explanation":"錯誤：來源類型不能代替用途相關的性能資料。"},{"id":"D","text":"某矽材料適用太陽能板，就表示它的其他性能也已確認","explanation":"錯誤：一項用途成立不等於所有其他性能都已測定。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S007","stem":"研發OLED新材料時，目標是改善顯示用發光元件。何者最直接回應這項材料設計目標？","concept":"OLED的顯示功能需要適合的發光材料，因此改良應對準材料在使用條件下的發光表現。組成分析、純度和原料性質是研究線索，但不直接等於元件或新組合的功能。取得候選材料後仍要檢查用途相關性質，才能知道設計是否達成；不能用單項原料資訊取代使用中的性能。","correct":"C","options":[{"id":"A","text":"只增加原料純度，將純度合格視為發光表現合格","explanation":"錯誤：純度條件與發光性能條件不是同一項要求。"},{"id":"B","text":"只量材料存放後的組成，直接代表元件使用時的發光表現","explanation":"錯誤：存放後組成未直接測量使用時的發光功能。"},{"id":"C","text":"確認並改良材料在指定使用條件下的發光表現","explanation":"正確：研究的性質與顯示元件所需功能直接對應。"},{"id":"D","text":"只量其中一種原料的性質，直接代表候選組合的表現","explanation":"錯誤：單一原料未必代表新組合的整體性質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S008","stem":"研究螢火蟲閃光時，下列哪項化學判斷最合理？","concept":"螢火蟲閃光涉及體內化學反應，因此物質研究也能幫助理解生命現象。分析起始成分、觀察顏色及追查來源都可能提供線索，但不能各自代替對反應和物質行為的研究。相似的閃光現象未必來自同一物質；要解釋發光，仍需把物質及其變化與觀察到的現象連起來。","correct":"A","options":[{"id":"A","text":"牠體內發生能產生閃光的化學反應","explanation":"正確：體內化學反應直接說明其生物化學性質。"},{"id":"B","text":"只分析閃光前的成分，就足以完整說明發光時的物質變化","explanation":"錯誤：起始成分不能獨自涵蓋發光期間的物質變化。"},{"id":"C","text":"只要兩種生物閃光顏色相同，就可判定發光物質相同","explanation":"錯誤：相同顏色不足以鑑別發光物質的身分。"},{"id":"D","text":"只要找出發光物質的來源，就能代替對體內反應的研究","explanation":"錯誤：物質來源與它在體內如何反應是不同問題。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S009","stem":"化學家改良既有藥物，目的是取得更符合治療需求的物質。下列何者最能說明這項工作的化學核心？","concept":"藥物改良的化學核心，是把物質研究連結到治療用途所需的性質。製得候選物是重要一步，但仍須檢查它是否具有預期功能。高純度、天然來源及樣品存在各提供部分資訊，沒有任何一項可以單獨證明所有治療需求都已被滿足。","correct":"C","options":[{"id":"A","text":"由天然來源直接判定候選物比原藥更合用","explanation":"錯誤：來源不能直接決定兩種藥物的適用程度。"},{"id":"B","text":"僅製得新樣品，便把所有預期性質視為已驗證","explanation":"錯誤：製備成功不等於所有預期性質已測試通過。"},{"id":"C","text":"研究與調整物質，使其具有所需性質","explanation":"正確：物質與所需性質的連結正是改良的化學核心。"},{"id":"D","text":"只以候選物質的高純度保證所有治療功能","explanation":"錯誤：純度是組成資訊，不能直接保證所有治療功能。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S010","stem":"經特殊處理的矽可用於太陽能板，OLED材料可用於顯示元件。關於這兩項應用，何者恰當？","concept":"不同裝置需要不同的材料功能，化學的共同貢獻是把物質性質連到各自用途。高純度、一批材料的表現或單一性質可以提供部分支持，但無法代表全部批次、條件及性能。合理的選材與改良應分別確認相應用途所需的性質，不能用一項資料概括所有使用判斷。","correct":"A","options":[{"id":"A","text":"各自應以所需功能為依據，研究相應材料的性質","explanation":"正確：兩種應用都需把材料性質對應到各自功能。"},{"id":"B","text":"各自只要達到高純度，就可省略用途性能的比較","explanation":"錯誤：純度不能包辦用途所需的所有性能。"},{"id":"C","text":"各自只要同一批材料曾合用，後續各批便無須再分析","explanation":"錯誤：某批合用不保證後續每批組成及性質都一致。"},{"id":"D","text":"各自只要測得一項所需性質，就可推定全部使用條件都合用","explanation":"錯誤：一項性質的結果不能涵蓋所有使用條件。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S011","stem":"某農業用物質能保護作物，但使用後可能進入水域。評估它的用途時，最應同時考慮哪兩面？","concept":"農用物質能保護作物，卻也可能在使用後進入水域，因此效益與環境影響需要一起了解。原料純度、施用前成分和用量都可能有用，但不直接說明進入水域的物質及其行為。要比較用途的正負兩面，應把作物效果與使用後水域中的影響相連，而不是用某項起始資料代替環境研究。","correct":"A","options":[{"id":"A","text":"保護作物的效果與水域中的影響","explanation":"正確：同時考慮用途效益與可能環境代價。"},{"id":"B","text":"保護作物的效果與原料純度，並以純度推定水域影響","explanation":"錯誤：原料純度未直接回答使用後的水域影響。"},{"id":"C","text":"保護作物的效果與每次用量，並以低用量推定水域無害","explanation":"錯誤：用量低不表示該物質在水域中必定無害。"},{"id":"D","text":"保護作物的效果與施用前成分，並視為使用後成分","explanation":"錯誤：施用前資料不能直接代表使用後的全部成分。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S012","stem":"某塑膠有良好的包裝性能，但其廢棄處理仍會造成環境問題。何者最合理？","concept":"包裝性能說明材料在使用時能完成某項功能，棄置影響則是另一階段的物質問題。兩者可以同時存在，不必互相否定。降低原料用量可節省資源，但也不能直接證明每種棄置影響都改善。合理判斷應分別保留功能與用後行為的資料，再研究使用或改良方式。","correct":"C","options":[{"id":"A","text":"只要降低原料用量，就可判定棄置後所有影響都已改善","explanation":"錯誤：用量降低沒有直接證明棄置後的各項影響。"},{"id":"B","text":"包裝性能已好，故環境問題可由性能數據排除","explanation":"錯誤：包裝性能不能排除使用後的環境問題。"},{"id":"C","text":"包裝功能與廢棄影響是需要分別了解的兩面","explanation":"正確：功能與廢棄影響可同時存在，應分別研究。"},{"id":"D","text":"有環境問題，故先前包裝性能的量測必然錯誤","explanation":"錯誤：不同階段的負面影響不會自動推翻性能量測。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S013","stem":"研究人員已測得某清潔材料的去污能力。若要進一步形成對其用途的平衡看法，最直接應增加哪項研究？","concept":"去污能力回答清潔功能，人體接觸和排放後果則回答不同面向的物質影響。想形成平衡看法，需要增加相應影響研究。原液純度不能代替使用後的行為，重測同一去污性能也不會自動補齊其他資訊；即使取得一種接觸結果，仍不能無條件推廣到所有情境。","correct":"B","options":[{"id":"A","text":"只研究一種接觸條件，並推定所有接觸與排放情境都相同","explanation":"錯誤：單一接觸條件未涵蓋其他接觸及排放情境。"},{"id":"B","text":"接觸人體及使用後排放的影響","explanation":"正確：人體接觸與排放補足原性能測量未回答的影響。"},{"id":"C","text":"只分析清潔前原液的純度，並視為接觸人體及排放影響的結果","explanation":"錯誤：原液純度與人體或環境中的物質影響不是同一項測量。"},{"id":"D","text":"再量同一條件的去污能力，並當成全部影響資料","explanation":"錯誤：重測去污能力仍未直接補上人體及環境影響。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S014","stem":"某天然來源物質被考慮用作皮膚接觸材料。僅憑「天然來源」，可以得到下列哪個結論？","concept":"天然來源說明物質從哪裡取得，並沒有直接說明其性質或接觸人體後的影響。化學研究包含天然物質，因此天然與需要安全評估並不衝突。判斷接觸用途應回到具體物質與條件的資料，而不是把來源名稱當成全面安全或優於其他材料的證明。","correct":"A","options":[{"id":"A","text":"已知其來源類型，接觸影響仍須了解","explanation":"正確：來源與接觸影響是不同資訊。"},{"id":"B","text":"不需要測量物質性質即可使用","explanation":"錯誤：天然物質同樣需要了解其性質。"},{"id":"C","text":"一定比所有人工材料更合適","explanation":"錯誤：比較適合程度需要兩方性質與用途資料。"},{"id":"D","text":"所有接觸方式都已證實無害","explanation":"錯誤：來源資訊沒有涵蓋所有接觸條件的結果。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S015","stem":"一種新建材提升使用性能，卻在製作過程產生需處理的物質。哪個研究方向最能兼顧材料用途與可能的不利影響？","concept":"化學成果的用途與可能危害應共同考慮。建材性能改善是一項正面成果，製程中產生的物質則可能需要分析與處理。研究兩面能幫助改良產品與流程；不能把使用階段的好處當成製程沒有問題，也不能只憑製程問題就否定所有性能資料。","correct":"C","options":[{"id":"A","text":"只看副產物，停止檢查建材性能","explanation":"錯誤：忽略性能會失去判斷建材用途所需的資訊。"},{"id":"B","text":"只分析原料純度，便推定製程產生的物質都無害","explanation":"錯誤：原料組成資料未直接回答製程產生物的影響。"},{"id":"C","text":"同時研究所需建材性能與製程物質的影響","explanation":"正確：兩面研究兼顧有用功能和可能負面影響。"},{"id":"D","text":"只提高產量，將副產物視為與材料無關","explanation":"錯誤：製程產生的物質也是化學與環境問題的一部分。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S016","stem":"糖可由天然來源取得，再經工業精製後販售。這個例子最能說明何者？","concept":"「天然來源」描述取得原料的起點，「工業精製」描述後續處理，兩者回答不同問題。糖能從自然界取得，再由工業以高純度形式供應，正說明化學產業也處理天然物質。精製不應直接等同於合成新種類物質；本題不涉及具體精製方法。","correct":"B","options":[{"id":"A","text":"精製的目的必定是把糖變成另一種全新物質","explanation":"錯誤：精製與製造新種類物質不能直接畫等號。"},{"id":"B","text":"天然來源與工業處理可以出現在同一產品","explanation":"正確：兩項描述分別是來源與處理，可同時成立。"},{"id":"C","text":"只要經工業處理，原料就不可能來自天然","explanation":"錯誤：後續工業處理不會否定原料的天然來源。"},{"id":"D","text":"天然物質與化學產業是互斥的概念","explanation":"錯誤：化學產業可以利用與處理天然物質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S017","stem":"分析員要確認某精製糖的純度。下列哪項資料最直接？","concept":"純度是材料組成方面的資訊，需要分析實際樣品來了解。天然來源可以說明糖的取得方式，工業精製可以說明它經過處理，但兩者都不能單獨給出某一批的純度結果。化學產業中的品質控制正是把材料分析用於產品品質判斷。","correct":"C","options":[{"id":"A","text":"糖的原料曾經在何種植物中出現","explanation":"錯誤：原料出處不能直接提供本批精製後的純度。"},{"id":"B","text":"同來源另一批糖的純度，未分析本批","explanation":"錯誤：另一批的分析值不能直接移用為本批結果。"},{"id":"C","text":"對糖樣品進行成分分析所得的結果","explanation":"正確：實際成分分析可以支援該糖樣品的純度判斷。"},{"id":"D","text":"同一糖樣品的顆粒外形，未量測組成","explanation":"錯誤：顆粒外形不是本樣品的組成分析結果。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S018","stem":"研究者分別記錄糖的「植物來源」「精製程序」「純度分析」。三者依序回答哪組問題？","concept":"材料資料可分成來源、處理過程及最後性質。植物來源指出原料起點，精製程序描述做過什麼處理，純度分析描述產品成分的狀況。把三者區分清楚，就不會把天然來源直接當成高純度證明，也不會把分析本身誤認為已進行精製。","correct":"C","options":[{"id":"A","text":"從何取得、有多純、經何處理","explanation":"錯誤：精製程序和純度分析的功能對調。"},{"id":"B","text":"經何處理、有多純、從何取得","explanation":"錯誤：把三個問題與資料類型錯位配對。"},{"id":"C","text":"從何取得、經何處理、有多純","explanation":"正確：來源、處理、純度依序對應三份紀錄。"},{"id":"D","text":"有多純、從何取得、經何處理","explanation":"錯誤：植物來源不是純度數據，精製程序也不是取得來源。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S019","stem":"某公司販售從植物取得並經精製的糖。何者最能指出化學產業在此產品中的作用？","concept":"化學產業不只合成新物質，也會處理既有物質、分析產品及提供使用服務。天然來源的糖經精製並作品質分析，可以成為符合需求的日常產品。這個過程不需要否定天然來源，也不表示所有產品都只能在實驗室使用。","correct":"C","options":[{"id":"A","text":"只根據糖的顏色，便證明每一批純度完全一致","explanation":"錯誤：顏色不能直接驗證每批組成都相同。"},{"id":"B","text":"只把原料標為天然，就視為已完成產品品質控制","explanation":"錯誤：來源標示沒有實際檢查產品品質。"},{"id":"C","text":"處理天然物質並分析產品，使其符合用途需求","explanation":"正確：精製和分析都能把天然原料轉成適用產品。"},{"id":"D","text":"把所有精製工作直接當成製造全新種類的物質","explanation":"錯誤：精製不必等同改成另一種全新物質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S020","stem":"兩袋糖都標示相同植物來源，一袋經精製，另一袋未經相同處理。若要比較兩袋目前的純度，何者最適當？","concept":"相同來源的材料可以經歷不同處理，最後組成與性質仍需由實際資料判斷。精製是處理活動，純度分析則是取得產品資訊的量測活動，不能互相替代。比較這兩袋糖時，直接分析它們能回答當前純度的問題，來源和外觀只是背景資訊。","correct":"D","options":[{"id":"A","text":"依處理較多，直接判定已取得純度測量值","explanation":"錯誤：做過處理不等於已完成純度量測。"},{"id":"B","text":"依來源相同，直接判定純度相同","explanation":"錯誤：來源相同不保證後續組成相同。"},{"id":"C","text":"依顆粒外形不同，直接判定糖的種類不同","explanation":"錯誤：顆粒外形不能直接判定糖的物質種類。"},{"id":"D","text":"分別分析實際樣品的成分","explanation":"正確：分別分析能提供可比較的當前組成資料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S021","stem":"藥學學生研究藥物在體內如何被處理。哪種做法最能運用化學基礎理解這項問題？","concept":"藥物是物質，其在體內的處理涉及物質性質與變化。化學基礎可幫助研究者理解這些行為，並辨別各資料能支持的結論。進入體內前的含量不代表體內各處狀態，一種條件的觀察不涵蓋所有情境，模型預測也須與實際測量區分；用途研究應回到相應的物質與條件。","correct":"C","options":[{"id":"A","text":"以藥物進入體內前的含量，直接代表它在體內各處的狀況","explanation":"錯誤：起始含量不直接代表體內不同位置或時刻的物質狀況。"},{"id":"B","text":"由一種條件下的分析，直接推定所有體內條件的結果","explanation":"錯誤：一種條件的結果不能無條件套用到其他情境。"},{"id":"C","text":"研究藥物所涉及的物質性質與變化","explanation":"正確：物質性質與變化直接連到藥物研究。"},{"id":"D","text":"以藥物行為模型的預測，直接當成本次情境的實際量測","explanation":"錯誤：模型提供預測，並非本次情境的直接量測。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S022","stem":"工程團隊要選擇適合接觸特定液體的材料。哪個研究方向最能直接提供選材依據？","concept":"工程選材應把物質性質與實際使用條件連起來。若用途需要接觸某液體，就要確認材料在該條件下能否維持功能。原料純度或接觸前強度各提供部分資訊，卻不能代替接觸後的性能；另一液體的結果也須檢查是否適用。關鍵是取得與本用途相應的材料資料。","correct":"D","options":[{"id":"A","text":"只由原料純度相同，就推定接觸液體後的性能相同","explanation":"錯誤：相同純度未保證液體接觸後具有相同性能。"},{"id":"B","text":"只由接觸前強度合格，就省略接觸後的性能檢查","explanation":"錯誤：接觸前合格不必然代表接觸後仍合格。"},{"id":"C","text":"材料耐另一種液體，就不另檢查而當成耐本液體","explanation":"錯誤：不同液體的相容情況仍需確認，不能直接移用。"},{"id":"D","text":"確認材料在該液體中能否維持所需性質","explanation":"正確：使用條件下的性質直接決定適用性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S023","stem":"農業研究者比較兩種農用材料對作物與土壤的影響。最能說明他需要化學基礎的理由為何？","concept":"農業會使用肥料、農藥等物質，也需要理解這些物質與環境的關係。化學提供研究材料性質和行為的基本原理，所以天然或人造來源的農業材料都可能需要化學分析。產量是用途效果的一部分，不能單獨回答材料對土壤的所有影響。","correct":"C","options":[{"id":"A","text":"作物能利用某種物質，就表示它在土壤中的所有影響也已確定","explanation":"錯誤：作物用途的結果不能直接回答土壤中的全部物質行為。"},{"id":"B","text":"只要測得作物產量，就能知道材料全部性質","explanation":"錯誤：產量不等於全部土壤與材料性質資料。"},{"id":"C","text":"研究需要理解所使用物質的性質與行為","explanation":"正確：物質性質與行為是此研究所需的化學基礎。"},{"id":"D","text":"相同用途的農用材料必定具有相同性質","explanation":"錯誤：用途相同不表示材料性質完全相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S024","stem":"地質研究者想知道岩石樣品中有哪些物質，最直接需要化學的哪種貢獻？","concept":"想知道岩石樣品中有哪些物質，需要針對本樣品取得組成資訊。總質量沒有分辨各成分，同地點或相似外觀的其他岩石也不能直接代替本樣品。化學提供研究物質組成及性質的基礎，使地質觀察能與實際材料資訊相連，而不僅憑外部相似性推定成分。","correct":"D","options":[{"id":"A","text":"以外觀相同的另一岩石之分析，直接代表本樣品的成分","explanation":"錯誤：外觀相同不保證本岩石與另一岩石組成相同。"},{"id":"B","text":"只由採樣地點相同，推定各岩石組成必相同","explanation":"錯誤：同採樣地點不保證每塊岩石組成都相同。"},{"id":"C","text":"只量岩石總質量，將總量當成各種成分含量的資料","explanation":"錯誤：總質量未辨認各種成分或其各自含量。"},{"id":"D","text":"分析材料的組成與相關性質","explanation":"正確：材料分析直接回應樣品組成問題。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S025","stem":"生物研究者與材料工程師都研究發光現象。對兩領域的合作研究，哪項做法最有化學依據？","concept":"化學能連結生物現象與人造材料，因為兩者都涉及物質的性質和行為。螢火蟲與OLED是教材中不同領域的發光例子，研究可以共同追問物質如何參與現象，但這不要求它們具有相同成分、機構或用途。共同的是物質研究的原理，不是研究對象必須完全相同。","correct":"D","options":[{"id":"A","text":"只要發光強度相同，就使用同一套物質行為解釋","explanation":"錯誤：相同強度不保證不同系統具有相同物質行為。"},{"id":"B","text":"把兩者的發光資料不經條件檢查就互相代用","explanation":"錯誤：不同系統的資料仍須按物質與條件分別判斷。"},{"id":"C","text":"從兩者都發光，推定其發光來源是同一物質","explanation":"錯誤：相似現象不保證由同一種物質造成。"},{"id":"D","text":"分別研究哪些物質及其行為與觀察到的發光有關","explanation":"正確：物質與現象的連結可成為跨領域共同問題。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S026","stem":"下列哪項成果最直接屬於「製造具有所需性質的新型物質」？","concept":"化學家的三類根本工作可依產出區分：製造得到實際材料，測量得到性質資料，建模得到解釋或預測。新型物質也包含具有所需性質的物質組合，不限定只能合成全新的單一物質。題目中只有製得候選組合直接產生新材料，其餘活動各有量測或建模價值。","correct":"B","options":[{"id":"A","text":"用模型估計既有材料的耐用表現","explanation":"錯誤：估計耐用表現屬模型預測。"},{"id":"B","text":"製得能滿足新包裝需求的候選材料組合","explanation":"正確：製得實際候選組合直接對應材料製造。"},{"id":"C","text":"測出既有塑膠接觸液體後的質量變化","explanation":"錯誤：質量變化數據是測量成果。"},{"id":"D","text":"分析一批原料所含的成分","explanation":"錯誤：成分分析屬物質量測。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S027","stem":"研究員將兩種已知物質配成新的候選材料，目的是得到特定使用性質。這項活動應如何理解？","concept":"化學家的製造對象可以是新物質，也可以是為某用途設計的物質組合。使用已知原料不排除材料設計的價值，但原料各自性質或模型預測仍不能直接代替新組合的表現。實際配製提供候選實物，後續需量測它的性質，才能確認是否符合所需用途。","correct":"B","options":[{"id":"A","text":"應把兩種原料的性能直接相加，當成新組合的實測表現","explanation":"錯誤：未給定可相加的性能關係，數值相加不是新組合的實測。"},{"id":"B","text":"可屬於製造具有所需性質的物質組合","explanation":"正確：為用途製備新的物質組合，也是化學製造工作。"},{"id":"C","text":"只要兩種原料各自合用，新組合的性能便已確定","explanation":"錯誤：組分各自合用不保證新組合符合完整用途。"},{"id":"D","text":"只要配方符合模型預期，就不必再量測新組合的性質","explanation":"錯誤：配方符合預測仍需要實際材料性質資料檢查。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S028","stem":"研究目標是製作更適合顯示器的材料。哪個步驟最直接產生供後續測試的實物？","concept":"設計目標、預測和實際製備在材料研究中各有作用。若下一步需要的是可拿來量測的樣品，就必須進行製備，讓候選材料實際存在。模型可以幫助選擇候選，既有分析可以提供依據，但兩者都不等於已經製成新樣品；之後仍須確認性質。","correct":"A","options":[{"id":"A","text":"依設計製備候選發光材料","explanation":"正確：製備候選材料才直接提供新實物。"},{"id":"B","text":"分析既有樣品的成分","explanation":"錯誤：分析既有樣品是量測活動。"},{"id":"C","text":"利用理論預測材料發光性質","explanation":"錯誤：理論預測產生估計，不直接產生實際樣品。"},{"id":"D","text":"整理已測得的材料數據","explanation":"錯誤：數據整理不會形成待測新材料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S029","stem":"某研發計畫以降低材料接觸特定液體後的損壞為目標。哪一項最適合作為新材料設計的性質要求？","concept":"材料設計的要求應對準實際失效情境。此題要降低接觸指定液體後的損壞，因此需在相應接觸條件下維持使用性能。接觸前強度、主要成分比例及對另一液體的耐受性都是部分資料，不能直接代表指定條件的結果；候選材料必須按其用途檢查。","correct":"B","options":[{"id":"A","text":"只要接觸前強度合格，便視為接觸後仍能維持性能","explanation":"錯誤：接觸前強度未證明接觸後仍能維持。"},{"id":"B","text":"在指定接觸條件下仍能維持使用性能","explanation":"正確：使用條件下的性能正好回應損壞問題。"},{"id":"C","text":"只要主要成分比例不變，便不另檢查接觸後性能","explanation":"錯誤：主要成分比例相同不直接保證使用性能相同。"},{"id":"D","text":"只要耐另一種液體，便視為耐本次指定液體","explanation":"錯誤：不同液體的接觸結果不可未經確認就互相代用。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S030","stem":"下列哪一項是化學家「做出材料」的工作，而非單純分析或預測？","concept":"藥物研究可以同時包含製造、測量與模型發展。辨認活動時要看具體做了什麼：製備得到實際候選物質，測定與成分分析得到資料，理論推測得到預測。本題要求「做出材料」，所以選製備；這不表示製備完成後就已證明治療效果或所有安全性。","correct":"C","options":[{"id":"A","text":"分析已供應藥物的成分","explanation":"錯誤：分析既有產品並非製備新候選物質。"},{"id":"B","text":"用理論推測候選藥物的性質","explanation":"錯誤：理論推測是模型類工作。"},{"id":"C","text":"製備供研究使用的候選藥物","explanation":"正確：製備直接產生研究用的候選物質。"},{"id":"D","text":"測定候選藥物的某項性質","explanation":"錯誤：性質測定屬測量工作。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S031","stem":"工廠檢查每批農用材料是否含有預期成分。這項工作最直接屬於何者？","concept":"品質控制利用材料分析確認產品是否符合要求，常關心實際批次的組成或性質。檢查農用材料中的成分，是對已存在物質取得資料，屬於化學家的測量工作。它與製備新物質、建立預測模型不同，但所得結果可支援研發與使用服務。","correct":"C","options":[{"id":"A","text":"分子運動模擬","explanation":"錯誤：題目是分析實際批次，不是模擬分子運動。"},{"id":"B","text":"新材料製造","explanation":"錯誤：成分檢查本身未製造新材料。"},{"id":"C","text":"材料分析與品質控制","explanation":"正確：用分析確認批次內容正是品質控制。"},{"id":"D","text":"新用途的理論預測","explanation":"錯誤：直接檢查成分與理論預測不同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S032","stem":"研究員開發能在原子尺度量測物質性質的儀器。這項儀器的直接用途屬於哪種化學工作？","concept":"化學量測不只使用現成工具，也包括開發能取得物質性質的新儀器。原子尺度的量測儀器可擴展觀察與分析能力，直接產出性質資料。資料可支援候選設計或模型檢查，但這不表示儀器本身已製備新材料，或已完成未測條件的預測；應依直接產出分辨各項工作。","correct":"A","options":[{"id":"A","text":"測量物質性質","explanation":"正確：原子尺度儀器支援物質性質量測。"},{"id":"B","text":"依原料性質設計新材料組合","explanation":"錯誤：設計組合可使用量測資料，但不是此儀器直接提供的產出。"},{"id":"C","text":"實際製備具有所需性質的材料","explanation":"錯誤：製備材料與儀器取得性質資料是不同活動。"},{"id":"D","text":"由物質行為推導未測條件的性能","explanation":"錯誤：從行為推導未知性能是模型工作，與直接量測不同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S033","stem":"為了了解污染物在河川中如何移動，研究者在不同位置分析水樣。這些分析最直接得到什麼？","concept":"不同位置的水樣分析可提供相應受測樣品的物質資訊，用來描述當次分布並支援後續研究。這些資料不是所有時刻的結果，也不直接包辦其他成分的分布或完整運輸原因。量測取得物質的狀況，模型或進一步研究則幫助解釋與預測行為；兩種功能需清楚區分。","correct":"C","options":[{"id":"A","text":"同一地點未取樣時刻的含量，與本次結果必定相同","explanation":"錯誤：本次取樣結果不能直接代表未取樣時刻。"},{"id":"B","text":"污染物在各處移動的完整原因，已由含量資料全部確定","explanation":"錯誤：含量分布是解釋的依據，不等於完整原因已確定。"},{"id":"C","text":"各位置實際水樣的物質資訊","explanation":"正確：水樣分析直接提供相應位置的物質資料。"},{"id":"D","text":"所有其他成分的分布，都可由目標物質的含量直接推得","explanation":"錯誤：一種物質的含量不能直接代表其他成分的分布。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S034","stem":"下列何者最符合化學產業中的品質控制？","concept":"品質控制的對象是產品或材料的實際品質，需要把分析結果與指定要求相對照。新材料的預測、製備和理論說明都可能是化學工作，但不等於已檢查某批產品。題目中的成分分析直接回應產品是否符合要求，所以最符合品質控制。","correct":"B","options":[{"id":"A","text":"只由分子模擬預測未製成材料的性質","explanation":"錯誤：未製成材料的預測不能直接確認批次品質。"},{"id":"B","text":"分析已製成材料是否符合指定成分要求","explanation":"正確：實際材料分析可核對指定成分要求。"},{"id":"C","text":"製備尚未存在的新材料組合","explanation":"錯誤：製備屬研發活動，品質仍需另作分析。"},{"id":"D","text":"提出對發光現象的理論說明","explanation":"錯誤：理論說明不是本題要求的產品檢查。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S035","stem":"某包裝材料已有實物，但不知道在使用條件下是否保持所需性能。最直接的化學工作為何？","concept":"已有材料實物但用途性能未知時，最直接的工作是在相應使用條件下量測性質。主要成分、接觸前表現和模型預測可提供線索，但它們沒有直接回答實際使用情境下的性能。量測結果與用途要求對照後，才能判斷候選是否合用，並為後續解釋或改良提供資料。","correct":"A","options":[{"id":"A","text":"在相應條件下測量該材料的性質","explanation":"正確：在用途條件下量測能直接回答性能問題。"},{"id":"B","text":"只用模型給出的性能預測，作為實際使用性能已確認的依據","explanation":"錯誤：模型預測仍需與實際材料的表現核對。"},{"id":"C","text":"只量材料接觸使用環境前的性能，便推定接觸後表現","explanation":"錯誤：接觸前的性能可能不能代表接觸後的性能。"},{"id":"D","text":"只確認主要成分含量，便推定所需使用性能","explanation":"錯誤：成分含量與使用性能是不同的待確認項目。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S036","stem":"化學家用理論與程式解釋分子如何運動。這最直接屬於哪項工作？","concept":"模型是用來解釋或預測物質性質與行為的方法。理論和程式模擬能協助理解分子運動，因此符合建模的功能。判斷關鍵不是有沒有使用電腦，而是是否建立了物質行為的解釋或預測；實際成分分析和新材料製備則是另外兩類工作。","correct":"B","options":[{"id":"A","text":"分析一批產品的純度","explanation":"錯誤：純度分析直接取得樣品組成資料。"},{"id":"B","text":"發展解釋物質行為的模型","explanation":"正確：理論與程式用於解釋分子行為，屬建模。"},{"id":"C","text":"製造新的材料組合","explanation":"錯誤：本題未製得新的材料實物。"},{"id":"D","text":"測量水樣中的成分","explanation":"錯誤：水樣分析是量測，非所述理論解釋。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S037","stem":"哪一項最能顯示某研究已具有「模型」的功能？","concept":"化學模型把物質原理與觀察連起來，可用於解釋已知現象或預測新的條件。依原理推測尚未測量的性質，是典型的預測功能；預測仍需用適當資料檢查。其餘選項分別是製備或直接量測，不能因都產生研究成果就全部稱為建模。","correct":"D","options":[{"id":"A","text":"直接檢驗一批原料的含量","explanation":"錯誤：檢驗原料含量是直接分析。"},{"id":"B","text":"用儀器讀出現有樣品的訊號","explanation":"錯誤：儀器讀值是量測資料。"},{"id":"C","text":"把材料製成供量測的樣品","explanation":"錯誤：製成樣品屬材料製造。"},{"id":"D","text":"根據物質原理推測未測條件下的性質","explanation":"正確：從原理推估性質具備模型的預測功能。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S038","stem":"模型估計某材料在指定條件下具有良好性能。這項估計與實際測量的關係，何者正確？","concept":"模型可以先提出材料在某條件下可能的表現，幫助研究者選擇候選與安排測量。實際量測則提供物質真正表現的資料，用來比較預測。兩者相互支援而資料來源不同；預測有數字不代表已實測，尚待驗證也不表示模型沒有用途。","correct":"B","options":[{"id":"A","text":"只要模型符合一項材料資料，就能取代其他條件的性能測量","explanation":"錯誤：符合一項資料不保證其他條件下的預測都成立。"},{"id":"B","text":"估計可指引研究，實測可檢查預測是否符合材料表現","explanation":"正確：模型提供預測，量測提供檢查預測的資料。"},{"id":"C","text":"只要量測值與模型接近，就表示全部物質行為已解釋完整","explanation":"錯誤：一項接近的結果仍不足以保證解釋涵蓋全部行為。"},{"id":"D","text":"只要模型輸出與儀器使用同一單位，就可視為同一種實測資料","explanation":"錯誤：單位相同不改變計算預測與儀器測量的取得方式。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S039","stem":"研究者已知材料在液體中的表現，接著提出分子如何行為的說明。新增加的是哪種內容？","concept":"觀察告訴我們材料呈現什麼性質，模型則嘗試說明為何會有這種表現。題目先有液體中的材料行為資料，再提出分子層次說明，新增的是解釋功能。模型應與觀察相符，但它與重新量測、製備新材料或抽樣檢驗的活動不同。","correct":"C","options":[{"id":"A","text":"另一批材料的成分量測","explanation":"錯誤：題目沒有新增另一批樣品分析。"},{"id":"B","text":"既有材料的品質抽樣","explanation":"錯誤：品質抽樣是量測工作，非此新增內容。"},{"id":"C","text":"對物質性質的解釋模型","explanation":"正確：分子行為說明在解釋已知物質性質。"},{"id":"D","text":"新材料實物的製備","explanation":"錯誤：提出解釋不等於已製得新材料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S040","stem":"某程式以物質性質為依據，預估污染物在環境中的移動。其最直接的化學功能為何？","concept":"依物質性質推估污染物在環境中的移動，是模型的預測功能。它能指引後續量測或幫助理解資料，但未取樣位置仍沒有直接實測。移動預測也不能獨自包辦所有環境影響，更不能保證每種環境都一樣；模型應在相應條件下與實際資料比較。","correct":"B","options":[{"id":"A","text":"直接確認未取樣位置的實際含量，無須現場資料","explanation":"錯誤：預估未直接量到未取樣位置的含量。"},{"id":"B","text":"建立物質運輸的預測模型","explanation":"正確：依物質資訊推估運輸屬模型工作。"},{"id":"C","text":"只由移動距離預測，就確定物質在環境中的所有影響","explanation":"錯誤：移動距離不是物質所有環境影響的完整資訊。"},{"id":"D","text":"由一種條件下的運輸結果，確認其他所有環境也相同","explanation":"錯誤：一種環境的結果不能直接概括其他條件。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S041","stem":"甲製得新包裝材料，乙測出材料耐用表現，丙解釋性能差異的原因。甲、乙、丙依序屬何種工作？","concept":"三項根本工作依成果區分：製造得到材料，測量得到性質資料，建模得到對性質的解釋或預測。甲有新實物，乙有性能數據，丙提出原因，因此依序是製造、測量、建模。它們可以出現在同一研究計畫中，彼此支援但不互相取代。","correct":"C","options":[{"id":"A","text":"測量、建模、製造","explanation":"錯誤：把製備、性能量測與原因解釋全部錯位。"},{"id":"B","text":"製造、建模、測量","explanation":"錯誤：乙取得數據是測量，丙解釋原因才是建模。"},{"id":"C","text":"製造、測量、建模","explanation":"正確：三人的產出依序對應實物、資料和解釋。"},{"id":"D","text":"建模、製造、測量","explanation":"錯誤：甲沒有提出模型，乙也沒有製備新物質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S042","stem":"化學家先預測候選材料的性質，再製得樣品並測試。模型在這個流程中最直接的作用為何？","concept":"預測可縮小材料研究的方向，幫助挑選較可能符合需求的候選。接著製備提供實物，量測檢查實際性質，三類工作形成連續研究。模型支援選擇並不代表樣品已存在或批次成分已知；實際結果仍須從材料測試取得。","correct":"D","options":[{"id":"A","text":"只依候選的預測排名，就確認排名最高者所有性質均合用","explanation":"錯誤：預測排名不等於全部性能已實際驗證。"},{"id":"B","text":"只要模型符合原料資料，就省略新候選的性能測量","explanation":"錯誤：原料資料的符合不直接驗證新組合的實際性能。"},{"id":"C","text":"以候選配方的理論組成，直接確認實際各批的成分","explanation":"錯誤：理論組成仍須與實際批次的分析區分。"},{"id":"D","text":"幫助選擇值得製備與測試的候選","explanation":"正確：模型能為候選選擇提供性質方面的依據。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S043","stem":"研究員配製一種新材料組合，再測量它的耐液體表現。對這兩步的成果，何者正確？","concept":"製備與測量回答不同問題。配製完成讓候選材料實際存在，耐液體測試則檢查它是否符合這項使用需求。原料已有性質資料，不表示新組合一定達標；一項測試通過也不能概括所有其他條件。兩步互相支援，才能把材料設計轉成有性能依據的用途判斷。","correct":"D","options":[{"id":"A","text":"材料已配成，表示其耐液體性能已符合原設計","explanation":"錯誤：配製成功不等於所需耐液體性能已驗證。"},{"id":"B","text":"原料各自的性質已知，組合的耐液體性能便可直接確定","explanation":"錯誤：原料個別性質不能直接代替新組合性能。"},{"id":"C","text":"耐液體測試合格，表示該組合在其他使用條件也全部合用","explanation":"錯誤：一項用途條件下合格不涵蓋所有其他條件。"},{"id":"D","text":"配製得到候選實物，耐液體測量用來檢查這項用途性能","explanation":"正確：兩步分別提供實物與指定性能資料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S044","stem":"模型預測某材料較耐用，實際製得後的測量卻不支持此預測。哪個後續最有助於化學研究？","concept":"模型預測與實際材料的耐用表現不一致時，應核對材料、測試條件及模型假設。原料資訊或按配方製備只能提供部分支持，不能單憑這些資訊把差異全部歸因於儀器。一次不符也未排除模型在其他條件的價值；應利用差異找出需要補充或修正的解釋。","correct":"A","options":[{"id":"A","text":"檢查材料與測試條件，再用結果改進解釋或預測","explanation":"正確：核對條件並修正理解能整合三類工作。"},{"id":"B","text":"只因模型符合原料的性質，就判定新材料實測差異必是儀器造成","explanation":"錯誤：原料資料符合不足以把新材料差異唯一歸因於儀器。"},{"id":"C","text":"只因材料已按配方製得，就判定模型假設不必檢查","explanation":"錯誤：配方製得不表示對性能的模型假設一定完整。"},{"id":"D","text":"只因一次結果不符，就判定模型在任何條件都不可能適用","explanation":"錯誤：一次不符不能直接否定模型的全部適用條件。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S045","stem":"一組資料包含實際候選藥物、該物質的量測結果，以及對體內處理的解釋。何者最完整描述其化學活動？","concept":"藥物相關研究可以同時產生材料、數據和解釋，對應化學家的三類根本工作。實際候選物質來自製備，性質資料來自量測，對體內處理的說明則具有模型功能。三者共享研究主題仍是不同產出，完整研究不能把它們全部壓成一種類別。","correct":"B","options":[{"id":"A","text":"有實際候選藥物，就足以確認所提出的體內處理解釋","explanation":"錯誤：候選實物存在沒有直接驗證體內行為的解釋。"},{"id":"B","text":"包含物質製備、性質量測與模型解釋","explanation":"正確：三項產出分別對應三類根本工作。"},{"id":"C","text":"性質量測符合某項預測，就表示其他體內條件也不必再研究","explanation":"錯誤：一項符合不涵蓋其他體內條件。"},{"id":"D","text":"模型能解釋既有資料，就表示新批候選物的成分也已確認","explanation":"錯誤：模型解釋既有結果不能取代新批成分分析。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S046","stem":"清潔用品、顏料與包裝材料都與化學有關，最重要的共同點為何？","concept":"清潔、呈色與包裝需要不同的材料功能，共同的化學基礎是利用物質性質完成用途。主要成分與純度是有用資訊，但不能代替每一項性能測量。使用效果良好也不代表用後沒有影響；材料研究應把實際功能、使用條件和相關物質行為連在一起，逐項確認所需證據。","correct":"D","options":[{"id":"A","text":"三者只要主要成分合格，就可省略用途性能的檢查","explanation":"錯誤：主要成分合格未直接確認全部用途性能。"},{"id":"B","text":"三者只要原料純度高，就能適用各自所有使用條件","explanation":"錯誤：高純度不保證各種使用條件都合用。"},{"id":"C","text":"三者只要使用效果良好，就能推定用後物質沒有不利影響","explanation":"錯誤：使用功能與用後影響需分別研究。"},{"id":"D","text":"三者都利用物質性質完成特定用途","explanation":"正確：物質性質與實際用途是三者的共同連結。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S047","stem":"清潔劑供應商要協助顧客選擇適合指定材料表面的產品。哪項資訊最有用？","concept":"協助顧客選清潔劑時，需要同時滿足去污功能與指定材料表面的使用要求。去污強但損傷表面，或表面不變卻不能去污，都可能不符合任務。其他表面資料只能提供線索，仍需檢查是否適用。有效的材料研究應把清潔劑對污垢與接觸表面的作用一起比較。","correct":"B","options":[{"id":"A","text":"清潔劑對另一表面的作用，直接移用為本表面的結果","explanation":"錯誤：不同表面的反應可能不同，資料不可直接代填。"},{"id":"B","text":"各清潔劑對污垢及接觸材料的作用","explanation":"正確：這些物質作用資料直接回應清潔選擇。"},{"id":"C","text":"只比較各清潔劑去污能力，不研究指定表面的變化","explanation":"錯誤：只有去污資料，仍缺指定表面是否受影響的資訊。"},{"id":"D","text":"只比較接觸後表面是否完整，不研究污垢能否去除","explanation":"錯誤：表面完整不表示已完成去污功能。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S048","stem":"要改良印刷顏料，使其符合某種印刷用途，哪個研究方向最有直接的化學依據？","concept":"改良顏料需要把印刷時所需表現與材料性質相連。原料純度、來源和同系列產品的性能可以提供背景，卻不能單獨決定候選顏料在這次用途是否合適。應先確定所需功能，再研究或量測本候選的相應性質，使材料選擇和改良有直接依據。","correct":"D","options":[{"id":"A","text":"只以原料純度代替全部印刷性能測試","explanation":"錯誤：純度是組成資訊，不等於所有使用性能。"},{"id":"B","text":"由同系列另一顏料的性能，直接確定本候選也合用","explanation":"錯誤：同系列或相似材料不能直接代替本候選的性能資料。"},{"id":"C","text":"只依顏料來源推定全部印刷性能","explanation":"錯誤：來源不能單獨提供全部性能資料。"},{"id":"D","text":"確認何種材料性質能讓顏料在使用時維持所需表現","explanation":"正確：由所需表現尋找材料性質可指引改良。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S049","stem":"技術服務人員用材料分析結果，向顧客說明某產品適用的接觸條件。這說明何者？","concept":"材料分析可支援技術服務，把物質資訊轉成有依據的使用說明。這些結論仍須對應實際分析的材料與條件。一次結果不能涵蓋所有後續批次，成分名稱相同也不保證性能相同；材料適合何種接觸用途，仍要依相應性質與條件判斷。","correct":"A","options":[{"id":"A","text":"化學知識也可用於協助產品使用","explanation":"正確：材料知識可支援技術服務與使用說明。"},{"id":"B","text":"一次材料分析足以將用途結論推廣至所有後續批次","explanation":"錯誤：一次分析未確認後續每批材料的實際品質。"},{"id":"C","text":"只要產品成分名稱相同，技術服務便可沿用所有接觸結論","explanation":"錯誤：成分名稱相同不保證比例、性能及接觸條件相同。"},{"id":"D","text":"材料經分析後便適合所有用途","explanation":"錯誤：適用性仍取決於被研究的條件與要求。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":
