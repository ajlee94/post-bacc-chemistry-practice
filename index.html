States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B068","stem":"容器內可用總空間90 mL，固定固體占20 mL，液體占25 mL，其餘全為可達氣體空間。氣體應占多少？","correct":"C","options":[{"id":"A","text":"65 mL","explanation":"只扣液體，漏了固體。"},{"id":"B","text":"70 mL","explanation":"只扣固體，漏了液體。"},{"id":"C","text":"45 mL","explanation":"90−20−25＝45 mL。"},{"id":"D","text":"135 mL","explanation":"不能把已占位體積加到容器之外。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B069","stem":"密閉氣體容器由直立改成橫放，仍保持原內體積且未轉態。依基本模型，哪個重新畫法合理？","correct":"B","options":[{"id":"A","text":"把氣體固定在原照片的下半部","explanation":"氣體應分布於旋轉後可達全空間。"},{"id":"B","text":"讓粒子繼續分布於旋轉後整個容器內","explanation":"容器朝向改變不使氣體具有固定局部外形。"},{"id":"C","text":"把氣體都轉成固體","explanation":"未提供固化條件。"},{"id":"D","text":"刪去上半部粒子","explanation":"轉動不消滅粒子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B070","stem":"模型本來顯示粒子靠近並滑過鄰居，結束後各粒子主要在固定位置附近振動。所有粒子身分保留。哪句最完整？","correct":"D","options":[{"id":"A","text":"只要仍有運動就一定沒有物態改變","explanation":"固體也可振動。"},{"id":"B","text":"身分不變表示任何物理性質不能變","explanation":"相變能保持身分而改物理性質。"},{"id":"C","text":"粒子必須全部停止才可成固體","explanation":"教材允許固態振動。"},{"id":"D","text":"模型表現液態轉為固態，並未表示分解","explanation":"運動限制改變支持固化，身分保留。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B071","stem":"瓶內容積200 mL，液體50 mL，上方氣體150 mL。學生把氣體比例寫成150÷50＝3，稱「占瓶子300%」。錯在哪裡？","correct":"A","options":[{"id":"A","text":"分母應為全瓶200 mL，氣體占75%","explanation":"150÷200＝0.75。"},{"id":"B","text":"氣體不能有可測體積","explanation":"當時容器可達空間可作體積。"},{"id":"C","text":"液體體積一定為零","explanation":"題設為50 mL。"},{"id":"D","text":"氣體分子必定有300%大小","explanation":"百分比不是分子尺寸。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B072","stem":"密閉瓶中同一份水沒有逸出，也沒有化學反應。大部分水蒸氣凝結後，可見液態水只占瓶底一小部分，上方仍有剩餘水蒸氣。有人說「可見液體沒填滿瓶子，所以大部分水消失」。哪項解釋正確？","correct":"B","options":[{"id":"A","text":"分子數必與瓶底高度成正比","explanation":"高度不直接決定分子總數。"},{"id":"B","text":"水仍保留；凝結使分子間距縮小，且需合計氣、液兩部分的水","explanation":"液態部分占空間小不等於水消失；密閉、無反應下，同份水仍分布在已凝結液體及剩餘水蒸氣中。"},{"id":"C","text":"凝結成液體的水分子已被消滅，所以只需計算剩餘水蒸氣","explanation":"凝結仍保留H₂O；液態部分必須計入同一份水的總量。"},{"id":"D","text":"瓶內剩餘空間必定都是原水分子變大","explanation":"分子不因凝結膨大填空。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B073","stem":"照片顯示樣品為圓柱形，沒有前後比較、體積或運動資訊。下面哪項追加證據最能支持它是固體而非被限制的液體？","correct":"B","options":[{"id":"A","text":"再量一次照片像素","explanation":"像素不解除容器限制。"},{"id":"B","text":"移出限制後仍保有相同自身外形","explanation":"固體可保有自身形狀。"},{"id":"C","text":"把照片轉90度","explanation":"圖的朝向不決定物態。"},{"id":"D","text":"把圓柱形重新命名","explanation":"命名不是觀察。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B074","stem":"甲實驗壓縮密閉氣體，乙實驗從液體杯倒走一半液體。兩者都記到體積下降。哪個比較正確？","correct":"D","options":[{"id":"A","text":"兩者都證明同份樣品容易壓縮","explanation":"乙改變了杯內樣品量。"},{"id":"B","text":"兩者都只是分子被壓小","explanation":"甲壓縮改間距，乙只是移走液體。"},{"id":"C","text":"甲必定減少分子數，乙必定不減少杯內量","explanation":"剛好顛倒兩操作。"},{"id":"D","text":"甲改同份氣體空間，乙改杯內液體份量","explanation":"相同讀值方向可能來自不同原因。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B075","stem":"教材說氣體壓縮可使碰撞較頻繁。若另外把觀察時間拉長，總碰撞次數增加，能否只由總次數宣布壓縮提高了頻率？","correct":"A","options":[{"id":"A","text":"不能，還須用相同時間或除以觀察時間比較","explanation":"總次數受觀察長度影響。"},{"id":"B","text":"能，總次數與頻率永遠相等","explanation":"頻率是每單位時間的次數。"},{"id":"C","text":"不能，因氣體不碰撞","explanation":"教材明述氣體碰撞。"},{"id":"D","text":"能，觀察越久每顆分子就越大","explanation":"時間不代表分子尺寸增加。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B076","stem":"一杯液體內緩慢放入不溶解、不反應的固體塊，沒有液體流失或相變，液面升高。哪項結論最恰當？","correct":"C","options":[{"id":"A","text":"液面升高證明每個液體分子變大","explanation":"沒有分子尺寸改變證據。"},{"id":"B","text":"液體自身體積必增加為兩倍","explanation":"液面變化還受固體占位影響。"},{"id":"C","text":"固體占據空間可使液面升高，不需液體量增加","explanation":"增加的固體空間改變了容器內分布。"},{"id":"D","text":"液體已變成氣體","explanation":"題設排除了相變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B077","stem":"水樣外層已有可流動液體，中央仍見保持自身形狀的冰。下列何者符合完整觀察？","correct":"B","options":[{"id":"A","text":"整份已全部成為液體","explanation":"忽略中央固態區。"},{"id":"B","text":"樣品同時含固態與液態水","explanation":"兩區表現不同物態但仍是水。"},{"id":"C","text":"中央冰沒有H₂O","explanation":"冰仍由水分子構成。"},{"id":"D","text":"只要外層能流動，中央分子必全自由滑動","explanation":"局部液態不能推為全部液態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B078","stem":"甲乙都沒有自身固定形狀，但甲粒子靠近、乙粒子相距遠。若要把兩者壓到原體積的一小部分，依基本模型何者較可行？","correct":"D","options":[{"id":"A","text":"甲，因靠近表示有較大空隙","explanation":"靠近表示可縮空間較少。"},{"id":"B","text":"甲乙一定完全相同","explanation":"兩種粒子間距不同。"},{"id":"C","text":"皆不可能，無固定形狀表示無體積","explanation":"兩態都有當時占據的空間。"},{"id":"D","text":"乙，因較大粒子間空間可縮減","explanation":"這是氣體易壓縮的理由。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B079","stem":"兩張水樣圖都使用完整H₂O小組，未標明間距比例、運動或巨觀特徵。下列哪一結論仍不能確定？","correct":"A","options":[{"id":"A","text":"兩圖分別是哪種物態","explanation":"相同分子圖示可用於水的不同物態。"},{"id":"B","text":"兩圖都以H₂O為圖示單位","explanation":"這由題設直接給定。"},{"id":"C","text":"沒有把圖示畫成H₂與O₂","explanation":"兩圖皆完整H₂O，直接可見。"},{"id":"D","text":"可補上物態相關觀察","explanation":"這是合理補充方法。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B080","stem":"氣體裝在非常硬的固定容器內，實驗無法把容器壓小。研究者宣稱氣體不易壓縮。判斷中的主要混淆為何？","correct":"C","options":[{"id":"A","text":"把液體當固體","explanation":"題目只描述氣體與容器。"},{"id":"B","text":"把顏色當作體積","explanation":"沒有顏色資訊。"},{"id":"C","text":"把容器無法變形當成氣體自身不可壓縮","explanation":"需能改變可用空間才能檢驗氣體。"},{"id":"D","text":"把分子數當作質量","explanation":"題目未進行此類比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B081","stem":"密閉硬瓶內有一定量液體及上方氣體，轉動瓶子後兩區外形改變。若無相變、無流失且液體體積不變，氣體區體積如何？","correct":"B","options":[{"id":"A","text":"一定增加，因外形改變","explanation":"外形改變不必改體積。"},{"id":"B","text":"保持相同，因總空間與液體占位均不變","explanation":"氣體可用空間＝總空間−液體體積。"},{"id":"C","text":"一定減少，因轉動必壓縮","explanation":"瓶內空間未變，不必壓縮。"},{"id":"D","text":"必定為零","explanation":"仍有剩餘氣體空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B082","stem":"比較氣態與液態時，教材說氣體粒子通常較疏遠。若某一瞬間氣體中一對粒子正在碰撞，應如何處理？","correct":"D","options":[{"id":"A","text":"這推翻所有氣體特徵","explanation":"瞬間個別靠近不否定整體疏遠。"},{"id":"B","text":"把碰撞粒子改名為固體","explanation":"一對接觸不是固態證據。"},{"id":"C","text":"認定氣體粒子不可能碰撞","explanation":"教材本就包含互撞。"},{"id":"D","text":"保留一般比較，同時允許個別粒子短暫靠近","explanation":"平均分布和碰撞事件相容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B083","stem":"圖甲把壓縮後的氣體分子畫得更小；圖乙把凝結後的H₂O拆成H和O。兩圖分別混淆了什麼？","correct":"A","options":[{"id":"A","text":"甲混淆分子間空間與分子尺寸，乙混淆相變與分子拆解","explanation":"兩個錯誤分別位於空間尺度與化學身分。"},{"id":"B","text":"甲乙都只是少畫容器","explanation":"題設錯誤集中在分子描繪。"},{"id":"C","text":"甲乙都完全正確","explanation":"兩者均違反本節模型。"},{"id":"D","text":"甲混淆字體、乙混淆日期","explanation":"這些與題設無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B084","stem":"課堂只教三態，學生想用「是否為元素」解答氣液固分類。哪個修正最符合本節任務？","correct":"C","options":[{"id":"A","text":"元素名稱可以完全取代物態資料","explanation":"物質身分與狀態不是同一個問題。"},{"id":"B","text":"只看化學式就能指定任意條件的物態","explanation":"同物質可有不同狀態。"},{"id":"C","text":"改以形狀、體積、壓縮性及粒子行為判斷","explanation":"這些是本節物態的直接判據。"},{"id":"D","text":"把所有分子物質列為氣體","explanation":"水也有液態及固態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B085","stem":"封閉示意模型起初16個水分子全為氣態，後來發生部分凝結，沒有反應。模型完整畫出全部分子，已知其中4個仍在氣態區，其餘在液態區。這表示有水分子被消滅嗎？","correct":"B","options":[{"id":"A","text":"被消滅12個","explanation":"轉入液態區不是消滅。"},{"id":"B","text":"沒有，12個改在液態區，總數仍16","explanation":"16−4＝12，身分及總數保留。"},{"id":"C","text":"總數變成20","explanation":"不能把末圖氣態量加回總數。"},{"id":"D","text":"氣態剩4個所以所有水只剩4個","explanation":"這漏算液態區。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B086","stem":"液體轉杯後依舊讀到相同體積。這項結果支持哪一結論，而不需要宣稱分子完全不動？","correct":"D","options":[{"id":"A","text":"每顆粒子的位置永不改變","explanation":"液體粒子可以滑動。"},{"id":"B","text":"液體總是具有固定外形","explanation":"外形可隨容器改變。"},{"id":"C","text":"液體與容器之間沒有接觸","explanation":"體積相同不排除接觸。"},{"id":"D","text":"同份液體在這些條件下保持體積","explanation":"這是讀值直接支持的巨觀結論。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B087","stem":"前後粒子圖使用相同倍率。壓縮後只有小球直徑變小，球心位置和外框完全不變。這幅圖是否真正表現教材所說的氣體壓縮？","correct":"A","options":[{"id":"A","text":"沒有，應呈現可用空間與分子間距減少","explanation":"只縮小分子恰與教材相反。"},{"id":"B","text":"有，縮小球就等於縮小氣體占據區","explanation":"外框仍相同，且分子本體不應因此縮小。"},{"id":"C","text":"有，只要畫面空白變大就叫壓縮","explanation":"壓縮應減少粒子間空間。"},{"id":"D","text":"沒有，因氣體不可能畫成粒子","explanation":"粒子模型可用，問題在改錯量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B088","stem":"一部分水蒸氣凝結，瓶內仍有未凝結的氣態水。畫剩餘氣態區時應注意哪項？","correct":"C","options":[{"id":"A","text":"剩餘氣態水必集中在一顆固定球","explanation":"氣體不具有固定局部外形。"},{"id":"B","text":"未凝結分子都必變為固態","explanation":"未凝結部分仍是氣態。"},{"id":"C","text":"剩餘氣態水仍可散布在可達氣體空間","explanation":"部分凝結不取消其餘氣體的性質。"},{"id":"D","text":"只要部分凝結，整瓶粒子全停止","explanation":"液氣兩區仍有粒子運動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B089","stem":"甲紀錄只追蹤液體外形，乙紀錄只追蹤固體粒子振動。兩人都看見「變化」，哪項整合合理？","correct":"B","options":[{"id":"A","text":"兩人都必已觀察到相變","explanation":"外形或振動變化未必改變物態。"},{"id":"B","text":"變化可發生在同態內，應先說清觀察量","explanation":"液體可變形，固體可振動，兩者皆可保持物態。"},{"id":"C","text":"甲一定量到體積改變","explanation":"外形改變不必改體積。"},{"id":"D","text":"乙一定看見液化","explanation":"固態粒子本來能振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B090","stem":"教材說液體粒子可快速移動，固體粒子可小幅振動。若沒有同溫條件或速度數據，哪句超出這段資料？","correct":"D","options":[{"id":"A","text":"兩態的運動限制不同","explanation":"這是教材直接比較。"},{"id":"B","text":"固體粒子不完全靜止","explanation":"固態振動支持。"},{"id":"C","text":"液體粒子能滑過彼此","explanation":"本節直接支持。"},{"id":"D","text":"任意液體中的每顆粒子都比任意固體粒子更快","explanation":"沒有條件和數據支持跨樣品逐粒子的絕對排序。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5,6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B091","stem":"一份報告已確認樣品無固定形狀。補充甲「可換外形」與補充乙「同份樣品可擴展占滿更大容器」，哪項更能區分液與氣？","correct":"A","options":[{"id":"A","text":"乙，提供了固定體積與否的新資訊","explanation":"甲重複外形資訊，乙可分辨液氣。"},{"id":"B","text":"甲，因同一句寫兩次更可信","explanation":"重複措辭不增加判別維度。"},{"id":"C","text":"兩者都完全沒有物理資訊","explanation":"兩者皆有，只是乙增加新資訊。"},{"id":"D","text":"不能用任何巨觀特徵區分液氣","explanation":"三態表可利用體積及壓縮性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B092","stem":"一份記錄只寫「分子化學身分前後相同」。學生直接宣布一定發生相變。哪個回應正確？","correct":"C","options":[{"id":"A","text":"身分相同必定代表凝結","explanation":"也可能全程同態。"},{"id":"B","text":"身分相同必定代表融化","explanation":"沒有固態到液態的證據。"},{"id":"C","text":"還需物態前後不同的證據","explanation":"保持身分是單純相變特徵，但不表示一定轉態。"},{"id":"D","text":"身分相同表示物質不存在","explanation":"身分可在物態改變或不變時保留。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B093","stem":"把容器內一條虛線當成觀察分區，並用它阻止模型氣體越過。若虛線不代表實體壁，應如何修正？","correct":"B","options":[{"id":"A","text":"增加虛線顏色讓它阻氣","explanation":"顏色不使想像邊界成實體。"},{"id":"B","text":"允許粒子跨過虛線，或另明確給出實體隔板","explanation":"阻擋氣體需有實際邊界條件。"},{"id":"C","text":"把跨線粒子刪除","explanation":"觀察分區不消滅粒子。"},{"id":"D","text":"把虛線兩側都標為固體","explanation":"分區不決定物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B094","stem":"甲次增加氣體可用容積，乙次同時增加容積又加入氣體。要單獨示範「同份氣體可擴展」，哪項比較較合適？","correct":"D","options":[{"id":"A","text":"只用乙，因改變越多越清楚","explanation":"乙混入份量變化。"},{"id":"B","text":"甲乙都必須發生分解","explanation":"沒有反應必要。"},{"id":"C","text":"兩次都不准改容積","explanation":"示範擴展本來就要增加可用空間。"},{"id":"D","text":"用甲並確認沒有漏氣或相變","explanation":"甲較符合固定份量下改變空間的目標。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B095","stem":"兩張圖文字標籤互換：圖甲標固體但粒子疏遠、全盒移動；圖乙標氣體但粒子靠近、各在位置附近振動。若只改標籤，應如何？","correct":"A","options":[{"id":"A","text":"甲改氣體，乙改固體","explanation":"兩圖的粒子行為分別對應氣與固。"},{"id":"B","text":"兩張都改液體","explanation":"液體應靠近且可相對滑動。"},{"id":"C","text":"兩張都保留","explanation":"標籤與模型不相容。"},{"id":"D","text":"甲改液體，乙改氣體","explanation":"仍與模型不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B096","stem":"假說寫「所有能流動的樣品都像氣體一樣容易壓縮」。哪一項本節觀察最直接反駁？","correct":"C","options":[{"id":"A","text":"固體不易壓縮","explanation":"固體不符合假說前提的可流動。"},{"id":"B","text":"氣體可被壓縮","explanation":"這支持一種例子，不能反駁全稱。"},{"id":"C","text":"液體能流動但通常不易明顯壓縮","explanation":"同時符合前提又否定結論，構成反例。"},{"id":"D","text":"水分子是H₂O","explanation":"化學身分不直接處理此假說。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4,5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B097","stem":"一份氣體能把大容器占滿，粒子間卻很疏遠。下列哪個等式概念應避免？","correct":"B","options":[{"id":"A","text":"氣體占據範圍可由容器界定","explanation":"這符合可達空間。"},{"id":"B","text":"氣體所占容積必等於各分子本體體積相加","explanation":"氣體所占空間包含分子間的大量空隙。"},{"id":"C","text":"單純壓縮可減少粒子間空間","explanation":"教材支持。"},{"id":"D","text":"個體尺寸與間距是不同量","explanation":"這是必要區分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B098","stem":"連續紀錄為：階段甲保有自身外形；階段乙可倒出但量固定；階段丙自行散布至全部可達空間。已排除外力永久變形，最合理的物態順序為何？","correct":"D","options":[{"id":"A","text":"液→固→氣","explanation":"前兩階段特徵對不上。"},{"id":"B","text":"氣→液→固","explanation":"首末兩階段顛倒。"},{"id":"C","text":"固→氣→液","explanation":"乙有固定體積且可倒出，應為液。"},{"id":"D","text":"固→液→氣","explanation":"依形狀、體積及擴展三項觀察順序判斷。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B099","stem":"某液體模型畫粒子靠近而可滑動。編輯為表達「可流動」，改成粒子間大面積空白並可任意壓到很小。哪個處理更好？","correct":"A","options":[{"id":"A","text":"保留近距排列，以相對位移箭頭表達流動","explanation":"液體能動不需要氣態般大空隙。"},{"id":"B","text":"保留大空白，因流動就等於易壓縮","explanation":"混淆流動與壓縮性。"},{"id":"C","text":"把所有箭頭刪掉並說完全靜止","explanation":"失去液態運動特徵。"},{"id":"D","text":"改畫粒子全部變形","explanation":"流動不需分子變形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B100","stem":"巨觀測得樣品外形隨容器、體積固定且不易壓縮。候選粒子說明哪項完整相容？","correct":"C","options":[{"id":"A","text":"粒子疏遠，可散布至任意大空間","explanation":"這是氣體模型，不合固定體積。"},{"id":"B","text":"粒子完全不動且保持固定相對位置","explanation":"這不解釋液體可變外形的流動。"},{"id":"C","text":"粒子靠近而可滑過彼此","explanation":"近距解釋不易壓縮，相對滑動解釋外形可變。"},{"id":"D","text":"沒有任何粒子，只有外形","explanation":"不能提供本節所需微觀解釋。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B101","stem":"甲、乙、丙各為一般固、液、氣之一且不重複。甲沒有固定形狀；乙與甲同樣不易明顯壓縮。依三態表，甲、乙、丙依序應是哪一組？","correct":"D","options":[{"id":"A","text":"固態、液態、氣態","explanation":"丙為氣態正確，但甲無固定形狀，不能標固態。"},{"id":"B","text":"氣態、固態、液態","explanation":"甲與乙都不易明顯壓縮，甲不能標氣態。"},{"id":"C","text":"液態、氣態、固態","explanation":"甲為液態正確，但乙與甲同樣不易明顯壓縮，乙不能標氣態。"},{"id":"D","text":"液態、固態、氣態","explanation":"甲無固定形狀且不易明顯壓縮，為液態；乙同樣不易壓縮又不能與甲同態，為固態；丙為剩餘氣態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3,8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic01-G02-B102","stem":"甲室原有氣體，乙室原為空；先開通兩室，等待氣體充分分布，再關閉兩室間的閥門。兩室外壁密閉、無反應及相變。關閥後哪項描述正確？","correct":"A","options":[{"id":"A","text":"乙室仍可留有氣體","explanation":"關閥阻止後續交換，不會把已進入乙室的氣體送回甲。"},{"id":"B","text":"乙室立刻恢復原先無氣體","explanation":"這誤把關閉通道當成逆轉先前分布。"},{"id":"C","text":"所有氣體必擠進閥門內","explanation":"閥門是邊界，不是所有粒子的歸宿。"},{"id":"D","text":"關閥必使兩室氣體化學分解","explanation":"封閉通道本身不要求分解。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；1.2 Classifications of Matter > States of Matter；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4。","example":""}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"central-0-1-ch1-sec1-2-topic02","title":"1.2-02 純物質","version":"B01-G02-v1-715ad9d3eab5614a","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.2 物質的分類"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"G02-PURE-S001","stem":"清潔認證只檢查灰塵，報告卻加上「因此具有固定化學組成」。哪個部分是未經檢查的新結論？","correct":"D","options":[{"id":"A","text":"灰塵已檢查","explanation":"這是題設已執行項目。"},{"id":"B","text":"樣品可有外觀","explanation":"有外觀不等於具有固定組成。"},{"id":"C","text":"報告可記錄觀察","explanation":"記錄觀察並無問題。"},{"id":"D","text":"化學組成固定","explanation":"除塵結果不提供物質種類或組成證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第1頁（正式PNG第03頁）。","example":""},{"id":"G02-PURE-S002","stem":"「每份純樣品組成相同」中的「相同」，應在何者之間比較？","correct":"B","options":[{"id":"A","text":"所有不同純物質","explanation":"各純物質有自己的組成。"},{"id":"B","text":"同一種純物質的不同樣品","explanation":"定義針對同種純物質跨樣品的一致性。"},{"id":"C","text":"任意同重物品","explanation":"質量相同不保證組成相同。"},{"id":"D","text":"所有相同顏色物品","explanation":"顏色不決定物質身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-S003","stem":"一份樣品已確定是混合物。分類表「純物質的子類」一欄最應填什麼？","correct":"D","options":[{"id":"A","text":"化合物","explanation":"混合物不能直接列為一種純化合物。"},{"id":"B","text":"元素","explanation":"整份混合物不屬純元素。"},{"id":"C","text":"元素與化合物皆是","explanation":"成分分類不等於整份樣品分類。"},{"id":"D","text":"不適用","explanation":"混合物不在純物質這個上層類別內。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-S004","stem":"純水的H₂O描述的是哪一層資訊？","correct":"D","options":[{"id":"A","text":"每瓶的容量","explanation":"化學式不標容量。"},{"id":"B","text":"水取得的地點","explanation":"化學式不編碼產地。"},{"id":"C","text":"一杯含幾顆分子","explanation":"粒子總數取決於份量。"},{"id":"D","text":"每個水分子的原子組成","explanation":"每個水分子含兩氫一氧，支持固定組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-S005","stem":"純NaCl含Na⁺、Cl⁻兩種離子，這項資訊直接表示什麼？","correct":"C","options":[{"id":"A","text":"含兩種可任意調配的純物質","explanation":"離子種類不能直接當成混合物成分數。"},{"id":"B","text":"NaCl一定混有水","explanation":"題設未給水。"},{"id":"C","text":"組成該離子化合物的離子種類有兩種","explanation":"兩離子共同構成固定比例的NaCl。"},{"id":"D","text":"NaCl只能以分子存在","explanation":"固體NaCl不是獨立分子集合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-S006","stem":"要保留「同條件比較」的可讀性，密度資料旁最值得記錄哪組資訊？","correct":"A","options":[{"id":"A","text":"測量溫度與壓力","explanation":"溫度與壓力使性質比較有條件依據。"},{"id":"B","text":"作者喜好與日期顏色","explanation":"喜好與字色不支持物性比較。"},{"id":"C","text":"瓶蓋品牌與售價","explanation":"這些不能交代測量條件。"},{"id":"D","text":"拍照角度與字體","explanation":"版面資訊不控制密度比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-S007","stem":"「不能化學分解成更簡單物質」關心的是哪種變化？","correct":"B","options":[{"id":"A","text":"分裝到較小瓶","explanation":"分裝只改份量。"},{"id":"B","text":"化學身分變成更簡單物質","explanation":"此處簡單指化學組成層次，而非外形大小。"},{"id":"C","text":"換成較小標籤","explanation":"標籤不改樣品。"},{"id":"D","text":"磨成較小顆粒","explanation":"顆粒大小不是物質化學身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第7頁（正式PNG第09頁）。","example":""},{"id":"G02-PURE-S008","stem":"純化合物裡的不同元素與混合物裡的不同成分，關鍵差別是什麼？","correct":"D","options":[{"id":"A","text":"前者一定天然，後者一定人造","explanation":"來源不決定純物質或混合物。"},{"id":"B","text":"前者一定無色，後者一定有色","explanation":"顏色沒有此必然對應。"},{"id":"C","text":"前者一定固體，後者一定液體","explanation":"兩種分類均不由狀態單獨決定。"},{"id":"D","text":"前者按固定比例化學結合，後者保留各自物質身分","explanation":"這是組成與化學身分的差別。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-S009","stem":"談糖水時，「成分保留身分」的成分是指什麼？","correct":"C","options":[{"id":"A","text":"所有不同重量的部分","explanation":"重量差異不直接定義成分。"},{"id":"B","text":"瓶上的中文與英文","explanation":"名稱語言不創造物質。"},{"id":"C","text":"糖與水這些不同物質","explanation":"混合物成分指組成它的各種物質。"},{"id":"D","text":"同瓶內的左右區域","explanation":"空間 id":"G02-PURE-S022","stem":"下列哪一種變化本身不違反同種純物質的固定組成？","correct":"B","options":[{"id":"A","text":"相同名稱可任指不同物質","explanation":"名稱不能豁免組成判準。"},{"id":"B","text":"取用份量不同而各組成比例不變","explanation":"固定的是比例與身分，不是取用量。"},{"id":"C","text":"每批元素比例任意變","explanation":"同種純物質不能任意改比例。"},{"id":"D","text":"出現保留身分的新成分","explanation":"新成分影響整份純度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-S023","stem":"在「純物質→化合物」分類圖中，箭頭正確的讀法是什麼？","correct":"C","options":[{"id":"A","text":"兩者可按任意比例混合","explanation":"分類圖不提供配方。"},{"id":"B","text":"所有純物質只屬此一支","explanation":"另有元素分支。"},{"id":"C","text":"化合物是純物質的一類","explanation":"箭頭表示類別包含關係。"},{"id":"D","text":"純物質一定變成化合物","explanation":"分類箭頭不是反應箭頭。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-S024","stem":"「純水含氫、氧元素」不應被改寫成哪句？","correct":"C","options":[{"id":"A","text":"純水的分子含氫原子","explanation":"H₂O包含氫原子。"},{"id":"B","text":"純水是一種化合物","explanation":"水確屬化合物。"},{"id":"C","text":"純水是氫氣與氧氣的混合物","explanation":"元素組成不等於自由氣體成分。"},{"id":"D","text":"純水的分子含氧原子","explanation":"H₂O包含氧原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-S025","stem":"「只要所有分子相同就能涵蓋所有純物質」漏掉了哪個本節例子？","correct":"A","options":[{"id":"A","text":"純NaCl離子晶體","explanation":"NaCl可純但不是獨立分子集合。"},{"id":"B","text":"含多成分海水","explanation":"海水有多成分，非此純物質反例。"},{"id":"C","text":"糖水","explanation":"糖水原本不是純物質。"},{"id":"D","text":"空氣","explanation":"空氣是混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-S026","stem":"某表列出純物質X的沸點，表下注明指定壓力。拿表值判斷樣品時應如何使用註腳？","correct":"D","options":[{"id":"A","text":"只看樣品名稱即可忽略","explanation":"名稱不能取代條件一致性。"},{"id":"B","text":"把壓力當X的另一成分","explanation":"壓力是條件，不是物質成分。"},{"id":"C","text":"註腳只供裝飾","explanation":"條件註記影響比較意義。"},{"id":"D","text":"把指定壓力視為比較前提","explanation":"表值的適用條件須與樣品測量相容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-S027","stem":"定義中的「兩種或更多元素」若被縮成「恰好兩種元素」，會漏掉什麼？","correct":"D","options":[{"id":"A","text":"所有由兩種元素構成的化合物","explanation":"恰好兩種仍會被保留。"},{"id":"B","text":"只有一種原子的元素","explanation":"單一元素原本就不屬化合物。"},{"id":"C","text":"空瓶","explanation":"空瓶不是此定義的成員。"},{"id":"D","text":"由三種元素構成的一種純化合物","explanation":"三種滿足至少兩種，卻被恰好兩種錯排。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-S028","stem":"講義寫「元素A與B形成純化合物Q」。這裡「形成」與分類樹中的「屬於」有何差別？","correct":"B","options":[{"id":"A","text":"形成只表示換容器","explanation":"換容器不等於形成新物質。"},{"id":"B","text":"形成描述得到物質；屬於描述分類關係","explanation":"製備敘述和類別包含不是同種箭頭。"},{"id":"C","text":"兩者都只是物質改名","explanation":"形成物質不只是命名。"},{"id":"D","text":"兩者都表示兩種成分永遠共存","explanation":"純Q不必保留A、B原料身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-S029","stem":"只有「兩種物質共存且各保留身分」的資料，哪項分類已能成立？","correct":"C","options":[{"id":"A","text":"必為單一分子","explanation":"物質種類不是分子總數。"},{"id":"B","text":"必為純化合物","explanation":"共存不同於形成單一化合物。"},{"id":"C","text":"混合物","explanation":"多種不同物質保留身分符合混合物。"},{"id":"D","text":"必為純元素","explanation":"有兩種物質就非一種純元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-S030","stem":"把均勻糖水畫成同一底色，圖例應保留哪個提醒？","correct":"A","options":[{"id":"A","text":"底色表示外觀，不能取代成分說明","explanation":"圖像均一不等於化學身分單一。"},{"id":"B","text":"同色表示只有一種原子","explanation":"顏色不是原子分析。"},{"id":"C","text":"底色決定糖的化學式","explanation":"化學式不由繪圖顏色決定。"},{"id":"D","text":"同色表示沒有水","explanation":"圖中底色不能證明水不存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-S031","stem":"某物質的純樣品有固定組成。若另一樣品不符合「只一種固定物質」，是否必能肉眼看出不同區域？","correct":"C","options":[{"id":"A","text":"必能，物質種類會標在表面","explanation":"物質身分不會自行顯示標籤。"},{"id":"B","text":"必能，所有混合物都分層","explanation":"均勻混合物是反例。"},{"id":"C","text":"不一定，混合物也可能均勻","explanation":"化學組成差異不必形成可見分界。"},{"id":"D","text":"只要光線夠亮必能","explanation":"更亮仍不能把均勻等同純度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-S032","stem":"分類樹把「元素、化合物、水」列為純物質的三個同級分支。水這張卡片最適合移到哪裡？","correct":"D","options":[{"id":"A","text":"元素之下作唯一成員","explanation":"水含兩種元素，不是元素。"},{"id":"B","text":"混合物之下作定義","explanation":"純水不是混合物的定義。"},{"id":"C","text":"物質分類樹之外","explanation":"水仍是物質。"},{"id":"D","text":"化合物之下作例子","explanation":"水是一種化合物，具體例子不另創同級類別。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-S033","stem":"水分子中的氧原子應填在資料卡哪一欄？","correct":"A","options":[{"id":"A","text":"構成水的元素","explanation":"氧是H₂O的組成元素。"},{"id":"B","text":"瓶內第二種物質","explanation":"元素組成與不同物質成分須分開。"},{"id":"C","text":"未知雜質","explanation":"正常組成不能稱雜質。"},{"id":"D","text":"額外混入的氧氣","explanation":"水中氧不代表另有氧氣。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-S034","stem":"同種純NaCl製成許多晶粒，判定純度時哪個數量不是成分種類數？","correct":"C","options":[{"id":"A","text":"不同添加物種類","explanation":"添加物種類可能增加成分數。"},{"id":"B","text":"保留身分的其他物質種類","explanation":"其他物質身分與純度有關。"},{"id":"C","text":"NaCl晶粒個數","explanation":"多晶粒可全屬同種NaCl。"},{"id":"D","text":"樣品內不同化合物種類","explanation":"不同化合物共存表示多成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-S035","stem":"「在指定壓力下，某純液體的沸點為b」中，哪項是被比較的特性？","correct":"B","options":[{"id":"A","text":"資料卡紙張","explanation":"紙張不是該液體。"},{"id":"B","text":"沸點","explanation":"沸點是該條件下的性質資料。"},{"id":"C","text":"指定壓力","explanation":"壓力在此為控制條件。"},{"id":"D","text":"符號b的字形","explanation":"字形不屬物質特性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-S036","stem":"把純化合物的化學式稱為「可依口味調整的配方」，最直接破壞哪個概念？","correct":"D","options":[{"id":"A","text":"物質可以有名稱","explanation":"名稱存在不是問題核心。"},{"id":"B","text":"資料可用文字表達","explanation":"文字表達並未被此說法否定。"},{"id":"C","text":"樣品可分裝","explanation":"分裝不涉及改化學式。"},{"id":"D","text":"同種純化合物的固定組成","explanation":"化學式中的組成不能像混合比例任意調整。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-S037","stem":"判定空氣為混合物，哪項資訊比「看不到顏色」更直接？","correct":"A","options":[{"id":"A","text":"含氮氣、氧氣等不同物質","explanation":"多種氣體保留身分是直接依據。"},{"id":"B","text":"可被描述為均勻","explanation":"均勻可適用純物質或混合物。"},{"id":"C","text":"在室內採集","explanation":"採集位置本身不夠。"},{"id":"D","text":"可放在不同容器","explanation":"容器形式不決定成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-S038","stem":"資料說某混合物「不是不均勻」，也就是各處一致。這能把它移進純物質類嗎？","correct":"A","options":[{"id":"A","text":"不能，它只是均勻混合物","explanation":"已知多物質身分不受均勻描述影響。"},{"id":"B","text":"能，兩個否定會消除成分","explanation":"語句否定不消除實際成分。"},{"id":"C","text":"不能，因均勻物質都不存在","explanation":"均勻樣品確實存在。"},{"id":"D","text":"能，不均勻是混合物唯一條件","explanation":"混合物也可均勻。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-S039","stem":"「純樣品含一種原子」為避免把種類寫成總數，哪個補充最準確？","correct":"A","options":[{"id":"A","text":"這裡須說一種原子種類，且是元素分支","explanation":"種類層次清楚，且不誤套所有純物質。"},{"id":"B","text":"每顆原子都代表一種物質","explanation":"原子個體不等於物質種類。"},{"id":"C","text":"有幾顆就有幾種元素","explanation":"元素種類與個數不同。"},{"id":"D","text":"每瓶必只有一顆原子","explanation":"宏觀樣品可含大量原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第11頁（正式PNG第13頁）。","example":""},{"id":"G02-PURE-S040","stem":"已確認純NaCl的圖說錯寫「共價分子」。最合理的處理是什麼？","correct":"A","options":[{"id":"A","text":"改正圖說，樣品仍依真實組成分類","explanation":"圖說錯誤不改變實物化學身分。"},{"id":"B","text":"僅因圖說錯就把樣品改成混合物","explanation":"資料錯誤不是污染證據。"},{"id":"C","text":"認為文字可使晶體變分子","explanation":"文字不能改化學結構。"},{"id":"D","text":"把Na⁺、Cl⁻全刪掉","explanation":"兩離子是NaCl的組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第12頁（正式PNG第14頁）。","example":""},{"id":"G02-PURE-S041","stem":"研究「不同批次的同種純樣品」時，只重測同一小瓶多次，主要尚缺哪類比較？","correct":"A","options":[{"id":"A","text":"不同批次的樣品","explanation":"需有不同批次才能直接檢查跨樣品組成。"},{"id":"B","text":"同瓶測量次數","explanation":"增加同瓶次數不補跨批資訊。"},{"id":"C","text":"相同顏色的桌面","explanation":"桌面顏色不是取樣範圍。"},{"id":"D","text":"相同字體的標籤","explanation":"字體不是組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-S042","stem":"本節把純物質分為元素與化合物。這句話對應幾個直接分支，而不是幾種實際物質？","correct":"B","options":[{"id":"A","text":"三個","explanation":"混合物不在純物質之下。"},{"id":"B","text":"兩個","explanation":"元素與化合物為兩個分支。"},{"id":"C","text":"無限個直接分支","explanation":"各類可含多種物質，但直接分支只有兩個。"},{"id":"D","text":"一個","explanation":"題設明列兩類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-S043","stem":"「純水只含一種物質」可與哪句同時成立？","correct":"B","options":[{"id":"A","text":"不同產地必有不同化學式","explanation":"純水仍是H₂O。"},{"id":"B","text":"每個水分子含三個原子","explanation":"兩氫一氧共三個原子，仍屬同一水分子。"},{"id":"C","text":"每瓶只含一個原子","explanation":"一種物質不是一顆原子。"},{"id":"D","text":"含任意比例的氫氣與氧氣","explanation":"純水不是兩氣體的任意混合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-S044","stem":"教材以食鹽作純物質例子時，括號特指sodium chloride。這個括號有何作用？","correct":"A","options":[{"id":"A","text":"鎖定氯化鈉這種物質","explanation":"名稱用來指定化學物質身分。"},{"id":"B","text":"宣告所有市售鹽無添加物","explanation":"不能據此推及每款商品。"},{"id":"C","text":"把鹽水也變純","explanation":"鹽水另有水成分。"},{"id":"D","text":"表示樣品只有一顆分子","explanation":"NaCl式不表示單顆分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-S045","stem":"某純物質只有反應性資料，尚無顏色照片。下列哪個說法合理？","correct":"B","options":[{"id":"A","text":"反應性等於物質種類數","explanation":"反應性不是成分數。"},{"id":"B","text":"反應性也能提供物質特性的資訊","explanation":"已審內容把反應性列為明確特性的例子。"},{"id":"C","text":"沒有照片便沒有性質","explanation":"照片有無不決定特性存在。"},{"id":"D","text":"只承認肉眼所見是性質","explanation":"密度沸點等也非僅靠肉眼。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-S046","stem":"若樣品確為一種化合物，「含至少兩種元素」應被看成什麼？","correct":"B","options":[{"id":"A","text":"判任何樣品純度的唯一充分條件","explanation":"多元素混合物也可滿足此點。"},{"id":"B","text":"化合物組成的必要條件","explanation":"化合物按定義至少含兩種元素。"},{"id":"C","text":"只與樣品質量有關","explanation":"元素種類不是質量。"},{"id":"D","text":"不可能成立的敘述","explanation":"水即是例子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-S047","stem":"某樣品的「全部物質清單」只列X、Y，且明示X≠Y。哪個說法誤把兩物質改成一物質？","correct":"D","options":[{"id":"A","text":"清單有兩種化學身分","explanation":"這符合題設。"},{"id":"B","text":"X、Y可各有自己的性質","explanation":"各物質可有性質。"},{"id":"C","text":"整份可列混合物","explanation":"兩種不同物質共存可列混合物。"},{"id":"D","text":"把逗號改成加號即可成純物質","explanation":"標點運算不形成化學結合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-S048","stem":"哪組標籤可以同時用於一份經確認只含H₂O的均勻水樣？","correct":"B","options":[{"id":"A","text":"透明、必為元素","explanation":"透明不等於元素。"},{"id":"B","text":"均勻、純物質","explanation":"均勻與純是不同角度，可同時成立。"},{"id":"C","text":"均勻、必含多種物質","explanation":"均勻不要求多成分。"},{"id":"D","text":"液體、必為混合物","explanation":"液態不決定純度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-S049","stem":"分類規則規定「只准元素進入純物質類」。它會錯誤漏收哪一類？","correct":"A","options":[{"id":"A","text":"純化合物","explanation":"純物質包含化合物，規則漏掉此支。"},{"id":"B","text":"所有混合物","explanation":"排除混合物不是此規則錯處。"},{"id":"C","text":"均勻混合物","explanation":"混合物本不應列純。"},{"id":"D","text":"多成分飲料","explanation":"飲料多成分時不純。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第11頁（正式PNG第13頁）。","example":""},{"id":"G02-PURE-S050","stem":"對純水寫「是純物質，因為只有一種元素」。哪部分需要改正？","correct":"C","options":[{"id":"A","text":"只有結論","explanation":"純水為純物質的結論正確。"},{"id":"B","text":"把水改稱元素即可","explanation":"改名稱不能修正元素種類事實。"},{"id":"C","text":"理由，應依固定H₂O組成","explanation":"固定組成才支持純；水並非單元素。"},{"id":"D","text":"結論與理由全對","explanation":"水含氫氧，原理由錯。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第13頁（正式PNG第15頁）。","example":""}]},{"depth":"基礎讀","target":100,"questions":[{"id":"G02-PURE-B001","stem":"圖中橫軸為純化合物樣品質量，縱軸為其中元素A的質量。所有點代表同種純化合物且量測正確。哪種趨勢符合固定組成？","correct":"A","options":[{"id":"A","text":"通過原點且斜率固定","explanation":"固定占比使A質量隨總量等比例變化。"},{"id":"B","text":"每份A占比任意跳動","explanation":"任意變占比違反固定組成。"},{"id":"C","text":"有樣品時A質量必為零","explanation":"題設化合物含A，不可全為零。"},{"id":"D","text":"橫軸增加而A質量固定","explanation":"含A純化合物增量時A也應增加。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B002","stem":"學生用「元素A占比」對「樣品總質量」作圖。對同種含A的純化合物，將圖畫為隨總質量上升的直線，問題在哪？","correct":"B","options":[{"id":"A","text":"純物質不能畫圖","explanation":"圖表可表達組成。"},{"id":"B","text":"占比應固定，不該隨份量增加","explanation":"與元素質量不同，占比是固定比例。"},{"id":"C","text":"A一定不是元素","explanation":"題設已指定A為元素。"},{"id":"D","text":"總質量不能不同","explanation":"份量可以不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B003","stem":"已確認純X只由A、B組成，A占總質量四分之一。一張標示純X的成分圖把B畫為二分之一。應如何核對？","correct":"A","options":[{"id":"A","text":"B應占四分之三","explanation":"1−1/4=3/4。"},{"id":"B","text":"把缺的部分當空白元素","explanation":"空白不是新元素證據。"},{"id":"C","text":"改A為二分之一","explanation":"A的已知四分之一不能任改。"},{"id":"D","text":"接受，兩元素占比不用加總","explanation":"只有A、B時份額必合計1。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B004","stem":"12 g純X含A 3 g，將其無污染地均分為三份。哪組「每份總量、每份A占比」正確？","correct":"B","options":[{"id":"A","text":"3 g、1/4","explanation":"總量12/3=4 g。"},{"id":"B","text":"4 g、1/4","explanation":"每份4 g含A 1 g，占比仍1/4。"},{"id":"C","text":"4 g、1/12","explanation":"占比不是A總量除拆分後量。"},{"id":"D","text":"4 g、3/4","explanation":"A占比原為3/12。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B005","stem":"純X樣品的A質量、B質量同時變為原來兩倍，且沒有其他成分。哪項比對最能表達組成未變？","correct":"A","options":[{"id":"A","text":"A/B比值不變，總質量加倍","explanation":"共同倍增不改比例，只增加量。"},{"id":"B","text":"A質量不變，B加倍","explanation":"題設說兩者都加倍。"},{"id":"C","text":"A/B加倍，總量不變","explanation":"相同倍率在分子分母抵消。"},{"id":"D","text":"兩元素都變成同一元素","explanation":"量變不改元素身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B006","stem":"甲的A:B質量比為1:1，乙也為1:1；甲確認只有化合物X，乙確認含兩種保留身分的化合物Y、Z。何者正確？","correct":"B","options":[{"id":"A","text":"比例相同使乙也只能是X","explanation":"同元素比不保證同物質。"},{"id":"B","text":"甲純、乙混合，比值相同不能抹去物質身分差異","explanation":"題設已給完整身分，應優先據此分類。"},{"id":"C","text":"兩份都只能算元素","explanation":"多元素化合物不屬元素。"},{"id":"D","text":"甲一定混合，因有A、B","explanation":"化合物可由A、B構成且仍純。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B007","stem":"資料說「各份樣品含A都一樣多」，但各份總量不同且B含量未知。能否據此認為組成固定？","correct":"B","options":[{"id":"A","text":"能，總量永遠無關","explanation":"算占比需要總量或另一組分量。"},{"id":"B","text":"不能，須比較相對組成，不能只比A絕對量","explanation":"同A量配不同B量可有不同組成。"},{"id":"C","text":"能，A質量相同就足夠","explanation":"絕對量相同不等於占比相同。"},{"id":"D","text":"不能，所以A一定是雜質","explanation":"資料不足不支持雜質身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B008","stem":"同種純X的兩份資料列A占比「0.20」及「20%」。有人認為組成差100倍。哪項更正正確？","correct":"C","options":[{"id":"A","text":"純物質不能用百分比","explanation":"百分比可表達組成。"},{"id":"B","text":"兩筆必為不同元素","explanation":"數值格式不改元素。"},{"id":"C","text":"0.20與20%表示同一占比","explanation":"20/100=0.20，兩者一致。"},{"id":"D","text":"20%等於20","explanation":"百分比須除以100。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B009","stem":"純X已知只由A、B兩元素構成且質量比3:2。一份未知樣品報表列A 3 g、B 2 g、C 1 g，C為另一元素。哪個審核最準確？","correct":"D","options":[{"id":"A","text":"C比A少所以不需列入","explanation":"正量的C不因較少而消失。"},{"id":"B","text":"把三欄排序即可成為純X","explanation":"排序改文件，不改組成。"},{"id":"C","text":"A:B符合便可認定純X","explanation":"忽略了X不含C這項必要條件。"},{"id":"D","text":"A:B局部相符，但新增C使完整組成不符純X","explanation":"純物質組成包含全部元素及比例，不能只看其中一對。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B010","stem":"已確認樣品只有純化合物X，且X只含A與B。分析表列A 30%、B 60%，兩者為同一總質量基準。最先應指出什麼？","correct":"D","options":[{"id":"A","text":"有三種元素","explanation":"資料不一致不能直接新增元素。"},{"id":"B","text":"X必定是元素","explanation":"表錯不證明元素分類。"},{"id":"C","text":"剩下10%必定是水","explanation":"缺口身分不能硬猜。"},{"id":"D","text":"表的總和只有90%，與已知完整成分不符","explanation":"兩組分完整占比應為100%。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B011","stem":"純X有四筆密度：甲(T₁,P₁)、乙(T₁,P₂)、丙(T₂,P₁)、丁(T₂,P₂)，T₁≠T₂且P₁≠P₂。若只想比較「相同溫度、壓力不同」的結果，應採哪兩組？","correct":"D","options":[{"id":"A","text":"甲丙及乙丁","explanation":"這兩組固定P而改T。"},{"id":"B","text":"甲丁及乙丙","explanation":"兩項條件同時不同。"},{"id":"C","text":"四筆條件都相同","explanation":"兩溫度與兩壓力明示不同。"},{"id":"D","text":"甲乙及丙丁","explanation":"每組T不變而P改變，符合指定對照。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B012","stem":"同一純樣品同條件下，儀器甲、乙原先顯示不同密度；校正乙後兩值一致。現有證據最直接支持什麼？","correct":"A","options":[{"id":"A","text":"原差異可來自量測系統","explanation":"校正消除差異，支持先前量測偏差。"},{"id":"B","text":"樣品一定在校正時反應","explanation":"題設無反應證據。"},{"id":"C","text":"校正把混合物變純","explanation":"校正儀器不改變樣品組成。"},{"id":"D","text":"儀器名稱決定化學式","explanation":"儀器名稱不編碼化學式。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B013","stem":"資料庫用同一欄存純X的沸點，卻允許不同壓力測值互相覆蓋。哪種欄位設計能保留同條件比較所需資訊？","correct":"B","options":[{"id":"A","text":"只存較大的沸點","explanation":"大值不必較正確。"},{"id":"B","text":"把沸點與其測量壓力成對保存","explanation":"一筆值須連到其條件，才不造成假矛盾。"},{"id":"C","text":"只存較新的瓶子顏色","explanation":"瓶色不補物性條件。"},{"id":"D","text":"每物質只留一個不帶條件的數值","explanation":"會混掉不同適用條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B014","stem":"兩份標為純X的液體，在同溫、同壓並排除測量誤差後，密度仍顯著不同。哪項行動最有依據？","correct":"C","options":[{"id":"A","text":"更換產地名稱讓數據一致","explanation":"改名稱不改樣品。"},{"id":"B","text":"認為純物質不必有明確性質","explanation":"這違反定義中的特性要求。"},{"id":"C","text":"核對是否真為同一物質及純度","explanation":"差異需檢查身分或雜質，不應直接忽略。"},{"id":"D","text":"把兩數取平均就證明都純","explanation":"平均不能證明任一原樣純度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B015","stem":"未知樣品密度與純X相符，另已確認它含X與Y兩種未反應物質。哪項結論成立？","correct":"B","options":[{"id":"A","text":"樣品必是純X","explanation":"已確認Y存在。"},{"id":"B","text":"樣品仍是混合物，單一物性相符不足以否定Y","explanation":"分類依實際物質種類，數值偶合不改身分。"},{"id":"C","text":"密度相符推翻成分分析","explanation":"單一數值相符不能抹去成分證據。"},{"id":"D","text":"X不可能出現在混合物","explanation":"X可為混合物成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B016","stem":"兩瓶同種純液體分別10 mL及40 mL，均在相同條件下。為比較它們的特性，哪個做法正確？","correct":"B","options":[{"id":"A","text":"先認為大瓶有四種成分","explanation":"份量不決定種類。"},{"id":"B","text":"比較密度本身，不把體積倍數當密度倍數","explanation":"密度是單位體積的質量，份量差不改其同條件值。"},{"id":"C","text":"要求兩瓶含同數分子才可比較","explanation":"同種性質可在不同份量比較。"},{"id":"D","text":"把大瓶密度除以四","explanation":"密度不按樣品量作此倍數縮放。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B017","stem":"三種候選純物質的同條件資料為X：(密度d₁，沸點b₁)，Y：(d₁，b₂)，Z：(d₂，b₁)，其中d₁≠d₂、b₁≠b₂。未知純樣限為三者之一，實測(d₁，b₁)，應選誰？","correct":"C","options":[{"id":"A","text":"三者都符合","explanation":"兩項並用可排除Y、Z。"},{"id":"B","text":"Z","explanation":"Z密度不符。"},{"id":"C","text":"X","explanation":"X同時符合兩項；題設候選範圍完整。"},{"id":"D","text":"Y","explanation":"Y沸點不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B018","stem":"某單一已知純物質Q在同條件的兩次可靠測量中性質一致。這能支持可重複性，但不能直接證明哪句？","correct":"D","options":[{"id":"A","text":"可保留兩筆原始數據","explanation":"保留原數據合理。"},{"id":"B","text":"Q在此條件有可記錄性質","explanation":"資料支持此說法。"},{"id":"C","text":"這兩筆資料一致","explanation":"這是觀察。"},{"id":"D","text":"世界上所有未知樣品都純","explanation":"特定Q的證據不能外推所有樣品。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B019","stem":"自然取得的純X在低壓測量，合成純X在高壓測量。為檢查來源是否改變同種純物質特性，哪項改善最關鍵？","correct":"D","options":[{"id":"A","text":"只保留自然樣品","explanation":"單樣品無法比較來源。"},{"id":"B","text":"比較瓶上產地字數","explanation":"名稱長短無物性意義。"},{"id":"C","text":"把高壓改名低壓","explanation":"改名不改實際壓力。"},{"id":"D","text":"把兩份樣品放在相同相關條件比較","explanation":"先排除條件差異，才能討論來源主張。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B020","stem":"參照表X：(d₁,b₁)，Y：(d₁,b₂)，Z：(d₂,b₃)，d₁≠d₂。未知純樣限定為三者之一，目前只測得密度d₁。可保留哪個候選集？","correct":"C","options":[{"id":"A","text":"只X","explanation":"沒有沸點尚不能排Y。"},{"id":"B","text":"只Y","explanation":"也不能排X。"},{"id":"C","text":"X或Y","explanation":"先保留兩個密度符合者，下一特性再辨認。"},{"id":"D","text":"只Z","explanation":"Z密度不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B021","stem":"甲只有純水；乙為空氣；丙只有純NaCl。表格把甲丙都標「純物質、化合物」，乙標「混合物」。只按本節分類，需更正幾筆？","correct":"A","options":[{"id":"A","text":"0筆","explanation":"甲丙兩化合物可純，乙多氣體為混合物。"},{"id":"B","text":"3筆","explanation":"三筆皆有組成依據。"},{"id":"C","text":"2筆","explanation":"不能把兩種化合物排除純類。"},{"id":"D","text":"1筆","explanation":"沒有一筆不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B022","stem":"只在本節物質分類中，集合P為純物質，E為元素型純物質，C為化合物型純物質。「P中扣除C」剩下什麼？","correct":"B","options":[{"id":"A","text":"所有混合物","explanation":"混合物不在P中。"},{"id":"B","text":"E","explanation":"P由E與C兩支組成，扣C剩E。"},{"id":"C","text":"空集合必然成立","explanation":"P中還有元素支。"},{"id":"D","text":"所有液體","explanation":"狀態不是此集合分支。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B023","stem":"甲記「不是純物質」，乙記「不是化合物」；其餘未知。只依這兩句，哪項推論有效？","correct":"A","options":[{"id":"A","text":"甲可判混合物，乙仍可能元素或混合物","explanation":"兩個否定排除的上層範圍不同。"},{"id":"B","text":"甲乙皆必為元素","explanation":"甲已排除純元素，乙不確定。"},{"id":"C","text":"甲必為化合物","explanation":"化合物屬純物質，與甲矛盾。"},{"id":"D","text":"乙必為混合物","explanation":"乙也可能是元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B024","stem":"某樣品已確認純，但只知可分裝，不知原子種類。要分至元素或化合物，還需哪種資訊？","correct":"A","options":[{"id":"A","text":"化學組成或能否化學分解成更簡單物質","explanation":"這些是兩個純物質分支的判準。"},{"id":"B","text":"瓶數與售價","explanation":"容器與價格非分類條件。"},{"id":"C","text":"標籤是否印彩色","explanation":"印色不決定化學組成。"},{"id":"D","text":"分裝次數","explanation":"分裝不改身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B025","stem":"只採元素型純樣E、化合物型純樣C、混合物M三類。一樣品同時被標為E及M，完整分析還未提供。哪個判斷最嚴謹？","correct":"A","options":[{"id":"A","text":"至少一個標籤錯，需查實際組成才能決定哪個","explanation":"兩類互斥能判矛盾，但不能由標籤決定實物。"},{"id":"B","text":"兩標籤可同時正確","explanation":"一種純元素與多物質混合不能同時描述整份。"},{"id":"C","text":"立即選M","explanation":"同理不能先選M。"},{"id":"D","text":"立即選E","explanation":"未知組成不能選定E。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B026","stem":"模型中所有單位都已標明為同種化合物X，部分朝左、部分朝右，且只是整體旋轉。計數者把朝向分成兩種物質。哪項修正正確？","correct":"A","options":[{"id":"A","text":"依已確認身分計為一種物質，整體朝向不是新物質","explanation":"題設已排除身分差異，旋轉不改X。"},{"id":"B","text":"所有化合物必同方向才能純","explanation":"純度不要求空間朝向一致。"},{"id":"C","text":"刪除一半模型才會純","explanation":"圖示方向不構成雜質。"},{"id":"D","text":"改成兩種元素","explanation":"朝向不產生元素種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B027","stem":"同一張純化合物模型，把代表A的紅球全部改藍色，B仍用另一色且圖例同步更新，連接與身分未改。哪項結論正確？","correct":"B","options":[{"id":"A","text":"變成新元素","explanation":"配色是表徵，非元素改變。"},{"id":"B","text":"只是符號重編，分類不變","explanation":"一致更新圖例不改代表的物質。"},{"id":"C","text":"必變成混合物","explanation":"混合物需多物質共存。"},{"id":"D","text":"物質種類加一","explanation":"未增加真實身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B028","stem":"甲模型含六個已知X單位；乙模型含已知Y、Z兩種單位。兩盒原子總數碰巧相同，且Y、Z未反應。哪個資訊足以區分純度？","correct":"B","options":[{"id":"A","text":"原子總數","explanation":"總數相同仍可有不同組成方式。"},{"id":"B","text":"完整單位分別代表幾種不同物質","explanation":"甲一種X，乙兩種Y、Z。"},{"id":"C","text":"顏色深淺","explanation":"繪圖色深不是身分。"},{"id":"D","text":"盒子尺寸","explanation":"容器尺寸不決定純度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B029","stem":"一盒只有同種化合物X。要使模型明確表示混合物，哪個修改有效？","correct":"B","options":[{"id":"A","text":"讓所有X圖示放大","explanation":"畫面比例不是組成變化。"},{"id":"B","text":"加入一個已標明不同且不反應的物質Y單位","explanation":"保留X並新增Y，出現兩種身分。"},{"id":"C","text":"把X單位重新排位置","explanation":"位置不改物質種類。"},{"id":"D","text":"把盒子畫大","explanation":"盒子尺寸不改內容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B030","stem":"完整模型含X、Y、Z三種不同未反應物質。每次可移除一整種物質且不改其他種類。至少移除幾種，剩餘非空樣品才會純？","correct":"B","options":[{"id":"A","text":"1種","explanation":"剩兩種仍混合。"},{"id":"B","text":"2種","explanation":"移除兩種，剩一種。"},{"id":"C","text":"0種","explanation":"三種仍是混合物。"},{"id":"D","text":"3種","explanation":"全部移除剩空，不是非空純樣。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B031","stem":"模型同時含元素E的單位與化合物C的單位，兩者皆保留身分。分類表若寫「含一個元素類與一個化合物類」，整盒應選？","correct":"B","options":[{"id":"A","text":"化合物","explanation":"整盒還含E。"},{"id":"B","text":"混合物","explanation":"兩種不同物質並存，不因分屬不同支而變純。"},{"id":"C","text":"純物質但無法分支","explanation":"已知多物質，不能列純。"},{"id":"D","text":"元素","explanation":"整盒還含C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B032","stem":"模型裡只有X、Y兩種不同化合物，沒有任何游離元素型物質。學生說缺少元素就不算混合物。正確修正為何？","correct":"B","options":[{"id":"A","text":"只有含三種才算混合","explanation":"混合物下限為兩種物質。"},{"id":"B","text":"兩種化合物即可形成混合物","explanation":"定義不要求某成分必是元素。"},{"id":"C","text":"必為元素","explanation":"化合物不因缺游離元素而成元素。"},{"id":"D","text":"必同為一種化合物","explanation":"X、Y題設已不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B033","stem":"圖上有圓形、方形兩種符號，但未說符號代表物質身分、元素或只作標記。最適當的判讀是？","correct":"B","options":[{"id":"A","text":"兩形狀必為兩元素","explanation":"符號可能並非元素。"},{"id":"B","text":"先取得圖例，不能由形狀數直接判純度","explanation":"須知道表徵層級才能計種類。"},{"id":"C","text":"一張圖必為純樣品","explanation":"圖紙數不是化學種類。"},{"id":"D","text":"兩形狀必為兩物質","explanation":"符號也可能只是標記。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B034","stem":"同種純X來自甲、乙兩批，圖示用空心、實心圓追蹤來源，並明示皆代表X。合併後兩種符號如何理解？","correct":"C","options":[{"id":"A","text":"兩種元素","explanation":"來源不等於元素種類。"},{"id":"B","text":"符號混合使X變未知","explanation":"圖例仍明確知道X。"},{"id":"C","text":"兩個來源標記，一種化學身分","explanation":"符號差異只追蹤來源。"},{"id":"D","text":"兩種化合物","explanation":"題設皆為X。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B035","stem":"一張完整模型左半只含X，右半只含Y，X與Y不同且保留身分。若判定範圍為整張模型，哪項正確？","correct":"B","options":[{"id":"A","text":"兩區相加形成新化合物","explanation":"相鄰不等於化學結合。"},{"id":"B","text":"整體混合；各區域單獨分類不能替代整體","explanation":"分類必與指定樣品範圍一致。"},{"id":"C","text":"只選左半的分類代表全圖","explanation":"左半不能代表右半已知Y。"},{"id":"D","text":"因每半只有一種，所以整體純","explanation":"不同區域的不同身分合為多成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B036","stem":"完整模型含八個X單位與一個Y單位，已知身分不同。若只記最常見圖形，會造成什麼錯誤？","correct":"C","options":[{"id":"A","text":"把Y正確列為唯一成分","explanation":"最常見是X不是Y。"},{"id":"B","text":"讓模型真正少一種物質","explanation":"刪報告不刪實物。"},{"id":"C","text":"漏掉Y而誤把整體描述成純X","explanation":"少量Y仍是整體成分，不能忽略。"},{"id":"D","text":"把X原子變成Y","explanation":"記錄取捨不改原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B037","stem":"某純樣品全部由相同的四原子分子構成，其中每分子含A、B兩種元素。下列哪個配對正確？","correct":"C","options":[{"id":"A","text":"一種物質、元素","explanation":"含A、B兩元素不能列元素。"},{"id":"B","text":"兩種物質、混合物","explanation":"兩元素可形成一種化合物。"},{"id":"C","text":"一種物質、化合物","explanation":"完整分子身分相同且含不同元素。"},{"id":"D","text":"四種物質、元素","explanation":"四原子不等於四物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B038","stem":"兩盒都各含兩種元素，甲只含純X，乙只含另一純Y。能否僅依元素種類數相同說X=Y？","correct":"D","options":[{"id":"A","text":"不能，所以乙必為混合物","explanation":"題設已確認純Y。"},{"id":"B","text":"能，純物質只能有一種化學式","explanation":"純物質類中有許多不同物質。"},{"id":"C","text":"能，元素數是唯一身分","explanation":"同數量可對應不同化合物。"},{"id":"D","text":"不能，還要核對組成及物質身分","explanation":"種類數只是部分資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B039","stem":"圖例說每個圖符代表一百個相同X分子。畫三個相同圖符與畫六個相比，何者正確？","correct":"B","options":[{"id":"A","text":"六圖符必成混合物","explanation":"沒有第二種身分就不因數量變混合。"},{"id":"B","text":"分子總數加倍，物質種類仍一種","explanation":"300與600個X，只有數量差。"},{"id":"C","text":"兩圖代表不同元素","explanation":"題設均代表X。"},{"id":"D","text":"物質種類加倍","explanation":"種類不是圖符個數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B040","stem":"真實樣品已確認只有化合物X，模型圖例誤把其中A原子寫成「混入的物質A」。哪項修正合理？","correct":"A","options":[{"id":"A","text":"改為「構成X的A元素原子」，保留真實純樣品分類","explanation":"區分組成元素與另存物質即可修正。"},{"id":"B","text":"刪去X內所有A原子","explanation":"刪原子會改化合物身分。"},{"id":"C","text":"說所有化合物都不含元素","explanation":"化合物必有元素組成。"},{"id":"D","text":"把真樣品改判混合","explanation":"圖例錯誤不是成分分析。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第8頁（正式PNG第10頁）。","example":""},{"id":"G02-PURE-B041","stem":"同一張純NaCl模型圖的圖例規定實線表示共價鍵，虛線框只表示選取區域。圖中卻用實線把每個Na⁺、Cl⁻各連成一對。若只修正這項表徵錯誤，哪項修改合適？","correct":"D","options":[{"id":"A","text":"把兩種離子塗成同一種元素","explanation":"鈉與氯不是同一元素。"},{"id":"B","text":"把Cl⁻全刪除","explanation":"刪Cl⁻破壞NaCl組成。"},{"id":"C","text":"保留實線，另稱每對為水分子","explanation":"水分子與NaCl組成不同。"},{"id":"D","text":"移除暗示共價分子的配對實線，保留Na⁺、Cl⁻及比例","explanation":"去掉錯誤鍵型暗示，同時保留正確離子組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B042","stem":"某純NaCl晶體比另一塊大，兩者化學式都NaCl。哪項解釋正確？","correct":"C","options":[{"id":"A","text":"小晶體才可能純","explanation":"純度不由大小定。"},{"id":"B","text":"大晶體必有不同陰離子","explanation":"題設均為NaCl，未給其他離子。"},{"id":"C","text":"NaCl表達固定比例，晶體大小不另創化學式身分","explanation":"晶體中離子總數可變，比例固定。"},{"id":"D","text":"大晶體應改成Na₂Cl₂作另一物質","explanation":"以總量倍數重命名不能代表新物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B043","stem":"報告確認純NaCl晶體由Na⁺與Cl⁻構成。哪句是把組成誤寫成混合原料？","correct":"C","options":[{"id":"A","text":"NaCl有固定組成","explanation":"純NaCl固定組成。"},{"id":"B","text":"晶體是離子化合物","explanation":"這是正確描述。"},{"id":"C","text":"晶體中一定另存金屬鈉與氯氣","explanation":"離子組成不代表原料物質仍各自存在。"},{"id":"D","text":"氯化鈉含鈉與氯元素","explanation":"元素組成確如此。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B044","stem":"為避免把NaCl表示成中性原子隨意混合，來源圖例應保留哪組資訊？","correct":"A","options":[{"id":"A","text":"Na⁺、Cl⁻身分及固定比例","explanation":"離子符號和比例直接對應已審NaCl內容。"},{"id":"B","text":"只保留Na與Cl名稱","explanation":"只列名稱不充分表達帶電組成。"},{"id":"C","text":"只保留晶體外觀","explanation":"外觀不說明組成。"},{"id":"D","text":"只保留球色","explanation":"球色不交代離子身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B045","stem":"純水與純NaCl皆是一種化合物，但前者用相同分子、後者用離子比例描述。何者是兩者共同的純物質依據？","correct":"B","options":[{"id":"A","text":"兩者都只含一種元素","explanation":"兩者都含不同元素。"},{"id":"B","text":"固定化學組成與同條件明確性質","explanation":"純物質判準能涵蓋不同微觀組成形式。"},{"id":"C","text":"兩者必須同一物理狀態","explanation":"相同狀態不是純物質要求。"},{"id":"D","text":"兩者必為共價分子","explanation":"NaCl不是獨立共價分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B046","stem":"僅考組成比例：模型標明代表完整NaCl組成單位集合，共有40個Na⁺，卻只畫20個Cl⁻，無其他粒子。哪項需修正？","correct":"B","options":[{"id":"A","text":"NaCl必為混合物","explanation":"模型比例錯不能推定來源真樣品分類。"},{"id":"B","text":"Cl⁻應與Na⁺數相等，現有1:1標示不符","explanation":"NaCl要求1:1，40應對40。"},{"id":"C","text":"把Na⁺改名水","explanation":"改名字不修比例。"},{"id":"D","text":"所有圖都不能有離子","explanation":"離子正是NaCl所需表徵。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B047","stem":"甲完全只有純NaCl晶體，乙含水及溶入的NaCl。兩者都提到Na⁺、Cl⁻，何者正確？","correct":"B","options":[{"id":"A","text":"兩者都元素","explanation":"NaCl不是元素。"},{"id":"B","text":"甲純；乙為鹽水混合物，不能只按離子名稱相同判純","explanation":"同離子名稱不是完整樣品組成。"},{"id":"C","text":"兩者都必純，因同樣有離子","explanation":"乙還有水，整份不同。"},{"id":"D","text":"甲混合、乙純","explanation":"甲純NaCl，乙多成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B048","stem":"教材分別以「純水的相同分子」及「純NaCl的固定離子比例」作純物質例子。學生要求一份純樣必須同時具有這兩種構成形式。此規則會如何處理原本兩例？","correct":"A","options":[{"id":"A","text":"兩例都被錯排，因把不同例子的形式改成同時必備","explanation":"分別成立的例子，不要求每份同時滿足兩個形式。"},{"id":"B","text":"正確收入兩例","explanation":"兩例各以自己的構成形式存在。"},{"id":"C","text":"只錯排NaCl","explanation":"純水同樣未具NaCl的離子形式。"},{"id":"D","text":"只錯排水","explanation":"純NaCl同樣未具水的分子形式。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B049","stem":"資料卡寫Na⁺、Cl⁻、NaCl三個符號，其中前兩者明示是後者的組成離子，沒有其他物質。若按三符號判三成分，錯誤為何？","correct":"C","options":[{"id":"A","text":"NaCl其實是三元素","explanation":"NaCl只有鈉氯兩元素。"},{"id":"B","text":"Na⁺和Cl⁻互為同義詞","explanation":"它們是不同離子，不同義。"},{"id":"C","text":"把不同描述層次重複計為不同物質","explanation":"兩離子是NaCl組成，不是另加兩種樣品物質。"},{"id":"D","text":"所有符號都沒有化學意義","explanation":"符號有明確化學意義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B050","stem":"資料同時寫「NaCl」及「鈉離子:氯離子=2:2」。僅就比例而言，有無矛盾？","correct":"B","options":[{"id":"A","text":"有，只有1個離子才純","explanation":"總數不是純度限制。"},{"id":"B","text":"無，2:2約成1:1，但不代表獨立二聚分子","explanation":"2/2=1，與NaCl一致；不能另推分子單位。"},{"id":"C","text":"無，所以任意比例皆可","explanation":"等比例倍增不等於任意變比。"},{"id":"D","text":"有，公式必改成新物質","explanation":"整數倍比例相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；NaCl離子表徵必要補充；印刷頁 51；113–114；部分1 PDF頁 53；115–116；已審筆記頁 正文第5頁（正式PNG第07頁）。","example":""},{"id":"G02-PURE-B051","stem":"甲杯糖水的上中下比例一致；乙杯糖水也各處一致，但糖比例比甲高。哪項最完整描述兩杯？","correct":"A","options":[{"id":"A","text":"兩杯皆均勻混合物，均勻不要求兩杯配方相同","explanation":"空間一致與樣品間比例可變可以並存。"},{"id":"B","text":"兩杯都是同一純化合物","explanation":"配方與化學結合不同。"},{"id":"C","text":"甲純乙不純","explanation":"甲均勻仍有糖和水。"},{"id":"D","text":"兩杯都必分層","explanation":"均勻沒有必分層的結論。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-B052","stem":"儀器只能比較同一杯液體不同位置是否一致，無法辨認成分身分。全部測值相同時，哪項仍待確認？","correct":"D","options":[{"id":"A","text":"各位置是否相似","explanation":"這是已測項目。"},{"id":"B","text":"儀器已進行測量","explanation":"題設已完成測量。"},{"id":"C","text":"是否有觀測值","explanation":"題設已有值。"},{"id":"D","text":"樣品是否只有一種物質","explanation":"空間均勻測試不識別成分種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-B053","stem":"甲瓶純X、乙瓶純Y各均勻，X、Y不同。把「兩瓶都均勻」寫成「兩瓶都同種」，哪項駁正最直接？","correct":"D","options":[{"id":"A","text":"必須把兩瓶混合才能有身分","explanation":"各瓶本有自己的化學身分。"},{"id":"B","text":"所有均勻樣品都不純","explanation":"純樣品也可均勻。"},{"id":"C","text":"不同物質不能均勻","explanation":"均勻不是某一物質專屬。"},{"id":"D","text":"均勻描述瓶內分布，不能跨瓶確認身分相同","explanation":"兩種不同純物質都可能各自均勻。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-B054","stem":"四筆資料：甲均勻且純；乙均勻且混合；丙已知多成分卻因均勻標純；丁成分未知且均勻而標「待確認」。哪筆推論明確有錯？","correct":"B","options":[{"id":"A","text":"乙","explanation":"均勻混合物存在。"},{"id":"B","text":"丙","explanation":"已知多成分不能因均勻改純。"},{"id":"C","text":"丁","explanation":"未知成分保留待確認合理。"},{"id":"D","text":"甲","explanation":"純樣品可以均勻。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-B055","stem":"報告同時指出「沒有沉澱」及「各處透明」。作者把兩線索合起來當純度證明，合理嗎？","correct":"C","options":[{"id":"A","text":"合理，只要多列一點就充分","explanation":"證據種類比條數重要。"},{"id":"B","text":"不合理，所以樣品一定混合","explanation":"缺證據不能直接判定另一類。"},{"id":"C","text":"不合理，兩者仍未回答物質種類與固定組成","explanation":"透明均勻混合物可同時滿足兩項。"},{"id":"D","text":"合理，兩外觀條件一定充分","explanation":"多個外觀線索不一定成充分證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-B056","stem":"某混合物每批使用相同配方。後來製程允許調高P而Q不變，兩者仍保留身分。這個改配方的可能性說明什麼？","correct":"D","options":[{"id":"A","text":"P與Q都是同種元素","explanation":"物質身分不能由配方推出。"},{"id":"B","text":"固定製程等於化學式","explanation":"物理配方不等於化學式。"},{"id":"C","text":"原先每批一定全不相同","explanation":"同配方可以重複，無此結論。"},{"id":"D","text":"同配方是人為控制，並非單一化合物固有組成","explanation":"能調配而保留兩身分，符合混合物邊界。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B057","stem":"兩批產品成分清單都完整列P、Q，且P、Q為不同未反應物質。第一批少P、第二批多P。哪項不受配方改變影響？","correct":"A","options":[{"id":"A","text":"兩批均屬混合物","explanation":"只要兩種身分仍共存，皆為混合物。"},{"id":"B","text":"兩批都成純P","explanation":"Q仍存在。"},{"id":"C","text":"兩批P與Q的身分必互換","explanation":"調用量不互換化學身分。"},{"id":"D","text":"兩批所有性質必相同","explanation":"比例不同可能改變性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B058","stem":"混合物含P 20 g與Q 80 g，再加入Q 100 g，沒有反應或損失。加入後P的質量及質量百分比為何？","correct":"A","options":[{"id":"A","text":"20 g、10%","explanation":"P仍20 g，總量200 g，20/200=10%。"},{"id":"B","text":"10 g、10%","explanation":"P未被取走或反應，不應減半。"},{"id":"C","text":"20 g、20%","explanation":"分母已由100增到200 g。"},{"id":"D","text":"40 g、20%","explanation":"沒有加入P，P不會倍增。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B059","stem":"將兩種不同的純物質按一定比例混合且未反應；每種原料原本都純。產品為何不能因原料皆純就判純？","correct":"D","options":[{"id":"A","text":"純原料不能相遇","explanation":"可以混合純物質。"},{"id":"B","text":"只有原料不純才有混合物","explanation":"混合物可由純成分組成。"},{"id":"C","text":"所有混合一定反應","explanation":"題設明示未反應。"},{"id":"D","text":"產品仍有兩種不同身分，原料純度不等於產品單一成分","explanation":"純度是對整份產品的組成判斷。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B060","stem":"三樣品均含未反應的X、Y；X的質量百分比分別甲90%、乙98%、丙95%。若按X含量由高到低排序，並標整體類別，哪項正確？","correct":"A","options":[{"id":"A","text":"乙丙甲，三者皆混合物","explanation":"98>95>90，且Y皆非零。"},{"id":"B","text":"乙甲丙，只有乙純","explanation":"90低於95，乙也有Y。"},{"id":"C","text":"甲丙乙，三者皆純","explanation":"排序反向且多成分非純。"},{"id":"D","text":"丙乙甲，三者皆元素","explanation":"排序與類別都不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B061","stem":"P與Q混合後保留各自身分，但整體密度不同於純P。哪項推論合理？","correct":"C","options":[{"id":"A","text":"Q一定不是物質","explanation":"Q為已知成分。"},{"id":"B","text":"P必因密度不同而消失","explanation":"題設已保留P身分。"},{"id":"C","text":"整體性質不同不代表P已變成新物質","explanation":"整體混合物物性與成分身分是不同層次。"},{"id":"D","text":"混合物必只有P的所有數值","explanation":"混合物數值可隨比例而不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B062","stem":"甲乙都是P、Q兩物質的同配方混合物，倒在一起不反應、不污染。若以兩杯各兩成分相加說「合併後四種物質」，應如何改正？","correct":"B","options":[{"id":"A","text":"合併後變一種","explanation":"P與Q仍不同。"},{"id":"B","text":"依身分去除重複，仍只有P與Q兩種","explanation":"物質種類取不同身分的集合，不加容器份數。"},{"id":"C","text":"四種正確","explanation":"重複出現P不成新物質。"},{"id":"D","text":"合併後無物質","explanation":"物質沒有消失。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B063","stem":"某不均勻混合物已知有P、Q兩成分，不同小份取樣可能偏向一種成分。為何不能將各小份資料直接當同種純物質重複樣？","correct":"C","options":[{"id":"A","text":"只要小份夠小就必純","explanation":"小份並不必然只含一種物質。"},{"id":"B","text":"P、Q不能被取樣","explanation":"混合物可取樣。"},{"id":"C","text":"原樣已有多種身分，且各取樣可能比例不同","explanation":"缺單一物質前提與代表性。"},{"id":"D","text":"凡分裝都產生元素","explanation":"分裝不改元素身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B064","stem":"兩瓶原為純X，一瓶故意加Y，另一瓶意外混入同樣Y，均保留X、Y。只判分類，哪個結論成立？","correct":"A","options":[{"id":"A","text":"兩瓶皆混合物，加入意圖不改變成分身分","explanation":"皆有兩種保留身分的物質。"},{"id":"B","text":"故意者是化合物，意外者混合物","explanation":"意圖不能使未反應成分化學結合。"},{"id":"C","text":"依加入者的意圖定純度","explanation":"分類依樣品組成。"},{"id":"D","text":"故意者純，意外者不純","explanation":"有意添加仍是多成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B065","stem":"配方表P 60%、Q 40%，兩者為不同未反應物質。總和100%能證明什麼？","correct":"C","options":[{"id":"A","text":"只含一種物質","explanation":"表明列P、Q。"},{"id":"B","text":"必是純化合物","explanation":"配方不等於化學結合。"},{"id":"C","text":"此表占比總和完整，但產品仍是混合物","explanation":"100%說明份額完整，不能把兩成分變一種。"},{"id":"D","text":"兩種物質已失去身分","explanation":"加總操作不改物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B066","stem":"純化合物X由A、B組成，另加入純A物質且不反應。元素種類總數沒增加，純度如何變化？","correct":"A","options":[{"id":"A","text":"由一種X變為X與A兩物質混合","explanation":"另存A是不同身分，雖未新增元素仍多成分。"},{"id":"B","text":"變為純A","explanation":"X仍存在。"},{"id":"C","text":"B元素必消失","explanation":"未反應不支持B消失。"},{"id":"D","text":"仍必純，因為元素數不變","explanation":"元素數不反映物質種類數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B067","stem":"甲杯與乙杯各含同種P、Q，但比例不同；丙杯只含P。依「成分種類集合完全相同」而非「整份組成比例相同」分組，哪一組成立？","correct":"A","options":[{"id":"A","text":"甲乙同組，丙另組","explanation":"甲乙的集合皆為{P,Q}，比例另列；丙為{P}。"},{"id":"B","text":"甲丙同組，乙另組","explanation":"甲還含Q，丙沒有。"},{"id":"C","text":"三杯同組，因都含P","explanation":"共同有P不等於全部種類相同。"},{"id":"D","text":"三杯都不能列成分集合","explanation":"每杯都能依題設列出完整種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B068","stem":"某配方把P、Q共同商品名寫作「R」，仍明示P、Q不反應。只留R名稱會造成哪種判斷風險？","correct":"A","options":[{"id":"A","text":"把商品名稱的一個詞誤當單一化學身分","explanation":"命名未改變兩物質並存的事實。"},{"id":"B","text":"所有名稱必表示混合物","explanation":"純物質也有名稱。"},{"id":"C","text":"P與Q名字不能刪短","explanation":"可有簡稱，但不可混淆成分。"},{"id":"D","text":"R一定為元素符號","explanation":"商品名稱不等於元素符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B069","stem":"一系列樣品只容許互不反應的P、Q，容許其中一種份量為零。當P的質量分率由0.2、0.7增加到恰為1.0時，何處不再符合「P、Q兩成分混合物」？","correct":"D","options":[{"id":"A","text":"0.2時，P不是多數","explanation":"0.2仍有P與Q。"},{"id":"B","text":"三者皆有P、Q正量","explanation":"在1.0端點Q不再存在。"},{"id":"C","text":"0.7時，超過一半就純","explanation":"0.7仍有0.3的Q。"},{"id":"D","text":"恰1.0時，Q的份量成為零","explanation":"完整二成分帳下，Q=1−1=0，此端點只剩P。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第9頁（正式PNG第11頁）。","example":""},{"id":"G02-PURE-B070","stem":"四項觀察為「透明」「各處比例相同」「完整分析只有固定物質X」「液態」。哪幾項單獨足以支持樣品只有一種物質？","correct":"B","options":[{"id":"A","text":"四項都足夠","explanation":"不能把分布或狀態當身分證據。"},{"id":"B","text":"只有完整分析項","explanation":"第三項明確提供唯一身分，其他項未提供。"},{"id":"C","text":"透明及液態","explanation":"兩外觀狀態均不足。"},{"id":"D","text":"只有透明","explanation":"透明不識別成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第10頁（正式PNG第12頁）。","example":""},{"id":"G02-PURE-B071","stem":"甲只有完整無色照片；乙有確證P、Q兩物質。兩份都沒有「已確認純」字樣。哪份可以直接判混合？","correct":"C","options":[{"id":"A","text":"甲乙都可","explanation":"甲資訊不足。"},{"id":"B","text":"甲乙都只能判純","explanation":"乙已確定多成分。"},{"id":"C","text":"乙；甲仍缺成分資料","explanation":"乙有多身分直接證據，甲沒有。"},{"id":"D","text":"甲","explanation":"照片不能直接判混合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B072","stem":"可靠資料只說「樣品含X」。哪一項能與它並存，而不形成邏輯矛盾？","correct":"B","options":[{"id":"A","text":"樣品完全不含X","explanation":"直接否定含X。"},{"id":"B","text":"樣品還含另一物質Y","explanation":"含X不排除含Y；尚不能據含X單獨判純。"},{"id":"C","text":"樣品不是物質","explanation":"已有物質X不能說無物質。"},{"id":"D","text":"X不存在於樣品任何位置","explanation":"也直接否定存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B073","stem":"檢查同一樣品是否另含Y：方法甲只可報出Y≥1%；方法乙可報出Y≥0.01%。兩法都未報Y。對剩餘的不確定範圍，哪句合理？","correct":"D","options":[{"id":"A","text":"兩者都證明Y恰為零","explanation":"有限門檻不是精確零證據。"},{"id":"B","text":"乙只要未報，就證明X不存在","explanation":"Y的檢查不能否定X存在。"},{"id":"C","text":"甲較能排除微量Y，因1較大","explanation":"1%以下的Y甲可能看不見。"},{"id":"D","text":"乙未報仍不能保證精確零，但排除了比甲更小的可檢出含量","explanation":"較低門檻能縮小未檢出範圍，但不能把小於門檻當零。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B074","stem":"甲清單「已列全部物質：X」；乙清單「已列主要物質：X」。若資料可靠，哪項分類有足夠依據？","correct":"B","options":[{"id":"A","text":"兩份都必為元素","explanation":"X可能是化合物。"},{"id":"B","text":"甲可列純X，乙還不能排除其他成分","explanation":"全部與主要的資訊範圍不同。"},{"id":"C","text":"兩份都一定混合","explanation":"甲已只有X。"},{"id":"D","text":"乙可列純，甲不可","explanation":"乙較不完整，不能反置。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B075","stem":"樣品標「純X」，但其組成比與已知X固定比不符；分析與取樣均已確認可靠。最保守的結論為何？","correct":"B","options":[{"id":"A","text":"一定混有水","explanation":"雜質是否水沒有證據。"},{"id":"B","text":"該樣品不能維持「純X」這個身分主張，實際身分需查","explanation":"比例不符可排除此主張，不能猜具體成分。"},{"id":"C","text":"一定是純Y","explanation":"Y的身分未給。"},{"id":"D","text":"所有X都沒有固定比","explanation":"單一反證不推翻所有純X。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B076","stem":"三瓶各有一筆完整分析，內容分別為「只有X」「只有X」「X與Y共存」，但瓶號遺失且無法重建配對。現在能確認哪個結論？","correct":"B","options":[{"id":"A","text":"指定第一瓶為混合物","explanation":"沒有配對證據，不能指定。"},{"id":"B","text":"三瓶中恰有一瓶混合物，尚不能指定是哪瓶","explanation":"三筆各對應一瓶，總數可知而身分對應未知。"},{"id":"C","text":"三瓶都純X","explanation":"其中一筆明確有X與Y。"},{"id":"D","text":"第三張報表一定屬第三瓶","explanation":"報表次序不等於瓶號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B077","stem":"一盒三瓶分別為純X、純Y、純Z，三者不同且未倒在一起。「每瓶純」不表示哪件事？","correct":"C","options":[{"id":"A","text":"每瓶有自己的固定組成","explanation":"固定組成在各自身分內成立。"},{"id":"B","text":"每瓶可有明確性質","explanation":"不同純物質各有性質。"},{"id":"C","text":"三瓶都是同一種純物質","explanation":"逐瓶純不等於跨瓶同種。"},{"id":"D","text":"各瓶身分可分開記錄","explanation":"分瓶紀錄可保留差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B078","stem":"十瓶同批產品只抽驗兩瓶，這兩瓶完整分析皆純X，其餘未測。報告目前可寫哪句？","correct":"D","options":[{"id":"A","text":"另外8瓶一定不純","explanation":"未測不等於已證不純。"},{"id":"B","text":"整批沒有任何有效資訊","explanation":"已測兩瓶仍有有效資訊。"},{"id":"C","text":"十瓶全部已驗證純X","explanation":"抽驗兩瓶不是逐瓶十份證據。"},{"id":"D","text":"已驗證2瓶純X；不能用2瓶取代另外8瓶的證據","explanation":"數量及結論範圍對齊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B079","stem":"資料集的四筆都叫「樣品A」，但未記成分，且A只是測試代號。如何避免把代號當純物質證明？","correct":"B","options":[{"id":"A","text":"把A改B就成混合物","explanation":"改代號不改樣品。"},{"id":"B","text":"補實際身分及組成，代號只能定位紀錄","explanation":"試樣識別與物質識別須分開。"},{"id":"C","text":"四筆合寫一次A就純","explanation":"合併紀錄不補成分。"},{"id":"D","text":"依相同代號推同分子式","explanation":"題設代號不是化學身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B080","stem":"完整分析確定樣品只有純Q，但摘要誤填「混合物」；無其他變化。應修改哪項才與已知證據一致？","correct":"D","options":[{"id":"A","text":"給Q增加未知雜質","explanation":"不得捏造雜質。"},{"id":"B","text":"把分析資料改成兩種成分","explanation":"不能為配標籤改真實分析。"},{"id":"C","text":"把化合物一律改元素","explanation":"元素與化合物定義不同。"},{"id":"D","text":"將摘要分類更正為純物質Q","explanation":"修正錯誤摘要保留來源事實。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B081","stem":"甲→乙→丙是三份轉抄報告，丙引用乙，乙引用甲；甲僅憑透明外觀判純。引用三次能否補足純度證據？","correct":"C","options":[{"id":"A","text":"能，三份獨立純度檢驗完成","explanation":"三份轉抄非獨立檢驗。"},{"id":"B","text":"不能，所以三份一定都含Y","explanation":"缺證據不能猜Y。"},{"id":"C","text":"不能，仍缺物質身分與固定組成依據","explanation":"重複引用不是新增組成分析。"},{"id":"D","text":"能，引用會讓成分固定","explanation":"引用不改組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充
