"explanation":"C—C的兩端是同一編號球，違反兩顆不同球的規格；刪線不要求刪球。"},{"id":"B","text":"只刪A—B，仍保留3顆球","explanation":"A與B是不同編號，這條線合規。"},{"id":"C","text":"不用刪，C—C兩端字樣相同就表示兩顆C","explanation":"同一編號已指定同一顆球，重寫不創造第二個體。"},{"id":"D","text":"刪C球及所有與它相關的線，剩2顆球","explanation":"題目要求保留全部球，不能刪C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B085","stem":"假想原子連接資料只確認「A直接連B，A不直接連C」，未談B與C。候選甲為A—B—C；候選乙有A—B及A—C；候選丙只有A—B而C未連。只依已知資料如何篩選？","correct":"D","options":[{"id":"A","text":"三者都保留","explanation":"乙違反不直接連C。"},{"id":"B","text":"只保留丙","explanation":"甲同樣符合，B—C未知不代表禁止。"},{"id":"C","text":"只保留甲","explanation":"丙也符合兩個已知條件，不能排除。"},{"id":"D","text":"保留甲與丙，排除乙","explanation":"乙有被明確否定的A—C，甲丙都與已知資料相容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B086","stem":"假想資料表：甲乙組成相同但連接不同，性質值分別為5與8；丙丁組成不同，性質值都為6。哪對直接反駁「性質值不同一定要有不同組成」？","correct":"B","options":[{"id":"A","text":"丙丁","explanation":"丙丁值相同，不符合待反駁規則的前提。"},{"id":"B","text":"甲乙","explanation":"甲乙的組成相同而值不同，符合反例所需。"},{"id":"C","text":"兩對都無法提供資訊","explanation":"甲乙已提供明確反例。"},{"id":"D","text":"甲丙，因為名字不同","explanation":"名稱不同不是組成差異的資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B087","stem":"清單一把三球叫1、2、3，連1—2、2—3；清單二叫甲、乙、丙，連甲—乙、乙—丙。若要核對它們是否表示相同元素連接，除了線型還需要什麼？","correct":"D","options":[{"id":"A","text":"檔名的長短","explanation":"檔名長短不是結構資料。"},{"id":"B","text":"兩份作者的年齡","explanation":"作者年齡無助連接比對。"},{"id":"C","text":"兩張紙的顏色","explanation":"紙色不補原子身分。"},{"id":"D","text":"編號到元素種類的對照","explanation":"相同無色線型仍需知道各位置是哪種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B088","stem":"原資料寫「Each of two water molecules contains two H atoms and one O atom.」譯稿寫「兩個水分子總共含2H與1O」。需如何修正並核對總量？","correct":"A","options":[{"id":"A","text":"改為每個各含2H1O；兩個合計4H2O","explanation":"每個2H1O乘2，合計4H2O且仍是兩個完整分子。"},{"id":"B","text":"保留原譯，總量就是2H1O","explanation":"原句each修飾每一個，原譯錯把單體數當總數。"},{"id":"C","text":"改為只有其中一個分子含H","explanation":"原文說每個都含H。"},{"id":"D","text":"改為兩個分子只有兩個原子","explanation":"每個3原子，兩個合計6原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B089","stem":"兩張標籤都寫「多一個O」，但甲是以乙醇每分子1O為基準，乙沒有說相對誰。哪個處理最正確？","correct":"B","options":[{"id":"A","text":"乙的O數必比甲少","explanation":"乙的值未知，不能比較大小。"},{"id":"B","text":"甲可得每分子2O；乙需補基準","explanation":"1+1=2適用甲；乙的相對量尚無法定位。"},{"id":"C","text":"兩張都必表示每分子2O","explanation":"乙缺參照基準，不能推出確切O數。"},{"id":"D","text":"甲可得每分子0O","explanation":"多一個應加1，不是減1。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B090","stem":"只作圖形編輯，不代表真實反應。原圖有2顆H球及1顆O球，沒有C。操作甲是「把所有O標籤改C」；操作乙是「刪去目前標C的球」。先甲後乙與先乙後甲，最後球清單分別為何？","correct":"B","options":[{"id":"A","text":"兩種順序都只餘2H","explanation":"先乙時無C可刪，後續改標會留C。"},{"id":"B","text":"先甲後乙只餘2H；先乙後甲有2H、1C","explanation":"先改標再刪會刪去那顆C；先刪時原圖沒有C，之後改標就留下1C。"},{"id":"C","text":"兩種順序都有2H、1C","explanation":"先甲後乙會刪去已改標的C。"},{"id":"D","text":"先甲後乙有2H、1C；先乙後甲只餘2H","explanation":"把兩種順序的結果顛倒了。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B091","stem":"要比較乙醇與乙二醇「非H骨架上，O分別接在哪裡」。摘要甲保留C—C—O及O—C—C—O；摘要乙只保留各模型的原子總數9及10。哪份仍能回答指定連接問題？","correct":"C","options":[{"id":"A","text":"兩份都不能","explanation":"甲已有題目所需的非H連接。"},{"id":"B","text":"兩份都能","explanation":"乙缺結構資料。"},{"id":"C","text":"只有甲","explanation":"兩條骨架記下O的位置與相鄰C，能回答所問。"},{"id":"D","text":"只有乙","explanation":"總數9或10不包含連接位置。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B092","stem":"學生需要判斷一個模型內H、C、O各有多少，但取得的照片把十個不同模型全部混在同一畫面，且看不出分界。哪種補件最直接？","correct":"D","options":[{"id":"A","text":"再拍更遠的全桌照片","explanation":"更遠通常不補單一分界與細節。"},{"id":"B","text":"只提供十個模型的總售價","explanation":"售價不是組成。"},{"id":"C","text":"只提供教室面積","explanation":"教室面積也不提供模型分組。"},{"id":"D","text":"取得目標單一模型的清晰完整視圖與圖例","explanation":"题目問單一模型，資料須能分出該模型與各球種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B093","stem":"教具說明把「C」用作碳元素符號；裝盒清單另外把「C盒」當第三個盒子的管理名稱。整理者把C盒裡所有球都當碳。哪項修正正確？","correct":"C","options":[{"id":"A","text":"第三個盒子不能放O球","explanation":"盒子的管理次序不限制元素種類。"},{"id":"B","text":"把盒名去掉就表示所有原子消失","explanation":"改盒名不改粒子所指。"},{"id":"C","text":"依球自身標記或圖例判元素，盒名只識別容器","explanation":"需依明示標記的語意判讀，不能用容器代號推組成。"},{"id":"D","text":"C盒中的C必等同每顆球的元素","explanation":"同樣字母在兩種命名系統中可有不同角色。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 13_imagegen_page_06.png（正式第6頁，正文第4頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B094","stem":"核對某CO₂模型時，甲只確認「總數3」，乙檢查「1C、2O」。若成品其實是1H、2O，哪種檢查能發現這個特定錯誤？","correct":"C","options":[{"id":"A","text":"兩者都不能","explanation":"乙有足夠細節能發現。"},{"id":"B","text":"兩者都能","explanation":"甲未區分種類，不能發現該錯。"},{"id":"C","text":"只有乙","explanation":"乙會發現應有C卻出現H。"},{"id":"D","text":"只有甲","explanation":"錯誤模型也有3球，甲的總數檢查看不出。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B095","stem":"某圖有一白球連兩紅球。作者新訂圖例「白O、紅H」，並明示本圖不用課本色碼。若只檢查水的組成，哪個結論正確？","correct":"B","options":[{"id":"A","text":"因白色不是H，所以一定錯","explanation":"題目允許清楚的新約定，不能強套舊色碼。"},{"id":"B","text":"依本圖圖例是1O、2H，可符合水的組成","explanation":"新圖例明確且模型計數符合H₂O。"},{"id":"C","text":"任意圖例都不需要說明","explanation":"可變色碼仍需清晰說明，否則會有歧義。"},{"id":"D","text":"依課本習慣應強行讀1H、2O","explanation":"已明示新圖例，應依當前約定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B096","stem":"一份匿名資料確定某材料具有質量且占空間，又列出顏色，但元素資料一片空白。哪項工作已能做，哪項仍不能做？","correct":"A","options":[{"id":"A","text":"可判斷符合物質定義；不能列出確切元素組成","explanation":"定義兩條件已給，但組成資料未給。"},{"id":"B","text":"可列出所有原子；不能說它是物質","explanation":"原子資料未知，物質條件反而已確認。"},{"id":"C","text":"只能判斷它不是物質","explanation":"與兩條件已成立相反。"},{"id":"D","text":"可由顏色直接得全部連接","explanation":"顏色不唯一決定連接。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）；14_imagegen_page_07.png（正式第7頁，正文第5頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B097","stem":"假想模型原為A₂B。作者實際新增一顆B球並連入模型，但標題仍留A₂B，說明改動只是圖形裝飾。若每球都按圖例代表原子，應如何更新？","correct":"A","options":[{"id":"A","text":"改為A₂B₂，並承認組成表示已改變","explanation":"新增一B使B數由1為2，需同步組成記錄。"},{"id":"B","text":"保留A₂B，新增球不算","explanation":"圖例賦予每球原子意義，不能忽略新增球。"},{"id":"C","text":"只換標題顏色","explanation":"字色不修復原子數不一致。"},{"id":"D","text":"改為AB，因為有新連線","explanation":"增球沒有減少原有A。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B098","stem":"同一乙醇學習紀錄列「式子C₂H₆O」「每分子1個O」「兩個完整分子共有1個O」。哪兩句互相衝突？","correct":"A","options":[{"id":"A","text":"第二、三句","explanation":"每分子1O則兩分子共2O，第三句的1O錯。"},{"id":"B","text":"前兩句","explanation":"C₂H₆O正表示每分子1O，兩句相符。"},{"id":"C","text":"第一句與第二句都沒有計數資訊","explanation":"前兩句均提供單分子O數。"},{"id":"D","text":"三句都相容","explanation":"第三句與前兩句不一致。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B099","stem":"一張模型完整列C₂H₆O₂，問甲「其中O有幾個？」問乙「此物質在某條件下黏度精確多少？」只用這張模型可如何作答？","correct":"C","options":[{"id":"A","text":"兩問都可由原子總數10直接作答","explanation":"原子總數不是黏度量值。"},{"id":"B","text":"甲1；乙必為1","explanation":"原式O下標2，不是1。"},{"id":"C","text":"甲2；乙仍需相應性質資料","explanation":"原子計數可直接讀O₂，精確黏度不由模型計數直接給出。"},{"id":"D","text":"甲未知；乙必為2","explanation":"O數已知，黏度也不等於下標。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B100","stem":"最後核對一份同物質的資料：分子式提供原子數，模型提供元素與連接，觀察表提供性質。哪套檢查最完整且不越過資料？","correct":"D","options":[{"id":"A","text":"只看三個標題是否一樣","explanation":"同標題不能保證內文各欄正確。"},{"id":"B","text":"只確認字體都相同","explanation":"字體一致不是科學核對。"},{"id":"C","text":"把模型顏色當作性質表顏色，自動補空白","explanation":"模型色碼不能冒充樣品實際顏色。"},{"id":"D","text":"核對組成相符、連接有依據、性質有對應觀察","explanation":"三類資料各有功能，需核對內容一致與各自依據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"central-0-1-ch1-sec1-1-topic02","title":"1.1-02 為什麼要學化學","version":"B01-G02-v1-10109a3947edc629","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.1 化學研究"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-S001","stem":"研究團隊發現原先使用的材料可能傷害環境，因此提出重新評估。這項發現對化學的社會角色有何意義？","correct":"A","options":[{"id":"A","text":"辨認負面影響也是化學提供的重要資訊","explanation":"找出危害可幫助公民與消費者判斷用途。"},{"id":"B","text":"只有做出新商品才算化學貢獻","explanation":"化學也測量、建模並研究影響。"},{"id":"C","text":"發現危害表示化學沒有研究價值","explanation":"負面資訊有助形成平衡判斷。"},{"id":"D","text":"既然有危害就不用再了解用途","explanation":"平衡觀點仍需考慮正面與負面影響。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正式PNG第05頁／正文第3頁。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-S002","stem":"社區希望「改善健康」，化學小組負責研究所用材料的性質。這兩項描述各在說什麼？","correct":"B","options":[{"id":"A","text":"有社會目標就不能是化學研究","explanation":"教材將健康照護列為化學相關公共議題。"},{"id":"B","text":"前者是社會目標，後者是化學可提供的研究工作","explanation":"公共目標與具體材料研究可互相連結。"},{"id":"C","text":"前者是物質名稱，後者是政府名稱","explanation":"健康目標不是物質，材料研究也不是機關。"},{"id":"D","text":"兩者都是同一種產品的商品名","explanation":"題幹沒有提供商品名稱。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正式PNG03與08／正文01與06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-S013","stem":"一位學生因工程課程要求修化學，另一位因對周遭材料好奇而修課。哪個描述符合教材？","correct":"A","options":[{"id":"A","text":"課程需求與理解物質世界都可成為學習理由","explanation":"本節同時討論課程與材料世界。"},{"id":"B","text":"只有前者才有正當理由","explanation":"理解周遭材料也是本節目的。"},{"id":"C","text":"只有後者才可能學會化學","explanation":"教材沒有此種限制。"},{"id":"D","text":"兩者都必須先轉成化學主修","explanation":"本節明列多種主修。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正式PNG第06頁／正文第4頁。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S101","stem":"報告只確認某材料對河川有負面影響，尚未研究人體接觸。哪句摘要最忠實？","correct":"A","options":[{"id":"A","text":"已確認一項環境問題，人體影響仍需資料","explanation":"環境與健康都是本節關心的面向，但結果不能互相代填。"},{"id":"B","text":"已證明所有接觸者都會生病","explanation":"把環境結果擴為人體結果。"},{"id":"C","text":"既未研究人體，就不算發現任何問題","explanation":"忽略已有的環境資訊。"},{"id":"D","text":"人體未研究等於環境結果無效","explanation":"兩項研究問題不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S102","stem":"計畫封面寫「希望改善能源供應」，尚未有研究結果。這句最適合放在哪欄？","correct":"B","options":[{"id":"A","text":"已完成的安全結論","explanation":"能源目標不提供安全資料。"},{"id":"B","text":"計畫目標","explanation":"希望達成的公共效果是目標。"},{"id":"C","text":"已驗證的材料性質","explanation":"封面未提供測量。"},{"id":"D","text":"已達成的能源改善","explanation":"願景不等於成果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S103","stem":"課本列出塑膠和建材等化學成果。有人說「清單沒寫某種新包裝，所以新包裝一定與化學無關」。問題在哪裡？","correct":"C","options":[{"id":"A","text":"錯在所有包裝都必須叫建材","explanation":"用途名稱不必相同。"},{"id":"B","text":"沒有問題，教材舉例必定涵蓋所有產品","explanation":"來源沒有窮盡所有產品的宣告。"},{"id":"C","text":"把舉例誤當成完整排除名單","explanation":"列舉例子不保證列完所有相關物品。"},{"id":"D","text":"錯在塑膠不能列為化學成果","explanation":"塑膠正是教材例子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S104","stem":"客戶問某材料適合哪些用途，服務人員手上只有出貨日期。最需要向團隊取得哪種資訊？","correct":"D","options":[{"id":"A","text":"另一份相同出貨日期表","explanation":"重複日期仍回答不了用途。"},{"id":"B","text":"公司大樓的樓層表","explanation":"不是材料資訊。"},{"id":"C","text":"把日期欄改名為用途","explanation":"改欄名不補足內容。"},{"id":"D","text":"材料性質與適用用途的說明","explanation":"服務要幫顧客理解產品的使用。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S105","stem":"桌上有兩份不同材料及一張未標樣品的測量表。要把數據用於其中一份材料，首先缺什麼？","correct":"A","options":[{"id":"A","text":"數據與樣品的對照關係","explanation":"不知道測的是哪份材料，就不能可靠歸屬。"},{"id":"B","text":"把表格印成彩色","explanation":"顏色不建立樣品對照。"},{"id":"C","text":"把兩份材料取同一個名字","explanation":"同名不等於同一份樣品。"},{"id":"D","text":"任選一份即可","explanation":"任意配對會改寫測量對象。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S106","stem":"工程與藥學學生一起討論材料性質，化學基礎最直接能提供什麼？","correct":"B","options":[{"id":"A","text":"自動授予兩種專業資格","explanation":"學習基礎與取得職業資格不同。"},{"id":"B","text":"討論物質問題的共通原理","explanation":"共同基礎有助不同專業理解材料資訊。"},{"id":"C","text":"保證兩人的專業判斷永遠相同","explanation":"共通原理不是一致結論的保證。"},{"id":"D","text":"讓兩人免讀實際材料資料","explanation":"基礎知識不能取代具體資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG06／正文04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S107","stem":"評估報告的結論限定「在用途甲下」。引用時最應保留哪項文字？","correct":"C","options":[{"id":"A","text":"完全不需再評估","explanation":"限定用途的結果不保證所有情境。"},{"id":"B","text":"只保留材料商品名","explanation":"商品名不能代替適用範圍。"},{"id":"C","text":"用途甲這個適用範圍","explanation":"刪掉範圍會擴大原結論。"},{"id":"D","text":"任何用途都相同","explanation":"這是報告未給的概括。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S108","stem":"紀錄甲寫「樣品出現某性質」，紀錄乙寫「模型提出該性質的原因」。乙主要增加哪類內容？","correct":"D","options":[{"id":"A","text":"另一份材料已製成的證據","explanation":"原因說明不是製造紀錄。"},{"id":"B","text":"顧客已購買的證據","explanation":"題幹未提供交易。"},{"id":"C","text":"直接取消甲的觀察","explanation":"解釋觀察不等於刪除觀察。"},{"id":"D","text":"對觀察的解釋","explanation":"模型可用來說明已見的性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S109","stem":"顧客需要一種現有產品尚不具備的性質，而現有產品符合原規格。這項意見最直接可成為什麼？","correct":"A","options":[{"id":"A","text":"新產品或改良產品的研發需求","explanation":"現有品管合格與新需求未滿足可以並存。"},{"id":"B","text":"原產品必然檢驗造假的證據","explanation":"新需求不同，不代表原檢驗失實。"},{"id":"C","text":"所有服務都應停止的理由","explanation":"服務可把需求傳給研發。"},{"id":"D","text":"已完成新材料製造的紀錄","explanation":"提出需求還沒做出材料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S110","stem":"材料計畫同時以改善治療用品與降低廢棄物為目標。能否在簡介中同時提健康與環境？","correct":"B","options":[{"id":"A","text":"可以，所以兩個目標都已達成","explanation":"目標被列出不代表已有成果。"},{"id":"B","text":"可以，公共目標可以有多個","explanation":"本節的公共議題不是互斥的格子。"},{"id":"C","text":"不行，健康與環境一定互相排斥","explanation":"來源沒有這種排斥要求。"},{"id":"D","text":"不行，化學計畫只能有一個受益者","explanation":"本節未限制受益者數量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S111","stem":"教材以經特殊處理的矽說明太陽能板。僅依這句，能把整個發電設施的每個零件都判成矽嗎？","correct":"C","options":[{"id":"A","text":"不能，所以矽與太陽能板沒有關聯","explanation":"否定過度概括不取消已知連結。"},{"id":"B","text":"能，只要用途相同材料就相同","explanation":"用途不決定所有材料。"},{"id":"C","text":"不能，例子中的材料資訊不等於所有零件清單","explanation":"不能由板材例子推到設施全部組件。"},{"id":"D","text":"能，電線和支架也已逐一被確認","explanation":"來源未逐一列出。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S112","stem":"分析員把材料性質報告交給服務人員，服務人員據此說明用途。哪個描述最合適？","correct":"D","options":[{"id":"A","text":"一份報告被服務使用後就不再是分析結果","explanation":"使用目的不抹除資料來源。"},{"id":"B","text":"服務人員必須親自重新製造所有材料","explanation":"本節未設此要求。"},{"id":"C","text":"分析與服務不能有任何資訊往來","explanation":"這不符工作合作的情境。"},{"id":"D","text":"分析結果可支援產品服務","explanation":"不同產業工作可以透過資料合作。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S113","stem":"材料評估分別記錄「使用者的好處」與「周遭環境的影響」。整理時為何不宜把兩欄合成一句「大家都受益」？","correct":"A","options":[{"id":"A","text":"兩欄描述不同對象，且未必都是正面結果","explanation":"不同面向需要各自保留。"},{"id":"B","text":"因為使用者不可能受到任何影響","explanation":"使用者正是評估對象之一。"},{"id":"C","text":"因為環境資訊沒有公共價值","explanation":"環境保護是本節公共議題。"},{"id":"D","text":"只要把表格合併就會增加證據","explanation":"排版不會新增資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S114","stem":"研究者保留舊模型與修訂模型，兩者對同一材料的預測不同。報告只寫「模型預測如下」，最應補哪項？","correct":"B","options":[{"id":"A","text":"只加上字體名稱","explanation":"字體不能識別產生預測的模型。"},{"id":"B","text":"使用的是哪一版模型","explanation":"不同模型版本可能給不同預測，需定位來源。"},{"id":"C","text":"把兩版名稱都刪除","explanation":"會更難追溯預測。"},{"id":"D","text":"把其中一版稱為實際材料","explanation":"模型不是材料本身。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S115","stem":"教材說化學訓練可為專利法相關職涯做準備。這裡的「做準備」最合理指什麼？","correct":"C","options":[{"id":"A","text":"不必再學任何相關專業","explanation":"準備不等於所有訓練都已完成。"},{"id":"B","text":"每位化學工作者都必須改行","explanation":"可能方向不是必走路線。"},{"id":"C","text":"化學知識可能有助理解相關技術問題","explanation":"背景的幫助不等於直接取得任職資格。"},{"id":"D","text":"學位本身保證每件專利核准","explanation":"教材沒有這種結果保證。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S116","stem":"包裝上只寫「清潔用品」。若要知道某件產品的實際使用方式，還需什麼？","correct":"D","options":[{"id":"A","text":"把它歸為日用品就足夠","explanation":"常見物品仍有具體使用資訊。"},{"id":"B","text":"引用所有化學品一律同用法","explanation":"來源未給此規則。"},{"id":"C","text":"只確認瓶子能否站立","explanation":"外觀不能回答完整使用方式。"},{"id":"D","text":"該產品的具體使用資訊","explanation":"類別名稱不是完整使用方法。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49、50；部分1 PDF頁 51、52；已審筆記頁 PNG10／正文08；PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S117","stem":"兩方案生產的材料數量不同，僅比較原料總用量，能直接判斷哪個較節省每件產品的原料嗎？","correct":"A","options":[{"id":"A","text":"不能，還要對齊產品數量這個比較基準","explanation":"總用量與每件用量不同。"},{"id":"B","text":"能，總量較大一定較浪費","explanation":"可能只是生產更多。"},{"id":"C","text":"能，產量資料與資源判斷永遠無關","explanation":"題目問每件用量，產量正是必要資訊。"},{"id":"D","text":"不能，所以所有原料資料都沒用","explanation":"總量仍有用途，只是不足以回答此問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S118","stem":"性質表只列數字「12」，沒有說量的是什麼性質。哪個補充最先使它成為可理解的材料資料？","correct":"B","options":[{"id":"A","text":"寫上研究者喜歡這個數字","explanation":"喜好不說明量測內容。"},{"id":"B","text":"測量的性質名稱及相應單位或描述尺度","explanation":"需知道數字代表何種量測內容。"},{"id":"C","text":"把數字複製三次","explanation":"複製不補意義。"},{"id":"D","text":"把12改成120","explanation":"任意改值更不可靠。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S119","stem":"評估已說明使用利益，討論時發現還未研究使用後的環境影響。下一步最直接應補哪項？","correct":"C","options":[{"id":"A","text":"把未知環境影響當成零","explanation":"未知不等於無影響。"},{"id":"B","text":"宣布使用利益自動回答使用後的問題","explanation":"不同階段的問題不能自動互代。"},{"id":"C","text":"針對這個未評估面向取得資料","explanation":"補資料才能擴充對影響的理解。"},{"id":"D","text":"再重印一次原利益表","explanation":"不能補上新面向。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S120","stem":"品管任務要檢查性質甲，報告卻只測性質乙。即使乙的資料正確，能否直接說甲的任務已完成？","correct":"D","options":[{"id":"A","text":"能，只要報告有數字即可","explanation":"數字存在不是回應問題的充分條件。"},{"id":"B","text":"能，甲乙名稱不同但必定同一性質","explanation":"沒有這種等同依據。"},{"id":"C","text":"不能，所以乙的測量必然是假資料","explanation":"不相關不等於失實。"},{"id":"D","text":"不能，正確資料仍須回應指定性質","explanation":"測了別項不等於測了要求的項目。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S121","stem":"學生把螢火蟲發光放在「自然」，OLED放在「人造」，再把「自然」整欄劃成與化學無關。應修正哪一步？","correct":"A","options":[{"id":"A","text":"把自然來源當成排除化學的條件","explanation":"教材同時用天然生物反應與科技例子說明化學。"},{"id":"B","text":"把OLED列為科技","explanation":"這符合圖例。"},{"id":"C","text":"承認螢火蟲是生物","explanation":"這沒有問題。"},{"id":"D","text":"使用兩個例子作比較","explanation":"比較本身不是錯誤。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S122","stem":"某模型要求輸入材料的實測性質，但這一欄尚未測量。最妥當的紀錄是什麼？","correct":"B","options":[{"id":"A","text":"把空欄刪掉就表示輸入完整","explanation":"刪欄不補資料。"},{"id":"B","text":"所需輸入尚缺，須取得資料或明示假設","explanation":"不能把任意填值寫成實測。"},{"id":"C","text":"先填猜測值並標成已測量","explanation":"混淆假設與實測。"},{"id":"D","text":"只要模型存在，缺值會自動變成資料","explanation":"模型不能自動提供未做的測量紀錄。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S123","stem":"顧客說「昨天用的那批材料表現不符需求」。要讓分析員查驗，最需要先取得哪項資訊？","correct":"C","options":[{"id":"A","text":"把所有歷史批次混成一份","explanation":"可能丟失問題批次資訊。"},{"id":"B","text":"只記一句產品不好","explanation":"未說明哪批與哪項表現。"},{"id":"C","text":"可辨認的批次或樣品及不符的性質","explanation":"需要定位材料與待查問題。"},{"id":"D","text":"另一位顧客的姓名","explanation":"不能定位這批材料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S124","stem":"新的可靠資料顯示先前漏看的負面影響。依平衡觀點，重新考慮原用途評估是否合理？","correct":"D","options":[{"id":"A","text":"不合理，首次判斷必須永不改變","explanation":"來源未要求固守首次判斷。"},{"id":"B","text":"不合理，只能新增有利資料","explanation":"會偏向單一面向。"},{"id":"C","text":"合理，所以所有舊資料都必須作廢","explanation":"新資訊不必否定所有舊資料。"},{"id":"D","text":"合理，判斷應納入新的相關影響資訊","explanation":"平衡是理解影響，不是永遠維持原結論。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S125","stem":"農業與地質都使用化學原理，但一個研究農業材料，另一個研究地質材料。何者可同時成立？","correct":"A","options":[{"id":"A","text":"共用基本原理，而研究對象與目的不同","explanation":"化學基礎可支援不同專業問題。"},{"id":"B","text":"共用原理就必須研究同一份樣品","explanation":"來源未要求相同樣品。"},{"id":"C","text":"對象不同表示不能使用任何共同原理","explanation":"不同領域仍可共享基礎。"},{"id":"D","text":"只能把其中一個改名為化學系","explanation":"學科名稱不決定能否使用原理。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG06／正文04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S126","stem":"材料圖表的圖例寫「虛線：模型預測；圓點：實際測量」。想讀取測量資料，應看哪一項？","correct":"B","options":[{"id":"A","text":"任意交換兩種標記","explanation":"會改變原圖意義。"},{"id":"B","text":"圓點","explanation":"圖例直接標出資料的取得方式。"},{"id":"C","text":"所有虛線","explanation":"虛線代表預測。"},{"id":"D","text":"只選畫得最平滑的部分","explanation":"平滑程度不決定資料來源。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S127","stem":"文章記錄某材料帶來正面用途，作者卻說「既然是好處，就不能叫化學物質的影響」。應如何判斷？","correct":"C","options":[{"id":"A","text":"正確，藥品用途不屬化學影響","explanation":"藥品正是化學成果例子。"},{"id":"B","text":"錯誤，因此所有影響必定是好處","explanation":"又反向忽略負面影響。"},{"id":"C","text":"影響可以是正面，也可以是負面","explanation":"本節明確討論兩種影響。"},{"id":"D","text":"正確，影響只能表示傷害","explanation":"把中性的影響一詞縮成危害。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S128","stem":"顧客提出新用途需求，但過去測量紀錄仍正確。哪個更新最直接回應新資訊？","correct":"D","options":[{"id":"A","text":"改寫舊測量值讓它剛好符合需求","explanation":"會把需求混入實際數據。"},{"id":"B","text":"把過去所有材料改標為新發明","explanation":"新需求不改寫歷史。"},{"id":"C","text":"刪除顧客需求避免改動","explanation":"會失去服務與研發所需資訊。"},{"id":"D","text":"更新需求說明並評估是否需新研發","explanation":"新需求先改變要達成的目標。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S129","stem":"同一樣品有「明天預定測量」與「昨天完成測量」兩份紀錄。要引用已取得的結果，應先確認什麼？","correct":"A","options":[{"id":"A","text":"完成紀錄中的實際結果與樣品對照","explanation":"計畫與完成紀錄不能混用。"},{"id":"B","text":"挑日期較晚的檔案就一定有結果","explanation":"未來計畫可能較新但尚未執行。"},{"id":"C","text":"只保留「測量」兩字","explanation":"會丟失完成與否的資訊。"},{"id":"D","text":"把預定日期寫成完成日期","explanation":"這會造成立即執行的假紀錄。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S130","stem":"教材說OLED可用於高階手機、平板與電視顯示器。下列哪個推論超出了這段例子？","correct":"B","options":[{"id":"A","text":"本段在介紹裝置用途","explanation":"符合段落內容。"},{"id":"B","text":"OLED只能出現在這三種設備中","explanation":"列出應用例子不等於排除所有其他應用。"},{"id":"C","text":"OLED與顯示科技有連結","explanation":"例子直接支持。"},{"id":"D","text":"手機顯示可涉及化學材料","explanation":"此例提供連結。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S131","stem":"同一工廠表格有「原料使用量」與「廢物去向」。研究資源使用和研究環境問題的人，是否一定只讀同一欄？","correct":"C","options":[{"id":"A","text":"一定，廢物去向能替代原料量","explanation":"兩欄不等價。"},{"id":"B","text":"不一定，所以其中一人與化學無關","explanation":"本節兩個公共議題都與化學有關。"},{"id":"C","text":"不一定，兩個問題需要的資料重點不同","explanation":"公共目標不同，資料用途可以不同。"},{"id":"D","text":"一定，所有化學問題只用原料量","explanation":"會漏掉環境去向資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG03／正文01；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S132","stem":"分析儀器沒有產生可用讀值。僅依這件事，最妥當的記錄是什麼？","correct":"D","options":[{"id":"A","text":"樣品一定不存在","explanation":"工具無輸出不證明樣品不存在。"},{"id":"B","text":"該性質的數值一定是零","explanation":"沒有資料不等於測得零。"},{"id":"C","text":"模型已經被證明正確","explanation":"題幹未比較模型與資料。"},{"id":"D","text":"此次沒有取得可用的性質資料","explanation":"無讀值不能直接代寫物質性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S133","stem":"品管規則要求材料具有指定外觀，分析員如實記錄外觀是否符合。這能否屬於材料分析的品質控制？","correct":"A","options":[{"id":"A","text":"能，材料性質也可用清楚的定性要求描述","explanation":"本節未把品管限於數字公式。"},{"id":"B","text":"不能，沒有計算就沒有任何分析","explanation":"定性資料仍可回應性質要求。"},{"id":"C","text":"不能，外觀只能由銷售額決定","explanation":"銷售額不決定觀察外觀。"},{"id":"D","text":"能，因此不需要明確規則","explanation":"仍需知道要對照何種要求。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S134","stem":"跨域小組要閱讀新材料的性質說明。哪種準備最直接符合本節學化學的理由？","correct":"B","options":[{"id":"A","text":"先假定所有材料都一樣","explanation":"會抹除實際材料問題。"},{"id":"B","text":"學習理解物質性質所需的基本原理","explanation":"能支援對周遭材料的理解。"},{"id":"C","text":"只記住參與者的系名","explanation":"系名不能解讀材料性質。"},{"id":"D","text":"只背所有產品售價","explanation":"價格不代替性質原理。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG06／正文04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S135","stem":"有人主張「每種新材料都只會改善生活」，一個有負面影響的案例對這句話有何作用？","correct":"C","options":[{"id":"A","text":"證明不應再研究材料","explanation":"反例不取消研究價值。"},{"id":"B","text":"完全無關，因負面影響不屬化學","explanation":"負面影響也是本節內容。"},{"id":"C","text":"足以指出「每種都只會」這種說法過強","explanation":"有負面案例就不能維持全體純正面主張。"},{"id":"D","text":"證明任何材料都沒有好處","explanation":"一個反例不能推出全體相反。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S136","stem":"分析員把既有材料測量值輸入電腦歸檔，沒有建立解釋或預測方法。僅此步驟能否稱為發展模型？","correct":"D","options":[{"id":"A","text":"能，使用任何電腦就是建模","explanation":"工具名稱不決定活動功能。"},{"id":"B","text":"能，數據一輸入就變成新物質","explanation":"資料輸入不是物質製造。"},{"id":"C","text":"不能，所以原測量值不再有效","explanation":"歸檔活動不取消資料本身。"},{"id":"D","text":"不能直接如此判定，歸檔不等於建立解釋或預測模型","explanation":"要依實際工作的功能辨別。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S137","stem":"包裝甲較輕，包裝乙在另一項性質表現不同。若要判斷哪個更適合某項使用任務，首先要明確什麼？","correct":"A","options":[{"id":"A","text":"要完成的用途及所需性質","explanation":"適合與否需對應使用需求。"},{"id":"B","text":"只看哪個名稱較短","explanation":"名稱不決定所需性質。"},{"id":"C","text":"所有包裝都必須有完全相同用途","explanation":"本節沒有此限制。"},{"id":"D","text":"先刪掉使用要求","explanation":"會失去比較基準。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49、50；部分1 PDF頁 51、52；已審筆記頁 PNG10／正文08；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S138","stem":"團隊已完成新材料研究，但產品還沒上市。能否僅因尚未銷售，就說完全沒有研發成果？","correct":"B","options":[{"id":"A","text":"能，只要沒包裝就不能研究性質","explanation":"包裝狀態不決定能否研究。"},{"id":"B","text":"不能，研究成果與上市銷售是不同狀態","explanation":"本節將研發與銷售列為不同工作。"},{"id":"C","text":"能，任何研究都以收款才開始存在","explanation":"收款不是研究存在的必要條件。"},{"id":"D","text":"不能，所以上市和服務已自動完成","explanation":"研究完成不代表後續工作完成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S139","stem":"報告標題寫「健康與環境評估」，內文卻只有健康資料。哪個核對最直接？","correct":"C","options":[{"id":"A","text":"把健康資料複製到環境欄","explanation":"複製不等於新研究。"},{"id":"B","text":"改成更大的字體","explanation":"不會補上環境資訊。"},{"id":"C","text":"檢查環境面向是否實際有資料","explanation":"標題不保證內容已涵蓋所有面向。"},{"id":"D","text":"只看標題夠長就通過","explanation":"長度不能代替內容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S140","stem":"模型組請量測組檢查一項預測。哪份交接最有用？","correct":"D","options":[{"id":"A","text":"只有模型的美術封面","explanation":"不能知道要測什麼。"},{"id":"B","text":"只有會議出席者名單","explanation":"名單不是預測內容。"},{"id":"C","text":"一句「本模型很好」","explanation":"稱讚不提供可檢查的主張。"},{"id":"D","text":"材料對象、預測的性質及適用條件","explanation":"量測需知道要對哪項主張取得資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S141","stem":"圖例列有OLED和螢火蟲，但沒有亮度資料。若要比較兩者亮度，缺少什麼？","correct":"A","options":[{"id":"A","text":"在明確比較條件下的相關量測","explanation":"用途例子沒有提供亮度大小。"},{"id":"B","text":"把圖例上下位置交換","explanation":"位置不提供亮度數據。"},{"id":"C","text":"判定名稱較長者較亮","explanation":"名稱與亮度無此關係。"},{"id":"D","text":"只確認兩者都與化學有關","explanation":"共同領域不給亮度比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG04、06／正文02、04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S142","stem":"研究確認新方式減少原料使用，其他公共目標尚未評估。成果報告最應如何表達？","correct":"B","options":[{"id":"A","text":"既有一項改善就不必了解其他影響","explanation":"一項成果不取代其他面向評估。"},{"id":"B","text":"已確認資源使用方面的改善","explanation":"保留實際有資料的成效範圍。"},{"id":"C","text":"健康與能源都已同步改善","explanation":"題幹未提供那些結果。"},{"id":"D","text":"任何公共目標都完全沒成果","explanation":"忽略已知資源成果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S143","stem":"材料的多次觀察已整理成表，但尚未提出為何如此的說明。若下一步要解釋這些性質，最直接需要哪項工作？","correct":"C","options":[{"id":"A","text":"把表格複製數份","explanation":"複製不增加原因說明。"},{"id":"B","text":"直接宣稱所有原因都已知道","explanation":"沒有提出相應模型或說明。"},{"id":"C","text":"發展能說明性質的模型","explanation":"資料整理與解釋原因是不同工作。"},{"id":"D","text":"只更換表格顏色","explanation":"顏色不提供解釋。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S144","stem":"分析員受託測量客戶的材料，材料所有權仍屬客戶。這是否妨礙它成為化學測量工作？","correct":"D","options":[{"id":"A","text":"妨礙，只有自己擁有的材料才能測","explanation":"來源未設此條件。"},{"id":"B","text":"不妨礙，因此分析員已製造該材料","explanation":"測量仍不等於製造。"},{"id":"C","text":"妨礙，客戶材料必定沒有性質","explanation":"材料來源不取消其性質。"},{"id":"D","text":"不妨礙，活動本身在測量物質性質","explanation":"所有權不改變所做的工作。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S145","stem":"課堂稱某材料「有用」，又討論它可能帶來的負面影響。這裡的有用最合理表示什麼？","correct":"A","options":[{"id":"A","text":"能達成某些有價值的用途","explanation":"不表示所有影響都是正面。"},{"id":"B","text":"在任何條件下都完全無害","explanation":"超過有用一詞能支持的範圍。"},{"id":"C","text":"所有人都必須使用它","explanation":"用途價值不等於普遍使用命令。"},{"id":"D","text":"已研究完一切性質","explanation":"有用不等於研究完整。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S146","stem":"同一人白天用化學知識讀材料報告，購物時用它理解產品影響。兩種使用方式有何關係？","correct":"B","options":[{"id":"A","text":"只有收取薪資時才算使用知識","explanation":"用途不由是否收薪決定。"},{"id":"B","text":"分別服務工作與消費判斷，兩者都可能受益","explanation":"本節涵蓋專業與公民消費者的需求。"},{"id":"C","text":"購物時知識一定失效","explanation":"知識用途不限工作場所。"},{"id":"D","text":"讀報告必然讓每次購物都不用查資料","explanation":"仍需具體產品資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG06／正文04；PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-S147","stem":"研究展同時陳列材料樣品、性質資料和模型說明。若統計「新製造材料件數」，能把三者全算成材料嗎？","correct":"C","options":[{"id":"A","text":"不能，所以資料和模型都沒有價值","explanation":"不能計入某類件數不代表沒價值。"},{"id":"B","text":"能，只要把三者貼相同標籤","explanation":"標籤不能改變成果種類。"},{"id":"C","text":"不能，資料與模型有價值，但不是新製造材料件數","explanation":"需按所統計的成果類型計數。"},{"id":"D","text":"能，任何研究成果都等同物質製造","explanation":"混淆不同根本工作。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B101","stem":"假設兩方法產出相同用途、相同品質的材料。甲耗原料30單位，得10件；乙耗40單位，得20件。只比較每件產品原料用量，何者較省？","correct":"D","options":[{"id":"A","text":"甲，因30小於40","explanation":"只比較總量，忽略產出數。"},{"id":"B","text":"兩者相同，因都是製造材料","explanation":"相同工作類別不代表原料效率相同。"},{"id":"C","text":"乙，且已證明所有環境影響都較小","explanation":"表內沒有所有環境影響資料。"},{"id":"D","text":"乙，每件2單位，甲每件3單位","explanation":"40÷20=2；30÷10=3，須對齊每件基準。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B102","stem":"同品質材料去年用原料100單位做100件，今年用150單位做200件。哪句同時正確描述資源資料？","correct":"A","options":[{"id":"A","text":"總用量增加，但每件用量由1降為0.75","explanation":"總量和單位產品用量可以呈不同方向。"},{"id":"B","text":"總量與每件用量都增加","explanation":"今年每件150÷200=0.75，小於1。"},{"id":"C","text":"總量與每件用量都下降","explanation":"150大於100，總量未下降。"},{"id":"D","text":"每件用量下降，所以總量必為75","explanation":"0.75是每件，不是全年總量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B103","stem":"某包裝在使用中有已確認的好處，棄置後的環境影響尚無資料。四份報告中哪份最忠實？","correct":"B","options":[{"id":"A","text":"把使用中資料複製到棄置後欄，表示兩階段完成","explanation":"複製不是取得該階段資訊。"},{"id":"B","text":"保留使用中的好處，將棄置後影響列為待研究","explanation":"兩階段需分開，不用未知抹除已知，也不將已知擴大全程。"},{"id":"C","text":"使用中有好處，因此全生命週期已安全","explanation":"資料未覆蓋棄置階段。"},{"id":"D","text":"棄置後未知，因此使用中的好處也一定是假","explanation":"未知不直接否定另一階段結果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B104","stem":"甲報告的「8」代表材料性質X，乙報告的「8」代表性質Y；兩性質並未被定義為相同。能否把兩筆合成「X有兩次相同結果」？","correct":"C","options":[{"id":"A","text":"不能，因此兩個8都必定量錯","explanation":"不同量測項目可有相同數字。"},{"id":"B","text":"能，只要把Y欄標題改為X","explanation":"改標會扭曲原紀錄。"},{"id":"C","text":"不能，只有甲這筆明示測X","explanation":"數字相等不改變測量對象。"},{"id":"D","text":"能，兩個8自然是兩次X測量","explanation":"忽略性質欄位。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B105","stem":"一份材料報告含「是否達出貨規格」「可用的情境」「待改良的性質」。品管要判出貨，服務要解說使用，研發要找改良方向。哪種交接最合理？","correct":"D","options":[{"id":"A","text":"三人都只收到材料名稱","explanation":"名稱不足以回答三種問題。"},{"id":"B","text":"只把使用情境交給品管，便視為所有規格已檢查","explanation":"用途說明不等於檢驗結果。"},{"id":"C","text":"讓三人各自改材料身分，避免共用資料","explanation":"會破壞資料對照。"},{"id":"D","text":"分別提供規格結果、使用情境、待改良性質，並保留共用材料身分","explanation":"各工作問題不同，需相應欄位及一致對象。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B106","stem":"測量表中樣品甲的性質值被更正。報告A直接引用該值，報告B使用它計算模型預測，報告C只介紹另一個未受影響樣品。首先應重檢哪些？","correct":"A","options":[{"id":"A","text":"A與B，因為兩者依賴更正的數據","explanation":"直接引用與衍生預測都可能受影響，C未被題設牽連。"},{"id":"B","text":"只有A，衍生預測永遠不受輸入影響","explanation":"B明示使用該值。"},{"id":"C","text":"只有C，因為它沒有引用甲","explanation":"不合依賴關係。"},{"id":"D","text":"完全不必重檢，舊檔名未改","explanation":"檔名不決定資料有效性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B107","stem":"甲材料報告說「較舊方案A改善20%」，乙說「較舊方案B改善30%」，A與B的原始表現不同且未提供。只依百分比，能決定甲乙誰的最終表現較好嗎？","correct":"B","options":[{"id":"A","text":"不能，所以兩項研究必定都錯","explanation":"各自相對改善可正確，只是尚不足跨方案比較。"},{"id":"B","text":"不能，需要共同指標及各自基準或最終值","explanation":"相對不同基準的百分比不能直接決定終點大小。"},{"id":"C","text":"能，30%一定代表最終表現較好","explanation":"未知道原始起點。"},{"id":"D","text":"能，20%一定代表耗費較少","explanation":"改善百分比沒有提供耗費。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B108","stem":"展板有太陽能板、OLED、改良藥物及螢火蟲。學生統整成「這些化學例子全部都是工業製成的裝置」。哪個最直接要求修正這句？","correct":"C","options":[{"id":"A","text":"OLED，因它不能用於顯示","explanation":"與教材相反。"},{"id":"B","text":"例子超過三個，句子就不能被檢查","explanation":"是否有反例不取決於數量上限。"},{"id":"C","text":"螢火蟲，因為它是天然生物發光的例子","explanation":"一個不屬工業裝置的例子就使全稱不成立。"},{"id":"D","text":"太陽能板，因它完全與材料無關","explanation":"教材正以矽材料介紹。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B109","stem":"假設模型對樣品甲在條件P預測「特徵出現」，在條件Q預測「特徵不出現」。實測甲在Q下沒有該特徵。哪個比對正確？","correct":"D","options":[{"id":"A","text":"與P下預測矛盾，所以模型整體已被否定","explanation":"實測不是P條件。"},{"id":"B","text":"已驗證P與Q兩項預測","explanation":"只有Q的實測。"},{"id":"C","text":"因同一樣品出現兩種預測，模型必定自相矛盾","explanation":"不同條件可有不同預測。"},{"id":"D","text":"與Q下的預測相符，尚未檢查P下結果","explanation":"需同時對齊樣品和條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B110","stem":"甲批未達既定規格；乙批達規格，但顧客希望下一版增加新性質。哪種處理最貼合兩種問題？","correct":"A","options":[{"id":"A","text":"甲追查規格不符，乙把新需求交研發評估","explanation":"一個是現行要求未達，一個是未來要求改變。"},{"id":"B","text":"兩批都只需修改商品名稱","explanation":"改名不處理兩種問題。"},{"id":"C","text":"乙達規格，所以顧客不能提出新需求","explanation":"現行規格不封閉改良需求。"},{"id":"D","text":"甲未達規格，所以已證明全體顧客都需要乙的新性質","explanation":"兩件事沒有這種推論關係。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B111","stem":"兩組共用材料性質表。工程組評估能否用於指定建材，農業組評估能否滿足農業材料需求。哪種合作方式合理？","correct":"B","options":[{"id":"A","text":"工程組的結論可直接取代所有農業判斷","explanation":"尚未對齊農業需求。"},{"id":"B","text":"共享性質資料，再各按用途需求作判斷","explanation":"共同化學資訊可支援不同專業目的。"},{"id":"C","text":"只要表相同，兩組必須選同一材料","explanation":"用途需求可能不同。"},{"id":"D","text":"兩組目的不同，任何原始數據都不能共用","explanation":"不同目的不妨礙共用相關資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG06／正文04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B112","stem":"模型說明只預測「材料在給定用途中的性質」，不預測產量或售價。哪個請求可直接由此模型的明示功能回應？","correct":"C","options":[{"id":"A","text":"列出已實際生產的件數","explanation":"模型未提供生產紀錄。"},{"id":"B","text":"證明所有消費者都會喜歡","explanation":"不是該性質預測所能保證。"},{"id":"C","text":"估計該用途中的指定性質","explanation":"這是已說明的預測對象。"},{"id":"D","text":"決定下一年的銷售額","explanation":"不在模型明示功能中。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B113","stem":"材料評估表：用途利益已有資料、健康影響已有資料、環境影響空白。若要完成表列三面向，最直接缺哪項？","correct":"D","options":[{"id":"A","text":"再複製一次用途利益","explanation":"複製不補空白面向。"},{"id":"B","text":"只把健康影響的標題改為環境","explanation":"兩面向不能任意替換。"},{"id":"C","text":"沒有缺項，已有兩欄就等於全表完成","explanation":"完成需按原定面向判斷。"},{"id":"D","text":"環境影響的資料","explanation":"三面向中只此欄未被支持。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B114","stem":"兩種方法原料用量相同，甲製成符合用途的材料，乙的材料不符合用途。只用原料量宣布兩者對該用途同樣有效，錯在哪裡？","correct":"A","options":[{"id":"A","text":"忽略材料是否具有所需性質","explanation":"資源比較需與有效完成用途相連。"},{"id":"B","text":"原料量相同就不能比較任何事情","explanation":"可比較原料量，不能因此把有效成果視同。"},{"id":"C","text":"不符合用途表示乙完全沒有使用原料","explanation":"用途失敗不否認原料耗用。"},{"id":"D","text":"只要乙被命名為甲，就可視為相同成果","explanation":"名稱不改變用途符合性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG03／正文01；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B115","stem":"研究員提供一個預測關係，卻未說輸入欄代表哪項材料性質。另一組想用它預測，先需補什麼？","correct":"B","options":[{"id":"A","text":"刪掉輸入欄就能預測全部材料","explanation":"缺少必要輸入不能靠刪除補足。"},{"id":"B","text":"輸入欄的定義及所需資料對照","explanation":"只有關係形式仍無法正確代入材料資訊。"},{"id":"C","text":"任意把所有數據依大小排序後填入","explanation":"排序不建立輸入意義。"},{"id":"D","text":"先把結果稱為實測","explanation":"更名不解決模型使用問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B116","stem":"品管更正某批由合格為不合格，服務人員仍持舊結果向客戶說明。哪個處理能修正目前資訊落差？","correct":"C","options":[{"id":"A","text":"直接改所有其他批次為不合格","explanation":"更正只針對指定批次。"},{"id":"B","text":"由服務人員改數字回合格以維持一致","explanation":"一致不能靠扭曲資料達成。"},{"id":"C","text":"把更正結果與批次對照傳給服務端，修正受影響說明","explanation":"分析更正需傳到引用它的工作。"},{"id":"D","text":"只把新檔存好，不處理仍引用舊檔的說明","explanation":"錯誤可能持續傳遞。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B117","stem":"卡片甲寫「太陽能板使用經特殊處理的矽」，乙寫「OLED用於高階顯示器」。哪個閱讀判斷最精確？","correct":"D","options":[{"id":"A","text":"兩句都完整列出所有製造步驟","explanation":"沒有工序與條件。"},{"id":"B","text":"甲只提供售價，乙只提供人數","explanation":"題幹沒有那些資料。"},{"id":"C","text":"只要同在圖1.2，兩句資訊面向必完全一樣","explanation":"同圖可介紹不同面向。"},{"id":"D","text":"甲包含材料資訊，乙明示裝置應用；兩者皆非完整製造說明","explanation":"兩句提供資訊的面向不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B118","stem":"原報告只分析用途利益，新報告增加環境影響，並未否定原利益數據。哪句說明恰當？","correct":"A","options":[{"id":"A","text":"評估面向擴充了，仍可保留有效的原利益資料","explanation":"新增面向不等於原資料失效。"},{"id":"B","text":"新報告較新，所以原利益必不存在","explanation":"時間先後不提供此否定。"},{"id":"C","text":"利益已研究，環境面向就沒有必要","explanation":"本節要求兼看相關影響。"},{"id":"D","text":"環境欄新增等於新材料已製成","explanation":"新增分析與製造不是同一活動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B119","stem":"假設材料紀錄明確分「製成時」與「使用後」兩個時點，所得外觀不同。若報告想描述製成時外觀，應如何取用？","correct":"B","options":[{"id":"A","text":"任選較喜歡的外觀","explanation":"喜好不決定要回答哪個時點。"},{"id":"B","text":"使用製成時的對應紀錄，另保留使用後的結果","explanation":"時間是題設必要定位資訊。"},{"id":"C","text":"把兩時點合成一個未標時間的結果","explanation":"會失去所問時點。"},{"id":"D","text":"一定刪除使用後結果，因不同就必錯","explanation":"不同時間結果未必矛盾。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B120","stem":"某材料試用顯示能源使用降低，但沒有成本、健康或資源資料。哪個結論最能由目前資料支持？","correct":"C","options":[{"id":"A","text":"成本必定同步降低","explanation":"未提供成本資料。"},{"id":"B","text":"健康影響必定是正面","explanation":"能源結果不能代填健康結果。"},{"id":"C","text":"在本次試用條件下有能源使用方面的改善","explanation":"只總結已觀察到的指標與條件。"},{"id":"D","text":"因此任何社會需求都已完全解決","explanation":"單指標不足以支持全體目標。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B121","stem":"客戶已提供要使用的材料，問題是尚不知道它是否達指定性質。哪項工作最直接推進這個問題？","correct":"D","options":[{"id":"A","text":"立即製造別種材料而不查原材料","explanation":"沒有先回答題設原材料問題。"},{"id":"B","text":"僅介紹化學有三項根本工作","explanation":"分類介紹不取得資料。"},{"id":"C","text":"先保證客戶可用，再決定是否檢查","explanation":"保證早於所缺證據。"},{"id":"D","text":"對該材料分析所要求的性質","explanation":"目前缺的是相應性質資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B122","stem":"一份模型成功用來解釋已知材料性質，目前尚未提出新情況的預測。依本節，哪個評語合理？","correct":"A","options":[{"id":"A","text":"解釋本身也是模型的功能，不必已做出新預測才算模型","explanation":"來源使用解釋或預測的定位。"},{"id":"B","text":"只有預測未來才算模型，解釋一律不算","explanation":"漏掉來源的解釋功能。"},{"id":"C","text":"既能解釋一次，就已證明所有未來情況","explanation":"超過已知證據。"},{"id":"D","text":"此模型必定等於製造新材料","explanation":"模型功能與物質製造不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B123","stem":"個人想了解某產品是否符合自己的使用需求，公共討論則要了解其環境影響。哪個資料安排較合理？","correct":"B","options":[{"id":"A","text":"兩個問題都只需商品名字","explanation":"名字不足以完成任何一項判斷。"},{"id":"B","text":"分別檢視用途需求與環境資料，必要時交叉參考","explanation":"不同判斷目的需要不同資訊。"},{"id":"C","text":"用個人的購買意願直接代表全部環境影響","explanation":"偏好不是環境資料。"},{"id":"D","text":"只要公共討論存在，個人就不能閱讀產品資料","explanation":"兩類使用者需求可並存。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B124","stem":"模型原本回答「是否符合用途甲」，需求後來改成用途乙。模型檔未調整，資料也未說甲乙需求等同。哪個說法正確？","correct":"C","options":[{"id":"A","text":"用途甲的結果一定全部是錯的","explanation":"新需求不否定原問題的結果。"},{"id":"B","text":"任何模型都不能用於用途判斷","explanation":"來源容許預測物質性質以支援用途。"},{"id":"C","text":"現有輸出仍回答用途甲；用途乙需重新對齊模型問題與資料","explanation":"需求變更不自動改變舊輸出的意義。"},{"id":"D","text":"檔案被重新命名為乙，就已回答用途乙","explanation":"檔名不改變模型問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B125","stem":"研發要知道「哪項性質最需改良」，品管只交付「不合格」三字。若要讓研發具體著手，最應補什麼？","correct":"D","options":[{"id":"A","text":"把不合格改寫三次","explanation":"重複總判定不增加原因資訊。"},{"id":"B","text":"只附樣品照片，不說要求","explanation":"照片未必回答所需性質與差距。"},{"id":"C","text":"宣布不合格代表每一項性質都失敗","explanation":"總判定不一定表示全項失敗。"},{"id":"D","text":"哪項要求未達及對應的性質結果","explanation":"需要定位改良問題，不只知道總判定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B126","stem":"假設同一材料達到包裝用途的明示要求，卻未達到某建材用途的明示要求。哪份標示最準確？","correct":"A","options":[{"id":"A","text":"適合題設包裝要求，不符合題設建材要求","explanation":"合格判斷必須附上所對照的用途。"},{"id":"B","text":"材料只要有一次合格，就對所有用途合格","explanation":"把限定用途擴大。"},{"id":"C","text":"建材要求未達，所以包裝要求也未達","explanation":"兩套要求不同。"},{"id":"D","text":"必須把材料拆成兩個名稱才能描述結果","explanation":"同一材料可面對不同需求。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B127","stem":"預測表依序列甲、乙；測量表依序列乙、甲。若要逐材料核對預測，哪種操作正確？","correct":"B","options":[{"id":"A","text":"兩表都含兩列，因此必已對齊","explanation":"列數相同不保證對象相同。"},{"id":"B","text":"按樣品名稱對齊再比較","explanation":"行序不同，不能直接第一列對第一列。"},{"id":"C","text":"只按列的位置配對","explanation":"會將不同材料錯配。"},{"id":"D","text":"把測量值排序後選最接近預測的配對","explanation":"接近程度不能代替真實樣品身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B128","stem":"假設選材規則是「先滿足用途要求，再於合格者選環境負面指標最低者」。甲不滿足用途、指標1；乙滿足、指標3；丙滿足、指標2。應選何者？","correct":"C","options":[{"id":"A","text":"乙，因指標數字最大","explanation":"題設要求較低者。"},{"id":"B","text":"三者都不能比較，因化學不能提供選材資訊","explanation":"題設已給明確規則與資料，可按範圍判斷。"},{"id":"C","text":"丙","explanation":"先排除甲，再比較乙丙，2低於3。"},{"id":"D","text":"甲，因指標最低","explanation":"跳過先滿足用途的必要條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B129","stem":"模型要檢查性質X與Y，已測X且相符，Y尚無資料。下一筆最能補足這次檢查的是什麼？","correct":"D","options":[{"id":"A","text":"再把X結果複製一列","explanation":"不能填補Y。"},{"id":"B","text":"測另一種無關材料的售價","explanation":"不檢查題設Y預測。"},{"id":"C","text":"直接標兩項都吻合","explanation":"Y未被檢查。"},{"id":"D","text":"同一對象、相應條件下的Y資料","explanation":"缺的是另一項明示預測。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B130","stem":"甲方案由100降到80單位原料，乙由20降到10，產出各自不變。本題只比較各方案前後：何者節省比例較大、何者節省原料量較大？","correct":"A","options":[{"id":"A","text":"乙比例較大，甲原料量較大","explanation":"甲省20/100=20%且20單位；乙省10/20=50%且10單位。"},{"id":"B","text":"甲兩者都較大","explanation":"甲省量較多，但比例20%小於50%。"},{"id":"C","text":"乙兩者都較大","explanation":"乙只省10單位，小於甲20。"},{"id":"D","text":"兩者相同","explanation":"比例和絕對節省量都不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B131","stem":"品管只確認某批符合三項列明規格。服務回覆哪句最合宜？","correct":"B","options":[{"id":"A","text":"把三項擴寫成三十項即可涵蓋更多需求","explanation":"文字改寫不增加檢查。"},{"id":"B","text":"這批已符合所列三項規格，其他需求需另核對","explanation":"忠實保留品管範圍。"},{"id":"C","text":"這批的所有可能用途都已證明安全","explanation":"三項規格不等於全面安全。"},{"id":"D","text":"只要有品管報告，顧客不必說明用途","explanation":"用途仍影響要核對的需求。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B132","stem":"糖經天然取得及工業精製，螢火蟲在體內反應發光。兩例共同最直接支援哪句？","correct":"C","options":[{"id":"A","text":"兩者都已被證明在一切用途下安全","explanation":"來源沒有全面安全結論。"},{"id":"B","text":"天然來源表示完全不涉及物質","explanation":"兩例都涉及物質。"},{"id":"C","text":"化學可以與天然來源或天然生物現象相連","explanation":"兩例打破化學只屬人工產品的限制。"},{"id":"D","text":"兩者都必須使用同一工業精製步驟","explanation":"螢火蟲例子沒有這項資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG04、06／正文02、04；PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B133","stem":"材料圖原誤把模型預測標成實測，現在更正圖例，數值未改。哪些解讀需要重新核對？","correct":"D","options":[{"id":"A","text":"只有字體大小的選擇","explanation":"核心更正是資料類型。"},{"id":"B","text":"完全沒有結論受影響，因數值相同","explanation":"忽略預測與實測的來源差異。"},{"id":"C","text":"更正後自動完成了原本未做的測量","explanation":"更正標示不產生新測量。"},{"id":"D","text":"所有把該曲線當作實測證據的結論","explanation":"數字相同不表示證據類型相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B134","stem":"工程與藥學學生都讀懂一份性質表，卻未取得各自用途要求。只靠讀懂數據，能否立刻決定兩用途都適用？","correct":"A","options":[{"id":"A","text":"不能，還需各用途所需性質與要求","explanation":"理解數據和判斷適用是兩步。"},{"id":"B","text":"能，只要兩人都修過化學","explanation":"訓練不能代替缺少的需求資訊。"},{"id":"C","text":"不能，所以共同化學基礎完全沒幫助","explanation":"它有助讀懂數據，仍不包辦全部判斷。"},{"id":"D","text":"能，所有專業的材料需求必然一致","explanation":"與多領域不同用途不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG06／正文04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B135","stem":"研究發現材料甲有負面影響，乙在所研究用途有正面價值。哪句最符合這組有限證據？","correct":"B","options":[{"id":"A","text":"這兩項已代表所有材料的完整評估","explanation":"有限例子不是全體資料。"},{"id":"B","text":"材料的影響不能一概說成全好或全壞","explanation":"兩項觀察分別指出不同影響。"},{"id":"C","text":"甲有負面，所以乙的正面資料必須刪除","explanation":"不同材料結果可並存。"},{"id":"D","text":"乙有正面，所以甲的負面結果必定無效","explanation":"不會自動推翻甲的觀察。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B136","stem":"假設甲、乙各接受三次性質測量，共有六筆結果。報告若說「研究了六種不同材料」，哪個更正正確？","correct":"C","options":[{"id":"A","text":"研究了六份，因每次測量都創造新材料","explanation":"測量不等於製造新材料。"},{"id":"B","text":"研究了三份，因每份量三次","explanation":"把次數誤當材料數。"},{"id":"C","text":"研究了兩份題設材料，取得六筆測量結果","explanation":"題設的材料數與測量次數不同。"},{"id":"D","text":"研究了零份材料，因為只看到數字","explanation":"數據來自已給材料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B137","stem":"分析報告說材料甲符合要求，但沒有測其他候選。能否把結論改成「甲在所有候選中最好」？","correct":"D","options":[{"id":"A","text":"能，合格的字義就是比全部候選更好","explanation":"兩種判斷不同。"},{"id":"B","text":"不能，所以甲不可能符合要求","explanation":"不足以比較不取消原合格結果。"},{"id":"C","text":"能，只要把報告標題改成比較研究","explanation":"標題不增加其他候選資料。"},{"id":"D","text":"不能，符合要求不等於完成候選間比較","explanation":"相對最好需要相關比較資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B138","stem":"展板已寫「藥品是化學成果」。若想補上圖1.2所強調的持續工作方向，哪句更有資訊？","correct":"A","options":[{"id":"A","text":"化學家仍在設計新的及改良的治病藥物","explanation":"增加了持續設計與改進的活動資訊。"},{"id":"B","text":"藥品就是藥品","explanation":"只重複名稱。"},{"id":"C","text":"凡稱為藥品就不用任何研究","explanation":"與持續改進的來源方向相反。"},{"id":"D","text":"所有藥品的機制都相同","explanation":"圖例不支持相同機制。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B139","stem":"模型提供候選材料的預測性質，品管工作需要確認實際批次符合規格。這份模型輸出最合理的作用是什麼？","correct":"B","options":[{"id":"A","text":"只要把候選名稱換成批號，就成為實測","explanation":"改名不改變取得方式。"},{"id":"B","text":"可幫助規劃關注的性質，但不能單獨冒充批次實測驗收","explanation":"候選預測與實際批次確認是不同要求。"},{"id":"C","text":"直接標記所有批次已檢驗通過","explanation":"沒有各批實測證據。"},{"id":"D","text":"完全沒有任何可能用途","explanation":"預測可支援研究規劃。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06；PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B140","stem":"報告甲說某材料在用途A有利益；報告乙說同材料在處理階段B有環境風險。兩者必定矛盾嗎？","correct":"C","options":[{"id":"A","text":"必定，只要同名資料就要完全相同","explanation":"同名不代表同研究問題。"},{"id":"B","text":"不必，所以兩報告都可不查證","explanation":"不矛盾仍不等於已驗證。"},{"id":"C","text":"不必，所述階段與影響面向不同","explanation":"可分別成立，需看各自證據。"},{"id":"D","text":"必定，材料只能有一種影響","explanation":"本節容許正負面影響。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B141","stem":"計畫目標是降低能源使用，報告只記錄採購費用下降，沒有能源量資料。哪個問題需要修正？","correct":"D","options":[{"id":"A","text":"費用資料一定沒有任何用途","explanation":"它可供成本分析，只未直接回答能源量。"},{"id":"B","text":"只要有下降兩字，就已達所有公共目標","explanation":"下降須看的是哪個指標。"},{"id":"C","text":"能源研究只能完全不記任何成本","explanation":"研究可有多種資訊，不應互相冒充。"},{"id":"D","text":"把費用指標當成能源使用量的直接證據","explanation":"兩個量不是同一資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B142","stem":"產品要求更新了，原批材料測量資料仍有效且涵蓋新要求的所有性質。最直接應先做什麼？","correct":"A","options":[{"id":"A","text":"用有效數據重新對照新要求判定","explanation":"規格變動影響判定規則，不自動使數據失真。"},{"id":"B","text":"把原始數值改成新規格門檻","explanation":"門檻不是測得值。"},{"id":"C","text":"無條件沿用舊合格標記","explanation":"舊規則下合格不保證新規則。"},{"id":"D","text":"宣布任何規格更新都代表材料已重新製造","explanation":"文件要求更新不是實物製造。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B143","stem":"模型能解釋已知性質X，並另外預測性質Y。研究只檢查了X的解釋與資料相容，尚未取得Y資料。哪個結論適當？","correct":"B","options":[{"id":"A","text":"模型只能解釋，永遠不能預測","explanation":"來源明列預測功能。"},{"id":"B","text":"X方面得到支持，Y預測尚待檢查","explanation":"兩項功能的證據狀態需分開。"},{"id":"C","text":"解釋X已證明Y必正確","explanation":"缺少Y的相應檢查。"},{"id":"D","text":"Y尚未測所以X資料也不存在","explanation":"一項缺口不刪除另一項資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B144","stem":"教材列生物、工程、藥學、農業、地質等領域。校方因此拒絕任何未列名科系使用化學教材。哪個評語正確？","correct":"C","options":[{"id":"A","text":"應刪掉已列科系，才能讓未列科系使用","explanation":"沒有這種互斥關係。"},{"id":"B","text":"只有改系名才能有化學問題","explanation":"名稱不決定是否研究物質。"},{"id":"C","text":"列舉多領域需求不是未列科系的禁止名單","explanation":"來源另提其他領域，重點是基本原理的廣泛用途。"},{"id":"D","text":"拒絕合理，列出五類表示所有領域恰好五類","explanation":"把舉例當成封閉全集。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG06／正文04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B145","stem":"同一產品的兩批材料有不同性質結果，兩批身分及條件均明確。若要了解差異，哪項後續最有用？","correct":"D","options":[{"id":"A","text":"把兩批改成同一批號","explanation":"會隱藏差異來源。"},{"id":"B","text":"只展示較好的批次並稱全部相同","explanation":"抹除已有結果。"},{"id":"C","text":"用產品名稱相同直接否定測量","explanation":"名稱相同不能否定已知分批結果。"},{"id":"D","text":"保留分批資料，進一步分析相關性質及可能解釋","explanation":"差異是待研究的材料問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B146","stem":"消費者手上有「用途說明」和「接觸材料的安全資訊」。想形成平衡看法，如何使用這兩份資料較合理？","correct":"A","options":[{"id":"A","text":"各按所回答的問題閱讀，綜合了解用途及相關影響","explanation":"兩份資料可能互補，不必任選其一。"},{"id":"B","text":"只保留用途說明，因有用途就無安全問題","explanation":"有用不等於所有接觸都無害。"},{"id":"C","text":"只保留安全資訊，並否定任何用途價值","explanation":"風險資訊不自動否定用途。"},{"id":"D","text":"把安全標題貼到用途說明上當兩份都讀完","explanation":"改標題不增加資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B147","stem":"服務端收到新用途詢問，現有資料只說原用途適用。若要負責任地回答新用途，應先做什麼？","correct":"B","options":[{"id":"A","text":"宣布所有新用途都不可能","explanation":"資料不足也不證明不可能。"},{"id":"B","text":"釐清新用途所需性質，請相關團隊核對現有資料或補研究","explanation":"要讓回答有相應材料依據。"},{"id":"C","text":"只要客戶願意購買就保證可用","explanation":"購買意願不證明性質適用。"},{"id":"D","text":"沿用原用途結論而刪掉原用途限制","explanation":"會擴大結論。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B148","stem":"材料表第一列是儀器測量值，第二列是由模型根據第一列推算的另一性質。正確標示是什麼？","correct":"C","options":[{"id":"A","text":"兩列都不是資料","explanation":"實測與推算都可提供資訊，只是種類不同。"},{"id":"B","text":"第二列一旦有數字就不需模型說明","explanation":"數字不自動揭示來源。"},{"id":"C","text":"第一列為實測，第二列為模型推算並註明依據","explanation":"衍生資料應保留取得方式。"},{"id":"D","text":"兩列都是獨立實測","explanation":"第二列沒有獨立量測。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B149","stem":"研發材料已減少原料使用，卻未達實際用途所需的性質。若要同時實現原目標，下一步最應關注什麼？","correct":"D","options":[{"id":"A","text":"只繼續降低原料量而忽略用途失敗","explanation":"不能完成完整目標。"},{"id":"B","text":"把用途要求刪掉，宣稱原目標全達成","explanation":"擅自改變原目標。"},{"id":"C","text":"宣布節省原料那部分一定是假","explanation":"用途失敗不否定已知資源結果。"},{"id":"D","text":"在保留資源目標的同時研究如何達到所需性質","explanation":"兩個要求尚只完成一個。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG03／正文01；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B150","stem":"圖1.2把化學連到能源、科技、生物化學和醫學。若要判定哪一領域對某社區最優先，單靠這張圖夠嗎？","correct":"A","options":[{"id":"A","text":"不夠，圖展示連結，未給社區需求或優先規則","explanation":"領域例子不是特定社區的排序資料。"},{"id":"B","text":"夠，只要選排在最上面的領域","explanation":"排版不能代替需求依據。"},{"id":"C","text":"夠，字數最多的標籤最重要","explanation":"字數不決定價值。"},{"id":"D","text":"不夠，所以圖中的領域連結都無效","explanation":"不能排序不等於連結無效。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B151","stem":"比較紀錄中，甲乙使用不同材料，也處在不同條件，結果不同。研究者只根據這兩筆就說差異完全來自材料。哪個評語最恰當？","correct":"B","options":[{"id":"A","text":"結果不同表示任何材料模型都無用","explanation":"有限資料不支持如此普遍否定。"},{"id":"B","text":"目前未排除條件差異的影響，需更有針對性的比較","explanation":"同時改變兩項，不能從這兩筆唯一歸因。"},{"id":"C","text":"材料不同就證明條件永遠不影響結果","explanation":"沒有此依據。"},{"id":"D","text":"應把兩種條件改寫成同一條件","explanation":"會扭曲原記錄。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B152","stem":"倉庫要出貨甲批，收到一張寫「乙批合格」的有效報告。哪種處理正確？","correct":"C","options":[{"id":"A","text":"把乙批的字改成甲批就完成檢查","explanation":"更名不是測量甲批。"},{"id":"B","text":"宣布乙批報告必是假","explanation":"報告可對乙有效，卻不支持甲。"},{"id":"C","text":"確認是否有甲批相應資料，不能以乙批報告直接替代","explanation":"判定須綁定實際出貨批次。"},{"id":"D","text":"有效報告有合格二字即可放行甲","explanation":"忽略對象不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B153","stem":"假設投入80單位原料，有60單位在流程後可回收。只依題設，未被列為可回收的量及回收比例為何？","correct":"D","options":[{"id":"A","text":"60單位；25%","explanation":"把回收和未回收對調。"},{"id":"B","text":"20單位；25%","explanation":"25%是未列為可回收的比例。"},{"id":"C","text":"140單位；75%","explanation":"未回收量不是投入與回收量相加。"},{"id":"D","text":"20單位；75%","explanation":"80−60=20，60÷80=0.75。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B154","stem":"某材料報告寫「在目前觀察範圍內，尚未發現題設的負面影響」。轉述成哪句最忠實？","correct":"A","options":[{"id":"A","text":"目前範圍內未觀察到該影響，仍保留範圍限定","explanation":"不把有限觀察擴成所有情況。"},{"id":"B","text":"已證明所有未來用途都無害","explanation":"超過觀察範圍。"},{"id":"C","text":"其用途一定完全無效","explanation":"未見負面不推用途無效。"},{"id":"D","text":"所有環境面向都已研究完畢","explanation":"題幹只說題設影響和目前範圍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B155","stem":"團隊把已知材料甲乙做成候選組合，目標是組合具有特定性質。只有甲單獨與乙單獨的資料，尚未研究組合。哪項資料最直接補目標缺口？","correct":"B","options":[{"id":"A","text":"宣布所有組合必定沒有可研究性質","explanation":"來源明列物質組合可作製造目標。"},{"id":"B","text":"該候選組合在要求條件下的性質資料","explanation":"研究對象是組合，不只是各別材料。"},{"id":"C","text":"將甲乙的名稱連寫，便當組合性質已知","explanation":"名稱拼接不提供性質。"},{"id":"D","text":"只展示兩份單獨資料的頁數","explanation":"頁數不證明組合表現。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B156","stem":"原始資料和模型計算均保存正確，投影片卻把兩條曲線的標籤互換。首先應修哪項？","correct":"C","options":[{"id":"A","text":"立即丟棄整個模型","explanation":"先辨認已知錯置來源。"},{"id":"B","text":"保留錯標，只說圖很好看","explanation":"可讀性不能代替正確標示。"},{"id":"C","text":"修正投影片標示並重檢引用該圖的解讀","explanation":"已知錯誤在表示與引用，不必先假定原數據或模型本體錯。"},{"id":"D","text":"任意更改原始測量值","explanation":"沒有證據支持改數據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B157","stem":"兩單位使用同一有效性質資料，卻依不同用途規則，分別判適合與不適合。哪個核對最合理？","correct":"D","options":[{"id":"A","text":"把一份原數據改掉使判定一致","explanation":"不應用改資料追求表面一致。"},{"id":"B","text":"兩單位只要結論不同就不能共享資料","explanation":"共同資料仍可有效。"},{"id":"C","text":"不同用途要求必須永遠給相同判定","explanation":"未必如此。"},{"id":"D","text":"先核對兩套用途要求，不因判定不同就認定原數據矛盾","explanation":"相同資料可以在不同規則下有不同判定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B158","stem":"跨域計畫同時需要材料性質分析、場地排程、公共需求討論。化學團隊專長直接對應哪項，且應如何理解其他工作？","correct":"A","options":[{"id":"A","text":"材料性質分析；其他工作可由合作成員處理","explanation":"化學可支援計畫中的物質問題，不必包辦全部工作。"},{"id":"B","text":"三項都必須改名為測量才可合作","explanation":"改名不改職責。"},{"id":"C","text":"只有排程需要化學，性質分析無關","explanation":"與化學根本工作相反。"},{"id":"D","text":"有其他工作就應排除化學參與","explanation":"跨域合作可有不同專長。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG06／正文04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B159","stem":"產品名稱相同，但目前材料配方版本已更換；現有影響報告明示只研究舊版本。哪項核對必要？","correct":"B","options":[{"id":"A","text":"舊版有效結果因此必須全部作廢","explanation":"它仍可適用原研究對象。"},{"id":"B","text":"確認新版是否有相應資料，不能只靠同名沿用舊結論","explanation":"報告必須對應實際研究版本。"},{"id":"C","text":"商品名相同就保證所有影響完全相同","explanation":"名稱不證明新版性質與影響。"},{"id":"D","text":"將舊報告日期改成今天即可","explanation":"日期改動不新增新版研究。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B160","stem":"研究摘要整合2份實測結果和3份模型預測，各來自不同明示工作。正確統計應如何寫？","correct":"C","options":[{"id":"A","text":"只存在2份資訊，其餘不是任何成果","explanation":"模型預測仍可有資訊價值。"},{"id":"B","text":"完成3份新材料製造","explanation":"預測份數不等於製造件數。"},{"id":"C","text":"共5份相關資訊，其中2份實測、3份預測","explanation":"既記總量，也保留類別。"},{"id":"D","text":"完成5份實測","explanation":"把模型預測混入實測。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B161","stem":"團隊以保育原料資源為目標，成果只報「開了十次會」。哪項補充最能讓目標成效可被檢查？","correct":"D","options":[{"id":"A","text":"再增加會議照片","explanation":"會議活動不直接量出資源成效。"},{"id":"B","text":"把會議次數改稱原料節省量","explanation":"只是偷換名稱。"},{"id":"C","text":"宣稱參與人多就代表原料減少","explanation":"缺少實際資源資料。"},{"id":"D","text":"原料實際使用或節省的相關資料及比較條件","explanation":"需有與資源目標直接相關的結果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B162","stem":"品管如實證明材料符合用途甲，服務卻向顧客說已符合用途乙。題設未研究乙。最先要修正什麼？","correct":"A","options":[{"id":"A","text":"服務對適用範圍的轉述，並另核對乙需求","explanation":"品管資料可能正確，錯在用途擴張。"},{"id":"B","text":"把正確的甲測量值改成乙想要的值","explanation":"這會造假而非修正轉述。"},{"id":"C","text":"所有品管資料必定都不可信","explanation":"題設明示甲的證據有效。"},{"id":"D","text":"只要服務說得肯定，乙就已被驗證","explanation":"語氣不產生證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B163","stem":"學生能正確說明矽材料與能源、OLED與顯示的連結，但未讀製造方法。教師如何描述他的能力較精確？","correct":"B","options":[{"id":"A","text":"只要會念OLED就已會所有機制","explanation":"名詞辨認不等於機制理解。"},{"id":"B","text":"已能辨識兩種應用連結，尚不能據此聲稱能製造裝置","explanation":"用途理解與實作機制能力分開。"},{"id":"C","text":"已能獨立製造所有裝置","explanation":"超過所學資訊。"},{"id":"D","text":"完全沒有學到任何化學連結","explanation":"否定已掌握的內容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 PNG04、06／正文02、04。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B164","stem":"測量組發現一項模型尚未解釋的材料現象，要交模型組研究。哪份交接最完整？","correct":"C","options":[{"id":"A","text":"先刪掉不符資料再交接","explanation":"會隱藏待解釋現象。"},{"id":"B","text":"只傳新產品名稱","explanation":"名稱不說明現象與模型差異。"},{"id":"C","text":"樣品、條件、實際觀察及與現有模型不符之處","explanation":"能定位需要解釋的具體問題。"},{"id":"D","text":"只說模型不好，不附資料","explanation":"無法知道哪項主張受挑戰。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B165","stem":"比較兩方案的總體環境負面指標時，已知每次使用的指標，卻不知道實際使用次數。若題設總指標定義為「每次指標×次數」，還缺什麼？","correct":"D","options":[{"id":"A","text":"只比較材料名字","explanation":"名字不提供次數。"},{"id":"B","text":"把每次指標直接當總量","explanation":"會漏掉次數因素。"},{"id":"C","text":"不需補資料，兩方案次數必相同","explanation":"題幹沒有此條件。"},{"id":"D","text":"各方案的使用次數","explanation":"需依題設規則才能得到總量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B166","stem":"假設甲每次負面指標2、使用100次；乙每次指標3、使用50次。總指標明定為兩者相乘，何者總指標較低？","correct":"A","options":[{"id":"A","text":"乙，150低於甲的200","explanation":"3×50=150；2×100=200。"},{"id":"B","text":"甲，因每次2低於3","explanation":"忽略使用次數。"},{"id":"C","text":"兩者相同，因兩者都有使用","explanation":"有使用不代表總量相等。"},{"id":"D","text":"乙，且已證明所有其他環境面向都較好","explanation":"此題只給一個定義指標。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG03／正文01；PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B167","stem":"品管表預先列出所有必要性質，仍有兩欄只有「待測」而無結果。哪個結論正確？","correct":"B","options":[{"id":"A","text":"空欄表示材料必定不符合要求","explanation":"未測不等於測得不合格。"},{"id":"B","text":"表格結構完整，實際測量尚未全部完成","explanation":"必要欄位存在不代表資料已取得。"},{"id":"C","text":"已完成全部分析，因性質名稱都有列","explanation":"混淆預定項目與實測。"},{"id":"D","text":"把待測二字改成通過即可","explanation":"不能由標籤產生結果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG07／正文05。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B168","stem":"研發已用模型選出有希望的材料設計，接下來的目標是取得實際候選材料供測量。哪項工作最直接對應此目標？","correct":"C","options":[{"id":"A","text":"直接把預測表送去當實際樣品","explanation":"表示不是樣品。"},{"id":"B","text":"先宣布所有性質都已實測","explanation":"尚未取得相應樣品與資料。"},{"id":"C","text":"依設計製作候選材料，保留後續測量需求","explanation":"實際物質是下一步所需輸出。"},{"id":"D","text":"只再印一次同一預測表","explanation":"不產生材料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B169","stem":"學生已記住教材的產品例子，現在需要解讀材料性質報告。哪種學習調整最符合本節強調的化學基礎？","correct":"D","options":[{"id":"A","text":"只再背更多商品名稱而不問其性質","explanation":"不足以回應新學習目標。"},{"id":"B","text":"取消化學，因記名詞就是全部內容","explanation":"把學科縮得過窄。"},{"id":"C","text":"把全部報告標成已理解","explanation":"標記不等於理解。"},{"id":"D","text":"進一步理解物質性質、測量與模型在報告中的作用","explanation":"讓名詞例子連到理解材料的基本原理。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48、49；部分1 PDF頁 50、51；已審筆記頁 PNG06／正文04；PNG08／正文06。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B170","stem":"某人推薦一款材料，卻未提供用途成效、健康或環境資料。另一人提出這三面的可核對資訊。哪個比較正確？","correct":"A","options":[{"id":"A","text":"後者提供形成判斷的相關資訊；推薦本身不能替代評估","explanation":"立場與支持立場的資料不同。"},{"id":"B","text":"推薦越強烈，影響資料越不需要","explanation":"語氣不能補資料。"},{"id":"C","text":"有資料的人不可以提出任何看法","explanation":"資訊可支援看法。"},{"id":"D","text":"只有宣傳口號才算公民判斷","explanation":"與理解正負影響的要求不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 → 1.1 The Study of Chemistry → Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 PNG05／正文03。","example":""},{"id":"central-0-1-ch1-sec1-1-topic02-G02-VIS-R2-B171","stem":"模型說明只適用於明列的材料群A，現在要研究不在名單中的B，尚無擴用證據。哪個做法合理？","correct":"B","options":[{"id":"A","text":"只要模型能運行，就證明對B正確","explanation":"可運行不等於適用。"},{"id":"B","text":"先核對適用性或取得B的資料，明示擴用尚待確認","explanation":"不能以外觀相似自動擴大範圍。"},{"id":"C","text":"把B重新命名為A成員","expla
