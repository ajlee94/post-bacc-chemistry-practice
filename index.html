00%−98%=2%；剩餘只表示未列元素的總占比，不指某一個新元素。","correct":"D","options":[{"id":"A","text":"24%","explanation":"錯誤。24%是氦單項。"},{"id":"B","text":"26%","explanation":"錯誤。26%是不含氫的全部，仍含氦。"},{"id":"C","text":"98%","explanation":"錯誤。98%是氫氦之和。"},{"id":"D","text":"2%","explanation":"正確。扣除氫與氦後剩2%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S005","stem":"兩份總質量相同的組成模型，甲依銀河系氫74%，乙依人體氫10%配置。兩模型中氫的質量何者較多？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n質量百分比必須與總量一起使用。本題兩模型總質量相同，可直接比較氫的質量分率0.74與0.10，因此甲含有的氫質量較大，不需其餘元素資料。","correct":"A","options":[{"id":"A","text":"甲","explanation":"正確。相同總量乘0.74大於乘0.10。"},{"id":"B","text":"乙","explanation":"錯誤。乙氫分率只有0.10。"},{"id":"C","text":"相同","explanation":"錯誤。氫比例不同，總量相同時氫質量不相同。"},{"id":"D","text":"需知道氦占比才可判斷","explanation":"錯誤。所求是氫，已有兩模型氫分率即可。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S006","stem":"以含海洋與大氣的地殼為範圍，哪組元素的質量合計超過90%？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n教材地殼資料把氧、矽、鋁、鐵、鈣列為主要五種，合計90.8%。不要將人體的氧碳氫組合或銀河系的氫氦組合套到地殼；各環境的主要成分並不相同。","correct":"B","options":[{"id":"A","text":"氫、氦、碳、硫、磷","explanation":"錯誤。包含銀河系主要元素，沒有涵蓋地殼的矽鋁鐵鈣。"},{"id":"B","text":"氧、矽、鋁、鐵、鈣","explanation":"正確。這五種的地殼質量分率合計90.8%。"},{"id":"C","text":"鈉、鉀、銀、銅、錫","explanation":"錯誤。這些雖有常見符號，卻不是本資料的地殼主要五種。"},{"id":"D","text":"氧、碳、氫、氮、氦","explanation":"錯誤。這不是地殼主要五種的組合。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S007","stem":"地殼組成為O 49.5%、Si 25.7%、Al 7.5%、Fe 4.7%、Ca 3.4%，其餘9.2%，皆按質量。已單列元素中，何者次於氧而居第二？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n先辨識符號，再比較同一質量基準下的數值。Si代表矽，25.7%是除氧之外最大的單列值；Other則是多元素合計，不能當一種元素參加名次。","correct":"C","options":[{"id":"A","text":"Ca","explanation":"錯誤。鈣3.4%是這五種中最低。"},{"id":"B","text":"Al","explanation":"錯誤。鋁7.5%低於矽25.7%。"},{"id":"C","text":"Si","explanation":"正確。矽25.7%低於氧但高於其他單列元素。"},{"id":"D","text":"Fe","explanation":"錯誤。鐵4.7%低於鋁與矽。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S008","stem":"某地殼組成資料註明「含海洋及大氣，按元素質量計」。其中氧49.5%的意思是什麼？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n讀豐度資料要先看範圍和計量基準。本題分母是含海洋大氣的地殼總質量，分子為其中氧元素的質量；它不是地核組成，也不是空氣體積或原子個數統計。","correct":"D","options":[{"id":"A","text":"地核質量的49.5%是氧","explanation":"錯誤。地核不在此統計範圍內。"},{"id":"B","text":"每100顆原子中恰有49.5顆氧","explanation":"錯誤。題目按質量，不能改讀為原子數。"},{"id":"C","text":"乾燥空氣體積的49.5%為氧","explanation":"錯誤。包含大氣不表示資料是乾燥空氣體積比。"},{"id":"D","text":"指定統計範圍的總質量中，氧約占49.5%","explanation":"正確。完整保留了資料的環境及質量分母。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S009","stem":"地殼質量分布中，O為49.5%、Fe為4.7%。只依這兩項資料，哪個結論成立？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n共同分母都是地殼總質量，因此可比較兩元素的總質量。要比較原子個數，還須用各元素單顆原子質量換算；豐度較高並不表示每顆原子較重。","correct":"A","options":[{"id":"A","text":"氧元素的總質量比鐵元素大","explanation":"正確。49.5%大於4.7%，所以氧總質量較大。"},{"id":"B","text":"氧與鐵的原子個數比為49.5：4.7","explanation":"錯誤。這是質量比，不能直接作個數比。"},{"id":"C","text":"鐵原子比氧原子少4.7倍","explanation":"錯誤。個數比還缺每顆原子的質量資料。"},{"id":"D","text":"氧原子一定比鐵原子重","explanation":"錯誤。總質量占比不能判定單顆質量大小。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S010","stem":"人體元素組成的近似質量比例為O 65%、C 18%、H 10%、其他7%。哪個元素對總質量的貢獻最大？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n本題比較的是元素質量貢獻，不是原子數。O為氧，其65%高於碳18%和氫10%，所以氧對人體總質量的貢獻最大；氫較輕的原子仍可能有較多顆數。","correct":"B","options":[{"id":"A","text":"三者一樣","explanation":"錯誤。三個質量分率明顯不同。"},{"id":"B","text":"氧","explanation":"正確。氧的65%是單列元素最大值。"},{"id":"C","text":"碳","explanation":"錯誤。碳18%低於氧。"},{"id":"D","text":"氫","explanation":"錯誤。氫10%低於氧，較多顆數也不等於較大質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S011","stem":"依人體質量比例O 65%、C 18%、H 10%、其他7%，氧、碳、氫三種合計約占多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n同一整體中互不重疊的元素質量分率可以相加。65%+18%+10%=93%，剩餘7%留給其他元素；不能把這個合計誤說成每一種都占93%。","correct":"C","options":[{"id":"A","text":"28%","explanation":"錯誤。28%只加碳與氫。"},{"id":"B","text":"90%","explanation":"錯誤。90%是比較門檻，不是資料相加結果。"},{"id":"C","text":"93%","explanation":"正確。三項相加為93%，加其他7%可回到100%。"},{"id":"D","text":"83%","explanation":"錯誤。83%只加氧與碳。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S012","stem":"人體近似組成中，氫占總質量10%。下列哪項換算正確？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n質量百分比的分子是該元素總質量，分母是樣品全部質量。100 g模型中氫為10 g、非氫為90 g，所以氫對非氫的質量比為10：90，而不是10：100。若問原子個數比例，還須考慮各元素每顆原子的質量，不能沿用10%。","correct":"D","options":[{"id":"A","text":"每100顆人體原子中，恰有10顆氫原子","explanation":"錯誤。把質量百分比當成原子個數百分比。"},{"id":"B","text":"每100 g人體組成模型中，氫與非氫的質量比為10：100","explanation":"錯誤。100 g是全部質量，非氫應為90 g；氫對非氫不是10：100。"},{"id":"C","text":"每100 g人體組成模型中，非氫元素合計10 g","explanation":"錯誤。10 g是氫，非氫合計應為90 g。"},{"id":"D","text":"每100 g人體組成模型中，氫元素合計10 g","explanation":"正確。100 g的10%為10 g，元素及質量基準都正確。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S013","stem":"每100 g人體組成模型含氧65 g、碳18 g、氫10 g。若要比較這三種元素的原子個數，還需要哪項資料？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n題目已提供三種元素的總質量。原子個數與「元素總質量÷單顆原子質量」成正比，因此還需要三者相對原子質量，才能把65、18、10換成可比較的相對顆數。三者合計93 g及其各自質量分率都能由題目得到，卻不提供每顆原子的質量；地殼分率也不能取代人體的換算資料。","correct":"A","options":[{"id":"A","text":"三者的相對原子質量","explanation":"正確。用各元素質量除以其相對原子質量，才得到相對原子個數。"},{"id":"B","text":"三者在地殼中的質量百分比","explanation":"錯誤。地殼是另一環境，其組成分率不能換算這份人體模型的原子數。"},{"id":"C","text":"三者在人體中的合計質量","explanation":"錯誤。合計93 g是總量資料，不能區分每顆氧、碳、氫原子的質量。"},{"id":"D","text":"三者各自質量占人體總質量的比例","explanation":"錯誤。這些質量分率已由題目給定，仍缺少從質量轉成顆數的除數。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S014","stem":"兩個人體組成模型都設氧為65%質量，甲總質量40 kg、乙總質量60 kg。氧的質量何者較大？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n氧質量要用總量乘0.65。兩模型分率相同，總量較大者的氧質量也較大：甲26 kg，乙39 kg。只看百分比相同便判定絕對質量相同，會漏掉分母大小。","correct":"B","options":[{"id":"A","text":"無法比較","explanation":"錯誤。總量與分率都已提供，能比較。"},{"id":"B","text":"乙","explanation":"正確。乙為39 kg，大於甲26 kg。"},{"id":"C","text":"甲","explanation":"錯誤。甲的總量較小，氧質量為26 kg。"},{"id":"D","text":"相同","explanation":"錯誤。相同比例不表示相同絕對量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S015","stem":"兩份地殼組成樣品都採氧49.5%的質量比例。若其中一份總質量為另一份的兩倍，其氧質量如何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n在組成比例不變時，元素質量＝總質量×固定分率。因此總量乘2，氧質量也乘2；百分比仍為49.5%，不會隨取樣量改變。","correct":"C","options":[{"id":"A","text":"變為一半","explanation":"錯誤。總量增加不是減少。"},{"id":"B","text":"必增為四倍","explanation":"錯誤。只放大總量一次，沒有第二個乘2因素。"},{"id":"C","text":"也為兩倍","explanation":"正確。同一固定分率乘兩倍總量得到兩倍元素質量。"},{"id":"D","text":"仍相同","explanation":"錯誤。相同比例不等於元素量不變。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S016","stem":"某組成模型中，碳質量18 g、全部元素總質量100 g。碳的質量百分比計算應為何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n百分比要用「部分÷整體×100%」。部分是碳18 g，整體是100 g，兩者用相同單位後相除得到0.18，即18%；82 g是非碳部分，不能當全部質量。","correct":"D","options":[{"id":"A","text":"18×100×100%","explanation":"錯誤。質量相乘不是分率。"},{"id":"B","text":"18÷82×100%","explanation":"錯誤。這算碳對非碳的比，不是碳占整體。"},{"id":"C","text":"100÷18×100%","explanation":"錯誤。把部分與整體顛倒，結果會超過100%。"},{"id":"D","text":"18÷100×100%","explanation":"正確。18/100=0.18，乘100%為18%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S017","stem":"比較相同總質量的氫與氧，已知氧單顆原子比氫重。哪一種原子顆數較多？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n固定總質量時，每顆越輕就需要越多顆才能湊成該質量。氫的單顆質量較小，所以相同總質量的氫含較多原子；這不需要假定原子如何成鍵或排列。","correct":"A","options":[{"id":"A","text":"氫","explanation":"正確。氫較輕，因此等總質量下顆數較多。"},{"id":"B","text":"無法由單顆質量比較","explanation":"錯誤。已有等總質量與單顆質量大小，足以定性比較。"},{"id":"C","text":"氧","explanation":"錯誤。氧每顆較重，相同質量下顆數較少。"},{"id":"D","text":"一樣多","explanation":"錯誤。只有單顆質量相同才會在等總質量下顆數相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S018","stem":"若把人體元素組成由質量百分比改為原子個數百分比，氫所占的比例會比原來10%如何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n氫每顆原子的質量遠小於氧、碳。用各元素質量除以單顆質量後，氫的相對顆數增加，所以其個數占比高於質量占比。這是比例轉換，並沒有增加樣品中的氫原子；氫總質量雖未變，統計分母改變仍會使占比不同。","correct":"B","options":[{"id":"A","text":"變小，因換算顆數時應乘相對原子質量","explanation":"錯誤。求原子顆數應除以單顆質量，不能反過來相乘。"},{"id":"B","text":"變大，因氫原子相對較輕","explanation":"正確。同樣的氫質量能對應較多顆原子，使個數占比提升。"},{"id":"C","text":"變小，因氫質量較少","explanation":"錯誤。只看10%的質量分率忽略了氫每顆較輕。"},{"id":"D","text":"不變，因樣品中氫的總質量沒有改變","explanation":"錯誤。元素總質量未變不代表質量分率與原子個數分率相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S019","stem":"有兩種原子，甲每顆質量為乙的4倍。若甲、乙原子顆數相同，哪個敘述正確？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n總質量是顆數乘每顆質量。顆數相同時，總質量比等於單顆質量比，因此甲總質量為乙的4倍。這與固定總質量比較顆數的題目條件不同。","correct":"C","options":[{"id":"A","text":"乙總質量為甲的4倍","explanation":"錯誤。把較重的一方顛倒。"},{"id":"B","text":"甲總質量為乙的一半","explanation":"錯誤。甲每顆較重，總質量不會較小。"},{"id":"C","text":"甲總質量為乙的4倍","explanation":"正確。共同顆數相消，總質量比保留4：1。"},{"id":"D","text":"兩者總質量相同","explanation":"錯誤。單顆質量不同，等顆數時總質量不同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S020","stem":"甲、乙為兩種元素。若甲原子比乙原子輕，僅憑這點可以確定什麼？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n「甲較輕」描述一顆原子的質量。只有固定兩者總質量，才能由除數較小推出甲顆數較多；若總量不受限制，甲可能只有少數幾顆，不能無條件比較總顆數或豐度。","correct":"D","options":[{"id":"A","text":"甲的總質量永遠小於乙","explanation":"錯誤。總質量也受顆數影響。"},{"id":"B","text":"甲在每個環境都占較高比例","explanation":"錯誤。不同環境的豐度不是由單顆質量唯一決定。"},{"id":"C","text":"任何樣品中的甲原子數都多於乙","explanation":"錯誤。顆數還取決於各自總質量。"},{"id":"D","text":"等質量的甲會含比乙更多原子","explanation":"正確。等質量加上較輕單顆，可推出較多顆數。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S021","stem":"下列哪組依序正確表示「鈣、碳、銅」的元素符號？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鈣是Ca，碳是C，銅是Cu。這三個符號同以大寫C開始，但完整字母決定對應元素；作答須按題目指定次序逐項核對，不能把雙字母符號省略成C。","correct":"A","options":[{"id":"A","text":"Ca、C、Cu","explanation":"正確。依序為Ca、C、Cu，三項都正確。"},{"id":"B","text":"Cu、C、Ca","explanation":"錯誤。第一與第三項把銅鈣對調。"},{"id":"C","text":"C、Ca、Cu","explanation":"錯誤。前兩項把碳與鈣對調。"},{"id":"D","text":"Ca、Cu、C","explanation":"錯誤。後兩項把銅與碳對調。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S022","stem":"氯、鋁、碘三種元素的符號依序為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n氯為Cl、鋁為Al、碘為大寫I。Cl與Al首字母不同；Al與Ag也不是同一記號。碘I只有一個字母，不是鋰Li略寫後的形式。","correct":"B","options":[{"id":"A","text":"Cl、Al、Li","explanation":"錯誤。Li是鋰，碘應I。"},{"id":"B","text":"Cl、Al、I","explanation":"正確。三項分別正確對應氯鋁碘。"},{"id":"C","text":"Al、Cl、I","explanation":"錯誤。把氯與鋁的符號對調。"},{"id":"D","text":"Cl、Ag、I","explanation":"錯誤。Ag是銀，鋁應Al。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S023","stem":"下列元素與符號的配對，何者正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n要將名稱與完整符號相配。氮是N、氦是He、氫是H、鎂是Mg；Na是鈉、Hg是汞，不能只因首字母相近就互相替代。","correct":"C","options":[{"id":"A","text":"氦—H","explanation":"錯誤。H是氫，氦是He。"},{"id":"B","text":"氫—Hg","explanation":"錯誤。Hg是汞，氫是H。"},{"id":"C","text":"鎂—Mg","explanation":"正確。Mg正確表示鎂。"},{"id":"D","text":"氮—Na","explanation":"錯誤。Na是鈉，氮是N。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S024","stem":"下列哪一組都是正確的雙字母元素符號？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n元素符號的大小寫具有固定意義。氯、鋁、矽應寫Cl、Al、Si：第一字母大寫，第二字母小寫；不能因排版習慣把兩字母都大寫或全部小寫。","correct":"D","options":[{"id":"A","text":"cl、al、si","explanation":"錯誤。第一字母應大寫。"},{"id":"B","text":"cL、aL、sI","explanation":"錯誤。大小寫位置顛倒。"},{"id":"C","text":"CL、AL、SI","explanation":"錯誤。第二字母也大寫，違反這些正式符號寫法。"},{"id":"D","text":"Cl、Al、Si","explanation":"正確。Cl、Al、Si均保留正確大小寫。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S025","stem":"下列符號依序為S、Si、Sn，代表哪組元素？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nS是硫，Si是矽，Sn是錫。三個符號都以S開始，但代表不同元素；鈉是Na、銀是Ag，不能按中文讀音或英文首字母任意替換。","correct":"A","options":[{"id":"A","text":"硫、矽、錫","explanation":"正確。三個名稱依序正確。"},{"id":"B","text":"銀、矽、鈉","explanation":"錯誤。S不是銀，Sn不是鈉。"},{"id":"C","text":"矽、硫、鈉","explanation":"錯誤。S與Si被對調，Sn也不是鈉。"},{"id":"D","text":"硫、銀、錫","explanation":"錯誤。Si是矽，不是銀。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S026","stem":"鐵與氟的符號依序是哪一組？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鐵是Fe，氟是F。鐵的e是正式符號的一部分，不能省略；氟雖然只寫一個F，已是完整符號。此題要分清首字母相同而長度不同的兩個記號。","correct":"B","options":[{"id":"A","text":"F、Pb","explanation":"錯誤。F是氟，Pb是鉛，兩項都不符。"},{"id":"B","text":"Fe、F","explanation":"正確。Fe對鐵，F對氟。"},{"id":"C","text":"F、Fe","explanation":"錯誤。把兩個元素對調。"},{"id":"D","text":"Fe、P","explanation":"錯誤。P是磷，並非氟。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S027","stem":"要依序表示「鉀、磷、鉛」，應選哪組符號？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鉀是K、磷是P、鉛是Pb。鉀的英文potassium不使它改用P；鉛的Pb也不能縮成P。這些配對須按固定符號認讀，而非看英文起首決定。","correct":"C","options":[{"id":"A","text":"K、Pb、P","explanation":"錯誤。磷與鉛被互換。"},{"id":"B","text":"K、P、Sn","explanation":"錯誤。Sn是錫，不是鉛。"},{"id":"C","text":"K、P、Pb","explanation":"正確。三項符號依序吻合。"},{"id":"D","text":"P、K、Pb","explanation":"錯誤。鉀與磷被互換。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S028","stem":"銀、汞、鎂的符號依序為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n銀為Ag，汞為Hg，鎂為Mg。末字母同為g不表示它們是同一元素；讀符號時第一字母也不能省略。鋁Al雖與銀Ag相近，仍是不同元素。","correct":"D","options":[{"id":"A","text":"Al、Hg、Mg","explanation":"錯誤。Al是鋁，銀應Ag。"},{"id":"B","text":"Mg、Hg、Ag","explanation":"錯誤。銀與鎂位置對調。"},{"id":"C","text":"Ag、Mg、Hg","explanation":"錯誤。汞與鎂位置對調。"},{"id":"D","text":"Ag、Hg、Mg","explanation":"正確。Ag、Hg、Mg分別代表銀汞鎂。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S029","stem":"若元素清單寫「Li、He、Br」，其名稱依序為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nLi是鋰、He是氦、Br是溴。氫H與氦He須區分；碘I與鋰Li也不能混同。Br則為溴，硫的符號是S。","correct":"A","options":[{"id":"A","text":"鋰、氦、溴","explanation":"正確。三個名稱依序與完整符號相合。"},{"id":"B","text":"鋰、氦、硫","explanation":"錯誤。Br是溴，不是硫。"},{"id":"C","text":"鋰、氫、溴","explanation":"錯誤。He是氦，氫應H。"},{"id":"D","text":"碘、氦、溴","explanation":"錯誤。Li是鋰而非碘。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S030","stem":"下列何者把氧、氮、氫的符號全部配對正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n氧O、氮N、氫H都是單字母符號。Na代表鈉，He代表氦，C代表碳。元素符號雖簡短，增添或替換一個字母仍可能改成另一元素。","correct":"B","options":[{"id":"A","text":"C、N、H","explanation":"錯誤。C是碳，氧應O。"},{"id":"B","text":"O、N、H","explanation":"正確。三個符號均正確。"},{"id":"C","text":"O、Na、H","explanation":"錯誤。Na是鈉，氮應N。"},{"id":"D","text":"O、N、He","explanation":"錯誤。He是氦，氫應H。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S031","stem":"下列元素與符號配對，哪一項需要更正？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n判斷重點是符號代表的元素，而不是格式是否合格。Si格式正確，卻表示矽；硫應用S。其他三項Br、Na、Sn則分別對應溴、鈉、錫。","correct":"C","options":[{"id":"A","text":"鈉—Na","explanation":"錯誤。此配對正確，毋須更正。"},{"id":"B","text":"錫—Sn","explanation":"錯誤。此配對正確，毋須更正。"},{"id":"C","text":"硫—Si","explanation":"正確。這是題目要求找的錯配；Si是矽，硫應S。"},{"id":"D","text":"溴—Br","explanation":"錯誤。此配對正確，毋須更正。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S032","stem":"鈣與氯的元素符號依序為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鈣的正式符號為Ca，氯為Cl。C表示碳，Cu表示銅，兩者不能替代Ca或Cl。辨識元素時要核對完整符號及對應名稱：本題第一項須是鈣Ca，第二項須是氯Cl，兩項都正確才符合題意。","correct":"D","options":[{"id":"A","text":"C、Cl","explanation":"錯誤。C是碳，鈣應為Ca。"},{"id":"B","text":"Ca、C","explanation":"錯誤。C是碳，氯應為Cl。"},{"id":"C","text":"Cu、Cl","explanation":"錯誤。Cu是銅，鈣應為Ca。"},{"id":"D","text":"Ca、Cl","explanation":"正確。Ca表示鈣，Cl表示氯，依序都正確。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S033","stem":"下列哪組「英文名稱—中文—符號」全部一致？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nAluminum是鋁，符號Al。其餘英文名稱分別為Silicon矽Si、Sodium鈉Na、Silver銀Ag，不能因英文的某些字母相似就選同一符號。","correct":"A","options":[{"id":"A","text":"Aluminum—鋁—Al","explanation":"正確。英文中文及符號三者吻合。"},{"id":"B","text":"Silver—矽—Si","explanation":"錯誤。Silver為銀Ag，不是矽Si。"},{"id":"C","text":"Silicon—硫—S","explanation":"錯誤。Silicon為矽Si，不是硫S。"},{"id":"D","text":"Sodium—氮—N","explanation":"錯誤。Sodium為鈉Na，不是氮N。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S034","stem":"元素「碘」的正式符號是哪一個？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n碘用大寫I表示，只有一個字母。Li是鋰、Cl是氯、Br是溴。這題只考名稱與符號對應，不能把字母外形或化學上可能相關當成同一元素。","correct":"B","options":[{"id":"A","text":"Br","explanation":"錯誤。Br表示溴。"},{"id":"B","text":"I","explanation":"正確。I正確表示碘。"},{"id":"C","text":"Li","explanation":"錯誤。Li表示鋰。"},{"id":"D","text":"Cl","explanation":"錯誤。Cl表示氯。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S035","stem":"依序為「氦、氫、汞」的符號，何者正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nHe是氦，H是氫，Hg是汞。三者都以H起首，完整符號卻各不相同；雙字母符號不能縮成H，否則會誤讀成氫。","correct":"C","options":[{"id":"A","text":"He、Hg、H","explanation":"錯誤。氫與汞對調。"},{"id":"B","text":"Hg、H、He","explanation":"錯誤。氦與汞對調。"},{"id":"C","text":"He、H、Hg","explanation":"正確。依序He、H、Hg都正確。"},{"id":"D","text":"H、He、Hg","explanation":"錯誤。氦與氫對調。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S036","stem":"下列哪組元素分別使用「Na、N、Sn」？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nNa是鈉，N是氮，Sn是錫。注意Sn的n位於第二位且小寫，不能把整個Sn當成單字母N或S；磷另外用P表示。","correct":"D","options":[{"id":"A","text":"鈉、氮、硫","explanation":"錯誤。Sn不是硫，硫為S。"},{"id":"B","text":"鈉、磷、錫","explanation":"錯誤。N是氮，磷為P。"},{"id":"C","text":"氮、鈉、錫","explanation":"錯誤。前兩項對調。"},{"id":"D","text":"鈉、氮、錫","explanation":"正確。三項依序正確。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S037","stem":"哪一對元素都使用單字母符號？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n氟F與磷P都使用一個大寫字母。鈣Ca、氯Cl、鋰Li、氦He、鎂Mg、銀Ag則各用兩字母。字母數只描述符號形式，不表示單顆原子大小。","correct":"A","options":[{"id":"A","text":"氟與磷","explanation":"正確。F與P皆單字母。"},{"id":"B","text":"鎂與銀","explanation":"錯誤。Mg與Ag皆雙字母。"},{"id":"C","text":"鈣與氯","explanation":"錯誤。Ca與Cl皆雙字母。"},{"id":"D","text":"鋰與氦","explanation":"錯誤。Li與He皆雙字母。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S038","stem":"下列哪項同時正確寫出「硫」與「矽」的英文名稱及符號？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nSulfur是硫S，Silicon是矽Si；Silver則是銀Ag，Sodium是鈉Na。雖然四個英文都從S開始，符號不能只依起首字母猜測。","correct":"B","options":[{"id":"A","text":"Sulfur—S；Sodium—Si","explanation":"錯誤。Sodium是鈉，不是矽。"},{"id":"B","text":"Sulfur—S；Silicon—Si","explanation":"正確。兩項英文、中文與符號均正確。"},{"id":"C","text":"Sulfur—Si；Silicon—S","explanation":"錯誤。把硫與矽的符號對調。"},{"id":"D","text":"Silver—S；Silicon—Si","explanation":"錯誤。Silver是銀，並不是硫。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S039","stem":"鈉、矽、銀三種元素的符號，依序應為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鈉為Na，矽為Si，銀為Ag。常見混淆是把鈉Na誤成氮N、把矽Si誤成硫S、把銀Ag誤成鋁Al。四組都由有效元素符號組成，必須按題目名稱逐項辨識，不能只看符號外觀是否不同。","correct":"C","options":[{"id":"A","text":"N、Si、Ag","explanation":"錯誤。N是氮，不是鈉。"},{"id":"B","text":"Na、S、Ag","explanation":"錯誤。S是硫，不是矽。"},{"id":"C","text":"Na、Si、Ag","explanation":"正確。Na、Si、Ag分別正確表示鈉、矽、銀。"},{"id":"D","text":"Na、Si、Al","explanation":"錯誤。Al是鋁，不是銀。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S040","stem":"下列元素名稱與符號的四組配對，哪一組全部正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鉛Pb、錫Sn兩者都正確。銅Cu雖正確但鐵應Fe；鈉Na正確但銀應Ag；鎂Mg正確但鉀應K。複合選項必須全部核對，不能只看到一半正確便選。","correct":"D","options":[{"id":"A","text":"銀Al、鈉Na","explanation":"錯誤。銀應Ag，Al是鋁。"},{"id":"B","text":"鉀P、鎂Mg","explanation":"錯誤。鉀應K，P是磷。"},{"id":"C","text":"銅Cu、鐵F","explanation":"錯誤。鐵應Fe，F是氟。"},{"id":"D","text":"鉛Pb、錫Sn","explanation":"正確。Pb為鉛，Sn為錫。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S041","stem":"下列哪組「元素英文名稱—外語來源—符號」配對正確？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nPotassium是鉀，其符號K保留kalium的來源。natrium對應鈉Na、plumbum對應鉛Pb、stannum對應錫Sn，這些外語詞與符號本身雖能成對，卻不能用來表示Potassium。檢查這類三項配對時，要確認英文元素身分、來源詞及正式符號三者一致。","correct":"A","options":[{"id":"A","text":"Potassium—kalium—K","explanation":"正確。Potassium為鉀，kalium與K都對應鉀。"},{"id":"B","text":"Potassium—natrium—Na","explanation":"錯誤。natrium與Na對應Sodium鈉，不是Potassium鉀。"},{"id":"C","text":"Potassium—plumbum—Pb","explanation":"錯誤。plumbum與Pb對應Lead鉛，不是Potassium鉀。"},{"id":"D","text":"Potassium—stannum—Sn","explanation":"錯誤。stannum與Sn對應Tin錫，不是Potassium鉀。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S042","stem":"哪個外語名稱與元素符號配對正確？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\n教材列銀Ag來自argentum。鈉Na來自natrium、錫Sn來自stannum、鉛Pb來自plumbum，不能把來源詞的首字母直接當成完整符號。","correct":"B","options":[{"id":"A","text":"plumbum—P","explanation":"錯誤。plumbum應對Pb，不是磷P。"},{"id":"B","text":"argentum—Ag","explanation":"正確。argentum對銀Ag。"},{"id":"C","text":"natrium—N","explanation":"錯誤。natrium應對Na，不是氮N。"},{"id":"D","text":"stannum—S","explanation":"錯誤。stannum應對Sn，不是硫S。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S043","stem":"銅與鐵的符號分別保留哪兩個外語名稱的來源？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\n銅Cu取自cuprum，鐵Fe取自ferrum。kalium對鉀K，argentum對銀Ag。此處比較的是名稱的歷史對應，不涉及這些元素在週期表的位置或豐度。","correct":"C","options":[{"id":"A","text":"ferrum、cuprum","explanation":"錯誤。兩個來源詞前後倒置。"},{"id":"B","text":"argentum、ferrum","explanation":"錯誤。argentum對銀，不是銅。"},{"id":"C","text":"cuprum、ferrum","explanation":"正確。兩詞依序對應銅與鐵。"},{"id":"D","text":"cuprum、kalium","explanation":"錯誤。kalium對鉀，不是鐵。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S044","stem":"Mercury的符號為Hg。教材給出的外語來源是哪一個？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nMercury是汞，Hg源於hydrargyrum。不能由英文mercury自行改出另一符號；其餘三詞各自對鐵Fe、鉛Pb、鈉Na，並非汞的來源。","correct":"D","options":[{"id":"A","text":"plumbum","explanation":"錯誤。plumbum是鉛Pb的來源。"},{"id":"B","text":"natrium","explanation":"錯誤。natrium是鈉Na的來源。"},{"id":"C","text":"ferrum","explanation":"錯誤。ferrum是鐵Fe的來源。"},{"id":"D","text":"hydrargyrum","explanation":"正確。hydrargyrum對應汞Hg。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S045","stem":"下列哪一項可說明「元素符號不一定直接取自現代英文名稱」？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nSodium為鈉，但符號Na保留natrium的來源，能直接顯示符號可能來自外語名稱。其他選項的符號與所列英文名稱相合，不能用來支持這個特定判斷。","correct":"A","options":[{"id":"A","text":"Sodium使用源自natrium的Na","explanation":"正確。Na與natrium的對應呈現所問例外。"},{"id":"B","text":"Lithium使用Li","explanation":"錯誤。Li與Lithium相合。"},{"id":"C","text":"Carbon使用C","explanation":"錯誤。C與Carbon相合，未顯示題問的外語例子。"},{"id":"D","text":"Helium使用He","explanation":"錯誤。He與Helium相合。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S046","stem":"在週期表中，若要尋找化學性質與某元素較相近的元素，應優先比較哪一組？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n週期表把化學關係密切的元素安排在同一欄，因此應先比較同一直欄的元素。不能把同一橫列與同一欄的分組意義混淆；相對原子質量相近描述的是單顆質量，地殼占比相近描述的是環境豐度，兩者都不能取代同欄所代表的化學關聯。","correct":"B","options":[{"id":"A","text":"與它位於同一橫列的元素","explanation":"錯誤。把橫列與直欄的化學分組意義混淆；同一橫列不是此處優先尋找相關元素的依據。"},{"id":"B","text":"與它位於同一直欄的元素","explanation":"正確。同欄分組正是週期表呈現關係密切元素的方式。"},{"id":"C","text":"與它相對原子質量最接近的元素","explanation":"錯誤。單顆原子質量接近不等於化學性質最相近。"},{"id":"D","text":"與它在地殼中質量百分比最接近的元素","explanation":"錯誤。環境豐度相近不等於元素的化學關係密切。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S047","stem":"已知兩種元素在週期表同一欄，哪項敘述最合理？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n同欄表達元素間的化學關聯，並不提供它們在某環境中的豐度或每顆原子的質量。比較等質量樣品的原子數，仍須分別除以單顆原子質量；因此不能只靠同欄位置，就推定樣品質量或原子個數相等。","correct":"C","options":[{"id":"A","text":"它們在銀河系中的總質量相同","explanation":"錯誤。銀河系總質量屬環境豐度資料，不能由同欄推出。"},{"id":"B","text":"它們每顆原子的質量相同","explanation":"錯誤。同欄不代表單顆原子質量相同。"},{"id":"C","text":"它們在化學上關係密切","explanation":"正確。同欄分組支持兩元素在化學上關係密切。"},{"id":"D","text":"取兩者相同質量時，原子個數一定相同","explanation":"錯誤。等質量原子數還取決於單顆原子質量，同欄不能代替換算。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S048","stem":"甲、乙兩種元素在週期表同欄。各取相同質量的甲、乙比較，哪項判斷最合理？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n題目提供兩個不同層次的條件：同欄支持甲乙化學關係密切；等質量則只表示兩份樣品總質量相同。原子個數須用總質量除以單顆原子質量，兩元素的單顆質量未給定，故不能直接認定顆數相等。應分別檢查化學關聯與顆數比較，兩部分都成立才可選。","correct":"D","options":[{"id":"A","text":"化學關係密切，且兩者原子個數必相等","explanation":"錯誤。化學關聯判斷正確，但等質量不保證原子數相等。"},{"id":"B","text":"化學關係不密切，但兩者原子個數必相等","explanation":"錯誤。同欄支持化學關係密切，且原子數不能由等質量直接判等。"},{"id":"C","text":"化學關係不密切，且原子數仍需單顆質量換算","explanation":"錯誤。原子數仍需換算是正確的，但同欄的化學關聯判斷相反。"},{"id":"D","text":"化學關係密切，但原子數仍需單顆質量換算","explanation":"正確。同欄與等質量兩項條件都被正確解讀。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S049","stem":"人體模型中氧占65%質量，地殼模型中氧占49.5%。各取相同總質量的兩種模型，氧的質量如何比較？","concept":"本教材列出118種已知元素。元素的種類數是在數不同元素有幾種；豐度是在指定環境、指定基準下比較各元素占多少。兩者不能互相替代。同一元素在銀河系、地殼與人體的比例可以不同，主要成分也不必相同。\n\n同一元素在不同環境的質量占比可以不同。設兩模型總質量皆為M，人體模型的氧為0.65M，地殼模型的氧為0.495M，因此人體模型含氧質量較多。比較已知元素的質量，只需該元素分率與樣品總量，無須再知道碳的占比。","correct":"A","options":[{"id":"A","text":"人體模型較多","explanation":"正確。相同總量下，65%對應的氧質量大於49.5%。"},{"id":"B","text":"地殼模型較多","explanation":"錯誤。把較高的氧分率對應環境顛倒。"},{"id":"C","text":"兩種模型相同","explanation":"錯誤。同一元素不代表不同環境中的含量相同。"},{"id":"D","text":"還需要兩種模型的碳占比才能比較","explanation":"錯誤。氧分率與共同總量已足以比較，不需另一元素分率。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-S050","stem":"已知一份樣品中碳與氧的各自質量，要比較兩者的原子個數，應先如何處理各元素的質量？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n每種元素的原子個數與「該元素總質量÷單顆原子質量」成正比。使用相對原子質量作除數，可得到用於比較的相對顆數；若除以樣品總質量，得到的是質量分率；若直接比較兩元素質量，得到的仍是質量比。兩種原子的單顆質量不同，不能省略這一步轉換。","correct":"B","options":[{"id":"A","text":"各自乘以該元素的相對原子質量","explanation":"錯誤。乘以相對原子質量把較重原子再加權，方向與求顆數所需的除法相反。"},{"id":"B","text":"各自除以該元素的相對原子質量","explanation":"正確。除以相對原子質量後，可用所得的相對顆數作比較。"},{"id":"C","text":"各自除以整份樣品的總質量","explanation":"錯誤。除以整份樣品質量得到元素質量分率，不是原子個數。"},{"id":"D","text":"直接把碳與氧的質量作比","explanation":"錯誤。直接作比只得到碳氧質量比，尚未校正兩種原子的單顆質量差異。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-2-topic03-G03-B001","stem":"某銀河系元素組成模型總質量62.5 kg，氫74%、氦24%、其他2%，皆按質量。氫的質量為多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n把74%寫成0.74，再乘模型總量62.5 kg，得到氫質量46.25 kg。氦為15.00 kg、其他1.25 kg，三者合計62.5 kg，可用來核對計算與元素對應。","correct":"A","options":[{"id":"A","text":"46.25 kg","explanation":"正確。62.5×0.74=46.25 kg。"},{"id":"B","text":"61.25 kg","explanation":"錯誤。此為氫與氦合計。"},{"id":"C","text":"1.25 kg","explanation":"錯誤。此為其他元素合計。"},{"id":"D","text":"15.00 kg","explanation":"錯誤。此為氦的質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B002","stem":"某25 kg組成模型採氫74%、氦24%、其他2%的質量比例。氦應占多少質量？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n本題指定氦，應用0.24而非氫的0.74。25×0.24=6.0 kg；其餘兩部分為18.5與0.5 kg，合計正好25 kg。","correct":"B","options":[{"id":"A","text":"0.5 kg","explanation":"錯誤。0.5 kg是其他。"},{"id":"B","text":"6.0 kg","explanation":"正確。氦占25的24%，為6.0 kg。"},{"id":"C","text":"24.5 kg","explanation":"錯誤。24.5 kg是氫氦合計。"},{"id":"D","text":"18.5 kg","explanation":"錯誤。18.5 kg是氫。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B003","stem":"組成模型中，氫185 kg，且氫占模型總質量74%。模型總質量約為多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n氫質量＝總質量×0.74，因此總量＝185÷0.74=250 kg。反算250×0.74可回到185 kg；總量應大於其中的氫質量，不能再把185乘0.74。","correct":"C","options":[{"id":"A","text":"74 kg","explanation":"錯誤。74是百分數，不是總質量。"},{"id":"B","text":"136.9 kg","explanation":"錯誤。這是將氫質量再乘0.74，求錯方向。"},{"id":"C","text":"250 kg","explanation":"正確。250 kg的74%為185 kg。"},{"id":"D","text":"185 kg","explanation":"錯誤。185 kg只是氫部分，未含其餘26%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B004","stem":"銀河系組成的模型中，氦占24%質量，實際配置氦72 kg。若氫占74%，則氫質量應為多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n先由氦求模型總量72÷0.24=300 kg，再求氫300×0.74=222 kg。也可用氫對氦的質量比74：24，計算72×74/24。剩餘其他為6 kg，三者合計300 kg。","correct":"D","options":[{"id":"A","text":"300 kg","explanation":"錯誤。300 kg是總量，不是氫量。"},{"id":"B","text":"6 kg","explanation":"錯誤。6 kg是其他元素。"},{"id":"C","text":"53.28 kg","explanation":"錯誤。把氦72 kg誤當模型總量。"},{"id":"D","text":"222 kg","explanation":"正確。依同一總量換算得222 kg。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B005","stem":"80 kg模型採銀河系氫74%、氦24%的質量比例。氫與氦以外的元素合計多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n未列比例為100%−74%−24%=2%。80×0.02=1.6 kg。19.2 kg為氦，20.8 kg則是所有非氫成分，不能把氦也算成氫氦以外。","correct":"A","options":[{"id":"A","text":"1.6 kg","explanation":"正確。80的2%為1.6 kg。"},{"id":"B","text":"19.2 kg","explanation":"錯誤。只算到氦。"},{"id":"C","text":"20.8 kg","explanation":"錯誤。非氫部分仍包含氦。"},{"id":"D","text":"78.4 kg","explanation":"錯誤。這是氫與氦的總和。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B006","stem":"氫、氦分別占某組成模型總質量74%、24%。兩者質量比H：He的最簡整數比為何？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n相同分母可消去，所以質量比為74：24，兩項同除以2後為37：12。這個比只比較氫與氦，不需把其他元素放入分母，也不能讀成原子個數比。","correct":"B","options":[{"id":"A","text":"12：37","explanation":"錯誤。將氫氦次序顛倒。"},{"id":"B","text":"37：12","explanation":"正確。74：24約分為37：12。"},{"id":"C","text":"37：50","explanation":"錯誤。37：50是氫對全部質量。"},{"id":"D","text":"12：49","explanation":"錯誤。12：49是氦對氫氦合計。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B007","stem":"某模型的質量分布為氫74%、氦24%、其他2%。氦的總質量是其他元素合計的幾倍？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n比較兩部分時可直接除質量分率：24%÷2%=12。這不表示氦原子每顆比其他原子重12倍，因為比較的兩者都是各類元素的總質量。","correct":"C","options":[{"id":"A","text":"2倍","explanation":"錯誤。把其他2%的數字直接當倍率。"},{"id":"B","text":"1/12倍","explanation":"錯誤。這是其他對氦2/24的倍率，比較方向相反。"},{"id":"C","text":"12倍","explanation":"正確。24÷2=12，分母為其他合計。"},{"id":"D","text":"24倍","explanation":"錯誤。24%不是相對其他的倍數。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B008","stem":"某元素模型中氫74%、氦24%、其他2%，皆按質量。只把氫與氦合為一個比較子集，氦在此子集中約占多少質量百分比？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n分母改為氫氦合計98份質量，氦仍為24份，因此24÷98×100%約24.5%。排除其他後分母縮小，所以氦分率略大於占原整體的24%。","correct":"D","options":[{"id":"A","text":"24.0%","explanation":"錯誤。這仍使用原整體分母100。"},{"id":"B","text":"32.4%","explanation":"錯誤。24/74比較的是氦對氫。"},{"id":"C","text":"75.5%","explanation":"錯誤。75.5%是氫在該子集的比例。"},{"id":"D","text":"24.5%","explanation":"正確。24/98約為24.5%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B009","stem":"某模型氫占74%質量，其餘全部元素占26%。若氫質量為148 kg，非氫部分應為多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n148 kg是總量的0.74，因此總量200 kg，非氫質量200−148=52 kg。亦可算148×26/74=52 kg；比例基準是總量，不是再取氫質量的26%。","correct":"A","options":[{"id":"A","text":"52 kg","explanation":"正確。52 kg占總量200 kg的26%。"},{"id":"B","text":"200 kg","explanation":"錯誤。200 kg是全部模型。"},{"id":"C","text":"26 kg","explanation":"錯誤。把百分比數字當成質量。"},{"id":"D","text":"38.48 kg","explanation":"錯誤。148×0.26把氫量誤作總量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B010","stem":"甲模型總質量20 kg且氫占74%；乙模型總質量50 kg且氫占10%。甲的氫質量比乙多多少？","concept":"銀河系的這組豐度是質量百分比：氫約74%、氦約24%，其餘元素合計約2%。百分比的分母是整體質量；單一元素質量＝總質量×該元素百分比÷100。合計時相加，求剩餘時由100%扣除已知部分。\n\n分別算出氫量再比較：甲20×0.74=14.8 kg，乙50×0.10=5.0 kg，差9.8 kg。總量不同，不能直接用74−10作質量差。","correct":"B","options":[{"id":"A","text":"14.8 kg","explanation":"錯誤。14.8 kg是甲的氫量，尚未扣除乙的5.0 kg。"},{"id":"B","text":"9.8 kg","explanation":"正確。14.8−5.0=9.8 kg。"},{"id":"C","text":"12.8 kg","explanation":"錯誤。誤把乙算成20 kg模型的氫量2 kg。"},{"id":"D","text":"64 kg","explanation":"錯誤。64是百分點差，不能直接附kg。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文3。","example":"","pointId":"EL-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B011","stem":"一份240 g地殼組成模型中，矽質量占25.7%。矽的質量為多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n先將25.7%化成0.257，乘240 g得到61.68 g。相同比例只在總量100 g時才恰好對應25.7 g；此模型總量不同，需實際換算。","correct":"C","options":[{"id":"A","text":"25.7 g","explanation":"錯誤。誤把100 g基準直接套到240 g。"},{"id":"B","text":"6.168 g","explanation":"錯誤。這是正確矽質量的十分之一，百分比小數點錯位。"},{"id":"C","text":"61.68 g","explanation":"正確。240×0.257=61.68 g。"},{"id":"D","text":"118.8 g","explanation":"錯誤。118.8 g是按氧49.5%算的值。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B012","stem":"地殼組成模型總質量80 g，鋁占7.5%質量。鋁質量為多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n鋁7.5%即0.075，80×0.075=6.0 g。檢查6/80=0.075，可還原百分比。百分號表示除以100，不能把7.5%當0.75。","correct":"D","options":[{"id":"A","text":"7.5 g","explanation":"錯誤。只有100 g總量才對應7.5 g。"},{"id":"B","text":"60 g","explanation":"錯誤。把7.5%放大成75%。"},{"id":"C","text":"0.6 g","explanation":"錯誤。比正確值少十倍。"},{"id":"D","text":"6.0 g","explanation":"正確。6/80=7.5%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B013","stem":"某地殼模型中，鐵為14.1 g且占總質量4.7%。總質量約為多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n以鐵為部分，有0.047×總量=14.1 g，所以總量14.1÷0.047=300 g。300×4.7%=14.1 g，可核對所求為總量而不是鐵量。","correct":"A","options":[{"id":"A","text":"300 g","explanation":"正確。300 g的4.7%為14.1 g。"},{"id":"B","text":"470 g","explanation":"錯誤。470 g的4.7%並非14.1 g。"},{"id":"C","text":"66.27 g","explanation":"錯誤。14.1×4.7不是百分比反算。"},{"id":"D","text":"200 g","explanation":"錯誤。200 g的4.7%只有9.4 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B014","stem":"地殼模型中鈣占3.4%質量。若模型總質量50 g，鈣的質量為何？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n把3.4%換為0.034，50×0.034=1.7 g。其餘元素合計48.3 g，兩者加回50 g；鈣不應因題面數字3.4而直接填3.4 g。","correct":"B","options":[{"id":"A","text":"17 g","explanation":"錯誤。把3.4%誤用為34%。"},{"id":"B","text":"1.7 g","explanation":"正確。50×0.034=1.7 g。"},{"id":"C","text":"3.4 g","explanation":"錯誤。忽略總量不是100 g。"},{"id":"D","text":"48.3 g","explanation":"錯誤。這是非鈣元素合計。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B015","stem":"某地殼模型的氧為99 g，氧質量分率為49.5%。此模型總質量為何？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n氧49.5%即0.495，總量99÷0.495=200 g。非氧部分為200−99=101 g，略多於氧，與氧不到50%的比例相符。","correct":"C","options":[{"id":"A","text":"49.005 g","explanation":"錯誤。把已知氧量再乘0.495，方向錯誤。"},{"id":"B","text":"99 g","explanation":"錯誤。99 g僅是氧部分。"},{"id":"C","text":"200 g","explanation":"正確。200×0.495可驗得99 g。"},{"id":"D","text":"101 g","explanation":"錯誤。101 g是非氧部分。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B016","stem":"一份125 g地殼模型，O、Si、Al、Fe、Ca分別占49.5%、25.7%、7.5%、4.7%、3.4%質量。五種合計為多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n先把五種分率相加為90.8%，再乘125 g：125×0.908=113.5 g。其餘元素占9.2%，為11.5 g，兩部分相加才是全部125 g。","correct":"D","options":[{"id":"A","text":"90.8 g","explanation":"錯誤。90.8是百分數，不是125 g模型中的質量。"},{"id":"B","text":"11.5 g","explanation":"錯誤。這是其他元素。"},{"id":"C","text":"125 g","explanation":"錯誤。125 g包含其他元素。"},{"id":"D","text":"113.5 g","explanation":"正確。五項90.8%乘125為113.5 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B017","stem":"地殼模型總質量250 g，其他未單列元素合計9.2%質量。這些元素共多少質量？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n9.2%代表所有未單列元素合計占0.092。250×0.092=23 g。不能把23 g再分別給每一種未單列元素，也不能無資料假設它們等量。","correct":"A","options":[{"id":"A","text":"23 g","explanation":"正確。250×0.092=23 g。"},{"id":"B","text":"2.3 g","explanation":"錯誤。比正確值少十倍。"},{"id":"C","text":"9.2 g","explanation":"錯誤。把百分數直接當公克。"},{"id":"D","text":"227 g","explanation":"錯誤。這是主要五種的合計質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B018","stem":"50 g地殼模型中，氧49.5%、矽25.7%，皆按質量。氧與矽合計多少質量？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n氧與矽的分率合計49.5%+25.7%=75.2%。乘50 g得37.60 g；也可分別算氧24.75 g、矽12.85 g後相加。","correct":"B","options":[{"id":"A","text":"24.75 g","explanation":"錯誤。只有氧質量。"},{"id":"B","text":"37.60 g","explanation":"正確。24.75+12.85=37.60 g。"},{"id":"C","text":"75.20 g","explanation":"錯誤。把合計百分數當質量，漏了50 g總量。"},{"id":"D","text":"12.85 g","explanation":"錯誤。只有矽質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B019","stem":"125 g地殼模型中矽25.7%、鋁7.5%，皆按質量。矽與鋁合計應為多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n合計比例為25.7%+7.5%=33.2%。125×0.332=41.50 g。單算矽為32.125 g、鋁為9.375 g，相加可再次核對。","correct":"C","options":[{"id":"A","text":"33.20 g","explanation":"錯誤。33.2是百分數，而本模型不是100 g。"},{"id":"B","text":"32.125 g","explanation":"錯誤。只算矽。"},{"id":"C","text":"41.50 g","explanation":"正確。32.125+9.375=41.50 g。"},{"id":"D","text":"9.375 g","explanation":"錯誤。只算鋁。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B020","stem":"200 g地殼模型中鐵4.7%、鈣3.4%，皆按質量。兩種金屬的合計質量為何？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n鐵與鈣合計8.1%質量，因此200×0.081=16.2 g。分別為9.4 g與6.8 g，加總亦為16.2 g；兩元素比例可相加是因同一總量且沒有重疊。","correct":"D","options":[{"id":"A","text":"8.1 g","explanation":"錯誤。漏了總量200 g的倍數。"},{"id":"B","text":"9.4 g","explanation":"錯誤。只有鐵。"},{"id":"C","text":"6.8 g","explanation":"錯誤。只有鈣。"},{"id":"D","text":"16.2 g","explanation":"正確。兩元素質量相加16.2 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B021","stem":"地殼模型氧占49.5%質量，其餘全部元素合計50.5%。氧對非氧的質量比最簡為何？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n以同一總量消去分母，氧對非氧為49.5：50.5；兩項同乘2得99：101。氧略少於非氧，不能把接近各半當成精確相等。","correct":"A","options":[{"id":"A","text":"99：101","explanation":"正確。49.5：50.5化為99：101。"},{"id":"B","text":"101：99","explanation":"錯誤。把次序顛倒。"},{"id":"C","text":"49.5：100","explanation":"錯誤。這是氧對總量，非題目所問。"},{"id":"D","text":"1：1","explanation":"錯誤。接近不表示相等。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B022","stem":"地殼中氧49.5%、矽25.7%，皆按質量。只以「非氧部分」為比較整體，矽約占其質量多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n非氧占原總量100−49.5=50.5%。矽在此子集的比例為25.7÷50.5×100%，約50.9%。分母是非氧50.5，而非氧單項49.5或原總量100。","correct":"B","options":[{"id":"A","text":"25.7%","explanation":"錯誤。仍是占原總體的比例。"},{"id":"B","text":"50.9%","explanation":"正確。25.7/50.5約50.9%。"},{"id":"C","text":"51.9%","explanation":"錯誤。25.7/49.5約51.9%，用了氧作分母。"},{"id":"D","text":"74.3%","explanation":"錯誤。74.3%是原整體的非矽比例。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B023","stem":"完整地殼質量表中已知O 49.5%、Al 7.5%、Fe 4.7%、Ca 3.4%、其他9.2%，只有Si數值缺失。Si應為多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n完整質量表總和必為100%。已知項合計49.5+7.5+4.7+3.4+9.2=74.3，因此Si為100−74.3=25.7%。其他9.2%已是獨立一類，不能漏加或重分。","correct":"C","options":[{"id":"A","text":"9.2%","explanation":"錯誤。9.2%是其他類別，不能等同矽。"},{"id":"B","text":"16.5%","explanation":"錯誤。把其他9.2%重複扣了一次。"},{"id":"C","text":"25.7%","explanation":"正確。補25.7%後各項正好100%。"},{"id":"D","text":"74.3%","explanation":"錯誤。74.3%是已知合計。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B024","stem":"地殼模型氧49.5%、全部非氧元素50.5%，皆按質量。300 g模型中非氧比氧多多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n非氧與氧差50.5−49.5=1.0個百分點，對300 g模型為300×0.01=3.0 g。氧148.5 g、非氧151.5 g，相減也為3.0 g。","correct":"D","options":[{"id":"A","text":"1.0 g","explanation":"錯誤。1.0是百分點差，不是300 g模型的質量差。"},{"id":"B","text":"148.5 g","explanation":"錯誤。這是氧本身質量。"},{"id":"C","text":"151.5 g","explanation":"錯誤。這是非氧本身質量。"},{"id":"D","text":"3.0 g","explanation":"正確。151.5−148.5=3.0 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B025","stem":"250 g地殼模型中氧占49.5%、矽占25.7%質量。氧的質量比矽多多少？","concept":"此處地殼資料的統計範圍包括海洋與大氣，按質量計為氧49.5%、矽25.7%、鋁7.5%、鐵4.7%、鈣3.4%、其他9.2%。前五種合計90.8%。Other是多種未單列元素的合計，不能把它當一種元素或平均分配給未知成分。\n\n同一模型兩部分的質量差可用分率差乘總量：(0.495−0.257)×250=0.238×250=59.5 g。也可用氧123.75 g減去矽64.25 g核對。","correct":"A","options":[{"id":"A","text":"59.5 g","explanation":"正確。123.75−64.25=59.5 g。"},{"id":"B","text":"64.25 g","explanation":"錯誤。這是矽質量。"},{"id":"C","text":"123.75 g","explanation":"錯誤。這是氧質量。"},{"id":"D","text":"23.8 g","explanation":"錯誤。23.8是百分點差。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2。","example":"","pointId":"EL-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B026","stem":"一個人體元素組成模型總質量72 kg，氧占65%質量。模型中氧的質量為多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n氧質量為72×0.65=46.8 kg。這是所有含氧成分中的氧元素質量貢獻，計算時以72 kg總量為分母基準；不可把碳或氫的比例誤用到氧。","correct":"B","options":[{"id":"A","text":"12.96 kg","explanation":"錯誤。按碳18%得到12.96 kg。"},{"id":"B","text":"46.8 kg","explanation":"正確。72的65%為46.8 kg。"},{"id":"C","text":"7.2 kg","explanation":"錯誤。按氫10%得到7.2 kg。"},{"id":"D","text":"50.4 kg","explanation":"錯誤。對應70%，不是所給65%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B027","stem":"55 kg人體組成模型中，碳占18%質量。碳應有多少質量？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n碳占18%即0.18，55×0.18=9.9 kg。用9.9÷55可驗得0.18；18是百分數而不是不隨總量改變的公斤數。","correct":"C","options":[{"id":"A","text":"18 kg","explanation":"錯誤。把百分數誤當質量。"},{"id":"B","text":"0.99 kg","explanation":"錯誤。9.9 kg再縮小十倍，小數位錯誤。"},{"id":"C","text":"9.9 kg","explanation":"正確。9.9/55=18%。"},{"id":"D","text":"5.5 kg","explanation":"錯誤。這是按氫10%算出的質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B028","stem":"48 kg人體組成模型中，氫占10%質量。氫的質量為何？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n10%=0.10，48×0.10=4.8 kg。其餘元素合計90%，為43.2 kg，兩部分加回48 kg。這題求質量，不需原子質量或個數換算。","correct":"D","options":[{"id":"A","text":"0.48 kg","explanation":"錯誤。這是48的1%，少十倍。"},{"id":"B","text":"10 kg","explanation":"錯誤。10是百分數，不是所求公斤數。"},{"id":"C","text":"43.2 kg","explanation":"錯誤。這是非氫質量。"},{"id":"D","text":"4.8 kg","explanation":"正確。48的十分之一為4.8 kg。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B029","stem":"一份總質量1200 g的人體組成模型，O 65%、C 18%、H 10%、其他7%。其他元素合計為多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n其他元素占0.07，因此1200×0.07=84 g。主要三種占0.93、共1116 g，合計1200 g。Other只給合計，不提供其中各元素獨立含量。","correct":"A","options":[{"id":"A","text":"84 g","explanation":"正確。1200的7%為84 g。"},{"id":"B","text":"1116 g","explanation":"錯誤。這是氧碳氫合計。"},{"id":"C","text":"120 g","explanation":"錯誤。這是氫10%的質量。"},{"id":"D","text":"7 g","explanation":"錯誤。漏了模型總量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B030","stem":"某人體組成模型氧質量39 kg，且氧占65%質量。模型總質量為何？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n設總量M，0.65M=39 kg，故M=39÷0.65=60 kg。部分39 kg小於全部60 kg；乘0.65只能再取部分，不能反求全部。","correct":"B","options":[{"id":"A","text":"39 kg","explanation":"錯誤。39 kg只為氧。"},{"id":"B","text":"60 kg","explanation":"正確。60×0.65=39 kg，吻合。"},{"id":"C","text":"65 kg","explanation":"錯誤。65是比例中的數字，非此模型總量。"},{"id":"D","text":"25.35 kg","explanation":"錯誤。把39再乘0.65，方向相反。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B031","stem":"某人體組成模型碳為12.6 kg，碳占18%質量。總質量為多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n總量＝部分÷分率，所以12.6÷0.18=70 kg。核對70×18%=12.6 kg；即使模型含其他元素，也不必知道每種的個別比例便能反算。","correct":"C","options":[{"id":"A","text":"2.268 kg","explanation":"錯誤。這是將部分再乘分率。"},{"id":"B","text":"18 kg","explanation":"錯誤。18是百分數，不是由12.6 kg反求的總量。"},{"id":"C","text":"70 kg","explanation":"正確。70的18%正好12.6。"},{"id":"D","text":"126 kg","explanation":"錯誤。這是誤用10%得到的總量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B032","stem":"人體組成模型中，氫8 kg且占10%質量；其他元素合計占7%。其他元素應有多少質量？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n先由氫得總量8÷0.10=80 kg，再求其他80×0.07=5.6 kg。0.56 kg是把氫8 kg誤當全部而取7%的結果。","correct":"D","options":[{"id":"A","text":"72 kg","explanation":"錯誤。72 kg是全部非氫元素。"},{"id":"B","text":"0.56 kg","explanation":"錯誤。分母基準錯，把氫量當總量。"},{"id":"C","text":"7 kg","explanation":"錯誤。7是百分數，未乘總量。"},{"id":"D","text":"5.6 kg","explanation":"正確。80 kg總量的7%為5.6 kg。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B033","stem":"80 kg人體組成模型中，氧65%、碳18%，皆按質量。氧與碳合計為多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n氧碳合計65%+18%=83%，80×0.83=66.4 kg。分別算氧52 kg與碳14.4 kg亦可核對。相加的是同一模型的不同元素質量貢獻。","correct":"A","options":[{"id":"A","text":"66.4 kg","explanation":"正確。52+14.4=66.4 kg。"},{"id":"B","text":"14.4 kg","explanation":"錯誤。只算碳。"},{"id":"C","text":"83 kg","explanation":"錯誤。83為合計百分數，非80 kg模型中的質量。"},{"id":"D","text":"52 kg","explanation":"錯誤。只算氧。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B034","stem":"50 kg人體組成模型中，碳18%、氫10%，皆按質量。碳與氫合計多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n同一總量下兩元素分率相加為28%。50×0.28=14 kg，亦等於碳9 kg加氫5 kg。不能把18%與10%相乘，因為它們是並列成分而非連續取比例。","correct":"B","options":[{"id":"A","text":"5 kg","explanation":"錯誤。只有氫。"},{"id":"B","text":"14 kg","explanation":"正確。9+5=14 kg。"},{"id":"C","text":"28 kg","explanation":"錯誤。28是百分數，未按50 kg換算。"},{"id":"D","text":"9 kg","explanation":"錯誤。只有碳。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B035","stem":"120 kg人體元素組成模型中，氧65%、碳18%、氫10%，其餘7%。主要三種元素合計質量為何？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n三種合計93%，故120×0.93=111.6 kg；其他元素8.4 kg補足全部120 kg。合計超過90%的敘述可以作合理性檢查，不能直接把90當精確分率。","correct":"C","options":[{"id":"A","text":"120 kg","explanation":"錯誤。含了其他元素，不是指定三種。"},{"id":"B","text":"93 kg","explanation":"錯誤。把合計百分數當質量。"},{"id":"C","text":"111.6 kg","explanation":"正確。111.6 kg占120 kg的93%。"},{"id":"D","text":"8.4 kg","explanation":"錯誤。這是其他7%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B036","stem":"一個60 kg人體組成模型中，氧占65%質量。全部非氧元素合計多少質量？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n非氧分率為100%−65%=35%，所以60×0.35=21 kg。氧本身為39 kg；39+21=60 kg，可確認所算是互補部分。","correct":"D","options":[{"id":"A","text":"39 kg","explanation":"錯誤。這是氧65%的質量。"},{"id":"B","text":"35 kg","explanation":"錯誤。35為百分數。"},{"id":"C","text":"60 kg","explanation":"錯誤。總量包含氧，並非非氧部分。"},{"id":"D","text":"21 kg","explanation":"正確。60的35%為21 kg。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B037","stem":"人體組成模型中，碳占18%、氫占10%，皆按質量。碳的質量為氫的幾倍？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n相同整體分母相消，碳對氫總質量比為18/10=1.8。這不表示碳原子數是氫的1.8倍，因為個數比較還要各除以單顆原子質量。","correct":"A","options":[{"id":"A","text":"1.8倍","explanation":"正確。18÷10=1.8。"},{"id":"B","text":"8倍","explanation":"錯誤。8是百分點差，並非倍數。"},{"id":"C","text":"28倍","explanation":"錯誤。28是合計百分數。"},{"id":"D","text":"0.56倍","explanation":"錯誤。約為氫對碳的反比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B038","stem":"某組成模型維持人體O：C：H質量比65：18：10。若碳取3.6 g，氧應取多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n碳18份對3.6 g，一份是0.2 g，因此氧65份為13.0 g。也可用3.6×65/18。此題只用指定元素間的比例，不需知道其他元素占比或全部質量。","correct":"B","options":[{"id":"A","text":"2.0 g","explanation":"錯誤。這是相同比例下的氫10份。"},{"id":"B","text":"13.0 g","explanation":"正確。3.6×65/18=13.0 g。"},{"id":"C","text":"6.5 g","explanation":"錯誤。相當於每份0.1 g，不符碳量。"},{"id":"D","text":"65.0 g","explanation":"錯誤。把65份直接當65 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B039","stem":"人體資料O 65%、C 18%、H 10%、其他7%，皆按質量。若只比較O、C、H三種，氧約占三者總質量多少？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n限定三者後，分母為65+18+10=93份，而氧65份不變。65/93×100%約69.9%。這是氧在子集的占比，不能再稱它是占整個人體的百分比。","correct":"C","options":[{"id":"A","text":"93.0%","explanation":"錯誤。93是三者占原整體。"},{"id":"B","text":"65.0%","explanation":"錯誤。這是氧占原整體。"},{"id":"C","text":"69.9%","explanation":"正確。65/93約69.9%。"},{"id":"D","text":"83.0%","explanation":"錯誤。83是原整體中的氧碳合計。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B040","stem":"人體質量分布O 65%、C 18%、H 10%、其他7%。若只看非氧部分，碳占其中的質量比例約為何？","concept":"教材的人體近似組成按質量計為氧65%、碳18%、氫10%、其他7%。氧、碳、氫合計93%；這是各元素對模型總質量的貢獻。百分比乘總質量可求某元素的質量，不能直接當原子個數百分比。\n\n非氧總量為35份，碳18份，因此18÷35×100%約51.4%。18/65比較碳對氧；18/28則比較碳在碳氫子集，兩者都不是本題分母。","correct":"D","options":[{"id":"A","text":"64.3%","explanation":"錯誤。18/28只計碳氫子集。"},{"id":"B","text":"18.0%","explanation":"錯誤。仍以100份全體作分母。"},{"id":"C","text":"27.7%","explanation":"錯誤。18/65是碳對氧比。"},{"id":"D","text":"51.4%","explanation":"正確。18/35約51.4%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B041","stem":"甲模型總質量40 kg、氧65%；乙模型總質量80 kg、氧49.5%，皆按質量。何者氧質量較大，差多少？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n甲氧40×0.65=26 kg，乙氧80×0.495=39.6 kg，所以乙多13.6 kg。百分比較低的一份只要總量較大，所含氧質量仍可能更多，故不能只比較65與49.5。","correct":"A","options":[{"id":"A","text":"乙多13.6 kg","explanation":"正確。乙39.6−甲26=13.6 kg。"},{"id":"B","text":"甲多13.6 kg","explanation":"錯誤。差值數字對但多的一方相反。"},{"id":"C","text":"乙多39.6 kg","explanation":"錯誤。39.6 kg是乙全部氧量，未扣甲。"},{"id":"D","text":"甲多15.5 kg","explanation":"錯誤。15.5是百分點差，且甲絕對量較少。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B042","stem":"將兩份元素組成模型的質量帳合併：甲100 g含氧65 g；乙300 g含氧148.5 g。合併後氧的質量百分比約為何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n先合計氧65+148.5=213.5 g，總量100+300=400 g。213.5/400×100%=53.375%。兩份總量不同，不能把65%與49.5%直接取算術平均。","correct":"B","options":[{"id":"A","text":"57.25%","explanation":"錯誤。是兩個百分數直接平均，忽略乙較重。"},{"id":"B","text":"53.375%","explanation":"正確。213.5/400=53.375%。"},{"id":"C","text":"65%","explanation":"錯誤。只保留甲比例。"},{"id":"D","text":"49.5%","explanation":"錯誤。只保留乙比例。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B043","stem":"甲、乙兩份模型各200 g，氧分別占65%與49.5%。合併質量帳後，氧占比多少？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n甲氧130 g、乙氧99 g，合計229 g；總量400 g，所以229/400=57.25%。因兩份等重，這次可以將65與49.5平均；等重條件才使此捷徑成立。","correct":"C","options":[{"id":"A","text":"15.5%","explanation":"錯誤。這是兩分率的差值。"},{"id":"B","text":"32.5%","explanation":"錯誤。只算甲氧占合併整體，漏乙的氧。"},{"id":"C","text":"57.25%","explanation":"正確。229/400=57.25%。"},{"id":"D","text":"114.5%","explanation":"錯誤。將分率直接相加，未擴大分母。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B044","stem":"兩模型均含氧13 g。甲氧占65%質量，乙氧占49.5%質量。下列總質量比較何者正確？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n同樣13 g氧，甲總量13/0.65=20 g；乙總量13/0.495約26.26 g。固定部分質量時，占比較小表示分母較大，因此乙總量較大。","correct":"D","options":[{"id":"A","text":"無法比較","explanation":"錯誤。有部分質量與各自分率，可求總量。"},{"id":"B","text":"甲較大","explanation":"錯誤。甲占比較高，所需總量反而較小。"},{"id":"C","text":"兩者相同","explanation":"錯誤。氧量相同不代表全部質量相同。"},{"id":"D","text":"乙較大","explanation":"正確。乙約26.26 g，大於甲20 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B045","stem":"元素組成模型中氧52 g、其餘28 g。氧的質量百分比為何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n總量必須把氧與其餘都計入：52+28=80 g。氧分率52/80=0.65，即65%。52/28是氧對非氧比，而不是氧占整體。","correct":"A","options":[{"id":"A","text":"65%","explanation":"正確。52/(52+28)=65%。"},{"id":"B","text":"35%","explanation":"錯誤。這是其餘占比。"},{"id":"C","text":"185.7%","explanation":"錯誤。約為52/28×100%，分母用錯。"},{"id":"D","text":"52%","explanation":"錯誤。把氧克數當百分數。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B046","stem":"人體模型中氧為1.3 kg、全部質量2000 g；已知1 kg=1000 g。氧質量百分比為何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n先把氧1.3 kg換成1300 g，使部分與整體同單位。1300/2000×100%=65%。百分比是無單位的比值，但相除前兩質量仍須用一致單位。","correct":"B","options":[{"id":"A","text":"6.5%","explanation":"錯誤。比正確結果少十倍。"},{"id":"B","text":"65%","explanation":"正確。1300/2000=0.65。"},{"id":"C","text":"650%","explanation":"錯誤。超過整體100%，亦顯示換算錯誤。"},{"id":"D","text":"0.065%","explanation":"錯誤。直接把1.3與2000相除，漏公斤換算。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B047","stem":"若在同一質量基準下，模型甲氧占65%，模型乙氧占49.5%，兩者氧分率相差多少個百分點？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n百分點差直接用65−49.5=15.5。若改求相對乙增加多少百分比，才用15.5/49.5×100%約31.3%；兩個問法的分母與名稱不同。","correct":"C","options":[{"id":"A","text":"31.3","explanation":"錯誤。這是相對乙的增加百分比，非百分點差。"},{"id":"B","text":"114.5","explanation":"錯誤。這是兩數相加。"},{"id":"C","text":"15.5","explanation":"正確。兩個百分數相減即15.5個百分點。"},{"id":"D","text":"23.8","explanation":"錯誤。23.8是地殼氧矽數據的差，非本題。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B048","stem":"甲模型碳占18%質量且總量50 g，乙模型碳占9%質量且總量100 g。兩者碳的質量比甲：乙為何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n甲碳50×0.18=9 g，乙碳100×0.09=9 g，因此比為1：1。乙占比雖只有甲的一半，總量卻是兩倍，兩個因素正好抵消。","correct":"D","options":[{"id":"A","text":"4：1","explanation":"錯誤。把兩個因素都朝同方向相乘。"},{"id":"B","text":"2：1","explanation":"錯誤。只比較18%與9%，漏總量。"},{"id":"C","text":"1：2","explanation":"錯誤。只比較總量50與100，漏分率。"},{"id":"D","text":"1：1","explanation":"正確。兩者都9 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B049","stem":"某元素組成模型中氫6 g、氧32 g、碳12 g。氫的質量百分比為何？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n質量整體為6+32+12=50 g，氫6 g，故6/50=12%。這裡只求質量比例，不必除相對原子質量；6/32和6/12分別只是氫對某一元素的質量比。","correct":"A","options":[{"id":"A","text":"12%","explanation":"正確。6/50=12%。"},{"id":"B","text":"18.75%","explanation":"錯誤。這是氫對氧比。"},{"id":"C","text":"50%","explanation":"錯誤。這是氫對碳比。"},{"id":"D","text":"6%","explanation":"錯誤。把6 g直接當6%，等同未經題意就假定總量100 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B050","stem":"甲20 g含氫2 g；乙30 g含氫6 g。合併元素質量帳後，氫質量百分比是多少？","concept":"質量百分比＝指定元素質量÷指定整體質量×100%。比較前要先確認分子代表哪個元素、分母代表哪個整體。百分比相同不保證元素的實際質量相同；合併不同總量的資料時，應先加元素質量與總質量，再求比例。\n\n合計氫2+6=8 g，總量20+30=50 g，所以8/50=16%。甲10%、乙20%的直接平均15%忽略兩份質量不同。","correct":"B","options":[{"id":"A","text":"15%","explanation":"錯誤。兩百分數直接平均，未按總量加權。"},{"id":"B","text":"16%","explanation":"正確。8/50=16%。"},{"id":"C","text":"20%","explanation":"錯誤。只用乙的比例。"},{"id":"D","text":"8%","explanation":"錯誤。把8 g當成8%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文2、4。","example":"","pointId":"EL-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B051","stem":"各取氫元素與氧元素8 g作原子數比較。取相對原子質量H=1、O=16，兩者原子個數比H：O為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n氫的相對個數8/1=8，氧8/16=0.5，故8：0.5=16：1。兩者總質量相同，氫每顆較輕，所以需要較多顆氫原子才湊到8 g。","correct":"C","options":[{"id":"A","text":"1：1","explanation":"錯誤。只看等質量，未除單顆相對質量。"},{"id":"B","text":"1：16","explanation":"錯誤。把個數比方向顛倒。"},{"id":"C","text":"16：1","explanation":"正確。8÷0.5=16。"},{"id":"D","text":"8：16","explanation":"錯誤。把總質量與相對原子質量直接配成比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B052","stem":"某元素質量帳列氫2 g、氧32 g。取相對原子質量H=1、O=16，H：O原子個數比是多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n兩者的相對個數分別為2/1=2與32/16=2，所以個數相等。雖然氧的質量是氫16倍，每顆氧也約重16倍，兩個因素相抵。","correct":"D","options":[{"id":"A","text":"1：16","explanation":"錯誤。這是氫對氧的質量比。"},{"id":"B","text":"16：1","explanation":"錯誤。將單顆質量比誤作個數比。"},{"id":"C","text":"2：1","explanation":"錯誤。氫相對個數是2，氧32/16也應為2，不能把氧少算成1。"},{"id":"D","text":"1：1","explanation":"正確。兩者相對個數均為2。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B053","stem":"元素質量帳列碳12 g、氧32 g。取C=12、O=16，碳與氧原子個數比C：O為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n分別除以相對原子質量：碳12/12=1，氧32/16=2，所以C：O=1：2。先從質量換成相對個數，才可用來比較顆數。","correct":"A","options":[{"id":"A","text":"1：2","explanation":"正確。相對個數1：2。"},{"id":"B","text":"2：1","explanation":"錯誤。把C與O個數次序倒置。"},{"id":"C","text":"3：4","explanation":"錯誤。12：16是單顆相對質量比。"},{"id":"D","text":"3：8","explanation":"錯誤。12：32是質量比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B054","stem":"一份元素模型含氫3 g、碳12 g、氧16 g，取H=1、C=12、O=16。原子個數比H：C：O為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n相對個數依序為3/1=3、12/12=1、16/16=1，因此H：C：O=3：1：1。質量較大的氧不一定顆數最多，因為每顆氧也較重。","correct":"B","options":[{"id":"A","text":"1：1：1","explanation":"錯誤。碳與氧相等，但氫多三倍。"},{"id":"B","text":"3：1：1","explanation":"正確。逐項除相對原子質量得3：1：1。"},{"id":"C","text":"1：12：16","explanation":"錯誤。這是相對原子質量比，不是樣品顆數比。"},{"id":"D","text":"3：12：16","explanation":"錯誤。直接使用質量比，未換算。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B055","stem":"人體近似元素質量每100 g含H 10 g、C 18 g、O 65 g。只計這三種元素，取H=1、C=12、O=16，氫約占三者原子數多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能
