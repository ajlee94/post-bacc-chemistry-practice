；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B082","stem":"兩份自稱可靠且涵蓋同一時刻完整樣品的紀錄，一份說「只有X」，另一份說「X與Y且Y≠X」。不能同時接受的原因是什麼？","correct":"A","options":[{"id":"A","text":"完整物質種類數分別為一與二，互相矛盾","explanation":"同一樣品同時刻不可能既排除又確認Y。"},{"id":"B","text":"X不能有名字","explanation":"物質可以命名。"},{"id":"C","text":"兩份報告字數不同","explanation":"字數不同可無矛盾。"},{"id":"D","text":"Y必為元素","explanation":"Y分支未知且非矛盾核心。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B083","stem":"甲「若為同種純X，組成應相同」；乙「若組成數值相同，必同種純X」。已知固定配方混合物也可能有相同組成數值。哪個判斷正確？","correct":"D","options":[{"id":"A","text":"甲錯乙對","explanation":"甲符合定義，乙沒有保證身分單一。"},{"id":"B","text":"甲乙皆對","explanation":"乙把必要條件當充分。"},{"id":"C","text":"甲乙皆錯","explanation":"甲不應被否定。"},{"id":"D","text":"甲對乙錯","explanation":"同種純X須一致，反向還須核對物質身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B084","stem":"一份完整報告有物質身分、成分比例、測量條件與包裝照片。只能刪一類資訊做化學分類摘要，哪一類最不影響本節判斷？","correct":"B","options":[{"id":"A","text":"物質身分","explanation":"身分決定是否多物質。"},{"id":"B","text":"包裝照片","explanation":"包裝外觀不決定樣品純度。"},{"id":"C","text":"測量條件","explanation":"比較特性需條件。"},{"id":"D","text":"成分比例","explanation":"比例支撐固定組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B085","stem":"昨天完整樣品只有X，今天確認加入Y且未反應。昨天的純X結論如何保留？","correct":"A","options":[{"id":"A","text":"保留為昨天的正確紀錄，今天改列混合物","explanation":"時間與樣品版本改變，應分開記錄。"},{"id":"B","text":"讓昨天結論永久決定今天","explanation":"舊證據不覆蓋新組成。"},{"id":"C","text":"改成昨天也必混合","explanation":"昨天並未有Y。"},{"id":"D","text":"刪掉今天Y的紀錄","explanation":"刪除事實不能維持純。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B086","stem":"兩瓶甲、乙的完整分析分開記錄。採樣表確認甲對應代碼R、乙對應S；成分表寫R只有固定物質X，S有未反應的X、Y且X≠Y。兩表皆可靠。連接代碼後哪個分類正確？","correct":"D","options":[{"id":"A","text":"甲乙皆純","explanation":"S明列兩種物質。"},{"id":"B","text":"無論有無代碼都只能待確認","explanation":"現有對應鏈已完整，不能忽略可用證據。"},{"id":"C","text":"甲混合、乙純","explanation":"把R、S配對反置。"},{"id":"D","text":"甲純、乙混合","explanation":"甲→R→只有X；乙→S→X及Y，兩條鏈各自完整。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B087","stem":"甲含10 g純X，乙含5 g純X與5 g不同Y，且不反應。天平顯示同總量。這個對照說明什麼？","correct":"B","options":[{"id":"A","text":"甲也是混合物","explanation":"甲已確認純X。"},{"id":"B","text":"同總量不能確認同組成或純度","explanation":"甲一種、乙兩種但總量相同。"},{"id":"C","text":"乙的Y不計質量","explanation":"Y有題設質量。"},{"id":"D","text":"相同總量證明同種","explanation":"總量不給成分身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B088","stem":"課本給水、NaCl兩個純物質例子。只憑列出兩例，就說「純物質只有這兩種」，錯在哪？","correct":"B","options":[{"id":"A","text":"純物質不能舉例","explanation":"例子有助理解。"},{"id":"B","text":"例子清單不等於窮盡全部成員","explanation":"例示不能當成只有兩成員的完整分類。"},{"id":"C","text":"兩例都不是純物質","explanation":"兩者均是本節純物質例子。"},{"id":"D","text":"要把兩例混合才算純","explanation":"混合兩不同物質不會因此純。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第2頁（正式PNG第04頁）。","example":""},{"id":"G02-PURE-B089","stem":"候選標籤只限純元素E、純化合物C、混合物M。已知樣品不是E；再得到「只有一種固定組成物質」這項完整資訊後，候選如何變化？","correct":"B","options":[{"id":"A","text":"只M縮為E","explanation":"起初未排C，且後續不支持E。"},{"id":"B","text":"C或M縮為C","explanation":"先排E，再用單一物質排M，兩步後只餘C。"},{"id":"C","text":"E或C縮為E","explanation":"第一步已排E。"},{"id":"D","text":"三類全部保留","explanation":"兩項資料都有排除效果。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B090","stem":"名詞卡寫「化合物⊂純物質」，卻將兩詞在任何句子互換。哪個例子最能顯示互換不成立？","correct":"C","options":[{"id":"A","text":"純化合物有固定組成","explanation":"此例沒有顯示逆向錯誤。"},{"id":"B","text":"純水也是化合物","explanation":"水位於兩集合交會，不能反駁。"},{"id":"C","text":"元素型純樣可稱純物質，卻不可稱化合物","explanation":"元素是P而非C，證明不能互換。"},{"id":"D","text":"NaCl可為純物質","explanation":"NaCl也屬化合物，不能顯示差別。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B091","stem":"甲確為混合物；乙已純但不知元素或化合物。表中「純物質分支」欄，甲乙應分別填？","correct":"D","options":[{"id":"A","text":"化合物、未知","explanation":"甲不能列化合物。"},{"id":"B","text":"未知、混合物","explanation":"甲不是分支未知而是根本不屬P。"},{"id":"C","text":"元素、元素","explanation":"沒有支持兩者都是元素。"},{"id":"D","text":"不適用、待確認","explanation":"甲在P外；乙在P內但分支資料不足。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B092","stem":"五瓶均為純樣，兩瓶元素型、三瓶化合物型。若表格同時統計純樣總數及兩分支總和，應是哪組？","correct":"D","options":[{"id":"A","text":"純樣3瓶、分支2瓶","explanation":"同樣遺漏元素分支。"},{"id":"B","text":"純樣10瓶、分支5瓶","explanation":"上層與子類不能重複加總成10。"},{"id":"C","text":"純樣2瓶、分支3瓶","explanation":"純樣含兩個分支。"},{"id":"D","text":"純樣5瓶、分支合計5瓶","explanation":"2+3=5，子類總和等於上層數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B093","stem":"資料行寫「氣體、純化合物」，另一行「氣體、混合物」。這兩行是否可同時成立？","correct":"A","options":[{"id":"A","text":"可，氣態不限制只能有一種組成類別","explanation":"狀態與組成是兩個分類維度。"},{"id":"B","text":"可，所以兩樣品必同種","explanation":"相同狀態不能證同種。"},{"id":"C","text":"不可，純化合物必液體","explanation":"化合物不只液態。"},{"id":"D","text":"不可，氣體都元素","explanation":"元素不是所有氣體的身份。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第3頁（正式PNG第05頁）。","example":""},{"id":"G02-PURE-B094","stem":"資料庫把H₂O欄接到「瓶數」，寫水樣因兩瓶而H下標2。如何修正？","correct":"C","options":[{"id":"A","text":"只有沒瓶子才寫H₂O","explanation":"容器不決定公式。"},{"id":"B","text":"一瓶純水寫HO","explanation":"瓶數不改化學式。"},{"id":"C","text":"下標2代表每水分子的氫原子數，不代表瓶數","explanation":"H₂O是微觀固定組成。"},{"id":"D","text":"三瓶要改H₃O","explanation":"三瓶仍H₂O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-B095","stem":"三瓶完整確認純水：甲來自自然、乙來自合成、丙為乙分裝的半量。對「H:O原子比」，下列哪個排序合理？","correct":"C","options":[{"id":"A","text":"甲乙相等，丙為1:1","explanation":"半量不是減少化學式下標。"},{"id":"B","text":"丙>甲=乙","explanation":"半量也不增加比值。"},{"id":"C","text":"三者相等，均為2:1","explanation":"純水皆H₂O，來源與樣品量不是比值參數。"},{"id":"D","text":"甲>乙>丙","explanation":"來源和份量都不改每分子組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-B096","stem":"表A列純水每分子H:O原子比2:1；表B列糖水糖:水質量比1:9。哪項說明正確？","correct":"D","options":[{"id":"A","text":"表B因有比值一定純","explanation":"有數值比例不等於化學結合。"},{"id":"B","text":"兩表皆表示兩物質混合","explanation":"純水中的氫氧是組成元素。"},{"id":"C","text":"兩表都必是化學式","explanation":"糖水質量比不是化學式。"},{"id":"D","text":"表A是固定化合物組成，表B是混合物配方，且計數基準不同","explanation":"兩者在化學身分與數量基準都不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-B097","stem":"一份模型有7個相同水分子，沒其他成分。記錄「H 14、O 7」時，哪句正確？","correct":"B","options":[{"id":"A","text":"21個原子表示21種物質","explanation":"原子個數不是物質種類。"},{"id":"B","text":"這是全模型原子總數，比例化簡為2:1仍對應同一H₂O","explanation":"14:7除以7得2:1，總數與分子式層級不同。"},{"id":"C","text":"應改叫H₁₄O₇新物質","explanation":"整盒總數不命名新物質。"},{"id":"D","text":"7個分子表示7種化合物","explanation":"相同分子都屬同種水。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-B098","stem":"完整模型只有H₂O分子。部分圖示被遮住，目前只知H總數為14至18、O總數為7至9，皆整數且包含端點。符合兩範圍及固定組成的(H,O)配對共有幾組？","correct":"A","options":[{"id":"A","text":"3組：(14,7)、(16,8)、(18,9)","explanation":"逐一取O=7、8、9，H=2O均落在範圍內。"},{"id":"B","text":"15組：任選H與O皆可","explanation":"兩個計數不是獨立任選，必須滿足H=2O。"},{"id":"C","text":"2組：只取兩端","explanation":"端點可行，中間同樣符合。"},{"id":"D","text":"1組：只有(16,8)","explanation":"中間值可行，但兩端亦可。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；已審筆記必要邊界補充；印刷頁 51；54；部分1 PDF頁 53；56；已審筆記頁 正文第4頁（正式PNG第06頁）。","example":""},{"id":"G02-PURE-B099","stem":"純樣限為X或Y。兩者同條件密度相同，沸點已知不同。樣品密度已測，但沸點未測。只選一項追加資訊，何者能完成此限定候選辨識？","correct":"A","options":[{"id":"A","text":"同條件的沸點","explanation":"沸點在候選間不同，量測可辨識。"},{"id":"B","text":"再抄一次相同密度","explanation":"重抄不增加區分能力。"},{"id":"C","text":"瓶蓋顏色","explanation":"外部包裝不是物質特性。"},{"id":"D","text":"原報告字數","explanation":"字數不辨身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；同條件特性必要補充；印刷頁 51；56；部分1 PDF頁 53；58；已審筆記頁 正文第6頁（正式PNG第08頁）。","example":""},{"id":"G02-PURE-B100","stem":"已知樣品均勻、有固定配方，但仍含P與Q兩種未反應物質。結論為「它是純物質，所以可再分元素或化合物」。第一個錯誤在哪？","correct":"B","options":[{"id":"A","text":"固定配方不能存在","explanation":"混合物可人為固定配方。"},{"id":"B","text":"在已知兩物質共存下仍先判純物質","explanation":"起點分類已錯，不能用正確的後續樹補救。"},{"id":"C","text":"元素與化合物不是純物質分支","explanation":"兩者確為純物質分支。"},{"id":"D","text":"均勻的觀察一定錯","explanation":"均勻可以真實存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 1.2 Pure Substances；印刷頁 51；部分1 PDF頁 53；已審筆記頁 正文第13頁（正式PNG第15頁）。","example":""}]},{"depth":"精讀","target":150,"questions":[]}]},{"id":"central-0-1-ch1-sec1-2-topic03","title":"1.2-03 元素","version":"B01-G02-v1-0d5eb68f4cd9b997","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.2 物質的分類"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-2-topic03-G02-S001","stem":"教材摘要將鐵寫為「Fe*」，並在頁下明說「*表示另有附註」。正式元素符號欄應輸入什麼？","correct":"B","options":[{"id":"A","text":"Fe*，星號也是元素符號字母","explanation":"星號已明示是附註，不是字母。"},{"id":"B","text":"Fe，星號留在附註欄","explanation":"Fe是完整符號，題給星號有另一種文書角色。"},{"id":"C","text":"F，e也當附註刪掉","explanation":"e是鐵符號的必要部分。"},{"id":"D","text":"Iron，因有註腳便不能用符號","explanation":"Iron是名稱，附註不使Fe失效。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S002","stem":"教材把碘的符號印為I。為避免無襯線字體造成誤讀，旁註應寫什麼？","correct":"C","options":[{"id":"A","text":"這是小寫L","explanation":"碘用大寫I，小寫l不是其符號。"},{"id":"B","text":"這是數字1","explanation":"符號使用字母，I不是數字1。"},{"id":"C","text":"這是大寫I","explanation":"Iodine的符號I是大寫字母I。"},{"id":"D","text":"這是Li省略首字母後的標準寫法","explanation":"Li是鋰；碘的I本來就是完整符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S003","stem":"一張「鐵 Fe」卡片的e被遮住，讀者便把剩下的F解讀為氟。這個錯誤說明什麼？","correct":"A","options":[{"id":"A","text":"遮掉字母也可能留下另一個真實元素符號","explanation":"Fe與F分別表示鐵和氟；剩餘字串合法不保證身分正確。"},{"id":"B","text":"F與Fe本來都代表鐵","explanation":"表1.1區分氟F與鐵Fe。"},{"id":"C","text":"元素符號尾字母僅供裝飾","explanation":"尾字母參與元素識別。"},{"id":"D","text":"鐵的標準符號應只有F","explanation":"鐵需完整寫Fe。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S004","stem":"英文標題全部改用大寫字體，編輯也把氯的元素符號由Cl改成CL。應採取哪個原則？","correct":"D","options":[{"id":"A","text":"英文標題大寫時，符號也必須全大寫","explanation":"排版風格不改變符號的固定大小寫。"},{"id":"B","text":"把Cl拆成兩個標題","explanation":"Cl整體是氯的符號。"},{"id":"C","text":"只要讀者看得懂就無需保留符號格式","explanation":"正式元素標示仍需正確大小寫。"},{"id":"D","text":"標題可按版式處理，元素符號仍寫Cl","explanation":"Cl第一字母大寫、第二字母小寫，保持科學記號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S005","stem":"雙語詞彙表將Silicon譯為「矽」。若下一版只調整中文說明句，應如何處理Si？","correct":"B","options":[{"id":"A","text":"按中文讀音另造符號","explanation":"元素符號是固定對應，不隨譯文自行另造。"},{"id":"B","text":"保留Si作為同一元素的符號","explanation":"中文說明的改寫不改變矽與Si的對應。"},{"id":"C","text":"改為S，因為英文仍以S開頭","explanation":"S是硫，Si才是矽。"},{"id":"D","text":"取消符號，中文名稱不能搭配它","explanation":"中英文名稱均可與固定符號對照。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S006","stem":"有人宣稱「每個英文元素名只要取前兩字母，並把首字母大寫，就得到正式符號」。哪個教材例子最直接否定此法？","correct":"C","options":[{"id":"A","text":"Lithium → Li","explanation":"此例剛好符合，不能否定全稱規則。"},{"id":"B","text":"Calcium → Ca","explanation":"此例剛好符合。"},{"id":"C","text":"Chlorine的符號是Cl，並非Ch","explanation":"英文前兩字母為Ch，但正式符號為Cl，構成反例。"},{"id":"D","text":"Bromine → Br","explanation":"此例符合此方法，不能用來否定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S007","stem":"已知汞符號Hg源於hydrargyrum。有同學要求把Hg改成Hy，理由是外語名稱的前兩字母為hy。哪句回覆合理？","correct":"A","options":[{"id":"A","text":"來源詞提供歷史關聯，正式符號仍須依表確認為Hg","explanation":"來源關聯不表示一律機械截取詞首兩字母。"},{"id":"B","text":"Hy與Hg都列為汞的正式符號","explanation":"表中只列Hg。"},{"id":"C","text":"若不是前兩字母，便不能有詞源","explanation":"詞源關聯不以連續取頭兩字母為必要條件。"},{"id":"D","text":"汞應改成H","explanation":"H是氫，不能縮短汞的符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S008","stem":"朗讀時「氯」與「鋁」容易聽混。對照教材後，哪一份文字記錄能保留兩者差別？","correct":"D","options":[{"id":"A","text":"氯Al；鋁Cl","explanation":"兩個符號對調。"},{"id":"B","text":"氯Cl；鋁Cl","explanation":"鋁應為Al，不能共用Cl。"},{"id":"C","text":"氯Al；鋁Al","explanation":"氯應為Cl。"},{"id":"D","text":"氯Cl；鋁Al","explanation":"氯Cl與鋁Al分別保留兩種元素的身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S009","stem":"碳Carbon與鈣Calcium的英文都從Ca開始。建立兩張詞彙卡時應採哪個標示？","correct":"B","options":[{"id":"A","text":"兩張都寫Ca","explanation":"Ca只表示鈣。"},{"id":"B","text":"碳C、鈣Ca","explanation":"英文共享字首不影響各自固定符號。"},{"id":"C","text":"碳Ca、鈣C","explanation":"這將兩者符號對調。"},{"id":"D","text":"碳和鈣是同一筆名稱","explanation":"教材將兩者列為不同元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S010","stem":"校稿清單寫「碳C、氧O、氮Na、硫S」。哪一筆是「符號本身存在，但配給錯誤名稱」？","correct":"C","options":[{"id":"A","text":"碳C","explanation":"C正確對應碳。"},{"id":"B","text":"氧O","explanation":"O正確對應氧。"},{"id":"C","text":"氮Na","explanation":"Na是鈉的符號；氮應用N。"},{"id":"D","text":"硫S","explanation":"S正確對應硫。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S011","stem":"助記卡寫「Silver和Sulfur都以S起頭，所以銀和硫都記S」。哪項修正保留兩個正確符號？","correct":"A","options":[{"id":"A","text":"銀Ag，硫S","explanation":"銀用Ag，硫用S；不能以共享英文首字母合併。"},{"id":"B","text":"銀Si，硫S","explanation":"Si是矽，不是銀。"},{"id":"C","text":"銀S，硫Ag","explanation":"兩者錯換。"},{"id":"D","text":"銀Sn，硫Si","explanation":"Sn是錫，Si是矽，均不合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S012","stem":"「符號」欄限定填教材正式元素符號，一筆目前填的是ferrum。即使它與鐵有關，仍需做什麼？","correct":"D","options":[{"id":"A","text":"把整個ferrum改成全大寫","explanation":"長詞仍是詞源，不是元素符號。"},{"id":"B","text":"把欄寬拉長便完成化學校正","explanation":"版面調整沒有改正欄位內容。"},{"id":"C","text":"保留ferrum，任何外語詞都是符號","explanation":"詞源與符號的角色不同。"},{"id":"D","text":"符號欄填Fe，ferrum另作來源註記","explanation":"Fe是正式符號，ferrum是來源名稱。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7、9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S013","stem":"一張圖的圖例寫「Mg＝鎂」。同學想因字母相似而直接把Mg當成這張圖的質量單位。只依圖例，應如何讀？","correct":"B","options":[{"id":"A","text":"Mg是圖中每個數字的單位","explanation":"圖例已指定Mg代表鎂。"},{"id":"B","text":"Mg在此辨識鎂，數值單位須另看標示","explanation":"元素標籤與數值計量角色不能混為一談。"},{"id":"C","text":"Mg代表汞","explanation":"汞是Hg。"},{"id":"D","text":"圖例中的Mg不是任何元素","explanation":"表1.1列有鎂Mg。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S014","stem":"Ag、Hg、Mg的末字母同為g。將三張卡全部命名為「銀」，是否妥當？","correct":"C","options":[{"id":"A","text":"妥當，末字母決定元素名稱","explanation":"須讀完整符號。"},{"id":"B","text":"妥當，三者都是Ag的縮寫","explanation":"三者是不同的完整符號。"},{"id":"C","text":"不妥，依序是銀、汞、鎂","explanation":"Ag銀、Hg汞、Mg鎂；共同尾字母不消除差別。"},{"id":"D","text":"不妥，三個符號都應刪去g","explanation":"刪g會破壞正式符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S015","stem":"一份元素索引把鋰Li的字母對調成iL，再以「還是同樣兩個字母」為由保留。哪個處理正確？","correct":"A","options":[{"id":"A","text":"恢復Li，字母順序和大小寫都屬符號","explanation":"Li是固定順序，iL不合標準。"},{"id":"B","text":"只改成IL就可代表鋰","explanation":"IL仍不是鋰的符號。"},{"id":"C","text":"改成L即可","explanation":"鋰的完整符號是Li。"},{"id":"D","text":"保持iL，順序不影響符號","explanation":"順序改變會破壞元素對應。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S016","stem":"要把完整元素質量分布畫在百分比軸上，編輯因「已知118種」而把「整體」刻度標118%。應如何校正？","correct":"D","options":[{"id":"A","text":"把所有數據乘1.18配合軸","explanation":"會改變原質量占比。"},{"id":"B","text":"把已知種類數改100","explanation":"100%不是已知元素種類數。"},{"id":"C","text":"只保留118個同長長條","explanation":"種類數不等於質量分配。"},{"id":"D","text":"完整質量分布的整體仍為100%，118是另一種計數","explanation":"坐標所量的是部分相對整體，不以元素種類數定滿刻度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S017","stem":"教材地殼主要清單為氧、矽、鋁、鐵、鈣；人體主要清單為氧、碳、氫。兩份清單都直接列出的元素為何？","correct":"B","options":[{"id":"A","text":"矽","explanation":"矽只在題給地殼主要清單中。"},{"id":"B","text":"氧","explanation":"兩份主要清單均列氧。"},{"id":"C","text":"氫","explanation":"氫只在題給人體主要清單中。"},{"id":"D","text":"碳","explanation":"碳只在題給人體主要清單中。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4–6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S018","stem":"要依人體質量圖製作前三名標籤，已有「氧、碳」，第三張應標哪個元素？","correct":"C","options":[{"id":"A","text":"氮","explanation":"本圖第三個單列主要元素是氫，不是氮。"},{"id":"B","text":"氦","explanation":"氦屬銀河系主要元素之一，不能套用到人體圖。"},{"id":"C","text":"氫","explanation":"圖中氧65%、碳18%、氫10%，氫為第三個主要標籤。"},{"id":"D","text":"矽","explanation":"矽在地殼圖排名靠前，非人體圖第三張。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S019","stem":"為縮短圖例，有人把「Other（其他）」改寫成O，但圖中O已表示氧。哪個做法最清楚？","correct":"A","options":[{"id":"A","text":"保留氧O，其他類別仍寫「其他」或Other","explanation":"避免把正式元素符號O同時分給合併類別。"},{"id":"B","text":"把氧也改成Other","explanation":"會失去氧的元素標籤。"},{"id":"C","text":"兩類都叫O，百分比不同就表示符號不同","explanation":"同一符號在此會產生兩種指涉。"},{"id":"D","text":"把Other視為第119種元素","explanation":"Other不是元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S020","stem":"地殼圖例最後寫Other 9.2%，在Ca 3.4%之後。哪種閱讀方式正確？","correct":"D","options":[{"id":"A","text":"最後列出者一定質量最少","explanation":"圖例位置不保證排序。"},{"id":"B","text":"Other應少於Ca，數字可忽略","explanation":"應依數值讀取。"},{"id":"C","text":"把Other當第六個元素來排元素名次","explanation":"Other是合併類別。"},{"id":"D","text":"Other合計多於Ca，不能只看圖例前後順序","explanation":"9.2大於3.4，且Other是多項合計。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S021","stem":"讀到「五種元素合計超過地殼質量的90%」，「合計」最重要的意思為何？","correct":"B","options":[{"id":"A","text":"每一種都各超過90%","explanation":"同一總體內五種各超過90%不可能。"},{"id":"B","text":"把五種的質量占比加在一起超過90%","explanation":"合計指五項總和，不是逐項各達門檻。"},{"id":"C","text":"五種各占相同的18%","explanation":"合計不代表各項平均分配，圖中比例不同。"},{"id":"D","text":"這五種合計只有五顆原子","explanation":"質量百分比沒有指定原子總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4–6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S022","stem":"一張銀河系摘要卡標示「H 24%、He 74%」。依教材應怎麼改？","correct":"C","options":[{"id":"A","text":"把H改成O，數字不改","explanation":"教材銀河系主要項為H和He。"},{"id":"B","text":"兩數不需改，符號可互換","explanation":"H與He不能視為可互換。"},{"id":"C","text":"保留符號，將比例改成H 74%、He 24%","explanation":"原抄錄把兩個比例對調。"},{"id":"D","text":"將兩項都改49%","explanation":"比例不相等，不能為湊合計而平均。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S023","stem":"兩張原圖的O標籤都正確，其中一張為65%，另一張為49.5%。要把65%貼回原圖，應放在哪張？","correct":"A","options":[{"id":"A","text":"人體質量圖","explanation":"人體圖氧為65%，地殼為49.5%。"},{"id":"B","text":"地殼質量圖","explanation":"地殼氧標示49.5%。"},{"id":"C","text":"銀河系氫氦摘要中的氦位置","explanation":"氦約24%，且不是氧標籤。"},{"id":"D","text":"兩張都換成65%","explanation":"兩個環境本來有不同數值。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S024","stem":"人體圖的Other扇形占7%。圖中將它畫成白色，是否表示這7%沒有質量？","correct":"D","options":[{"id":"A","text":"是，白色在所有圖上都表示零","explanation":"色彩無此普遍定義。"},{"id":"B","text":"是，所以圖的總質量只剩93%","explanation":"Other包含質量，不能刪掉。"},{"id":"C","text":"不是，因白色一定表示氫","explanation":"需依標籤判定，白色不是固定元素。"},{"id":"D","text":"不是，標籤仍表示其他元素的7%質量","explanation":"圖的填色不取消所標示的占比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S025","stem":"一張彩色圖只給元素百分比，沒有整份樣品的質量。若要把每個色塊標成「公克」，還需要哪項資料？","correct":"B","options":[{"id":"A","text":"每個元素名稱的字數","explanation":"字數與質量換算無關。"},{"id":"B","text":"該圖所代表的總質量","explanation":"元素質量等於比例乘總質量；缺總量不能得到公克。"},{"id":"C","text":"出版紙張重量","explanation":"紙張不是圖示樣品的總質量。"},{"id":"D","text":"元素符號換成全大寫","explanation":"改格式不能補出質量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S026","stem":"要用小珠模型示範「按質量」與「按個數」統計不同，哪個安排最合適？","correct":"C","options":[{"id":"A","text":"只改珠子的顏色，所有珠子仍等重","explanation":"等重珠子的個數比例與質量比例相同，無法展示此差異。"},{"id":"B","text":"把同一顆珠子重複計兩次","explanation":"重複計數是統計錯誤。"},{"id":"C","text":"用每顆質量不同的兩類珠子，分別秤重和計數","explanation":"單顆質量不同才能顯示兩種加權方式的差別。"},{"id":"D","text":"把百分比符號改成元素符號","explanation":"改標籤不改統計基準。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S027","stem":"要重畫人體的原子個數圖，已有每種元素的總質量。以下哪種補充表的欄位最有用？","correct":"A","options":[{"id":"A","text":"各元素的每顆原子質量","explanation":"可用總質量除每顆質量換算顆數。"},{"id":"B","text":"各元素名字的筆畫數","explanation":"筆畫數不提供原子顆數。"},{"id":"C","text":"每個符號印刷所占面積","explanation":"印刷面積不是原子質量。"},{"id":"D","text":"各元素在詞彙表的行號","explanation":"表內行號不編碼每顆質量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S028","stem":"同一組原子不增不減，改由秤重統計轉為逐顆計數。若得到的比例改變，最合理的原因是什麼？","correct":"D","options":[{"id":"A","text":"必有新元素被創造出來","explanation":"更換統計方式不表示產生新元素。"},{"id":"B","text":"元素符號改變了","explanation":"符號不隨統計方式改變。"},{"id":"C","text":"樣品總質量必定增加","explanation":"沒有增減原子，不能據此宣稱總質量增加。"},{"id":"D","text":"每顆原子對個數各算一次，對質量的貢獻卻可不同","explanation":"兩種統計對每顆原子的權重不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S029","stem":"學生說「Hydrogen的英文名稱較長，所以每顆氫原子應較重」。哪項資料最能糾正這種判斷？","correct":"B","options":[{"id":"A","text":"英文名稱長短就是質量尺度","explanation":"字詞長度不表示原子質量。"},{"id":"B","text":"本節指出氫原子相較氧、碳等原子較輕","explanation":"需依原子質量關係判斷，不能按名稱長短。"},{"id":"C","text":"H只有一個字母，所以樣品必定只含一顆氫","explanation":"符號字母數不等於樣品原子數。"},{"id":"D","text":"把Hydrogen改短就能改變氫的質量","explanation":"改寫名稱不改變原子本身。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S030","stem":"引用地殼圖49.5%的氧資料時，下面哪個標題改動會擴大到來源未涵蓋的整體？","correct":"C","options":[{"id":"A","text":"地殼及其海洋與大氣的元素質量分布","explanation":"保留原圖的範圍。"},{"id":"B","text":"圖1.6地殼氧質量占比","explanation":"保留來源對象與基準。"},{"id":"C","text":"整個地球連同地核的氧質量占比","explanation":"原圖未給包含地核的全地球數據。"},{"id":"D","text":"地殼圖中的氧標籤","explanation":"沒有擴大統計整體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S031","stem":"把銀河系H 74%寫成「科學家下次發現的元素有74%機率是氫」，哪裡出錯？","correct":"A","options":[{"id":"A","text":"把質量分布誤當成發現事件的機率","explanation":"教材數字描述銀河系質量，未描述研究事件。"},{"id":"B","text":"氫沒有元素符號","explanation":"氫的符號為H。"},{"id":"C","text":"74%必定是人體資料","explanation":"人體氫為10%；74%來自銀河系。"},{"id":"D","text":"銀河系元素都等量","explanation":"教材明說豐度差異大。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3–5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S032","stem":"表1.1某橫行依序印「Oxygen O｜Lithium Li｜Silver Ag」。正確的閱讀單位是什麼？","correct":"D","options":[{"id":"A","text":"Oxygen與Li配對，其餘略過","explanation":"越過組界使名稱與符號錯配。"},{"id":"B","text":"O、Li、Ag是同一元素的三種符號","explanation":"分別是氧、鋰、銀。"},{"id":"C","text":"三個英文名合起來才是一個元素名","explanation":"這是三組獨立對照。"},{"id":"D","text":"氧—O、鋰—Li、銀—Ag三組完整配對","explanation":"應按每組名稱與其相鄰符號閱讀，橫行不是一筆多符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S033","stem":"詞彙表搜尋到「Phosphorus」，旁邊另有「Potassium」。為避免只看英文P就選錯，下列配對何者正確？","correct":"B","options":[{"id":"A","text":"Phosphorus K；Potassium P","explanation":"符號對調。"},{"id":"B","text":"Phosphorus P；Potassium K","explanation":"磷為P，鉀為K，不能以共同首字母合併。"},{"id":"C","text":"Phosphorus Pb；Potassium P","explanation":"Pb是鉛，P是磷。"},{"id":"D","text":"兩者都用P","explanation":"鉀不使用P。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S034","stem":"詞彙卡只寫「本教材介紹118種已知元素」，有人想直接用118作任一元素的符號。應採哪個判斷？","correct":"C","options":[{"id":"A","text":"118可以通用於全部元素","explanation":"總種類數不是個別符號。"},{"id":"B","text":"118只要縮小字體就是符號","explanation":"字體不改變數字角色。"},{"id":"C","text":"總種類數不能替代某一元素的一或二字母符號","explanation":"要識別個別元素需查固定符號。"},{"id":"D","text":"所有元素必須改用三位數","explanation":"教材介紹的是字母符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3、7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S035","stem":"若把週期表剪成元素卡後按中文筆畫重新排成直欄，新表最可能失去原本哪項資訊？","correct":"A","options":[{"id":"A","text":"原週期表同欄所表達的元素關聯","explanation":"按筆畫重排後，原來的欄關係不再保證保存。"},{"id":"B","text":"所有卡上原有的符號立即失效","explanation":"只移動卡片不改變符號本身。"},{"id":"C","text":"已知元素的數目必定減少","explanation":"未刪卡，不能推論元素數減少。"},{"id":"D","text":"每種元素都會更換名稱","explanation":"排列改變不會改名。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 10。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S036","stem":"將完整週期表圖片旋轉90度顯示，原來同一欄的格子在畫面上成為橫向一排。元素間原有的關聯應怎麼理解？","correct":"D","options":[{"id":"A","text":"旋轉後元素關聯消失","explanation":"旋轉只改顯示方向，不改原分組。"},{"id":"B","text":"畫面上所有橫向鄰居從此都是同一元素","explanation":"不能因顯示位置而合併元素身分。"},{"id":"C","text":"元素符號需全部改名","explanation":"圖像旋轉不改符號。"},{"id":"D","text":"仍依原週期表分組讀，旋轉不改原來同欄的關聯","explanation":"辨識原表的結構，不把螢幕方向當新的化學分類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 10。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S037","stem":"若縮印版表格暫不顯示括號內的cuprum，但仍清楚列Copper與Cu，讀者能否仍辨認銅的符號？","correct":"B","options":[{"id":"A","text":"不能，Cu會變成碳","explanation":"刪去詞源註記不會把Cu變為C。"},{"id":"B","text":"能，名稱與符號的直接對應仍在","explanation":"可讀Copper—Cu；僅詞源資訊未顯示。"},{"id":"C","text":"不能，所有符號都需顯示全部歷史才有效","explanation":"記號有效性不依註記是否同頁顯示。"},{"id":"D","text":"能，但應讀成Ca","explanation":"Ca是鈣，不是銅。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S038","stem":"閱讀句子「He is reading」時，能否單因出現He字樣就判定整句一定在談氦？","correct":"C","options":[{"id":"A","text":"能，相同字串只可能有化學用途","explanation":"一般語句與化學圖例需要語境。"},{"id":"B","text":"不能，因氦的符號不是He","explanation":"氦的符號確實是He。"},{"id":"C","text":"不能，應先確認它是否位於元素符號的語境","explanation":"He可在元素表代表氦，普通英文句中的用法不同。"},{"id":"D","text":"能，所以句中每個英文字都是元素","explanation":"不是任意英文單字都屬元素符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S039","stem":"人體圖中碳18%的分母應是哪一項？","correct":"A","options":[{"id":"A","text":"人體圖所代表的總質量","explanation":"18%是碳質量占整份人體參考總質量的比例。"},{"id":"B","text":"只有氧的質量","explanation":"碳對氧比不是原圖18%的分母。"},{"id":"C","text":"只有碳與氫的質量","explanation":"這是不同子集合分母。"},{"id":"D","text":"118種元素的名稱總字數","explanation":"與質量百分比無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S040","stem":"教材對銀河系使用「氫約74%、氦約24%」。哪種轉述保留了數據的語氣？","correct":"D","options":[{"id":"A","text":"每個銀河系區域恰好74%氫","explanation":"把整體近似值變成所有局部的精確值。"},{"id":"B","text":"氫值只能是整數，不能有測量誤差","explanation":"原文未作這種數值限制。"},{"id":"C","text":"氦絕不可能偏離24.000000%","explanation":"把近似資料說成無誤差精確量。"},{"id":"D","text":"銀河系質量以氫、氦為主，教材給出約74%與約24%","explanation":"保留對象、質量基準和近似性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 5。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S041","stem":"由本版教材寫「已知118種元素」，能否推出「未來永遠不會有新的元素報告」？","correct":"B","options":[{"id":"A","text":"能，已知就是未來不可能改變","explanation":"已知描述當時知識，不是未來事件的保證。"},{"id":"B","text":"不能，現有記載不構成未來研究結果的預言","explanation":"應將118理解為本版所列資料。"},{"id":"C","text":"能，因符號只允許一個字母","explanation":"符號可一或兩字母，且不能如此預言。"},{"id":"D","text":"不能，所以118在本版也不可引用","explanation":"可引用教材記載，只需保留語境。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S042","stem":"圖1.6的圓餅有立體厚度。近側外緣看起來較大時，哪種讀法較可靠？","correct":"C","options":[{"id":"A","text":"把近側厚度也加進元素質量","explanation":"厚度是圖的立體效果，不是另一筆質量。"},{"id":"B","text":"只依扇形靠前或靠後排豐度","explanation":"透視位置不提供含量排名。"},{"id":"C","text":"依標示的質量百分比比較，不把側面厚度算成新占比","explanation":"數字與圖例給定原分布；立體外緣不應額外加權。"},{"id":"D","text":"凡看不見的背側元素都為零","explanation":"被視角遮住不表示含量零。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S043","stem":"老師為避免聽寫錯誤，把Br逐字母念作「大寫B、小寫r」，並說整體表示溴。這種拼讀有何用途？","correct":"A","options":[{"id":"A","text":"交代一個完整符號的字母與大小寫","explanation":"分別念字母是拼字說明，仍只對應溴一個元素。"},{"id":"B","text":"表示B元素和r元素各一種","explanation":"題目明示是在拼讀Br。"},{"id":"C","text":"表示溴有兩種不同元素身分","explanation":"一個符號仍對應一個元素。"},{"id":"D","text":"把Br改成兩個單字母正式符號","explanation":"拼讀不改變符號結構。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S044","stem":"將「溴 Br」和「氯 Cl」兩列改按中文筆畫排序時，怎樣才能保持原有元素資訊？","correct":"D","options":[{"id":"A","text":"只移動中文名稱，符號留原列","explanation":"名稱符號會錯配。"},{"id":"B","text":"只把Br和Cl改成同一字體即可","explanation":"字體不能修復欄位錯位。"},{"id":"C","text":"把兩個符號都改成C","explanation":"C是碳，會丟失身分。"},{"id":"D","text":"每個名稱連同自己的符號一起移動","explanation":"整筆排序保留溴Br與氯Cl的關聯。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S045","stem":"某摘要只列「氧、矽、鋁、鐵、鈣」，未寫環境。要依本節補上範圍，應選哪一項？","correct":"B","options":[{"id":"A","text":"人體質量中的前三種","explanation":"人體主要三種是氧、碳、氫。"},{"id":"B","text":"地殼含海洋與大氣的主要五種元素","explanation":"這五種正是教材地殼清單。"},{"id":"C","text":"銀河系質量中主要兩種","explanation":"銀河系主要兩種是氫、氦。"},{"id":"D","text":"所有118種元素的完整表","explanation":"清單只有五種，不是完整元素表。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4–6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S046","stem":"人體質量圖中氧65%。若只把圖分成氧與非氧兩塊，哪一塊較大？","correct":"C","options":[{"id":"A","text":"非氧，因它包含多種元素","explanation":"種類多不代表合計質量較大。"},{"id":"B","text":"一樣大，因為改成兩塊","explanation":"分類數兩個不要求各50%。"},{"id":"C","text":"氧，65%大於剩餘35%","explanation":"按原圖餘量100−65=35%，氧塊較大。"},{"id":"D","text":"不能判斷，因Other沒有拆開","explanation":"非氧總和可由餘量求得，不需Other細項。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S047","stem":"看見S、Si、Sn三張完整符號卡時，哪個說明正確？","correct":"A","options":[{"id":"A","text":"分別表示硫、矽、錫","explanation":"三個完整符號各自對應不同元素。"},{"id":"B","text":"全部都是硫的不同縮寫","explanation":"Si為矽、Sn為錫。"},{"id":"C","text":"只有字母數最多的那張有效","explanation":"三者都是表1.1有效符號。"},{"id":"D","text":"全部都表示銀","explanation":"銀的符號是Ag。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S048","stem":"將圖1.6的兩張圖拆開轉貼時，哪種附註最能避免讀者把數字用錯地方？","correct":"D","options":[{"id":"A","text":"只寫「元素」","explanation":"缺少哪個環境及何種比例。"},{"id":"B","text":"只寫百分比，不標對象","explanation":"不同環境可有不同占比。"},{"id":"C","text":"只留最大數字","explanation":"其餘內容和基準都丟失。"},{"id":"D","text":"分別保留地殼或人體，以及質量百分比說明","explanation":"兩種必要資訊共同限定每個數值的意義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S049","stem":"表1.1名為常見元素與符號，其中列有氦。應如何理解這張表的「常見」？","correct":"B","options":[{"id":"A","text":"等於人體圖前三名，氦應占人體24%","explanation":"人體圖前三名為O、C、H，不能由此推氦24%。"},{"id":"B","text":"它是學習常見名稱與符號的選錄，不是人體含量排行榜","explanation":"表1.1的主要用途是名稱符號對照。"},{"id":"C","text":"每個表列元素都占人體相同百分比","explanation":"沒有此質量資料。"},{"id":"D","text":"沒列入人體前三名的元素都無正式符號","explanation":"有無主要扇形不決定符號是否存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 5、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-S050","stem":"同學要查「矽的符號」及「地殼中矽的質量占比」，哪組頁內線索最直接？","correct":"C","options":[{"id":"A","text":"只讀外語詞源欄，兩者都在其中","explanation":"矽不在該外語來源組，詞源欄也不給豐度。"},{"id":"B","text":"只讀118種元素的句子","explanation":"總數不給矽的符號和占比。"},{"id":"C","text":"表1.1查Si，圖1.6查25.7%","explanation":"名稱符號和環境比例需由兩種資料互相對照。"},{"id":"D","text":"只以週期表同欄推算25.7%","explanation":"同欄關係不決定環境質量占比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、8–10。","example":""}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-2-topic03-G02-B001","stem":"抄表者保留O49.5、Si25.7、Al7.5、Fe4.7、Ca3.4，卻將Other寫成19.2，單位都是質量%。若只准改Other使表內合計100%，應改為何值？","correct":"A","options":[{"id":"A","text":"9.2%","explanation":"五項相加90.8%，餘量100−90.8=9.2%。"},{"id":"B","text":"19.2%","explanation":"這會使六項合計110%。"},{"id":"C","text":"0.8%","explanation":"0.8是主要五項超過90的量，不是餘量。"},{"id":"D","text":"90.8%","explanation":"90.8是已列五項的合計，不是Other。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B002","stem":"設計者要把地殼圖改成「已列五元素／其他」兩欄，並問：已列五元素的合計比90%門檻多出多少個百分點？資料為49.5、25.7、7.5、4.7、3.4%。","correct":"C","options":[{"id":"A","text":"9.2個百分點","explanation":"9.2為Other，不是超過門檻的量。"},{"id":"B","text":"90.8個百分點","explanation":"這是合計占比，尚未減90。"},{"id":"C","text":"0.8個百分點","explanation":"總和90.8%，減去門檻90%得到0.8個百分點。"},{"id":"D","text":"8個百分點","explanation":"將0.8放大了十倍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B003","stem":"人體表原為O65、C18、H10、Other7。另一表O65、C10、H18、Other7也合計100。最直接揭露第二表錯誤的檢查是哪一項？","correct":"B","options":[{"id":"A","text":"只看四項是否加到100","explanation":"兩表都符合，抓不到交換錯誤。"},{"id":"B","text":"把C與H各自對照原圖標籤","explanation":"第二表交換C與H數據；逐標籤核對可找到。"},{"id":"C","text":"只看O是否為65","explanation":"兩表O相同，無法分辨。"},{"id":"D","text":"只看Other是否為7","explanation":"兩表Other相同，無法分辨。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B004","stem":"只作地殼圖的分類整理：把Al7.5%、Fe4.7%、Ca3.4%合成一欄M。哪組新資料忠實保存原圖？","correct":"D","options":[{"id":"A","text":"O49.5、Si25.7、M7.5、Other9.2","explanation":"M漏加Fe和Ca，總和少8.1。"},{"id":"B","text":"O49.5、Si25.7、M24.8、Other9.2","explanation":"24.8另含Other，會重複計入9.2。"},{"id":"C","text":"O49.5、Si25.7、M15.6、Other0","explanation":"刪去原本仍存在的Other。"},{"id":"D","text":"O49.5、Si25.7、M15.6、Other9.2","explanation":"7.5+4.7+3.4=15.6，與其餘三項合計100。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B005","stem":"人體資料寫O65%、C18%、H10%、Other7%。編輯另造「C或H共28%」一列後，仍保留原C與H並當成五個互斥扇形。總和會是多少，問題為何？","correct":"A","options":[{"id":"A","text":"128%；C與H被算入個別列又算入合併列","explanation":"100+28=128，重疊類別不應作互斥扇形。"},{"id":"B","text":"100%；新增列只是名稱，不會改數值","explanation":"新增28又保留原列會被繪圖計入。"},{"id":"C","text":"72%；合併必定讓總和減28","explanation":"本題未刪原列，只新增合併列。"},{"id":"D","text":"118%；元素總數決定扇形總和","explanation":"118是種類總數，與此加總無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B006","stem":"按O49.5、Si25.7、Al7.5、Fe4.7、Ca3.4、Other9.2%的順序畫一條100等分帶。從左數到60%的位置位於哪一類內？","correct":"B","options":[{"id":"A","text":"O","explanation":"O只到49.5%。"},{"id":"B","text":"Si","explanation":"Si區間從49.5%到75.2%，包含60%。"},{"id":"C","text":"Al","explanation":"Al區間在75.2%之後。"},{"id":"D","text":"Other","explanation":"Other從90.8%開始。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B007","stem":"按O65、C18、H10、Other7%的順序排成100%帶狀圖。標出從65%至83%的區段，正好代表什麼？","correct":"C","options":[{"id":"A","text":"氧與碳的總和","explanation":"氧與碳的總和是起點0到83。"},{"id":"B","text":"氫","explanation":"氫區間為83到93。"},{"id":"C","text":"碳","explanation":"65之後的18個百分點是碳，占到83。"},{"id":"D","text":"其他","explanation":"Other區間為93到100。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B008","stem":"O占49.5%，Si25.7%、Al7.5%、Fe4.7%、Ca3.4%。只在這五種中選兩種，哪個敘述正確？","correct":"D","options":[{"id":"A","text":"任意兩種合計都超過50%","explanation":"如Al+Ca=10.9%，不足。"},{"id":"B","text":"不含O的兩種也必有一組超過50%","explanation":"最大的Si+Al=33.2%，仍不足。"},{"id":"C","text":"O與任何已列元素合併都不足50%","explanation":"最小的O+Ca也有52.9%。"},{"id":"D","text":"含O的任一組都超過50%，不含O的組合都不超過50%","explanation":"O+最小Ca=52.9；不含O的最大組Si+Al=33.2。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B009","stem":"某份轉錄只剩「O+C=83%、H=10%、Other=7%」，原圖O與C的細項已遺失。若暫不查原圖，能否單由此重建O65%、C18%？","correct":"A","options":[{"id":"A","text":"不能；O與C有多組非負分配可合計83%","explanation":"例如60與23也符合該合計，所以缺少一個獨立條件。"},{"id":"B","text":"能；83固定只能拆成65和18","explanation":"83有其他拆法。"},{"id":"C","text":"能；兩種元素就必須各41.5%","explanation":"沒有等分條件。"},{"id":"D","text":"不能，所以O+C也不可確定","explanation":"合計83是已給資料，仍能保留。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B010","stem":"地殼已單列O49.5、Si25.7、Al7.5、Fe4.7、Ca3.4%。要列出占比介於3%與5%之間（含端點）的元素，正確結果是什麼？","correct":"B","options":[{"id":"A","text":"Al與Fe","explanation":"Al7.5超過上界5。"},{"id":"B","text":"Fe與Ca，即鐵與鈣","explanation":"4.7與3.4都在區間內，且符號對應正確。"},{"id":"C","text":"Ca與C，即鈣與碳","explanation":"C不是這五項中單列的另一項。"},{"id":"D","text":"Si與Al","explanation":"25.7和7.5皆超上界。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B011","stem":"人體參考圖中C18%、H10%。一份完全符合此圖的紙上模型記碳9質量單位、氫5質量單位。哪項說明正確？","correct":"C","options":[{"id":"A","text":"碳9小於18，因此模型必錯","explanation":"百分比與質量數值不可直接比較。"},{"id":"B","text":"氫5小於10，因此不能用同一比例","explanation":"模型總質量可能是50而非100。"},{"id":"C","text":"兩項共同支持總質量50單位，比例彼此一致","explanation":"9/0.18=50且5/0.10=50。"},{"id":"D","text":"碳推總量50、氫推總量500","explanation":"5/0.10為50，不是500。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B012","stem":"為畫粗略地殼示意，將49.5、25.7、7.5、4.7、3.4、9.2各自四捨五入成整數，恰逢.5時進位。得到50、26、8、5、3、9。這些顯示值相加為何，應怎麼標示？","correct":"D","options":[{"id":"A","text":"100%；所以完全精確","explanation":"逐項取整後實際合計101。"},{"id":"B","text":"101%；表示真實地殼質量超過整體","explanation":"取整誤差不代表真實比例超過100。"},{"id":"C","text":"99%；把差額補到氧即可","explanation":"加總不是99，也不應任意修改單項。"},{"id":"D","text":"101%；須註明逐項近似，不能當精確閉合分布","explanation":"50+26+8+5+3+9=101，逐項四捨五入與先合計再取整不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B013","stem":"只作數值模型：地殼已列Fe4.7%、Ca3.4%。兩者都四捨五入成整數後，鐵與鈣的相對排序是否改變？","correct":"A","options":[{"id":"A","text":"不變；原4.7>3.4，取整後5>3","explanation":"需對兩個原值及取整值分別比較。"},{"id":"B","text":"改變，因小數位全被刪掉","explanation":"取整不一定翻轉名次，本例沒有。"},{"id":"C","text":"兩者都變4%，因此相等","explanation":"4.7進為5、3.4取3。"},{"id":"D","text":"無法比較，因元素符號是字母","explanation":"數值占比仍可比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B014","stem":"把銀河系H74%與人體H10%作數字比較，以74%為基準，後者低約多少百分比？","correct":"B","options":[{"id":"A","text":"64%","explanation":"64是百分點差；以74為基準需再除74。"},{"id":"B","text":"約86.5%","explanation":"(74−10)÷74×100≈86.5%。"},{"id":"C","text":"640%","explanation":"以10為分母會得到不同方向的比較。"},{"id":"D","text":"約13.5%","explanation":"10/74是剩下的相對比例，非降低比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 5–6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B015","stem":"紙上地殼模型各類質量全部同乘3，原O49.5%、Si25.7%。新模型哪項描述正確？","correct":"C","options":[{"id":"A","text":"O變成148.5%、Si變77.1%","explanation":"元素質量和總量都乘3，比例不會這樣倍增。"},{"id":"B","text":"O減為16.5%，因總質量變三倍","explanation":"氧質量也同乘3，不能只改分母。"},{"id":"C","text":"O仍49.5%、Si仍25.7%，但各自質量是原來三倍","explanation":"共同縮放在比值中約去。"},{"id":"D","text":"兩者都改成50%","explanation":"共同縮放不導致等分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B016","stem":"兩份紙上人體模型總質量分別為40與90單位，都有O65%、C18%、H10%、Other7%。合併數據後氧占比是多少？","correct":"D","options":[{"id":"A","text":"130%","explanation":"不能將兩筆百分比直接相加。"},{"id":"B","text":"介於40%至90%","explanation":"40與90是總質量，不是占比界限。"},{"id":"C","text":"無法決定，因兩份質量不同","explanation":"兩份同占比，任意正權重合併仍相同。"},{"id":"D","text":"65%","explanation":"氧總量=0.65(40+90)，除以130仍為0.65。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B017","stem":"地殼總表已有O49.5%、Si25.7%、Al7.5%、Fe4.7%、Ca3.4%、Other9.2%。另一人再貼一列「Oxygen49.5%」並加總。應如何處理？","correct":"A","options":[{"id":"A","text":"合併O與Oxygen的同一筆，避免總和149.5%","explanation":"O與Oxygen為同一元素，重複加入49.5使總和149.5。"},{"id":"B","text":"保留兩筆，因英文名與符號代表不同元素","explanation":"名稱和符號是同一元素的不同表示。"},{"id":"C","text":"把每筆除以149.5便得到原比例","explanation":"此做法把錯誤重複當真實組成，會扭曲其他比例。"},{"id":"D","text":"刪除所有中文名字即可","explanation":"問題在重複身分，不是文字語言。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B018","stem":"地殼抄本把O49.5改成50.5，Si25.7改成24.7，其餘不變。兩項一增一減使合計仍100%。哪一項檢查能發現問題？","correct":"B","options":[{"id":"A","text":"只查合計有沒有100","explanation":"+1與−1互相抵消。"},{"id":"B","text":"逐項核對O與Si是否各等於原圖值","explanation":"可發現兩個相反方向的抄錄誤差。"},{"id":"C","text":"只查表內是否仍有六列","explanation":"列數沒有變。"},{"id":"D","text":"只查所有百分比是否非負","explanation":"兩個錯值仍為非負。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B019","stem":"人體圖的C與H標籤遺失，但註記還有「兩者合計28%，碳比氫多8個百分點」。碳與氫各應標多少？","correct":"C","options":[{"id":"A","text":"碳20%、氫8%","explanation":"合計28但差12，不符合差8。"},{"id":"B","text":"碳10%、氫18%","explanation":"差的方向相反。"},{"id":"C","text":"碳18%、氫10%","explanation":"(28+8)/2=18，(28−8)/2=10，同時符合兩條件。"},{"id":"D","text":"碳28%、氫8%","explanation":"把合計與差誤作個別值，和為36。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B020","stem":"人體紙上模型總質量200 g、氫質量20 g。計算欄寫20÷200=0.10，下一格卻標「氫質量0.10 g」。哪個更正正確？","correct":"D","options":[{"id":"A","text":"把0.10改成10 g就好","explanation":"實際氫質量是20 g，不是10。"},{"id":"B","text":"保留0.10 g，除法的單位仍是g","explanation":"g/g相消，結果是比例。"},{"id":"C","text":"把200 g改為200%","explanation":"總質量不是百分比。"},{"id":"D","text":"0.10是質量比例，等於10%；氫質量仍20 g","explanation":"比值無g單位，乘100%才成百分比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B021","stem":"要以等質量方格精確呈現地殼圖所有標示到0.1%的數值，每格都必須完整歸一類，不能切格。100格或1000格中哪個足夠？","correct":"A","options":[{"id":"A","text":"1000格足夠，每格0.1%；100格無法完整表示49.5%","explanation":"1000格讓各占比乘10成整數格，100格會需要半格等。"},{"id":"B","text":"100格足夠，直接把49.5畫50格即可精確","explanation":"取整會改變原值。"},{"id":"C","text":"兩者都只能表示整數百分比","explanation":"1000等分可表示0.1%。"},{"id":"D","text":"兩者都需要118格作為起點","explanation":"元素種類數不決定百分比格數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B022","stem":"一條100格等質量帶，先塗氧65格、碳18格、其他7格，三組不重疊。要依人體圖完成最後的氫區，應如何做？","correct":"B","options":[{"id":"A","text":"重新分割成四組各25格","explanation":"會改變所有原比例。"},{"id":"B","text":"在尚未著色的10格標H","explanation":"已用90格，剩10格，與氫10%相合。"},{"id":"C","text":"在氧區內再圈10格當獨立氫格","explanation":"會讓兩類重疊，沒有形成互斥分配。"},{"id":"D","text":"再加10格到帶外形成110格圖","explanation":"分母已設100，不需新增總格數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B023","stem":"簡報把地殼O49.5%的扇形畫成剛好半圓並說「這是精確圖，不是近似圖」。哪項說明對？","correct":"C","options":[{"id":"A","text":"半圓代表49.5%是定義","explanation":"半圓代表50%。"},{"id":"B","text":"應把數字49.5改成50來證明原圖正確","explanation":"原數據不可為配合圖形擅改。"},{"id":"C","text":"半圓比原比例多0.5個百分點；若用半圓只能標近似示意","explanation":"50−49.5=0.5，精確圖應小於半圓。"},{"id":"D","text":"半圓必定表示原子個數","explanation":"形狀本身不指定質量或個數基準。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B024","stem":"一個從0起算的等刻度長條圖，三條長度由長到短為25.7、7.5、4.7。圖例依序貼Si、Fe、Al。哪個最小修正能符合地殼圖？","correct":"D","options":[{"id":"A","text":"將Si改O","explanation":"25.7對應Si，這項原本正確。"},{"id":"B","text":"把三條都改同長","explanation":"會破壞數據差異。"},{"id":"C","text":"只改刻度文字成原子個數","explanation":"原資料是質量比例，不可轉換基準。"},{"id":"D","text":"互換Fe與Al兩個圖例","explanation":"7.5應Al、4.7應Fe，只有兩標籤錯位。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B025","stem":"人體資料以一條200 mm長的帶狀圖表示100%，其中氧段長130 mm。現在只量到碳段36 mm。碳段是否符合圖中18%？","correct":"A","options":[{"id":"A","text":"符合，36/200=18%","explanation":"需以完整200 mm作分母，不把長度數字直接當百分比。"},{"id":"B","text":"不符合，36 mm就是36%","explanation":"每mm不等於1%。"},{"id":"C","text":"不符合，36/130才是原圖碳占比","explanation":"130只是氧段，不是全長。"},{"id":"D","text":"符合，因碳的符號只有一個字母","explanation":"符號字母數不能證明圖長比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B026","stem":"教材外語來源組為Cu、Fe、Pb、Hg、K、Ag、Na、Sn。一份檢查報告說「這組全是兩字母符號」。應如何更正？","correct":"B","options":[{"id":"A","text":"保留，因K可以補成Ka","explanation":"K是完整符號，不能補字。"},{"id":"B","text":"改為七個兩字母符號和一個單字母符號K","explanation":"逐一數字母，只有K單字母。"},{"id":"C","text":"改為八個單字母符號","explanation":"其他七個各有兩字母。"},{"id":"D","text":"刪掉K，因它不屬教材這一組","explanation":"教材將K與kalium列入外語來源組。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B027","stem":"表1.1三組符號依序為：C F H I N O P S；Al Br Ca Cl He Li Mg Si；Cu Fe Pb Hg K Ag Na Sn。單字母符號共有幾個？","correct":"C","options":[{"id":"A","text":"8個","explanation":"漏掉第三組中的K。"},{"id":"B","text":"16個","explanation":"把第二組八個兩字母算入單字母。"},{"id":"C","text":"9個","explanation":"第一組八個，加第三組K，共九個。"},{"id":"D","text":"24個","explanation":"24是列出元素總數，不是單字母數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B028","stem":"四張卡分別為「鋁AL」「銀Ag」「氯Ca」「氦he」。要求名稱對應和大小寫同時正確，哪張可以直接保留？","correct":"D","options":[{"id":"A","text":"鋁AL","explanation":"鋁應寫Al。"},{"id":"B","text":"氯Ca","explanation":"Ca是鈣，氯是Cl。"},{"id":"C","text":"氦he","explanation":"氦應寫He。"},{"id":"D","text":"銀Ag","explanation":"名稱和正式大小寫皆正確。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B029","stem":"兩筆錯誤分別為「銅cu」與「鉛Li」。若只允許變更字母大小寫、不增刪換字母，哪筆能修好？","correct":"A","options":[{"id":"A","text":"只有銅cu能改成Cu","explanation":"鉛需要Pb，Li的字母內容本身就不對。"},{"id":"B","text":"兩筆都能","explanation":"Li無法只靠大小寫變為Pb。"},{"id":"C","text":"只有鉛Li能","explanation":"Li是鋰；cu反而可恢復Cu。"},{"id":"D","text":"兩筆都不能","explanation":"cu只需首字母大寫即可正確。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B030","stem":"資料鏈寫「Tin → stannum → Si → 矽」。若目標是保留Tin所指元素，從哪個連結開始必須更正？","correct":"B","options":[{"id":"A","text":"Tin → stannum","explanation":"錫的符號確實與stannum有關。"},{"id":"B","text":"stannum → Si","explanation":"stannum應連到Sn，而Sn中文為錫。"},{"id":"C","text":"Si → 矽","explanation":"這個局部對應是正確的，但上游已走錯元素。"},{"id":"D","text":"完全不必更正","explanation":"整條鏈最後偏離原本的Tin。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B031","stem":"一份表寫「Calcium 鈣 Cl」與「Chlorine 氯 Ca」。前兩欄正確，第三欄出錯。哪種修法保持前兩欄並修正元素符號？","correct":"C","options":[{"id":"A","text":"只改Calcium的英文字","explanation":"英文名本來正確。"},{"id":"B","text":"把兩筆中文名稱都改碳","explanation":"會新增名稱錯誤。"},{"id":"C","text":"互換Cl與Ca","explanation":"鈣應Ca、氯應Cl，第三欄交換即可。"},{"id":"D","text":"把Cl與Ca均改C","explanation":"C為碳，不合兩筆名稱。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B032","stem":"教材中的Mercury與Magnesium都是M起頭，符號卻分別為Hg與Mg。若卡片「Mg」被放到Mercury分類，哪個證據最直接要求移動？","correct":"D","options":[{"id":"A","text":"兩個英文名長短不同","explanation":"長短不能決定符號。"},{"id":"B","text":"Mg有兩個字母","explanation":"Hg也有兩個字母，不足辨別。"},{"id":"C","text":"兩者中文都含金字旁","explanation":"汞的中文不以此判定，且字形不決定符號。"},{"id":"D","text":"表1.1明列Magnesium—Mg、Mercury—Hg","explanation":"正式對應直接區分鎂與汞。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B033","stem":"表格中有H、He、I、Li。某人建議「刪掉每個符號的小寫字母，得到簡版」。哪個結果完整描述問題？","correct":"A","options":[{"id":"A","text":"H與I不變；He變成H，Li變成L，後兩者失去正確符號","explanation":"不同符號受損方式不同，不能用統一刪字規則。"},{"id":"B","text":"四個都仍代表原元素","explanation":"He與Li的尾字母不可刪。"},{"id":"C","text":"四個都變成H","explanation":"規則不會如此作用。"},{"id":"D","text":"只影響字體，不影響內容","explanation":"刪字是內容資訊改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B034","stem":"一份摘要只保存Ag、Hg、Mg的第二字母，三筆都變成g；原名稱另存且完整。要恢復三筆正確符號，最佳依據是什麼？","correct":"B","options":[{"id":"A","text":"僅依g就能分別判定三筆","explanation":"共同g無法分辨三者。"},{"id":"B","text":"用各筆保留的銀、汞、鎂名稱查回Ag、Hg、Mg","explanation":"已有獨立名稱鍵，可對照教材恢復。"},{"id":"C","text":"依字體顏色猜Ag","explanation":"題目未提供字體與名稱對應。"},{"id":"D","text":"一律補成Ag","explanation":"會把汞和鎂錯當銀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B035","stem":"以英文名稱字母順序排列Iron、Lead、Mercury、Potassium時，順序是上述四者。若改按其符號字母順序排列，哪個次序正確？","correct":"C","options":[{"id":"A","text":"Fe、Pb、Hg、K","explanation":"這仍是原英文名稱順序，未按符號排。"},{"id":"B","text":"K、Hg、Fe、Pb","explanation":"不是英文字母遞增順序。"},{"id":"C","text":"Fe、Hg、K、Pb","explanation":"符號首字母F、H、K、P依序排列。"},{"id":"D","text":"Pb、K、Hg、Fe","explanation":"這是逆序。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B036","stem":"四條對照線寫成「Cu—cuprum」「Fe—ferrum」「Pb—kalium」「K—kalium」。若前三個符號各只能接自己表列來源，哪條需要改接到plumbum？","correct":"D","options":[{"id":"A","text":"Cu那條","explanation":"Cu接cuprum已正確。"},{"id":"B","text":"Fe那條","explanation":"Fe接ferrum已正確。"},{"id":"C","text":"K那條","explanation":"K接kalium已正確。"},{"id":"D","text":"Pb那條","explanation":"Pb的來源為plumbum，錯接kalium需修正。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B037","stem":"地殼圖的數值順序固定為49.5、25.7、7.5、4.7、3.4。哪串符號能依序替代氧、矽、鋁、鐵、鈣？","correct":"A","options":[{"id":"A","text":"O、Si、Al、Fe、Ca","explanation":"五個名稱符號均對位。"},{"id":"B","text":"O、S、Ag、F、C","explanation":"矽、鋁、鐵、鈣皆被換成其他元素。"},{"id":"C","text":"O、Sn、Al、Fe、Cl","explanation":"Sn是錫、Cl是氯，兩處錯配。"},{"id":"D","text":"H、Si、Al、Fe、Ca","explanation":"第一項氧被換為氫。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B038","stem":"一份筆記寫「鉛Pb取自plumbum；磷P也應取自plumbum」。只依表1.1，可保留哪部分？","correct":"B","options":[{"id":"A","text":"兩句都保留","explanation":"表中plumbum連到鉛Pb，未連到磷P。"},{"id":"B","text":"只保留鉛Pb與plumbum的對應","explanation":"共同字母P不足以轉移詞源。"},{"id":"C","text":"只保留磷P的來源說法","explanation":"教材沒有此對應。"},{"id":"D","text":"兩句都刪除，因Pb不合法","explanation":"Pb是鉛的正式符號，第一句正確。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B039","stem":"Cu與Ag的符號都列於表1.1外語來源欄。學生以此為唯一理由宣布兩者必在週期表同欄。資料足夠嗎？","correct":"C","options":[{"id":"A","text":"足夠，外語來源欄等於週期表欄","explanation":"兩種表格欄的用途不同。"},{"id":"B","text":"不足，所以兩者必不在同欄","explanation":"無證據支持不在同欄的反面斷言。"},{"id":"C","text":"不足；詞源分類本身不提供週期表位置證據","explanation":"需查看週期表，不能由語言來源直接推欄位。"},{"id":"D","text":"足夠，所有兩字母符號都同欄","explanation":"符號長度不決定週期表欄位。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9–10。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B040","stem":"以下只是「依序連寫的元素符號清單」，不是化學式：HeLiNa。每個大寫字母開始下一個符號。應還原為哪個清單？","correct":"D","options":[{"id":"A","text":"H、e、L、i、N、a","explanation":"小寫字母不能各自當本表的完整符號。"},{"id":"B","text":"He、LiN、a","explanation":"LiN不合一或兩字母格式，a也不合。"},{"id":"C","text":"H、eLi、Na","explanation":"eLi不合固定符號。"},{"id":"D","text":"He、Li、Na，即氦、鋰、鈉","explanation":"三個大寫字母引出He、Li、Na，均在表1.1。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B041","stem":"一張已用分隔線區隔的清單是「C｜Ca｜Cl｜Cu」。哪項統計正確？","correct":"A","options":[{"id":"A","text":"四種元素，符號共七個字母","explanation":"C一字母，另外三個各兩字母，共1+2+2+2=7。"},{"id":"B","text":"七種元素，因為共有七個字母","explanation":"字母總數不等於元素種類數。"},{"id":"C","text":"只有一種元素，因為都以C開頭","explanation":"完整符號分別識別不同元素。"},{"id":"D","text":"三種元素，因為C不應單獨出現","explanation":"C是碳的有效單字母符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B042","stem":"一個檢查器只確認「一或兩個字母、首字母大寫、若有次字母則小寫」。它把「Copper—Ca」判為格式合格。要驗證化學內容還缺哪一步？","correct":"B","options":[{"id":"A","text":"再計一次Ca有幾個字母","explanation":"Ca確實通過格式，但對應錯。"},{"id":"B","text":"查名稱與符號對應，Copper應Cu","explanation":"規則檢查後還需語意字典核對。"},{"id":"C","text":"把Copper全部大寫","explanation":"英文名大小寫不修正Ca的錯配。"},{"id":"D","text":"接受即可，格式合格等於元素對應正確","explanation":"這正是反例展示的缺口。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 7–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B043","stem":"一表將「Iron—Fe—ferrum」與「Copper—Cu—ferrum」都填成同一來源詞。若教材前一筆已核對，後一筆應怎麼處理？","correct":"C","options":[{"id":"A","text":"Cu改成Fe","explanation":"會把銅錯成鐵。"},{"id":"B","text":"Copper改成Iron後保留兩筆不同元素","explanation":"只會重複同一元素而丟失銅。"},{"id":"C","text":"後一筆來源詞改cuprum","explanation":"銅Cu源於cuprum；ferrum是鐵Fe的詞源。"},{"id":"D","text":"ferrum寫兩次就代表有兩種鐵","explanation":"詞語重複不新增元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B044","stem":"某索引搜尋策略說「只要符號包含I或i，就把結果都合併為碘」。表1.1中哪些結果會被錯誤合併？","correct":"D","options":[{"id":"A","text":"只有I自己","explanation":"I確實是碘，本筆不是錯合併。"},{"id":"B","text":"只有H與He","explanation":"這兩符號不含I或i。"},{"id":"C","text":"N與Na","explanation":"這兩個也不含I或i。"},{"id":"D","text":"Li與Si","explanation":"Li為鋰、Si為矽，不因含i就與碘I同義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B045","stem":"查詢人體圖中碳占比時，系統誤用Copper的符號Cu作查詢鍵，回報「沒有單列資料」。最先應修正哪個地方？","correct":"A","options":[{"id":"A","text":"將目標元素鍵改成碳C，再讀18%","explanation":"問題首先是碳與銅身分錯配，C有明列數據。"},{"id":"B","text":"把Cu直接改成18%","explanation":"符號欄不應放數值。"},{"id":"C","text":"宣布人體沒有碳","explanation":"查錯鍵造成缺結果，不證明元素缺席。"},{"id":"D","text":"將人體Other平均分給全部符號","explanation":"不需也不能憑空平均。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B046","stem":"詞源測驗要求從cuprum、ferrum、plumbum、stannum選出能配「Pb」。學生選stannum，卻補上正確中文「鉛」。哪個評語準確？","correct":"B","options":[{"id":"A","text":"中文正確即可讓stannum也變正確","explanation":"各欄需分別核對，中文正確不挽救錯詞源。"},{"id":"B","text":"鉛與Pb相配，但詞源應plumbum；stannum配Sn／錫","explanation":"明確指出已對和仍錯的資訊。"},{"id":"C","text":"只要把中文改錫，Pb就不需改","explanation":"錫需Sn，不能保留Pb。"},{"id":"D","text":"Pb與Sn是同一元素的兩個符號","explanation":"鉛與錫分別Pb與Sn。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B047","stem":"兩份摘錄都叫「元素豐度」，甲單列Si25.7%，乙單列C18%。要判定是否抄自同一個圓餅圖，哪個處理最恰當？","correct":"C","options":[{"id":"A","text":"標題相同即同一資料，不用再看","explanation":"一般標題不等於資料集身分。"},{"id":"B","text":"Si與C都是一種元素，所以甲乙等同","explanation":"元素不同，對照環境也可能不同。"},{"id":"C","text":"核對甲是否地殼、乙是否人體，以及各自質量基準","explanation":"這兩數字對應圖1.6的不同環境圖。"},{"id":"D","text":"把兩項相加成43.7%即可辨認","explanation":"不同整體的比例不能這樣合成一圖。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B048","stem":"一份週期表副本刪除了全部元素符號，只保留空白格子的位置。就本節強調的功能而言，最直接少了什麼？","correct":"D","options":[{"id":"A","text":"所有元素在自然界的含量","explanation":"原週期表本就不是環境豐度表。"},{"id":"B","text":"全地球的總質量","explanation":"本節未稱週期表能提供該量。"},{"id":"C","text":"元素來源的外語全名","explanation":"本節也未稱每個格子提供詞源全名。"},{"id":"D","text":"由格子直接讀出各元素符號的能力","explanation":"空白格子沒有符號文字，無法直接查讀名稱符號對照。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 10。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B049","stem":"若一份索引完整保存每個元素的名稱及唯一符號，哪個查詢能力可直接由這種對照支持？","correct":"A","options":[{"id":"A","text":"從名稱找符號，也能從符號找回名稱","explanation":"一一對應允許雙向查詢。"},{"id":"B","text":"從符號算出人體精確含量","explanation":"沒有人體組成資料。"},{"id":"C","text":"從名稱計算銀河系質量","explanation":"文字對照未給數值。"},{"id":"D","text":"從符號長短推出同欄元素","explanation":"不是本節週期表分組規則。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8、10。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B050","stem":"表1.1對Cu附cuprum，對C沒有附詞源註記。能否因此斷言「C完全沒有任何名稱來源」？","correct":"B","options":[{"id":"A","text":"能，沒註記等於不存在任何來源","explanation":"沒有在此表註記不等於不存在。"},{"id":"B","text":"不能；表格是否附註與有無名稱來源不是同一件事","explanation":"教材說符號多由英文名而來，只有部分特別註外語。"},{"id":"C","text":"能，所以C不是有效符號","explanation":"表中明列Carbon—C。"},{"id":"D","text":"不能，所以C必定也源自cuprum","explanation":"無法把Cu的特定詞源轉貼到C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B051","stem":"要把某元素的總質量m換成原子顆數，已知每顆原子質量為a，且兩種質量使用相同單位。哪個式子符合「幾顆合計成m」？","correct":"C","options":[{"id":"A","text":"m×a","explanation":"乘法不會得到能合計為m的顆數。"},{"id":"B","text":"a÷m","explanation":"這是每顆占總質量的比例。"},{"id":"C","text":"m÷a","explanation":"n顆各重a，總質量na=m，所以n=m/a。"},{"id":"D","text":"m+a","explanation":"質量相加仍是質量，不是顆數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B052","stem":"抽象模型已把甲、乙、丙的質量各除以單顆質量，得到相對顆數2、3、5。若要畫原子個數百分比圖，下一步應如何處理？","correct":"B","options":[{"id":"A","text":"把2%、3%、5%直接當完整圖","explanation":"三者只有10%，未以總顆數正規化。"},{"id":"B","text":"各除以10，得到20%、30%、50%","explanation":"相對顆數總和為10，需各除共同總和。"},{"id":"C","text":"用三類各33.3%","explanation":"類別數相同不代表顆數相同。"},{"id":"D","text":"將2、3、5乘以其原子質量再畫個數圖","explanation":"這會回到質量，未完成個數百分比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B053","stem":"紙上模型中甲4顆、每顆1單位；乙3顆、每顆2單位。按顆數與按總質量由大到小的排序各為何？","correct":"D","options":[{"id":"A","text":"都為甲>乙","explanation":"甲顆數多，但甲質量4小於乙6。"},{"id":"B","text":"都為乙>甲","explanation":"按顆數4>3，甲較多。"},{"id":"C","text":"顆數乙>甲，質量甲>乙","explanation":"兩種排序都反了。"},{"id":"D","text":"顆數甲>乙，質量乙>甲","explanation":"比較4和3，再比較4×1和3×2，排序翻轉。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B054","stem":"兩種原子單顆質量的相對值為a與b。另一份表改以10a與10b表示同一比例尺度。固定兩種總質量作個數百分比換算時，結果如何？","correct":"A","options":[{"id":"A","text":"兩個顆數換算值皆縮小十倍，但正規化後占比不變","explanation":"共同因子1/10在分子與顆數總和中約去。"},{"id":"B","text":"第一種占比變十倍","explanation":"兩種都改相同尺度，不能只放大一項。"},{"id":"C","text":"兩種占比都縮小十倍，總和只剩10%","explanation":"百分比仍須正規化為100%。"},{"id":"D","text":"必須把元素符號也改變","explanation":"相對質量標度不改元素身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B055","stem":"模型中輕類原子總質量10、重類原子總質量65，重類每顆的質量是輕類的r倍。輕類顆數較多的條件是什麼？","correct":"C","options":[{"id":"A","text":"r小於6.5","explanation":"重類太輕時65的總量會對應較多顆，方向相反。"},{"id":"B","text":"r等於1","explanation":"同顆質量時顆數比等於10:65，輕類較少。"},{"id":"C","text":"r大於6.5","explanation":"設輕類每顆a，10/a>65/(ra)等價於r>6.5。"},{"id":"D","text":"不論r多少都一定較多","explanation":"總質量差與單顆差都影響顆數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B056","stem":"模型甲每顆質量1，只有1顆；乙每顆質量5，共100顆。哪句話有題目證據支持？","correct":"B","options":[{"id":"A","text":"甲較輕，所以甲顆數必占多數","explanation":"題給甲1顆、乙100顆直接否定此說法。"},{"id":"B","text":"甲每顆較輕，但甲顆數仍較少","explanation":"單顆輕重不單獨決定整份模型的顆數多寡。"},{"id":"C","text":"乙較重，所以乙只能有1顆","explanation":"單顆質量不限制題給顆數。"},{"id":"D","text":"甲乙顆數必相等","explanation":"題給數量不相等。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B057","stem":"示意圖規則是「每個點代表1單位質量」。甲一顆原子重1單位，乙一顆重4單位。若甲乙各畫4個點，該圖表示什麼？","correct":"D","options":[{"id":"A","text":"甲乙各4顆","explanation":"點代表質量，乙四點才對應一顆。"},{"id":"B","text":"甲1顆、乙4顆","explanation":"方向倒置。"},{"id":"C","text":"甲乙單顆質量相同","explanation":"圖例已給單顆質量不同。"},{"id":"D","text":"甲4顆、乙1顆，兩類總質量相同","explanation":"各4質量單位，分別除1和4得4與1顆。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B058","stem":"另一模型明示「每個點代表1顆原子」，甲畫3點、每顆2單位；乙畫2點、每顆5單位。模型中甲占質量多少？","correct":"A","options":[{"id":"A","text":"6/16，即37.5%","explanation":"甲質量3×2=6，乙2×5=10，甲占6/(6+10)。"},{"id":"B","text":"3/5，即60%","explanation":"這是甲顆數占比，未按單顆質量加權。"},{"id":"C","text":"2/7，約28.6%","explanation":"僅比較單顆質量，忽略顆數。"},{"id":"D","text":"6/10，即60%","explanation":"分母只用了乙的質量，不是總質量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B059","stem":"模型圖例寫「每種元素只畫一個代表性圖示，圖示不按實際數量」。H、C、O各有一個圖示。可否據此填每種原子個數各占1/3？","correct":"C","options":[{"id":"A","text":"可以，因每種恰有一個圖示","explanation":"圖例明確不是實際數目。"},{"id":"B","text":"可以，因三種都用單字母符號","explanation":"字母數不決定原子個數。"},{"id":"C","text":"不可以；這是種類示意，需要真正的顆數比例資料","explanation":"先確認圖示是否編碼顆數，不能把代表圖當統計樣本。"},{"id":"D","text":"不可以，所以原圖人體質量比例也不成立","explanation":"這張假設示意不否定教材另給的質量數據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B060","stem":"模型已算出H、C、O的相對顆數依序8、2、4，Other暫記x。若補給「Other相對顆數共2」，哪個計算便可完成？","correct":"B","options":[{"id":"A","text":"每顆H的絕對質量","explanation":"相對顆數不給絕對單顆質量。"},{"id":"B","text":"H個數占全部的8/(8+2+4+2)=50%","explanation":"補足唯一缺失的分母項即可。"},{"id":"C","text":"Other每種元素各自占多少","explanation":"只給Other合計，未給其分項。"},{"id":"D","text":"教材真實人體的精確H百分比就是50%","explanation":"題目是模型假設，不能宣稱真實值。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B061","stem":"學生將人體所有元素原子都假設等重，算出H的個數占比也是10%。本節提示應從哪處檢查這個解法？","correct":"D","options":[{"id":"A","text":"10不能是任何百分比","explanation":"10%本身是合法比例。"},{"id":"B","text":"H應改成He才能得到正解","explanation":"改元素身分不是修正假設。"},{"id":"C","text":"把圖表總和由100改成118","explanation":"總類數不是百分比分母。"},{"id":"D","text":"所有元素原子等重的假設不符本節氫較輕的比較","explanation":"若假設等重，兩種比例會相同，但不符合本節實際關係。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B062","stem":"已知模型H總質量10、O總質量65，單顆質量比aO/aH=13；C與Other細項未知。本題只把13作假設值。哪個量仍能精確計算？","correct":"A","options":[{"id":"A","text":"H與O的原子個數比為2:1","explanation":"NH/NO=(10/65)×13=2，兩者比不需第三類資料。"},{"id":"B","text":"H占所有原子的比例","explanation":"全體分母還需C、Other顆數。"},{"id":"C","text":"所有原子總顆數的絕對值","explanation":"只有質量比尺度，且其他資訊缺失。"},{"id":"D","text":"Other每種元素的質量","explanation":"題目沒有給Other細項。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter
