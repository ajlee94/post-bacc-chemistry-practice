opic02-G03-CMU-B097","central-0-1-ch1-sec1-1-topic02-G03-CMU-B098","central-0-1-ch1-sec1-1-topic02-G03-CMU-B099","central-0-1-ch1-sec1-1-topic02-G03-CMU-B100"],[]],"TCU":[[],[],[]],"ISU":[[],[],[]]},"schoolCoverage":{"CMU":[{"status":"COMPLETE","reason":"","pointIds":["WHY-P01","WHY-P02","WHY-P03","WHY-P04","WHY-P05","WHY-P06","WHY-P07","WHY-P08","WHY-P09","WHY-P10"]},{"status":"COMPLETE","reason":"","pointIds":["WHY-P01","WHY-P02","WHY-P03","WHY-P04","WHY-P05","WHY-P06","WHY-P07","WHY-P08","WHY-P09","WHY-P10"]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}],"TCU":[{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}],"ISU":[{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"NO_ADDITIONAL_POINTS","reason":"已完成與中國醫本節題庫的考點比對，沒有符合本節範圍的新增考點，因此不另出題（可用0題）。","pointIds":[]},{"status":"DISABLED","reason":"超過目前已審深度，精讀尚不可出題。","pointIds":[]}]}},{"id":"central-0-1-ch1-sec1-2-topic01","title":"1.2-01 物質的狀態","version":"B01-G03-v1-a38f3c2f16431d6b","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.2 物質的分類"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-2-topic01-G03-S001","stem":"將一份樣品從小燒杯移到較大的燒杯，在溫壓相同、沒有流失或相變時，它的體積近乎不變，外形卻跟著燒杯改變。哪一組性質最符合此樣品？","concept":"三態分類要把形狀與體積一起看。液體沒有自己的固定外形，會呈現所占容器部分的形狀；但同一份液體在相同條件下有近似固定的體積。其粒子已相當靠近，所以不易再大幅壓縮，卻能互相滑過而流動。本題換大燒杯只改外形而未改體積，對應的就是這種液體粒子行為。","correct":"B","options":[{"id":"A","text":"粒子相距遠，容易大幅壓縮","explanation":"錯誤。這是氣體的典型特徵，氣體會擴展到較大可達空間。"},{"id":"B","text":"粒子彼此靠近，仍可相互滑動","explanation":"正確。粒子靠近使體積較穩定，相對滑動則容許外形改變。"},{"id":"C","text":"粒子各自受限於固定位置，只能小幅振動","explanation":"錯誤。這較符合固體，通常能保留自身外形。"},{"id":"D","text":"粒子相距遠，卻維持原來的固定排列","explanation":"錯誤。一般氣體粒子會不斷移動，不保持固定排列。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S002","stem":"一份樣品移出模具後仍保持原外形，在一般壓力變化下體積也幾乎不變。它與液體最主要的差異是哪一項？","concept":"一般固體與液體都有一定體積，而且都不易明顯壓縮，這兩項共有性質不能用來區分它們。固體的粒子主要受限於各自位置附近，因此樣品可保留自身形狀；液體粒子能相對滑動，因此可流動並改變外形。題目移出模具後仍保形，提供了支持固態的關鍵證據。","correct":"D","options":[{"id":"A","text":"是否占據空間","explanation":"錯誤。固體和液體都占據空間。"},{"id":"B","text":"是否含有運動的粒子","explanation":"錯誤。固體粒子也會振動，不能把有無運動當成兩態界線。"},{"id":"C","text":"是否不易壓縮","explanation":"錯誤。液體通常也不易被明顯壓縮。"},{"id":"D","text":"是否具有自身固定形狀","explanation":"正確。固體能保留自己的形狀，液體則會隨所處容器改形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S003","stem":"某物質不但能取得容器的形狀，還會自行擴展至充滿較大容器。假設全程無反應與相變，哪一敘述正確？","concept":"液體和氣體都能隨容器改變外形，因此只看形狀不足以區分。關鍵在於氣體會擴展到整個可達容器空間，而一份液體通常只占一定體積。題目特別給出「自行充滿較大容器」，所以可判為氣態；其樣品體積由當時可用空間決定，不是每份氣體都有不變的自身體積。","correct":"A","options":[{"id":"A","text":"此物質沒有自身固定體積","explanation":"正確。能隨可達空間擴展是氣體沒有固定體積的表現。"},{"id":"B","text":"此物質有固定體積但沒有固定形狀","explanation":"錯誤。這是液體的性質，不能解釋自行充滿更大空間。"},{"id":"C","text":"此物質有固定形狀但沒有固定體積","explanation":"錯誤。一般三態並沒有以這組性質描述本題樣品。"},{"id":"D","text":"此物質有固定形狀且有固定體積","explanation":"錯誤。這是一般固體的組合，與自行擴展不符。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S004","stem":"對一般固體、液體與氣體的比較，哪一項是固體和液體共同具備、氣體通常不具備的性質？","concept":"可壓縮性描述同一份物質受壓後體積能減少多少。氣體粒子間通常有很大的空間，所以容易壓縮；液體與固體粒子都相當接近，通常不易被明顯壓縮。這不表示液固粒子完全不動，也不表示兩者形狀相同。比較共有性質時，需保留液體可流動而固體可保形的差異。","correct":"C","options":[{"id":"A","text":"沒有固定形狀","explanation":"錯誤。液體無固定形狀，固體有固定形狀。"},{"id":"B","text":"粒子彼此不能改變相對位置","explanation":"錯誤。液體粒子能相互滑動。"},{"id":"C","text":"不易被明顯壓縮","explanation":"正確。固液粒子都較靠近，可縮減的粒子間空間有限。"},{"id":"D","text":"會自行填滿任何更大的容器","explanation":"錯誤。這是氣體的特徵，固體和液體不會如此擴展。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S005","stem":"某同學僅根據「樣品能流動」就判定它是液體。若只考慮一般三態，下列哪項補充最能說明此判定仍不充分？","concept":"流動需要粒子能相對移動，液體與氣體都能做到。液體粒子彼此靠近，保持近似固定的體積；氣體粒子較疏遠，能擴展或被壓縮。因而「能流動」只能提供部分判態資訊，不能直接排除氣體。若再確認同份樣品換容器後仍維持一定體積，才較能支持液態。","correct":"B","options":[{"id":"A","text":"固體的每個粒子都能自由流遍容器","explanation":"錯誤。固體粒子通常受限在位置附近振動。"},{"id":"B","text":"氣體也能流動，但沒有固定體積","explanation":"正確。流動並非液體獨有，還要比較體積或可壓縮性。"},{"id":"C","text":"液體具有固定形狀，因此不會流動","explanation":"錯誤。液體無固定形狀且能流動。"},{"id":"D","text":"氣體具有固定形狀，因此不會流動","explanation":"錯誤。氣體會隨容器改形，也可流動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S006","stem":"一般條件下，一份樣品沒有固定形狀，卻不容易被壓到原體積的一小部分。哪一項最可能也是它的性質？","concept":"三態要以性質組合判斷：氣體無固定形狀與體積且易壓縮；液體無固定形狀但有固定體積，通常不易壓縮；固體形狀與體積都固定。本題的兩項條件排除了典型固態與氣態，指向液體。它能因粒子滑動而改形，但不能因此推論體積也會任意改變。","correct":"C","options":[{"id":"A","text":"會自行占滿任何較大的容器","explanation":"錯誤。這較符合氣體的無固定體積。"},{"id":"B","text":"粒子全被鎖在規則位置附近","explanation":"錯誤。這較符合固態，不能解釋一般液體的改形流動。"},{"id":"C","text":"樣品有近似固定的體積","explanation":"正確。無固定形狀且不易壓縮的組合符合液體。"},{"id":"D","text":"粒子間空間遠大於液體","explanation":"錯誤。液體粒子已彼此靠近，不具有氣體般的大間隙。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S007","stem":"冰塊、杯中的液態水與密閉瓶中的水蒸氣，在各自維持原物態時，哪一項排列正確？","concept":"同一物質可因狀態不同而有不同巨觀性質。冰是固體，保持自身形狀與體積；液態水只保持一定體積；水蒸氣則隨可達空間取得形狀與體積。這些差異來自分子排列、間距與運動方式，並不需要改變H₂O的化學身分。逐項對照三態性質，只有冰塊具有自身固定形狀。","correct":"A","options":[{"id":"A","text":"具有自身固定形狀者：僅冰塊","explanation":"正確。液態水與水蒸氣均會隨所占容器區域改形。"},{"id":"B","text":"具有自身固定體積者：僅水蒸氣","explanation":"錯誤。液態水和冰有一定體積，氣態水沒有自身固定體積。"},{"id":"C","text":"容易大幅壓縮者：冰塊與液態水","explanation":"錯誤。通常水蒸氣較易壓縮，液固兩態較不易。"},{"id":"D","text":"粒子只能在位置附近振動者：僅液態水","explanation":"錯誤。這是冰中粒子的典型限制，液態水分子能相對移動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S008","stem":"甲、乙兩份樣品都不易壓縮；甲可倒出並改變外形，乙移到別的容器後仍保形。甲、乙最可能依序為何？","concept":"不易壓縮是液體與固體的共同點，要再看形狀才可區分。甲能倒出並適應新容器，是液體的流動表現；乙換容器仍能保留外形，是一般固體的特徵。微觀上，甲粒子可以相互滑過，乙粒子則主要在固定位置附近振動。此題不是用顏色或物質名稱判態，而是整合兩項觀察。","correct":"D","options":[{"id":"A","text":"氣體、固體","explanation":"錯誤。一般氣體容易被明顯壓縮，與甲不符。"},{"id":"B","text":"液體、氣體","explanation":"錯誤。氣體不能保持自身固定形狀，與乙不符。"},{"id":"C","text":"固體、液體","explanation":"錯誤。這把兩者的形狀特徵對調了。"},{"id":"D","text":"液體、固體","explanation":"正確。甲可流動但體積不易壓縮；乙同時保形且不易壓縮。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S009","stem":"在沒有外力造成永久變形的條件下，下列哪一組觀察最能支持樣品是固體？","concept":"「固定」是比較同份樣品在通常條件下的行為，不是說材料永遠不能破裂或熱脹。把樣品正常轉移到別的容器，若形狀、體積仍可保留，就符合固體特徵。液體只保體積，氣體則兩者均由可達容器空間決定。本題排除永久外力變形，使比較能集中於一般三態本身的性質。","correct":"C","options":[{"id":"A","text":"形狀可變，體積也可隨容器變大","explanation":"錯誤。這組性質符合氣體。"},{"id":"B","text":"形狀可變，體積近乎固定","explanation":"錯誤。這組性質符合液體。"},{"id":"C","text":"形狀固定，體積近乎固定","explanation":"正確。一般固體同時具有自身固定形狀與體積。"},{"id":"D","text":"形狀固定，會自行擴展占滿大瓶","explanation":"錯誤。保留自身形狀與任意擴展填瓶並非一般固體的組合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S010","stem":"某未知樣品在一個剛好裝滿的密閉盒內。僅憑「盒子被樣品填滿」，能得出哪一結論？","concept":"氣體的典型特徵是會自行分布到全部可達空間，不能簡化為「任何一次裝滿都是氣體」。固體可以恰好與盒內尺寸相同，液體也可以恰好倒入足量。本題只有單次填滿的觀察，三態都尚未排除。需再比較換容器後是否保形、體積是否固定，或是否容易壓縮，才能判定。","correct":"A","options":[{"id":"A","text":"樣品可能為固、液或氣，仍須其他性質資料","explanation":"正確。固體尺寸或液體份量也可能恰好與盒內空間相符。"},{"id":"B","text":"樣品一定為氣體，因只有氣體能裝滿盒子","explanation":"錯誤。要觀察是否能自行擴展填滿不同的較大空間。"},{"id":"C","text":"樣品一定為液體，因只有液體能貼合盒壁","explanation":"錯誤。氣體和恰好配合盒形的固體也可能接觸盒壁。"},{"id":"D","text":"樣品一定為固體，因盒外輪廓保持固定","explanation":"錯誤。盒子的固定輪廓不等於樣品具有自身固定形狀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S011","stem":"打開隔板，使一份氣體能進入旁邊原本抽空的空腔；沒有氣體進出整個裝置，也沒有反應或相變。充分等待後，哪項敘述最合理？","concept":"氣體沒有固定體積，當可達空間增加時，會由原先區域擴展到新空間。打開隔板並未增加分子數，只是解除移動範圍的限制。充分分布後兩腔都會有氣體，粒子仍不斷運動。因而要分開看「整個裝置的總分子數」與「氣體分布在哪些空間」，兩者並不是同一件事。","correct":"B","options":[{"id":"A","text":"氣體只留在原腔，因分子數不變","explanation":"錯誤。總數不變不妨礙粒子分布到新開放的空間。"},{"id":"B","text":"氣體分布於兩個相通空腔","explanation":"正確。氣體粒子會移動並擴展至全部可達空間。"},{"id":"C","text":"氣體只留在新增空腔，原腔完全空掉","explanation":"錯誤。原腔仍可達，氣體不會因此全部離開原腔。"},{"id":"D","text":"氣體必先變成液體才能通過開口","explanation":"錯誤。氣體粒子本來即可穿過相通開口。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S012","stem":"一個有300 mL內部空間的瓶子只含氣體，氣體已充分散布且沒有液化。此時所說的「氣體體積」是指何者？","concept":"氣體樣品的體積是它所分布的空間範圍，不是把各個分子的大小直接相加。分子之間通常相距很遠，這些間隙也是氣體占據空間的一部分。題目已指明瓶內只有氣體且充分散布，因此體積是300 mL。這個值由當時容器限制決定，不代表此份氣體永遠只能有300 mL。","correct":"D","options":[{"id":"A","text":"全部分子本體體積相加，必為300 mL","explanation":"錯誤。氣體樣品的體積包含分子間的大量空間。"},{"id":"B","text":"分子在一秒內掃過的體積","explanation":"錯誤。樣品體積不是依指定運動時間定義。"},{"id":"C","text":"只有瓶底附近含分子的部分","explanation":"錯誤。充分分布的氣體並非只占瓶底。"},{"id":"D","text":"氣體可占據的整個300 mL瓶內空間","explanation":"正確。氣體會填滿當時全部可達容積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S013","stem":"將固定份量的氣體移入較大的密閉瓶，維持氣態且無反應，充分分布後哪項變化最符合基本粒子模型？","concept":"氣體能填滿較大空間，是粒子持續移動與重新分布的結果。若樣品沒有進出、沒有反應或相變，分子總數與單個分子的尺寸都不需要改變。較大空間分配給相同數量的分子，平均每單位體積的分子變少，分布較疏。這是樣品膨脹與分子本身膨大之間的核心差別。","correct":"C","options":[{"id":"A","text":"分子數變多，分子尺寸不變","explanation":"錯誤。固定份量且無反應或流失時，分子數不因容器變大而增加。"},{"id":"B","text":"分子數不變，每個分子尺寸變大","explanation":"錯誤。氣體膨脹主要改變分子間空間，不是分子尺寸。"},{"id":"C","text":"分子數不變，分子平均分布較疏","explanation":"正確。同樣數目的分子分布在較大空間，平均更疏散。"},{"id":"D","text":"分子數變少，分子平均間距不變","explanation":"錯誤。題設份量不變，不能用減少分子解釋膨脹。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S014","stem":"一瓶氣體抽走一部分後立刻關閥，其餘氣體保持氣態並充分散布。哪項描述正確？","concept":"抽氣改變的是留在瓶內的氣體份量，與活塞壓縮同一份氣體不同。關閥後剩餘分子仍能自由移動，在足夠時間後分布於整個可達空間。瓶子的內部容積若沒有改變，氣體所占體積便仍相同，只是分布較稀疏。不能把「分子較少」直接理解成瓶中必有一塊永久沒有氣體的區域。","correct":"A","options":[{"id":"A","text":"剩餘氣體仍占滿可達瓶內空間","explanation":"正確。減少份量不使剩餘氣體具有固定的小體積。"},{"id":"B","text":"剩餘氣體只占瓶子下半部","explanation":"錯誤。一般充分分布模型不因抽走部分氣體而將其限制在下半部。"},{"id":"C","text":"剩餘氣體的分子被抽成較小尺寸","explanation":"錯誤。抽氣移走分子，而非縮小剩餘分子。"},{"id":"D","text":"剩餘氣體必以原來的分子間距縮成一團","explanation":"錯誤。氣體可重新擴展，沒有保持原間距結團的要求。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S015","stem":"一份氣體由短寬瓶移入細長瓶，兩瓶內部可用容積相同，且沒有氣體流失或相變。充分散布後何者正確？","concept":"氣體沒有自己的固定形狀，樣品外形會由容器中可達空間的輪廓決定。體積則看空間的總量，不能只比較瓶子的一個寬度。本題兩瓶容積相同，所以轉移後氣體外形改變，體積卻恰好相同。一次體積未變，並不反駁氣體無固定體積，因為此處的限制容積本來就相等。","correct":"C","options":[{"id":"A","text":"氣體體積減少，因細長瓶較窄","explanation":"錯誤。題目已給兩瓶可用容積相同，窄並不代表容積較小。"},{"id":"B","text":"分子變成細長形，才能適應新瓶","explanation":"錯誤。改變的是樣品占據區域，分子本身不需拉長。"},{"id":"C","text":"氣體取得新瓶的形狀，所占體積相同","explanation":"正確。氣體的外形隨容器，而體積由可達容積決定。"},{"id":"D","text":"氣體保留短寬瓶的外形，體積相同","explanation":"錯誤。氣體沒有可自行保留的固定外形。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S016","stem":"關於密閉容器中充分散布的氣體，下列哪項微觀描述能解釋它在上、下各處都可被取樣到？","concept":"氣體粒子通常相距很遠，而且會持續快速移動、改變位置與碰撞。因此經過充分散布，取樣不必只限於最初注入的位置。所謂氣體充滿容器，是很多運動粒子遍及可達空間的巨觀表現，不是每顆粒子永久停在某處，也不是所有分子連成一塊。這個模型直接連結分子運動與氣體的可擴展性。","correct":"B","options":[{"id":"A","text":"分子各固定在指定高度，只能小幅振動","explanation":"錯誤。這不是一般氣體粒子的運動方式。"},{"id":"B","text":"分子不斷移動，並與其他分子和容器壁碰撞","explanation":"正確。持續移動使粒子能散布於整個可達空間。"},{"id":"C","text":"分子一旦到達瓶頂，就不再改變位置","explanation":"錯誤。分子到瓶頂仍會碰撞並繼續運動。"},{"id":"D","text":"分子必先相連成連續固體才能占據全瓶","explanation":"錯誤。氣體填滿空間並不需要形成固定相連結構。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S017","stem":"活塞向內推，使一份密閉氣體在不液化、不反應時體積減少。主要縮小的是哪一部分？","concept":"氣體容易壓縮，是因分子之間通常相距很遠。活塞縮小容器空間時，同一群分子分布得更密，平均間隙減少；分子並不是小海綿般被壓扁。題設排除流失、反應與液化，因此也沒有減少分子總數的依據。","correct":"C","options":[{"id":"A","text":"每個分子內原子的尺寸","explanation":"錯誤。壓縮樣品不等於縮小原子本體。"},{"id":"B","text":"氣體樣品的總質量","explanation":"錯誤。密閉、無反應且無相變的同份氣體，總質量不因壓縮而減少。"},{"id":"C","text":"分子之間原有的空間","explanation":"正確。氣體分子間有較大空間，壓縮主要減少這些間隙。"},{"id":"D","text":"氣體分子的總數","explanation":"錯誤。密閉且無反應或相變，總分子數不因壓縮而減少。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S018","stem":"比較相同份量的一般氣體與液體，何者最能解釋氣體通常較容易被壓縮？","concept":"可壓縮性與流動性不同。液體雖能流動，粒子已彼此靠近，體積不容易再大幅減少；氣體則有較大的粒子間空間可供縮減。比較三態時，要用間距解釋壓縮，不能把液體不易壓縮誤寫成粒子完全不能移動。","correct":"B","options":[{"id":"A","text":"氣體粒子的運動可以完全停止","explanation":"錯誤。易壓縮並不要求粒子停止運動。"},{"id":"B","text":"氣體粒子間通常有較多可縮減的空間","explanation":"正確。液體粒子已靠近，能再縮減的間隙有限。"},{"id":"C","text":"氣體粒子完全沒有體積","explanation":"錯誤。分子有本身尺寸，不能以不存在的體積解釋。"},{"id":"D","text":"液體粒子全都固定不能相對移動","explanation":"錯誤。液體粒子可以相互滑過，但通常不易壓縮。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S019","stem":"一份氣體經密閉壓縮後仍保持原物質與氣態。壓縮前後，下列哪項應相同？","concept":"壓縮是同一份氣體占用空間減少的過程。把不變量和變量分開：密閉、無反應時分子數及化學身分保留；維持氣態而體積縮小時，分子分布較密。由此可見，樣品大小改變不代表構成樣品的分子數量或種類必須改變。","correct":"A","options":[{"id":"A","text":"分子總數與單個分子的身分","explanation":"正確。沒有進出或化學反應，不會因體積變小而改變這兩項。"},{"id":"B","text":"樣品體積與平均分子間空間","explanation":"錯誤。壓縮會減少樣品體積並使分布較密。"},{"id":"C","text":"樣品體積與分子總數","explanation":"錯誤。分子總數保留，但樣品體積減少。"},{"id":"D","text":"平均分子間空間與單個分子身分","explanation":"錯誤。身分可保留，但間空間不應視為不變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S020","stem":"一個密閉氣袋被拉大，內部氣體沒有反應或相變。分子模型應如何改變才合理？","concept":"膨脹與壓縮可用同一個粒子模型理解。氣袋容積增加後，氣體會填滿新增可達空間；若裝置密閉且無反應或相變，總分子數不變。相同大小與數量的分子分散到較大區域，就形成較疏的分布，不必改變單個分子的大小。","correct":"D","options":[{"id":"A","text":"把分子畫成更大的球，維持原間距","explanation":"錯誤。氣體膨脹主要增加分子間空間，而不是球的尺寸。"},{"id":"B","text":"增加分子數，使每單位體積的分子數完全不變","explanation":"錯誤。密閉裝置沒有增加氣體份量的來源。"},{"id":"C","text":"減少分子數，使留下的分子保持原位置","explanation":"錯誤。膨脹不等於抽走分子，粒子也會持續移動。"},{"id":"D","text":"保留分子數與尺寸，使整體分布較疏","explanation":"正確。同一群分子散布在較大空間，平均間距增加。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S021","stem":"兩個相同溫度、相同容積的容器裝有同種氣體，甲的分子數較多，均未液化。僅依分子分布，何者合理？","concept":"氣體分布疏密同時取決於分子數與可用空間。容積相同時，分子數較多的一份平均分布較密；這與增加分子本體尺寸不同。兩瓶的氣體仍各自填滿容器，也都在運動。本題僅比較平均分布，不需計算壓力或運用氣體方程式。","correct":"B","options":[{"id":"A","text":"甲的每個分子較大","explanation":"錯誤。同種氣體不因加入較多分子而使單個分子膨大。"},{"id":"B","text":"甲的分子平均分布較密","explanation":"正確。相同空間中有更多分子，每單位體積分子數較多。"},{"id":"C","text":"乙的分子一定停止運動","explanation":"錯誤。較少分子仍持續運動。"},{"id":"D","text":"甲只能占瓶底，乙才可充滿容器","explanation":"錯誤。兩份氣體都可分布於整個可達容器。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S022","stem":"對密閉氣體進行同溫壓縮，且維持氣態。依基本粒子模型，下列何者最合理？","concept":"同溫條件使比較可集中在疏密改變。氣體受到壓縮時，同樣數目的分子位於較小空間，平均更靠近；運動中的分子通常更常遇到其他分子。碰撞變頻繁不代表分子必須反應，也不表示粒子停止運動或變成固定排列。","correct":"C","options":[{"id":"A","text":"分子必先分解才可變得更靠近","explanation":"錯誤。減少分子間空間不需要化學分解。"},{"id":"B","text":"分子數會因碰撞而持續增加","explanation":"錯誤。一般碰撞不等於產生新分子。"},{"id":"C","text":"分子平均距離減小，相互碰撞通常更頻繁","explanation":"正確。同溫下粒子更密，遇到其他粒子的機會增加。"},{"id":"D","text":"分子固定在各自位置，因此不再碰撞","explanation":"錯誤。保持氣態時，粒子仍持續移動與碰撞。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S023","stem":"同學說：「氣體容易壓縮，所以每顆分子都容易被壓成一半大小。」最適當的修正是何者？","concept":"樣品體積包含分子本體及分子間空間。氣體的分子間空間占有很大比例，因此縮減間隙就能使樣品明顯變小。若沒有反應、流失或相變，分子總數與身分都可維持。把容器變小畫成每顆分子縮小，是混淆巨觀體積與微觀尺寸。","correct":"A","options":[{"id":"A","text":"易壓縮主要反映分子間空間可縮減","explanation":"正確。巨觀體積減少不能直接等同分子本體縮小。"},{"id":"B","text":"壓縮只會減少分子數，分子間空間不變","explanation":"錯誤。密閉氣體壓縮通常保留分子數。"},{"id":"C","text":"氣體實際上不能壓縮，只能液化","explanation":"錯誤。氣體可以在保持氣態時被壓縮。"},{"id":"D","text":"壓縮表示所有分子都變為原子","explanation":"錯誤。壓縮不等於分解分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S024","stem":"一份液體與一份氣體各裝入可推動活塞的裝置，均不發生相變。對可壓縮性的敘述，何者最恰當？","concept":"液體與氣體都能依容器改形，卻有不同可壓縮性。兩者的差異在於氣體粒子通常較疏遠，而液體粒子已緊密靠近。在保持各自物態的一般比較下，氣體較容易明顯減少體積；這個推論不要求液體粒子靜止，也不要求兩份樣品同種。","correct":"D","options":[{"id":"A","text":"液體可流動，所以必比氣體更易壓縮","explanation":"錯誤。流動與體積能否大幅縮減是不同性質。"},{"id":"B","text":"兩者都無固定形狀，所以可壓縮性必相同","explanation":"錯誤。無固定形狀不能決定分子間空間大小。"},{"id":"C","text":"液體不能流動，所以比氣體難壓縮","explanation":"錯誤。液體可以流動，不易壓縮另有粒子間距原因。"},{"id":"D","text":"氣體粒子較疏，通常能被壓到較小的體積比例","explanation":"正確。液體粒子較靠近，可縮減的間空間有限。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S025","stem":"液態水由圓杯倒入方形杯，份量與溫壓不變且沒有損失。哪項敘述最合理？","concept":"液體的固定體積是指同份樣品在相同條件下有近似固定的空間量；無固定形狀則表示外形能隨容器改變。粒子互相滑過即可完成這種重新排列，不必使分子本身變形。換成方杯後外形變了，並不表示液體體積也一定改變。","correct":"A","options":[{"id":"A","text":"水的外形改變，但體積近乎不變","explanation":"正確。液體順應所占容器部分的形狀，仍保有一定體積。"},{"id":"B","text":"水的每個分子都從圓形變成方形","explanation":"錯誤。容器改變的是樣品外形，不是分子外形。"},{"id":"C","text":"水會自行增加體積直到充滿新杯","explanation":"錯誤。液體不像氣體任意擴展到全部可達容積。"},{"id":"D","text":"水完全保持倒入前的圓杯外形","explanation":"錯誤。液體沒有自身固定形狀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S026","stem":"液體能沿傾斜杯壁流出，最適合用哪一種粒子行為解釋？","concept":"液體兼具「粒子靠近」與「可相對移動」兩個重點。靠近使體積較穩定、不易壓縮；相對位置可變使液體能流動。倒水過程不需先把水分子變成氣體，也不需改變分子身分，只要分子彼此滑過並重新分布即可。","correct":"C","options":[{"id":"A","text":"粒子之間完全沒有空間且永不移動","explanation":"錯誤。粒子仍有運動，不能把靠近寫成完全靜止。"},{"id":"B","text":"粒子相距極遠，只與容器壁作用","explanation":"錯誤。這不是一般液體粒子靠近的模型。"},{"id":"C","text":"粒子彼此靠近，但可改變相對位置","explanation":"正確。相互滑動使液體得以流動及改形。"},{"id":"D","text":"粒子全被限制在各自固定位置附近","explanation":"錯誤。此描述較符合固態，不能解釋液體整體流動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S027","stem":"下列哪一敘述把液體的性質描述得最完整？","concept":"液體不是固體與氣體性質的隨意混合。它的粒子間距通常很小，因此一份液體有一定體積；粒子又能相互滑動，因此形狀隨容器改變。應說它取得「所占部分」的形狀，而不是無論有多少液體都會自行填滿整個大容器。","correct":"B","options":[{"id":"A","text":"有固定形狀，但沒有固定體積","explanation":"錯誤。液體不具有自身固定形狀。"},{"id":"B","text":"有近似固定體積，形狀取決於所占容器部分","explanation":"正確。此組合區別於固體保形與氣體任意擴展。"},{"id":"C","text":"無固定體積，且粒子在固定位置振動","explanation":"錯誤。這把氣體與固體的不同特徵混在一起。"},{"id":"D","text":"會填滿全部容器，而且容易大幅壓縮","explanation":"錯誤。這較符合氣體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S028","stem":"一份液體換入較寬容器後，液面變低。若已確認沒有損失且溫壓不變，何者正確？","concept":"液面高度受到容器橫截面影響，不能單獨當作液體體積。將同份液體移到較寬容器，液體在水平方向占用較大面積，液面可以更低而總體積相同。因此液體有固定體積，並不意味換任何容器都必須保持相同的液面高度。","correct":"D","options":[{"id":"A","text":"液面變低直接證明液體分子數減少","explanation":"錯誤。題設已排除損失，液面高度不直接代表份量。"},{"id":"B","text":"液面變低直接證明每個分子變小","explanation":"錯誤。高度可因容器形狀改變而下降。"},{"id":"C","text":"液面變低表示液體必已變成固體","explanation":"錯誤。液體換容器即可改變液面高度，不需相變。"},{"id":"D","text":"液體可維持原體積而以較小高度占據較寬區域","explanation":"正確。高度只是空間尺寸之一，不等於體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S029","stem":"「液體不易壓縮」最能直接支持哪一項微觀判斷？","concept":"壓縮需要減少樣品占據的空間。液體粒子原本就靠近，因而通常不易大幅縮小體積。這項觀察支持粒子較密集，卻不能推論粒子靜止或固定成晶格；液體粒子能相對移動，正是其有體積而無固定形狀的原因。","correct":"A","options":[{"id":"A","text":"粒子之間已相當靠近","explanation":"正確。可供再縮減的粒子間空間有限。"},{"id":"B","text":"粒子完全不能改變相對位置","explanation":"錯誤。液體粒子仍可相互滑動。"},{"id":"C","text":"粒子必排成固定規則晶格","explanation":"錯誤。液體不需要固體般的固定排列。"},{"id":"D","text":"粒子運動速度必為零","explanation":"錯誤。不易壓縮不等於粒子停止運動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S030","stem":"往原有液體再加入同種液體後，總體積增加。這是否推翻液體具有近似固定體積的敘述？","concept":"三態性質所說的固定體積，並非所有液體份量都占同樣大小的空間。它是在樣品份量與條件不變時，比較換容器等操作是否改變體積。額外加水使樣品本身變多，總體積增加完全合理，不能用來否定同份液體的體積穩定性。","correct":"C","options":[{"id":"A","text":"是，固定體積表示加入再多液體也不能增加體積","explanation":"錯誤。固定體積的比較前提是同一份樣品。"},{"id":"B","text":"是，只要能倒入另一容器就沒有固定體積","explanation":"錯誤。倒入是形狀變化，不必是同份液體體積變化。"},{"id":"C","text":"否，加入液體改變了樣品份量","explanation":"正確。應比較相同份量在相同條件下的體積。"},{"id":"D","text":"否，因液體其實具有固定形狀","explanation":"錯誤。結論雖是否定，但理由錯把液體當作固體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S031","stem":"水仍保持液態時，哪項觀察最不宜單獨當成「水體積改變」的證據？","concept":"判斷液體體積要觀察完整空間量，不能忽略容器幾何。對不同寬度的杯子，同份水可以有不同高度，因此僅見液面升降不足以推論體積變化。若容器截面固定或已用可靠刻度量測，高度或讀值才具有較明確的體積意義。","correct":"B","options":[{"id":"A","text":"同一量筒、同一讀法下體積刻度改變","explanation":"錯誤。控制容器與讀法後，刻度變化可提供體積資訊。"},{"id":"B","text":"換不同寬度的杯子後液面高度改變","explanation":"正確。不同截面可使同體積具有不同高度。"},{"id":"C","text":"完整回收後，校準體積讀值與原值不同","explanation":"錯誤。可靠的體積讀值差異是需要解釋的證據。"},{"id":"D","text":"在已知固定截面的直筒中，占用高度改變","explanation":"錯誤。固定截面時，高度改變對應體積改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S032","stem":"一般固體能維持自身形狀，主要對應哪一項粒子模型？","concept":"固體的宏觀外形穩定，不表示微觀世界停止運動。其粒子彼此靠近，而且通常被限制在各自位置附近振動，不像液體粒子可持續相互滑過。正是位置限制使一般固體保有自身形狀，也解釋了為何「粒子會動」不足以判定樣品為液體或氣體。","correct":"C","options":[{"id":"A","text":"粒子相距很遠並遍及全部容器","explanation":"錯誤。此模型較符合氣體。"},{"id":"B","text":"粒子靠近且可任意滑過彼此","explanation":"錯誤。可相對滑動較能解釋液體流動。"},{"id":"C","text":"粒子靠近，主要在各自位置附近振動","explanation":"正確。相對位置受到限制，有助於維持固體外形。"},{"id":"D","text":"所有粒子在任何條件下都完全靜止","explanation":"錯誤。固體粒子仍有振動，並非絕對靜止。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S033","stem":"把一塊完整的固體從桌面搬到架上，哪項敘述正確？","concept":"三態的形狀性質描述的是樣品自身外形，而不是樣品在房間裡的位置。固體可平移或轉動，內部粒子仍保持大致固定的相對配置。本題搬動整塊物體並未提供熔化證據，不能把巨觀位移與液體粒子的相對滑動混為一談。","correct":"A","options":[{"id":"A","text":"整塊物體移動不代表內部粒子像液體般相互流動","explanation":"正確。物體位置改變與粒子相對位置自由改變是兩回事。"},{"id":"B","text":"只要物體移動，就必定已熔化","explanation":"錯誤。固體能整體搬動而保持原形。"},{"id":"C","text":"固體形狀固定表示它不能改變所在位置","explanation":"錯誤。固定形狀不等於固定在空間的某個地點。"},{"id":"D","text":"搬動會必然使粒子分散到整間房間","explanation":"錯誤。保持固態時，粒子不會因此像氣體般擴散。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S034","stem":"「固體粒子在固定位置附近振動」中的「附近」主要提醒我們何事？","concept":"固態模型中，粒子的活動範圍受到限制，但仍能在各自位置周圍振動。這種局部運動與液體長時間改換鄰近粒子、氣體遍及容器的移動不同。「固定位置附近」同時保留位置穩定與微觀運動兩層意思，不能只留下其中一層。","correct":"D","options":[{"id":"A","text":"固體粒子可以隨時流遍整個容器","explanation":"錯誤。此描述取消了固態的位置限制。"},{"id":"B","text":"固體一定會自行擴展到大容器的各角落","explanation":"錯誤。這是氣體的擴展特徵。"},{"id":"C","text":"固體粒子間距一定比氣體更大","explanation":"錯誤。一般固體粒子較緊密。"},{"id":"D","text":"粒子可有小幅運動，並非精確停在一點","explanation":"正確。位置受限不等於完全沒有振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S035","stem":"一塊固體受強力敲擊而裂成數塊，各碎塊仍保有自己的形狀。哪項判斷最合理？","concept":"固體保持自身形狀，並不是承諾任何外力都不能改變它。敲裂改變了樣品的整體邊界，但碎塊仍可具有固定形狀與體積。判態應看各碎塊本身的性質，不能因整堆顆粒可以傾倒，就把顆粒中的物質誤判為液體。","correct":"B","options":[{"id":"A","text":"碎塊能倒出，故每一塊都是液體","explanation":"錯誤。顆粒整體傾倒不等於各顆粒呈液態。"},{"id":"B","text":"破裂改變整塊外形，但不必改變碎塊的固態","explanation":"正確。固體可受外力破裂而仍維持固體粒子特徵。"},{"id":"C","text":"固體有固定形狀，所以不可能被敲裂","explanation":"錯誤。固定形狀是通常條件下的性質，並非不可破壞。"},{"id":"D","text":"碎塊數增加表示微觀粒子總數必定增加","explanation":"錯誤。把物體分成數份不等於創造新的微觀粒子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S036","stem":"下列哪一項觀察能與「固體粒子仍在振動」同時成立？","concept":"粒子尺度的運動與肉眼看到的形狀穩定可以並存。當粒子只在位置附近作小幅振動，它們仍保有大致固定的相對關係，整塊固體便可維持外形。不能由「看不出物體在流動」推論所有粒子都完全不動，也不能由振動推論樣品會填滿容器。","correct":"A","options":[{"id":"A","text":"整塊固體在一般條件下保持近似固定外形","explanation":"正確。局部振動不必造成巨觀流動或外形消失。"},{"id":"B","text":"粒子必須自由滑到任意鄰居旁","explanation":"錯誤。持續自由換位不是一般固態振動的必要條件。"},{"id":"C","text":"固體必須填滿放置它的全部容器","explanation":"錯誤。粒子振動不使固體像氣體般擴展。"},{"id":"D","text":"固體體積必須隨容器容量等比例增加","explanation":"錯誤。固體有自身體積，不由空容器容量任意決定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S037","stem":"一塊固體放入容積更大的盒子，未受擠壓、加熱或其他改變。何者最合理？","concept":"容器提供可用空間，卻不會讓所有物態都自動填滿它。氣體會擴展至可達空間，液體只以既有體積順應容器，固體則通常保有自身形狀與體積。本題排除外力與相變因素，因此換大盒子並不需要改變固體的外形或粒子配置。","correct":"C","options":[{"id":"A","text":"固體會自動變成與盒子同樣大小","explanation":"錯誤。固體不會因可用空間增加而任意擴展。"},{"id":"B","text":"固體粒子會改成互不接近的氣態分布","explanation":"錯誤。換盒子本身不提供相變證據。"},{"id":"C","text":"固體大致保留原形與體積","explanation":"正確。一般固體的形狀和體積不由較大盒子的尺寸決定。"},{"id":"D","text":"固體會只保留體積，立即流成盒底形狀","explanation":"錯誤。這較符合液體，不符合維持固態的條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S038","stem":"甲粒子相距遠且不斷改變位置；乙粒子靠近並可相互滑過；丙粒子靠近且主要在原位置附近振動。三者依序最符合何態？","concept":"微觀判態需要同時看粒子間距與位置限制。氣體通常較疏遠且可廣泛移動；液體粒子靠近但能滑過彼此；固體粒子靠近且活動侷限在位置附近。只背「粒子會運動」無法區分三態，必須補上運動範圍與相對位置是否持續改變。","correct":"B","options":[{"id":"A","text":"液、氣、固","explanation":"錯誤。相距遠且可遍及容器的甲較符合氣體。"},{"id":"B","text":"氣、液、固","explanation":"正確。依序對應疏遠自由移動、靠近滑動、靠近受限振動。"},{"id":"C","text":"氣、固、液","explanation":"錯誤。乙、丙的相對位置限制被對調了。"},{"id":"D","text":"固、液、氣","explanation":"錯誤。甲和丙的粒子間距及位置限制均不符合此排列。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S039","stem":"只知道某樣品的粒子「彼此靠近」，在一般三態模型中還不能唯一區分哪兩態？","concept":"固體與液體同屬粒子較靠近的狀態，因此都通常不易壓縮。要進一步區分，需觀察粒子是否主要受限在各自位置附近，或能持續相互滑過。間距是有用線索，但它不是對任何兩態都足夠的唯一判準。","correct":"A","options":[{"id":"A","text":"固體與液體","explanation":"正確。兩者粒子都靠近，還需比較位置限制或是否能滑動。"},{"id":"B","text":"氣體與固體，因兩者都只能原地振動","explanation":"錯誤。氣體粒子並非只能原地振動。"},{"id":"C","text":"氣體與液體，因兩者粒子通常同樣疏遠","explanation":"錯誤。液體粒子通常比氣體靠近許多。"},{"id":"D","text":"三態完全不能區分，因三態間距必相同","explanation":"錯誤。典型氣態粒子間距與凝聚態有明顯差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S040","stem":"哪一項陳述適合描述一般三態中的粒子？","concept":"三態性質不是由粒子「有動或沒動」二分出來。固態粒子可局部振動；液態粒子可在靠近的情況下滑動；氣態粒子則較疏遠而廣泛移動。理解這些不同的限制，才能把微觀行為連結到固定形狀、固定體積與可壓縮性。","correct":"D","options":[{"id":"A","text":"只有氣體粒子會運動","explanation":"錯誤。液體粒子會移動，固體粒子也會振動。"},{"id":"B","text":"固體與液體粒子都完全靜止","explanation":"錯誤。兩態的粒子仍有不同形式的運動。"},{"id":"C","text":"粒子只要有運動，就一定沒有固定體積","explanation":"錯誤。液體與固體粒子會動而樣品仍有一定體積。"},{"id":"D","text":"三態粒子都有運動，但活動方式與位置限制不同","explanation":"正確。運動本身是共有現象，差別在其範圍與方式。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S041","stem":"兩份樣品的粒子都相當靠近，其中一份可流動改形，另一份通常保形。哪項差異最能解釋這兩種行為？","concept":"兩份樣品既然都粒子密集，就不能只用「靠近」解釋一個能流動而另一個保形。真正有區別的是相對位置自由度：液體粒子能互相滑過，固體粒子則通常只在原位置附近振動。這使液固可共享不易壓縮性，卻有不同形狀性質。","correct":"C","options":[{"id":"A","text":"可流動者的單個粒子必比保形者大","explanation":"錯誤。粒子本體大小不是本題形狀與流動差異的依據。"},{"id":"B","text":"保形者的粒子一定完全不振動","explanation":"錯誤。固態仍有局部振動。"},{"id":"C","text":"可流動者粒子可持續改變相對位置，保形者較受位置限制","explanation":"正確。此差異對應液態與固態的運動方式。"},{"id":"D","text":"可流動者粒子必比氣體更疏遠","explanation":"錯誤。液體能流動不需要氣體般的大間距。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S042","stem":"一張粒子照片只記錄極短瞬間。照片中粒子看起來密集，沒有提供後續位置資料。何者最合理？","concept":"靜態影像只能提供當下位置，不能直接證明粒子是否可滑動或只作局部振動。固體與液體粒子都可能相當靠近，因此密集的單張照片不足以唯一判定。補上時間序列、流動性或保形行為，才有足夠資料連結微觀模型與物態。","correct":"B","options":[{"id":"A","text":"可立即證明所有粒子永遠不動","explanation":"錯誤。單一瞬間不能顯示之後的運動。"},{"id":"B","text":"仍須運動或巨觀資料，才能進一步區分固態與液態","explanation":"正確。兩者都可能呈現密集的瞬間分布。"},{"id":"C","text":"可立即證明樣品容易像氣體般大幅壓縮","explanation":"錯誤。密集粒子反而不支持典型疏遠氣態模型。"},{"id":"D","text":"可立即證明樣品沒有固定體積","explanation":"錯誤。液固兩態都可能有一定體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S043","stem":"一片冰逐漸變成液態水。此物態改變稱為何者？","concept":"判斷物態改變名稱，先寫出起態與終態。冰是固態水，熔成水後為液態，因此方向為固態到液態，稱為熔化。名稱取決於轉換方向，不能只因前後都與水有關就和凝結、凝固或汽化混用。","correct":"D","options":[{"id":"A","text":"凝結","explanation":"錯誤。凝結是氣態變為液態。"},{"id":"B","text":"凝固","explanation":"錯誤。凝固是液態變為固態。"},{"id":"C","text":"汽化","explanation":"錯誤。汽化是液態變為氣態。"},{"id":"D","text":"熔化","explanation":"正確。冰由固態轉為液態水，方向是固態到液態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S044","stem":"水蒸氣遇到冷表面後形成液態水滴，這段變化的起態與終態為何？","concept":"「水蒸氣」指氣態水，「水滴」指液態水。從兩者的先後順序可直接判定為氣態到液態，也就是凝結。前後分子仍為H₂O，改變的是分子聚集與運動情況；不要把冷表面出現液滴一律解釋成冰熔化。","correct":"B","options":[{"id":"A","text":"固態到液態","explanation":"錯誤。題目起始是水蒸氣，而不是冰。"},{"id":"B","text":"氣態到液態","explanation":"正確。水蒸氣凝結形成液滴。"},{"id":"C","text":"液態到氣態","explanation":"錯誤。這是汽化方向，與題目相反。"},{"id":"D","text":"液態到固態","explanation":"錯誤。題目終點是液滴而不是冰。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S045","stem":"對一般三態的純物質，改變溫度或壓力可能造成物態轉變。關於這項原理，哪項理解最恰當？","concept":"溫度與壓力是可能影響物態的條件，而不是保證相變的口令。判定實際轉態仍需初始狀態、變化幅度與前後觀察。若題目只說壓力有變，不能直接斷言已液化，更不能推論分子身分已改變。","correct":"A","options":[{"id":"A","text":"這些因素可影響物態，但仍須知道具體條件與實際結果","explanation":"正確。「可能」不表示任意變化都必然跨越相界。"},{"id":"B","text":"溫度只要改變一點，任何物質都必定熔化","explanation":"錯誤。物質與初始條件不同，不一定發生熔化。"},{"id":"C","text":"壓力一改變，分子必定分解","explanation":"錯誤。物態變化不等於化學分解。"},{"id":"D","text":"必須同時改變溫度與壓力，才可能改變物態","explanation":"錯誤。溫度或壓力的改變都可能影響狀態，並非必須同時改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S046","stem":"冰熔化為水之後，在仍保持液態的前提下，粒子行為最主要如何改變？","concept":"熔化使固態的相對位置限制減弱，粒子能在保持靠近的情況下相互移動，因此水可流動並依容器改形。這不是把分子變成更小粒子，也不是讓液體立即具有氣體的疏遠分布。此題應比較運動方式，而不是推定任何熔化都具有相同體積增減。","correct":"C","options":[{"id":"A","text":"分子仍只能原地振動，因此液水維持冰塊原形","explanation":"錯誤。熔化後液水可流動改形，粒子不再只有固態的位置限制。"},{"id":"B","text":"分子由可自由流動變成受固定位置限制","explanation":"錯誤。這把固液運動自由度的方向寫反。"},{"id":"C","text":"分子不再僅受限於原位置附近，可相互滑過","explanation":"正確。這是由固態到液態的運動方式變化。"},{"id":"D","text":"分子必擴散到整個房間而完全不靠近","explanation":"錯誤。液體粒子仍靠近，不等於氣態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S047","stem":"某純物質經操作後由氣態成為液態，且未發生化學反應。下列何者最合理？","concept":"物態轉換須由起終兩態一起判名。氣態變液態是凝結，分子由較疏遠的分布聚集成液體中較靠近、仍能滑動的狀態。題設明定無反應，因此應保留原物質身分；液體出現並不足以單獨把過程稱為熔化。","correct":"D","options":[{"id":"A","text":"必稱為熔化，因液體出現了","explanation":"錯誤。熔化要求起態是固態。"},{"id":"B","text":"粒子必由靠近變為非常疏遠","explanation":"錯誤。氣態到液態通常使分子更靠近。"},{"id":"C","text":"分子身分必改變為另一種物質","explanation":"錯誤。單純相變不要求化學身分改變。"},{"id":"D","text":"可稱為凝結，粒子聚集成較靠近的液態分布","explanation":"正確。這符合氣態到液態的方向與粒子模型。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S048","stem":"密閉系統中的純水僅經冰、水、水蒸氣之間的物態改變，沒有化學反應。何者保持不變？","concept":"相變改變的是同一物質的物理狀態。純水從冰成為液態水或水蒸氣，分子身分仍為H₂O；不同的是排列、間距與運動方式。因此分子身分不變可以與體積、形狀及活動範圍改變同時成立。","correct":"B","options":[{"id":"A","text":"所有分子的相對位置","explanation":"錯誤。物態改變會改變排列與運動限制。"},{"id":"B","text":"構成水的分子仍為H₂O","explanation":"正確。單純水的相變不把H₂O改成其他物質。"},{"id":"C","text":"三種狀態的樣品體積必完全相同","explanation":"錯誤。分子間距與配置改變，體積不必相同。"},{"id":"D","text":"每個分子的活動範圍","explanation":"錯誤。固液氣的活動自由度不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S049","stem":"有人把「水蒸氣凝結」寫成「H₂O分解成H₂與O₂」。最主要的錯誤為何？","concept":"水蒸氣和液態水的共同化學身分都是H₂O。凝結可使分子更靠近，卻不需要把水分子拆成氫氣與氧氣；後者是不同的化學變化。判讀時要分清「分子重新排列與聚集」和「分子改成不同物質」兩種層次。","correct":"A","options":[{"id":"A","text":"把保留分子身分的物態改變，誤當成產生不同物質的反應","explanation":"正確。凝結後仍是H₂O，只是成為液態。"},{"id":"B","text":"把凝結的終態寫成液態","explanation":"錯誤。凝結終態本來就是液態。"},{"id":"C","text":"認為氣態水可變為液態水","explanation":"錯誤。這正是凝結的物態方向。"},{"id":"D","text":"認為凝結會改變粒子間距","explanation":"錯誤。間距改變符合相變的粒子模型。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-S050","stem":"一個不漏氣的裝置中，部分水蒸氣凝結為液滴。若沒有反應，下列哪項正確？","concept":"守恆需要先劃定系統。密閉裝置中，凝結可以使氣相水分子變少、液相水分子變多，但兩相合計不變。單相的減量不代表整個系統損失物質，更不代表水分子分解。正確做法是把所有仍在裝置內的H₂O一起計算。","correct":"C","options":[{"id":"A","text":"氣相分子數減少表示全部水分子都消失","explanation":"錯誤。轉入液滴的分子仍在裝置內。"},{"id":"B","text":"液滴增加表示裝置必從外界吸入水分子","explanation":"錯誤。液滴可由原有氣態水凝結形成。"},{"id":"C","text":"氣相與液相合計的H₂O分子總數保持不變","explanation":"正確。凝結改變所屬物態，不改變密閉系統的總分子數。"},{"id":"D","text":"氣相與液相各自的分子數都必保持不變","explanation":"錯誤。發生淨凝結時，分子由氣相轉入液相。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-2-topic01-G03-B001","stem":"甲、乙、丙三份純物質維持各自物態。甲轉移後保留自身外形；乙能流動且同份樣品不易壓縮；丙能流動且易明顯壓縮。三者最合理的判態為何？","concept":"先用自身形狀辨認甲，再用可壓縮性區分兩個可流動樣品。一般固體保形；液體與氣體都能流動，但液體粒子較靠近，氣體粒子間有大空間。因此甲、乙、丙依序為固、液、氣，不必借助顏色或物質名稱。","correct":"A","options":[{"id":"A","text":"甲固態、乙液態、丙氣態","explanation":"正確。三項分別由保形、流動且不易壓縮、流動且易壓縮辨認。"},{"id":"B","text":"甲固態、乙氣態、丙液態","explanation":"錯誤。乙與丙的可壓縮性被對調。"},{"id":"C","text":"甲液態、乙固態、丙氣態","explanation":"錯誤。甲保形而乙可流動，與此排列相反。"},{"id":"D","text":"甲氣態、乙液態、丙固態","explanation":"錯誤。氣體不保有自身外形，固體也不呈本題丙的流動性。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B002","stem":"甲樣品在相同溫度、相同所受壓力下，由40 mL容器完整移入90 mL容器，體積皆為18 mL，但外形改變。乙樣品則在相同溫度下由40 mL密閉容器完整移入90 mL密閉容器，先後都占滿容器，允許其壓力隨容積改變。兩者均無反應、流失或相變。甲、乙依序最可能為何？","concept":"甲在同溫、同壓下換容器，維持18 mL而改變外形，符合液體。乙在同溫下由40 mL擴展到90 mL，符合氣體；題目允許乙的壓力改變，沒有把體積變化同時限制為同壓。判態依據是各份樣品對容器改變的反應。","correct":"D","options":[{"id":"A","text":"固體、液體","explanation":"錯誤。第一份改形，第二份體積隨容器改變，不符此組合。"},{"id":"B","text":"液體、固體","explanation":"錯誤。第二份會擴展占滿較大容器，並非一般固體。"},{"id":"C","text":"氣體、液體","explanation":"錯誤。第一份沒有擴展至所有可達空間，第二份反而有。"},{"id":"D","text":"液體、氣體","explanation":"正確。甲在同溫同壓下定體積而改形；乙可改變壓力並擴展至充滿較大容器，依序符合液體、氣體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B003","stem":"未知樣品在一般壓力下不易壓縮。研究者要再做一項試驗以區分固態與液態，何者最合適？","concept":"已知不易壓縮可排除典型氣態，但固體和液體仍都可能。下一個測量應針對兩者真正不同的性質，也就是自身形狀。移除容器限制後是否流動改形，可提供區分證據；重測共有性質只會重複已有資訊。","correct":"B","options":[{"id":"A","text":"僅再確認樣品是否占據空間","explanation":"錯誤。固體和液體都占據空間，無法完成區分。"},{"id":"B","text":"在不破壞樣品且不相變下移除原容器限制，觀察是否保留自身外形","explanation":"正確。固體通常保形，液體會流動改形。"},{"id":"C","text":"僅確認樣品粒子是否有任何運動","explanation":"錯誤。固液粒子均有運動。"},{"id":"D","text":"僅確認粒子是否比典型氣體靠近","explanation":"錯誤。固液兩態通常都符合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B004","stem":"某物質由較小的甲杯完整轉移到可用容積較大的乙杯後，外形改變。另確認同份樣品在相同溫壓下體積幾乎不變。由這兩項資料可作何判斷？","concept":"判態可視為逐步排除。沒有固定形狀可能是液體或氣體，有一定體積則可能是液體或固體；兩項條件的共同候選是液體。此題訓練合併證據，不能把一項共有性質誤當成某一物態的專屬標誌。","correct":"C","options":[{"id":"A","text":"外形改變足以單獨證明它是氣體","explanation":"錯誤。液體也會改形，必須合併體積資訊。"},{"id":"B","text":"體積不變足以單獨證明它是固體","explanation":"錯誤。液體同樣有一定體積。"},{"id":"C","text":"兩項資料合併支持液態，但任一項單獨皆不足以唯一判態","explanation":"正確。改形排除典型固體，定體積排除本題氣體擴展情形。"},{"id":"D","text":"兩項資料互相矛盾，一般物質不可能同時符合","explanation":"錯誤。液體正具有這組性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B005","stem":"容器內是一堆各自保形的固體小珠，輕壓後整堆占據的空間減少；檢查發現每顆珠子尺寸不變，只是珠間空隙縮小。哪項解釋合理？","concept":"要區分材料本身體積與許多物體堆起來的外包空間。固體珠子可整顆移動，把珠子之間的空隙減少，而每顆固體仍保形保體積。因此堆積層高度下降並不直接測得固體材料的可壓縮性，需回到珠子本體尺寸判讀。","correct":"A","options":[{"id":"A","text":"整堆變小主要來自珠子重新排列，不能據此認定珠子材料像氣體般易壓縮","explanation":"正確。堆積空隙與材料內粒子間空間不是同一尺度。"},{"id":"B","text":"每顆珠子的體積必與整堆同比例縮小","explanation":"錯誤。直接觀察已指出珠子尺寸不變。"},{"id":"C","text":"珠子材料必已變為液體，否則不能重新堆積","explanation":"錯誤。固體顆粒可整顆移動重新排列。"},{"id":"D","text":"珠子總數必減少才會使整堆變小","explanation":"錯誤。重新堆積可縮減空隙，不需要移走珠子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B006","stem":"同一個硬殼盒分別裝氣體或液體，兩次盒子的外形都不變。研究者據此判定兩種內容物都有固定形狀。哪項補充能指出問題？","concept":"硬盒即使裝不同物態，仍可維持自己的外形。三態分類問的是內容物是否具有自身固定形狀，而不是外殼是否堅硬。將內容物正常轉移到其他形狀容器，或解除原來限制，才能觀察樣品本身是否保形。","correct":"D","options":[{"id":"A","text":"任何硬殼盒內的物質都會變成固體","explanation":"錯誤。容器硬度不會自動決定內容物物態。"},{"id":"B","text":"氣體具有固定形狀，只有液體的判斷錯誤","explanation":"錯誤。氣體也沒有自身固定形狀。"},{"id":"C","text":"液體具有固定形狀，只有氣體的判斷錯誤","explanation":"錯誤。液體外形也受容器限制。"},{"id":"D","text":"盒子的保形反映容器限制，須另觀察內容物離開原限制後的行為","explanation":"正確。不能把容器形狀穩定轉嫁為樣品的自身性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B007","stem":"甲說：「20 mL水與50 mL水體積不同，所以液體沒有固定體積。」乙說：「應比較同份液體在相同條件下換容器的結果。」何者正確？","concept":"物態性質的比較有隱含控制條件：樣品份量、溫度與壓力要可比。20 mL與50 mL水不是同一份量，不能用兩者差異否定固定體積。乙提出的同份轉移實驗，才是在檢查體積是否依容器容量任意改變。","correct":"B","options":[{"id":"A","text":"只有甲正確，固定體積表示所有份量的水都占同一體積","explanation":"錯誤。甲忽略了樣品份量不同。"},{"id":"B","text":"只有乙正確，固定體積的性質需在樣品份量及條件固定下比較","explanation":"正確。份量不同本來可有不同體積。"},{"id":"C","text":"兩人都正確，固定體積與沒有固定體積可以任意互換","explanation":"錯誤。兩種描述有明確的比較條件，不能任意互換。"},{"id":"D","text":"兩人都錯誤，液體只有在完全裝滿杯子時才有體積","explanation":"錯誤。未裝滿的液體也占有一定空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B008","stem":"一般純物質樣品維持單一物態時，下列哪份紀錄最需要重新檢查？","concept":"檢查紀錄要找同一樣品、同一條件下互不相容的描述。氣體填滿不同大小容器時，占據的體積隨之改變，因此不能又稱其有不受容器影響的自身固定體積。其他三份紀錄各自構成一致的固、液或氣性質組合。","correct":"C","options":[{"id":"A","text":"甲：換容器仍保形，體積近乎固定","explanation":"錯誤。此紀錄符合一般固態。"},{"id":"B","text":"乙：換容器改形，體積近乎固定且不易壓縮","explanation":"錯誤。此紀錄符合一般液態。"},{"id":"C","text":"丙：自行填滿任意較大容器，卻又記為具有自身固定體積","explanation":"正確。擴展到不同容積與固定自身體積互相衝突。"},{"id":"D","text":"丁：換容器改形、體積隨可達空間改變，容易壓縮","explanation":"錯誤。此紀錄符合一般氣態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B009","stem":"甲樣品移到雙倍容量的容器後，體積仍為原值但外形改變；乙樣品移到雙倍容量容器後，體積也變為原來兩倍。沒有相變或流失。何項比較合理？","concept":"先從體積對容器的反應辨認物態，再選相容的粒子模型。甲維持體積而改形，對應靠近且可滑動的液體粒子；乙占據更大空間，對應疏遠而能廣泛移動的氣體粒子。兩種行為都不要求分子尺寸或數量自動增加。","correct":"A","options":[{"id":"A","text":"甲粒子較靠近可滑動；乙粒子較疏遠可遍及新空間","explanation":"正確。兩份資料分別支持液態與氣態。"},{"id":"B","text":"甲粒子固定在原位置；乙粒子彼此靠近且不能移動","explanation":"錯誤。這都無法解釋題目的改形與擴展。"},{"id":"C","text":"甲、乙每個分子尺寸都必變為兩倍","explanation":"錯誤。樣品空間改變不等於分子本體膨大。"},{"id":"D","text":"甲的分子數不變，但乙的分子數必增加一倍","explanation":"錯誤。乙可以用原有分子填滿新空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B010","stem":"某簡易判態流程先問「是否保有自身固定形狀」；若否，再問「同份樣品是否有近似固定體積」。在一般三態且無相變的前提下，三個結果應如何對應？","concept":"這個流程把性質組合拆為連續判斷。能保留自身外形的通常是固體；不能保形的再比較體積，定體積為液體，體積隨容器空間改變為氣體。流程的效力來自題設只考慮一般單一三態，且操作不引起相變或破壞。","correct":"D","options":[{"id":"A","text":"第一問是：液；第一否第二是：固；兩問皆否：氣","explanation":"錯誤。液體並沒有自身固定形狀。"},{"id":"B","text":"第一問是：固；第一否第二是：氣；兩問皆否：液","explanation":"錯誤。液氣的固定體積性質被對調。"},{"id":"C","text":"第一問是：氣；第一否第二是：液；兩問皆否：固","explanation":"錯誤。氣體不保形，固體也不符合兩問皆否。"},{"id":"D","text":"第一問是：固；第一否第二是：液；兩問皆否：氣","explanation":"正確。流程依序使用固體特有的保形與液氣的體積差異。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B011","stem":"某液體裝入活塞筒，內含明顯氣泡。忽略溶解、相變與氣體流失，輕推活塞後總體積減少，並看到氣泡縮小而液體部分體積幾乎未變。應如何解讀？","concept":"一個裝置可以同時包含液相與氣相，總體積變化不必由兩者平均承擔。題目已觀察到氣泡縮小、液體部分近乎不變，支持氣體較易壓縮的模型。若要測液體本身，便不能忽略混在其中的可壓縮氣泡。","correct":"B","options":[{"id":"A","text":"液體已變成氣體，所以整筒變小","explanation":"錯誤。直接觀察顯示主要改變在原有氣泡。"},{"id":"B","text":"總體積變化主要反映氣泡的可壓縮性，不宜全歸因於液體","explanation":"正確。應分開看兩個物態各自的體積變化。"},{"id":"C","text":"只要裝有液體，整筒便不可能有可壓縮的部分","explanation":"錯誤。氣泡提供可壓縮的氣態空間。"},{"id":"D","text":"氣泡變小表示其中每個分子都縮小","explanation":"錯誤。氣體壓縮主要減少分子間空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B012","stem":"研究者只量到樣品轉移前後體積相同，便說它一定是液體。若轉移的兩個容器容積本來相等，哪項批評最完整？","concept":"氣體沒有固定體積，是說它能隨可達容積改變，並非每次轉移都必改變體積。兩個等容積容器自然可能給出相同結果；固體也可保有同一體積。因此只憑這一次讀值，既不能排除固體，也不能排除氣體，需要保形或壓縮等補充證據。","correct":"C","options":[{"id":"A","text":"相同體積足以排除固體，但不能排除氣體","explanation":"錯誤。固體轉移後也可保持相同體積。"},{"id":"B","text":"相同體積足以排除氣體，但不能排除固體","explanation":"錯誤。等容積容器中的氣體所占體積也可相同。"},{"id":"C","text":"固體可保體積，氣體也可恰占相等容積；仍需其他性質判斷","explanation":"正確。這次結果未排除另外兩態。"},{"id":"D","text":"任何樣品在等容量容器中都必發生相變","explanation":"錯誤。等容量轉移不意味相變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B013","stem":"某透明樣品放入大皿後能攤開，保持30 mL且一般受壓不易明顯縮小。四位同學各提出一項推論，何者有充分支持？","concept":"此題應把可觀察的體積、形狀與可壓縮性合併，透明只屬附帶外觀。攤開表示無固定形狀，30 mL保持與不易壓縮表示粒子靠近且有一定體積，符合液態。液體外形變扁並不意味每顆分子也變扁。","correct":"A","options":[{"id":"A","text":"樣品屬液態，粒子靠近但可相互移動","explanation":"正確。攤開、定體積與不易壓縮共同支持此模型。"},{"id":"B","text":"透明足以證明它是氣態","explanation":"錯誤。透明不是三態的專屬判準，也不符其餘觀察。"},{"id":"C","text":"不易壓縮足以證明粒子完全沒有運動","explanation":"錯誤。粒子靠近不等於靜止。"},{"id":"D","text":"能攤開足以證明每個分子都被壓扁","explanation":"錯誤。液體改形主要靠粒子相對滑動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B014","stem":"兩個未知樣品都會貼合新容器的形狀。若要用一組結果分辨其中的液體與氣體，哪項最有判別力？","concept":"已知會隨容器改形，候選仍包含液體與氣體。下一步需要測兩態有差異的性質，而不是再次測共同的流動或運動。維持定體積且不易壓縮支持液態；擴展與容易壓縮則支持粒子較疏遠的氣態。","correct":"D","options":[{"id":"A","text":"兩者都占據空間","explanation":"錯誤。兩態都占據空間，沒有區分效果。"},{"id":"B","text":"兩者的粒子都會運動","explanation":"錯誤。兩態都有粒子運動。"},{"id":"C","text":"兩者都能流過連通管","explanation":"錯誤。流動是液氣共有性質。"},{"id":"D","text":"一份維持原體積且不易壓縮，另一份填滿更大空間且易壓縮","explanation":"正確。體積反應與可壓縮性可區分液氣。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B015","stem":"某樣品從容器取出後保持長方形，移到圓形皿仍維持原形。又有人指出其粒子在振動，據此認為先前固態判斷錯誤。何者正確？","concept":"判態應把不同尺度的資料連接起來。宏觀保持自身外形與微觀粒子局部振動，正可共同符合固體模型。只有看到粒子持續相互滑過或遍及容器，才是另一種位置自由度；單憑振動不能推翻固態的保形證據。","correct":"B","options":[{"id":"A","text":"有振動便應改判為氣體","explanation":"錯誤。氣態不是以任何振動的存在來定義。"},{"id":"B","text":"固態判斷仍合理，局部粒子振動可與巨觀保形同時存在","explanation":"正確。固體粒子通常在位置附近振動。"},{"id":"C","text":"保形表示粒子振動資料一定造假","explanation":"錯誤。保形與微觀振動沒有矛盾。"},{"id":"D","text":"粒子振動代表樣品體積會自行變成容器容量","explanation":"錯誤。局部振動不等同氣體的擴展填充。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 3、4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B016","stem":"一個內部容積155 mL的盒子含一個完全密封、外部體積35 mL的小瓶，其餘只有氣體。氣體不能進入小瓶。充分散布後，盒內這份氣體占據多少體積？","concept":"氣體填滿的是它能到達的空間，而不是所有容器體積不加區分地相加。密封小瓶的外部體積已占用盒內35 mL，且內部不能通氣，因此須由155 mL扣除，得到120 mL。這是可達空間的幾何判讀，與分子數無關。","correct":"C","options":[{"id":"A","text":"35 mL","explanation":"錯誤。35 mL是被密封小瓶排除的空間。"},{"id":"B","text":"155 mL","explanation":"錯誤。盒子的總容積包含氣體無法進入的小瓶空間。"},{"id":"C","text":"120 mL","explanation":"正確。可達空間為155−35＝120 mL。"},{"id":"D","text":"190 mL","explanation":"錯誤。小瓶占據盒內空間，應扣除而不是加入。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B017","stem":"裝置有24、36、60 mL三個空腔。氣體最初只在24 mL腔，另外兩腔抽空。只打開連接24與36 mL腔的閥，通往60 mL腔的閥仍關閉，管路體積忽略。充分等待後氣體占多少體積？","concept":"先沿開啟的通道找出氣體可達範圍，再加總容積。24 mL原腔與36 mL空腔已相通，所以氣體會分布於兩者；60 mL腔仍被關閥隔離。總可達體積為60 mL，不能因整個裝置有三腔便全部計入。","correct":"A","options":[{"id":"A","text":"60 mL","explanation":"正確。只有24與36 mL兩腔相通，合計60 mL。"},{"id":"B","text":"24 mL","explanation":"錯誤。氣體可擴展進入已開通的36 mL腔。"},{"id":"C","text":"96 mL","explanation":"錯誤。此數把未開通的60 mL腔與36 mL腔相加，漏掉原腔。"},{"id":"D","text":"120 mL","explanation":"錯誤。通往60 mL腔的閥未打開，該腔不是可達空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B018","stem":"一個95 mL的密閉容器內有體積10 mL的實心物體及15 mL液體，其餘空間含氣體。假設三部分不重疊，且無溶解或相變，氣體充分分布的體積為何？","concept":"同一容器含多個部分時，不能把外殼容積全當作氣體體積。實心物體與液體分別排除10、15 mL，剩下70 mL由氣體占據。氣體仍會散布於所有相通的剩餘空間，而非僅停在某個注入位置。","correct":"D","options":[{"id":"A","text":"95 mL","explanation":"錯誤。固體和液體已占用其中部分空間。"},{"id":"B","text":"80 mL","explanation":"錯誤。此值只扣液體，漏扣實心物體。"},{"id":"C","text":"85 mL","explanation":"錯誤。此值只扣固體，漏扣液體。"},{"id":"D","text":"70 mL","explanation":"正確。95−10−15＝70 mL才是可達氣相空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B019","stem":"一個氣體示意模型有72個粒子，原可達空間分成24個等體積小格，擴展後為36格，總粒子數不變。以「總粒子數÷總格數」定義每格平均數，擴展後為多少？","concept":"平均分布要把固定粒子數除以當時可用空間。原本每格平均3個，擴展後每格平均2個，反映相同粒子分布到更多等體積格子。這是平均值，不要求每一格在每個瞬間剛好都有2個，也不表示分子本體變小。","correct":"B","options":[{"id":"A","text":"3個，因分子數不變所以每格也不變","explanation":"錯誤。每格平均數還受到總格數影響。"},{"id":"B","text":"2個，表示平均分布變疏","explanation":"正確。72÷36＝2，小於原來72÷24＝3。"},{"id":"C","text":"108個，因總格數增加一半","explanation":"錯誤。擴展不增加粒子總數，也不應用此乘法求平均。"},{"id":"D","text":"4.5個，因擴展使每格可容納更多粒子","explanation":"錯誤。此值誤用3×36/24；固定總數在更多格中分配，平均應減少。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B020","stem":"300 mL密閉瓶中的模型原有90個氣體粒子，抽走30個後關閥，餘者保持氣態。充分散布後，哪一組「總數、所占體積」正確？","concept":"抽氣與縮小容器是不同操作。抽走30個粒子後只剩60個，但瓶內可達容積仍為300 mL，氣體會重新散布到全瓶。減少的是份量與平均分布密度，不能把少了三分之一粒子誤算成只剩三分之二瓶的氣體空間。","correct":"C","options":[{"id":"A","text":"90個、200 mL","explanation":"錯誤。抽走粒子會改變總數，剩餘氣體也不只占部分瓶子。"},{"id":"B","text":"60個、200 mL","explanation":"錯誤。60個正確，但不能按粒子減少比例縮小可達瓶內體積。"},{"id":"C","text":"60個、300 mL","explanation":"正確。90−30＝60，剩餘氣體仍填滿瓶內空間。"},{"id":"D","text":"90個、300 mL","explanation":"錯誤。體積正確，但總數未扣除被抽走部分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B021","stem":"兩個等容積、同溫的小腔相通，總共含40個同種氣體粒子的模型。忽略重力差異，並假設充分散布後兩腔每單位體積的長時間平均粒子數相同。何者正確？","concept":"氣體均勻分布指巨觀或長時間的平均情況，不是每個小區域永遠有固定整數粒子。等體積、相同條件下，40個粒子可期待平均各20個，但移動與跨腔會造成瞬間波動。兩腔合計仍是40，平均均勻和微觀動態可以同時成立。","correct":"A","options":[{"id":"A","text":"兩腔長時間平均各約20個，但瞬間數目可波動","explanation":"正確。均勻平均分布不要求每一瞬間精確對半。"},{"id":"B","text":"每一瞬間兩腔必恰好各20個，否則不是氣態","explanation":"錯誤。粒子跨越開口會使瞬間局部數目波動。"},{"id":"C","text":"40個粒子必全留在最初所在的一腔","explanation":"錯誤。相通腔提供可達新空間，氣體可擴展。"},{"id":"D","text":"每腔都必有40個，總數因此變80個","explanation":"錯誤。填滿兩腔不會複製粒子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B022","stem":"相通兩腔的可用容積比為1：3，總共40個同種氣體模型粒子。若充分散布後兩腔每單位體積的平均粒子數相同，較小腔的平均粒子數應為多少？","concept":"題目已給出每單位體積平均數相同，便可按可用體積分配總數。1：3代表小腔占總體積四分之一，故平均10個；大腔平均30個。這是均勻分布的比例運算，不能把「兩個腔」誤當成「兩個等體積腔」。","correct":"D","options":[{"id":"A","text":"20個","explanation":"錯誤。兩腔體積不同，不能按腔數直接平均。"},{"id":"B","text":"30個","explanation":"錯誤。30個應對應占四分之三總體積的大腔。"},{"id":"C","text":"40個","explanation":"錯誤。這會使相通大腔完全沒有平均分布的粒子。"},{"id":"D","text":"10個","explanation":"正確。小腔占總體積1÷4，平均為40÷4＝10。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B023","stem":"某多孔物體外包體積40 mL，其中有10 mL連通孔隙可讓氣體進入，其他30 mL不可進入。它放在100 mL盒中，盒內其餘空間含氣體。忽略吸附，氣體可達體積是多少？","concept":"氣體體積取決於可達空間，連通孔隙與密封空腔必須分開。盒中物體外的60 mL可達，物體內連通孔隙10 mL也可達，因此合計70 mL。等價做法是從100 mL扣除唯一不可進入的30 mL。","correct":"B","options":[{"id":"A","text":"60 mL","explanation":"錯誤。此值扣掉整個外包體積，漏計可進入的10 mL孔隙。"},{"id":"B","text":"70 mL","explanation":"正確。盒內、物體外的60 mL加上連通孔隙10 mL，合計70 mL。"},{"id":"C","text":"90 mL","explanation":"錯誤。應排除不可進入的30 mL，不是只扣10 mL孔隙。"},{"id":"D","text":"140 mL","explanation":"錯誤。物體位於盒內，其外包體積不能再加到盒容積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B024","stem":"一個密閉裝置由50 mL主腔、5 mL開放連管及25 mL副腔組成，三者完全相通且只有氣體。若沒有其他空間，氣體體積為何？","concept":"容器形狀可以包含細管與多個腔室，氣體仍會遍及所有相通空間。若題面沒有准許忽略管路體積，就需把5 mL連管計入。主腔、副腔與連管合計80 mL；計算只反映空間邊界，不涉及氣體的化學種類。","correct":"C","options":[{"id":"A","text":"50 mL","explanation":"錯誤。氣體不限於主腔。"},{"id":"B","text":"75 mL","explanation":"錯誤。連管也是可達空間，不能漏掉5 mL。"},{"id":"C","text":"80 mL","explanation":"正確。50＋5＋25＝80 mL，三部分皆可被氣體到達。"},{"id":"D","text":"25 mL","explanation":"錯誤。副腔並非唯一含氣體的區域。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B025","stem":"一個可伸縮密閉袋從200 mL拉到260 mL，原有氣體保持氣態且無反應。哪一項是正確的整體描述？","concept":"氣袋增加60 mL可用空間，氣體便能擴展到其中。分子總數與尺寸保持時，增加樣品體積靠的是平均分布變疏。不能把mL當成分子數單位，也不能將整份氣體30%的體積增幅直接套到單個分子的大小。","correct":"A","options":[{"id":"A","text":"總分子數保留，新增60 mL空間可被原有氣體散布到","explanation":"正確。擴展利用原有粒子重新分布，不須新增分子。"},{"id":"B","text":"必新增60個分子才能填滿新增60 mL","explanation":"錯誤。mL是體積，不等於分子個數，且裝置密閉。"},{"id":"C","text":"每個分子尺寸必增加30%","explanation":"錯誤。樣品體積增加30%不表示分子本體同比例變大。"},{"id":"D","text":"總分子數必減少30%以維持原間距","explanation":"錯誤。題設保留總數，間距可改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B026","stem":"固定容積的瓶子先有50個模型氣體粒子，再注入20個同種粒子後封閉，全程無相變。與注入前相比，充分散布後何者正確？","concept":"注入氣體改變樣品份量，固定瓶壁則保留可達體積。總數由50增加到70，原有與新加入粒子都可遍及瓶內，平均分布因而更密。體積由邊界限制，分子總數由進出量決定，應分別處理兩項資訊。","correct":"D","options":[{"id":"A","text":"所占體積增為原來的70÷50倍，超出瓶外","explanation":"錯誤。固定瓶壁限制可達容積，分子增加不使氣體占到瓶外。"},{"id":"B","text":"原有50個只占瓶底，新20個永久只占瓶頂","explanation":"錯誤。粒子能移動混合，不依注入先後永久分層。"},{"id":"C","text":"每個分子的體積增為70÷50倍","explanation":"錯誤。增加數量不等於單個分子膨大。"},{"id":"D","text":"總數變70個，可達體積不變，平均分布較密","explanation":"正確。同樣瓶內空間有更多粒子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B027","stem":"一份密閉氣體由180 mL擴展到270 mL，總粒子數為N且維持氣態。若每mL平均粒子數定義為N除以體積，擴展後與擴展前的比值為何？","concept":"平均粒子數的題面定義為N/V。總數相同時，空間增加使每mL分到的粒子較少。以新平均除舊平均，N消去，留下180/270＝2/3；要特別避免把體積的增加比例直接當成平均分布密度的增加比例。","correct":"B","options":[{"id":"A","text":"3：2","explanation":"錯誤。這是新舊體積比，平均粒子數應用相反比值。"},{"id":"B","text":"2：3","explanation":"正確。(N÷270)÷(N÷180)＝180÷270＝2÷3。"},{"id":"C","text":"1：1","explanation":"錯誤。總數不變不代表每單位體積平均數不變。"},{"id":"D","text":"1：3","explanation":"錯誤。新體積是原來1.5倍，不是3倍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B028","stem":"一個100 mL瓶子的圖上畫了虛線，將圖面分成40與60 mL兩區，但瓶內沒有隔板。氣體充分散布後，何者正確？","concept":"模型圖中的線條要分辨是實體隔板，還是用來計數的想像分區。題目明定沒有隔板，兩區完全相通，氣體就可遍及100 mL。虛線可以協助討論局部平均數，卻不能阻止分子移動或改變氣體總量。","correct":"C","options":[{"id":"A","text":"氣體只能占40 mL，因虛線阻擋粒子","explanation":"錯誤。圖上的分區線不是實體邊界。"},{"id":"B","text":"氣體必只占60 mL，因較大區有更多空間","explanation":"錯誤。兩區相通，較小區仍可達。"},{"id":"C","text":"氣體可占100 mL，虛線僅供描述區域","explanation":"正確。可達範圍由真實容器限制決定。"},{"id":"D","text":"兩區必各產生一份新的氣體，總分子數加倍","explanation":"錯誤。分區標記不改變物質總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B029","stem":"同種氣體各裝在甲乙兩瓶，兩瓶可用容積都是120 mL，但甲含粒子數N、乙含2N。在均維持氣態且充分散布時，哪項敘述正確？","concept":"等容積瓶中的氣體可有不同份量，不能由體積相等推論分子數相等。甲乙各占120 mL，而乙有兩倍總數，因此每單位體積平均數也為兩倍。比較的是粒子分布疏密，沒有把單個分子本體放大。","correct":"A","options":[{"id":"A","text":"兩瓶氣體體積同為120 mL，乙每單位體積平均粒子數為甲的兩倍","explanation":"正確。同體積下粒子數加倍，平均分布密度加倍。"},{"id":"B","text":"乙氣體體積必為240 mL","explanation":"錯誤。乙瓶可達容積只有120 mL。"},{"id":"C","text":"甲只會占乙的一半瓶高","explanation":"錯誤。甲氣體也會填滿自己的全部可達空間。"},{"id":"D","text":"乙每個分子必比甲大兩倍","explanation":"錯誤。分子數量不同不等於單個分子尺寸不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B030","stem":"氣體粒子間有大量空間，氣體卻又能「充滿容器」。下列哪項說明最能使這兩種描述一致？","concept":"「充滿」是巨觀分布範圍的敘述，「有間隙」是微觀結構的敘述，兩者並不矛盾。氣體分子可相距很遠又持續移動，使整個容器都是其可分布範圍。不能把宏觀氣體體積誤當成所有分子本體體積的總和。","correct":"D","options":[{"id":"A","text":"充滿表示分子本體必無縫緊貼","explanation":"錯誤。這與氣體粒子疏遠的模型不符。"},{"id":"B","text":"大量間隙表示氣體只能存在容器的一角","explanation":"錯誤。疏遠粒子仍可遍及整個可達空間。"},{"id":"C","text":"充滿表示每個小區域在每一瞬間都必有一個粒子","explanation":"錯誤。微觀局部瞬間可沒有粒子，仍不妨礙整體分布。"},{"id":"D","text":"充滿描述運動粒子遍及可達空間的樣品範圍，不表示分子本體連續鋪滿","explanation":"正確。樣品體積包含粒子間空間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B031","stem":"一份密閉氣體在無反應、無相變下由80 mL壓到50 mL。若原有200個模型粒子，下列哪組壓縮後資料合理？","concept":"壓縮前先確認不變條件：密閉、無反應且維持氣態，保留200個粒子。80 mL降為50 mL，使相同數量分布得更密，不能按5/8把分子刪減或縮小。這是樣品體積改變與微觀分子身分保留的共同結果。","correct":"B","options":[{"id":"A","text":"125個粒子，各分子尺寸不變","explanation":"錯誤。這把體積比例錯用到粒子總數，密閉壓縮仍應有200個。"},{"id":"B","text":"200個粒子，平均分布較密，各分子尺寸不變","explanation":"正確。同一群粒子在更小空間內，主要縮減間隙。"},{"id":"C","text":"200個粒子，各分子本體體積都變為原來5/8","explanation":"錯誤。樣品體積比不等於分子本體體積比。"},{"id":"D","text":"320個粒子，平均分布保持原疏密","explanation":"錯誤。密閉壓縮不增加粒子數，此數也無法維持原疏密。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B032","stem":"密閉氣體由100 mL壓到40 mL，總粒子數固定。依「總粒子數÷體積」定義平均分布密度，壓縮後是原來多少倍？","concept":"同一份氣體壓縮後，每單位體積分配到更多粒子。把新平均密度N/40除以原密度N/100，總數N消去，得到2.5倍。運算只使用題面定義，不需要由壓力推算體積，也不意味單顆分子變重或變大。","correct":"D","options":[{"id":"A","text":"0.4倍","explanation":"錯誤。這是新舊體積比，密度變化方向相反。"},{"id":"B","text":"0.6倍","explanation":"錯誤。60%是體積減少比例，不是新密度倍數。"},{"id":"C","text":"1.6倍","explanation":"錯誤。不能直接把體積減少比例加到原密度。"},{"id":"D","text":"2.5倍","explanation":"正確。(N÷40)÷(N÷100)＝100÷40＝2.5。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B033","stem":"兩組都把氣體體積從60 mL減到30 mL。甲用密閉活塞壓縮；乙在體積維持60 mL時先抽走一半氣體，之後才關閥壓到30 mL。以各自最初粒子總數N比較，最後甲、乙總數為何？","concept":"最終體積相同不代表最後份量相同，需追蹤整段操作是否有分子進出。甲全程密閉，保留N；乙在關閥前抽走N/2，之後壓縮僅保留剩餘N/2。把壓縮和抽氣區分，才能正確使用總數守恆。","correct":"A","options":[{"id":"A","text":"甲N、乙N/2","explanation":"正確。甲只壓縮，乙先有分子流出，兩者守恆邊界不同。"},{"id":"B","text":"甲N/2、乙N/2","explanation":"錯誤。甲的體積減半並未移走分子。"},{"id":"C","text":"甲N、乙N","explanation":"錯誤。乙明確抽走一半氣體，最後不可能仍有N。"},{"id":"D","text":"甲2N、乙N","explanation":"錯誤。壓縮不會自行生成分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B034","stem":"一份氣體密閉壓縮到原體積的1/3後，又讓它回到原容積，無反應、流失或相變。最後與最初相比，何者有充分支持？","concept":"全程密閉且無反應或相變，所以分子總數保留。最終容積也回到起點，因此整體平均N/V相同；但粒子一直在運動，不能要求每一顆都返回最初位置。應區分可恢復的平均狀態資料與微觀個別位置。","correct":"C","options":[{"id":"A","text":"總分子數減為1/3，因曾經壓縮","explanation":"錯誤。壓縮歷程不移走分子。"},{"id":"B","text":"每個分子永久縮成1/3大小","explanation":"錯誤。氣體壓縮主要改變間隙，不是分子永久變形。"},{"id":"C","text":"總分子數相同，按總數除以容積所得的平均分布密度相同","explanation":"正確。最終N與V都回到原來值。"},{"id":"D","text":"每個分子一定回到最初的精確位置","explanation":"錯誤。平均分布相同不保證個別粒子軌跡完全重現。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B035","stem":"某示意模型用48個同尺寸圓點表示密閉氣體。容器壓縮後，哪種修改同時符合總數、分子尺寸與氣體間隙的要求？","concept":"粒子模型要分別檢查邊界、點數、點大小與分布。密閉壓縮只需把邊界變小，保留48個同尺寸圓點，讓平均間隙縮減。若刪點、加點或把點本身縮小，便把巨觀壓縮誤畫為物質增減或分子變形。","correct":"B","options":[{"id":"A","text":"改為24個圓點，維持原有疏密","explanation":"錯誤。刪減圓點不符合密閉總數保留。"},{"id":"B","text":"仍有48個同尺寸圓點，分布在較小邊界內且平均更靠近","explanation":"正確。只改可用空間及平均分布。"},{"id":"C","text":"仍有48個圓點，但每點縮小並固定在原位置","explanation":"錯誤。分子本體不應縮小，固定位置也不符合氣態。"},{"id":"D","text":"增加為96個圓點，全部排成固定接觸晶格","explanation":"錯誤。增加總數且改為固定緊密排列，均違背題設。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B036","stem":"同種氣體在相同溫度下，甲每10 mL平均有20個模型粒子，乙每10 mL平均有50個。僅比較平均分布與相遇機會，何者合理？","concept":"相同的10 mL區域中，乙含有較多粒子，表示平均分布較密。同種同溫的比較可把注意力放在間隙差異：粒子更靠近，通常更常相遇碰撞。此處只作定性推理，不能從兩個數字任意宣稱精確碰撞頻率倍數。","correct":"D","options":[{"id":"A","text":"甲每個分子較小，因此數量較少","explanation":"錯誤。每單位體積數量不同不表示單個分子尺寸不同。"},{"id":"B","text":"乙粒子不再運動，因為分布較密","explanation":"錯誤。保持氣態時粒子仍運動。"},{"id":"C","text":"甲、乙分子間空間必完全相同","explanation":"錯誤。相同尺度下乙有更多粒子，平均分布較密。"},{"id":"D","text":"乙平均較密，在同溫模型下粒子相互碰撞通常更頻繁","explanation":"正確。較小平均間隙增加運動中遇到其他粒子的機會。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B037","stem":"某氣體在同溫下被密閉壓縮，保持氣態且無化學反應。有人說「碰撞增加必代表每次碰撞都生成新分子」。哪項回應正確？","concept":"氣體粒子在不反應時也會碰撞。壓縮使平均間隙減少，可增加相遇頻率，但是否發生化學反應是不同問題。題設無反應，故應保留分子身分及總數；不能把碰撞當成必然合成、分解或產生新分子的證據。","correct":"A","options":[{"id":"A","text":"碰撞可更頻繁而無化學反應，分子總數仍可不變","explanation":"正確。接近與碰撞不等於分子身分改變。"},{"id":"B","text":"沒有反應的氣體不可能發生任何碰撞","explanation":"錯誤。粒子間與容器壁的碰撞是氣體運動的一部分。"},{"id":"C","text":"每次碰撞一定使兩個分子永久合成一個","explanation":"錯誤。一般碰撞沒有這項必然結果。"},{"id":"D","text":"碰撞越多，分子一定縮得越小","explanation":"錯誤。碰撞頻繁不支持分子本體縮小。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B038","stem":"兩次量測同一氣體粒子的碰撞紀錄：壓縮前10秒觀察到30次，壓縮後4秒觀察到20次。以「次數÷時間」定義頻率，何者正確？","concept":"「更頻繁」比較單位時間發生次數，不是不同時間窗的原始總數。前次為30/10＝3次每秒，後次為20/4＝5次每秒，因此後者頻率較高。這個量測結果與同溫壓縮後較密集的模型相容，但本題不從頻率推算壓力。","correct":"C","options":[{"id":"A","text":"壓縮後碰撞較少，因20小於30","explanation":"錯誤。兩次觀察時間不同，不能直接比較總次數。"},{"id":"B","text":"壓縮前頻率為10次/秒，壓縮後為4次/秒","explanation":"錯誤。這把觀察秒數誤當成頻率。"},{"id":"C","text":"頻率由3次/秒增加為5次/秒，與更頻繁碰撞相符","explanation":"正確。30÷10＝3，20÷4＝5。"},{"id":"D","text":"頻率由30次/秒降為20次/秒","explanation":"錯誤。原始計次尚未除以各自觀察時間。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B039","stem":"同一份氣體在兩種狀態下總數都是120個模型粒子；甲容積30格，乙容積20格，各格體積相同。何者正確？","concept":"平均分布由總數與空間共同決定。甲每格4個、乙每格6個，說明同份氣體在較小空間中可更密集，不必增加分子數。此題的格子代表相同體積，所以兩個平均值可以直接比較。","correct":"B","options":[{"id":"A","text":"甲乙每格平均數相同，因總數相同","explanation":"錯誤。平均數還須除以不同格數。"},{"id":"B","text":"甲平均4個/格，乙平均6個/格，乙較密","explanation":"正確。120÷30＝4，120÷20＝6。"},{"id":"C","text":"甲平均30個/格，乙平均20個/格，甲較密","explanation":"錯誤。這把總格數當成每格粒子數。"},{"id":"D","text":"乙必有180個粒子才可能較密","explanation":"錯誤。固定120個在更小空間就能更密。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B040","stem":"某密閉氣體壓縮後，分子示意點變得較靠近，卻仍彼此分離並持續移動。下列哪項結論最恰當？","concept":"壓縮與凝結都可能使平均分子更靠近，但不能把它們當同義詞。若仍為疏遠且廣泛移動的氣態分布，樣品可只是被壓縮。要判定凝結，需看到由氣態成為液態的證據，例如形成具有一定體積的液相，而非只有間距略減。","correct":"D","options":[{"id":"A","text":"靠近一點就足以證明一定液化","explanation":"錯誤。氣體可在維持氣態時被壓縮而更密。"},{"id":"B","text":"只要分子沒有接觸，樣品體積就不能變小","explanation":"錯誤。縮減分子間間隙即可降低樣品體積。"},{"id":"C","text":"分子仍移動，代表一定沒有被壓縮","explanation":"錯誤。氣體壓縮不要求粒子停止運動。"},{"id":"D","text":"此模型可符合未液化的壓縮氣體，僅靠間距變小不能保證凝結","explanation":"正確。判定相變還需液態等其他證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B041","stem":"已知同種氣體在同溫壓縮且保持氣態時，每個分子平均每秒與其他分子碰撞的次數通常增加。現有同種氣體甲、乙，甲每單位體積的分子數較多，但兩者溫度不同且沒有運動快慢資料。要比較兩者每個分子的平均碰撞頻率，何者適當？","concept":"題目比較每個分子的平均碰撞頻率，並直接給出同種氣體在同溫下壓縮的定性原理。甲雖較密集，甲乙卻不同溫，缺少可比較的運動條件。應先控制成同溫，或補充不同溫度下的運動資料；不能僅憑疏密斷言哪邊頻率較高。","correct":"A","options":[{"id":"A","text":"應先控制或補充溫度條件，不能直接套用同溫比較","explanation":"正確。題給原理要求同溫比較；甲乙不同溫，僅有疏密資料不足以直接套用。"},{"id":"B","text":"甲分子的平均碰撞頻率在任何情況下都必比乙高","explanation":"錯誤。較密集並不足以支持任何溫度條件下的單分子碰撞頻率都較高。"},{"id":"C","text":"乙分子的平均碰撞頻率在任何情況下都必比甲高","explanation":"錯誤。現有資料也不足以支持乙分子的平均碰撞頻率必較高。"},{"id":"D","text":"氣體只要溫度不同，就完全不會碰撞","explanation":"錯誤。溫度不同不表示粒子停止碰撞。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B042","stem":"甲操作把密閉氣體從90 mL壓到45 mL；乙操作把同樣初始氣體在90 mL瓶中抽走一半。兩者無反應或相變。哪項比較正確？","concept":"密閉壓縮改的是可用空間，抽氣改的是留在系統中的份量。甲最後仍有原總數，分布在45 mL；乙剩一半總數，重新填滿90 mL瓶子。即使兩個操作都讓某個數量減半，也不可把份量和體積互相替代。","correct":"C","options":[{"id":"A","text":"甲乙都減少一半分子，體積也都減半","explanation":"錯誤。甲保留分子數，乙保留瓶內可達體積。"},{"id":"B","text":"甲保留體積，乙保留分子數","explanation":"錯誤。這把兩種操作的控制量對調。"},{"id":"C","text":"甲保留分子數而體積減半；乙分子數減半但仍占90 mL","explanation":"正確。壓縮與抽氣改變不同項目。"},{"id":"D","text":"甲分子變小，乙分子變大","explanation":"錯誤。兩種操作都不需要改變分子本體尺寸。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B043","stem":"一個直筒氣體模型的橫截面積固定為6 cm²，氣體區長度由15 cm縮到9 cm。已給體積V＝截面積×長度，且模型密閉、維持氣態。何者正確？","concept":"先使用題面提供的幾何關係求樣品體積：原90 cm³，新54 cm³。容積縮小36 cm³，意味原有分子分布更密；密閉且無相變反應時總數保留。筒長的改變是容器尺度，不能直接當成分子尺寸變化。","correct":"B","options":[{"id":"A","text":"體積由15降為9 cm³，分子數不變","explanation":"錯誤。漏乘6 cm²截面積。"},{"id":"B","text":"體積由90降為54 cm³，分子數不變","explanation":"正確。6×15＝90、6×9＝54，密閉壓縮保留分子總數。"},{"id":"C","text":"體積由90降為54 cm³，分子數也必減少40%","explanation":"錯誤。體積降幅不能套用到密閉總數。"},{"id":"D","text":"體積減少36 cm³，因此分子數也減少36個","explanation":"錯誤。體積減量36 cm³是空間量，不能當成密閉系統的分子流失數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B044","stem":"氣體裝置包含一個可壓縮主腔與一個相通、固定10 mL的小腔。主腔由70 mL壓到40 mL，管路體積忽略，總分子數不變。整份氣體的新舊體積比為何？","concept":"相通的小腔始終是氣體可達空間，即使它本身不被活塞壓縮，也須計入整份氣體體積。原總體積80 mL，新總體積50 mL，比值50/80＝5/8。漏掉固定空腔會誤判整份氣體實際壓縮比例。","correct":"D","options":[{"id":"A","text":"4：7","explanation":"錯誤。此比只比較主腔，漏掉兩階段都有的10 mL小腔。"},{"id":"B","text":"3：8","explanation":"錯誤。30 mL是減少量，並非最後總體積。"},{"id":"C","text":"1：2","explanation":"錯誤。最後總體積50 mL，並非初始80 mL的一半。"},{"id":"D","text":"5：8","explanation":"正確。原體積70＋10＝80，新體積40＋10＝50。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B045","stem":"36個氣體模型粒子先在18格空間，密閉壓到6格，再擴到12格，格子等體積且全程保持氣態。最後每格平均粒子數及總數為何？","concept":"密閉連續操作先追蹤總數，再對指定階段算平均。36個始終保留，最後容積12格，因此每格平均3個。中間6格時的平均6個與初始18格時的平均2個都不是最後答案，需避免把不同階段資料混用。","correct":"A","options":[{"id":"A","text":"平均3個/格、總數36個","explanation":"正確。最後以36÷12計算，途中壓縮不改變總數。"},{"id":"B","text":"平均6個/格、總數72個","explanation":"錯誤。這沿用中間平均值並虛增最後總數。"},{"id":"C","text":"平均2個/格、總數24個","explanation":"錯誤。這沿用初始平均值，忽略密閉總數保留。"},{"id":"D","text":"平均1個/格、總數12個","explanation":"錯誤。格數不是粒子總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B046","stem":"有人只量到液體筒與氣體筒都減少5 mL，便判定兩者同樣容易壓縮。題目沒有施力、壓力變化或原體積資料。哪項評估最合理？","concept":"「容易壓縮」是物質對壓力改變的體積反應，不能只比兩個孤立的mL減量。原體積差很多或施加壓力不同，都會妨礙公平比較。因此需控制條件並看相對改變，才可檢驗氣體通常比液體容易明顯壓縮的性質。","correct":"C","options":[{"id":"A","text":"已足夠，任何相同體積減量都表示材料可壓縮性相同","explanation":"錯誤。操作條件與相對變化均可能不同。"},{"id":"B","text":"已足夠，只要都裝在筒內就有相同壓力變化","explanation":"錯誤。容器形式相同不保證施加條件相同。"},{"id":"C","text":"資料不足，應比較可比壓力條件與原體積下的相對體積改變","explanation":"正確。單一絕對減量不能衡量容易壓縮的程度。"},{"id":"D","text":"資料不足，必須先證明液體粒子完全不動","explanation":"錯誤。液體粒子本來可滑動；比較可壓縮性需要控制壓力及原體積，不要求粒子靜止。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B047","stem":"一份密閉氣體從120 mL壓到90 mL後仍維持氣態，觀察到分子種類與總數均不變。若只要解釋30 mL體積減量，何者最直接？","concept":"已知分子種類與數量保留，就應在空間配置尋找解釋。氣體粒子間有大量空間，縮小容積可藉由減少間隙完成。120減90等於30 mL，這是整份樣品的體積差，不是粒子個數或分子化學式的差。","correct":"B","options":[{"id":"A","text":"所有分子的化學式各少一個原子","explanation":"錯誤。這會改變分子種類，且題設明定種類不變。"},{"id":"B","text":"分子間的總空間縮減，無須縮小每個分子","explanation":"正確。氣體的大量間隙足以提供壓縮空間。"},{"id":"C","text":"30 mL代表有30個分子被刪除","explanation":"錯誤。mL不是分子數單位，且總數已知不變。"},{"id":"D","text":"容器內出現另一種固體才可能變小","explanation":"錯誤。保持氣態的壓縮不需要形成固體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B048","stem":"甲模型把氣體壓縮畫成分子數減少；乙模型畫成分子數與尺寸不變但平均間隙縮小。若實驗全程密閉、無反應且無相變，哪項判斷正確？","concept":"評估模型要對照實驗的守恆條件。甲刪減分子違反全程密閉且無反應相變的設定；乙則用相同分子填入更小空間，能解釋壓縮。樣品變小不必物質變少，這是判讀氣體粒子模型最重要的區別之一。","correct":"D","options":[{"id":"A","text":"甲較好，因樣品變小必定物質變少","explanation":"錯誤。密閉壓縮可改變體積而不減少份量。"},{"id":"B","text":"兩者都好，數目與空間是可互換的描述","explanation":"錯誤。總數與可用空間是不同的量，不能互換。"},{"id":"C","text":"兩者都錯，氣體只能靠單個分子縮小來壓縮","explanation":"錯誤。這仍混淆樣品體積與分子本體大小。"},{"id":"D","text":"乙符合條件；甲誤把密閉壓縮當成物質流失","explanation":"正確。乙同時保留總數與分子身分並減少間隙。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B049","stem":"密閉氣體模型有100個粒子。壓縮前某固定小區平均4個，壓縮後平均6個。何者正確？","concept":"小區域不是整個守恆系統。壓縮後粒子分布較密，同樣大小取樣區的平均數可以由4升到6，但總數仍為100。這正說明局部計數、平均疏密與全系統份量需要分開，不能用其中一項變化取代另一項。","correct":"A","options":[{"id":"A","text":"局部平均數增加可來自重新分布，全系統仍保有100個","explanation":"正確。縮小總可用空間可使同大小取樣區平均分到更多粒子。"},{"id":"B","text":"全系統總數必由100變150","explanation":"錯誤。不能把局部密度增加套為密閉總數增加。"},{"id":"C","text":"全系統總數必由100變96","explanation":"錯誤。局部的4個不是被移出系統的數量。"},{"id":"D","text":"局部平均數變化表示每個粒子尺寸增大50%","explanation":"錯誤。局部計數變化不是分子本體尺寸的量測。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B050","stem":"甲乙為同一份氣體壓縮前後的模型。乙整體粒子分布較密，但某一瞬間甲也有一對互相碰撞的分子。何者最恰當？","concept":"平均間距是整體統計概念，氣體即使平均疏遠，仍可能有粒子在碰撞時非常接近。乙受壓後整體分布較密，並不要求所有分子對的距離都小於甲的任何分子對。應用整體資料比較，避免以局部極端取代平均。","correct":"C","options":[{"id":"A","text":"甲有一對靠近，證明甲整體一定比乙密","explanation":"錯誤。單一粒子對不能代表全部平均分布。"},{"id":"B","text":"氣體若有碰撞，就不能稱粒子平均相距遠","explanation":"錯誤。平均疏遠與運動中偶爾接近碰撞可並存。"},{"id":"C","text":"應比較整體平均分布，不能以單一最近粒子對推翻壓縮結果","explanation":"正確。局部瞬間距離與整體平均間隙是不同資料。"},{"id":"D","text":"乙較密表示每一對分子的距離都必比甲任意一對小","explanation":"錯誤。平均較密不是所有配對距離的逐一絕對排序。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edit
