→ Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B063","stem":"一份完全同樣的模型先畫質量圖，再畫原子個數圖。有人把O標籤改為H以表示扇形變小。哪個改動符合轉圖本意？","correct":"C","options":[{"id":"A","text":"用字母長短表示扇形大小","explanation":"符號識別元素，不編碼扇形面積。"},{"id":"B","text":"把所有變小扇形刪掉","explanation":"變小不表示原子消失。"},{"id":"C","text":"保持O仍代表氧，重新計算面積比例","explanation":"統計基準改變不改元素身分。"},{"id":"D","text":"把百分比數字固定，僅交換名稱","explanation":"交換名稱會製造錯配。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B064","stem":"在一份模型中，元素甲占原子總數60%，卻只占總質量20%。哪個質量比較必然成立？","correct":"B","options":[{"id":"A","text":"甲單顆比全體平均原子更重","explanation":"甲每顆的平均貢獻比例20/60小於全體。"},{"id":"B","text":"甲單顆質量低於全體每顆原子的平均質量","explanation":"甲的單顆質量相對全體平均=(0.20/0.60)=1/3。"},{"id":"C","text":"甲原子總數低於其他合計","explanation":"題給甲60%已大於其他40%。"},{"id":"D","text":"甲占總質量60%","explanation":"題給20%，不能換成顆數比例。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B065","stem":"兩類模型原子單顆質量分別2、3單位。一份帳寫甲5顆、乙4顆；另一份帳寫甲質量10、乙質量15。哪一類記錄彼此不符？","correct":"D","options":[{"id":"A","text":"只有甲","explanation":"甲5×2=10符合。"},{"id":"B","text":"甲乙都符合","explanation":"乙4×3=12，不是15。"},{"id":"C","text":"兩類都不符","explanation":"甲記錄一致。"},{"id":"D","text":"只有乙；15單位對應5顆而非4顆","explanation":"乙數量與質量差了一顆；甲一致。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B066","stem":"地殼O49.5%，人體O65%。只比較兩圖的「非氧質量占比」，何者較高，差多少個百分點？","correct":"A","options":[{"id":"A","text":"地殼較高，差15.5個百分點","explanation":"地殼非氧50.5、人體35，差15.5，方向與氧相反。"},{"id":"B","text":"人體較高，差15.5個百分點","explanation":"非氧比例的方向與氧相反。"},{"id":"C","text":"地殼較高，差114.5個百分點","explanation":"不可將氧百分比相加當差值。"},{"id":"D","text":"相同，因兩者都含Other","explanation":"其他類別名稱相同不代表非氧比例同值。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B067","stem":"地殼圖若把Al7.5、Fe4.7、Ca3.4及Other9.2%合成「非O非Si」一類，新三類O、Si、其餘的由大至小排序為何？","correct":"B","options":[{"id":"A","text":"O＞其餘＞Si","explanation":"其餘24.8小於Si25.7。"},{"id":"B","text":"O＞Si＞其餘","explanation":"其餘合計24.8%，所以49.5>25.7>24.8。"},{"id":"C","text":"其餘＞O＞Si","explanation":"合併多類不表示超過氧49.5。"},{"id":"D","text":"Si＞其餘＞O","explanation":"氧仍最大。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B068","stem":"有人為了畫細圖，將人體Other7%分成七個各1%的扇形，並稱「教材證實有這七種各1%」。哪項修訂合適？","correct":"C","options":[{"id":"A","text":"改成七個各7%就符合教材","explanation":"會把7放大為49。"},{"id":"B","text":"只要圖色不同，就能證明七種","explanation":"圖色不提供實測細項。"},{"id":"C","text":"保留Other7%；若示範等分，須明說是假設，不能當教材細項","explanation":"來源只有合計，沒有七項各1的證據。"},{"id":"D","text":"刪除原Other，因未知不能記錄合計","explanation":"合計7仍是已知資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B069","stem":"一份地殼摘要只顯示質量占比至少5%的已單列元素；原已單列O49.5、Si25.7、Al7.5、Fe4.7、Ca3.4%。摘要不見Fe與Ca，合理說明是什麼？","correct":"D","options":[{"id":"A","text":"Fe與Ca不屬已知元素","explanation":"兩者均有正式符號。"},{"id":"B","text":"Fe與Ca的原圖占比為0","explanation":"原值分別4.7與3.4。"},{"id":"C","text":"所有未顯示元素都應加入5%","explanation":"篩選不改變數值。"},{"id":"D","text":"Fe與Ca低於顯示門檻，原占比仍可非零","explanation":"這是明確篩選規則造成的省略。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B070","stem":"從Silver、Sulfur、Silicon、Sodium四個英文名稱中，找出「正式符號以S開頭，而且有兩個字母」的元素。應選哪個？","correct":"C","options":[{"id":"A","text":"Silver","explanation":"銀的符號Ag，不以S開頭。"},{"id":"B","text":"Sulfur","explanation":"硫的符號S，只有一個字母。"},{"id":"C","text":"Silicon","explanation":"矽的符號Si，同時符合S開頭與兩字母。"},{"id":"D","text":"Sodium","explanation":"鈉的符號Na，不以S開頭。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B071","stem":"地殼圖O49.5%、Si25.7%。一份圖表註解寫「把氧的占比削去一半後，仍高於矽」。只作數字檢查，這句對嗎？","correct":"B","options":[{"id":"A","text":"對，最大項除二仍必大於第二項","explanation":"最大不保證兩倍差距。"},{"id":"B","text":"不對，49.5/2=24.75，略低於25.7","explanation":"需實際比較半數與第二項。"},{"id":"C","text":"對，49.5/2=25.7","explanation":"除法計算不對。"},{"id":"D","text":"不對，因百分比不能除以二","explanation":"作數值比較可以，只不能當實際改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B072","stem":"為了教圖表閱讀，有人把地殼所有占比除以9.2，讓Other高度為1。新表O高度為49.5/9.2。它應標哪個單位？","correct":"C","options":[{"id":"A","text":"仍標質量百分比，Other為1%","explanation":"這不再以原總量100作分母。"},{"id":"B","text":"公克","explanation":"比例變換未提供絕對總質量。"},{"id":"C","text":"相對於Other的比值，不能直接標成原百分比","explanation":"各項現在以Other為基準。"},{"id":"D","text":"元素種類數","explanation":"計算仍比較質量占比，不是種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B073","stem":"同一地殼紙上模型將所有元素質量由克換成毫克，換算規則每克為1000毫克。下列哪個量一定不因換單位而改變？","correct":"D","options":[{"id":"A","text":"每個元素的數值都不變","explanation":"質量數值會乘1000。"},{"id":"B","text":"只有O的占比不變，其餘改變","explanation":"所有同單位比值都不變。"},{"id":"C","text":"總質量數值不變但占比變","explanation":"方向相反。"},{"id":"D","text":"所有元素的質量占比與其大小排序","explanation":"分子分母共同乘1000，比值及排序不變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B074","stem":"紙上人體模型總質量2 kg，氧1300 g。只為本題給1 kg=1000 g。計算者用1300÷2×100%得65000%。應如何修正？","correct":"A","options":[{"id":"A","text":"先把總質量改2000 g，再算1300/2000=65%","explanation":"部分與總體需用相同質量單位。"},{"id":"B","text":"只把答案截到100%","explanation":"截值掩蓋單位錯誤。"},{"id":"C","text":"將氧的符號改O便可","explanation":"符號正確不修復量綱。"},{"id":"D","text":"保留65000%，因氧可能超過整體","explanation":"部分質量不會超過同一整體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B075","stem":"甲圖「氧」占49.5%，乙圖「氧加碳」占83%。編輯想把兩值平均後稱「兩圖的平均氧占比」。最主要缺口是哪項？","correct":"B","options":[{"id":"A","text":"兩個數字都小於100，所以不能平均","explanation":"小於100不是問題。"},{"id":"B","text":"分子所指的元素集合不同，乙的83%不是氧單項","explanation":"需先取得相同元素定義的量再討論平均。"},{"id":"C","text":"兩個值含小數位不同，所以不能比較任何東西","explanation":"顯示小數位不妨礙概念比較。"},{"id":"D","text":"只要把O和C寫成OC就可以","explanation":"拼接符號不消除集合差異，也不是本節要求。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B076","stem":"僅作圖表算術：原H10%、C18%，總質量100單位。把C的4質量單位重新歸入H，其餘不動且總量不變。新的H:C質量比為何？","correct":"D","options":[{"id":"A","text":"10:18","explanation":"兩類質量已轉移，不能維持原比。"},{"id":"B","text":"14:18","explanation":"增加H卻漏減C會造成總量變104。"},{"id":"C","text":"10:14","explanation":"減C卻漏增H會少4單位。"},{"id":"D","text":"14:14，即1:1","explanation":"H=10+4，C=18−4；這是數據轉移，不描述真實元素轉變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B077","stem":"數據模型中O與C的質量比原為65:18。若兩者質量分別乘上正數u與v，要保持O:C比不變，條件是什麼？","correct":"A","options":[{"id":"A","text":"u=v","explanation":"新比65u:18v與原比相等，需u/v=1。"},{"id":"B","text":"u+v=1","explanation":"例如0.2與0.8滿足但改變比值。"},{"id":"C","text":"u=65、v=18","explanation":"這會把原比再次放大為平方比。"},{"id":"D","text":"只需總質量不變","explanation":"總量不變仍可能在O與C間轉移數值，使比值變化。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B078","stem":"在同一份沒有重複格子的週期表中，甲、乙是同一欄；乙、丙也在同一欄。只憑這些位置資訊，何者能確定？","correct":"A","options":[{"id":"A","text":"甲與丙在同一欄，可依本節把它們視為該欄的相關元素","explanation":"同一個乙格只能在一個欄中，兩個條件連到同一欄。"},{"id":"B","text":"甲與丙是同一種元素","explanation":"同欄不表示身分相同。"},{"id":"C","text":"甲與丙在人體有相同質量占比","explanation":"欄位資料未給環境占比。"},{"id":"D","text":"甲與丙的符號只有一個字母","explanation":"欄位位置不決定符號字母數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 10。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B079","stem":"人體圖C18%、H10%。學生把0.18×0.10=0.018，稱「碳與氫合計1.8%」。正確處理是什麼？","correct":"C","options":[{"id":"A","text":"改為18×10=180%","explanation":"仍是相乘，不是互斥質量部分的合計。"},{"id":"B","text":"保留1.8%，兩種元素必須相乘","explanation":"原圖兩類質量占比應相加。"},{"id":"C","text":"合計為18%+10%=28%","explanation":"同一整體不同元素質量部分的合計是加法。"},{"id":"D","text":"改為18%−10%=8%","explanation":"差值不是兩者合計。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B080","stem":"一份地殼表在抄錄時遺失Fe那一格，保留空白。整理者以0補空白後，總和變95.3%。哪個處理忠實？","correct":"D","options":[{"id":"A","text":"把其餘各項同比放大到合計100即可","explanation":"會改壞原本正確數據。"},{"id":"B","text":"把Other提高4.7就好","explanation":"Fe原本是單列元素，不能無記錄地塞入Other。"},{"id":"C","text":"接受95.3當作完整100%","explanation":"缺少欄位不能冒充完整。"},{"id":"D","text":"查回原圖Fe4.7%，以原值補回並保留缺值處理記錄","explanation":"空白是資料遺失，原圖提供確定值4.7。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B081","stem":"四條等長長條各標O65%、C18%、H10%、Other7%，圖下寫「條長按質量占比」。哪項改法維持這項圖例的承諾？","correct":"A","options":[{"id":"A","text":"用同一零點與刻度，把四條長度改成65:18:10:7","explanation":"若以長度編碼占比，長度應成比例。"},{"id":"B","text":"只把四條顏色改不同","explanation":"顏色不同仍未修復長度比例。"},{"id":"C","text":"把各標籤都改25%","explanation":"會改變原資料。"},{"id":"D","text":"把圖稱為週期表","explanation":"四條不是週期表，改名也不修正比例承諾。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B082","stem":"人體模型表列「總質量100；O65、C18、H10、Other7」，單位相同。有人將總質量100也當第五種成分相加，得到200。應如何改？","correct":"B","options":[{"id":"A","text":"把五個數都除以200當正式分布","explanation":"會把總量當成一個重複類別。"},{"id":"B","text":"成分只加O、C、H、Other；總量100作分母","explanation":"總計列與其分項有包含關係，不是第五種成分。"},{"id":"C","text":"刪去氧65就會正確","explanation":"氧是必要分項，刪去會丟資料。"},{"id":"D","text":"把總質量這一列改叫元素118","explanation":"總計不因改名成為元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B083","stem":"只作人體Other7%的紙上細分，所有細項非負。若每個被單列的新細項都要求嚴格大於2%，最多可單列幾項？","correct":"C","options":[{"id":"A","text":"4項","explanation":"四項各>2將合計>8，超過7。"},{"id":"B","text":"7項","explanation":"七項各>2將合計>14。"},{"id":"C","text":"3項","explanation":"三項可各2.2共6.6，但四項合計必超過8而不可。"},{"id":"D","text":"無限多項","explanation":"每項有>2的下界，總和7限制數目。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B084","stem":"地殼Other合計9.2%。以下都只是未知細項的假設分配，所有細項非負。哪份不可能符合此合計？","correct":"D","options":[{"id":"A","text":"兩項4.6%與4.6%","explanation":"總和9.2且非負，可以作數據假設。"},{"id":"B","text":"三項3%、3%、3.2%","explanation":"總和9.2且非負。"},{"id":"C","text":"一項9.2%，其餘0%","explanation":"單就非負和總量條件可行，不宣稱實際分布。"},{"id":"D","text":"一項10%，其餘合計−0.8%","explanation":"需要負質量占比，不符合非負條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B085","stem":"在假設細分中，人體Other7%的其中一半屬元素甲。甲在原整體的質量占比是多少？","correct":"A","options":[{"id":"A","text":"3.5%","explanation":"半個7%為0.5×7%=3.5%。"},{"id":"B","text":"50%","explanation":"50%以Other為分母，不是全體。"},{"id":"C","text":"7%","explanation":"這是整個Other，不是其中一半。"},{"id":"D","text":"57%","explanation":"把兩個不同分母的百分比直接相加。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B086","stem":"表1.1列24種，教材共列118種已知元素。算式24÷118約20.3%，可正確命名為什麼？","correct":"B","options":[{"id":"A","text":"常見元素占人體質量20.3%","explanation":"沒有人體24種合計質量的數據。"},{"id":"B","text":"本表列出種類占教材已知種類的比例","explanation":"分子分母都是元素種類數。"},{"id":"C","text":"本表每個元素都占20.3%質量","explanation":"沒有任何環境的等分條件。"},{"id":"D","text":"氫在銀河系的質量比例","explanation":"氫約74%，且與該式無關。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B087","stem":"表1.1的24種中，8種附外語來源。有人用8/24=1/3推定全部118種也恰有1/3源自外語。哪個評價正確？","correct":"C","options":[{"id":"A","text":"正確，24種本來就是完整118種","explanation":"選錄並不完整。"},{"id":"B","text":"正確，任何選錄比例都等於全體","explanation":"沒有此抽樣保證。"},{"id":"C","text":"不成立；8/24只描述這張選錄表，不能保證全體同一比例","explanation":"教材沒有把該表設計為比例代表樣本。"},{"id":"D","text":"不成立，所以表內也不能算8/24","explanation":"表內明確數目仍可計算。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3、8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B088","stem":"地殼主要清單O、Si、Al、Fe、Ca；人體主要清單O、C、H。若製作不重複的符號速查卡合併這兩清單，共需幾張？","correct":"D","options":[{"id":"A","text":"8張","explanation":"O被重複算兩次。"},{"id":"B","text":"6張","explanation":"只重疊一種O，應5+3−1。"},{"id":"C","text":"5張","explanation":"會漏掉人體的C與H。"},{"id":"D","text":"7張","explanation":"五種加三種，再扣共同的O一次，共七種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4–6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B089","stem":"地殼主要五種O、Si、Al、Fe、Ca皆已在表1.1的24種內。若把兩份清單合併去重，列出種類數是多少？","correct":"A","options":[{"id":"A","text":"24種","explanation":"五種是24種的子集合，不增加新種類。"},{"id":"B","text":"29種","explanation":"直接相加忽略重複。"},{"id":"C","text":"118種","explanation":"合併兩個選錄不自動補足全體。"},{"id":"D","text":"19種","explanation":"去重不是把已存在五種從24中刪除。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3–5、8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B090","stem":"兩筆記錄「地殼｜O｜49.5%」和「人體｜O｜65%」。若用元素符號作唯一鍵去重，只留一筆，會丟掉什麼？","correct":"B","options":[{"id":"A","text":"已知元素O的正式身分","explanation":"O本身仍可保留。"},{"id":"B","text":"同一元素在另一環境的有效占比資訊","explanation":"對豐度記錄，需同時保存環境和元素，不能只以符號合併。"},{"id":"C","text":"元素英文名稱的字母規則","explanation":"記錄主題不涉及改寫英文規則。"},{"id":"D","text":"所有118種元素的名稱","explanation":"這兩筆沒有列全體名稱。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B091","stem":"兩個英文元素名Hydrogen與Nitrogen都以-gen結尾。只憑這個拼字特徵，能否確定兩者在本節豐度圖中的比例相同？","correct":"C","options":[{"id":"A","text":"能，相同詞尾代表等質量","explanation":"名稱字尾不量化含量。"},{"id":"B","text":"能，兩者也必用同一符號","explanation":"H與N不同。"},{"id":"C","text":"不能；名稱形式不是環境豐度資料","explanation":"比例需查環境數據，不能由英文拼字得出。"},{"id":"D","text":"不能，所以Nitrogen沒有符號","explanation":"Nitrogen有N。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B092","stem":"地殼表將Si25.7%誤錄為0.257%，其他欄未變。下列哪個說法描述此錯誤？","correct":"D","options":[{"id":"A","text":"新值是原值的100倍","explanation":"其實縮小100倍。"},{"id":"B","text":"新值與原值相同，只差寫法","explanation":"25.7%=0.257作比例；0.257%不是同值。"},{"id":"C","text":"只有大小寫問題","explanation":"錯在數值與百分號，非符號格式。"},{"id":"D","text":"把比例0.257又加上百分號，造成占比縮小100倍","explanation":"25.7%對應比值0.257；再寫%相當於0.00257。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B093","stem":"人體資料O65%、C18%、H10%、Other7%；另一欄為按此順序累積的65%、83%、93%、100%。若把累積欄當四個互斥扇形，錯在何處？","correct":"A","options":[{"id":"A","text":"累積值已重複包含前項，不能直接當每項占比","explanation":"例如83含O與C，與65再加會重複O；應用原始四值。"},{"id":"B","text":"四個累積值都必須小於25%","explanation":"累積值可達100，無此上限。"},{"id":"C","text":"只需將100改118就可修好","explanation":"更換總數不解決重複包含。"},{"id":"D","text":"累積欄的最後一個值應為7%","explanation":"最後值應100；7是末項增量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B094","stem":"一份人體主要三項簡記為「O:C:H=65:18:10」，未列Other。若只靠這個比例式，可確定哪個量？","correct":"B","options":[{"id":"A","text":"H必占整體10%","explanation":"比例式未給Other，因此不能定全體分母。"},{"id":"B","text":"O與C的質量比65:18","explanation":"兩項的相對比可由比例式直接取得。"},{"id":"C","text":"Other必占7%","explanation":"此式本身未給剩餘類別占比；不能僅靠背原圖算題給未知。"},{"id":"D","text":"總質量必為93 g","explanation":"比例式不帶絕對質量單位。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B095","stem":"將表1.1卡片按「是否附外語來源」分為有8張、無16張。有同學把無註記16張改標「沒有正式符號」。哪個核對最直接反駁？","correct":"C","options":[{"id":"A","text":"8+16=24，所以每張占質量1/24","explanation":"種類筆數不能推質量。"},{"id":"B","text":"有外語來源的符號一定兩字母","explanation":"K是單字母反例，且無法解釋無註記組。"},{"id":"C","text":"無註記組仍列有C、F、H等正式符號；註記欄不是符號存在與否的欄位","explanation":"需對照分組依據和每張的符號欄位。"},{"id":"D","text":"16比8大，所以無註記組都是新元素","explanation":"分組數目不表示新舊元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B096","stem":"若人體模型O65%、C18%、H10%，有人寫Other為−7%，並說負號表示「其他」。這樣能符合質量分配嗎？","correct":"D","options":[{"id":"A","text":"能，負號只是分類名稱的一部分","explanation":"此處數值為負，不能當名稱符號。"},{"id":"B","text":"能，因為負占比可以補足總和","explanation":"65+18+10−7=86，不是100。"},{"id":"C","text":"不能，只須把O改79就好","explanation":"會改壞來源O，且負占比仍不合理。"},{"id":"D","text":"不能；剩餘應為正7%，且質量占比不能為負","explanation":"原合計93，補數100−93=7。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B097","stem":"一份原子個數百分比模型只有甲60%、乙40%，未給總原子數。一個人填甲6顆、乙4顆，另一人填甲600顆、乙400顆。哪個結論對？","correct":"A","options":[{"id":"A","text":"兩組都符合相同比例；百分比本身不能指定絕對總顆數","explanation":"6/10和600/1000均為60%，另一項均40%。"},{"id":"B","text":"只有6顆與4顆符合","explanation":"沒有總數10的條件。"},{"id":"C","text":"只有600顆與400顆符合","explanation":"沒有總數1000的條件。"},{"id":"D","text":"兩組均不可能，因為百分比總和100必有100顆","explanation":"100%表示全體，不表示總數一定100。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 6。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B098","stem":"地殼主要五種為O、Si、Al、Fe、Ca；表1.1附外語來源的八個符號為Cu、Fe、Pb、Hg、K、Ag、Na、Sn。下列哪項同時屬於兩份清單？","correct":"B","options":[{"id":"A","text":"Cu，銅","explanation":"Cu在外語來源清單，但不在地殼主要五種清單。"},{"id":"B","text":"Fe，鐵，來源詞ferrum","explanation":"Fe同時出現於兩份清單，且名稱和詞源對應正確。"},{"id":"C","text":"Si，矽","explanation":"Si在地殼主要清單，但不在題給八個來源清單。"},{"id":"D","text":"Na，鈉","explanation":"Na在外語來源清單，但不在題給主要五種清單。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 4、8–9。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B099","stem":"只允許使用26個大寫英文字母作一字母符號，且每種元素須有不同符號。為本教材118種元素建立索引時，為何不能全部只用這26種一字母組合？","correct":"C","options":[{"id":"A","text":"因為每個元素本來都必須兩字母","explanation":"教材允許一或兩個字母。"},{"id":"B","text":"因為英文名稱不能用大寫","explanation":"第一符號字母反而需大寫。"},{"id":"C","text":"26種不同記號不足以一一標示118種元素","explanation":"需足夠不同識別碼；使用雙字母可擴大組合。"},{"id":"D","text":"因為118是質量百分比","explanation":"118是種類數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3、7。","example":""},{"id":"central-0-1-ch1-sec1-2-topic03-G02-B100","stem":"若只按格式計數，首字母可選26個大寫、次字母可選26個小寫，共26×26=676種兩字母組合。能否據此宣布已知676種元素？","correct":"D","options":[{"id":"A","text":"能，所有字母組合都已指派給元素","explanation":"格式空間不等於實際元素清單。"},{"id":"B","text":"能，將118改成676即可","explanation":"這會以理論組合取代教材已知數。"},{"id":"C","text":"不能，所以雙字母符號都無效","explanation":"實際雙字母符號存在，不能全否定。"},{"id":"D","text":"不能；可能的記號組合數與已確認元素種類數不同","explanation":"必須依正式元素索引確認實際指派，不能數可能字串當元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Ch.1 Introduction: Matter, Energy, and Measurement → 1.2 Classifications of Matter → Elements；Figure 1.6／Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 3、7、10。","example":""}]},{"depth":"精讀","target":150,"questions":[]}]}],"schools":[{"id":"CMU","label":"中國醫藥大學","version":"shared-v1","mode":"shared"},{"id":"TCU","label":"慈濟大學","version":"shared-v1","mode":"shared"},{"id":"ISU","label":"義守大學","version":"shared-v1","mode":"shared"}],"schoolNotice":"目前五個入門節點採三校共用的基礎練習，切換學校會分別保存作答進度。各校考點配置尚待後續製題完成。"}</script><script>/* Pure quiz state engine. All questions are compiled from the verified CSV files. */
(function(root){'use strict';
const DEPTHS=['掃過','基礎讀','精讀'], TARGETS=[50,100,150];
const clone=x=>JSON.parse(JSON.stringify(x));
const DEFAULT_SCHOOLS=[{id:'CMU',label:'中國醫藥大學',version:'shared-v1',mode:'shared'},{id:'TCU',label:'慈濟大學',version:'shared-v1',mode:'shared'},{id:'ISU',label:'義守大學',version:'shared-v1',mode:'shared'}];
function assert(ok,msg){if(!ok)throw new Error(msg);}
function shuffle(items,rng){const a=items.slice();for(let i=a.length-1;i>0;i--){const r=rng();assert(Number.isFinite(r)&&r>=0&&r<1,'抽題亂數失效，原題組已保留。');const j=Math.floor(r*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function validateData(data){
 assert(data&&data.schema==='chem-quiz-public/v2'&&Array.isArray(data.nodes)&&data.nodes.length>0,'題庫格式不正確。');
 const ids=new Set(),questions=new Set();
 const schools=data.schools||DEFAULT_SCHOOLS;
 assert(schools.length===3&&schools.every((s,i)=>s.id===DEFAULT_SCHOOLS[i].id&&s.label===DEFAULT_SCHOOLS[i].label&&s.version&&['shared','school-specific'].includes(s.mode)),'學校版本資訊不正確。');
 for(const n of data.nodes){
  assert(n.id&&n.title&&n.version&&n.routeDepth&&Array.isArray(n.hierarchy),'節點資訊不完整。');
  assert(!ids.has(n.id),'節點身分重複。');ids.add(n.id);
  assert(Number.isInteger(n.reviewedLevel)&&n.reviewedLevel>=0&&n.reviewedLevel<=2,'來源深度不正確。');

dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeCatalog(true);}});
$('start-set').addEventListener('click',()=>attempt(draw));$('resume-set').addEventListener('click',()=>attempt(()=>{selecting=false;render();closeCatalog();if(engine.statistics().complete)showResults(false);else focusQuestion();}));
$('previous').addEventListener('click',()=>reviewQuestion(Math.max(0,engine.current().at-1)));$('next').addEventListener('click',()=>reviewQuestion(Math.min(9,engine.current().at+1)));
function reset(){attempt(()=>{engine.reset();selecting=false;stopResultMotion();render();focusQuestion();say('本組十題答案與統計已清空，原題、題序及選項順序均保留。');});}
$('reset').addEventListener('click',reset);$('result-reset').addEventListener('click',reset);$('view-results').addEventListener('click',()=>showResults());
$('review-all').addEventListener('click',()=>reviewQuestion(0));$('review-wrong').addEventListener('click',()=>{const s=engine.current(),i=s.answers.findIndex((a,j)=>a!==engine.question(s,j).correct);if(i>=0)reviewQuestion(i);});
$('new-set').addEventListener('click',()=>attempt(draw));$('upgrade').addEventListener('click',()=>attempt(()=>{if(drawing)return;drawing=true;try{engine.upgrade();selecting=false;stopResultMotion();render();focusQuestion();}finally{setTimeout(()=>{drawing=false;},350);}}));
$('finish').addEventListener('click',()=>{selecting=true;stopResultMotion();render();showPanel('catalog',true);});
motion.addEventListener('change',stopResultMotion);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopResultMotion();});
buildTree();buildSchools();if(!engine.restoreSelection())engine.select(engine.data.nodes[0].id,0);render();
})();
</script></body></html>
