<script id="quiz-data" type="application/json">{"schema":"chem-quiz-public/v2","nodes":[{"id":"central-0-1-ch1-sec1-1-topic01","title":"1.1-01 化學的原子與分子觀點","version":"B01-G02-v1-312b0313f9587105","routeDepth":"基礎讀","reviewedLevel":1,"hierarchy":["第1月｜第0輪","0-1","基礎化學","第1章 導論：物質、能量與測量","1.1 化學研究"],"banks":[{"depth":"掃過","target":50,"questions":[{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S001","stem":"判斷某實體材料是否符合本節的物質定義，檢核表原有「有質量」與「占空間」兩格。哪種勾選規則正確？","correct":"D","options":[{"id":"A","text":"只看是否透明","explanation":"透明與否不是定義條件。"},{"id":"B","text":"至少一格成立即可","explanation":"定義同時要求兩項，不能用或取代且。"},{"id":"C","text":"兩格都不成立","explanation":"兩項都不成立不符合定義。"},{"id":"D","text":"兩格都成立","explanation":"有質量並占空間才符合這個定義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S002","stem":"研究紀錄只保留一個欄位，目標是讓別人比較材料本身的特徵。哪一欄最合適？","correct":"B","options":[{"id":"A","text":"登錄者姓名","explanation":"登錄者身分不描述材料。"},{"id":"B","text":"在指定條件下的顏色","explanation":"指定條件下的顏色屬於材料性質資料。"},{"id":"C","text":"檔案建立日期","explanation":"建立日期描述檔案，未描述材料性質。"},{"id":"D","text":"收件流水號","explanation":"流水號是管理代碼，不是材料特徵。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S003","stem":"圖說寫「樣品為無色；模型中的O球塗紅色」。有人認為這兩句互相矛盾。哪個解讀正確？","correct":"D","options":[{"id":"A","text":"紅球證明樣品其實是紅色","explanation":"不能把球的顏色轉成樣品顏色。"},{"id":"B","text":"無色樣品不可能含O","explanation":"模型的氧色碼不能限制樣品顏色。"},{"id":"C","text":"應把樣品的觀察刪掉","explanation":"兩種資料角色不同，都可保留。"},{"id":"D","text":"紅球是色碼，無色是樣品的觀察","explanation":"兩句分別描述表示工具與巨觀樣品，並不矛盾。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S004","stem":"一件塑膠球教具放在桌上，代表一個水分子。下列哪句同時正確描述「教具本體」與「它代表的對象」？","correct":"D","options":[{"id":"A","text":"所指是三顆塑膠原子","explanation":"所指是水中的原子，不是塑膠製成的原子。"},{"id":"B","text":"本體就是放大的真水分子","explanation":"教具不是將真實水分子放大。"},{"id":"C","text":"本體不是物質，因為它是符號","explanation":"塑膠教具仍是有質量、占空間的物件。"},{"id":"D","text":"本體是可見物件，所指是微觀分子","explanation":"實體教具位於巨觀世界，功能上表示微觀對象。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S005","stem":"排版時將CO₂的字體由黑色改為藍色，字母與下標全部保持。此改動本身是否改變式子所表達的原子數？","correct":"C","options":[{"id":"A","text":"無法再讀出任何組成","explanation":"化學式內容完整，仍能閱讀。"},{"id":"B","text":"改變，因為藍色代表新增元素","explanation":"字體顏色未被題目指定為元素編碼。"},{"id":"C","text":"不改變，字母及下標資訊未變","explanation":"CO₂仍表示每分子1C、2O。"},{"id":"D","text":"改變，所有原子都變成O","explanation":"O的數目由下標指定，並非字體顏色。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S006","stem":"黑白列印使模型的紅球與黑球看起來一樣。若要保留C與O的辨識，最直接的補救是？","correct":"C","options":[{"id":"A","text":"刪掉所有氧球","explanation":"刪球會改變模型組成。"},{"id":"B","text":"把每顆球都標成C","explanation":"全部標C會改錯原子種類。"},{"id":"C","text":"在各球加上正確的C或O字母","explanation":"元素字母可替代失去的顏色差異。"},{"id":"D","text":"只放大整張圖，不加標示","explanation":"放大仍無法解除同色造成的歧義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S007","stem":"教學頁約定「細線是原子連接，灰色方格只是排版」。一個模型跨過兩格，應依什麼判斷其原子如何結合？","correct":"A","options":[{"id":"A","text":"原子間的細線","explanation":"依圖例，細線才是連接資訊。"},{"id":"B","text":"印刷頁碼","explanation":"頁碼只定位頁面。"},{"id":"C","text":"頁面寬度","explanation":"頁寬不是分子結構。"},{"id":"D","text":"灰格數目","explanation":"方格不具有連接意義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S008","stem":"同一個水分子模型畫了正面與背面兩個視角，圖說明定為「同一分子的兩個視圖」。能因畫面有兩幅圖就判定有兩個分子嗎？","correct":"C","options":[{"id":"A","text":"能，旋轉會複製分子","explanation":"改變觀察視角不會複製粒子。"},{"id":"B","text":"能，圖框數必等於分子數","explanation":"圖框可用於多視角，不能當物件計數。"},{"id":"C","text":"不能，兩視圖指同一對象","explanation":"題目已明示兩個視圖共指同一分子。"},{"id":"D","text":"不能，水不由分子構成","explanation":"水分子本身是本節明列的例子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S009","stem":"某未知分子的完整模型有一部分被遮住；可見三顆標為C的球，未提供分子式。只依這張局部圖，哪項可確認？","correct":"C","options":[{"id":"A","text":"少於三個C","explanation":"已可見三顆，不能少於三個。"},{"id":"B","text":"恰好三個C","explanation":"可能尚有被遮住的C，不能斷言恰好。"},{"id":"C","text":"至少三個C","explanation":"可見部分提供下限，未提供完整總數。"},{"id":"D","text":"完全不含C","explanation":"可見C球直接否定完全不含C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S010","stem":"球模型中一顆O球的輪廓有一半被前方球遮住。圖例說每顆完整球代表一個原子。這顆被遮住的O球應如何理解？","correct":"B","options":[{"id":"A","text":"代表半個氧原子","explanation":"畫面可見比例不是原子個數比例。"},{"id":"B","text":"代表一個氧原子","explanation":"遮蔽只影響看見的部分，球仍是一顆。"},{"id":"C","text":"代表兩種元素各一半","explanation":"球已標O，沒有混合元素的含義。"},{"id":"D","text":"代表氧已分裂","explanation":"模型視角不能證明原子分裂。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S011","stem":"一張清單列H₂O、CO₂、O₂，欄名是「這三種分子共同含有的元素」。哪個填法正確？","correct":"D","options":[{"id":"A","text":"H、C、O","explanation":"H與C並非三者共有。"},{"id":"B","text":"H","explanation":"CO₂與O₂不含H。"},{"id":"C","text":"C","explanation":"H₂O與O₂不含C。"},{"id":"D","text":"O","explanation":"三個式子都含O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S012","stem":"只看單一分子的原子總數，H₂O與CO₂有哪個共同特徵？","correct":"D","options":[{"id":"A","text":"都含一個O","explanation":"CO₂含兩個O。"},{"id":"B","text":"都含兩個H","explanation":"CO₂沒有H。"},{"id":"C","text":"都只有一種元素","explanation":"兩者都含兩種元素。"},{"id":"D","text":"都各含三個原子","explanation":"2H加1O與1C加2O，各為三個原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S013","stem":"教具設計者保留原有的C、H、O球，又加上一顆O球，仍當作一個假想模型。哪項量必定不變？","correct":"B","options":[{"id":"A","text":"O原子數","explanation":"O球增加一顆。"},{"id":"B","text":"元素種類數","explanation":"新增的是原先已有的O，因此種類數未增加。"},{"id":"C","text":"各元素原子數比例","explanation":"C、H未變而O增加，比例改變。"},{"id":"D","text":"原子總數","explanation":"新增球使總數增加。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S014","stem":"題目要求填「一個水分子的H:O原子數比例」。哪個回答形式切合要求？","correct":"A","options":[{"id":"A","text":"2:1","explanation":"每分子2H、1O，因此比例為2:1。"},{"id":"B","text":"三個原子","explanation":"三個是原子總數，不是兩類的比例。"},{"id":"C","text":"一個分子","explanation":"分子數沒有回答H與O的比例。"},{"id":"D","text":"H與O","explanation":"這只列出種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S015","stem":"卡片寫「乙醇分子式：C₂H₆O」，另行旁註「每分子共9個原子」。學生把旁註的9接到O後寫成C₂H₆O₉。這項合併正確嗎？","correct":"D","options":[{"id":"A","text":"正確，旁註9表示新增9個O","explanation":"總數說明不表示新增原子。"},{"id":"B","text":"正確，任何旁註數字都要接在最後元素後","explanation":"旁註不是化學式的一部分。"},{"id":"C","text":"不正確，因為乙醇不能含O","explanation":"乙醇的C₂H₆O明確含O。"},{"id":"D","text":"不正確，9是全分子的總數旁註，不能改成O的下標","explanation":"旁註的計數範圍是全體原子，原式末O仍表示1個，兩種數字不能直接拼接。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S016","stem":"一張圖卡標為O₂，圖中有一顆球清楚標C。即使其他部分尚未看清，已能判斷什麼？","correct":"B","options":[{"id":"A","text":"O₂可以含C","explanation":"O₂的元素符號只有O。"},{"id":"B","text":"圖卡與模型至少有一處不一致","explanation":"單一不相容元素便足以指出兩者不一致。"},{"id":"C","text":"只要總球數為2就沒有問題","explanation":"總數對也不能補救元素種類錯誤。"},{"id":"D","text":"一定是正確O₂模型","explanation":"O₂不含C，已有反證。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S017","stem":"一頁上方有H、C、O三顆「圖例示範球」，下方才是待讀的分子模型。題目問下方分子的組成，應把上方三顆也加進去嗎？","correct":"B","options":[{"id":"A","text":"要，頁面所有球都屬同一分子","explanation":"圖例與模型是不同用途的區域。"},{"id":"B","text":"不要，圖例提供解碼規則，不是該分子的原子","explanation":"圖例球說明符號，不能加到目標模型的原子清單。"},{"id":"C","text":"只加上方O球","explanation":"沒有只加O圖例球的依據。"},{"id":"D","text":"只加最大一球","explanation":"尺寸也不能決定圖例球屬於模型。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S018","stem":"在只作連接示意的教具活動中，老師要求「保留原子種類與數目，改變連接方式」。哪項操作符合要求？","correct":"A","options":[{"id":"A","text":"拆接現有球之間的連線","explanation":"原球清單不變而連線改動，正是結構操作。"},{"id":"B","text":"把C標籤改為O","explanation":"改標元素也改變組成。"},{"id":"C","text":"把球模型拍得更亮","explanation":"亮度改變表示外觀，未改變連接。"},{"id":"D","text":"增加一顆H球","explanation":"增加球會改變組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S019","stem":"水的分子式原稿為H₂O，誤印成H₂0，末字明確是數字零而非字母O。最直接的修正是？","correct":"B","options":[{"id":"A","text":"刪掉所有數字與字母","explanation":"刪除全式無法保留組成。"},{"id":"B","text":"把末字改回大寫字母O","explanation":"改回O才能保留氧的元素身分。"},{"id":"C","text":"保留0，零就是氧的元素符號","explanation":"氧用字母O表示，數字0不能替代元素。"},{"id":"D","text":"把H也改為0","explanation":"改H會再遺失氫資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S020","stem":"教材說微小的分子差異「可能」帶來明顯性質差異。以下哪個附註保留了這個語氣？","correct":"B","options":[{"id":"A","text":"一定只改變一項性質","explanation":"來源沒有保證只變一項。"},{"id":"B","text":"不能因此要求每項性質都不同","explanation":"教材的可能性敘述不推出所有性質必變。"},{"id":"C","text":"每一項性質都一定改變","explanation":"可能影響性質不等於全部必變。"},{"id":"D","text":"差異小時絕不可能改變性質","explanation":"這與教材的小差異可有大影響相反。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S021","stem":"資料對某液體同時寫「黏稠」與「有毒」。兩者能否同時成立？","correct":"C","options":[{"id":"A","text":"能，因為黏稠必然導致有毒","explanation":"兩種特徵同時出現，不代表必然因果。"},{"id":"B","text":"不能，黏度就是毒性","explanation":"黏稠與毒性不是同義詞。"},{"id":"C","text":"能，描述不同性質面向","explanation":"流動特徵與生物傷害是不同面向。"},{"id":"D","text":"不能，有毒物質不能是液體","explanation":"本節乙二醇就是有毒液體例子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S022","stem":"雙語卡把「乙醇—ethylene glycol」與「乙二醇—ethanol」並列。按教材應做哪項修正？","correct":"C","options":[{"id":"A","text":"中文兩名合併為一種物質","explanation":"兩者是不同物質。"},{"id":"B","text":"只刪去所有O符號","explanation":"英文對應錯誤不能靠刪原子符號修正。"},{"id":"C","text":"把兩個英文名稱對調","explanation":"ethanol是乙醇，ethylene glycol是乙二醇。"},{"id":"D","text":"無需修正，兩詞是同義詞","explanation":"教材明確區分這兩個名稱。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S023","stem":"「乙二醇的O數是乙醇的兩倍」若指本節分子式的直接比較，省略的比較基準應是？","correct":"D","options":[{"id":"A","text":"每一瓶液體","explanation":"瓶內含多少物質尚未指定。"},{"id":"B","text":"每一克液體","explanation":"等質量比較還需其他資料。"},{"id":"C","text":"每一毫升液體","explanation":"等體積並不保證等分子數。"},{"id":"D","text":"每一個分子","explanation":"每分子分別2O與1O，可直接說兩倍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S024","stem":"展板寫「此液體作防凍液」並附分子式。若把用途那句改寫成原子清單，是否已保留原句資訊？","correct":"C","options":[{"id":"A","text":"未保留，因為用途沒有任何意義","explanation":"用途有資訊價值，只是不屬原子清單。"},{"id":"B","text":"已保留，原子清單就是用途","explanation":"原子清單不直接等於用途。"},{"id":"C","text":"未保留，組成與用途是不同資料","explanation":"分子組成與巨觀用途需分開記錄及連結。"},{"id":"D","text":"已保留，含O就必定作防凍液","explanation":"含O不足以決定用途。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S025","stem":"研究者聲稱「把舊物質換一個名字，就已完成分子改造」。依本節可控改變分子的意義，缺少哪種證據？","correct":"C","options":[{"id":"A","text":"新名稱更長的證據","explanation":"名稱長短不代表分子改變。"},{"id":"B","text":"包裝換色的證據","explanation":"包裝色不是分子資訊。"},{"id":"C","text":"組成或結構實際改變的證據","explanation":"分子改造應涉及組成或結構，需有實際支持。"},{"id":"D","text":"登錄日期較新的證據","explanation":"日期較新不能證明化學變更。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S026","stem":"報告有兩句：「實測液體流動較慢」「推測其分子排列與另一液體不同」。哪句明確是以粒子提出的解釋？","correct":"A","options":[{"id":"A","text":"只有第二句","explanation":"第二句提及分子排列並標示推測，屬微觀解釋。"},{"id":"B","text":"兩句都是直接看見單一分子","explanation":"第一句非單分子觀察，第二句也明說推測。"},{"id":"C","text":"兩句都只是分子式","explanation":"兩句都不是單純式子。"},{"id":"D","text":"只有第一句","explanation":"第一句記錄巨觀流動觀察。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S027","stem":"一份紀錄寫「同一樣品開始是無色，稍後呈黃色」。哪個摘要最忠實？","correct":"B","options":[{"id":"A","text":"完全沒有記錄物質行為","explanation":"物質性質的時間變化正是化學研究內容之一。"},{"id":"B","text":"記錄顏色隨時間的變化","explanation":"它比較同一樣品兩時刻的巨觀顏色。"},{"id":"C","text":"只記錄一個分子的原子數","explanation":"句子沒有原子計數。"},{"id":"D","text":"已直接確定新增了一個O","explanation":"顏色變化不直接指定哪個原子改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 10_imagegen_page_03.png（正式第3頁，正文第1頁）；11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S028","stem":"學生說「密度是用儀器量測而非肉眼直接看到，因此一定屬微觀層次」。本節三層語言應如何判斷？","correct":"A","options":[{"id":"A","text":"樣品的量測性質仍可屬巨觀","explanation":"量測普通尺度樣品的性質，仍是巨觀資料。"},{"id":"B","text":"只要寫成文字就是分子結構","explanation":"文字可描述不同層次，不等於結構。"},{"id":"C","text":"數字越小越是微觀","explanation":"數字大小須連同對象解讀。"},{"id":"D","text":"凡需儀器都是原子層次","explanation":"是否用儀器不是巨微觀的唯一界線。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S029","stem":"研究者先寫下某未知樣品的猜測分子式，尚未驗證。這串分子式在報告中應標為？","correct":"A","options":[{"id":"A","text":"表示一個待檢驗的組成假說","explanation":"符號可以用來表達假說，但須與證據區分。"},{"id":"B","text":"測得的黏度數據","explanation":"組成式不提供黏度量測值。"},{"id":"C","text":"直接拍到的原子照片","explanation":"式子不是照片。"},{"id":"D","text":"已完成的實物鑑定","explanation":"寫下式子不等於已證明樣品身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S030","stem":"一張練習表已給出水分子示意及H₂O字樣，要求補一項「可在普通尺度觀察的對應對象」。哪項符合？","correct":"B","options":[{"id":"A","text":"把O改畫紅色","explanation":"改色仍是模型表示操作。"},{"id":"B","text":"杯中的水","explanation":"杯中水是對應的巨觀樣品。"},{"id":"C","text":"再抄一次H₂O","explanation":"再次抄式子仍是符號。"},{"id":"D","text":"寫下單一分子的原子連接","explanation":"原子連接屬微觀描述，未補巨觀。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）；23_imagegen_page_16.png（正式第16頁，正文第14頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S031","stem":"同一杯水的學習卡依序排「H₂O字樣、分子模型、杯中水的觀察」。有人說「符號排最先，就違反三層觀點」。這個限制能從本節推出嗎？","correct":"B","options":[{"id":"A","text":"能推出；一定先看實物，才可看任何式子","explanation":"本節沒有規定所有閱讀必須照單一路徑進行。"},{"id":"B","text":"不能推出；三層表示的分類不規定讀取先後","explanation":"巨觀、微觀、符號描述不同資料角色，可以互相對照；欄位排列順序不改變它們的對應。"},{"id":"C","text":"能推出；把符號排第一就會增加元素種類","explanation":"版面欄序不改元素種類。"},{"id":"D","text":"不能推出；因為三層其實都只指同一張照片","explanation":"三層所指資料角色不同，不都是照片。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）；20_imagegen_page_13.png（正式第13頁，正文第11頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S032","stem":"在H₂O(l)的(l)被漏印，但H₂O仍完整時，最直接遺失哪項資訊？","correct":"A","options":[{"id":"A","text":"原先標示的液態狀態","explanation":"括號內l是液態標記，漏印使此訊息消失。"},{"id":"B","text":"H與O的種類","explanation":"H、O字母仍完整。"},{"id":"C","text":"每分子的O原子數","explanation":"O仍未帶下標，表示每分子1O。"},{"id":"D","text":"每分子H原子數","explanation":"H下標2仍存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 20_imagegen_page_13.png（正式第13頁，正文第11頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S033","stem":"課堂只比較數種材料已有的顏色與密度，沒有製造新物質。有人說「所以這不屬化學研究範圍」。依本節如何判斷？","correct":"C","options":[{"id":"A","text":"正確，化學只研究製造新物質","explanation":"化學也研究物質及其性質。"},{"id":"B","text":"正確，只有有毒物才可研究","explanation":"毒性不是納入研究的必要條件。"},{"id":"C","text":"不正確，研究物質已有的性質也屬範圍","explanation":"研究範圍包含性質，並非每次都須發生變化。"},{"id":"D","text":"不正確，因為所有研究都只是在背名字","explanation":"化學研究不只是名稱記憶。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 10_imagegen_page_03.png（正式第3頁，正文第1頁）；11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S034","stem":"教材說多種物質可由有限元素組合而來。學生把它改成「每一個水分子都要含有那整套元素」。哪個反駁最直接？","correct":"A","options":[{"id":"A","text":"H₂O只列H與O，個別分子不必含整套元素","explanation":"全體材料可使用的元素集合不等於每一分子的組成。"},{"id":"B","text":"水每分子應有一百個O","explanation":"H₂O並未表示一百O。"},{"id":"C","text":"有限元素表示水不能存在","explanation":"有限種類仍可組成水。"},{"id":"D","text":"所有元素名稱都可省略","explanation":"元素符號有組成意義，不能因此省略。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 12_imagegen_page_05.png（正式第5頁，正文第3頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S035","stem":"水與二氧化碳模型都標有O。只因O所連的鄰近原子不同，能把兩處O當成不同元素嗎？","correct":"B","options":[{"id":"A","text":"不能，因為兩分子完全相同","explanation":"水與二氧化碳的組成不同。"},{"id":"B","text":"不能，兩處仍用O表示氧元素","explanation":"O標籤仍對應氧，所在分子可以不同。"},{"id":"C","text":"能，水中的O必是H","explanation":"水中的O不會因此變為H。"},{"id":"D","text":"能，鄰居決定元素名稱","explanation":"連接環境不同不等於元素種類更換。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 13_imagegen_page_06.png（正式第6頁，正文第4頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S036","stem":"展示櫃新增一張原先未展示的分子圖，但圖中只用既有的H、C、O三種標籤。最直接增加的是？","correct":"C","options":[{"id":"A","text":"元素種類必定增加一種","explanation":"新分子不必含新元素。"},{"id":"B","text":"宇宙元素總數","explanation":"展品變更不是元素總數變化。"},{"id":"C","text":"展示的分子圖種類","explanation":"新增的是一種展示圖，可使用既有元素。"},{"id":"D","text":"每個H原子的種類","explanation":"H仍代表同一元素種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 12_imagegen_page_05.png（正式第5頁，正文第3頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S037","stem":"一份O₂教具把兩顆氧球編為O甲、O乙，說明甲乙只區分兩顆球。應如何讀這兩個標記？","correct":"B","options":[{"id":"A","text":"兩個完整O₂分子","explanation":"整個兩球組才表示一個O₂。"},{"id":"B","text":"同種元素的兩個原子個體","explanation":"兩顆均標O，是同種元素的不同原子。"},{"id":"C","text":"氧與碳各一個","explanation":"沒有C標記。"},{"id":"D","text":"兩種元素","explanation":"個體代碼不創造新元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 13_imagegen_page_06.png（正式第6頁，正文第4頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S038","stem":"一張卡的常用名稱欄空白，但清楚給出分子式C₂H₆O₂。只因不知常用名，是否就完全無法閱讀組成？","correct":"A","options":[{"id":"A","text":"否，仍可依元素符號與下標讀出組成","explanation":"可讀2C、6H、2O，常用名空白不妨礙這項工作。"},{"id":"B","text":"是，沒有名字所有下標都失去意義","explanation":"化學式有獨立可讀的組成意義。"},{"id":"C","text":"是，必須先知道用途才能數原子","explanation":"數原子不需要先知用途。"},{"id":"D","text":"否，所以也已知道全部性質","explanation":"組成可讀不等於全部性質已知。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；21_imagegen_page_14.png（正式第14頁，正文第12頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S039","stem":"為使讀者只靠色碼區分H、C、O，哪種圖例會造成無法區分其中兩種元素？","correct":"A","options":[{"id":"A","text":"白H、黑C、黑O","explanation":"C與O共用黑色且無其他標記，兩者無法區分。"},{"id":"B","text":"三種元素各用不同紋理且說明清楚","explanation":"不同紋理同樣可提供可辨識符號。"},{"id":"C","text":"H、C、O各加字母標籤","explanation":"字母本身可清楚區分。"},{"id":"D","text":"白H、黑C、紅O","explanation":"三個色碼互異，可辨識。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S040","stem":"「大約一百種元素」中的一百，在本節是用來概述哪種數量？","correct":"A","options":[{"id":"A","text":"整個物質世界使用的基本元素種類量級","explanation":"教材藉此說明基本種類有限，與物質多樣性對照。"},{"id":"B","text":"每顆模型球的直徑","explanation":"數目也不表示長度。"},{"id":"C","text":"每一個分子含的原子總數","explanation":"元素種類概數不是每分子原子數。"},{"id":"D","text":"一滴水的分子總數","explanation":"句子沒有計算水滴粒子數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 12_imagegen_page_05.png（正式第5頁，正文第3頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S041","stem":"兩份資料一份用圖、一份用文字「中央O分別與兩個H相連」。後者因沒有畫球就不能表示結構嗎？","correct":"D","options":[{"id":"A","text":"不能，文字只表示密度","explanation":"句子內容是連接而非密度。"},{"id":"B","text":"能，因為所有文字都等於實物","explanation":"文字是表示，不等於實物。"},{"id":"C","text":"不能，結構只能由彩色圖表示","explanation":"連接資訊不限於圖畫。"},{"id":"D","text":"能，文字也可表達連接關係","explanation":"這句文字明確交代誰與誰相連。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S042","stem":"資料說化學家由原材料設計性質不同的新物質。要評估是否得到所需性質，除了新物質的結構，還需哪項直接資料？","correct":"D","options":[{"id":"A","text":"新名字的字體","explanation":"字體不能證明材料性質。"},{"id":"B","text":"分子模型的售價","explanation":"教具售價不是物質性質量測。"},{"id":"C","text":"研究報告的頁數","explanation":"篇幅不支持性質表現。"},{"id":"D","text":"新物質相關性質的量測結果","explanation":"目標是性質，因此須有相應性質證據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S043","stem":"一份資料只寫「長期用於緩解疼痛的柳樹皮天然產物」。只依這句話能直接填出什麼？","correct":"D","options":[{"id":"A","text":"每分子的C數","explanation":"沒有C的計數資料。"},{"id":"B","text":"全部原子連接","explanation":"用途敘述未提供結構。"},{"id":"C","text":"完整分子式","explanation":"句子沒有原子清單。"},{"id":"D","text":"資料所描述的來源與用途","explanation":"句子確實提供來源與用途描述。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S044","stem":"同一個乙醇分子先以C₂H₆O表示，再以CH₃CH₂OH表示。後一種寫法額外提示哪種資訊？","correct":"B","options":[{"id":"A","text":"使用者的酒量","explanation":"式子不給個人的生理反應資料。"},{"id":"B","text":"原子如何分組連接","explanation":"縮寫結構式保留部分連接與原子分組資訊。"},{"id":"C","text":"採樣日期","explanation":"兩式不包含日期。"},{"id":"D","text":"瓶子的形狀","explanation":"兩式都未描述容器。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；21_imagegen_page_14.png（正式第14頁，正文第12頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S045","stem":"教學卡以「氧氣」及「二氧化碳」作標題，每張卡各畫一個完整分子。能因第二個名稱較長便說它畫了更多分子嗎？","correct":"C","options":[{"id":"A","text":"能，字數就是分子數","explanation":"文字長度與圖中分子數沒有此對應。"},{"id":"B","text":"不能，因為所有分子原子數都相同","explanation":"O₂與CO₂的每分子原子總數不同。"},{"id":"C","text":"不能，兩卡都各表示一個分子","explanation":"題目已規定每卡各一個完整分子。"},{"id":"D","text":"能，名稱含二就代表兩個分子","explanation":"二氧化碳名稱中的二不是畫面分子數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S046","stem":"組成表中C欄留空，旁註「尚未檢查」。能否把它直接讀成「已確認不含C」？","correct":"A","options":[{"id":"A","text":"不能，未檢查與已確認零個不同","explanation":"未取得資訊不能當作元素不存在的證據。"},{"id":"B","text":"不能，因為所有分子一定有C","explanation":"H₂O、O₂等不含C，不能用全稱含C解釋。"},{"id":"C","text":"能，空白永遠等於零","explanation":"空白在本表表示未知，並非數值0。"},{"id":"D","text":"能，因為只有O才需要檢查","explanation":"C也可作組成檢查對象。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S047","stem":"圖說約定H[2]是「第二顆氫原子的個體編號」，而式子H₂中的₂表示原子個數。按此約定，H[2]指什麼？","correct":"B","options":[{"id":"A","text":"兩種不同元素","explanation":"編號不創造元素種類。"},{"id":"B","text":"一顆有編號的氫原子","explanation":"方括號已被定義為個體編號，指第二顆那一個H。"},{"id":"C","text":"一顆氧原子","explanation":"元素字母仍是H。"},{"id":"D","text":"兩個完整氫分子","explanation":"個體標號並非分子數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S048","stem":"本頁說「以下三張模型均沿用白H、黑C、紅O」。讀完後翻到另一份未註明圖例的自訂圖，應如何處理？","correct":"A","options":[{"id":"A","text":"先查該圖自己的圖例或明示約定","explanation":"先確認另一圖的約定，才能正確解碼。"},{"id":"B","text":"保證其所有球都是H","explanation":"沒有根據可把全部球當H。"},{"id":"C","text":"直接判定該圖錯誤","explanation":"未註明不代表已證明科學內容錯誤。"},{"id":"D","text":"保證其黑球一定是C","explanation":"原約定僅涵蓋指定三圖，不自動涵蓋其他文件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S049","stem":"一張統計圖明定「每個□代表一個完整H₂O分子，不是原子球」，畫出三個□。能直接讀出幾個水分子？","correct":"B","options":[{"id":"A","text":"1個","explanation":"圖上三個代表單位，不是單一分子。"},{"id":"B","text":"3個","explanation":"每方格代表一分子，三格就是三分子。"},{"id":"C","text":"6個","explanation":"6是三個水分子中的H總數，不是分子數。"},{"id":"D","text":"9個","explanation":"9是三個水分子中的原子總數，不是所問量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-S050","stem":"要把一個實際樣品的觀察、模型與分子式連成同一份學習紀錄，最先應確認哪件事？","correct":"B","options":[{"id":"A","text":"三者都使用同一字體","explanation":"字體一致不能保證化學身分一致。"},{"id":"B","text":"三者對應同一目標物質","explanation":"跨層連結需先確保描述的是同一物質。"},{"id":"C","text":"三者長度相同","explanation":"文字或圖像長度與對象一致性無關。"},{"id":"D","text":"三者都有紅色","explanation":"紅色是呈現特徵，不能代替身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）；23_imagegen_page_16.png（正式第16頁，正文第14頁）。","example":""}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B001","stem":"教具盤有1個阿斯匹靈C₉H₈O₄、3個乙醇C₂H₆O與5個CO₂模型。哪一類模型提供全盤恰好一半的C球？只計教具，不涉及反應。","correct":"D","options":[{"id":"A","text":"乙醇","explanation":"乙醇共提供6個C，不是10。"},{"id":"B","text":"CO₂","explanation":"CO₂共提供5個C，不是10。"},{"id":"C","text":"阿斯匹靈","explanation":"阿斯匹靈提供9個C，全盤20個C的一半是10。"},{"id":"D","text":"三類都不是","explanation":"9+6+5=20，沒有一類提供10個C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B002","stem":"一個阿斯匹靈模型為C₉H₈O₄。某表「非H原子中O所占比例」被填成4/21。正確修正為何？","correct":"D","options":[{"id":"A","text":"4/17","explanation":"17是C與H之和，未對應非H總數。"},{"id":"B","text":"4/8","explanation":"8只有H數，並非題目母數。"},{"id":"C","text":"不必修正","explanation":"21是全部原子數，與限定的非H母數不同。"},{"id":"D","text":"4/13","explanation":"非H原子共9+4=13，其中O為4。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B003","stem":"學生核對HOCH₂CH₂OH，把兩端的H各算一次、兩個CH₂中的H各算兩次。又因式子有OH而額外再加一個H。最終應如何修正？","correct":"C","options":[{"id":"A","text":"維持7，因為OH另提供新H","explanation":"OH中的H已包含在兩端計數，不能再算一次。"},{"id":"B","text":"把兩端H都刪掉，留4","explanation":"兩端H本來都屬分子，不能刪除。"},{"id":"C","text":"把H總數由7改回6","explanation":"2+2+1+1=6，額外的1是重複計算已存在的端點H。"},{"id":"D","text":"把H總數由7改成8","explanation":"增至8會再加入未存在的H。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B004","stem":"乙醇縮寫式CH₃CH₂OH旁有一張圖明示「只畫非H原子，H全部省略」。圖上只有C—C—O。若整合這兩份資料，哪項判斷正確？","correct":"A","options":[{"id":"A","text":"三球圖只展示非H部分，完整分子仍含6H","explanation":"完整式給6H，圖例明確說氫未展示，可互相補足。"},{"id":"B","text":"圖上3球證明每分子總共3原子","explanation":"三球是非H計數，不是完整總數。"},{"id":"C","text":"該物質實際完全沒有H","explanation":"省略顯示不是否定原子存在。"},{"id":"D","text":"省略圖層必使物質變成新元素","explanation":"作圖範圍不改元素種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B005","stem":"教具盤恰有2個H₂O、1個CO₂、1個O₂。核對表列「模型4個、H4個、C1個、O5個」。只有一格錯，應改哪格？","correct":"A","options":[{"id":"A","text":"O改為6個","explanation":"O數為2×1+2+2=6。"},{"id":"B","text":"模型改為3個","explanation":"2+1+1=4個模型，原欄正確。"},{"id":"C","text":"H改為2個","explanation":"兩個水模型共有4個H。"},{"id":"D","text":"C改為2個","explanation":"一個CO₂提供1個C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B006","stem":"某完整分子模型已確認只含C、H、O，共21顆球，其中C9顆、O4顆。僅核對計數，哪個H數與資料相容？","correct":"B","options":[{"id":"A","text":"12","explanation":"9+12+4=25，不符合總數。"},{"id":"B","text":"8","explanation":"H=21−9−4=8，三類合計才是21。"},{"id":"C","text":"13","explanation":"13是C與O合計，不是H。"},{"id":"D","text":"17","explanation":"17是排除O後的總數，還包含C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B007","stem":"一張教具圖由1個水模型改為並列4個彼此獨立的水模型。各模型均完整，哪組變化正確？","correct":"D","options":[{"id":"A","text":"每分子原子總數增為4倍","explanation":"每個完整水分子仍有3原子。"},{"id":"B","text":"H:O由2:1變8:1","explanation":"H與O都同倍增加，比例不是8:1。"},{"id":"C","text":"元素種類數由2增為8","explanation":"增加相同模型不增加元素種類。"},{"id":"D","text":"原子總數增為4倍，H:O仍為2:1","explanation":"全圖3原子增為12原子，H:O為8:4=2:1。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B008","stem":"甲盤有1個阿斯匹靈C₉H₈O₄模型；乙盤有7個CO₂模型。兩盤都共21顆原子球。哪項比較正確？","correct":"A","options":[{"id":"A","text":"甲比乙多2個C球","explanation":"9−7=2，甲的C球多2個。"},{"id":"B","text":"乙比甲多2個C球","explanation":"差值方向顛倒。"},{"id":"C","text":"甲、乙分子數相同","explanation":"甲1個模型、乙7個模型。"},{"id":"D","text":"C球一樣多","explanation":"甲9C、乙7C，不相等。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B009","stem":"水模型清單聲稱列出所有不同原子，卻寫「H甲、H甲、O乙」；旁註同一識別碼始終代表同一顆原子。要確認是否真的有2H，應怎麼做？","correct":"A","options":[{"id":"A","text":"查清是否漏列另一H或重複登錄H甲","explanation":"兩列H甲可能重複，同一個水分子需要兩個不同H個體。"},{"id":"B","text":"把同一個H甲當成兩顆新元素","explanation":"同碼不代表新增原子，更不是新元素。"},{"id":"C","text":"刪除O乙就能成為水","explanation":"刪O會偏離H₂O。"},{"id":"D","text":"直接以三列當三個不同原子","explanation":"清單有同一識別碼重複，不能只數列數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B010","stem":"清單逐分子寫成「H₂O：H、O；CO₂：C、O；C₂H₆O：C、H、O」。有人把三列的元素種類數2+2+3=7當作全盤元素種類數。應如何修正？","correct":"C","options":[{"id":"A","text":"7正確，每出現一次都是新元素","explanation":"同一元素在不同分子出現仍是同一種類。"},{"id":"B","text":"全盤只有O，共1種","explanation":"O是共有元素，卻不是全部元素。"},{"id":"C","text":"全盤只有H、C、O，共3種","explanation":"應取各列種類的聯集，為H、C、O。"},{"id":"D","text":"全盤共7個原子","explanation":"列中種類計數不是原子總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 13_imagegen_page_06.png（正式第6頁，正文第4頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B011","stem":"一個CO₂模型的O占全部原子2/3；一個H₂O模型的O占全部原子1/3。若兩盤各放相同個數的完整模型，能確定什麼？","correct":"A","options":[{"id":"A","text":"CO₂盤O球為水盤兩倍","explanation":"每個CO₂有2O，每個水有1O，同模型數下O數比2:1。"},{"id":"B","text":"水盤完全沒有O","explanation":"水每模型含1O。"},{"id":"C","text":"CO₂盤原子總數為水盤兩倍","explanation":"兩者每模型都3原子，總數相等。"},{"id":"D","text":"兩盤O的質量占比也必為2:1","explanation":"原子個數比例不能直接當作質量占比。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B012","stem":"一個乙醇模型C₂H₆O有3種元素。學生說「H是三種之一，所以H占原子總數1/3」。正確H原子占比為何？","correct":"D","options":[{"id":"A","text":"1/6","explanation":"1/6不是6個H占9個總原子的比例。"},{"id":"B","text":"1/9","explanation":"1/9是O占全部原子數的比例，不是H的比例。"},{"id":"C","text":"1/3","explanation":"1/3是把種類等分，忽略各種原子數不同。"},{"id":"D","text":"2/3","explanation":"H有6個，總原子9個，6/9=2/3。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B013","stem":"乙醇為CH₃CH₂OH，乙二醇為HOCH₂CH₂OH。本題只依式子分組讀H：直接寫在O旁並與O結合的H，各有幾個？","correct":"C","options":[{"id":"A","text":"乙醇6、乙二醇6","explanation":"6與6是全部H數，未按連接位置分組。"},{"id":"B","text":"乙醇2、乙二醇1","explanation":"兩者端點數被對調。"},{"id":"C","text":"乙醇1、乙二醇2","explanation":"乙醇末OH有1H；乙二醇兩端各有1個與O相連的H。"},{"id":"D","text":"乙醇0、乙二醇0","explanation":"兩式都明示O旁的H。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B014","stem":"候選只有1個H₂O模型或1個CO₂模型。已知模型共有3顆球，再補哪項是可區分兩候選的資料？","correct":"D","options":[{"id":"A","text":"再次確認總球數為3","explanation":"兩候選都滿足3球，重複資料無法區分。"},{"id":"B","text":"確認圖卡有一個標題","explanation":"兩者都可有標題。"},{"id":"C","text":"確認模型印在同一張紙","explanation":"紙張位置不決定分子組成。"},{"id":"D","text":"確認是否存在H球","explanation":"水有H、CO₂無H，可直接區分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B015","stem":"紀錄寫「乙醇模型：2；C球：4；H球：12；O球：2」。表頭遺失，有人將「乙醇模型：2」讀成「每個模型2個原子」。哪項核對能指出正確單位？","correct":"B","options":[{"id":"A","text":"2是每個乙醇的H數","explanation":"每個乙醇6H，不是2。"},{"id":"B","text":"2是模型個數，後三欄是全體球數","explanation":"2份C₂H₆O恰有4C、12H、2O，資料一致。"},{"id":"C","text":"2是每個乙醇的全部球數","explanation":"每個乙醇共9原子，不是2。"},{"id":"D","text":"2是元素種類數","explanation":"乙醇有C、H、O三種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B016","stem":"教具紀錄「3 × [C₂H₆O]」明定為三個完整乙醇模型。學生只把C數乘3，記成「C6、H6、O1」。正確的全盤清單為？","correct":"C","options":[{"id":"A","text":"C2、H18、O1","explanation":"只放大H，未處理C與O。"},{"id":"B","text":"C6、H6、O1","explanation":"只放大C，漏算另兩份H與O。"},{"id":"C","text":"C6、H18、O3","explanation":"三份完整清單的每一項都乘3，得到6、18、3。"},{"id":"D","text":"C2、H6、O3","explanation":"只放大O，同樣不是完整複製。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；21_imagegen_page_14.png（正式第14頁，正文第12頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B017","stem":"乙醇縮寫結構式為CH₃CH₂OH。草圖保留CH₃、CH₂、O，卻完全漏掉最末H。若只補回遺漏，哪項改動正確？","correct":"C","options":[{"id":"A","text":"把CH₂改成CH₄並不接O端H","explanation":"增加兩個H且未保留指定連接，並非補回原式。"},{"id":"B","text":"在C旁加一顆O","explanation":"遺漏的是H，不是O。"},{"id":"C","text":"在O端補一個H","explanation":"末端OH中的H被漏畫，應於O端補回。"},{"id":"D","text":"把所有H數減1","explanation":"刪H會使錯誤更大。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B018","stem":"一張圖原有兩個獨立O₂模型，四顆O球都保留，但所有分組及連接標記被擦掉。只看剩下的四球，哪項仍可直接確認？","correct":"C","options":[{"id":"A","text":"必然變成一個O₄分子","explanation":"擦掉標記不是證明形成O₄。"},{"id":"B","text":"原圖必然是兩個O₂","explanation":"分組遺失後，四球本身不唯一指定原分組。"},{"id":"C","text":"總共表示4個O原子","explanation":"元素標記與球數都仍在，可確認4O。"},{"id":"D","text":"已完全沒有任何資訊","explanation":"原子種類與總數仍存在。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B019","stem":"一個乙醇模型的清點表列「非H小計3；C明細2；O明細1；H明細6」。其中小計已包含C與O。若要算原子總數，哪個算式正確？","correct":"A","options":[{"id":"A","text":"3+6=9","explanation":"非H小計加H剛好涵蓋全部原子一次。"},{"id":"B","text":"2+6=8","explanation":"漏掉1O。"},{"id":"C","text":"3+2+1=6","explanation":"未加入H且重算非H明細。"},{"id":"D","text":"3+2+1+6=12","explanation":"C與O被小計及明細各算一次。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B020","stem":"同一個未知模型拍兩張照片，正面看見3顆C球，背面看見2顆C球；沒有個體編號或可辨識對照。可以直接說共5個C嗎？","correct":"B","options":[{"id":"A","text":"不可以，因為C球不能拍照","explanation":"不能相加的原因是重複計數風險，不是不能拍模型。"},{"id":"B","text":"不可以，兩視圖可能包含同一顆C球","explanation":"需確定重疊的球身分才能相加。"},{"id":"C","text":"可以，同一原子每拍一次就增加一個","explanation":"拍照不增加所表示的原子。"},{"id":"D","text":"可以，照片中的球必不重複","explanation":"不同視角可能重見同一球。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B021","stem":"同一分子模型兩張視圖中，可見C球個體編號分別為{1,2,3,4}與{3,4,5,6}。說明所有C球至少出現在其中一張。模型共有幾個C？","correct":"B","options":[{"id":"A","text":"8","explanation":"直接4+4把3、4各重算一次。"},{"id":"B","text":"6","explanation":"不重複集合為1至6，共6顆。"},{"id":"C","text":"4","explanation":"4只計單一視圖，漏掉另一圖獨有球。"},{"id":"D","text":"10","explanation":"總和連重複算也只有8，不會10。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B022","stem":"原圖圖例紅O、黑C；模型含2紅球、1黑球。新圖只把兩個紅球塗成黑色，卻保留原圖例。按新圖實際資訊會被讀成什麼？","correct":"B","options":[{"id":"A","text":"2C、1O","explanation":"新圖沒有紅球，因此不是1O。"},{"id":"B","text":"3C、0O","explanation":"現在三球都是黑色，依圖例全讀成C。"},{"id":"C","text":"3O、0C","explanation":"黑色仍代表C，不能全讀O。"},{"id":"D","text":"仍是1C、2O","explanation":"未改圖例卻改球色，無法保留原計數語意。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B023","stem":"規格要求做一個CO₂模型，允許任意球色，但每球必須附正確元素字母。哪件成品符合「組成」規格？","correct":"A","options":[{"id":"A","text":"三顆都藍色，標C、O、O","explanation":"字母給出1C、2O，即使同色仍可讀出正確組成。"},{"id":"B","text":"四顆標C、O、O、H","explanation":"多一個H。"},{"id":"C","text":"三色各異，標C、H、O","explanation":"多H少O，不符合CO₂。"},{"id":"D","text":"兩顆紅色，各標O","explanation":"少一個C。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B024","stem":"兩份同模型紀錄使用完全相同的原子個體編號。編號7在甲表標C，在乙表標O；編號沒有更換或重用。只看這個衝突，哪項可確定？","correct":"A","options":[{"id":"A","text":"兩份元素標記不能同時正確，需核對原模型","explanation":"身分已固定，所以互斥標記構成真實矛盾；尚不能裁定哪份對。"},{"id":"B","text":"編號7同時就是C及O兩種元素","explanation":"同一個原子個體不能同時屬兩種元素。"},{"id":"C","text":"一定乙對甲錯","explanation":"題目也未給乙較可靠。"},{"id":"D","text":"一定甲對乙錯","explanation":"題目未給甲較可靠。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 13_imagegen_page_06.png（正式第6頁，正文第4頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B025","stem":"清單只有O₂、H₂O、CO₂三種分子。甲說「每種都含O」；乙說「這些分子的每個原子都是O」。哪組判斷正確？","correct":"B","options":[{"id":"A","text":"甲真、乙真","explanation":"水含H且CO₂含C，乙不成立。"},{"id":"B","text":"甲真、乙假","explanation":"三式都出現O，但並非只由O組成。"},{"id":"C","text":"甲假、乙假","explanation":"甲並非假。"},{"id":"D","text":"甲假、乙真","explanation":"甲確實成立，乙不成立。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B026","stem":"只讀連接示意：A與B直接相連，B與C直接相連，清單沒有其他連線。學生據此把A與C也列為「直接相連」。如何修正？","correct":"A","options":[{"id":"A","text":"A與C同屬一條連接路徑，但沒有直接連線","explanation":"經B連通與A—C直接連接是兩回事。"},{"id":"B","text":"三種標記一定表示同一原子","explanation":"A、B、C是三個教具位置標記。"},{"id":"C","text":"A與C直接相連，因為都接B","explanation":"共用鄰居不自動增加A—C連線。"},{"id":"D","text":"B與C其實不能相連","explanation":"B—C是題目明示的連線。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B027","stem":"水模型的兩個H編為H甲、H乙，兩者都只連O。若只把甲乙編號對調，元素標籤及連接保持，能據此說模型表示不同組成或連接結構嗎？","correct":"A","options":[{"id":"A","text":"不能，個體代號交換未改變元素與連接","explanation":"兩顆H仍各連同一O，組成與連接都不變。"},{"id":"B","text":"能，因為甲變成新元素","explanation":"甲乙不是元素種類。"},{"id":"C","text":"能，O因此多接一個H","explanation":"仍是兩個H，不增加第三個。"},{"id":"D","text":"不能，因為所有分子結構都相同","explanation":"結論限於此操作，不能推及所有分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 13_imagegen_page_06.png（正式第6頁，正文第4頁）；14_imagegen_page_07.png（正式第7頁，正文第5頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B028","stem":"教具以C甲、C乙、O表示乙醇的非H原子骨架；來源縮寫式CH₃CH₂OH要求C甲—C乙—O。清單只留C甲—C乙，沒有其他線。要補回原骨架應增加哪條？","correct":"D","options":[{"id":"A","text":"C甲—C甲","explanation":"自接不是缺少的骨架連線。"},{"id":"B","text":"O—O","explanation":"圖中只有一個O，且來源沒有O—O。"},{"id":"C","text":"C甲—O，且不連C乙—O","explanation":"這會把O接到另一個指定碳，未按原標號骨架補回。"},{"id":"D","text":"C乙—O","explanation":"來源指定末端O接C乙，故補C乙—O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B029","stem":"兩個假想四球模型元素標籤均為A、B、C、D。甲連A—B、B—C、C—D；乙連A—B、B—D、D—C。若查「B是否直接連C」，結果是？","correct":"D","options":[{"id":"A","text":"兩者都不是","explanation":"甲清單明列B—C。"},{"id":"B","text":"兩者都是","explanation":"乙清單沒有B—C。"},{"id":"C","text":"只有乙是","explanation":"方向與清單相反。"},{"id":"D","text":"只有甲是","explanation":"甲有B—C；乙的B連A、D。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B030","stem":"表格約定每個原子的「全部直接鄰居」都列完整，而且連接無方向。A列B為鄰居，B卻明寫「無任何鄰居」。兩列能同時正確嗎？","correct":"D","options":[{"id":"A","text":"能，A連B不需要B連A","explanation":"無方向連接的兩端關係應一致。"},{"id":"B","text":"不能，因為所有原子都必須連三個鄰居","explanation":"沒有所有原子都三鄰居的規則。"},{"id":"C","text":"能，只要字體一樣","explanation":"字體不能解決內容矛盾。"},{"id":"D","text":"不能，兩端對同一連接的紀錄互相矛盾","explanation":"A有B鄰居，B也應有A；完整表不能一邊說有一邊說無。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B031","stem":"假想教具原為A—B—C—D，沒有其他線。只擦掉B—C且不改其餘球與線。若以仍有路徑相連者為同一組，結果是？","correct":"C","options":[{"id":"A","text":"仍只有一組ABCD","explanation":"唯一跨AB與CD的連線已刪。"},{"id":"B","text":"分成A及BCD兩組","explanation":"A仍連B，且B已不連C。"},{"id":"C","text":"分成AB及CD兩組","explanation":"剩AB與CD各自連通，彼此沒有路徑。"},{"id":"D","text":"分成四個單球組","explanation":"AB及CD各有一條線，並非全孤立。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B032","stem":"一個完整假想模型原有A—B與B—C。編輯額外畫A—C，沒有新增或刪除任何球。這項錯誤直接改變什麼？","correct":"C","options":[{"id":"A","text":"元素種類與原子總數都改變","explanation":"所有球保留，種類及總數未改。"},{"id":"B","text":"A球變成D球","explanation":"題目沒有改標元素。"},{"id":"C","text":"連接關係改變，但球的組成清單未變","explanation":"新增A—C改變了結構資訊，沒有改球清單。"},{"id":"D","text":"只改變紙張顏色","explanation":"這是連接資訊改動，不是紙色。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B033","stem":"為表示兩個分子彼此靠近，動畫師把兩組完整水模型移近，且未新增跨組連線；第二版卻補上跨組原子連線並宣稱同一效果。兩版是否提供相同資訊？","correct":"D","options":[{"id":"A","text":"否，第一版一定改變了水的分子式","explanation":"第一版只移動完整模型，沒有改每分子的組成。"},{"id":"B","text":"是，任何線都不帶資訊","explanation":"圖例賦予線明確意義。"},{"id":"C","text":"是，位置近就等於直接成鍵","explanation":"距離近不自動代表直接連接。"},{"id":"D","text":"否，第二版額外宣稱了原子間連接","explanation":"依題目約定連線表示原子連接，第二版增加了新主張。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B034","stem":"只讀假想教具清單：A—B、B—C、A—D、D—E、E—C，沒有其他線。每沿一條線算一步，不量真實距離。從A沿線走到C最少需幾步？","correct":"A","options":[{"id":"A","text":"2步","explanation":"A—B—C只需2步；另一條A—D—E—C需3步，且沒有A—C直接線，所以最少2步。"},{"id":"B","text":"3步","explanation":"3步是另一條較長路徑，不是最少。"},{"id":"C","text":"5步","explanation":"5是全圖連線總數，走到C不必用過每一條。"},{"id":"D","text":"1步","explanation":"沒有直接的A—C連線，不能1步到達。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B035","stem":"兩份匿名模型紀錄都寫A₂B₂，並說A、B是教具種類代號。只有這個式子，能直接知道B是否彼此相連嗎？","correct":"B","options":[{"id":"A","text":"不能，因為兩種元素不能組成模型","explanation":"題目允許此假想示意，問題在資訊不足。"},{"id":"B","text":"不能，下標只給個數，未列相鄰關係","explanation":"需要結構表示才能確定B間的連接。"},{"id":"C","text":"能，B₂就表示兩B必直接連","explanation":"下標2不等於指定B—B線。"},{"id":"D","text":"能，式子排列永遠是全部連接次序","explanation":"分子式不把所有連接編碼為文字順序。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；21_imagegen_page_14.png（正式第14頁，正文第12頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B036","stem":"一份假想模型表格列「中心球B；直接鄰居A、C；A與C不相連」。哪個連接清單完全符合？","correct":"C","options":[{"id":"A","text":"A—B、B—C、A—C","explanation":"額外A—C違反不相連條件。"},{"id":"B","text":"A—B、A—C","explanation":"B未接C，且多A—C。"},{"id":"C","text":"A—B、B—C","explanation":"B分別接A、C，且無A—C，完全符合。"},{"id":"D","text":"A—C、C—B","explanation":"多A—C且缺A—B。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B037","stem":"一個模型含兩顆C。紀錄只說「O接一顆C」，但題目要追蹤製作者指定的C甲是否接O。未提供甲乙對照時，哪個處理正確？","correct":"B","options":[{"id":"A","text":"直接認定接C甲","explanation":"沒有證據指向甲。"},{"id":"B","text":"補足個體對照再回答該追蹤問題","explanation":"要追蹤特定球，需有個體標記映射。"},{"id":"C","text":"直接認定接C乙","explanation":"也沒有證據指向乙。"},{"id":"D","text":"把C甲改名為O","explanation":"改元素名稱不解決來源識別問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B038","stem":"兩份乙醇資料分別為「分子式C₂H₆O」及「骨架C—C—O」。把分子式中的種類計數改列O₁、H₆、C₂，同時把骨架改為C—O—C。哪項評語正確？","correct":"C","options":[{"id":"A","text":"兩項都只是版面調整","explanation":"骨架的相鄰關係已不同。"},{"id":"B","text":"骨架改列不可能影響結構資訊","explanation":"C—C與C—O—C的連接資訊不同。"},{"id":"C","text":"計數改列未改組成；骨架改列改了連接","explanation":"計數表順序不表連接，骨架鏈順序則表連接。"},{"id":"D","text":"兩項都必定改變原子總數","explanation":"兩項都保留2C、1O的非H計數，未必改總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；21_imagegen_page_14.png（正式第14頁，正文第12頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B039","stem":"讀CH₃CH₂OH時，學生把OH當成一種新的元素，因而說全式有C、H、OH三種元素。哪項改正完整？","correct":"D","options":[{"id":"A","text":"OH是氧的另一種個體編號","explanation":"OH不是單一氧原子的編號。"},{"id":"B","text":"全式只有C與H","explanation":"式子明含O。"},{"id":"C","text":"每出現一個H字母都算一種元素","explanation":"同一符號重現不增加元素種類。"},{"id":"D","text":"OH在此包含O與H，元素種類是C、H、O","explanation":"元素符號O與H分別表示氧與氫，OH不是新元素符號。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B040","stem":"乙醇圖卡有三份資料：原始核對清單2C、6H、1O；抄寫表2C、6H、2O；標題C₂H₆O。已確認原始清單可靠且圖卡確為乙醇，應修哪處？","correct":"C","options":[{"id":"A","text":"標題改C₂H₆O₂","explanation":"把標題改成乙二醇組成會違背已知目標。"},{"id":"B","text":"三份全部刪除","explanation":"已有足夠證據定位錯欄，無須全部刪除。"},{"id":"C","text":"抄寫表O改1","explanation":"抄寫表獨有O數衝突，改為1與兩份可靠資訊一致。"},{"id":"D","text":"原始清單O改2","explanation":"可靠來源與乙醇相符，不應改錯。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B041","stem":"同條件的假想資料只列甲、乙兩材料：甲每分子1個O且性質值4；乙每分子2個O且性質值7。哪句完整保留資料範圍，不增添普遍定律？","correct":"C","options":[{"id":"A","text":"兩份資料證明只由O數控制性質","explanation":"其他組成及結構影響未被隔離。"},{"id":"B","text":"任何分子每加1O，性質值都增3","explanation":"未測其他物質，不能建立普遍加成定律。"},{"id":"C","text":"本表乙的該性質值比甲高3","explanation":"7−4=3，且結論明確只限本表的這項性質。"},{"id":"D","text":"乙的每一項性質都比甲高3","explanation":"資料只列一項性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B042","stem":"甲分子有2種元素、乙有3種元素。研究者因此說乙的結構必定比甲複雜，且必有更多連線。只依這兩個種類數應如何判斷？","correct":"A","options":[{"id":"A","text":"不能確定，還缺每種原子個數及連接資料","explanation":"原子數及實際連接未知，無法作此比較。"},{"id":"B","text":"可以確定，種類數就是連線數","explanation":"種類數不是結構連線數。"},{"id":"C","text":"不能確定，因為元素種類數沒有任何意義","explanation":"種類數有組成意義，只是資訊不足。"},{"id":"D","text":"可以確定，3一定大於2所以所有量都大","explanation":"一項數目較大不代表其他物理或結構量都較大。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B043","stem":"模型照片因前後遮擋看不清某條線，但隨附完整連接清單明列A—B。若兩者都來自同一已核對模型，最合理的讀法是？","correct":"B","options":[{"id":"A","text":"看不見就把A—B刪除","explanation":"視角看不見不等於連接不存在。"},{"id":"B","text":"利用完整清單補足照片的遮擋限制","explanation":"清單正好提供遮擋部分的結構資訊。"},{"id":"C","text":"認定A與B是同一個原子","explanation":"有連接的是兩個端點，不是同一原子。"},{"id":"D","text":"把照片當作比清單多一次獨立實驗","explanation":"兩者是同模型不同表示，不自動是獨立實驗。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B044","stem":"假想模型原清單A₂B₂，編輯用一顆A球替換一顆B球，總球數不變。新版清單應是？","correct":"B","options":[{"id":"A","text":"A₁B₃","explanation":"這表示用B替換A，方向相反。"},{"id":"B","text":"A₃B₁","explanation":"A增加1為3；B減1為1，總數仍4。"},{"id":"C","text":"A₂B₃","explanation":"新增B而不刪球會變5球，與題意不符。"},{"id":"D","text":"A₂B₂","explanation":"替換已改變兩類數目，不能維持原清單。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B045","stem":"某假想模型預測「在指定條件下，甲的性質值大於乙」。同條件可靠量測得到甲5、乙8。最適當的結論是？","correct":"C","options":[{"id":"A","text":"因此所有原子與分子觀點都失效","explanation":"單個模型預測不符不能否定整套微觀研究觀點。"},{"id":"B","text":"本次結果符合原預測","explanation":"5小於8，並非預測的大於。"},{"id":"C","text":"本次結果與預測相反，應檢查解釋或適用條件","explanation":"針對特定預測的不符應回頭修正或檢查，不改真實數據。"},{"id":"D","text":"把8改成3以保留模型","explanation":"不能改量測來配合預測。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B046","stem":"課本以乙醇與乙二醇說明小差異可能影響性質。某人只記住這一對，就寫「任意分子多一個O都會變成乙二醇」。問題是？","correct":"B","options":[{"id":"A","text":"把性質誤認為可以改變","explanation":"教材確實說性質可能因改變而變。"},{"id":"B","text":"把特定範例誤擴成所有分子的規則","explanation":"乙二醇有特定組成與結構，不能由任意分子加O一概得到。"},{"id":"C","text":"把O誤認為元素","explanation":"O確為元素符號。"},{"id":"D","text":"把兩種分子誤認為可比較","explanation":"兩者可以比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 17_imagegen_page_10.png（正式第10頁，正文第8頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B047","stem":"假想模型三條線分別為A—B、A—C、A—D。有人為省字把資料改成「A有三個鄰居」，卻把B、C、D身分刪掉。新版仍保留什麼、遺失什麼？","correct":"D","options":[{"id":"A","text":"保留所有連接對象，未遺失資訊","explanation":"只有數量不能還原哪些球相連。"},{"id":"B","text":"遺失全部原子數量概念","explanation":"至少還保留三個鄰居的計數。"},{"id":"C","text":"保留元素種類必為三種的證據","explanation":"鄰居個數不是元素種類數。"},{"id":"D","text":"保留鄰居數，遺失具體鄰居身分","explanation":"三個鄰居的數量仍在，但具體端點身分未記錄。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B048","stem":"資料摘記：阿斯匹靈在1897年首次合成，目標是改良一種取自柳樹皮的天然產物。哪個改寫最忠實？","correct":"C","options":[{"id":"A","text":"天然產物直到1897年才首次被用來緩解疼痛","explanation":"原文明示天然產物長期曾用於緩解疼痛，未把首次使用定在1897。"},{"id":"B","text":"1897年直接從柳樹皮取出的就是阿斯匹靈，沒有合成","explanation":"原文區分合成的阿斯匹靈與被用作改良參照的天然產物。"},{"id":"C","text":"阿斯匹靈的合成與對既有天然產物的改良目標相關","explanation":"此句保留了來源與合成目標的關係。"},{"id":"D","text":"阿斯匹靈與天然產物的所有組成結構都必然完全一樣","explanation":"改良目標不保證組成或結構全部不變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B049","stem":"已確定兩種物質的組成不同，但在一次指定條件下觀察到同一顏色。這是否推翻「組成與結構可影響性質」？","correct":"A","options":[{"id":"A","text":"否，某一性質相同不排除其他性質不同","explanation":"可影響性質不代表每項性質都必須不同。"},{"id":"B","text":"是，顏色相同證明組成相同","explanation":"相同顏色不是組成相同的充分證據。"},{"id":"C","text":"是，所有不同組成都必須顏色不同","explanation":"教材沒有要求每種組成都對應不同顏色。"},{"id":"D","text":"否，因為顏色從來不是性質","explanation":"顏色是本節明列的性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B050","stem":"兩份資料分別說樣品在條件甲「可溶」及在條件乙「不易溶」，條件甲乙並不相同。只依這兩句可否斷言資料自相矛盾？","correct":"D","options":[{"id":"A","text":"可以，性質描述不需要條件","explanation":"條件可能影響可觀察表現，不能省略。"},{"id":"B","text":"不可以，因為溶解性不能量測","explanation":"是否能溶於水是本節性質例子。"},{"id":"C","text":"可以，兩句必表示不同元素","explanation":"觀察差異不能直接判定元素種類改變。"},{"id":"D","text":"不可以，應先對齊條件再比較","explanation":"對齊條件是解讀性質資料的基本需要。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B051","stem":"要研究連接結構差異是否可能對應性質差異，下列哪組比較最能把「組成」保持一致？所有性質均在相同條件量測。","correct":"A","options":[{"id":"A","text":"兩物質元素種類與每分子數目相同，連接已知不同","explanation":"固定組成、比較不同連接，才能把注意力放在結構差異。"},{"id":"B","text":"一份資料用紅字，另一份用藍字","explanation":"字色不是物質結構。"},{"id":"C","text":"只比較兩個包裝名稱","explanation":"名稱不足以固定組成或確認連接。"},{"id":"D","text":"兩物質原子數、種類、連接都未知","explanation":"缺少組成及結構資料，無法完成此比較。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B052","stem":"甲乙兩物質的原子數目與連接方式都不同，某性質測值也不同。資料是否足以把差異「全部只歸因於連接方式」？","correct":"B","options":[{"id":"A","text":"不足，因為性質與粒子完全無關","explanation":"不足是歸因限制，不是否定粒子與性質的關聯。"},{"id":"B","text":"不足，組成與結構同時不同，無法單獨分離其影響","explanation":"兩種因素一起變，這組比較未隔離各自作用。"},{"id":"C","text":"足夠，原子數無關性質","explanation":"本節也強調組成對性質的關聯。"},{"id":"D","text":"足夠，任一性質只受一種因素影響","explanation":"來源沒有此單因素保證。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B053","stem":"教材給「阿斯匹靈1897年首次合成」及「相關柳樹皮天然產物早已長期用於緩解疼痛」。編年表的哪格能由這兩句直接填入確切年份？","correct":"C","options":[{"id":"A","text":"天然產物首次使用：1896","explanation":"長期使用不是首次使用年份1896的證據。"},{"id":"B","text":"所有止痛物質首次出現：1897","explanation":"來源也未談所有止痛物質的起源。"},{"id":"C","text":"阿斯匹靈首次合成：1897","explanation":"此事件及年份由來源明示。"},{"id":"D","text":"天然產物首次被發現：1897","explanation":"來源未給天然產物的發現年。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B054","stem":"假說寫「含有相同元素種類的兩物質，其每分子原子數也一定相同」。拿C₂H₆O與C₂H₆O₂檢查，結果是？","correct":"A","options":[{"id":"A","text":"反駁，種類相同但O數不同","explanation":"乙醇1O、乙二醇2O，構成直接反例。"},{"id":"B","text":"支持，名稱都含乙","explanation":"名稱不是假說所比較的量。"},{"id":"C","text":"無法檢查，必須先知道毒性","explanation":"這個假說只涉及組成計數，不需要毒性數據。"},{"id":"D","text":"支持，兩式都有三種元素","explanation":"種類相同正符合前提，但原子數並不全相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B055","stem":"同條件假想資料以性質P、Q評估材料，目標明定「P越大越好，Q越小越好」。原材料P=4、Q=5；改造後P=6、Q=7。哪份評語忠實？","correct":"A","options":[{"id":"A","text":"P向目標改善，Q則背離目標","explanation":"P由4到6朝較大目標；Q由5到7卻遠離較小目標，不能把增加一律當改善。"},{"id":"B","text":"兩項都改善，因數字都增加","explanation":"對Q而言增加不是改善。"},{"id":"C","text":"兩項都變差，因數字都增加","explanation":"P增加符合已定目標，不是變差。"},{"id":"D","text":"P變差，Q改善","explanation":"把兩項目標方向顛倒。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 18_imagegen_page_11.png（正式第11頁，正文第9頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B056","stem":"候選是O₂、H₂O、CO₂。兩項可靠觀察為「有C」及「共3個原子」。甲先按有C篩選再按3原子篩選；乙反過來做，且都保留全部符合者。最後結果如何？","correct":"C","options":[{"id":"A","text":"先後順序會改變分子的組成","explanation":"篩選順序是資料處理，不是分子改造。"},{"id":"B","text":"甲得CO₂，乙得H₂O","explanation":"乙第二步仍會排除不含C的水。"},{"id":"C","text":"兩人都只剩CO₂","explanation":"兩項條件必須同時符合，先後不改最終交集CO₂。"},{"id":"D","text":"甲得O₂，乙得CO₂","explanation":"O₂不含C且只有2原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B057","stem":"某未知樣品的元素種類已由可靠資料確定，原子數與連接仍未知。報告哪種寫法符合現有證據？","correct":"D","options":[{"id":"A","text":"已知全部原子的排列，只缺名稱","explanation":"排列未被確定。"},{"id":"B","text":"已完整知道組成與結構","explanation":"少了數目及連接，不能說完整。"},{"id":"C","text":"完全不知道任何化學資訊","explanation":"元素種類是已取得的有效資訊。"},{"id":"D","text":"已知元素種類；數目與連接尚待確認","explanation":"清楚分開已知與未知維度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B058","stem":"展板左列「樣品流動慢」，右畫一個分子模型，中間只寫「所以」。若要讓兩者成為可評估的化學解釋，最需要補什麼？","correct":"C","options":[{"id":"A","text":"多印幾次物質名稱","explanation":"重複名稱不建立解釋。"},{"id":"B","text":"以紅色取代所有黑色","explanation":"換色只是呈現，不能補因果資料。"},{"id":"C","text":"說明所主張的粒子特徵如何關聯觀察，並提供支持","explanation":"需有明確機制或關聯主張及證據，單並列尚不足。"},{"id":"D","text":"模型畫得更大","explanation":"尺寸不補因果論證。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）；23_imagegen_page_16.png（正式第16頁，正文第14頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B059","stem":"塑膠教具中每顆C球2 g、H球1 g、O球3 g，連接件質量忽略。組一個C₂H₆O模型的教具總質量為何？這是否就是一個真乙醇分子的質量？","correct":"D","options":[{"id":"A","text":"13 g；也是真分子質量","explanation":"算對教具質量，卻把符號載體當所指物。"},{"id":"B","text":"9 g；也是真分子質量","explanation":"9是球數，並非依已給重量加總。"},{"id":"C","text":"6 g；只是教具質量","explanation":"6只取H球質量，漏C與O。"},{"id":"D","text":"13 g；只是教具質量","explanation":"2×2+6×1+1×3=13 g；塑膠球質量不是真原子質量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）；17_imagegen_page_10.png（正式第10頁，正文第8頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B060","stem":"教學模型明示「只畫一個代表性分子，未按實際樣品粒子數作圖」。學生數到一個，就說瓶中只有一個分子。錯誤在哪裡？","correct":"A","options":[{"id":"A","text":"忽略模型的代表性與未按量作圖的約定","explanation":"此圖只代表分子類型，不能直接給瓶內總量。"},{"id":"B","text":"把所有元素符號混成同一個","explanation":"錯誤核心是代表單位與總量，不是元素混淆。"},{"id":"C","text":"忽略式子裡一定有溫度","explanation":"題目沒有此溫度資訊要求。"},{"id":"D","text":"把一個模型算得太少，應一律乘100","explanation":"沒有固定倍率可將示意數換成實際數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B061","stem":"同一種液體分別裝入方瓶與圓瓶。某人用容器外輪廓畫成兩種分子形狀，未提供其他粒子資料。哪項評語正確？","correct":"D","options":[{"id":"A","text":"方瓶證明分子是方形","explanation":"巨觀容器輪廓不指定微觀形狀。"},{"id":"B","text":"圓瓶證明分子只有一種元素","explanation":"瓶子形狀無法決定元素種類數。"},{"id":"C","text":"換容器必然產生新分子式","explanation":"換容器本身不是改變分子組成的證據。"},{"id":"D","text":"容器外形不能作為單一分子形狀的證據","explanation":"分子形狀需有原子排列資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B062","stem":"秤重結果顯示為「5 g」，同一頁也印「H₂O」。有人因兩者都是符號，就說它們提供同一種化學資訊。怎樣修正？","correct":"B","options":[{"id":"A","text":"兩者都只能當作圖案","explanation":"兩者均有明確可讀意義。"},{"id":"B","text":"5 g是樣品的量測質量，H₂O是分子組成表示","explanation":"表示形式都可用符號，但承載的資訊不同。"},{"id":"C","text":"兩者都完整表示原子排列","explanation":"質量及分子式都未完整提供排列。"},{"id":"D","text":"兩者都表示五個水分子","explanation":"5 g是質量而非分子個數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B063","stem":"學生用文字寫「每個水分子含2H、1O」，並把它列在「我用肉眼從水滴逐顆數到的結果」。資訊內容與證據欄應如何處理？","correct":"A","options":[{"id":"A","text":"組成敘述可保留，但不能聲稱肉眼逐顆原子計數","explanation":"組成正確與觀察方式是否真實是兩個獨立問題。"},{"id":"B","text":"只因寫在觀察欄，就視為已直接觀察","explanation":"欄位標題不能創造觀察事實。"},{"id":"C","text":"把2改成任意數可消除問題","explanation":"改數字不修復虛假的觀察方式。"},{"id":"D","text":"全部改成水不含H","explanation":"不能為修正證據來源而改錯組成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B064","stem":"比較乙醇C₂H₆O與水H₂O，只問「乙醇有、而水沒有的元素種類」。學生把H與O也列入，應如何修正？","correct":"B","options":[{"id":"A","text":"只保留O","explanation":"O也為兩者共有。"},{"id":"B","text":"只保留C","explanation":"乙醇的{C,H,O}減去水的{H,O}，只剩C。"},{"id":"C","text":"只保留H","explanation":"H是兩者共有，非乙醇獨有。"},{"id":"D","text":"仍保留C、H、O全部","explanation":"這是乙醇全集，未扣掉兩者共有種類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B065","stem":"三個完整模型分別是O₂、C₂H₆O與C₉H₈O₄。甲只按元素種類數排序，乙按原子總數排序。哪項描述正確？","correct":"A","options":[{"id":"A","text":"甲會把後兩者並列，乙不會","explanation":"種類數為1、3、3；總數為2、9、21，後兩者只在種類數並列。"},{"id":"B","text":"兩人都把三者並列","explanation":"兩個排序都有可區分的數量。"},{"id":"C","text":"乙把乙醇排成最多原子","explanation":"阿斯匹靈21原子，比乙醇9原子多。"},{"id":"D","text":"甲把O₂排成最多種類","explanation":"O₂僅一種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B066","stem":"同一份水以杯中樣品、分子模型、H₂O三種方式呈現。學生登記「發現三種不同物質」。應如何修正？","correct":"C","options":[{"id":"A","text":"模型有三球，所以恰好三種物質","explanation":"三球是原子數且只有兩種元素，不是三種物質。"},{"id":"B","text":"H₂O是第四種物質","explanation":"H₂O已在列出的三種表達中，並非新增物質。"},{"id":"C","text":"三種表達對應同一目標物質，不是據此發現三種物質","explanation":"表達層次的數目不等於物質種類數。"},{"id":"D","text":"只要表達不同，實物就必不同","explanation":"同一對象可有多種表示。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B067","stem":"甲同學量測一份樣品得到某性質值；乙把甲的值抄到另一頁並換成圖表。老師問這是否提供第二次獨立量測。應答？","correct":"A","options":[{"id":"A","text":"否，只是同一筆量測的再表示","explanation":"量測來源仍只有甲那一次。"},{"id":"B","text":"是，文字與圖表算兩次","explanation":"不同格式不表示多一次量測。"},{"id":"C","text":"是，換圖會產生新樣品","explanation":"格式改動不創造實物。"},{"id":"D","text":"否，因為圖表不能表示數據","explanation":"圖表可以表示數據，問題在來源是否獨立。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B068","stem":"練習單有完整分子式與模型，沒有樣品或性質資料。哪項要求尚不能完成？","correct":"B","options":[{"id":"A","text":"指出式子是一種表示法","explanation":"這是本節已建立的符號角色。"},{"id":"B","text":"報告該實際樣品的實測顏色","explanation":"未有樣品與觀察，不能宣稱實測顏色。"},{"id":"C","text":"讀出式子中的元素種類","explanation":"式子已足以提供元素種類。"},{"id":"D","text":"核對模型球數是否符合式子","explanation":"有完整模型與式子，可核對計數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B069","stem":"只作教具：甲盒有4H、0O，乙盒有0H、2O，不能跨盒取球。有人因兩盒合計可作2個H₂O模型，就說每盒都能作1個。哪項正確？","correct":"B","options":[{"id":"A","text":"每盒都能作1個","explanation":"全體庫存足不代表各盒都有所需組合。"},{"id":"B","text":"兩盒各自都缺一種必要球，均不能作完整水模型","explanation":"甲缺O、乙缺H；不準交換時兩盒皆不能完成。"},{"id":"C","text":"甲盒能作2個，乙盒不能","explanation":"甲沒有O，不能作完整水模型。"},{"id":"D","text":"乙盒能作2個，甲盒不能","explanation":"乙沒有H，也不能完成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 15_imagegen_page_08.png（正式第8頁，正文第6頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B070","stem":"教具盤只放完整水與乙醇模型。已確認有2個乙醇，水模型數尚未點清，可能為0或更多。全盤C、H計數至少可確定哪些資訊？","correct":"C","options":[{"id":"A","text":"C至少4但無上限，H恰12","explanation":"水不加C卻會加H，確定與不確定的方向相反。"},{"id":"B","text":"C恰2，H恰6","explanation":"只算了一個乙醇，與已知兩個不符。"},{"id":"C","text":"C恰4，H至少12","explanation":"水不含C，故C固定4；水可能另加H，所以H至少12。"},{"id":"D","text":"C及H都無法知道任何限制","explanation":"已知兩個乙醇足以提供確定值及下界。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B071","stem":"兩份同種材料在同一條件下，各自紀錄為3 g/2 mL與9 g/6 mL。只把原有兩份的質量及體積數字各自加總，不涉及混合操作。總質量÷總體積為何？","correct":"D","options":[{"id":"A","text":"3 g/mL","explanation":"3是把兩份相同密度相加，不是總質量除總體積。"},{"id":"B","text":"12 g/mL","explanation":"12只是總質量，未除以體積。"},{"id":"C","text":"6 g/mL","explanation":"6是第二份體積，不是質量體積比。"},{"id":"D","text":"1.5 g/mL","explanation":"(3+9)/(2+6)=12/8=1.5。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B072","stem":"兩份紀錄為1 g、1 mL及6 g、2 mL。這裡只彙整已記錄的數字，沒有混合材料。甲算兩份密度的算術平均，乙算總質量÷總體積，結果為何？","correct":"B","options":[{"id":"A","text":"甲7，乙3，單位均g/mL","explanation":"7與3只是總質量、總體積，不是各自的密度。"},{"id":"B","text":"甲2，乙7/3，單位均g/mL","explanation":"甲=(1+3)/2=2；乙=(1+6)/(1+2)=7/3，不同體積權重使兩者不同。"},{"id":"C","text":"甲與乙都2 g/mL","explanation":"乙總量比為7/3，不是2。"},{"id":"D","text":"甲與乙都7/3 g/mL","explanation":"甲等權平均為2。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B073","stem":"一件塑膠分子模型本體量得質量12 g、實際材料體積6 mL。學生算得2 g/mL並標成「此塑膠教具材料的密度」。這個結果與「被表示的化學物質密度」有何關係？","correct":"A","options":[{"id":"A","text":"2 g/mL可屬教具材料，但不能自動當作被表示物質的密度","explanation":"質體比來自塑膠本體；符號與所指物沒有密度相等的保證。"},{"id":"B","text":"12/6是在數原子，不是算密度","explanation":"已給g與mL，算的是本體密度。"},{"id":"C","text":"教具只要表示分子，就不再有質量","explanation":"實體塑膠仍有質量。"},{"id":"D","text":"兩者一定都是2 g/mL","explanation":"教具材料與所指物質可能不同，不能轉移量值。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）；19_imagegen_page_12.png（正式第12頁，正文第10頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B074","stem":"同條件下某材料密度已知為2 g/mL。候選紀錄甲4 g、2 mL；乙6 g、3 mL；丙4 g、3 mL。哪些在數值上與該密度相容？","correct":"A","options":[{"id":"A","text":"甲與乙","explanation":"甲乙都符合2；丙4/3不等於2。"},{"id":"B","text":"只有甲","explanation":"乙的6/3同樣是2。"},{"id":"C","text":"只有乙","explanation":"甲的4/2同樣是2。"},{"id":"D","text":"三者全相容","explanation":"丙不符合目標比值。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B075","stem":"甲資料只寫「密度1」，乙寫「密度1 g/mL」，甲的單位完全不明。哪個比較最合理？","correct":"C","options":[{"id":"A","text":"甲一定是1 mL/g","explanation":"不能替甲猜單位，且mL/g是密度倒數單位。"},{"id":"B","text":"兩者數字相同，所以密度必相同","explanation":"數值需連同單位才形成可比較量值。"},{"id":"C","text":"先補甲的單位，再作量值比較","explanation":"缺單位的資料不能直接和完整量值等同。"},{"id":"D","text":"乙一定錯誤，密度不該有單位","explanation":"密度是質量體積比，具有對應單位。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 11_imagegen_page_04.png（正式第4頁，正文第2頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B076","stem":"候選限定為O₂、H₂O、CO₂、C₂H₆O。未知分子的紀錄是「不含H，且每分子3個原子」。哪個候選同時符合？","correct":"A","options":[{"id":"A","text":"CO₂","explanation":"無H且1C+2O=3原子，兩項都符合。"},{"id":"B","text":"H₂O","explanation":"有3原子但含H。"},{"id":"C","text":"O₂","explanation":"無H但僅2原子，不符3原子。"},{"id":"D","text":"C₂H₆O","explanation":"含H且每分子9原子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B077","stem":"某卡只記「每分子有2個O」，候選為O₂、CO₂、C₂H₆O₂、C₂H₆O。有人直接填CO₂。哪項判斷正確？","correct":"A","options":[{"id":"A","text":"前三個候選都符合O數，不能唯一選CO₂","explanation":"需其他元素或數目資料才能進一步區分。"},{"id":"B","text":"只有乙二醇符合","explanation":"O₂與CO₂同樣符合。"},{"id":"C","text":"四個都符合","explanation":"乙醇只有1O，不符合。"},{"id":"D","text":"資料唯一支持CO₂","explanation":"O₂與乙二醇也各含2O。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B078","stem":"兩個匿名模型只可能分別是H₂O或CO₂，各一個。甲已確認含H；乙尚未逐球讀。只依這些條件，乙的C數為何？","correct":"C","options":[{"id":"A","text":"2","explanation":"CO₂中C沒有下標2。"},{"id":"B","text":"0","explanation":"甲因此是水，乙必須是CO₂，含C。"},{"id":"C","text":"1","explanation":"各一個且甲為水，乙為CO₂，所以每分子1C。"},{"id":"D","text":"無法確定任何事","explanation":"候選各一個的限制使乙可確定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B079","stem":"某完整模型清單保證只含C、H、O，但記錄「總原子8；C2；H7；O尚未填」。若前面三個數字均被宣稱正確，能否填一個非負整數O使資料相容？","correct":"B","options":[{"id":"A","text":"能，填−1個O","explanation":"完整分子不能含負數原子，−1不合法。"},{"id":"B","text":"不能，C與H已合計9而超過總數8","explanation":"即使O為0也已有9原子，至少一個已填數字錯。"},{"id":"C","text":"能，填0","explanation":"2+7+0=9，仍超過8。"},{"id":"D","text":"能，填1","explanation":"2+7+1=10，仍不合8。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B080","stem":"兩張假想模型卡各恰含2種元素，全部只使用H、C、O。兩卡合看恰好涵蓋這3種，沒有第四種。甲乙共同含有幾種元素？只問種類，不問原子數。","correct":"B","options":[{"id":"A","text":"0種","explanation":"若完全不共有，合計需4種，違反只有3種。"},{"id":"B","text":"1種","explanation":"兩卡種類數相加為4次列入，而合計只3種，表示恰有1種被兩卡共同列入。"},{"id":"C","text":"3種","explanation":"各卡本身僅2種，不可能共有3種。"},{"id":"D","text":"2種","explanation":"若共有2種，兩卡種類集合相同，合計只2種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 12_imagegen_page_05.png（正式第5頁，正文第3頁）；14_imagegen_page_07.png（正式第7頁，正文第5頁）；16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B081","stem":"一份完整模型清單列C2、H6、O1。審查者暫時只檢查非H球，共看到2C與1O且沒有其他非H球；H還未檢查。他目前能簽哪項結論？","correct":"D","options":[{"id":"A","text":"H必定錯誤","explanation":"尚未查H不是H有錯的證據。"},{"id":"B","text":"模型一定不含H","explanation":"清單列H6，未看H不等於不存在。"},{"id":"C","text":"全模型已完整通過","explanation":"局部核對不能冒稱全套計數已驗證。"},{"id":"D","text":"非H部分吻合；全部清單仍待H核對","explanation":"已查部分可確認，未查部分須保持未完成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B082","stem":"甲表列乙醇「O=1」，乙表列乙醇「O=10」，兩表都未標計數範圍。哪個檢查最能避免過早判定矛盾？","correct":"C","options":[{"id":"A","text":"直接改成乙二醇","explanation":"換物質名稱不解決缺失的計數單位。"},{"id":"B","text":"直接把10改1","explanation":"未確認前不應任意改數據。"},{"id":"C","text":"確認兩者指每分子還是多分子的總數","explanation":"若甲指單分子、乙指10分子總數，兩者可相容。"},{"id":"D","text":"確認兩個數字字體是否一樣","explanation":"字體不決定計數範圍。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 16_imagegen_page_09.png（正式第9頁，正文第7頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B083","stem":"教具活動設計A—B—C來練習讀連接，明示不主張對應某真實物質。哪種成果敘述符合證據？","correct":"C","options":[{"id":"A","text":"已合成A—B—C新物質","explanation":"紙上示意不是化學合成。"},{"id":"B","text":"已證明自然界一定存在該分子","explanation":"假想示意不證明真實存在。"},{"id":"C","text":"已練習從連線讀出B的相鄰球是A與C","explanation":"連線的讀取是這份教具實際支持的結果。"},{"id":"D","text":"已測得該物質毒性","explanation":"教具未提供毒性資料。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章 1.1 化學研究／化學的原子與分子觀點；印刷頁 47–48；部分1 PDF頁 49–50（從1起算）；已審筆記頁 14_imagegen_page_07.png（正式第7頁，正文第5頁）；15_imagegen_page_08.png（正式第8頁，正文第6頁）。","example":""},{"id":"central-0-1-ch1-sec1-1-topic01-G02V-B084","stem":"假想教具規格要求每條線都連接「兩顆不同編號的球」。原圖有A、B、C三顆球，列A—B、B—C、C—C三條線。只刪違反規格的線且保留所有球，應怎樣處理？","correct":"A","options":[{"id":"A","text":"只刪C—C，仍保留3顆球",
