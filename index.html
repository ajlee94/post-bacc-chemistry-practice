直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n相對個數為10、1.5、4.0625。乘16可化為160：24：65，合計249份；氫個數占160/249約64.3%。只計三者，不含其他元素，不能當作整個人體的精確氫原子百分比。","correct":"C","options":[{"id":"A","text":"69.9%","explanation":"錯誤。65/93約69.9%，是氧在三者中的質量分率。"},{"id":"B","text":"10.0%","explanation":"錯誤。10%是氫占原人體模型的質量分率。"},{"id":"C","text":"64.3%","explanation":"正確。160/249約64.3%。"},{"id":"D","text":"26.1%","explanation":"錯誤。65/249約26.1%，為氧個數分率。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B056","stem":"每100 g人體模型含H 10 g、C 18 g、O 65 g。限定三者，取H=1、C=12、O=16，氧約占三者原子數多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n重新依質量換算原子數：H為10，C為1.5，O為4.0625。總相對個數15.5625，氧4.0625/15.5625約26.1%。氧雖在質量上最多，換成個數後須考慮每顆氧比氫重。","correct":"D","options":[{"id":"A","text":"9.6%","explanation":"錯誤。9.6%是碳占三者原子數。"},{"id":"B","text":"65.0%","explanation":"錯誤。65%是氧占原整體質量。"},{"id":"C","text":"69.9%","explanation":"錯誤。69.9%是氧占三者質量，不是個數。"},{"id":"D","text":"26.1%","explanation":"正確。氧相對個數占65/249，約26.1%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B057","stem":"每100 g人體模型含H 10 g、C 18 g、O 65 g。只統計這三者，取H=1、C=12、O=16，何者是原子個數由多至少的次序？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n計算H：C：O=(10/1)：(18/12)：(65/16)=10：1.5：4.0625，所以氫最多、氧其次、碳最少。這與質量排序O＞C＞H不同，差別來自各種原子的單顆質量。","correct":"A","options":[{"id":"A","text":"H＞O＞C","explanation":"正確。10＞4.0625＞1.5，對應H＞O＞C。"},{"id":"B","text":"H＞C＞O","explanation":"錯誤。碳1.5低於氧4.0625。"},{"id":"C","text":"C＞O＞H","explanation":"錯誤。碳不是個數最多者。"},{"id":"D","text":"O＞C＞H","explanation":"錯誤。直接沿用質量排序。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B058","stem":"元素模型有H 4 g、He 8 g，取H=1、He=4。氫約占兩者總原子數多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\nH相對個數4/1=4，He為8/4=2，合計6，因此氫占4/6約66.7%。4/12約33.3%是氫的質量占比，不是原子個數占比。","correct":"B","options":[{"id":"A","text":"50.0%","explanation":"錯誤。兩元素種類各一種不代表顆數各半。"},{"id":"B","text":"66.7%","explanation":"正確。4/(4+2)約66.7%。"},{"id":"C","text":"80.0%","explanation":"錯誤。80%是等質量氫氦時的氫個數比例，本題非等質量。"},{"id":"D","text":"33.3%","explanation":"錯誤。這是氫質量占比4/(4+8)。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B059","stem":"某模型只含H與He，質量百分比分別5%與95%。取H=1、He=4，氫約占原子總數多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n取100份質量，H相對個數5，He為95/4=23.75。H分率5/(5+23.75)約17.4%。氫的個數占比高於其質量占比，但仍少於一半；較輕不保證在任何組成都占多數。","correct":"C","options":[{"id":"A","text":"80.0%","explanation":"錯誤。這是等質量條件才有的比例，本題不適用。"},{"id":"B","text":"5.0%","explanation":"錯誤。直接沿用質量百分比。"},{"id":"C","text":"17.4%","explanation":"正確。5/28.75約17.4%。"},{"id":"D","text":"20.0%","explanation":"錯誤。把5%簡單乘4，漏除全部相對個數。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B060","stem":"銀河系氫74%、氦24%，皆按質量。只計H與He，取H=1、He=4，H約占兩者原子數多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n相對個數H為74/1=74，He為24/4=6。限定氫氦的總數為80，氫占74/80=92.5%。其他元素未計，這並非完整銀河系的所有原子百分比。","correct":"D","options":[{"id":"A","text":"98.0%","explanation":"錯誤。98是氫氦占原整體質量合計。"},{"id":"B","text":"74.0%","explanation":"錯誤。這是H占原整體質量。"},{"id":"C","text":"75.5%","explanation":"錯誤。74/98為H占氫氦質量。"},{"id":"D","text":"92.5%","explanation":"正確。74/(74+6)=92.5%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B061","stem":"取相同顆數的H、C、O原子，相對原子質量H=1、C=12、O=16。總質量比H：C：O為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n各元素總質量為相同顆數乘各自單顆質量。顆數相消後，總質量比即1：12：16。等顆數不等於等質量，較重原子的總質量較大。","correct":"A","options":[{"id":"A","text":"1：12：16","explanation":"正確。共同顆數相消後保留1：12：16。"},{"id":"B","text":"12：1：16","explanation":"錯誤。氫碳的數值位置互換。"},{"id":"C","text":"1：1：1","explanation":"錯誤。忽略每顆原子質量不同。"},{"id":"D","text":"16：12：1","explanation":"錯誤。氫與氧的質量關係顛倒。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B062","stem":"某元素模型中H：O原子個數比為4：1，取H=1、O=16。質量比H：O為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\nH四顆的相對總質量4×1=4，O一顆為1×16=16，所以4：16=1：4。不要沿用4：1顆數比，也不要忘記氫有四顆。","correct":"B","options":[{"id":"A","text":"4：1","explanation":"錯誤。這是原子數比，還未乘單顆質量。"},{"id":"B","text":"1：4","explanation":"正確。總質量4：16可約分1：4。"},{"id":"C","text":"1：16","explanation":"錯誤。忽略氫原子數為4。"},{"id":"D","text":"16：1","explanation":"錯誤。把單顆氧質量直接放在H的一側。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B063","stem":"某模型H：C原子個數比為2：1，取H=1、C=12。H：C質量比為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n相對總質量H為2×1=2，C為1×12=12，故2：12=1：6。個數與質量各有自己的比，應依題目所求切換。","correct":"C","options":[{"id":"A","text":"6：1","explanation":"錯誤。質量比順序顛倒。"},{"id":"B","text":"1：12","explanation":"錯誤。漏乘氫的兩顆。"},{"id":"C","text":"1：6","explanation":"正確。2：12化簡為1：6。"},{"id":"D","text":"2：1","explanation":"錯誤。仍是個數比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B064","stem":"元素模型H：C：O原子個數比為12：1：1，取H=1、C=12、O=16。氧占模型總質量多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n三類相對質量為12、12、16，合計40，氧占16/40=40%。1/14是氧的原子個數比例，不能拿來回答質量問題。","correct":"D","options":[{"id":"A","text":"1/14","explanation":"錯誤。此為原子個數分率，非質量分率。"},{"id":"B","text":"65%","explanation":"錯誤。人體的65%不能套用到本題不同模型。"},{"id":"C","text":"16%","explanation":"錯誤。16是氧的相對質量份數，未除總份數40。"},{"id":"D","text":"40%","explanation":"正確。16/(12+12+16)=40%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B065","stem":"只含H與O的模型，H：O原子個數比3：2，取H=1、O=16。氫約占總質量多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n相對質量H為3，O為32，總和35。氫質量占3/35約8.6%。3/5=60%只是氫原子個數占比；兩個基準不可互換。","correct":"A","options":[{"id":"A","text":"8.6%","explanation":"正確。3/35約8.6%。"},{"id":"B","text":"6.3%","explanation":"錯誤。約為1/16，忽略題給顆數及總分母。"},{"id":"C","text":"91.4%","explanation":"錯誤。32/35約91.4%，是氧質量占比。"},{"id":"D","text":"60.0%","explanation":"錯誤。3/(3+2)是個數分率。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B066","stem":"只含H與He的模型，原子個數比H：He=3：2，取H=1、He=4。氦約占總質量多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\nH相對質量3×1=3，He為2×4=8，全部11，He占8/11約72.7%。雖氦顆數只占40%，每顆較重，使它的質量貢獻占多數。","correct":"B","options":[{"id":"A","text":"60.0%","explanation":"錯誤。這是氫個數占比。"},{"id":"B","text":"72.7%","explanation":"正確。8/(3+8)約72.7%。"},{"id":"C","text":"27.3%","explanation":"錯誤。這是氫質量占比。"},{"id":"D","text":"40.0%","explanation":"錯誤。這是氦個數占比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B067","stem":"只含H 2 g與O 16 g的元素模型，取H=1、O=16。下列「氫質量占比；氫原子數占比」何者正確？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n質量基準為2/(2+16)=1/9約11.1%。原子數基準則先算2/1=2與16/16=1，再算2/(2+1)=2/3約66.7%。兩種百分比使用不同分母。","correct":"C","options":[{"id":"A","text":"約11.1%；約11.1%","explanation":"錯誤。第二項未作個數換算。"},{"id":"B","text":"約66.7%；約66.7%","explanation":"錯誤。第一項把個數占比錯當質量占比。"},{"id":"C","text":"約11.1%；約66.7%","explanation":"正確。兩項各用正確統計基準。"},{"id":"D","text":"約66.7%；約11.1%","explanation":"錯誤。把質量與個數結果對調。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B068","stem":"只含C 24 g與O 16 g的模型，取C=12、O=16。哪項正確？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n碳質量分率24/40=60%。相對個數C為24/12=2，O為16/16=1，碳個數占2/3約66.7%。每一區都需依各自分母計算。","correct":"D","options":[{"id":"A","text":"碳質量約66.7%，原子數60%","explanation":"錯誤。兩個基準結果對調。"},{"id":"B","text":"碳質量40%，原子數約33.3%","explanation":"錯誤。兩個數字實際上都是氧的比例。"},{"id":"C","text":"碳質量60%，原子數50%","explanation":"錯誤。原子數不是兩種類各半。"},{"id":"D","text":"碳質量60%，原子數約66.7%","explanation":"正確。質量60%、個數2/3皆正確。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B069","stem":"H與O組成模型的質量比例為10：90，取H=1、O=16。H占原子總數多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n相對個數H為10，O為90/16=5.625。兩者同乘16為160：90，可化16：9；H個數占16/25=64%。原子較輕的H在個數上可占多數，即使質量只占10%。","correct":"A","options":[{"id":"A","text":"64%","explanation":"正確。16/(16+9)=64%。"},{"id":"B","text":"90%","explanation":"錯誤。90是氧的質量份數。"},{"id":"C","text":"10%","explanation":"錯誤。沿用質量分率。"},{"id":"D","text":"16%","explanation":"錯誤。16是化簡後H相對份數，還須除25。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B070","stem":"某C、O模型的質量百分比為C 60%、O 40%，取C=12、O=16。C：O原子個數比為何？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n以100 g為基準，C相對個數60/12=5，O為40/16=2.5，故2：1。3：2只是質量比，4：3則與單顆質量的反比有關，均尚未結合本題總質量分布。","correct":"B","options":[{"id":"A","text":"3：2","explanation":"錯誤。直接使用60：40的質量比。"},{"id":"B","text":"2：1","explanation":"正確。5：2.5化為2：1。"},{"id":"C","text":"1：2","explanation":"錯誤。把個數次序顛倒。"},{"id":"D","text":"4：3","explanation":"錯誤。只比較單顆質量，漏總質量比例。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B071","stem":"取H=1、C=12、O=16。四份樣品分別為H 1 g、C 12 g、O 16 g、O 32 g，哪份原子顆數最多？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n各份用質量除相對原子質量，依序得到1、1、1、2。前三份雖質量不同，顆數相同；O 32 g的相對個數為2，因此最多。","correct":"C","options":[{"id":"A","text":"C 12 g","explanation":"錯誤。相對個數1。"},{"id":"B","text":"O 16 g","explanation":"錯誤。相對個數1。"},{"id":"C","text":"O 32 g","explanation":"正確。32/16=2，高於其他三份。"},{"id":"D","text":"H 1 g","explanation":"錯誤。相對個數1。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B072","stem":"H 4 g與某質量的O含相同顆數原子。取H=1、O=16，所需氧質量為多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n氫相對個數4/1=4，氧也須有相對個數4，故氧質量=4×16=64 g。等顆數時質量比為16倍，不能採等質量。","correct":"D","options":[{"id":"A","text":"0.25 g","explanation":"錯誤。把較重氧用反比縮小。"},{"id":"B","text":"4 g","explanation":"錯誤。等質量不等顆數。"},{"id":"C","text":"16 g","explanation":"錯誤。16 g只對應H 1 g的顆數。"},{"id":"D","text":"64 g","explanation":"正確。64/16=4，與氫相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B073","stem":"取C=12、O=16。碳樣品18 g；若氧的原子顆數是碳的兩倍，氧質量應為多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n碳相對個數18/12=1.5，氧要求兩倍即3；氧質量3×16=48 g。顆數乘2後還要按氧單顆質量換回，不是直接把碳質量乘2。","correct":"A","options":[{"id":"A","text":"48 g","explanation":"正確。48/16=3，是1.5的兩倍。"},{"id":"B","text":"9 g","explanation":"錯誤。把碳質量除2，未依題意換算。"},{"id":"C","text":"24 g","explanation":"錯誤。24 g是與碳等顆數的氧。"},{"id":"D","text":"36 g","explanation":"錯誤。只把碳質量乘2，忽略元素不同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B074","stem":"模型只含H、C、O，原子個數各占50%、25%、25%。取H=1、C=12、O=16，氧約占總質量多少？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\n取100顆作比例基準，相對質量H為50、C為300、O為400，總和750。氧占400/750約53.3%。用100顆只是方便換算比例，不表示真實模型只能有100顆。","correct":"B","options":[{"id":"A","text":"50.0%","explanation":"錯誤。這是氫原子個數占比，非氧質量。"},{"id":"B","text":"53.3%","explanation":"正確。400/750約53.3%。"},{"id":"C","text":"16.0%","explanation":"錯誤。16是氧單顆相對質量，未按顆數加權。"},{"id":"D","text":"25.0%","explanation":"錯誤。這是氧原子個數占比。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B075","stem":"人體模型只給O 65%、C 18%、H 10%、其他7%的質量資料，並給H=1、C=12、O=16，但未列其他元素種類。可精確求出下列哪個量？","concept":"原子個數與「該元素的總質量÷一顆原子的質量」成正比。若使用相對原子質量作除數，只能直接得到個數的相對比例；要算個數百分比，還須除以所選全部元素的相對個數總和。較輕的原子在相同總質量下顆數較多，不能把質量排序直接當個數排序。\n\nH與C兩項皆有質量比例與相對原子質量，可算(10/1)：(18/12)=20：3。不過其他7%的元素與單顆質量未知，無法得到全部原子數分母，所以全體精確個數百分比仍不可求。","correct":"C","options":[{"id":"A","text":"其他每種元素的顆數","explanation":"錯誤。合計7%未提供各種元素的質量分配。"},{"id":"B","text":"O占所有原子的百分比","explanation":"錯誤。同樣缺全部原子數分母。"},{"id":"C","text":"H與C的原子個數比","explanation":"正確。H：C=10：1.5=20：3，不需其他資料。"},{"id":"D","text":"H占所有原子的百分比","explanation":"錯誤。缺其他元素原子數，分母未知。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4。","example":"","pointId":"EL-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B076","stem":"元素質量表列Cu 12 g、C 4 g、Ca 8 g。碳占這三種元素總質量多少？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n先辨識碳是C，而非Cu銅或Ca鈣。總質量12+4+8=24 g，碳4 g，故4/24約16.7%。元素辨識錯誤會讓算式形式正確卻選錯分子。","correct":"D","options":[{"id":"A","text":"66.7%","explanation":"錯誤。把Cu與C合計當碳，混合了不同元素。"},{"id":"B","text":"50.0%","explanation":"錯誤。把銅Cu 12 g當碳。"},{"id":"C","text":"33.3%","explanation":"錯誤。把鈣Ca 8 g當碳。"},{"id":"D","text":"16.7%","explanation":"正確。C 4 g占24 g約16.7%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B077","stem":"元素質量帳列N 14 g、Na 46 g。氮占兩種元素總質量多少？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n氮是N，所以取14 g；Na是鈉，不是氮的另一寫法。兩者總量60 g，氮14/60約23.3%；14/46約30.4%是氮對鈉比，不是氮占全體。","correct":"A","options":[{"id":"A","text":"約23.3%","explanation":"正確。14/(14+46)約23.3%。"},{"id":"B","text":"約30.4%","explanation":"錯誤。以鈉46 g作分母，並非全部。"},{"id":"C","text":"50.0%","explanation":"錯誤。兩種元素不代表等質量。"},{"id":"D","text":"約76.7%","explanation":"錯誤。把鈉當氮。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B078","stem":"元素質量帳列Ag 15 g、Al 5 g、Mg 10 g。銀與鎂合計為多少？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n銀Ag為15 g，鎂Mg為10 g，合計25 g。Al是鋁，不列在本題指定兩種元素內；不能只看首字母A或末字母g便選取。","correct":"B","options":[{"id":"A","text":"30 g","explanation":"錯誤。把鋁也加進去。"},{"id":"B","text":"25 g","explanation":"正確。Ag 15+Mg 10=25 g。"},{"id":"C","text":"20 g","explanation":"錯誤。這是Ag與Al合計，鎂項漏掉。"},{"id":"D","text":"15 g","explanation":"錯誤。僅銀本身。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B079","stem":"質量帳列Si 10 g、S 6 g、Sn 14 g。矽的質量占比為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n矽是Si，質量10 g；S為硫、Sn為錫。總量30 g，矽分率10/30約33.3%。共同首字母S不能使三者合為同一元素。","correct":"C","options":[{"id":"A","text":"80.0%","explanation":"錯誤。這是矽與錫合計，並非矽單項。"},{"id":"B","text":"20.0%","explanation":"錯誤。這是硫S的6/30。"},{"id":"C","text":"33.3%","explanation":"正確。10/30約33.3%。"},{"id":"D","text":"46.7%","explanation":"錯誤。這是錫Sn的14/30。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B080","stem":"質量表列Ca 12 g、Cl 18 g、C 6 g。鈣與碳合計占全部質量多少？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鈣Ca與碳C的質量為12+6=18 g，全部36 g，因此占50%。Cl是氯18 g，不能將它當鈣或碳的一部分。","correct":"D","options":[{"id":"A","text":"83.3%","explanation":"錯誤。這是Ca加Cl的比例。"},{"id":"B","text":"66.7%","explanation":"錯誤。這是Cl加C的比例。"},{"id":"C","text":"33.3%","explanation":"錯誤。只計Ca 12 g，漏碳。"},{"id":"D","text":"50%","explanation":"正確。18/36=50%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B081","stem":"質量表列Fe 7 g、F 3 g、P 5 g。鐵約占總質量多少？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鐵符號Fe，故取7 g。F是氟、P是磷，總量15 g，所以鐵7/15約46.7%。化學記號不完整會把7 g誤讀成3 g，必須先辨識才計算。","correct":"A","options":[{"id":"A","text":"46.7%","explanation":"正確。Fe 7 g占15 g約46.7%。"},{"id":"B","text":"66.7%","explanation":"錯誤。把Fe與F當成同一元素加總。"},{"id":"C","text":"20.0%","explanation":"錯誤。3/15是氟的比例。"},{"id":"D","text":"33.3%","explanation":"錯誤。5/15是磷的比例。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B082","stem":"元素質量表列H 1 g、He 4 g、Hg 20 g。占全部質量超過一半的是哪種元素？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n三者合計25 g，一半為12.5 g。Hg是汞且有20 g，占80%，超過一半；H氫與He氦分別只有1與4 g。此題依質量，不以符號字母數比較。","correct":"B","options":[{"id":"A","text":"氦","explanation":"錯誤。He只占4/25=16%。"},{"id":"B","text":"汞","explanation":"正確。Hg占20/25=80%。"},{"id":"C","text":"三者都未超過一半","explanation":"錯誤。汞的20 g明顯超過12.5 g。"},{"id":"D","text":"氫","explanation":"錯誤。H只占1/25=4%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B083","stem":"質量表列Br 8 g、I 12 g、Li 4 g。碘的質量與其他兩種合計之比為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n碘是I，質量12 g；溴Br與鋰Li合計8+4=12 g，因此碘對其他為1：1。Li雖含i，仍是鋰，不可連同I算成碘。","correct":"C","options":[{"id":"A","text":"3：1","explanation":"錯誤。只和Li 4 g相比，漏Br。"},{"id":"B","text":"2：3","explanation":"錯誤。這是Br對I之比，元素取錯。"},{"id":"C","text":"1：1","explanation":"正確。12：12=1：1。"},{"id":"D","text":"1：2","explanation":"錯誤。誤把總量24 g作另一方，題問的是其他。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B084","stem":"質量帳列K 8 g、P 6 g、Pb 10 g。鉀與鉛合計占多少質量百分比？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n鉀K與鉛Pb的合計為18 g，全部8+6+10=24 g，故18/24=75%。P是磷，不是鉀，也不是Pb的省略寫法。","correct":"D","options":[{"id":"A","text":"25%","explanation":"錯誤。6/24是磷比例。"},{"id":"B","text":"58.3%","explanation":"錯誤。這是K與P合計。"},{"id":"C","text":"66.7%","explanation":"錯誤。這是P與Pb合計。"},{"id":"D","text":"75%","explanation":"正確。K加Pb共18 g，占24 g的75%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B085","stem":"某200 g元素模型，銅占25%、碳15%、鈣60%，皆按質量。以Cu標示的那項質量應為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n先由Cu確認所求是銅，因此使用25%而不是碳15%或鈣60%。200×0.25=50 g。符號與質量比例必須成對讀取，不能因共同起首C而混同。","correct":"A","options":[{"id":"A","text":"50 g","explanation":"正確。銅Cu 25%乘200 g為50 g。"},{"id":"B","text":"120 g","explanation":"錯誤。這是鈣Ca 60%的質量。"},{"id":"C","text":"150 g","explanation":"錯誤。這是非銅部分。"},{"id":"D","text":"30 g","explanation":"錯誤。這是碳C 15%的質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B086","stem":"某50 g元素模型中，Al占30%、Ag占20%、Si占50%質量。鋁與銀合計多少質量？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nAl是鋁、Ag是銀，兩項比例30%+20%=50%，所以50 g×0.50=25 g。Si是矽，不是銀，不能因英文名稱相近而取錯。","correct":"B","options":[{"id":"A","text":"15 g","explanation":"錯誤。只計鋁Al。"},{"id":"B","text":"25 g","explanation":"正確。鋁15 g加銀10 g共25 g。"},{"id":"C","text":"40 g","explanation":"錯誤。這是Al與Si合計。"},{"id":"D","text":"10 g","explanation":"錯誤。只計銀Ag。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B087","stem":"質量表列銅20 g、汞30 g。下列哪個符號質量比正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n銅對應Cu、汞對應Hg，質量比20：30約分2：3。這題同時要求元素符號和比較方向正確，不能只看比值相近或同首字母。","correct":"C","options":[{"id":"A","text":"Cu：Mg=2：3","explanation":"錯誤。Mg是鎂，汞應Hg。"},{"id":"B","text":"Cu：Hg=3：2","explanation":"錯誤。符號正確但比值方向顛倒。"},{"id":"C","text":"Cu：Hg=2：3","explanation":"正確。名稱與符號及比例都對。"},{"id":"D","text":"C：Hg=2：3","explanation":"錯誤。C是碳，銅應Cu。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B088","stem":"元素質量帳列Lithium 3 g、Iodine 9 g、Bromine 6 g。哪項「符號—占全部質量比例」正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nLithium為鋰Li，Iodine為碘I，Bromine為溴Br。全部18 g，碘9/18=50%；鋰約16.7%、溴約33.3%。題目要英文、符號、質量基準三者一致。","correct":"D","options":[{"id":"A","text":"Br—50%","explanation":"錯誤。Br是6/18約33.3%。"},{"id":"B","text":"I—16.7%","explanation":"錯誤。16.7%是Li的比例，不是I。"},{"id":"C","text":"Li—50%","explanation":"錯誤。Li只有3/18約16.7%。"},{"id":"D","text":"I—50%","explanation":"正確。Iodine對I，9/18=50%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B089","stem":"質量帳列Sodium 4 g、Nitrogen 8 g、Phosphorus 12 g。下列何者正確？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\nSodium是鈉Na，Nitrogen是氮N，Phosphorus是磷P。Na 4 g與P 12 g合計16 g；總量24 g，Na占1/6而非1/3。須先辨識再進行加總或比例計算。","correct":"A","options":[{"id":"A","text":"Na與P合計16 g","explanation":"正確。4+12=16 g且符號正確。"},{"id":"B","text":"P與N合計12 g","explanation":"錯誤。P與N為12+8=20 g。"},{"id":"C","text":"Na占全部質量三分之一","explanation":"錯誤。4/24=1/6，三分之一是N。"},{"id":"D","text":"N代表4 g的一項","explanation":"錯誤。N對Nitrogen 8 g，不是Sodium。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B090","stem":"取相對原子質量H=1、He=4、C=12、O=16。各取等質量的氫、氦、碳、氧，原子個數由多至少的符號次序為何？","concept":"元素符號是固定的化學記號，不能只取英文名稱開頭猜測。常見符號有一或兩個字母，第一字母大寫，雙字母符號的第二字母小寫；例如C是碳、Ca是鈣、Cl是氯、Cu是銅。讀題時要同時核對完整符號及元素名稱，不能只看第一字母。\n\n等總質量時原子數與相對原子質量成反比。1＜4＜12＜16，因此個數H＞He＞C＞O。注意氫H與氦He是不同元素，不能因同以H開始就視為相等。","correct":"B","options":[{"id":"A","text":"O＞C＞He＞H","explanation":"錯誤。這是相對原子質量由大至小，個數恰相反。"},{"id":"B","text":"H＞He＞C＞O","explanation":"正確。等質量下除數越小顆數越多。"},{"id":"C","text":"H＞C＞He＞O","explanation":"錯誤。C的相對原子質量大於He，個數應較少。"},{"id":"D","text":"He＞H＞O＞C","explanation":"錯誤。H應多於He，C也應多於O。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6。","example":"","pointId":"EL-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B091","stem":"元素質量帳列cuprum 6 g、ferrum 4 g、argentum 10 g。銀占總質量多少？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nargentum對銀Ag，取10 g；cuprum為銅Cu 6 g，ferrum為鐵Fe 4 g。總量20 g，銀占10/20=50%。先用詞源辨識化學元素，才能選對質量分子。","correct":"C","options":[{"id":"A","text":"20%","explanation":"錯誤。這是鐵4/20。"},{"id":"B","text":"30%","explanation":"錯誤。這是銅6/20。"},{"id":"C","text":"50%","explanation":"正確。銀10/20=50%。"},{"id":"D","text":"70%","explanation":"錯誤。這是鐵銀合計，不是銀單項。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B092","stem":"質量表列natrium 9 g、kalium 6 g、plumbum 15 g。哪項正確表示鈉與鉀的合計質量？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nnatrium為鈉Na，kalium為鉀K，合計9+6=15 g。plumbum是鉛Pb，不在所求兩種內；N與P分別為氮與磷，不能由來源詞首字母隨意替代。","correct":"D","options":[{"id":"A","text":"N與P，共15 g","explanation":"錯誤。N與P表示別的元素，名稱不符。"},{"id":"B","text":"Na與Pb，共24 g","explanation":"錯誤。這是鈉與鉛，求錯元素組。"},{"id":"C","text":"K與Pb，共21 g","explanation":"錯誤。這是鉀與鉛，求錯元素組。"},{"id":"D","text":"Na與K，共15 g","explanation":"正確。兩個來源、符號及合計都正確。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B093","stem":"元素模型中hydrargyrum所指元素占40%質量，其他合計60%，總量75 g。正確的元素符號與質量為何？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nhydrargyrum對汞Hg。其質量75×0.40=30 g；另外45 g為其餘元素。詞源辨識與比例計算都要正確，不能把末字母相近的Mg當汞。","correct":"A","options":[{"id":"A","text":"Hg，30 g","explanation":"正確。Hg為汞，且75的40%是30 g。"},{"id":"B","text":"Hg，45 g","explanation":"錯誤。45 g為其他部分。"},{"id":"C","text":"H，30 g","explanation":"錯誤。H是氫，不是汞。"},{"id":"D","text":"Mg，30 g","explanation":"錯誤。Mg是鎂而不是汞。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B094","stem":"質量帳列stannum 18 g、plumbum 12 g。錫對鉛的質量比應如何表示？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nstannum是錫Sn、plumbum是鉛Pb，錫對鉛18：12=3：2。來源詞不能直接截成S與P；那兩符號各代表硫與磷。","correct":"B","options":[{"id":"A","text":"Pb：Sn=3：2","explanation":"錯誤。題目次序是錫對鉛，不能倒置符號而保留數字。"},{"id":"B","text":"Sn：Pb=3：2","explanation":"正確。符號、元素次序及比值均正確。"},{"id":"C","text":"S：P=3：2","explanation":"錯誤。把錫鉛誤寫成硫磷。"},{"id":"D","text":"Sn：Pb=2：3","explanation":"錯誤。錫對鉛比例應3：2。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B095","stem":"某元素模型列Iron 5 g、Copper 10 g、Silver 15 g。若以ferrum、cuprum、argentum追溯符號，哪項正確？","concept":"有些元素符號保留外語名稱的字母，因此不一定與現代英文名稱的起首相同。本節例子為Cu—cuprum、Fe—ferrum、Pb—plumbum、Hg—hydrargyrum、K—kalium、Ag—argentum、Na—natrium、Sn—stannum。詞源解釋符號的由來，元素名稱與符號仍須逐一配對。\n\nIron—ferrum—Fe，Copper—cuprum—Cu，Silver—argentum—Ag。總質量30 g，Fe占1/6、Cu占1/3、Ag占1/2；Fe與Cu合計15 g，占1/2。先完成名稱與符號的對應，再選取所需質量與正確分母，才能求得各項比例。","correct":"C","options":[{"id":"A","text":"Fe與Cu合計占總質量三分之一","explanation":"錯誤。Fe與Cu合計5+10=15 g，占30 g的一半；三分之一只有Cu單項。"},{"id":"B","text":"Fe占總質量一半","explanation":"錯誤。Fe是5/30=1/6。"},{"id":"C","text":"Cu占總質量三分之一","explanation":"正確。Cu為10/30=1/3。"},{"id":"D","text":"Ag占總質量六分之一","explanation":"錯誤。Ag是15/30=1/2。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4、5、6、7。","example":"","pointId":"EL-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B096","stem":"週期表中甲、乙同欄，丙、丁另在同一欄。某模型中甲乙合計占30%質量，且甲的質量是乙的2倍。哪項結論最有依據？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n先用同欄位置判斷甲乙化學關係密切。再設乙質量分率x，甲為2x，3x=30%，得乙10%、甲20%。總質量比並不是單顆原子質量比或原子數比；丙丁的含量也不能由欄位推得。","correct":"D","options":[{"id":"A","text":"甲乙原子個數必為2：1","explanation":"錯誤。2：1是質量比，未給單顆原子質量，不能直接作個數比。"},{"id":"B","text":"甲每顆原子的質量必為乙的2倍","explanation":"錯誤。元素總質量同時取決於單顆質量及顆數，不能把2倍總質量直接歸為每顆重2倍。"},{"id":"C","text":"丙與丁合計也必占30%質量","explanation":"錯誤。同欄資料不能推出丙丁在此環境的豐度。"},{"id":"D","text":"甲乙關係密切，且甲占20%、乙占10%質量","explanation":"正確。甲乙同欄支持關聯，2：1分配30%得20%及10%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4、8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B097","stem":"甲、乙在週期表同欄，並分別占某環境總質量的6%與2%。下列哪項敘述正確？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n同欄支持兩元素化學關係密切；6%及2%共用同一環境的總質量分母，因此甲乙總質量比為6：2=3：1，合計分率為8%。原子個數與單顆質量都不能只由總質量比推出，兩者須透過總質量＝顆數×單顆質量連結。","correct":"A","options":[{"id":"A","text":"化學關係密切，甲乙總質量比為3：1","explanation":"正確。同欄關聯及6：2=3：1總質量比均有依據。"},{"id":"B","text":"化學關係密切，甲乙原子個數比必為3：1","explanation":"錯誤。把總質量比直接當原子數比，忽略單顆質量差異。"},{"id":"C","text":"化學關係密切，甲乙合計占總質量4%","explanation":"錯誤。6%−2%=4%是分率差；兩元素合計應為8%。"},{"id":"D","text":"化學關係密切，甲每顆原子必為乙的3倍重","explanation":"錯誤。3倍總質量不表示每顆原子重3倍，還受顆數影響。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4、8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B098","stem":"甲、乙在週期表同欄。一份100 g樣品含甲12 g、乙18 g，其餘元素70 g。下列哪項敘述正確？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n同欄位置支持甲乙化學關係密切。若只看甲乙兩者，總質量為12+18=30 g，所以甲占12/30=40%、乙占18/30=60%；若以全部樣品100 g為分母，兩者則分別為12%及18%。質量比12：18=2：3仍不能直接當原子數比，因單顆原子質量尚未給定。","correct":"B","options":[{"id":"A","text":"甲乙關係密切，甲占全部樣品質量40%","explanation":"錯誤。甲占全部100 g的比例為12%，40%使用的是兩者合計30 g分母。"},{"id":"B","text":"甲乙關係密切，甲占兩者合計質量40%","explanation":"正確。同欄關聯及12/(12+18)=40%均正確。"},{"id":"C","text":"甲乙關係密切，乙占兩者合計質量18%","explanation":"錯誤。18%是乙占全部樣品；乙占甲乙合計質量應為60%。"},{"id":"D","text":"甲乙關係密切，甲乙原子個數比必為2：3","explanation":"錯誤。2：3是總質量比，原子數仍需各自除以單顆原子質量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4、8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B099","stem":"甲、乙在週期表同欄。某50 g樣品中，甲20 g、乙30 g。下列哪項推論仍需要更多資料？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n同欄直接支持化學關聯；由題給質量可算乙30/50=60%，以及乙對甲的總質量比30/20=1.5。甲乙質量比20：30=2：3，但若要判斷原子數比，還需兩元素單顆原子質量，分別以20及30除之。未給這項資料，不能把質量比當成原子數比。","correct":"C","options":[{"id":"A","text":"甲乙的化學關係密切","explanation":"錯誤。同欄已有化學關聯的依據，不需補資料。"},{"id":"B","text":"乙占樣品質量60%","explanation":"錯誤。30/50=60%，題給質量已足以計算。"},{"id":"C","text":"甲乙的原子個數比為2：3","explanation":"正確。原子個數比還需單顆原子質量；2：3只是目前已知的質量比。"},{"id":"D","text":"乙的總質量是甲的1.5倍","explanation":"錯誤。30/20=1.5，題給質量已足以計算。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文4、8。","example":"","pointId":"EL-09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic03-G03-B100","stem":"某元素資料列甲、乙同欄且在樣品中各占10%質量，但未給單顆原子質量。下列哪個結論仍缺乏依據？","concept":"週期表列出已知元素及其符號，並把關係密切的元素排在同一欄。它的欄分組有化學意義，不能由英文拼字、符號字母數或元素在某環境的含量自行建立。同欄也不表示是同一元素或在人體中含量相等。\n\n同欄支持化學關聯；同一樣品各10%支持總質量相等及合計20%。然而相同元素總質量不保證相同顆數，還需知道各自單顆原子質量，才能完成個數比較。","correct":"D","options":[{"id":"A","text":"甲乙化學關係密切","explanation":"錯誤。同欄原則直接支持此結論，非題問缺依據者。"},{"id":"B","text":"甲乙總質量相等","explanation":"錯誤。共同樣品分母與相同分率支持此結論。"},{"id":"C","text":"甲乙合計占樣品質量20%","explanation":"錯誤。兩個互斥元素各10%可相加為20%。"},{"id":"D","text":"甲乙原子個數相等","explanation":"正確。等質量要再除單顆質量；本題未提供，故這項不能推出。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Chapter 1 → 1.2 Classifications of Matter → Elements; Figure 1.6 / Table 1.1；印刷頁 52；部分1 PDF頁 54；已審筆記頁 正文8。","example":"","pointId":"EL-09","schools":["CMU"]}]},{"depth":"精讀","target":150,"questions":[]}],"schoolBanks":{"CMU":[["central-0-1-ch1-sec1-2-topic03-G03-S001","central-0-1-ch1-sec1-2-topic03-G03-S002","central-0-1-ch1-sec1-2-topic03-G03-S003","central-0-1-ch1-sec1-2-topic03-G03-S004","central-0-1-ch1-sec1-2-topic03-G03-S005","central-0-1-ch1-sec1-2-topic03-G03-S006","central-0-1-ch1-sec1-2-topic03-G03-S007","central-0-1-ch1-sec1-2-topic03-G03-S008","central-0-1-ch1-sec1-2-topic03-G03-S009","central-0-1-ch1-sec1-2-topic03-G03-S010","central-0-1-ch1-sec1-2-topic03-G03-S011","central-0-1-ch1-sec1-2-topic03-G03-S012","central-0-1-ch1-sec1-2-topic03-G03-S013","central-0-1-ch1-sec1-2-topic03-G03-S014","central-0-1-ch1-sec1-2-topic03-G03-S015","central-0-1-ch1-sec1-2-topi (function(root){'use strict';
const DEPTHS=['掃過','基礎讀','精讀'], TARGETS=[50,100,150];
const clone=x=>JSON.parse(JSON.stringify(x));
const DEFAULT_SCHOOLS=[{id:'CMU',label:'中國醫藥大學',version:'shared-v1',mode:'shared'},{id:'TCU',label:'慈濟大學',version:'shared-v1',mode:'shared'},{id:'ISU',label:'義守大學',version:'shared-v1',mode:'shared'}];
function assert(ok,msg){if(!ok)throw new Error(msg);}
function shuffle(items,rng){const a=items.slice();for(let i=a.length-1;i>0;i--){const r=rng();assert(Number.isFinite(r)&&r>=0&&r<1,'抽題亂數失效，原題組已保留。');const j=Math.floor(r*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function validateData(data){
 assert(data&&['chem-quiz-public/v2','chem-quiz-public/v3'].includes(data.schema)&&Array.isArray(data.nodes)&&data.nodes.length>0,'題庫格式不正確。');
 const v3=data.schema==='chem-quiz-public/v3';
 const ids=new Set(),questions=new Set();
 const schools=data.schools||DEFAULT_SCHOOLS;
 assert(schools.length===3&&schools.every((s,i)=>s.id===DEFAULT_SCHOOLS[i].id&&s.label===DEFAULT_SCHOOLS[i].label&&s.version&&(v3?s.mode===(i===0?'baseline':'additional-points-only'):['shared','school-specific'].includes(s.mode))),'學校版本資訊不正確。');
 for(const n of data.nodes){
  assert(n.id&&n.title&&n.version&&n.routeDepth&&Array.isArray(n.hierarchy),'節點資訊不完整。');
  assert(!ids.has(n.id),'節點身分重複。');ids.add(n.id);
  assert(Number.isInteger(n.reviewedLevel)&&n.reviewedLevel>=0&&n.reviewedLevel<=2,'來源深度不正確。');
  assert(Array.isArray(n.banks)&&n.banks.length===3,'深度題庫不完整。');
  n.banks.forEach((bank,d)=>{
   assert(bank.depth===DEPTHS[d]&&bank.target===TARGETS[d]&&Array.isArray(bank.questions),'題庫深度或目標不正確。');
   assert(d<=n.reviewedLevel||bank.questions.length===0,'題庫超過已審深度。');
   if(!v3){assert(bank.questions.length===0||bank.questions.length===bank.target,'題庫不足額，不能開始測驗。');
   if(d<=n.reviewedLevel)assert(bank.questions.length===bank.target,'已開放深度尚未足額。');}
   for(const q of bank.questions){
    assert(q.id&&!questions.has(q.id)&&q.stem&&q.source,'題目身分或來源不正確。');questions.add(q.id);
    assert(Array.isArray(q.options)&&q.options.length===4,'每題須有四個選項。');
    assert(new Set(q.options.map(o=>o.id)).size===4&&new Set(q.options.map(o=>o.text)).size===4,'選項重複。');
    assert(q.options.every(o=>o.id&&o.text&&o.explanation),'選項或解析不完整。');
    assert(q.options.filter(o=>o.id===q.correct).length===1,'正解識別碼不正確。');

function focusQuestion(){$('question-title').focus({preventScroll:true});$('question-title').scrollIntoView({block:'nearest'});}
function draw(){if(drawing)return;drawing=true;try{engine.start();selecting=false;stopResultMotion();render();closeCatalog();focusQuestion();say('已抽出新的十題。');}finally{setTimeout(()=>{drawing=false;},350);}}
function stopResultMotion(){cancelAnimationFrame(resultFrame);clearTimeout(resultTimer);resultFrame=0;$('results-card').classList.remove('is-celebrating');$('result-percent').textContent=String(resultTarget);$('results-card').getAnimations({subtree:true}).forEach(a=>a.cancel());}
function animateResult(){stopResultMotion();if(motion.matches||document.hidden)return;$('results-card').classList.add('is-celebrating');const start=performance.now();function tick(now){const p=Math.min(1,(now-start)/720);$('result-percent').textContent=String(Math.round(resultTarget*(1-Math.pow(1-p,3))));if(p<1)resultFrame=requestAnimationFrame(tick);}$('result-percent').textContent='0';resultFrame=requestAnimationFrame(tick);resultTimer=setTimeout(()=>$('results-card').classList.remove('is-celebrating'),1750);}
function reviewQuestion(index){attempt(()=>{engine.move(index);selecting=false;stopResultMotion();render();focusQuestion();});}
function resultIcon(correct){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',correct?'m5 12 4 4L19 6':'m6 6 12 12M18 6 6 18');svg.append(p);return svg;}
function showResults(celebrate=false){
 const s=engine.current(),stats=s&&engine.statistics(s);if(!stats||!stats.complete)return;closeCatalog();selecting=false;resultTarget=stats.percent;$('selection-card').hidden=true;$('quiz-card').hidden=true;$('results-card').hidden=false;document.body.classList.add('result-view');
 $('result-context').textContent=engine.schoolInfo().label+' · '+node().title+' · '+DEPTHS[s.depth]+(s.redo?' · 本組重答':'');$('result-percent-accessible').textContent='本組答對率 '+stats.percent+'%。';$('result-correct').textContent=String(stats.correct);$('result-wrong').textContent=String(stats.wrong);
 $('result-message').textContent=stats.correct===10?'十題全數答對。可以回看解析，或選擇下一組練習。':stats.correct===0?'十題已完成。從解析開始，逐題釐清。':'本組答對 '+stats.correct+' 題，還有 '+stats.wrong+' 題可回看解析。';
 $('review-wrong').disabled=stats.wrong===0;$('review-wrong').textContent=stats.wrong?'回看 '+stats.wrong+' 題待複習':'本組沒有待複習題';
 $('result-map').replaceChildren(...s.answers.map((a,i)=>{const correct=a===engine.question(s,i).correct,button=document.createElement('button');button.className='result-key'+(correct?'':' wrong');button.dataset.question=String(i+1);button.setAttribute('aria-label','第 '+(i+1)+' 題，'+(correct?'答對':'待複習')+'，回看解析');button.append(textElement('span',String(i+1).padStart(2,'0')),resultIcon(correct));button.addEventListener('click',()=>reviewQuestion(i));return button;}));
 $('complete').hidden=false;const next=s.depth+1,legal=engine.available(s.node,next);$('upgrade').disabled=!legal;$('upgrade').textContent=next<=2?DEPTHS[next]+' · 新的10題':'已達最高深度';$('upgrade-reason').textContent=next<=2&&!legal?countLabel(engine.bank(s.node,next))+'：'+engine.unavailableReason(s.node,next):'';$('new-set').disabled=!engine.canDraw();$('new-set-reason').textContent=engine.canDraw()?'':engine.drawReason();
 if(celebrate)animateResult();else stopResultMotion();$('results-title').focus({preventScroll:true});$('results-card').scrollIntoView({block:'start'});say('十題已完成。答對 '+stats.correct+' 題，待複習 '+stats.wrong+' 題。');messages();
}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>panelMode===b.dataset.panel?closeCatalog(true):showPanel(b.dataset.panel,b.dataset.panel==='catalog')));
document.querySelectorAll('[data-drawer-mode]').forEach(b=>b.addEventListener('click',()=>showPanel(b.dataset.drawerMode)));
$('panel-close').addEventListener('click',()=>closeCatalog(true));$('back-to-quiz').addEventListener('click',()=>closeCatalog(true));
dialog.addEventListener('cancel',e=>{e.preventDefault();closeCatalog(true);});dialog.addEventListener('close',()=>{panelMode=null;panel.hidden=true;document.body.style.overflow='';reflectPanel();});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeCatalog(true);}});
$('start-set').addEventListener('click',()=>attempt(draw));$('resume-set').addEventListener('click',()=>attempt(()=>{selecting=false;render();closeCatalog();if(engine.statistics().complete)showResults(false);else focusQuestion();}));
$('previous').addEventListener('click',()=>reviewQuestion(Math.max(0,engine.current().at-1)));$('next').addEventListener('click',()=>reviewQuestion(Math.min(9,engine.current().at+1)));
function reset(){attempt(()=>{engine.reset();selecting=false;stopResultMotion();render();focusQuestion();say('本組十題答案與統計已清空，原題、題序及選項順序均保留。');});}
$('reset').addEventListener('click',reset);$('result-reset').addEventListener('click',reset);$('view-results').addEventListener('click',()=>showResults());
$('review-all').addEventListener('click',()=>reviewQuestion(0));$('review-wrong').addEventListener('click',()=>{const s=engine.current(),i=s.answers.findIndex((a,j)=>a!==engine.question(s,j).correct);if(i>=0)reviewQuestion(i);});
$('new-set').addEventListener('click',()=>attempt(draw));$('upgrade').addEventListener('click',()=>attempt(()=>{if(drawing)return;drawing=true;try{engine.upgrade();selecting=false;stopResultMotion();render();focusQuestion();}finally{setTimeout(()=>{drawing=false;},350);}}));
$('finish').addEventListener('click',()=>{selecting=true;stopResultMotion();render();showPanel('catalog',true);});
motion.addEventListener('change',stopResultMotion);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopResultMotion();});
buildTree();buildSchools();if(!engine.restoreSelection())engine.select(engine.data.nodes[0].id,0);render();
})();
</script></body></html>
