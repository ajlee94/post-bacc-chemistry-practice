"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-S050","stem":"顏料、清潔用品、包裝與電子顯示元件的用途不同。哪項化學工作可共同支援這些日常產品？","concept":"日常產品藉由物質性質完成呈色、清潔、保護或顯示等不同功能。化學可以共同支援它們，但研究仍須對準各自用途與材料。原料純度和主要成分是部分資訊，不能直接保證完整功能；使用中的條件也可能影響表現，因此需把材料性質與實際需求連起來。","correct":"B","options":[{"id":"A","text":"只確認原料純度，便判定產品已具有全部所需功能","explanation":"錯誤：純度資訊不足以確認產品所有用途性能。"},{"id":"B","text":"研究各產品材料的性質，並對照各自的使用需求","explanation":"正確：各產品都可利用材料性質研究支援相應需求。"},{"id":"C","text":"只比較主要成分名稱，便判定同名材料可互換","explanation":"錯誤：同名成分不保證不同材料可直接互換。"},{"id":"D","text":"只研究使用前材料，不需了解使用條件下的表現","explanation":"錯誤：使用條件下的表現是用途判斷的重要資訊。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]}]},{"depth":"基礎讀","target":100,"questions":[{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B001","stem":"為改善廢水處理，甲材料能移除目標污染物，但使用時會釋出另一物質；乙材料移除較少，卻未見該釋出現象。若要比較兩者，哪項判斷最適當？","concept":"環境材料的功能在於處理污染物，但材料本身也可能改變環境中的物質組成。甲的移除性能是效益，釋出物則需要辨認與評估；乙的表現也要連到處理需求。不能只用其中一個指標決定所有環境效果，應把功能與可能新增的物質影響一起比較。","correct":"C","options":[{"id":"A","text":"只比較兩者使用前的主要成分，便判定其處理後環境效果","explanation":"錯誤：使用前主要成分不能直接代表處理後的物質影響。"},{"id":"B","text":"只依是否釋出選乙，移除效果不必考慮","explanation":"錯誤：移除性能仍決定材料能否達到處理需求。"},{"id":"C","text":"同時研究移除性能及釋出物的性質與影響","explanation":"正確：兩項資訊合用才同時回應用途與環境目標。"},{"id":"D","text":"只依移除量選甲，將目標污染物減少視為整體影響降低","explanation":"錯誤：目標物減少未排除釋出物帶來的其他影響。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B002","stem":"某回收材料成分符合需求，但接觸使用液體後容易失去性能；另一回收材料成分不同，卻能維持功能。若目標是取代現有原料，應如何研究？","concept":"資源保育需要回收原料，但可回收不等於能直接替代某用途材料。材料組成與使用性能都要符合要求，尤其本題指出接觸液體後有差異。因此應把兩種資料連起來，判斷是否需要再處理或改良；任何單一資訊都不足以自動完成替代判斷。","correct":"C","options":[{"id":"A","text":"只按成分符合選前者，不需考慮使用後表現","explanation":"錯誤：忽略使用後性能會漏掉題目的失效問題。"},{"id":"B","text":"只按回收來源判定兩者都能直接取代","explanation":"錯誤：回收來源不能保證材料符合特定用途。"},{"id":"C","text":"把回收材料的組成與使用條件下的性質一併核對","explanation":"正確：組成和使用性質共同決定能否替代原料。"},{"id":"D","text":"只按使用後表現選後者，不需核對其他要求","explanation":"錯誤：維持功能仍需連同其餘材料要求核對。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B003","stem":"新方法每製作一片同規格材料需原料4 g，舊方法需5 g。兩者都能維持指定性能。製作100片時，新方法直接節省多少原料？","concept":"化學材料改良若在相同功能下減少原料，可支援自然資源保育。本題每片少用5−4＝1 g，100片共少用100 g。也可分別算舊方法500 g、新方法400 g，再取差100 g核對。這是原料節省量，不由此推論能源或健康影響也必定改善。","correct":"C","options":[{"id":"A","text":"500 g","explanation":"錯誤：500 g是舊方法總用量。"},{"id":"B","text":"20 g","explanation":"錯誤：20是每片相對舊方法的節省百分數，不是總克數。"},{"id":"C","text":"100 g","explanation":"正確：每片省1 g，100片省100 g。"},{"id":"D","text":"400 g","explanation":"錯誤：400 g是新方法總用量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B004","stem":"設計能源裝置材料時，團隊測得候選甲的使用性能較好，候選乙的製造原料需求較少。何者最正確？","concept":"能源供應與資源保育都會涉及化學材料，但它們不是同一指標。裝置所需性能和製造原料用量可能各有優勢，不能由其中一項推算另一項。本題應保留兩方面結果，再按用途要求研究取捨或改良方向；物質性質是連結材料選擇與公共目標的基礎。","correct":"B","options":[{"id":"A","text":"原料較少就必定具有較好的能源性能","explanation":"錯誤：原料減少不自動提高裝置性能。"},{"id":"B","text":"能源用途與資源消耗需用各自資料共同評估","explanation":"正確：不同目標需相應證據，兩者都與化學有關。"},{"id":"C","text":"只要兩者都用於能源，便不需分析材料差異","explanation":"錯誤：相同能源用途仍可能有不同材料性質。"},{"id":"D","text":"性能較好就必定耗用較少原料","explanation":"錯誤：題目沒有性能與原料用量必然同步的關係。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B005","stem":"研究員想了解某材料的污染物是否由土壤移到水中。下列哪組工作最能直接回答？","concept":"要研究污染物是否從土壤移入水中，需要知道不同位置是否出現目標物質，並把這些資料與物質的運輸行為連起來。只看起點樣品會缺少到達位置的資訊，總質量不能分辨成分，模型預測也不等於現場量測。分析與行為研究互相支援，才能釐清物質的去向。","correct":"B","options":[{"id":"A","text":"只分析土壤起點的一份樣品，直接代表水中的物質狀況","explanation":"錯誤：起點的一份土壤資料未直接確認物質是否到達水中。"},{"id":"B","text":"分析不同位置的目標物質，並研究其運輸行為","explanation":"正確：物質分析與運輸研究直接回應土壤到水的問題。"},{"id":"C","text":"只以物質運輸模型預估水中含量，便當成已確認的移動結果","explanation":"錯誤：模型提供預測，仍需相應位置的實測資料檢查。"},{"id":"D","text":"只分析同一水樣的總質量，代替不同位置的目標物質分析","explanation":"錯誤：總質量未辨認目標物質，也沒有位置間的比較。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文1、6、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B006","stem":"同樣達到建材使用要求的兩方案，甲需原料90 g，乙需72 g。每件以甲為基準，乙的原料用量減少比例為何？","concept":"原料節省比例要用節省量除以原比較基準。乙比甲少用90−72＝18 g，以甲90 g為基準，比例為18÷90＝0.20，即20%。乙仍使用原本的80%，兩者不可混淆。題目限定兩方案滿足相同用途，這使原料用量的比較具有明確意義。","correct":"D","options":[{"id":"A","text":"25%","explanation":"錯誤：18÷72為25%，分母用了新方案而非指定基準。"},{"id":"B","text":"18%","explanation":"錯誤：18是節省的克數，不能直接當成百分比。"},{"id":"C","text":"80%","explanation":"錯誤：80%是剩餘用量占基準的比例。"},{"id":"D","text":"20%","explanation":"正確：18÷90×100%＝20%。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B007","stem":"水處理材料的功能是移除物質X。測試後X減少，但分析發現物質Y增加。何者最能說明化學對此環境問題的作用？","concept":"水中不只存在目標物質X。X減少提供去除功能的資訊，Y增加則是另一項成分變化，兩者可以同時發生。即使起始材料不含Y，也不能單憑這點排除使用過程中的物質變化。化學研究應辨認並評估兩者，避免只看一種成分就下全水樣無害的結論。","correct":"C","options":[{"id":"A","text":"只確認處理材料原先不含Y，便排除處理過程與Y增加有關","explanation":"錯誤：起始材料不含Y，仍不能單憑此排除使用過程中的物質變化。"},{"id":"B","text":"Y增加就證明X減少的分析一定錯誤","explanation":"錯誤：不同物質的增減可以同時出現。"},{"id":"C","text":"除了確認X的變化，也須辨認Y及其影響","explanation":"正確：同時追蹤目標物與新增物才回應完整物質問題。"},{"id":"D","text":"X減少就證明水中所有物質皆已無害","explanation":"錯誤：一種物質減少不代表所有成分都無害。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B008","stem":"某研究以改善醫療接觸材料為目的。甲組測其使用功能，乙組研究接觸人體後的物質影響。兩組工作如何相互補充？","concept":"接觸材料既要能完成預期功能，也需要了解它在相應人體接觸條件下的影響。兩組分別提供這兩面資料，因此可以互相補足。功能測試不能代替接觸研究，純度也不能包辦接觸後的全部物質行為；已有結果仍需對照測試條件使用，不能無條件推廣。","correct":"D","options":[{"id":"A","text":"只要甲組測得功能良好，就可將乙組結果外推到所有接觸方式","explanation":"錯誤：功能良好不擴大接觸研究結果的適用條件。"},{"id":"B","text":"乙組只需確認材料純度，便能代替接觸後的物質影響研究","explanation":"錯誤：純度與接觸後影響提供不同資訊。"},{"id":"C","text":"甲組的功能結果可直接取代乙組所有研究","explanation":"錯誤：功能效果與接觸影響回答不同問題。"},{"id":"D","text":"分別提供用途效果與接觸影響的化學資訊","explanation":"正確：兩類資訊共同支援醫療材料的用途評估。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B009","stem":"工廠希望減少原料消耗，回收所得材料卻含有會妨礙原用途的成分。最直接的化學改良方向為何？","concept":"回收要真正替代原料，需要回收物具有用途所需性質。已知其中某成分會妨礙用途，就應從組成分析、處理方式及性能檢查著手。主要原料含量足夠或回收總量增加，都未排除其他成分的影響；原產品規格也不能直接代表回收後狀態，仍須確認實際材料品質。","correct":"C","options":[{"id":"A","text":"只確認回收物中主要原料含量足夠，便忽略妨礙用途的其他成分","explanation":"錯誤：主要原料足量未排除其他成分造成的性能問題。"},{"id":"B","text":"只增加回收總量，不分析回收材料","explanation":"錯誤：增加量不能排除妨礙用途的成分。"},{"id":"C","text":"研究回收材料的組成與處理，使其能符合所需性質","explanation":"正確：組成處理與性質驗證能回應回收用途缺口。"},{"id":"D","text":"只核對原產品製造前的規格，直接作為回收物的再用依據","explanation":"錯誤：製造前規格不能代替回收後材料的實際狀態。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B010","stem":"兩種清洗方法能完成同一清潔任務。甲每次使用材料6 g並排出含X的廢液；乙每次用4 g，但廢液含Y。僅依題目可以得到哪項結論？","concept":"原料用量和廢液性質是兩項不同的化學資訊。由6−4＝2 g可確定乙每次材料用量較少，但X、Y的身分及影響沒有給出，不能直接比較整體環境安全。本題可支持有限的資源減量結論，並指出需進一步做物質分析的部分。","correct":"A","options":[{"id":"A","text":"乙每次少用2 g材料，廢液影響仍需研究","explanation":"正確：用量差可計算，廢液影響需要其他資料。"},{"id":"B","text":"X與Y必定是同一種污染物","explanation":"錯誤：不同代號未被題目定義為同一物質。"},{"id":"C","text":"乙的所有環境影響一定較小","explanation":"錯誤：較少用量不等於所有排放影響較小。"},{"id":"D","text":"甲的廢液一定比乙更安全","explanation":"錯誤：沒有X、Y的性質資料，不能排序安全性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文1、7。","example":"","pointId":"WHY-P01","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B011","stem":"甲研究特殊處理的矽用於太陽能板，乙研究有機發光材料用於OLED顯示器。要判斷兩項候選是否適合各自用途，哪項做法最充分？","concept":"太陽能板與OLED的功能不同，但都需要相應材料性質支持。候選是否合用，應由實際使用條件下的性能與功能要求比較。成分分析、原料資料與模型預測可協助設計，卻各有資訊範圍；它們不能直接代替處理後候選的使用性能。這正是化學連接材料研究與科技用途的方式。","correct":"D","options":[{"id":"A","text":"各自只分析主要成分，將成分合格當成用途性能合格","explanation":"錯誤：成分合格未直接確認用途所需性能。"},{"id":"B","text":"各自只測原料的性質，將結果直接當成處理後候選的性能","explanation":"錯誤：原料資料未必代表處理後候選的表現。"},{"id":"C","text":"各自只計算預期性能，將模型排名當成實際用途比較","explanation":"錯誤：預測排名尚未構成實際材料的性能比較。"},{"id":"D","text":"各自取得候選在相應使用條件下的性能資料，再對照功能要求","explanation":"正確：候選的性能資料與各自功能要求直接對應。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B012","stem":"螢火蟲閃光涉及體內反應，OLED利用材料發光供顯示。即使兩者出現相近的光色，下列哪項判斷仍恰當？","concept":"生物發光與顯示材料都涉及物質，但相似的可見表現不一定來自相同的物質或行為。光色是觀察資訊，不能單獨完成成分鑑別，也不能包辦反應期間的全部變化。研究者仍需針對各自系統分析物質及相關性質，才能形成對發光現象有依據的化學解釋。","correct":"D","options":[{"id":"A","text":"光色相近即可判定發光物質的成分相同","explanation":"錯誤：相近光色不是成分相同的充分證據。"},{"id":"B","text":"光色相近即可將一者的全部物質行為套用到另一者","explanation":"錯誤：一項共同表現不足以推廣全部物質行為。"},{"id":"C","text":"光色相近即可用同一項觀察確定兩者發光期間的全部變化","explanation":"錯誤：單項光色觀察未完整描述發光時的物質變化。"},{"id":"D","text":"兩者都可從化學研究，但相近光色不足以確認其物質與行為相同","explanation":"正確：共同現象可引起研究，仍須分別取得物質證據。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B013","stem":"某報告把「矽材料的太陽能板」與「OLED顯示器」都稱為化學成果，卻推論兩者應有相同材料性質。主要問題是什麼？","concept":"化學支援不同科技的方式，是理解並取得各用途所需的材料性質。太陽能板與顯示器都涉及化學，並不表示兩者的材料、要求或性能必須相同。共同的研究基礎與具體用途差異可以並存；選材仍要回到各裝置的需求。","correct":"A","options":[{"id":"A","text":"不同用途涉及化學，不表示所需性質相同","explanation":"正確：共同學科基礎不能推出所有性能要求相同。"},{"id":"B","text":"只有先證明兩者材料來源不同，才可以比較用途性質","explanation":"錯誤：來源相同或不同都可以比較材料性質，無此先決限制。"},{"id":"C","text":"只要兩者原料都很純，就足以證明所需性能相同","explanation":"錯誤：高純度不代表兩種用途的性能需求相同。"},{"id":"D","text":"只要兩者曾各有一次性能合格，就足以證明其材料可以互換","explanation":"錯誤：分別合格不能證明材料在另一用途也合用。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B014","stem":"研究員製得OLED候選材料後，測其在指定使用條件下的發光表現。這項量測最直接回答哪個問題？","concept":"製得材料後，量測指定條件下的發光表現，可以把候選的實際性質與顯示需求對照。這份資料直接回答所測功能，卻不直接給出所有成分含量、其他條件的性能或完整發光原因。區分資料能回答的問題，才能把量測、成分分析及行為解釋用在合適的位置。","correct":"B","options":[{"id":"A","text":"該候選在其他尚未測試的條件下是否也符合全部顯示要求","explanation":"錯誤：本次指定條件的測試未涵蓋其他未測條件。"},{"id":"B","text":"該候選材料是否呈現顯示用途所需的性質","explanation":"正確：量測直接對照OLED候選的顯示功能。"},{"id":"C","text":"該候選每一種成分的含量是否都已完整確認","explanation":"錯誤：發光量測不等於完整成分含量分析。"},{"id":"D","text":"該候選的發光行為是否已獲得完整原因解釋","explanation":"錯誤：量得表現提供解釋的依據，不表示原因已完整確定。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B015","stem":"某藥物研發流程為：提出候選設計、製得候選物質、測量性質。要判斷「新物質是否已實際做出」，最關鍵的是哪項成果？","concept":"藥物設計與製備是相關但不同的活動。設計和模擬可以提出有希望的候選，只有取得實際物質才直接證明製備完成。之後量測仍用來了解性質，不能僅憑製得樣品就宣稱用途與安全性全部成立；本題只辨認製造這一步。","correct":"C","options":[{"id":"A","text":"已列出既有藥物的用途","explanation":"錯誤：既有用途清單不證明新候選已製備。"},{"id":"B","text":"已建立未製備候選的模擬圖","explanation":"錯誤：模擬圖是模型輸出，並非材料實物。"},{"id":"C","text":"已取得候選物質樣品","explanation":"正確：實際樣品直接對應物質製備的成果。"},{"id":"D","text":"已提出候選性質的預測","explanation":"錯誤：預測可在沒有樣品時提出。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B016","stem":"一名學生研究螢火蟲發光的化學反應，另一名研究OLED材料的發光性質。對兩項研究對象，何者適當？","concept":"螢火蟲提供體內反應的例子，OLED則是顯示元件的材料應用。兩者都能運用化學研究，仍需依各自對象取得性質與行為資料。即使發光強度或光色相近，也不能直接認定材料相同、條件可互換或行為全部一致；比較時應保留系統與研究問題的差別。","correct":"C","options":[{"id":"A","text":"若量得發光強度相同，便可推定其發光物質相同","explanation":"錯誤：相同強度不足以辨認發光物質。"},{"id":"B","text":"若光色相近，便可將OLED材料的使用條件直接套用於生物反應","explanation":"錯誤：光色相近不保證兩個系統適用相同條件。"},{"id":"C","text":"前者研究生物體內反應，後者研究人造顯示元件材料","explanation":"正確：兩者分別對應生物現象與顯示科技。"},{"id":"D","text":"若各有一項發光數據，便已足以比較兩者全部物質行為","explanation":"錯誤：單項發光數據未涵蓋全部物質行為。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B017","stem":"甲研究特殊處理矽材料，乙研究顯示元件，丙研究新藥。三者最合理的共同研究方向為何？","concept":"化學家可服務能源、科技與醫學等不同領域，共同任務是理解物質性質如何支援功能。矽材料、顯示元件和藥物不必有相同成分或來源，卻都需符合各自需求。來源資訊有助追溯，但不是用途性能的完整答案，仍須材料研究與測量。","correct":"C","options":[{"id":"A","text":"只要候選原料純度提高，就判定各自所有功能必定改善","explanation":"錯誤：純度提高不直接保證所有功能都改善。"},{"id":"B","text":"只要候選主要成分符合設計，就省略實際性能的研究","explanation":"錯誤：成分符合設計仍需用途性能的證據。"},{"id":"C","text":"建立各材料性質與預期功能的連結","explanation":"正確：性質與功能的連結可統整三種化學應用。"},{"id":"D","text":"只要一個候選在原條件合格，就推定它在新使用條件也合用","explanation":"錯誤：新條件可能需要不同的性能資料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B018","stem":"OLED候選甲在接觸介質L的指定測試中發光穩定。現在打算改成接觸介質M，但尚未測試。能否直接認定甲在M中仍符合發光需求？","concept":"材料在一種條件下表現良好，能支持該條件的用途判斷，卻不能直接代表另一種接觸環境。換成M後是否仍合格，需要相應的性能資料。沒有新資料既不能宣布必定合用，也不能只因介質名稱不同就宣布必定失效；應把候選性質與實際使用條件一起檢查。","correct":"D","options":[{"id":"A","text":"不能，L與M名稱不同就足以證明甲在M中必定失效","explanation":"錯誤：介質不同提示需確認，尚未證明必定失效。"},{"id":"B","text":"可以，同一材料的發光性能不需要區分接觸條件","explanation":"錯誤：同一材料在不同接觸條件下仍需檢查表現。"},{"id":"C","text":"可以，只要甲的起始成分不變，接觸後性能就已確定","explanation":"錯誤：起始成分相同不保證接觸後的性能相同。"},{"id":"D","text":"不能直接認定，仍需取得與M接觸條件相應的性能資料","explanation":"正確：原條件的合格結果不能直接代替新條件測試。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B019","stem":"研究者以特殊處理矽製成候選能源材料，另一組量測它的性質。何者正確區分應用領域與研究方法？","concept":"應用領域說明研究服務何種需求，工作類型說明實際取得什麼成果。此例以能源為用途，製備取得候選材料，量測取得其性質數據。材料存在不等於能源性能已合格，量得數據也不直接代表已完成改良。即使一項數據符合設計，仍需針對其他性能及解釋補足證據。","correct":"B","options":[{"id":"A","text":"只要候選已製得，就代表它的能源用途性能已通過檢查","explanation":"錯誤：實物完成與用途性能合格是不同成果。"},{"id":"B","text":"能源是用途領域，製備與量測是不同工作類型","explanation":"正確：用途與活動是兩個不同但可同時描述的面向。"},{"id":"C","text":"只要量到矽的性質，就表示已實際改良能源材料","explanation":"錯誤：取得性質資料不等於已製出改良材料。"},{"id":"D","text":"只要量測結果符合一項設計值，就能證實全部性能的解釋","explanation":"錯誤：一項符合不足以驗證全部性能解釋。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B020","stem":"新藥材料的預測性質優於舊候選，但尚未製備。若接著要比較實際物質表現，最合理的流程為何？","concept":"模型可提供新藥候選的預期性質，但要比較實際表現，仍需實物及量測資料。先製備新候選，再和舊候選在相應條件下測量，才能檢查預測。兩種候選不應直接共用全部數據；原料來源也不能單獨回答用途性能。","correct":"A","options":[{"id":"A","text":"製備新候選，再在相應條件下量測比較","explanation":"正確：有實物並量測，才可比較真實性能。"},{"id":"B","text":"直接沿用舊候選的全部實測值，作為新候選的結果","explanation":"錯誤：不同候選的性質可能不同，舊值不能代替新實測。"},{"id":"C","text":"直接把模型結果列成實測比較","explanation":"錯誤：模型計算不能直接標成實際測量。"},{"id":"D","text":"只看新候選來源是否天然來決定","explanation":"錯誤：天然來源不能取代藥物物質表現研究。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文2、4。","example":"","pointId":"WHY-P02","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B021","stem":"某清潔材料在10分鐘測試中去污效果較好，另一研究發現其接觸某表面會造成損傷。何者最合理？","concept":"同一物質對污垢與接觸表面可以有不同作用。去污效果說明用途功能，表面損傷則指出某種使用限制，兩者不必矛盾。平衡判斷需把兩方面連到實際清潔需求，研究是否改良材料或使用方式；來源類型不能代替作用資料。","correct":"B","options":[{"id":"A","text":"去污效果好就表示表面損傷必為量測錯誤","explanation":"錯誤：清潔功能不能排除另一種材料作用。"},{"id":"B","text":"應同時考慮去污功能與接觸材料的影響","explanation":"正確：兩面都是化學用途判斷所需資訊。"},{"id":"C","text":"表面有損傷就表示材料沒有任何清潔作用","explanation":"錯誤：接觸損傷不會否定已測得的去污效果。"},{"id":"D","text":"只看清潔材料來自天然或人工即可決定","explanation":"錯誤：天然或人工來源不足以決定適用性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B022","stem":"農用材料甲與乙的保護作物效果相近。相同使用條件下，甲在水中留下物質X，乙留下物質Y；兩者性質尚未知。哪個結論適當？","concept":"用途效果相近不表示使用後的物質相同，也不表示環境影響相同。X與Y只是代號，並未提供危害或行為資料。化學可透過辨認與測量這些物質，補上環境比較所缺資訊。未檢出某一物質也不能自動代表另一材料完全無害。","correct":"A","options":[{"id":"A","text":"仍需分析X與Y的性質，才能比較水域影響","explanation":"正確：物質性質資料是比較環境後果的依據。"},{"id":"B","text":"兩者作物效果相同，故水域影響相同","explanation":"錯誤：作物效果不是水域影響的替代指標。"},{"id":"C","text":"乙必定無害，因未檢出X","explanation":"錯誤：未有X仍需了解Y和其他相關影響。"},{"id":"D","text":"只要甲留下的X量較多，就可不考慮性質直接判定甲較有害","explanation":"錯誤：不同物質的影響仍取決於其性質與使用情境，不能只比量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B023","stem":"某材料已證明能提高建材使用壽命，但製造時需要處理一種有害副產物。最合宜的研究目標為何？","concept":"有益功能與製程問題可以同時存在。研究可以在維持所需建材性質的前提下，分析副產物並改善處理，使產品的用途和可能負面影響一起被考慮。名稱改變不會改變物質性質；只顧任一面也不能完成原先兼顧功能與影響的目標。","correct":"A","options":[{"id":"A","text":"保留用途性能，並研究如何降低副產物相關影響","explanation":"正確：兼顧材料功能與副產物影響。"},{"id":"B","text":"只提高原料純度，便視為已證明副產物無害","explanation":"錯誤：原料純度與副產物的影響是不同問題，仍須對副產物研究。"},{"id":"C","text":"只降低副產物，完全不再檢查用途性能","explanation":"錯誤：用途性能仍是新材料能否使用的必要資訊。"},{"id":"D","text":"保留用途性能，便視為副產物已無害","explanation":"錯誤：使用壽命不會決定副產物是否有害。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B024","stem":"兩種材料都能完成指定清潔任務。甲的接觸測試顯示損傷較少，乙的排放物研究顯示環境影響較低。何者正確？","concept":"化學材料評估常含多種不同性質。接觸表面受到的影響與排出物對環境的影響各有意義，不能由某一面較佳推定另一面必定相同。兩者已滿足清潔功能，後續應按用途要求衡量其他影響或尋找改良方向，而不是直接給出全面優劣。","correct":"B","options":[{"id":"A","text":"接觸損傷和排放影響可當成同一物質性質","explanation":"錯誤：兩者回答不同對象和階段的物質問題。"},{"id":"B","text":"兩者各有已知優勢，仍須按接觸與環境要求綜合評估","explanation":"正確：保留不同性質結果，連到實際要求作判斷。"},{"id":"C","text":"乙在所有接觸條件下也必定損傷較少","explanation":"錯誤：排放研究不能直接推出所有接觸表現。"},{"id":"D","text":"甲對任何用途都較佳","explanation":"錯誤：題目只支持甲在指定接觸測試的優勢。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B025","stem":"某產品由天然物質製成，且已測得良好清潔效果。以下哪項仍不能僅憑這兩項資料確定？","concept":"天然來源回答原料從哪裡取得，清潔測試回答指定條件下的功能。兩者都沒有涵蓋所有接觸與排放後果，所以不能推出全面無害。天然物質同樣具有可研究的化學性質，也可能有正面或負面影響；用途資料應與影響資料分開理解。","correct":"C","options":[{"id":"A","text":"該產品在測試條件下有清潔作用","explanation":"錯誤：指定條件的清潔功能已有測試支持。"},{"id":"B","text":"原料具有天然來源","explanation":"錯誤：天然來源是題目已給資訊，不是尚不能確定者。"},{"id":"C","text":"所有接觸方式與排放情境皆無害","explanation":"正確：全面無害超出了所提供的來源與功能資料。"},{"id":"D","text":"該產品可作為化學用途的研究對象","explanation":"錯誤：天然清潔材料仍可研究其物質性質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B026","stem":"新包裝在使用中能保護內容物，但用後產生的物質可能影響河川。哪個比較最直接保留兩項化學資訊？","concept":"包裝的保護功能與使用後物質的環境行為，分別描述不同階段的作用。化學能研究這兩面並協助改良，因此不必在「有用」與「可能有害」之間只留一項。具體的物質、條件與結果比天然或人工標籤更能支撐用途評估。","correct":"B","options":[{"id":"A","text":"只確認使用前材料純度，就推定保護功能與河川影響均符合要求","explanation":"錯誤：起始純度未直接測得保護功能或用後環境行為。"},{"id":"B","text":"分別檢查保護功能與用後物質的環境行為","explanation":"正確：兩面研究能形成較完整的材料判斷。"},{"id":"C","text":"因保護效果好，河川影響必為零","explanation":"錯誤：保護性能不會消除用後物質的可能影響。"},{"id":"D","text":"因可能影響河川，包裝性能必為零","explanation":"錯誤：環境問題不表示包裝未發揮原功能。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B027","stem":"研究員比較兩種替代農用材料。甲所需用量較少，乙使用後形成的物質較易被追蹤。僅依此資訊，哪項研究最能補足「何者環境影響較低」的判斷？","concept":"用量較少與容易追蹤各是部分資訊，不能直接等同整體環境影響低。環境判斷需要了解實際使用後物質如何移動及造成什麼影響。化學分析和運輸研究可補上這些資料；容易量到某物質也不表示它毒性較低，量少也不自動回答全部影響。","correct":"C","options":[{"id":"A","text":"只把甲的用量較少解讀為所有危害較低","explanation":"錯誤：用量資訊不足以推出所有危害結果。"},{"id":"B","text":"只再比較甲乙的每瓶內容物重量","explanation":"錯誤：瓶重不等於環境中的物質行為。"},{"id":"C","text":"兩方案在相應使用條件下的物質去向與影響","explanation":"正確：相應的物質行為與影響資料直接補比較缺口。"},{"id":"D","text":"只把乙的易追蹤性解讀為毒性較低","explanation":"錯誤：可追蹤程度與毒性是不同性質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文3、6、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B028","stem":"某建材接觸液體L時性能良好，接觸液體M時卻失去所需性質。哪個說法最精確？","concept":"材料的行為要連同使用條件理解。接觸不同液體可以產生不同表現，因此在L中的性能不能直接推廣到M，也不能因M失效就刪除L的有效結果。化學研究幫助把物質與接觸條件連起來，讓用途與限制都有清楚依據。","correct":"C","options":[{"id":"A","text":"在L中良好可直接抵消M中的性能損失","explanation":"錯誤：一種條件的好表現不會消除另一條件的失效。"},{"id":"B","text":"在M中失效表示L中的測量沒有意義","explanation":"錯誤：L的結果仍描述該條件下的實際性能。"},{"id":"C","text":"材料適用性與接觸條件有關，兩種液體須分別判斷","explanation":"正確：兩種接觸條件各有對應的材料行為。"},{"id":"D","text":"材料只能有一種性質，因此兩結果必相矛盾","explanation":"錯誤：不同條件下的結果不同不必然矛盾。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B029","stem":"清洗劑甲每次排出目標物質2 mg，乙每次1 mg；甲需用2次，乙需用5次才能完成同一任務。只比較此物質的總排出量，何者較少？","concept":"比較排出量必須採同一清潔任務的基準。甲的總量為2 mg/次×2次＝4 mg，乙為1 mg/次×5次＝5 mg，所以甲少1 mg。單次較低不代表完成任務的總量較低。這只比較題設同一物質的量，不能代替全部排放物與環境影響評估。","correct":"D","options":[{"id":"A","text":"乙，總量5 mg，甲為10 mg","explanation":"錯誤：甲應乘自己的2次，不是乙的5次。"},{"id":"B","text":"兩者相同，因都能完成任務","explanation":"錯誤：任務相同不使排出量相同。"},{"id":"C","text":"乙，因單次只有1 mg","explanation":"錯誤：忽略乙需要較多次使用。"},{"id":"D","text":"甲，總量4 mg，乙為5 mg","explanation":"正確：4 mg小於5 mg，甲較少。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B030","stem":"相同用途的材料甲排出X，乙排出Y。雖然X的質量比Y少，仍不能直接說甲的環境影響較低，主要原因是什麼？","concept":"環境影響與排出物的身分、性質及行為有關，不只是總質量。若X、Y不是同一物質，少量X未必比多量Y影響低；需有對應的化學與環境資料才能判斷。質量仍有價值，只是不能單獨跨物質代表全部影響。","correct":"D","options":[{"id":"A","text":"只要把X和Y改為相同質量比較，就可忽略物質性質","explanation":"錯誤：相同質量的不同物質仍可能有不同影響。"},{"id":"B","text":"X的排出量較少，就表示X在環境中一定較容易被移除","explanation":"錯誤：排出量較少不等於在環境中較易被移除。"},{"id":"C","text":"所有排出物的環境影響都只由質量決定","explanation":"錯誤：物質身分、性質和使用條件同樣關係到影響。"},{"id":"D","text":"不同物質的性質與環境行為仍須了解","explanation":"正確：物質身分與行為是尚缺的關鍵資訊。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48；部分1 PDF頁 50；已審筆記頁 正文3、7。","example":"","pointId":"WHY-P03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B031","stem":"某糖原料來自植物，精製後被分析為高純度產品。下列哪個概念組合可同時成立？","concept":"原料來自植物說明天然來源，精製說明取得產品的處理過程，成分分析則提供本批純度資料；三者可以同時成立。來源和加工經過不能代替實際分析，原料數據也不直接代表處理後組成。即使已確認高純度，特定用途是否適合仍需相應性質與條件的證據。","correct":"A","options":[{"id":"A","text":"天然來源、工業處理、材料分析","explanation":"正確：三項均由題目直接支持且彼此相容。"},{"id":"B","text":"天然來源、已經精製、因此不必分析便能知道本批精確純度","explanation":"錯誤：精製過程不直接給出本批精確純度數值。"},{"id":"C","text":"天然來源、只要原料曾經分析、便能直接代表精製後組成","explanation":"錯誤：處理前資料不能直接代替處理後產品分析。"},{"id":"D","text":"天然來源、已經精製、因此所有特定用途的適合性都已確認","explanation":"錯誤：精製與高純度不直接驗證所有使用方式。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B032","stem":"一袋糖已完成精製，但尚未進行本批成分分析。下列哪個判斷正確？","concept":"精製是一項材料處理活動，分析則是取得材料組成資料的方法。處理可以完成而分析尚待進行，不能把兩個活動視為同一件事。要知道本批實際純度或成分，仍需直接資料；天然來源或處理名稱不會自動產生精確含量。","correct":"B","options":[{"id":"A","text":"沒有分析就表示精製一定未發生","explanation":"錯誤：缺少分析不會證明沒有做過處理。"},{"id":"B","text":"已完成處理，仍需分析來確認本批組成","explanation":"正確：處理完成與成分確認屬不同工作。"},{"id":"C","text":"精製本身就是本批純度數值","explanation":"錯誤：程序名稱不是測得的純度數值。"},{"id":"D","text":"天然來源可直接補出本批所有成分含量","explanation":"錯誤：來源不能直接給出當前批次的含量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B033","stem":"同一植物來源的糖，經方法甲與乙精製後，測得雜質含量不同。何者最適當？","concept":"原料來源只描述起點，產品組成還可能受後續處理影響。兩種精製方法取得的材料可以有不同雜質含量，因此應保留實際分析結果來比較處理效果。同源不等於所有後續性質相同；工業處理也不妨礙品質分析，反而需要以分析確認產品。","correct":"A","options":[{"id":"A","text":"相同來源仍可因處理不同而有不同產品組成","explanation":"正確：來源與當前組成是不同資料。"},{"id":"B","text":"不同雜質含量證明兩者原料不可能相同","explanation":"錯誤：後續處理差異足以使產品組成不同。"},{"id":"C","text":"只要兩方法步驟數相同，就應得到相同雜質含量","explanation":"錯誤：步驟數相同沒有證明處理方式及效果相同。"},{"id":"D","text":"只要來源相同，就可用其中一份產品的分析代表另一份","explanation":"錯誤：同來源不保證不同處理後產品組成一致。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B034","stem":"題設兩份100 g糖產品，甲含目標糖98 g，乙含目標糖96 g，其餘為其他成分。哪項比較正確？","concept":"成分分析能支援精製產品的品質比較。總質量由目標糖與其他成分組成，甲的其他成分為100−98＝2 g，乙為100−96＝4 g。相同樣品質量不代表組成相同，甲的目標糖較多而其他成分較少；此結果本身不等於全面安全評估。","correct":"D","options":[{"id":"A","text":"甲含其他成分98 g，乙96 g","explanation":"錯誤：98 g與96 g是目標糖質量。"},{"id":"B","text":"乙的目標糖較多，因其他成分較多","explanation":"錯誤：其他成分增加不代表目標糖增加。"},{"id":"C","text":"兩者同為100 g，因此目標糖含量相同","explanation":"錯誤：總量相同仍可有不同組成。"},{"id":"D","text":"甲的目標糖較多，其他成分為2 g；乙為4 g","explanation":"正確：兩份的組分各加回100 g，比較一致。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B035","stem":"某精製糖的分析結果可回答其純度，卻未研究特定使用方式的影響。何者正確？","concept":"純度描述產品組成中目標物質的程度，使用適合性則還要看物質性質與具體用途。精製糖可來自天然原料並具有高純度，但這不能被擴大成所有使用方式都適合。不同問題需要各自資料，用途尚待研究不會自動使既有成分分析失效。","correct":"B","options":[{"id":"A","text":"有天然來源就不可能是高純度產品","explanation":"錯誤：天然來源與高純度可同時成立。"},{"id":"B","text":"高純度與特定用途是否合適，仍是不同問題","explanation":"正確：組成資料不能包辦所有用途和影響判斷。"},{"id":"C","text":"尚未研究用途表示純度分析無效","explanation":"錯誤：用途研究缺口與分析是否有效應分開看。"},{"id":"D","text":"高純度必定代表任何使用方式都適合","explanation":"錯誤：將純度擴大成任何用途的適用證明。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B036","stem":"研究者對同一批糖保留精製前的樣品，再取得精製後的樣品。欲確認處理是否改善成分品質，哪組比較最直接？","concept":"比較處理效果應針對同一批材料的處理前後，並在相同分析基準下取得組成資料。顆粒與顏色提供外觀資訊，程序步驟提供處理資訊，都不能直接代替純度分析。保留前後樣品並各自分析，才能用實際材料資料檢查精製後的成分品質。","correct":"A","options":[{"id":"A","text":"兩份樣品在相同分析基準下的組成","explanation":"正確：相同基準的成分結果能比較處理效果。"},{"id":"B","text":"只分析精製前的樣品，將結果直接填給精製後","explanation":"錯誤：處理可能改變組成，前值不能直接代填後值。"},{"id":"C","text":"只比較兩份樣品的顆粒外形與顏色","explanation":"錯誤：外觀比較未直接量測成分品質。"},{"id":"D","text":"只依精製程序的步驟數推定處理後的純度","explanation":"錯誤：處理步驟數不是純度測量結果。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B037","stem":"工廠從天然糖原料得到高純度產品，同時開發新型包裝組合。何者正確區分兩項工作？","concept":"天然糖可經工業精製取得產品，再用分析確認組成；新包裝則可透過不同物質的組合形成候選材料。兩者都涉及化學，但處理、製備與量測各提供不同成果。已知原料性質或已取得實物，不等於產品的所有性能已確定，仍應以相應資料確認品質與用途。","correct":"B","options":[{"id":"A","text":"只要糖完成精製，就已取得本批成分的精確量測值","explanation":"錯誤：精製完成不等於本批組成已經量測。"},{"id":"B","text":"糖可涉及精製與分析，包裝可涉及新材料組合的製備","explanation":"正確：依實際活動區分，兩者都涉及物質。"},{"id":"C","text":"只要包裝原料各自性能已知，就可直接確認新組合合用","explanation":"錯誤：個別原料資料不能直接取代新組合性能。"},{"id":"D","text":"只要新包裝製備完成，就可省略其用途性能量測","explanation":"錯誤：有候選實物不表示所需功能已驗證。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B038","stem":"同量原料分別用兩方法處理，甲得到80 g合需求糖產品，乙得到75 g；題設其餘條件相同。本次乙比甲少取得多少產品？","concept":"比較材料處理結果時，需要先確認比較的是合需求產品量。此處原料量及其餘條件相同，乙比甲少80−75＝5 g。155 g是兩者總和，不能當作差額；75與80各是單一方法的產出。這個比較只說本次產出量，不直接推論兩方法所有環境後果。","correct":"B","options":[{"id":"A","text":"80 g","explanation":"錯誤：80 g是甲的產出，不是少取得的量。"},{"id":"B","text":"5 g","explanation":"正確：80−75＝5 g。"},{"id":"C","text":"75 g","explanation":"錯誤：75 g是乙的產出，不是兩者差額。"},{"id":"D","text":"155 g","explanation":"錯誤：155 g是兩次產出相加。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B039","stem":"某人說：「糖經工業精製後成為化學產品，因此其原料不可能來自自然界。」何者最能修正此推論？","concept":"糖可以從植物原料取得，再經工業精製與分析成為產品。天然來源說明原料從哪裡來，精製說明如何處理，兩者並不互相排斥。分析與否也不會改變原料的歷史來源，但要知道本批純度仍需實際資料；不能由來源否定加工，也不能把加工過程直接當成純度結果。","correct":"D","options":[{"id":"A","text":"只有未經分析的糖才有天然來源","explanation":"錯誤：分析不會改變原料歷史來源。"},{"id":"B","text":"凡是天然來源都不能成為高純度產品","explanation":"錯誤：精製可使天然來源材料以高純度供應。"},{"id":"C","text":"產品只要經過工業精製，其本批純度就不需再分析","explanation":"錯誤：精製不直接給出本批純度，而且未修正來源推論。"},{"id":"D","text":"產品的處理過程不會否定原料的天然來源","explanation":"正確：來源與後續處理可同時記錄而無衝突。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B040","stem":"某批糖經精製，分析員取得其成分數據，再交給使用服務人員。何者最合理描述數據的用途？","concept":"成分分析可以支援本批糖的品質控制與用途說明，但結論應對應實際分析的材料及條件。目標糖純度合格未直接涵蓋所有使用性質；另一批即使採相同精製方法，也不能把本批結果當成它的實測。將批次、所測性質及用途連在一起，服務人員才能正確使用分析資料。","correct":"A","options":[{"id":"A","text":"數據可支援本批品質與用途說明，但仍須符合相應條件","explanation":"正確：有效材料資訊可支援品管與技術服務。"},{"id":"B","text":"本批目標糖純度合格，就可認定所有用途所需性質也合格","explanation":"錯誤：純度合格未涵蓋用途需要的其他性質。"},{"id":"C","text":"只要另一批採相同精製方法，本批數據便可作為另一批的實測","explanation":"錯誤：方法相同不代表另一批已完成實際分析。"},{"id":"D","text":"數據可代替所有其他批次的實際分析","explanation":"錯誤：不同批次可能需要各自材料資料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5。","example":"","pointId":"WHY-P04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B041","stem":"工程師研究材料接觸液體後的耐用性，藥學研究者分析藥物在體內的處理。兩者共同需要的化學基礎為何？","concept":"工程和藥學研究對象不同，卻都需要了解物質在相應環境中的行為。化學能提供基本原理與分析思路，幫助解釋材料耐用性或藥物處理。共同基礎不代表相同用途、相同研究方法或一定要製備新物質；來源資訊也不足以取代具體性質研究。","correct":"B","options":[{"id":"A","text":"只由兩者起始材料的成分，就確定接觸後及體內的全部行為","explanation":"錯誤：起始成分不能獨自涵蓋接觸後或體內行為。"},{"id":"B","text":"理解物質的性質與行為","explanation":"正確：兩項研究都以物質性質與行為為基礎。"},{"id":"C","text":"只要各自主要成分合格，就可不研究相應條件下的性能","explanation":"錯誤：成分合格不直接驗證使用或體內條件的表現。"},{"id":"D","text":"只要一個模型符合原條件，就可用於各自所有其他條件","explanation":"錯誤：模型的適用條件仍須依資料檢查。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B042","stem":"生物學者觀察體內物質的變化，工程師量測合成材料的性能。哪項說法正確？","concept":"生物體內的物質變化和合成材料的性能都可以用化學研究。共同的物質基礎不表示資料可無條件互換。起始成分、量測數值及儀器各提供部分資訊，仍須知道所研究的物質、性質與條件，才能正確理解變化或用途，而不是由單一相似之處推定全部相同。","correct":"A","options":[{"id":"A","text":"天然生命系統與合成材料都可運用化學原理","explanation":"正確：來源不同不妨礙化學原理的應用。"},{"id":"B","text":"兩者都只需確認起始成分，即可完整說明觀察到的變化","explanation":"錯誤：起始成分不能直接包辦過程與性能的解釋。"},{"id":"C","text":"兩者只要測得相同數值，就可認定其物質作用相同","explanation":"錯誤：相同數值尚需比較所量性質及條件。"},{"id":"D","text":"兩者只要使用同種儀器，就可省略各自條件的說明","explanation":"錯誤：同種儀器不表示研究條件相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B043","stem":"農業組關心物質在土壤中的行為，地質組關心它是否移入岩層附近水域。最合理的合作基礎為何？","concept":"相同物質可在不同環境中接受研究，其性質資料能作共同基礎，但具體環境和問題仍需保留。農業與地質都依賴化學原理，不代表土壤與水域條件完全相同。資料共享可以幫助研究運輸與影響，後續推理仍要對應各自條件。","correct":"D","options":[{"id":"A","text":"只要同一物質，就不需說明任何環境條件","explanation":"錯誤：同一物質不消除條件的重要性。"},{"id":"B","text":"只要兩組含量使用相同單位，就可把土壤數值當成水域實測值","explanation":"錯誤：單位相同不表示取樣對象與環境相同。"},{"id":"C","text":"把兩種環境直接視為完全相同","explanation":"錯誤：環境不同可能影響物質行為。"},{"id":"D","text":"共享該物質的性質資料，依各自環境問題研究","explanation":"正確：共享基礎資訊並保留各自環境問題。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B044","stem":"同一材料分析結果顯示它耐受液體L，但對液體M表現不佳。工程組需要接觸L，農業組需要接觸M。何者合理？","concept":"化學資料描述材料性質，用途判斷還要對照使用條件。同一材料在L和M中的表現不同，正好使兩組需求得到不同答案。共同理解數據不要求選材結果相同，也不會讓某一用途不適合自動否定另一用途的有效資料。","correct":"C","options":[{"id":"A","text":"工程組可用就代表農業組也可用","explanation":"錯誤：L中的性能不能直接推廣到M。"},{"id":"B","text":"兩組引用同一分析，所以必須作相同用途判斷","explanation":"錯誤：同一資料可支援不同需求下的結論。"},{"id":"C","text":"兩組可共用化學資料，卻因使用條件不同而有不同選材結果","explanation":"正確：材料、液體與用途條件都已明確對應。"},{"id":"D","text":"農業組不適用就表示工程組數據失效","explanation":"錯誤：M的限制不使L的結果失效。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B045","stem":"政府與大學實驗室分別取得本次河川水樣的污染物分析結果。這些結果最直接提供哪種共同的化學資訊？","concept":"化學分析讓研究者取得特定樣品中物質的組成或性質，支援環境問題的了解。資料應對應取樣位置、時刻與分析對象；未分析成分及未取樣時刻仍需其他證據。量得含量可以作為解釋移動或評估治理的起點，但不等於完整原因及治理效果已經確定。","correct":"B","options":[{"id":"A","text":"本河川污染物移動的全部原因，以及治理後的完整結果","explanation":"錯誤：分析結果支持後續研究，未直接包辦全部原因及治理結果。"},{"id":"B","text":"受測水樣的污染物組成或性質，可用來了解環境問題","explanation":"正確：受測水樣的組成或性質資料可共同支援環境研究。"},{"id":"C","text":"本河川其他所有未分析成分的含量與影響","explanation":"錯誤：目標污染物分析未直接量到所有其他成分。"},{"id":"D","text":"本河川未取樣時刻的含量，無須後續資料即可確定","explanation":"錯誤：本次樣品不能直接代表未取樣時刻。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B046","stem":"資訊科學背景研究者寫出程式，依分子行為解釋材料性質。這項工作與化學的關係為何？","concept":"教材指出化學可以結合理論、程式與模擬來理解分子運動和反應。資訊方法在這裡服務物質性質的解釋，所以具有化學模型功能。判斷重點是程式處理的科學問題，並非工具形式；模型輸出與材料實物、直接量測仍須區分。","correct":"B","options":[{"id":"A","text":"程式輸出一律等同儀器實測","explanation":"錯誤：計算輸出不等於儀器讀值。"},{"id":"B","text":"以程式建立物質行為模型，屬化學與資訊的合作","explanation":"正確：資訊方法可支援化學建模。"},{"id":"C","text":"只要程式能符合已有一組數據，就表示所有適用條件都已驗證","explanation":"錯誤：符合一組資料不證明所有條件皆適用。"},{"id":"D","text":"只要程式使用分子資料，就可以省略與實際性質量測的比較","explanation":"錯誤：以分子行為建模仍須和實測比較其適用性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B047","stem":"地質材料分析發現樣品含物質X，藥學研究則關心另一種物質Y在體內的行為。下列哪個共同原則最適當？","concept":"地質與藥學問題不同，但都需要辨認實際研究的物質，並取得與問題相應的性質資料。分析程序、表示單位或來源相同，只說明某一層面的共同點，不能代替物質身分及作用的比較。跨領域可運用共同化學原理，具體結論仍須保留各自材料與條件。","correct":"C","options":[{"id":"A","text":"只要X與Y可用同種分析程序，就能以X的資料直接代表Y","explanation":"錯誤：分析程序相同不代表不同物質的性質相同。"},{"id":"B","text":"只要X與Y的含量以相同單位表示，兩物質便有相同作用","explanation":"錯誤：同單位只利於表達數據，不證明作用相同。"},{"id":"C","text":"各自辨認研究物質並取得與問題相應的性質資料","explanation":"正確：保留對象及相應性質，符合共同化學方法。"},{"id":"D","text":"只要兩份樣品有相同天然來源，就能推定X與Y的性能相同","explanation":"錯誤：來源相同不保證不同物質性能一致。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B048","stem":"工程團隊已取得材料性質資料，醫藥團隊希望將同材料改用於不同接觸環境。何者最合理？","concept":"同一物質的資料可成為跨領域起點，但用途改變會帶來不同需求與接觸條件。化學基礎幫助研究者理解已有性質及尚缺資訊，再評估新用途。既不能只憑舊用途成功就全面沿用，也不能按領域標籤把跨域使用一概排除。","correct":"D","options":[{"id":"A","text":"凡是工程材料都不可能用於其他領域","explanation":"錯誤：來源領域不是永久用途限制。"},{"id":"B","text":"只把工程用途的接觸測試結果直接當成新環境的測試結果","explanation":"錯誤：新接觸環境可能有不同要求，舊條件的結果不能直接代填。"},{"id":"C","text":"工程用途已成立，新的醫藥用途自然成立","explanation":"錯誤：不同用途需要相應性質和影響的支持。"},{"id":"D","text":"先理解既有性質，再檢查新接觸條件所需的材料資訊","explanation":"正確：使用既有知識並核對新條件的適用性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B049","stem":"農業學生與生物學生共同研究某物質對生物體的影響。下列哪項最能使這個研究具有化學基礎？","concept":"農業與生物研究可藉由化學，把觀察到的生物作用連到實際物質的性質與行為。施用前含量能說明起點，卻未直接回答不同生物體中的後續作用。來源分類及主要成分名稱也只是部分描述，不保證不同配方影響相同；研究仍需辨認材料及與問題相應的性質。","correct":"B","options":[{"id":"A","text":"只量施用前物質含量，便推定所有生物體中的作用","explanation":"錯誤：施用前含量未直接回答不同生物體中的物質行為。"},{"id":"B","text":"辨認物質的性質，並將其與觀察到的作用相連","explanation":"正確：把物質性質與生物作用連起來。"},{"id":"C","text":"只把物質分為天然與人工兩組","explanation":"錯誤：來源分類不能完整解釋作用。"},{"id":"D","text":"只辨認主要成分名稱，便將不同配方的全部影響視為相同","explanation":"錯誤：主要成分同名不保證完整配方與影響相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B050","stem":"在政府監管單位工作的研究者，需要依產品材料的分析報告說明用途。哪項做法最能讓說明有化學依據？","concept":"產品用途的技術判斷需要理解物質性質、分析資料與使用影響的關係，讓說明對應實際材料及條件。主要成分合格不能代表所有性能，其他產品同名成分也不足以移用全部接觸結論。報告中的預測可協助研究，仍應和實測區分；工作機構不改變這些資料判斷原則。","correct":"B","options":[{"id":"A","text":"只確認主要成分含量合格，便宣稱所有使用性能都已確認","explanation":"錯誤：主要成分含量不包辦所有使用性能。"},{"id":"B","text":"理解物質性質、量測結果與用途影響之間的關係","explanation":"正確：物質與資料的理解可支援監管中的技術判斷。"},{"id":"C","text":"只要另一產品成分名稱相同，就沿用本報告的全部接觸結論","explanation":"錯誤：同名成分未保證兩產品及接觸條件相同。"},{"id":"D","text":"把報告中的模型預測當成所有未測使用條件的實測結果","explanation":"錯誤：模型預測和相應條件的直接量測須區分。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-49；部分1 PDF頁 50-51；已審筆記頁 正文4、7。","example":"","pointId":"WHY-P05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B051","stem":"新包裝需同時耐受液體L並維持支撐功能。候選甲只符合前項，乙只符合後項。最直接的材料研發方向為何？","concept":"製造新型物質的目的是取得所需性質，可能包含同時滿足多項功能。甲乙各有一項不足，便提供材料改良方向：尋找新候選或組合，並實際測量兩項性能。性質要求不能靠名稱或單一優勢互相替代，也不能假定組合後一定成功。","correct":"B","options":[{"id":"A","text":"選甲後就把支撐要求視為已達成","explanation":"錯誤：甲的耐受性不能代表支撐能力。"},{"id":"B","text":"研究能同時滿足兩項性質的材料或組合","explanation":"正確：研發與量測可針對兩項需求共同進行。"},{"id":"C","text":"直接把甲乙混合，便保證任意比例都能同時達標","explanation":"錯誤：組合可供研發，但各比例是否具有所需性質仍須測試。"},{"id":"D","text":"選乙後就把耐液體要求視為已達成","explanation":"錯誤：乙的支撐能力不能代表耐液體性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B052","stem":"甲、乙單獨各有已知性質，研究員將它們製成新組合丙。要確認丙是否符合用途，何者適當？","concept":"物質組合也可以是材料研發對象，但組合的表現需直接確認。甲、乙的單獨性質提供設計線索，不能在沒有適用關係的情況下直接替代丙的性質，更不能把數字相加當作量測。製備丙後，應在用途條件下測量，以檢查設計是否成功。","correct":"A","options":[{"id":"A","text":"測量丙在所需條件下的表現","explanation":"正確：丙的實測能直接確認組合是否符合需求。"},{"id":"B","text":"只要甲乙都可用，任何比例的丙必可用","explanation":"錯誤：材料比例與組合表現仍需研究。"},{"id":"C","text":"把兩份資料的數字相加就必定得到丙的實測值","explanation":"錯誤：算術相加沒有被定義成丙的性質關係。"},{"id":"D","text":"直接把甲的性質全部當成丙的性質","explanation":"錯誤：組合不是單獨甲，不能直接套全部性質。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B053","stem":"模型預測配方甲較適合新包裝，實際配製後卻不符合耐用要求。哪項結論最合理？","concept":"材料製備是否完成，與材料是否達到預期性能是不同問題。取得樣品證明製備發生，測得不耐用則指出設計仍不成功。可利用結果檢查模型、配方或條件並改良；不能將實物存在誤當成功能驗證，也不能以性能失敗否定已發生的製作。","correct":"D","options":[{"id":"A","text":"模型有預測就足以否定實測失敗","explanation":"錯誤：預測應接受實際材料資料的檢查。"},{"id":"B","text":"耐用不合格已足以證明原料成分錯誤是唯一原因","explanation":"錯誤：性能不合格仍需核對原料、製程、測試及模型，未確立唯一原因。"},{"id":"C","text":"既然已製備，耐用要求也已達成","explanation":"錯誤：有實物不保證性能符合需求。"},{"id":"D","text":"製備已完成，但達到所需性質仍需改良與重測","explanation":"正確：分清製備成果與尚未達成的性能。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B054","stem":"新材料設計希望改善清潔作用，又降低對被清潔表面的損傷。哪項最適合作為候選選擇依據？","concept":"有用材料的設計需要對應完整需求。此題同時要求去污與降低損傷，因此候選應以兩類材料作用資料比較。只顧功能或只顧表面不變都可能漏掉另一目標；來源名稱也不能直接代表作用。比較結果可指引新配方或組合的研發，再用量測驗證。","correct":"C","options":[{"id":"A","text":"只比較清潔材料的來源名稱","explanation":"錯誤：來源名稱不是作用數據。"},{"id":"B","text":"只選清潔作用最強者，不看表面影響","explanation":"錯誤：忽略表面損傷，不符合雙重目標。"},{"id":"C","text":"比較相應條件下的清潔效果與表面影響","explanation":"正確：兩項實際作用均納入候選判斷。"},{"id":"D","text":"只選表面完全不變者，不看是否能清潔","explanation":"錯誤：若不能清潔，也未完成用途需求。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B055","stem":"包裝需同時耐受液體L並維持支撐功能。以甲、乙兩種原料製得三配方，在相同測試下：甲乙質量比2：1者只通過耐L，1：1者兩項皆通過，1：2者只通過支撐。僅依這些結果，哪項結論最適當？","concept":"新組合是否合用要看實際性質與用途要求是否相符。題目要求耐L與支撐同時達標，三者中只有1：1的受測結果符合。另兩配方各有一項不足，不能把各自優點直接相加，或假設提高某原料比例就讓所有性能改善。這些資料支持本次1：1的選擇，其他比例仍需相應測試。","correct":"D","options":[{"id":"A","text":"2：1與1：2各通過一項，故任意混合兩者都能同時達標","explanation":"錯誤：沒有資料證明任意混合可同時保有兩項優點。"},{"id":"B","text":"提高甲比例就能改善兩項性能，因此應選2：1","explanation":"錯誤：2：1的支撐未通過，不能視為兩項均改善。"},{"id":"C","text":"提高乙比例就能改善兩項性能，因此應選1：2","explanation":"錯誤：1：2的耐L未通過，不能視為兩項均改善。"},{"id":"D","text":"1：1配方符合本次兩項要求，其他比例仍不能由原料或單項結果保證合用","explanation":"正確：只有1：1在本次測試同時符合兩項需求。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B056","stem":"兩種候選配方都已製得實物，甲尚未測性質，乙已確認一項性能。哪項判斷正確？","concept":"製備得到實物，量測取得性質，兩者可以處於不同進度。甲乙都已完成題設的製備，但只有乙有該項性能資料；不能因此推定甲沒有樣品，或乙已全面適用。研究應依實際產出分別記錄，為後續比較準備相應測量。","correct":"B","options":[{"id":"A","text":"乙有一項性能資料，所以全部用途都已確認","explanation":"錯誤：一項性能不涵蓋所有用途要求。"},{"id":"B","text":"兩者都有製備成果，但現有性能資訊不同","explanation":"正確：實物存在與性能資料完整度應分開。"},{"id":"C","text":"甲與乙都依原料配方製得，因此乙的性能資料可直接代表甲","explanation":"錯誤：配方製得不保證兩候選的性能一致。"},{"id":"D","text":"乙已有一項性能資料，因此甲不必測試就可與乙作完整用途比較","explanation":"錯誤：甲尚無性能資料，乙的一項資料也未涵蓋完整用途。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B057","stem":"藥物研發希望改善舊候選的某項不足。哪種活動最直接把新候選設計轉成可供性能測試的實物？","concept":"研發可以利用既有資料找出不足，再提出並製備新候選物質。重測舊樣品對確認資料有用，卻不等於做出新的材料設計。本題要分辨的是物質是否有新的設計與製備活動；取得候選後仍需獨立測量，才能知道目標性質是否真的改善。","correct":"C","options":[{"id":"A","text":"再次測定舊藥物原有性質","explanation":"錯誤：重測舊性質不直接構成新物質製備。"},{"id":"B","text":"分析舊藥物同一批的成分","explanation":"錯誤：分析舊批次是量測，未做出新候選。"},{"id":"C","text":"設計並製備具有目標性質的新候選物質","explanation":"正確：設計和製備新候選直接回應研發目標。"},{"id":"D","text":"只以舊物質資料估計它在另一條件的表現，尚未設計或製備新候選","explanation":"錯誤：這是對舊物質的推估，尚未取得改善所需的新候選。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B058","stem":"某材料組合的用途需要低原料消耗且維持耐用性。新配方用量降低，耐用性卻變差。下一步最符合原研發目標的是什麼？","concept":"新材料研發的成功應對照原先所需性質。此例用量下降是部分成果，但耐用性變差表示還未滿足完整用途。化學家可以研究材料組合和處理，再測量其表現；不能把一項改善當作另一項也改善，更不能靠名稱變更完成材料改良。","correct":"B","options":[{"id":"A","text":"只確認新配方的原料來源較天然，就視為兩項要求皆已達標","explanation":"錯誤：來源不會直接證明原料減量及耐用性能同時達標。"},{"id":"B","text":"研究配方或處理方式，使減量與耐用需求同時成立","explanation":"正確：針對尚未同時達成的兩項需求繼續研發。"},{"id":"C","text":"以用量下降直接代替耐用性結果","explanation":"錯誤：用量與耐用性是不同資訊。"},{"id":"D","text":"只繼續降低用量，耐用性不再重要","explanation":"錯誤：忽略耐用性會改變原目標。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B059","stem":"研究員用兩種已知物質實際配製候選包裝，未主張得到新化學式。對這項工作，何者恰當？","concept":"化學製造可以取得新物質，也可以為用途設計物質組合，不必每次都宣稱產生新化學式。配製完成提供候選實物，是否具有所需性能仍是下一個研究問題。原料各自性質、既有用途及預定比例能提供設計線索，卻不能直接當成新組合的實測結果，仍須量測確認。","correct":"D","options":[{"id":"A","text":"原料性質已知，就可把兩者性能平均當成候選的實測表現","explanation":"錯誤：未提供可平均的性能關係，平均值也不是候選的實測。"},{"id":"B","text":"候選按預定比例製得，就表示所需包裝性能已驗證","explanation":"錯誤：比例符合設計不等於用途性能已通過。"},{"id":"C","text":"原料各自曾有用途，就可確認這個比例的候選符合新用途","explanation":"錯誤：原料各自合用不保證新比例組合符合新用途。"},{"id":"D","text":"製備具有所需性質的物質組合也是化學工作，候選性能仍需量測確認","explanation":"正確：物質組合可屬化學製備，仍需取得候選性能的證據。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B060","stem":"材料改良目標是減少原料甲，且耐用時間至少8小時。舊配方每件甲15 g、乙10 g，耐用10小時；新配方甲9 g、乙16 g，耐用6小時。何者正確評估改良結果？","concept":"先確認目標是減少原料甲，而非減少總質量。甲由15 g降為9 g，每件少6 g；乙增加使總量仍為25 g，不會取消甲減量這個事實。接著獨立檢查耐用性，新配方6小時低於最低8小時，短少2小時。因此只完成甲減量，尚未同時達到用途要求，需繼續改良並量測。","correct":"C","options":[{"id":"A","text":"新配方總量仍為25 g，所以甲的用量沒有減少","explanation":"錯誤：總量不變不表示每一種原料用量都不變。"},{"id":"B","text":"甲少用6 g，所以減量與耐用兩項目標都已達成","explanation":"錯誤：減量成立，但6小時仍低於8小時的耐用要求。"},{"id":"C","text":"甲少用6 g，但耐用6小時低於要求，仍需改良配方或處理方式","explanation":"正確：15−9＝6 g；6＜8，兩項目標尚未同時成立。"},{"id":"D","text":"新配方的甲剩6 g，而且耐用時間僅比最低要求少1小時","explanation":"錯誤：甲剩9 g；耐用時間比要求少8−6＝2小時。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B061","stem":"工廠收到兩批清潔材料，外觀相同，卻想確認其中物質X的含量是否相同。最直接的工作為何？","concept":"品質控制常需要量測組成或性質。此題問的是各批X含量，應分別對兩批使用可比較的分析程序。相同外觀只提供外觀資訊，並不保證內部組成相同；混合後的結果也不能直接當成每一原批次的結果。先把要回答的物質問題說清楚，才能選對量測。","correct":"B","options":[{"id":"A","text":"依材料外觀建立X含量必相等的假設後停止檢查","explanation":"錯誤：外觀不足以驗證含量相等的假設。"},{"id":"B","text":"按相同分析程序測定兩批的X含量","explanation":"正確：直接取得兩批各自的X含量，符合問題。"},{"id":"C","text":"僅測兩批每份樣品的總質量，將總量相同當成X含量相同","explanation":"錯誤：總質量相同未分辨其中X的含量。"},{"id":"D","text":"把兩批混成一批，再把混合後含量當作各批含量","explanation":"錯誤：混合會失去原先兩批各自的含量資訊。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B062","stem":"包裝材料需接觸液體L。甲小組量測材料接觸L後的變化，乙小組只提出分子模型。哪項敘述最恰當？","concept":"測量提供材料接觸L後實際變化的資料，模型則可提出物質行為的解釋與預測。將兩者比較可檢查解釋在L條件下是否適用。提出模型不表示測試已通過，也不使實測多餘；即使兩者在L中相符，其他液體的接觸條件仍可能不同，不能直接當成全部適用。","correct":"A","options":[{"id":"A","text":"甲提供使用條件下的實際性質資料，可用來檢驗乙的解釋","explanation":"正確：甲的資料與指定用途直接相關，也能檢查模型。"},{"id":"B","text":"乙的模型一提出，材料就已通過接觸L的測試","explanation":"錯誤：模型預測與實際測試是不同證據。"},{"id":"C","text":"乙已有模型，因此甲的測量必然多餘","explanation":"錯誤：模型仍可由實測資料檢驗。"},{"id":"D","text":"甲乙結果只要在L中相符，就可確定模型對其他液體也適用","explanation":"錯誤：在L中相符不足以確認其他液體條件的適用性。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B063","stem":"以下是同一批材料中物質X的三次分析結果：每份樣品皆為100 g，X分別為97 g、98 g、97 g。這些結果直接支持何者？","concept":"每份樣品都以100 g為基準，可直接比較X的97、98、97 g。最小為97，最大為98，因此本次受測含量介於97至98 g／100 g。三份合計292 g，平均約97.3 g，但合計不屬單份含量，平均也不等於每次數值。這些本次資料仍不能直接保證未來批次都相同。","correct":"D","options":[{"id":"A","text":"三次X合計292 g，故每100 g材料都含292 g的X","explanation":"錯誤：292 g是三份樣品的合計，不能當成一份100 g的含量。"},{"id":"B","text":"三次平均約97.3 g，所以每一份樣品的X都恰為97.3 g","explanation":"錯誤：平均值不會使97、98、97三個各別結果都變成平均數。"},{"id":"C","text":"所有未來批次的X必定都是97 g","explanation":"錯誤：未來批次尚未分析，不能由本次結果全包。"},{"id":"D","text":"本次受測樣品的X含量介於97至98 g／100 g","explanation":"正確：直接整理了題目提供的最小與最大含量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B064","stem":"某批包裝材料已符合「含物質X至少8 g／100 g」的條件；另外還須確認接觸L後是否破損。下一項最相關的測量為何？","concept":"不同使用要求可能對應不同的物質性質。X含量已達標，只解決組成要求；材料接觸L是否維持完整仍是另一項待回答的性能問題。因此應直接在指定接觸條件下測量，不能把單一含量結果當成所有品質項目都通過。","correct":"A","options":[{"id":"A","text":"測量材料在指定接觸L條件下的完整性","explanation":"正確：量測項目與尚未確認的使用要求一致。"},{"id":"B","text":"計算尚未測試材料的預測組成，當成已測結果","explanation":"錯誤：預測組成仍未回答實際接觸L後的性能。"},{"id":"C","text":"再測一次X含量，把含量達標直接當成接觸L後不破損","explanation":"錯誤：再次含量達標仍未直接測試接觸L後的完整性。"},{"id":"D","text":"只測材料在完全不接觸L時的顏色","explanation":"錯誤：未接觸L的顏色無法直接驗證耐受L。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B065","stem":"原料規格要求每100 g至少含95 g物質X。實測甲批94 g、乙批96 g。僅就這項規格判斷，何者正確？","concept":"品質控制應把實測值與指定條件逐項比較。「至少95 g」包含95 g及更高值。甲94 g低於下限，因此不符；乙96 g高於下限，因此符合。這只能判定題目所列的X含量規格，其他用途、接觸影響或未列品質要求仍不能由這一步包辦。","correct":"D","options":[{"id":"A","text":"兩批皆符合，因為都接近95 g","explanation":"錯誤：接近下限不等於已達到下限。"},{"id":"B","text":"兩批皆不符合，因為沒有恰為95 g","explanation":"錯誤：「至少」容許高於95 g，不要求恰好相等。"},{"id":"C","text":"甲符合，乙不符合","explanation":"錯誤：把低於下限與高於下限的判斷顛倒。"},{"id":"D","text":"甲不符合，乙符合","explanation":"正確：94小於95，96大於95。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B066","stem":"研究者用儀器取得物質在極小尺度的性質資料。學生說「肉眼看不到，就不算化學測量」。何者最合理？","concept":"化學家能借助儀器分析物質，甚至在原子尺度取得性質資料。量測不限於肉眼直接辨識，但仍需確認儀器所提供的數據是否對應研究問題。儀器資料與模型推算的取得方式不同，量到數值也不等於物質行為的全部原因已確定；後續解釋仍要利用資料檢查。","correct":"A","options":[{"id":"A","text":"化學測量可以借助儀器取得肉眼無法直接辨識的資料","explanation":"正確：儀器可擴展量測物質性質的能力。"},{"id":"B","text":"只要是微小尺度，任何模型都等於已測結果","explanation":"錯誤：模型結果仍須與實際測量區分。"},{"id":"C","text":"只要取得微小尺度的數據，就表示物質行為的全部原因已確定","explanation":"錯誤：量到數據提供解釋依據，不等於全部原因已知。"},{"id":"D","text":"只要儀器能讀出數值，就無須確認所測性質是否對應研究問題","explanation":"錯誤：仍需確認儀器提供的資料與待研究性質相應。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B067","stem":"某研究欲知道污染物X在河川不同位置的分布。最能直接提供分布資料的方案為何？","concept":"要描述河川分布，需要保留每個位置與其X含量的對應。只在同一處反覆取樣不能直接代表其他位置，將各處樣品混合則會失去個別位置的資訊。傳輸預測可幫助安排取樣或解釋結果，但仍與現場量測不同。最直接的方法是在各位置取樣，再分別分析X含量。","correct":"D","options":[{"id":"A","text":"只在同一位置反覆取樣，將其平均含量直接代表所有位置","explanation":"錯誤：同一位置的反覆資料不能直接代表其他位置。"},{"id":"B","text":"先把各位置水樣全部混合，再將混合值當成每一位置的含量","explanation":"錯誤：混合值失去各位置的個別含量資訊。"},{"id":"C","text":"把未與現場比較的傳輸預測寫成各位置的實測值","explanation":"錯誤：未核對的預測不能冒充現場測量。"},{"id":"D","text":"在不同位置取樣並測定各樣品的X含量","explanation":"正確：位置與含量對應後才能直接描述分布。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B068","stem":"某公司更改材料配方後，想知道「新材料是否真的比原材料更耐液體L」。何者最適當？","concept":"要比較新舊材料的同一性質，應取得兩者在可比較條件下的資料。新配方可能改善性能，也可能沒有改善；「新」是製作歷程的描述，不是性能證據。模型可協助設計測試，但若題目要知道實際表現，仍應與測量結果對照。","correct":"C","options":[{"id":"A","text":"以模型預測取代兩者所有實際測試","explanation":"錯誤：純預測不能直接回答實際性能是否改善。"},{"id":"B","text":"只因配方較新，就判定更耐L","explanation":"錯誤：新配方不必然具有較佳耐受性。"},{"id":"C","text":"在可比較的接觸L條件下量測新舊材料的表現","explanation":"正確：同一性能與可比較條件使比較有依據。"},{"id":"D","text":"只測原材料，將結果直接填給新材料","explanation":"錯誤：原材料結果不能直接移給成分不同的新材料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B069","stem":"工廠分析顯示甲批與乙批X含量相同，但兩批接觸L後的變化不同。何者最合理？","concept":"含量是一項組成資訊，材料用途還可能涉及其他成分或性質。即使X含量相同，也不能直接推出兩批在所有條件下表現一致。面對另一項性能測量的差異，應查清相關資料和條件，不能只用含量相同就抹去其他觀察。","correct":"D","options":[{"id":"A","text":"含量相同即可否定所有接觸L的觀察","explanation":"錯誤：X含量結果本身沒有否定接觸觀察的效力。"},{"id":"B","text":"含量分析已證明兩批在任何條件下都相同","explanation":"錯誤：分析一項含量沒有涵蓋所有條件與性質。"},{"id":"C","text":"X含量相同，所以兩批其他成分也必定相同","explanation":"錯誤：單一成分含量相同，不能直接推知全部其他成分。"},{"id":"D","text":"X含量相同，不代表每一項材料性質也相同","explanation":"正確：單一相同項目不能推出所有性質皆相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B070","stem":"化學品供應商的技術人員協助客戶檢查材料為何不能耐受清潔液L。下列哪項工作最直接結合測量與技術服務？","concept":"處理客戶的耐液體問題，先要取得材料在相關接觸條件下的變化資料，再據此研究原因及建議使用方式。接觸前強度、主要成分與另一液體中的性能都可提供線索，卻不能直接代替L接觸前後的比較。把量測資料連到客戶的實際用途，才能讓技術服務有依據。","correct":"B","options":[{"id":"A","text":"只量原材料接觸L前的強度，便用它代表接觸後性能","explanation":"錯誤：接觸前的強度未直接回答接觸L後的變化。"},{"id":"B","text":"量測材料接觸L前後的變化，再依結果建議使用方式","explanation":"正確：先量測實際問題，再把資料轉成使用建議。"},{"id":"C","text":"只確認原料主要成分合格，便排除材料在L中發生變化的可能","explanation":"錯誤：主要成分合格不排除使用條件下的變化。"},{"id":"D","text":"只量另一液體M中的表現，便視為原材料不能耐L的原因已查明","explanation":"錯誤：M中的資料沒有直接確認L中的變化及原因。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-6。","example":"","pointId":"WHY-P07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B071","stem":"研究者以分子行為建立污染物傳輸模型，推算尚未取樣地點的X含量。這項輸出最適合如何描述？","concept":"模型可以用來解釋物質如何移動，也能推算尚未直接觀測的情況。推算的價值在於提出可檢查的預期，而不是讓取樣工作自動發生。後續把預測與現場資料比較，可幫助判斷模型在指定情境是否適用及哪些地方需要修正。","correct":"C","options":[{"id":"A","text":"只要輸出名為X含量，便可不考慮模型採用的環境條件","explanation":"錯誤：預測仍依模型假設與環境條件而定。"},{"id":"B","text":"已經完成該地點的現場測量","explanation":"錯誤：未取樣地點的推算不是現場實測。"},{"id":"C","text":"對未測位置提出預測，之後可用取樣分析檢驗","explanation":"正確：明確保留預測與後續檢驗的關係。"},{"id":"D","text":"已證明所有河川的X都以完全相同方式分布","explanation":"錯誤：一個模型未證明所有河川條件完全相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B072","stem":"模型預測材料甲接觸L後仍保持完整，實測卻出現破損。研究者首先應採取何種方向？","concept":"預測完整與實測破損的差異是重新檢查的線索。研究者應核對樣品、測試條件及模型假設，再尋找需要補充的解釋。過去符合資料不能保證本次全部正確，一次不符也不等於模型在其他條件全無用途。主要成分相同仍不能排除接觸條件的影響，原因需由資料釐清。","correct":"A","options":[{"id":"A","text":"核對測量條件及模型假設，尋找差異並調整解釋","explanation":"正確：檢查條件與假設可釐清不一致的來源。"},{"id":"B","text":"一次不符已足以判定這個模型在其他所有條件也無法使用","explanation":"錯誤：一次不符未判定其他全部條件的適用性。"},{"id":"C","text":"模型曾符合原條件，所以這次破損必定只是儀器問題","explanation":"錯誤：曾符合不保證本次模型完整，也未確立儀器是唯一原因。"},{"id":"D","text":"材料主要成分未變，所以接觸條件不可能解釋這次差異","explanation":"錯誤：主要成分未變不表示接觸條件不影響表現。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B073","stem":"兩組人員研究材料。甲將已量到的耐用時間列成清單；乙提出分子行為的解釋，並推算未測條件下的耐用時間。乙比甲多做了哪項工作？","concept":"甲整理已有的耐用數據，乙另外提出分子行為的解釋，並推算未知條件的表現，新增的是建模工作。資料排序或平均值可以協助研究，卻不能單獨確定唯一原因，也不能直接代替每一新條件的結果。模型提供可檢查的預測，仍須與相應條件的實際測量區分。","correct":"C","options":[{"id":"A","text":"只由既有數據的排序，就確定耐用差異的唯一原因","explanation":"錯誤：排序資訊不足以確定唯一原因，乙提出的是可檢查解釋。"},{"id":"B","text":"以未測條件的預測值，直接擴充實際量測結果的範圍","explanation":"錯誤：推算未知條件不等於完成那些條件的實測。"},{"id":"C","text":"用模型連結物質行為與預測","explanation":"正確：乙新增了解釋及推估未知條件的工作。"},{"id":"D","text":"把既有條件的平均耐用時間，直接當成每一未測條件的結果","explanation":"錯誤：乙依物質行為推算，不是將既有平均值無條件移用。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B074","stem":"某模型成功解釋污染物X在條件L的移動資料。若改為條件M，哪項做法最合理？","concept":"同一物質在不同條件下的行為可能不同。模型曾符合L的資料，是針對L的支持；轉到M時仍須檢查適用條件並與M的資料比較。這既保留模型作為預測工具的價值，也避免把某一情境下的成功無限外推成所有情境的事實。","correct":"C","options":[{"id":"A","text":"沿用L的結果，直接稱為M的測量值","explanation":"錯誤：L的資料不能直接冒充M的測量。"},{"id":"B","text":"認定只要名稱仍是X，所有條件都不影響模型使用","explanation":"錯誤：物質名稱相同不表示環境條件無關。"},{"id":"C","text":"檢查模型對M的適用性，並以M的資料評估預測","explanation":"正確：新條件下仍需評估模型及其預測。"},{"id":"D","text":"認定X在M必定完全不移動","explanation":"錯誤：題目沒有支持M完全不移動的資料。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B075","stem":"藥物研究中，模型用來描述某物質進入人體後的變化；研究者尚未量測本次情境。此時最恰當的說法為何？","concept":"藥物在人體中的變化可運用物質行為模型研究。模型提供一套解釋與可檢查的預期，但本次情境未量測，仍沒有相應的直接資料。起始成分及模型圖像都不能讓情境條件變得不重要，也不能保證所有人的結果一致。後續需將預測與相應資料比較，檢查解釋是否適用。","correct":"D","options":[{"id":"A","text":"只要知道起始藥物成分，就可省略本次情境的條件與量測","explanation":"錯誤：起始成分不能獨自決定各情境中的物質行為。"},{"id":"B","text":"只要模型圖像完整，就能保證所有人的使用結果一致","explanation":"錯誤：圖像完整不能保證所有情境與個體結果。"},{"id":"C","text":"模型已測出本次人體中的全部物質","explanation":"錯誤：尚未量測，不能把模型當成本次測量。"},{"id":"D","text":"模型提供可供後續比對的解釋與預測","explanation":"正確：符合模型的解釋與預測用途。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B076","stem":"模型預測甲材料耐用20小時、乙材料耐用30小時；兩者尚未實測。僅依模型，何者正確？","concept":"先分清資料的性質，再做比較。20與30小時是模型預測，因此只能說模型預測乙較甲多30−20＝10小時。差值的算術可以正確，證據名稱仍須保留「預測」。即使耐用時間較長，也不代表其他材料性質或所有用途都較好。","correct":"A","options":[{"id":"A","text":"模型預測乙比甲多耐用10小時，仍需實測核對","explanation":"正確：差值與預測身分都保留正確。"},{"id":"B","text":"甲已實測比乙多耐用10小時","explanation":"錯誤：方向顛倒，且把預測誤稱實測。"},{"id":"C","text":"模型已證明乙在所有用途都優於甲","explanation":"錯誤：單一預測性能不能概括全部用途。"},{"id":"D","text":"乙已實測比甲多耐用10小時","explanation":"錯誤：10小時的差正確，但題目尚未實測。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B077","stem":"某模型對甲配方預測的性質與實測相符；對乙配方則不符。下列何者最合宜？","concept":"模型對甲相符、對乙不符，提供檢查適用範圍的重要比較。應保留兩配方資料，核對組成、測試與模型如何處理其差別。主要成分相同不排除比例或其他差異；甲成功不能讓乙的問題自動歸因於量測，乙失敗也未證明所有假設都錯。需要針對差異補充解釋與驗證。","correct":"B","options":[{"id":"A","text":"乙不符已足以確定模型的每一個假設都錯誤","explanation":"錯誤：一次不符未逐一判定每項假設的正誤。"},{"id":"B","text":"保留兩組資料，檢查模型對不同配方的解釋是否足夠","explanation":"正確：兩組資料都能用來檢查模型的適用性。"},{"id":"C","text":"兩配方只要主要成分相同，就應排除配方差異與結果不符有關","explanation":"錯誤：主要成分相同仍可能有比例或其他材料差異。"},{"id":"D","text":"模型在甲相符，便可將乙的差異唯一歸因於量測程序","explanation":"錯誤：甲相符不保證乙適用，也未確立量測是唯一原因。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B078","stem":"研究者說：「若分子以此方式移動，材料在條件L下應有較快的變化。」這句話主要提供什麼？","concept":"句中以「若分子以此方式移動」作為解釋條件，再推到L中「應有較快變化」，因此是一項可以檢查的預測。它未表示已直接量到變化，更沒有涵蓋所有其他條件。提出一種可行解釋，也不等於已完整證實唯一原因；下一步可用相應條件的資料評估預測。","correct":"D","options":[{"id":"A","text":"材料在條件L下已直接測得較快變化的結論","explanation":"錯誤：題句是條件式推論，未敘述已完成直接量測。"},{"id":"B","text":"該材料在所有其他條件下也必定較快的結論","explanation":"錯誤：題句指定L，沒有涵蓋其他所有條件。"},{"id":"C","text":"物質行為的唯一原因已由實驗完全證實的結論","explanation":"錯誤：提出一種解釋不等於已完整證實唯一原因。"},{"id":"D","text":"由物質行為解釋導出的可檢查預測","explanation":"正確：從分子行為推到可與觀察比較的材料表現。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B079","stem":"甲用紙筆依分子行為推算未測條件的材料性質；乙用電腦整理已有的儀器含量數據，尚未提出行為解釋。何者正確？","concept":"判斷建模要看是否用物質行為建立解釋或預測，不以紙筆或電腦區分。甲依分子行為推算未知條件，符合模型的作用；乙整理既有儀器數據，仍是資料處理，不能單憑工具宣布已有行為解釋。具體預測數字也不是直接實測，整理出趨勢尚未證明其完整原因。","correct":"D","options":[{"id":"A","text":"甲的推算有具體數值，所以已取得未測條件的實測資料","explanation":"錯誤：數值來自推算，並未使未知條件成為已測條件。"},{"id":"B","text":"乙整理出含量趨勢，所以全部物質行為的原因已確定","explanation":"錯誤：趨勢是解釋的依據，不直接等於原因已確定。"},{"id":"C","text":"乙使用電腦且有數據，因此已完成未測條件的性能預測","explanation":"錯誤：使用電腦整理數據未表示已推算未測性能。"},{"id":"D","text":"甲可在建模；乙使用電腦並不表示已建立化學模型","explanation":"正確：工作內容決定是否建模，工具本身不能決定。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B080","stem":"模型預測河川兩處的X含量為甲處3、乙處7（同一單位）。現場分析則為甲處4、乙處6。哪項敘述正確？","concept":"模型與測量的比較可以分層進行。預測7大於3，實測6大於4，兩組資料都呈現乙高於甲；但甲的3與4、乙的7與6各有差異。因此可說排序相符，不能說數值完全吻合，更不能因此保證所有情境的預測都正確。","correct":"D","options":[{"id":"A","text":"只要高低排序相同，就代表模型對所有數值都已完全正確","explanation":"錯誤：排序相同不足以保證全部數值正確。"},{"id":"B","text":"實測顯示甲處高於乙處","explanation":"錯誤：實測乙6大於甲4，方向相反。"},{"id":"C","text":"預測與實測的兩個數值完全相同","explanation":"錯誤：甲差1、乙也差1，並非完全相同。"},{"id":"D","text":"兩者都顯示乙處高於甲處，但各處數值仍有差異需檢查","explanation":"正確：保留排序一致與數值仍不同的兩個事實。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文6。","example":"","pointId":"WHY-P08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B081","stem":"材料C已製成，且其耐用性已量測；團隊下一步想解釋為什麼C比原材料耐用。何種研究最直接回應這個目的？","concept":"團隊已有材料實物及耐用數據，下一個問題是造成耐用差異的物質行為。利用資料建立解釋，並提出可以檢查的預測，最直接回應這個目的。增加同條件測量或多製樣品可以補充研究材料，卻不自動構成完整原因；主要成分同名也不足以排除材料性質的差異。","correct":"B","options":[{"id":"A","text":"只增加同條件下的耐用測量次數，就視為差異的全部原因已確定","explanation":"錯誤：增加數據可支援解釋，但不自動等於原因已完整確定。"},{"id":"B","text":"運用已測資料建立對材料行為的解釋，再提出可檢查的預測","explanation":"正確：把現有資料連到原因解釋與可檢查預測。"},{"id":"C","text":"只把C多製備幾份，就視為耐用差異的物質原因已解釋","explanation":"錯誤：更多實物不直接提供耐用差異的物質解釋。"},{"id":"D","text":"只確認C與原材料主要成分名稱相同，就排除物質性質造成差異的可能","explanation":"錯誤：主要成分同名不保證材料的全部性質相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B082","stem":"研究先用模型挑出有望耐液體L的配方，再製成樣品，最後做接觸L的測試。何者正確？","concept":"三類活動描述工作的性質，不是規定不可改動的時間順序。模型可先預測候選材料，再引導製備與測量；測量結果也可回頭修正模型。題目中先推算、再配製、再測試，各步都保留自己的作用，不能把其中一步視為已替其他步完成。","correct":"C","options":[{"id":"A","text":"模型曾符合舊配方，就表示新候選耐L的實際性能已確定","explanation":"錯誤：舊配方符合未直接驗證新候選的性能。"},{"id":"B","text":"三類活動必須永遠先製造、再量測、最後才建模","explanation":"錯誤：教材的活動分類不要求唯一固定研究順序。"},{"id":"C","text":"模型可先協助選配方，仍須製備及測量來檢查實際表現","explanation":"正確：模型能引導選擇，實際性能仍由後續資料檢查。"},{"id":"D","text":"候選按選定配方製得，就可由配方一致推定耐L測試必定合格","explanation":"錯誤：配方一致不保證模型預期的用途性能已實現。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B083","stem":"研究者上午分析糖樣品的組成，下午利用數據建立精製材料性質的解釋。如何正確理解這兩項成果？","concept":"上午分析提供本樣品的組成資料，下午則利用這些數據尋找材料性質的解釋。量測與模型互相支援，但各有範圍：純度數字不會自動包辦全部原因，符合本批資料的解釋也不能直接代替未來批次或未分析樣品的實測。提出解釋後仍可用新資料檢查適用性。","correct":"A","options":[{"id":"A","text":"上午提供組成量測資料，下午提出可再檢查的性質解釋","explanation":"正確：兩項成果分別是樣品資料與可檢查的解釋。"},{"id":"B","text":"上午只要得到純度數字，就已完整確定材料性質的全部原因","explanation":"錯誤：純度數據未直接確定所有性質的原因。"},{"id":"C","text":"下午解釋若符合本批數據，就可當成所有未來批次的實測結果","explanation":"錯誤：模型符合本批不表示其他批次已量測。"},{"id":"D","text":"下午提出解釋後，就能由解釋直接確認尚未分析樣品的精確組成","explanation":"錯誤：解釋不能直接充當未分析樣品的精確組成結果。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B084","stem":"甲小組已製出新材料；乙小組已測其性質；丙小組提出解釋但與乙的資料不符。以下何者最妥當？","concept":"製備提供樣品，測量提供性質資料，模型提供解釋，三者需互相核對。樣品製成不保證模型正確，按配方製備也未排除條件或模型造成差異的可能。一次不符尚未逐一否定全部假設；應保留樣品及數據，檢查各項工作的對應關係，再由證據釐清需要修正之處。","correct":"A","options":[{"id":"A","text":"保留樣品與測量事實，核對資料和模型，釐清不符之處","explanation":"正確：同時保存不同活動的有效資訊並追查差異。"},{"id":"B","text":"只要甲製出材料，就能判定丙的解釋必定正確","explanation":"錯誤：製備成功不直接驗證解釋。"},{"id":"C","text":"只要按原配方製備，就可以判定差異唯一來自乙的儀器","explanation":"錯誤：按配方製備尚未排除模型或條件等其他可能原因。"},{"id":"D","text":"只要某次測量不符，就可以判定丙的全部假設在任何條件都錯","explanation":"錯誤：一次不符不能逐一否定全部假設及適用條件。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B085","stem":"工廠的新配方樣品尚未測量，但模型預測其性能較佳。報告應採哪項說法？","concept":"研究進度可以分別描述：樣品已製成，屬製造完成的部分；較佳性能目前來自模型，屬待檢查的預測；實測尚未進行。這樣能清楚指出已知與待確認事項。材料是否適合用途仍應看相關性能，不能由單一預測跳到全部品質合格。","correct":"A","options":[{"id":"A","text":"已有樣品與較佳性能的預測；性能改善仍待實測","explanation":"正確：準確區分實際樣品、模型預測及未完成測量。"},{"id":"B","text":"已有模型，所以所有品質項目都已通過","explanation":"錯誤：模型不是所有品質項目的測試結果。"},{"id":"C","text":"模型預測較佳，代表樣品必然適合任何用途","explanation":"錯誤：某性能預測較佳不等於所有用途都合適。"},{"id":"D","text":"尚未測量，所以不可能已有實際樣品","explanation":"錯誤：製備可以先於性質測量。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B086","stem":"某材料模型預測性質值為12；製成樣品後實測值為9（同一單位）。對這項研究何者正確？","concept":"樣品已製成且已有實測數值，因此有製備與量測兩項成果。重新比較12和9，模型比實測高12−9＝3；9本身是實測值，不能當成兩者差值。差異指出需要檢查樣品、測試條件與模型，但沒有單憑3這個數字就確定原因。計算差值與解釋差值是不同工作。","correct":"D","options":[{"id":"A","text":"預測比實測低3，因此模型低估了此性質","explanation":"錯誤：12大於9，預測是較高而非較低。"},{"id":"B","text":"兩者相差3，已足以確定只需改量測儀器而不必檢查模型","explanation":"錯誤：差值本身未辨明儀器、條件或模型的原因。"},{"id":"C","text":"實測值是9，故預測與實測的差值也是9","explanation":"錯誤：9是實測值，差值應為12−9＝3。"},{"id":"D","text":"已完成製備與測量，預測比實測高3，需檢查差異","explanation":"正確：活動判斷及12−9＝3均符合題目。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B087","stem":"農業材料研究者先量測物質X在土壤中的資料，再建立移動模型，最後配製新的候選材料。各步的主要目的依序為何？","concept":"同一應用領域可以包含多種化學活動，先後順序取決於研究需求。本題先分析土壤中的X來取得資料，再用模型解釋與預測移動，最後製備候選材料。重點是把每個動作與成果一一對上，而不是把「農業研究」整體只算成製造或只算成測量。","correct":"C","options":[{"id":"A","text":"取得實測資料、取得新樣品、解釋與預測","explanation":"錯誤：第二步是模型，第三步才取得新樣品。"},{"id":"B","text":"解釋物質行為、製造新樣品、取得實測資料","explanation":"錯誤：把量測、模型與配製三項目的錯置。"},{"id":"C","text":"取得實測資料、解釋與預測、取得新樣品","explanation":"正確：依序對應分析、模型及實際配製。"},{"id":"D","text":"取得新樣品、取得實測資料、解釋物質行為","explanation":"錯誤：第一步尚未配製新樣品，第三步不是建模。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B088","stem":"某性能指標越高越符合本次用途。材料甲的數值來自實測，材料乙只有模型預測，且乙的數值較高。下列何者最恰當？","concept":"題目已限定性能指標越高越符合本次用途，因此乙的較高預測值可提供後續研究的方向。但甲已有實測，乙尚只有模型，兩者的證據不同。應透過製備或測試來檢查乙，保留模型篩選的作用，同時不將預測誤稱已實測的優勢。","correct":"C","options":[{"id":"A","text":"甲有直接量測，所以不必研究預測較高的乙","explanation":"錯誤：乙的預測可作為選擇後續研究候選的線索。"},{"id":"B","text":"兩者數值使用同一單位，便已完成實際材料的公平性能比較","explanation":"錯誤：單位相同未改變乙尚無實測的事實。"},{"id":"C","text":"乙值得後續製備或測試，但目前不能稱已實測優於甲","explanation":"正確：承認預測的用途，同時保留未測的限制。"},{"id":"D","text":"乙已被實測證明較佳","explanation":"錯誤：乙尚無實測，不能宣稱已實測優於甲。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B089","stem":"「技術服務」人員根據材料接觸清潔液後的實測變化，解釋可能的物質行為，再建議客戶試用另一配方。何者正確？","concept":"教材列出的化學工作不只有製造，也包括品質控制和技術服務。服務人員能用量測與物質知識協助解決實際用途問題。提出另一配方可以是後續方向，但仍須配製或取得材料並測試，不能把建議本身視為新配方所有性能已被證明。","correct":"C","options":[{"id":"A","text":"提出替代配方的建議，就已完成該配方全部性能測量","explanation":"錯誤：建議尚不等於已完成測試。"},{"id":"B","text":"只要能解釋原材料問題，就代表新配方必然合用","explanation":"錯誤：解釋原問題不足以保證所有替代方案都成功。"},{"id":"C","text":"服務工作可使用測量資料與化學解釋，不只發生在製造階段","explanation":"正確：服務可整合資料與解釋來處理材料使用問題。"},{"id":"D","text":"只要職稱是技術服務，就不會用到化學性質","explanation":"錯誤：職稱不會排除對物質性質的運用。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B090","stem":"團隊想讓候選材料更符合指定用途。哪組工作最能連接實際材料、性能資料與後續改良？","concept":"候選材料的改良可以連接製備、測量與建模：先有實際材料及性質資料，再以解釋與預測協助後續方向。配方的新穎程度不能代替性能量測，單項數據也不代表所有使用條件。模型符合舊資料仍需檢查新候選；各類成果保留實際資訊範圍，才能共同支援改良。","correct":"D","options":[{"id":"A","text":"量測材料性質後，把單一結果當成所有使用條件的完整解釋","explanation":"錯誤：一項性質結果不足以概括所有條件，仍需適用的解釋與檢查。"},{"id":"B","text":"配製候選材料後，以配方的新穎程度直接代替所有性能量測","explanation":"錯誤：配方新穎程度不能代替實際性能測量。"},{"id":"C","text":"先建立候選模型，只要符合一項舊資料，就認定新候選的全部性能已確認","explanation":"錯誤：符合一項舊資料未直接驗證新候選的全部使用性能。"},{"id":"D","text":"製備候選材料、量測其性質、以模型解釋結果並提出下一次改良方向","explanation":"正確：三種活動各有產出，且能形成後續改良依據。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 49；部分1 PDF頁 51；已審筆記頁 正文5-7。","example":"","pointId":"WHY-P09","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B091","stem":"印刷廠想更換顏料，要求換後仍能達到指定顏色且與基材相容。哪項工作最符合化學的貢獻？","concept":"日常印刷的色彩來自材料的性質；實際用途還可能要求顏料與所接觸材料相容。本題已指定顏色和基材兩項需求，因此應對應量測。天然來源或相同顏色名稱不能直接包辦性能判斷，其他用途的資料也不一定回答這個印刷問題。","correct":"D","options":[{"id":"A","text":"只要顏色名稱相同，就略過實際材料測試","explanation":"錯誤：名稱相同不保證材料的使用表現相同。"},{"id":"B","text":"由顏料是天然來源直接推定完全相容","explanation":"錯誤：來源不能直接證明接觸基材相容。"},{"id":"C","text":"只量顏料在另一種基材上的表現，就直接代表本次指定基材","explanation":"錯誤：另一基材的結果不能直接代替本次接觸相容性。"},{"id":"D","text":"比較候選顏料的顯色與接觸基材後的表現","explanation":"正確：兩項檢查直接對應題目所需的材料功能。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B092","stem":"清潔材料甲可去除污物，卻使受清潔表面受損；乙去污效果相同且在本次測試未造成該損傷。僅就這兩項資料，何者較符合需求？","concept":"清潔用途通常不只有把污物去掉，也要考慮被清潔材料的變化。本題兩者去污效果相同，乙在本次測試避免了甲造成的損傷，因此較符合這兩項要求。結論仍限定於受測條件，不能從一次結果擴張成對所有表面與所有影響的保證。","correct":"C","options":[{"id":"A","text":"甲，因為能損傷表面必定代表清潔功能更佳","explanation":"錯誤：表面受損不是題目要求的較佳清潔功能。"},{"id":"B","text":"兩者都可直接保證適合所有表面","explanation":"錯誤：尚未測其他表面，不能做全面保證。"},{"id":"C","text":"乙，因為保有去污功能且在受測條件下避免該損傷","explanation":"正確：同時滿足去污及本次表面保護需求。"},{"id":"D","text":"甲，因為相同去污效果會使表面損傷變得不重要","explanation":"錯誤：去污相同不會消除損傷這項差異。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B093","stem":"兩款包裝均能保護同一產品；甲每件用12 g材料，乙每件用9 g。包裝100件時，乙比甲少用多少材料？","concept":"日常包裝材料同時連結保護功能與原料使用。本題已給兩者保護同一產品的條件，原料差可直接算：每件12−9＝3 g，100件共少3×100＝300 g。900 g是乙的總用量，不是節省量；這項計算也未涵蓋材料製造及棄置的所有影響。","correct":"A","options":[{"id":"A","text":"300 g","explanation":"正確：每件少3 g，100件共少300 g。"},{"id":"B","text":"100 g","explanation":"錯誤：100是件數，不能直接當成材料差額。"},{"id":"C","text":"900 g","explanation":"錯誤：900 g為乙總用量，不是兩者差額。"},{"id":"D","text":"3 g","explanation":"錯誤：3 g只有一件包裝的差額。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B094","stem":"設計師把「OLED顯示材料」與「清潔材料」都列為化學產品。哪項共同理由最充分？","concept":"化學出現在多種日常產品中，並不表示產品使用相同成分或機構。OLED的顯示用途和清潔材料的去污用途不同，但都必須有合適的物質性質才能達成。辨認這個共同基礎，既能看見化學應用的廣度，也能保留不同產品在功能與影響上的差別。","correct":"B","options":[{"id":"A","text":"兩者都必須用同一反應產生相同效果","explanation":"錯誤：不同用途沒有必須共用同一反應的條件。"},{"id":"B","text":"兩者的實際用途都依賴所用物質的性質","explanation":"正確：材料性質支撐不同產品的功能。"},{"id":"C","text":"兩者只要有用，就不可能造成任何不利影響","explanation":"錯誤：有用與可能造成不利影響可以同時存在。"},{"id":"D","text":"兩者必定由相同物質組成","explanation":"錯誤：同屬化學應用不代表材料成分相同。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B095","stem":"飲料使用的精製糖由植物原料取得，包裝則使用製備的材料。何者正確？","concept":"植物來源的糖可經工業精製及分析，包裝可透過材料製備及性能研究完成用途；兩者都包含化學工作。來源、製程和成分資料各有用途，但原料不能直接代表精製產品，成分合格也不能代替包裝的使用測試。把每種資料對應它能回答的問題，才能合理說明產品品質與功能。","correct":"A","options":[{"id":"A","text":"天然原料的精製與包裝材料的製備都可能包含化學工作","explanation":"正確：兩項工作皆以取得或檢查所需物質為核心。"},{"id":"B","text":"糖只要來源相同，就可由原料資料直接確認精製後產品的純度","explanation":"錯誤：原料資料不能直接代替處理後產品的純度分析。"},{"id":"C","text":"包裝只要主要成分符合設計，就可省略所需使用性能的量測","explanation":"錯誤：成分符合設計不直接保證包裝性能符合要求。"},{"id":"D","text":"糖的純度和包裝的成分只要合格，就已確認兩者所有用途條件","explanation":"錯誤：兩項成分資訊未涵蓋各用途的全部條件。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B096","stem":"顧客詢問某塗料能否接觸清潔液L，技術人員手上只有「顏色符合要求」的測試。應如何處理？","concept":"材料的不同用途問題，需要相應的性質資訊。顏色達標與是否耐清潔液是不同要求，技術服務應先補足接觸L的資料，再提出建議。材料被稱為化學產品並不能直接判定可用或不可用，也不能將其他材料的不相關結果移用。","correct":"B","options":[{"id":"A","text":"以其他塗料的顏色資料取代本塗料接觸L的資料","explanation":"錯誤：其他塗料顏色仍未回答本材料接觸L的情況。"},{"id":"B","text":"補查或量測接觸L後的變化，再回答該用途","explanation":"正確：取得與顧客實際用途對應的性質資料。"},{"id":"C","text":"由顏色符合要求直接保證耐L","explanation":"錯誤：顏色測試沒有直接驗證耐L。"},{"id":"D","text":"由塗料屬化學產品推定必定不能接觸L","explanation":"錯誤：化學產品的名稱本身不決定是否耐L。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B097","stem":"某LED候選材料已在指定條件下改善照明表現。對這項成果，哪種說法恰當？","concept":"LED照明材料的改良是把物質性質連到日常功能的例子。指定條件下表現改善，可支持相應照明用途，但不能自動推論全部未測條件也改善。原料需求、用後影響與成分含量都是其他待研究資訊；即使材料有一項明確優點，其他用途及判斷仍需各自的性質證據。","correct":"C","options":[{"id":"A","text":"照明表現改善，就表示所有尚未測試條件的性能也改善","explanation":"錯誤：指定條件的成果未涵蓋未測條件。"},{"id":"B","text":"照明表現改善，就表示原料用量及用後影響也必定降低","explanation":"錯誤：照明性能未直接測得資源用量或用後影響。"},{"id":"C","text":"改良照明材料是化學應用之一，但其他用途仍需各自的性質證據","explanation":"正確：承認照明應用，同時逐項區分其他用途所需證據。"},{"id":"D","text":"照明表現改善，就表示該材料的全部成分含量也已量測確認","explanation":"錯誤：用途性能量測與完整組成分析提供不同資訊。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B098","stem":"工廠要替日常產品改用新塑膠。新塑膠在保護產品的測試較佳，但棄置後的影響尚未比較。何者正確？","concept":"日常材料的優點與潛在影響應分項評估。保護性能較佳是有用的資料，可支持該項功能；棄置後的影響則是另一個問題。合理判斷應把已知的優點保留，同時指出仍待了解的部分，避免用單一功能或材料名稱推定完整結論。","correct":"C","options":[{"id":"A","text":"只要是塑膠，就必定不適合任何日常用途","explanation":"錯誤：材料類別名稱不足以否定全部用途。"},{"id":"B","text":"保護較佳代表棄置影響必定較小","explanation":"錯誤：使用階段的功能不能直接決定棄置影響。"},{"id":"C","text":"已有保護功能的支持，仍需補足棄置影響資料才能作更全面比較","explanation":"正確：分清已證實的功能與尚未確認的影響。"},{"id":"D","text":"棄置影響未知代表保護測試完全沒有價值","explanation":"錯誤：另一項未知不會使已完成性能測試失去意義。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B099","stem":"同一種材料在用途甲需要耐液體L，在用途乙需要良好顯色。目前只證實耐L，何者最恰當？","concept":"同一材料可能有多項性質並用於不同情境，但每個用途的要求仍須分別確認。本題耐L資料與用途甲的條件相符；用途乙問的是顯色，尚未提供該項資訊。這是在運用材料知識作選擇，而不是以一項性能替所有用途背書。","correct":"B","options":[{"id":"A","text":"耐L與顯色是同一性質，所以兩用途都通過","explanation":"錯誤：耐液體與顯色不是題目中的同一項要求。"},{"id":"B","text":"資料支持用途甲的該項要求；用途乙仍須查顯色資料","explanation":"正確：已有證據對應甲的要求，乙仍缺相關測量。"},{"id":"C","text":"材料只能有一種用途，不能再研究用途乙","explanation":"錯誤：材料可被研究是否具有其他用途。"},{"id":"D","text":"只要用途名稱不同，既有耐L資料就必定錯誤","explanation":"錯誤：用途不同不會自動否定既有量測。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-1-topic02-G03-CMU-B100","stem":"一款新清潔材料每次用量由8 g降為5 g，且本次測試去污效果相同。下列何者正確？","concept":"以相同清潔任務比較，原用量8 g、新用量5 g，每次少8−5＝3 g。題目又給去污效果相同，因此可同時保留「較少用量」和「本次效果不變」兩項結果。但用量下降不直接回答接觸表面、健康或棄置後的所有影響，也不改變研究對象是物質。","correct":"B","options":[{"id":"A","text":"每次少用5 g，且已證明所有影響都更小","explanation":"錯誤：5 g是新用量，而且題目未評估所有影響。"},{"id":"B","text":"每次少用3 g並保留本次去污效果，其他影響須另評估","explanation":"正確：差值3 g、效果相同及其他影響未知均符合條件。"},{"id":"C","text":"去污效果相同，就表示排放物的影響也一定相同","explanation":"錯誤：去污功能相同，不代表排放物的性質與影響相同。"},{"id":"D","text":"每次少用8 g，所以新材料完全不需原料","explanation":"錯誤：8 g為原用量，新材料仍使用5 g。"}],"source":"Chemistry: The Central Science in SI Units 15th Global Edition；Ch.1 > 1.1 The Study of Chemistry > Why Study Chemistry?；印刷頁 48-50；部分1 PDF頁 50-52；已審筆記頁 正文2、5、8。","example":"","pointId":"WHY-P10","schools":["CMU"]}]},{"depth":"精讀","target":150,"questions":[]}],"schoolBanks":{"CMU":[["central-0-1-ch1-sec1-1-topic02-G03-CMU-S001","central-0-1-ch1-sec1-1-topic02-G03-CMU-S002","central-0-1-ch1-sec1-1-topic02-G03-CMU-S003","central-0-1-ch1-sec1-1-topic02-G03-CMU-S004","central-0-1-ch1-sec1-1-topic02-G03-CMU-S005","central-0-1-ch1-sec1-1-topic02-G03-CMU-S006","central-0-1-ch1-sec1-1-topic02-G03-CMU-S007","central-0-1-ch1-sec1-1-topic02-G03-CMU-S008","central-0-1-ch1-sec1-1-topic02-G03-CMU-S009","central-0-1-ch1-sec1-1-topic02-G03-CMU-S010","central-0-1-ch1-sec1-1-topic02-G03-CMU-S011","central-0-1-ch1-sec1-1-topic02-G03-CMU-S012","central-0-1-ch1-sec1-1-topic02-G03-CMU-S013","central-0-1-ch1-sec1-1-topic02-G03-CMU-S014","central-0-1-ch1-sec1-1-topic02-G03-CMU-S015","central-0-1-ch1-sec1-1-topic02-G03-CMU-S016","centra
