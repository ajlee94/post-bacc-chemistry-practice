ion；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-03","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B051","stem":"48 cm³液體完整移入底面積12 cm²的直筒，再移入底面積8 cm²的直筒。兩筒皆足夠高，已知V＝底面積×液高，條件不變。前後液高依序為何？","concept":"液體固定體積並不固定液高。依所給V＝Ah，液高h＝V/A；第一筒48/12＝4 cm，第二筒48/8＝6 cm。較窄的第二筒必須以更高液柱容納相同體積，不需增加液體分子數。","correct":"D","options":[{"id":"A","text":"12 cm、8 cm","explanation":"錯誤。這直接把底面積數字誤當高度。"},{"id":"B","text":"6 cm、4 cm","explanation":"錯誤。較寬筒應有較低液面，順序寫反。"},{"id":"C","text":"4 cm、4 cm","explanation":"錯誤。相同體積遇不同底面積，液高不會相同。"},{"id":"D","text":"4 cm、6 cm","explanation":"正確。48÷12＝4、48÷8＝6，體積仍為48 cm³。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B052","stem":"兩個直筒底面積分別為5與9 cm²，液面都高4 cm。用V＝底面積×液高比較其中液體體積，何者正確？","concept":"比較液量應同時看橫向面積與高度。雖然兩筒同高4 cm，較大底面積的筒仍容納更多液體，計算為20與36 cm³。等高只有在截面條件相同時才可直接支持等體積，不能跨不同寬度容器套用。","correct":"B","options":[{"id":"A","text":"兩者同為4 cm³，因液面等高","explanation":"錯誤。高度不是體積，尚須乘底面積。"},{"id":"B","text":"分別為20與36 cm³，等高不能證明等體積","explanation":"正確。5×4＝20，9×4＝36。"},{"id":"C","text":"分別為5與9 cm³，因體積只看底面積","explanation":"錯誤。計算也需要液高。"},{"id":"D","text":"分別為36與20 cm³，較寬者體積較小","explanation":"錯誤。此排列把兩筒的乘積反置。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B053","stem":"原有65 mL液體，轉移時有7 mL留在原杯、另有3 mL滴在接液盤，其他全進新杯且無蒸發。新杯讀值應是多少？","concept":"同份液體有一定體積，不表示每次倒水新杯都必收到全部份量。此處液體分散三處，新杯55、原杯7、接盤3 mL合計65 mL。新杯讀值下降由轉移不完全解釋，無須推論液體本身被壓縮或分子變小。","correct":"A","options":[{"id":"A","text":"55 mL","explanation":"正確。65−7−3＝55 mL；三處合計仍為65 mL。"},{"id":"B","text":"58 mL","explanation":"錯誤。只扣原杯殘留，漏扣接液盤3 mL。"},{"id":"C","text":"62 mL","explanation":"錯誤。只扣滴落量，漏扣原杯7 mL。"},{"id":"D","text":"65 mL","explanation":"錯誤。新杯未收到全部液體，不能直接沿用原總量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B054","stem":"同一份液體先後倒入兩個不同形狀容器，體積保持。微觀上哪項改變最能解釋外形不同？","concept":"液體的宏觀形狀由大量分子的空間配置形成。粒子彼此靠近又能相互滑過，就可在總體積近乎不變下重新適應容器。改變的是分子彼此位置及樣品邊界，不是每顆分子的化學式或本體形狀。","correct":"C","options":[{"id":"A","text":"每個分子都改變化學式以適應杯壁","explanation":"錯誤。改形不需要改變分子身分。"},{"id":"B","text":"分子全變成固定位置，才能取得新形狀","explanation":"錯誤。液體的流動改形依賴相對移動。"},{"id":"C","text":"分子仍靠近，但彼此滑動而重新配置","explanation":"正確。重新配置可改樣品外形而保留近似體積。"},{"id":"D","text":"分子平均分布必變得與氣體同樣疏遠","explanation":"錯誤。保持液態不需形成氣體般的大間隙。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B055","stem":"一份24 mL液體完整移入容量120 mL的空杯，在原溫壓下維持液態。何者正確？","concept":"空杯容量是上限，不是液體必須達到的體積。24 mL液體在相同條件下完整轉移，仍約24 mL，只占120 mL的五分之一。這個比例描述液體與容器空間的關係，不能解讀為五分之四的分子流失。","correct":"D","options":[{"id":"A","text":"液體會自行增加到120 mL，因杯子有那麼大","explanation":"錯誤。液體不會像氣體任意填滿更大容積。"},{"id":"B","text":"液體會維持原杯的完整外形，懸在新杯中","explanation":"錯誤。液體無自身固定外形。"},{"id":"C","text":"液體只剩原來的1/5分子，因只占新杯1/5","explanation":"錯誤。占容量的比例不是轉移後分子保留比例。"},{"id":"D","text":"液體仍約24 mL，占新杯容量的1/5並依所占區域改形","explanation":"正確。24÷120＝1/5，不需要改變樣品份量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B056","stem":"某液體由底面積A的直筒轉入底面積3A的直筒，兩筒均足夠高，完整轉移且條件不變。已給V＝A×h，新液高應如何變化？","concept":"同份液體維持V時，可以用不同面積與高度組合占據相同空間。將Ah與3A乘新高度相等，得到新高度h/3。這是容器變寬使液面降低，沒有移走液體，也不意味分子總數減少。","correct":"B","options":[{"id":"A","text":"變為原來3倍，因底面積3倍","explanation":"錯誤。固定體積下高度與底面積呈反向變化。"},{"id":"B","text":"變為原來1/3，體積不變","explanation":"正確。Ah＝3A×新高度，故新高度＝h/3。"},{"id":"C","text":"保持原高度，體積也不變","explanation":"錯誤。底面積增為3倍而高度不變會使體積3倍。"},{"id":"D","text":"變為原來1/3，分子總數也變1/3","explanation":"錯誤。高度減少由幾何解釋，完整轉移保留總數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B057","stem":"液體樣品先以自由流動方式進入彎曲管，再取出放入直筒，沒有損失或相變。哪項敘述正確？","concept":"液體在任何一次容器內都會有外形，但外形存在不等於具有自身固定形狀。能由彎管形狀改成直筒所占部分形狀，正顯示粒子能滑動重新配置。轉移若完整且條件不變，體積仍可保持。","correct":"C","options":[{"id":"A","text":"曾呈彎管外形表示它永久獲得固定形狀","explanation":"錯誤。液體在下一容器仍可重新改形。"},{"id":"B","text":"體積保持表示其粒子全程不能相對移動","explanation":"錯誤。液體可在體積近乎固定時相互滑動。"},{"id":"C","text":"兩次外形都受容器限制，不能用某次管內外形宣稱液體有自身固定形狀","explanation":"正確。容器塑造的形狀與樣品自己保形不同。"},{"id":"D","text":"通過彎管必須先變成氣體，否則不能轉彎","explanation":"錯誤。液體本來即可流動經過彎曲通道。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B058","stem":"追蹤某密集粒子樣品，發現粒子長時間會離開原鄰居、移到新鄰居旁，而樣品能流動且不易壓縮。最合理的物態與理由為何？","concept":"判態需要把間距與運動限制同時納入。粒子密集、不易壓縮說明它不是典型疏遠氣態；又能持續更換相對鄰居且整體流動，符合液態。不能只由靠近判固體，也不能只由位置改變判氣體。","correct":"A","options":[{"id":"A","text":"液態；粒子靠近但相對位置可持續改變","explanation":"正確。這組微觀資料與流動、低可壓縮性一致。"},{"id":"B","text":"固態；粒子只要靠近就不能流動","explanation":"錯誤。靠近並未排除液態，且資料顯示持續換位。"},{"id":"C","text":"氣態；只要換鄰居就必相距非常遠","explanation":"錯誤。液態靠近的粒子也能滑過與換鄰居。"},{"id":"D","text":"無法是任何物態，因運動與不易壓縮互相矛盾","explanation":"錯誤。液體正兼具兩者。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B059","stem":"30 mL液體從開口杯轉入大皿後只回收到26 mL；另有4 mL留在擦拭用吸收材料中。已確認無反應與相變。哪項結論合理？","concept":"核對體積或份量時，要追蹤所有去向。大皿26 mL加上材料中的4 mL，合計仍為30 mL；單看回收到一個容器的讀值會誤判損失。此題沒有壓力造成液體體積縮減的證據，只是液體分散在不同位置。","correct":"D","options":[{"id":"A","text":"液體總體積必縮小4 mL，因只看大皿就足夠","explanation":"錯誤。不能忽略材料內仍存在的4 mL液體。"},{"id":"B","text":"液體分子總數必減少4個","explanation":"錯誤。mL不是分子個數，且物質只是分散到別處。"},{"id":"C","text":"大皿中的液體一定是固體，否則不會少於原量","explanation":"錯誤。回收不完全與物態判定不同。"},{"id":"D","text":"兩處合計仍30 mL，大皿減量不能單獨證明液體本體可大幅壓縮","explanation":"正確。26＋4＝30，差異來自去向而非壓縮。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B060","stem":"一份液體在相同溫壓下完整移入容積更大的瓶子，瓶中留下空間。哪一項微觀解釋最適合？","concept":"液體的粒子模型不是被困在一處而完全不能動，而是靠近的粒子能滑過彼此。這容許外形順應新瓶，卻不需要向全部空腔任意膨脹。因而較大瓶內留下空間，是同份液體保持一定體積的正常結果。","correct":"B","options":[{"id":"A","text":"液體分子完全靜止，因此不能接觸新的瓶壁","explanation":"錯誤。液體分子會運動，並可接觸其所占區域的瓶壁。"},{"id":"B","text":"液體分子仍彼此靠近且能滑動，但不會因空瓶更大就任意增加間距填滿全瓶","explanation":"正確。固定體積與可改形可以並存。"},{"id":"C","text":"液體分子數必減少到恰好留下空間","explanation":"錯誤。完整轉移可保留所有分子，仍只占一定體積。"},{"id":"D","text":"只要留下空間，液體就必具有固體的固定形狀","explanation":"錯誤。未填滿容器與自身保形不是同一性質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B061","stem":"一個直筒底面積10 cm²，原液高3 cm；再加入20 cm³同種液體，假設體積直接相加且無損失。依V＝底面積×液高，新液高為何？","concept":"題目明定體積可相加，先算原液體10×3＝30 cm³，再加入20得50 cm³，液高為5 cm。樣品份量增加使體積增加，不違反同份液體的固定體積性質；計算時也要避免把不同單位的數字直接相加。","correct":"C","options":[{"id":"A","text":"2 cm","explanation":"錯誤。20÷10只算新增部分的高度，漏了原3 cm。"},{"id":"B","text":"3 cm","explanation":"錯誤。加入額外液體改變樣品份量，液高不必維持。"},{"id":"C","text":"5 cm","explanation":"正確。原30 cm³加20為50，50÷10＝5 cm。"},{"id":"D","text":"23 cm","explanation":"錯誤。不能把體積20 cm³直接加到高度3 cm。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B062","stem":"一份60 cm³液體倒入兩個直筒，甲分到24 cm³且底面積6 cm²，乙分到其餘且底面積9 cm²。用V＝底面積×液高計算，何者正確？","concept":"先做份量分配，再換算各筒高度。乙收到60−24＝36 cm³，雖比甲多，較大的9 cm²截面使兩筒都高4 cm。這個例子說明不同截面容器可以等高而不等體積，讀取液面時不能漏看容器幾何。","correct":"A","options":[{"id":"A","text":"兩筒液高都4 cm，但乙液體體積較多","explanation":"正確。甲24÷6＝4，乙(60−24)÷9＝4。"},{"id":"B","text":"兩筒液高都4 cm，所以兩筒分子數必相同","explanation":"錯誤。等高但體積不同，不能由高度推論相同份量。"},{"id":"C","text":"甲4 cm、乙20/3 cm，因乙也用全份液體體積計算","explanation":"錯誤。乙只分到36 cm³，不應用全份60 cm³除以9 cm²。"},{"id":"D","text":"甲6 cm、乙9 cm，因底面積決定高度數值","explanation":"錯誤。底面積本身不是液高。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B063","stem":"某液體裝滿薄軟袋後，袋外形可被輕輕改變，量測液體體積幾乎未變且沒有相變。何者最合理？","concept":"形狀描述空間的輪廓，體積描述空間的總量，兩者可以分別改變。軟袋內液體粒子彼此滑動，便能取得新輪廓而保留體積。不能把容易改形誤當成容易壓縮，也不能用體積穩定推論粒子靜止。","correct":"D","options":[{"id":"A","text":"形狀變化必伴隨相同比例的體積減少","explanation":"錯誤。樣品可重新配置而保持體積。"},{"id":"B","text":"體積不變證明袋中液體的每個粒子全程不動","explanation":"錯誤。改形可由液體粒子相互滑動完成。"},{"id":"C","text":"軟袋改形表示液體會任意填滿任何更大空間","explanation":"錯誤。改形不代表具有氣體的無固定體積。"},{"id":"D","text":"粒子相對滑動使外形改變，粒子仍靠近而體積近乎固定","explanation":"正確。兩項液態特徵共同解釋觀察。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B064","stem":"實驗要檢查「同份液體有近似固定體積」。哪一組操作最能直接對應這項命題？","concept":"檢驗固定體積應讓題目中的「同份」真正成立，並控制會影響狀態的條件。完整轉移、相同溫壓、可靠體積讀值可直接比較容器改變的效果；加熱汽化或倒掉部分液體會改變比較對象，不能拿來反駁這項性質。","correct":"B","options":[{"id":"A","text":"比較10 mL與80 mL兩份液體，觀察它們不同大小","explanation":"錯誤。這改變了份量，並非同份比較。"},{"id":"B","text":"在相同溫壓下完整轉移同份液體到不同容器，再以校準方法測體積","explanation":"正確。控制份量與條件，只改容器形狀。"},{"id":"C","text":"把水加熱至大量汽化，再只量剩下液體","explanation":"錯誤。相變與單相份量改變干擾了原命題。"},{"id":"D","text":"將液體倒掉一半，再比較新舊刻度","explanation":"錯誤。移走液體改變樣品份量。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B065","stem":"甲液體粒子相互靠近且可滑動；乙氣體粒子相距較遠且廣泛移動。將兩者各自完整移到更大的密閉容器，均無反應、流失或相變。甲轉移前後溫度與所受壓力相同；乙維持相同溫度，允許壓力改變。哪項預測合理？","concept":"液體與氣體的粒子都能相對移動，因此都能改形。甲在同溫、同壓下轉移，粒子仍靠近，體積近乎不變；乙在同溫但允許變壓的條件下，原有粒子可分布到更大的可達空間。維持份量不等於兩種物態都維持原體積。","correct":"C","options":[{"id":"A","text":"甲乙都保持原外形，只有體積改變","explanation":"錯誤。液氣都沒有自身固定外形。"},{"id":"B","text":"甲乙都必保持原體積且容易同程度壓縮","explanation":"錯誤。兩者體積及可壓縮性不同。"},{"id":"C","text":"甲主要改變外形而維持近似體積，乙會擴展到更大可達空間","explanation":"正確。甲在同溫同壓下維持近似體積而改形；乙允許壓力改變，會擴展到更大可達空間。"},{"id":"D","text":"甲填滿全容器，乙只占原來固定小塊空間","explanation":"錯誤。這把液氣的體積行為反置。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 5、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-04","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B066","stem":"一個固體模型中，粒子甲的位置依序為4.00、4.03、3.98、4.01單位，鄰近粒子也只在各自中心附近小幅往返。哪項判讀合理？","concept":"先看位移範圍：資料都在4附近，偏差只有數百分之一單位，沒有持續遠離原位置。此種局部往返可用固態粒子振動解釋。固體的形狀穩定要求大致位置關係受限，不要求每個瞬間座標一模一樣。","correct":"C","options":[{"id":"A","text":"粒子甲已自由流遍容器，所以一定是氣體","explanation":"錯誤。所列位置只在4附近小幅變化。"},{"id":"B","text":"位置有變就不能是固體","explanation":"錯誤。固態粒子也可振動。"},{"id":"C","text":"資料支持位置附近振動，可與固態保形相容","explanation":"正確。活動受限在局部而非持續跨越鄰近位置。"},{"id":"D","text":"所有數值必須完全相同，才符合任何固體模型","explanation":"錯誤。這把固態錯誤要求為完全靜止。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B067","stem":"一塊固體平移5 cm，內部兩個標記粒子在整塊移動前後的平均相距都為0.3單位。若粒子仍只在原相對位置附近振動，何者正確？","concept":"粒子相對於房間的座標會隨整塊固體搬動而改變，但內部相對配置仍可保留。此題以平均間距和局部振動說明保形與整體位移兼容。把固體搬動誤當成液態內部流動，是沒有區分整體運動與相對運動。","correct":"A","options":[{"id":"A","text":"整塊位移不等於內部粒子像液體般換位，固態模型仍合理","explanation":"正確。要用相對位置判讀內部運動自由度。"},{"id":"B","text":"每個粒子移動5 cm就證明固體已汽化","explanation":"錯誤。整體平移可讓所有粒子共同移動而不相變。"},{"id":"C","text":"固體具有固定形狀，所以整塊平移不可能發生","explanation":"錯誤。保形不限制樣品所在位置。"},{"id":"D","text":"兩粒子平均距離相同表示它們都完全沒有振動","explanation":"錯誤。平均值相同可以與瞬間小幅變動並存。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B068","stem":"某固體被切成三塊，各塊體積依序為8、11、6 cm³，切割沒有物質損失與相變。下列何者正確？","concept":"切割改變物體被分成幾份，並不自動改變材料物態或微觀粒子數。無損失且無相變時，三塊體積相加可回到原25 cm³，每塊仍可具有固態保形特徵。分塊的數目與微觀粒子的數目屬不同尺度。","correct":"D","options":[{"id":"A","text":"三塊能分開移動，故都失去固態","explanation":"錯誤。固體碎塊能獨立搬動而保留固態。"},{"id":"B","text":"原固體體積是11 cm³，因只取最大塊","explanation":"錯誤。原體積需加總全部無重疊碎塊。"},{"id":"C","text":"構成固體的微觀粒子總數變為原來3倍，因塊數為3","explanation":"錯誤。宏觀塊數增加不等於微觀粒子總數增加。"},{"id":"D","text":"原體積合計25 cm³，各塊仍可保有自身形狀","explanation":"正確。8＋11＋6＝25，切割不必改變物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B069","stem":"固體受外力彎曲後留下新外形，移除外力後不繼續像液體流動。有人說這足以否定固體有固定形狀。哪項回應適當？","concept":"固定形狀是物態的一般巨觀性質，不是對任何機械處理都不可改變的承諾。固體可以被切割或外力彎曲，之後仍保留自己的新外形。判態應看正常條件下是否持續流動與是否自有形狀，不能只看曾受外力改形。","correct":"B","options":[{"id":"A","text":"固體有固定形狀表示任何外力都不可能使它變形","explanation":"錯誤。此說法把通常條件的性質擴張為絕對不可變形。"},{"id":"B","text":"外力可使固體變形；應在排除持續破壞或變形操作後比較其自身保形能力","explanation":"正確。外力變形不必等於熔化或液態流動。"},{"id":"C","text":"只要彎曲就一定成為氣體","explanation":"錯誤。氣態需要不同的物態證據。"},{"id":"D","text":"固體變形表示每個微觀粒子都變成相同彎曲形狀","explanation":"錯誤。巨觀輪廓改變不等於每個微觀粒子本體同形變化。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B070","stem":"甲樣品保持自身外形，粒子靠近且只在位置附近振動；乙樣品也不易壓縮，但粒子可持續滑過彼此。何者為正確比較？","concept":"先用共同的靠近解釋兩者低可壓縮性，再用不同的活動限制判別。甲主要在位置附近振動，符合固體保形；乙可持續滑動，符合液體。固液不是以粒子有無運動區分，而是看運動如何受到位置限制。","correct":"C","options":[{"id":"A","text":"甲乙都一定是固體，因粒子靠近","explanation":"錯誤。靠近是液固共有性質，不能忽略乙的滑動。"},{"id":"B","text":"甲是液體，乙是固體","explanation":"錯誤。這把位置限制與流動性反置。"},{"id":"C","text":"甲為固體、乙為液體；兩者不易壓縮可由粒子靠近共同解釋","explanation":"正確。形狀差異由相對位置限制區分。"},{"id":"D","text":"甲是氣體，因振動表示快速運動","explanation":"錯誤。任何微觀運動都不能直接判為氣態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B071","stem":"一個實心立方體的邊長為2 cm，放入200 cm³大盒後仍保形。已給立方體體積＝邊長三次方，忽略任何體積變化。固體本身體積為何？","concept":"題面已提供立方體體積算法，三個方向相乘得8 cm³。固體換到200 cm³大盒仍保持自身形狀與體積，其餘192 cm³不是固體自動擴展的區域。此題用幾何資料區分樣品本體與外容器容量。","correct":"A","options":[{"id":"A","text":"8 cm³，與盒子容量無須相同","explanation":"正確。2×2×2＝8，固體不會自動填滿大盒。"},{"id":"B","text":"200 cm³，因固體放在盒內就等於盒容量","explanation":"錯誤。容器容量不是固體自身體積。"},{"id":"C","text":"192 cm³，因這是扣掉立方體後的空間","explanation":"錯誤。192是盒中其餘空間，而非固體體積。"},{"id":"D","text":"2 cm³，因邊長是2","explanation":"錯誤。邊長是一維長度，體積須三次方。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B072","stem":"一堆細小固體晶粒可以從漏斗流下，但顯微觀察顯示每一粒保持自身外形、內部粒子受限在位置附近。最合適的判斷為何？","concept":"粉末或細粒整堆可以被倒動，並不代表每一顆的內部都呈液態。固體晶粒能整顆滑動，而各粒自身形狀及內部位置限制仍保留。此題以顯微資料補充巨觀觀察，避免把顆粒集合的流動直接當成物態判準。","correct":"D","options":[{"id":"A","text":"漏斗中可流動就證明每一晶粒是液體","explanation":"錯誤。整顆晶粒滑動與內部液態流動不同。"},{"id":"B","text":"每一晶粒必是氣體，才能通過漏斗","explanation":"錯誤。固體小顆粒也可穿過適當開口。"},{"id":"C","text":"晶粒內部粒子必須完全靜止才能是固體","explanation":"錯誤。固態粒子仍可振動。"},{"id":"D","text":"各晶粒仍可為固體，整堆傾倒是顆粒之間重新排列與移動","explanation":"正確。應分辨單粒材料與顆粒集合的行為。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B073","stem":"一塊冰在未熔化前可保持形狀，熔化後的水可流動。哪項微觀比較正確？","concept":"冰與液態水前後都是H₂O，但粒子活動限制不同。冰的分子主要在位置附近振動；熔化後分子能在靠近的情況下相互滑過，因此水會改形流動。判斷這項差異不需要把固態誤寫成完全靜止，也不必討論體積增減方向。","correct":"B","options":[{"id":"A","text":"冰中分子完全不動，液水中才首次出現運動","explanation":"錯誤。冰中分子也在位置附近振動。"},{"id":"B","text":"冰中分子相對位置受限；液水分子仍靠近但可互相滑過","explanation":"正確。此差異解釋保形與流動。"},{"id":"C","text":"冰中H₂O消失，水中重新產生H₂O","explanation":"錯誤。單純熔化保留H₂O分子身分。"},{"id":"D","text":"冰中分子比氣體疏遠，所以能保形","explanation":"錯誤。固態位置限制與靠近模型才符合本題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B074","stem":"研究者觀察一塊固定放在桌上的固體，長時間看到外形不變。單憑此巨觀觀察，何者不能直接推得？","concept":"肉眼外形反映巨觀輪廓，無法逐顆看出粒子的微小振動。固體保形與粒子在位置附近運動可以同時存在，因此不能由宏觀穩定跳到所有粒子永遠靜止。此題問的是不被資料直接支持的過度推論。","correct":"C","options":[{"id":"A","text":"此觀察與固體保形性質相容","explanation":"錯誤。這是合理的相容性判斷，可由所見支持。"},{"id":"B","text":"樣品沒有像液體般明顯流動改形","explanation":"錯誤。外形穩定的觀察可支持此範圍內敘述。"},{"id":"C","text":"每個粒子在所有瞬間都完全停止運動","explanation":"正確。肉眼保形不能排除微觀局部振動。"},{"id":"D","text":"若要知道粒子運動，還需要微觀模型或其他資訊","explanation":"錯誤。這是承認觀察尺度限制的合理結論。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B075","stem":"同一固體分別在小盒與大盒中量測，保持相同形狀與體積；但研究者可把整塊旋轉90度。哪項描述正確？","concept":"形狀、體積、位置與取向要分開。固體可以在保留自身輪廓與大小時整塊旋轉，內部相對配置也可大致保持。這種整體運動不等於液體粒子的相對滑動，也不需要粒子在材料內持續互換位置。","correct":"A","options":[{"id":"A","text":"旋轉改變方向，未必改變固體自身形狀、體積或內部相對排列","explanation":"正確。取向與形狀是不同項目。"},{"id":"B","text":"旋轉後粒子必在固體內部自由滑過彼此","explanation":"錯誤。整塊旋轉可保留內部相對配置，不需要液態般的持續換位。"},{"id":"C","text":"外盒變大表示固體中的微觀粒子必變大，只是肉眼看不出","explanation":"錯誤。沒有支持粒子本體尺寸增加的證據。"},{"id":"D","text":"固體若保有形狀，就絕不可能改變取向","explanation":"錯誤。保持外形的物體可以整體旋轉。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-05","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B076","stem":"甲模型粒子密集且時間序列顯示相對鄰居不斷更換；乙模型粒子密集但主要在固定中心附近振動；丙模型粒子疏遠並遍及容器。哪組巨觀預測合理？","concept":"模型判讀先找兩個軸：疏密決定可縮減間隙多寡，位置限制決定能否保形。甲密集可換鄰居為液體，乙密集受限為固體，丙疏遠可遍及空間為氣體。再把每種模型轉成對應的巨觀形狀與體積性質。","correct":"B","options":[{"id":"A","text":"甲保形，乙會流動，丙保體積","explanation":"錯誤。三個預測皆未對應模型的位置限制或疏密。"},{"id":"B","text":"甲保近似體積但可改形，乙保形保體積，丙形狀體積均隨可達容器","explanation":"正確。依序符合液、固、氣。"},{"id":"C","text":"甲容易大幅壓縮，乙無固定形狀，丙完全不動","explanation":"錯誤。這些性質與所列模型不相容。"},{"id":"D","text":"三者都只在原位置振動，所以都保形","explanation":"錯誤。甲與丙明確有較自由的位置改變。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B077","stem":"兩張相同尺度的單張影像都顯示粒子密集，其中一張屬液體、一張屬固體。若再取得一種資料，何者最能協助分辨？","concept":"一張密集分布圖不能完整交代粒子如何運動。加入時間序列後，可分辨持續相互滑動的液態與局部振動的固態。有效補充資料應針對兩態的差異，重複量測共有的靠近或占據空間沒有同樣判別力。","correct":"D","options":[{"id":"A","text":"在相同條件下再確認兩者轉移前後體積近乎不變","explanation":"錯誤。固體與液體均可保有一定體積，仍不能區分兩者。"},{"id":"B","text":"確認兩者粒子都比典型氣體靠近","explanation":"錯誤。這只是重複已知的共有特徵。"},{"id":"C","text":"確認兩者都占據非零空間","explanation":"錯誤。固液都占有體積，仍無法區分。"},{"id":"D","text":"連續追蹤粒子，看其是否持續互相滑過或只在原位置附近往返","explanation":"正確。時間資訊能顯示液固不同的位置限制。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B078","stem":"三個粒子模型同樣畫12個點，但圖框代表的實際容積與放大倍率都未標示。有人僅看紙上點距判定哪份氣體最密。何者正確？","concept":"圖像比較需要相同或可換算的尺度。三張都畫12個點只告訴我們模型數量相同，沒有說明實際容積或圖的放大倍率。紙上疏密可能只是繪圖尺度不同，因此要取得尺度或實際體積後，才能比較真實平均分布。","correct":"A","options":[{"id":"A","text":"缺少共同尺度，不能把紙上距離直接當實際平均間距比較","explanation":"正確。放大倍率不同可改變圖上間距。"},{"id":"B","text":"點數相同就能保證三份樣品容積相同","explanation":"錯誤。相同粒子數可以占不同體積。"},{"id":"C","text":"圖框畫得較大代表每個分子本體較大","explanation":"錯誤。圖框大小不直接決定分子本體尺寸。"},{"id":"D","text":"只要有12個點就一定是固體","explanation":"錯誤。點數本身不決定物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B079","stem":"甲樣品會流動、不易壓縮；乙樣品也會流動、卻容易壓縮。若兩者都保持各自物態，下列哪一組微觀解釋一致？","concept":"共同能流動表示兩者粒子可相對移動；不同的可壓縮性則指向不同平均間距。液體粒子近且可滑動，氣體粒子遠且可自由移動，所以兩者皆可改形，而氣體較容易壓縮。應分別用兩個微觀特徵解釋兩種性質。","correct":"C","options":[{"id":"A","text":"甲粒子只能原地振動；乙粒子也只能原地振動","explanation":"錯誤。此組不能解釋兩者都可流動。"},{"id":"B","text":"甲粒子遠且固定；乙粒子近且固定","explanation":"錯誤。間距與位置限制都不符合題目性質。"},{"id":"C","text":"甲粒子近而可滑動；乙粒子遠而可廣泛移動","explanation":"正確。共同位置自由與不同間距解釋流動性及可壓縮性。"},{"id":"D","text":"甲粒子遠而可移動；乙粒子近而可滑動","explanation":"錯誤。此排列把兩者的間距與可壓縮性關係對調了。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B080","stem":"一份樣品由「粒子靠近、受限在原位置附近」變為「粒子仍靠近、可互相滑過」。哪項巨觀變化最直接符合這個轉換？","concept":"前後粒子都靠近，主要改變在相對位置的限制。由局部振動變為能互相滑過，可使樣品失去固體的自身固定形狀而呈現液態流動。這是運動方式與巨觀外形的連結，不足以推定化學身分改變。","correct":"B","options":[{"id":"A","text":"由固定體積變為隨容器任意擴展","explanation":"錯誤。終態靠近且可滑動符合液體，仍有一定體積。"},{"id":"B","text":"由能保留自身形狀變為可隨容器改形","explanation":"正確。位置限制減弱可讓固體轉成能流動的液體。"},{"id":"C","text":"由不易壓縮變為氣體般容易大幅壓縮","explanation":"錯誤。前後粒子都靠近，沒有氣態大間隙的證據。"},{"id":"D","text":"由保留分子身分變為必須生成不同分子","explanation":"錯誤。模型只說位置與運動改變，不要求改變分子身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B081","stem":"某樣品粒子疏遠且快速移動，另一樣品粒子靠近且滑動。有人僅依「兩者都會動」判定兩者同態。哪項修正最完整？","concept":"粒子「會運動」太籠統，無法唯一決定物態。第一份疏遠且廣泛移動符合氣體；第二份靠近並可滑動符合液體。完整模型需同時考慮粒子間距與活動方式，才能推導是否固定體積、是否易壓縮等巨觀差異。","correct":"D","options":[{"id":"A","text":"只要會動就是氣態，所以原判斷無須修正","explanation":"錯誤。液態與固態粒子也有運動。"},{"id":"B","text":"只要靠近就是完全靜止，故第二份資料必錯","explanation":"錯誤。液態粒子可靠近並滑動。"},{"id":"C","text":"兩者間距不同只反映分子本體大小，不代表分布不同","explanation":"錯誤。分子間距與分子本體尺寸是不同的量，不能互相取代。"},{"id":"D","text":"須合併間距與運動限制，兩份資料分別較符合氣態與液態","explanation":"正確。運動是共有現象，但運動方式與平均分布不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B082","stem":"兩份樣品都不易壓縮，甲換容器後保形，乙換容器後改形。哪組微觀模型能同時符合三項觀察？","concept":"這題要求模型一次解釋共有性質與差異。甲乙粒子都靠近，因而不易壓縮；甲相對位置受限，保持自身形狀；乙可滑動，因此改形。只選一個特徵而忽略其他觀察，容易產生互相矛盾的模型。","correct":"A","options":[{"id":"A","text":"甲乙粒子都靠近；甲相對位置較受限，乙可滑動","explanation":"正確。共同靠近解釋不易壓縮，不同限制解釋形狀差異。"},{"id":"B","text":"甲乙粒子都疏遠；甲固定，乙固定","explanation":"錯誤。疏遠不符低可壓縮性，乙固定又難解釋改形。"},{"id":"C","text":"甲粒子遠而自由，乙粒子近而固定","explanation":"錯誤。甲應能擴展改形，乙反而較保形。"},{"id":"D","text":"甲粒子近且可持續滑過；乙粒子近且只在原位置振動","explanation":"錯誤。這把甲保形、乙改形所需的位置限制對調了。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B083","stem":"一份氣體凝結成液體，分子身分不變。哪項前後比較最符合基本粒子模型？","concept":"凝結不是讓粒子停止一切運動，而是從較疏遠的氣態聚集為較靠近的液態。液體分子仍能相互滑動，因此沒有自身固定形狀；但粒子較近使樣品有一定體積且不易壓縮。分子身分可在整個轉換中保留。","correct":"C","options":[{"id":"A","text":"原來靠近且固定，後來疏遠且完全不動","explanation":"錯誤。起終兩態的疏密與活動方式均寫反或不合理。"},{"id":"B","text":"原來分子可廣泛移動，後來每個分子都完全停止運動","explanation":"錯誤。液態分子仍能滑動，凝結不等於完全靜止。"},{"id":"C","text":"原來較疏遠且遍及氣相空間，後來較靠近但仍可滑動","explanation":"正確。由氣態到液態改變間距及活動範圍。"},{"id":"D","text":"前後分子必都限制在各自固定晶格位置","explanation":"錯誤。氣體與液體都不是此固定位置模型。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B084","stem":"某同學以「固體粒子通常排得規則」為線索，接著寫「因此所有固體粒子完全不能振動」。哪項評估正確？","concept":"「通常規則排列」描述粒子平均位置的結構，「附近振動」描述瞬間偏離平均位置的運動。兩者可同時成立，不需要二選一。將固定位置解讀成每顆粒子精確靜止，會錯誤切斷固體模型與微觀運動的關係。","correct":"B","options":[{"id":"A","text":"結論成立，規則排列與任何運動不能共存","explanation":"錯誤。粒子可在規則位置附近作局部振動。"},{"id":"B","text":"推論不成立，位置的規律與位置附近振動可同時存在","explanation":"正確。固定位置模型不是絕對靜止模型。"},{"id":"C","text":"推論不成立是因所有固體都必像氣體般疏遠","explanation":"錯誤。一般固體粒子相當靠近。"},{"id":"D","text":"推論成立，液體才是唯一具有粒子運動的物態","explanation":"錯誤。氣體會運動，固體也會振動。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B085","stem":"甲圖顯示密集粒子，乙紀錄顯示同一樣品能改形流動且體積穩定。若合併兩份證據，何者最合理？","concept":"不同尺度的資料可以互相補足。粒子密集支持不易壓縮及一定體積，巨觀流動支持相對位置可改變，合併即符合液態。不能因單一線索熟悉，就捨棄同樣相關的另一項證據或強行判成矛盾。","correct":"D","options":[{"id":"A","text":"只能由甲圖判固態，乙紀錄不應考慮","explanation":"錯誤。密集並非固態專屬，不能排除相關巨觀證據。"},{"id":"B","text":"只能由流動判氣態，粒子密集資料不應考慮","explanation":"錯誤。流動也不是氣體專屬。"},{"id":"C","text":"兩份證據必衝突，粒子靠近就不能流動","explanation":"錯誤。液態可以靠近並相互滑動。"},{"id":"D","text":"共同支持液態模型：粒子靠近、可滑動，因此定體積而可改形","explanation":"正確。兩種尺度的資料彼此相容並互補。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 50–51；部分1 PDF頁 52–53；已審筆記頁 4、5、6、8。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-06","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B086","stem":"甲過程是冰變成液態水；乙過程是水蒸氣在表面形成液滴。兩過程名稱依序為何？","concept":"兩個過程雖然都出現液態水，起態不同，名稱也不同。甲由固態冰到液態水為熔化；乙由氣態水到液滴為凝結。先列出方向再命名，可避免只看到終點同為液體就把兩種過程混為一談。","correct":"C","options":[{"id":"A","text":"凝結、熔化","explanation":"錯誤。甲固到液為熔化，乙氣到液為凝結，順序對調。"},{"id":"B","text":"熔化、凝固","explanation":"錯誤。乙的終態是液態而非固態。"},{"id":"C","text":"熔化、凝結","explanation":"正確。依各自起態與終態判定即可。"},{"id":"D","text":"汽化、凝結","explanation":"錯誤。甲起態是冰而非液態水，且終態不是氣態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B087","stem":"某密閉裝置先含冰，之後全為液態水，再之後全部成為水蒸氣，全程沒有化學反應。關於第一階段到第二階段的變化，何者正確？","concept":"多階段題先鎖定所問區段。第一到第二階段只有固態冰轉為液態水，稱熔化；水分子仍靠近，但相對位置限制減弱而能滑動。後續成為水蒸氣的資訊不能移來取代本段的起終狀態。","correct":"A","options":[{"id":"A","text":"是熔化，分子由位置受限轉為可在靠近狀態下滑動","explanation":"正確。題目指定的是冰到液水這一段。"},{"id":"B","text":"是凝結，分子由疏遠聚集成液態","explanation":"錯誤。此描述應從氣態開始，不是本題第一段。"},{"id":"C","text":"是分解，H₂O轉成其他物質","explanation":"錯誤。題設全程無化學反應。"},{"id":"D","text":"是汽化，分子立即遍及全部氣相空間","explanation":"錯誤。這對應後一段液態到氣態，不是所問階段。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B088","stem":"冷表面原本沒有液水，後來外側出現由周圍水蒸氣形成的液滴。已知表面本身未漏水，也沒有冰。下列哪項最符合資料？","concept":"題面已排除漏水與冰，並明示液滴來自水蒸氣。氣態H₂O聚集為液態H₂O就是凝結，不必另假設表面熔化或氫氧反應。辨認來源與起態，有助於區分外觀相似的液滴形成過程。","correct":"D","options":[{"id":"A","text":"固態表面熔化成水","explanation":"錯誤。液滴來源已指為周圍水蒸氣，沒有表面熔成水的證據。"},{"id":"B","text":"冰熔化，因所有液滴都由冰產生","explanation":"錯誤。題目沒有冰，液水也可由氣態凝結。"},{"id":"C","text":"H₂與O₂先反應才一定能出現水滴","explanation":"錯誤。已有水蒸氣可凝結，不需要假設新化學反應。"},{"id":"D","text":"水蒸氣凝結，H₂O聚集為液態但仍保留分子身分","explanation":"正確。起態氣、終態液，來源與方向一致。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B089","stem":"已知壓力變化可能影響物態，但是否轉態取決於物質與具體條件。一份實驗紀錄只寫「把壓力提高」，未寫物質種類、溫度、初終狀態或變化幅度。根據這些資訊，下列哪項是可接受的結論？","concept":"「可以影響」不等於「每次必然發生」。只知道提高壓力，無法確認是否仍為原態、部分轉態或全部轉態。應保留待確認，取得具體條件與起終狀態後再命名；不能用泛稱的操作自動填入凝結結論。","correct":"B","options":[{"id":"A","text":"樣品一定全部凝結","explanation":"錯誤。壓力增加可能影響物態，但不保證必跨到液態。"},{"id":"B","text":"壓力是可能影響物態的因素，但此紀錄不足以判定實際轉態","explanation":"正確。仍需物質、條件與前後觀察。"},{"id":"C","text":"樣品一定分解成不同物質","explanation":"錯誤。壓力改變不等於化學分解。"},{"id":"D","text":"壓力永遠不可能影響物態","explanation":"錯誤。壓力可能影響物態；缺少條件只能表示無法判定這次是否轉態，不能否定壓力的可能影響。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B090","stem":"甲樣品改變溫度後仍為液體；乙樣品在另一組條件下由固態變液態。這是否與「改變溫度可能引起相變」矛盾？","concept":"物態轉換取決於具體條件，溫度改變未必離開原本物態範圍。甲仍為液體，乙由固到液熔化，兩者都可符合溫度可能影響狀態的敘述。此題應保留「可能」的條件性，不能把它誤讀成無例外的必然。","correct":"C","options":[{"id":"A","text":"矛盾，所有溫度變化都必須造成同樣相變","explanation":"錯誤。「可能」並不要求每次結果相同。"},{"id":"B","text":"矛盾，只要有一例不轉態，溫度就完全不影響物態","explanation":"錯誤。一例未跨相界不否定溫度可能影響物態。"},{"id":"C","text":"不矛盾，甲可在液態範圍內變溫，乙則實際發生熔化","explanation":"正確。不同條件可有不同結果。"},{"id":"D","text":"不矛盾，因乙一定是化學分解而非相變","explanation":"錯誤。固到液資料支持熔化，不需分解假設。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B091","stem":"同一物質有兩段無反應變化：甲為氣態到液態，乙為液態到固態。哪項前後運動方式比較正確？","concept":"先判各段起終態，再比較活動限制。氣到液使分子由較疏遠聚集為靠近但可滑動；液到固則讓相對位置更受限制，以局部振動為主。密集與受限不等於完全靜止，也不表示必須生成更多分子。","correct":"A","options":[{"id":"A","text":"甲由較疏遠移動變為靠近滑動；乙由靠近滑動變為位置附近振動","explanation":"正確。依序符合凝結與凝固的粒子限制變化。"},{"id":"B","text":"甲由固定位置振動變為自由氣態；乙由固態變液態","explanation":"錯誤。兩段方向都與題目相反。"},{"id":"C","text":"甲乙都必變成分子完全靜止","explanation":"錯誤。液固兩態都仍有粒子運動。"},{"id":"D","text":"甲乙都必增加分子總數才能形成較緊密狀態","explanation":"錯誤。重新聚集與限制改變不需增加分子數。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B092","stem":"水蒸氣凝結成液態水後，相較於原氣態，哪一組巨觀性質最符合新形成的液相？","concept":"凝結後需要用液體的性質描述新液相。它仍能隨所占容器部分改形，但粒子已較靠近，因此具有一定體積而較不易壓縮。不能把氣態的任意擴展性沿用到液相，也不能把凝結誤當成固態保形。","correct":"D","options":[{"id":"A","text":"有自身固定形狀，且容易大幅壓縮","explanation":"錯誤。液體無自身固定形狀，通常也不易壓縮。"},{"id":"B","text":"沒有固定體積，會填滿任意更大容器","explanation":"錯誤。這是氣體的體積特徵。"},{"id":"C","text":"有固定形狀，粒子全無運動","explanation":"錯誤。液體可流動，粒子仍能相對滑動。"},{"id":"D","text":"沒有自身固定形狀，但有近似固定體積且較不易壓縮","explanation":"正確。這是液相靠近且可滑動的巨觀表現。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B093","stem":"一份純冰在無化學反應下完全熔化成液態水。依一般三態粒子模型，哪項關於熔化後性質的推論正確？","concept":"純冰無反應地熔化為液態水，H₂O分子的身分保留，原本的位置限制則改變。液態分子可相互滑動，因此水能流動改形。僅由「可滑動」不能推出體積必增加或增加特定倍數，也不能把液態誤判成分子間距很大的氣態。","correct":"B","options":[{"id":"A","text":"體積必定增加一倍，因粒子能滑動","explanation":"錯誤。滑動本身不能決定體積變化的方向與倍數。"},{"id":"B","text":"水可流動改形，H₂O仍保留，粒子不再僅受限於原位置附近","explanation":"正確。此組合直接對應固態到液態。"},{"id":"C","text":"水必具有氣體般的大間隙並填滿全室","explanation":"錯誤。熔化後是液態，不是氣態。"},{"id":"D","text":"H₂O必裂解，否則不能失去原固定位置","explanation":"錯誤。相對位置限制改變不需改變分子身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B094","stem":"某裝置經操作後出現液體，但沒有起始狀態紀錄。若只從「後來有液體」判定過程名稱，哪項評估正確？","concept":"終態提供一半的方向資訊，不能單獨決定相變名稱。固態到液態稱熔化，氣態到液態稱凝結；此外還要確認實際有相變而非原液體轉移。缺起始狀態時應承認資訊不足，不能選一個熟悉名稱填上。","correct":"C","options":[{"id":"A","text":"一定是熔化，因為液體只能由固體變來","explanation":"錯誤。液體也可由氣態凝結形成。"},{"id":"B","text":"一定是凝結，因液體只能由氣體變來","explanation":"錯誤。固態熔化也可得到液體。"},{"id":"C","text":"資訊不足；若原為固態可為熔化，若原為氣態可為凝結","explanation":"正確。相變名稱需要起態與終態兩項。"},{"id":"D","text":"一定是分解，因物態名稱不需要起始狀態","explanation":"錯誤。液體出現不證明化學分解，起態仍重要。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B095","stem":"甲把氣體體積壓小後仍為氣態；乙讓氣體形成可流動液滴。兩者無化學反應。哪項區分正確？","concept":"壓縮描述體積操作，凝結描述物態方向，兩者不能直接畫等號。甲明定仍為氣態，故只是壓縮也合理；乙形成液相，才具備凝結證據。分子間距減少可出現在兩種情況，需用終態來完成區分。","correct":"A","options":[{"id":"A","text":"甲可只是氣態壓縮，乙已有氣到液的凝結證據","explanation":"正確。體積變小與實際轉為液相應分開判斷。"},{"id":"B","text":"甲乙都一定是熔化","explanation":"錯誤。兩者起態均非固態，不能稱熔化。"},{"id":"C","text":"甲只要間距變小就必已凝結，題述仍氣態不可能","explanation":"錯誤。氣體可壓縮且保持氣態。"},{"id":"D","text":"乙形成液滴表示分子必改為另一種物質","explanation":"錯誤。凝結可以保留原化學身分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-07","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B096","stem":"密閉模型最初有80個H₂O分子全在氣相，之後其中35個凝結到液相，無其他變化。最後「氣相、液相、合計」分子數為何？","concept":"凝結是分子由氣相轉入液相，並非創造或刪除H₂O。從初始80扣掉轉移的35，剩45個氣相；液相35與氣相45合計仍80。這是相間分配改變與密閉總數守恆並存的例子。","correct":"D","options":[{"id":"A","text":"80、35、115","explanation":"錯誤。凝結的35個來自原有氣相，不能重複計入。"},{"id":"B","text":"35、45、80","explanation":"錯誤。35是已凝結的液相數，兩相數目反置。"},{"id":"C","text":"45、0、45","explanation":"錯誤。轉入液相的分子仍存在，不能從系統刪去。"},{"id":"D","text":"45、35、80","explanation":"正確。氣相80−35＝45，兩相合計仍80。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B097","stem":"密閉容器內原有12 g液態水與3 g水蒸氣，後來3 g水蒸氣全部凝結為液態水，無反應或物質進出。最後水的總質量為何？","concept":"總質量應包含容器內所有水，不因其中一部分原為氣態就漏算。原12 g液相加3 g氣相，共15 g；全部成液態只是分配改變，最後仍15 g。題目封閉系統且無反應，足以支持這個守恆加總。","correct":"B","options":[{"id":"A","text":"12 g，因水蒸氣不計入水的質量","explanation":"錯誤。氣態水也是物質，具有質量並仍在系統中。"},{"id":"B","text":"15 g，原來兩相的水合計保留","explanation":"正確。12＋3＝15 g，單純密閉相變不改變總質量。"},{"id":"C","text":"3 g，因只計本次新凝結的部分","explanation":"錯誤。原有12 g液水沒有消失。"},{"id":"D","text":"9 g，因凝結要從原液水扣掉蒸氣質量","explanation":"錯誤。凝結使氣相轉入液相，並非從液相再扣除。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B098","stem":"一個密閉水模型包含20個冰中H₂O、30個液水H₂O、10個氣態H₂O。之後冰全熔化，另有4個氣態分子凝結，無其他變化。最後液相與氣相分子數依序為何？","concept":"分開追蹤兩種轉移，再核對總數。熔化把20個由固相移入液相，凝結再把4個由氣相移入液相，故液相54、氣相6、固相0。最後合計60，等於初始20＋30＋10，沒有改變H₂O身分。","correct":"A","options":[{"id":"A","text":"54、6","explanation":"正確。液相30＋20＋4＝54；氣相10−4＝6；合計60。"},{"id":"B","text":"50、10","explanation":"錯誤。只處理熔化，漏掉4個氣態分子的凝結。"},{"id":"C","text":"34、6","explanation":"錯誤。只處理凝結，漏掉20個冰中分子熔入液相。"},{"id":"D","text":"54、10","explanation":"錯誤。液相已加入凝結4個，氣相也必相應扣除。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B099","stem":"兩個模型都由水開始：甲只讓完整H₂O分子改變排列與間距；乙把H₂O改寫為H₂和O₂。哪項判斷正確？","concept":"分子身分比「都含相同元素」更能區分相變與化學變化。甲保留完整H₂O，僅重排，可用於相變模型；乙改成H₂與O₂，已不再只描述水的狀態。相同原子種類可以組成不同物質，不能因此把兩種模型視為等價。","correct":"C","options":[{"id":"A","text":"甲乙都只是水的物態改變，因都含氫氧元素","explanation":"錯誤。元素種類相同不表示分子身分相同。"},{"id":"B","text":"甲一定發生分解，因分子位置改變","explanation":"錯誤。位置與間距改變不等於化學分解。"},{"id":"C","text":"甲可描述單純相變；乙涉及不同分子身分，不能當作單純水相變","explanation":"正確。判別重點在H₂O是否被保留。"},{"id":"D","text":"乙比甲更符合凝結，因凝結一定拆分水分子","explanation":"錯誤。凝結仍保留H₂O，不需拆成氫氧氣體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]},{"id":"central-0-1-ch1-sec1-2-topic01-G03-B100","stem":"一個開口杯中的水蒸氣有一部分離開杯口，另一部分在杯內凝結。有人用「相變保留H₂O」推論杯內分子總數必定不變。哪項修正正確？","concept":"相變保留分子身分，並不保證任何選定小區域都有固定分子數。開口杯有H₂O跨出邊界，杯內總數可以減少；留在杯內的凝結只改氣液分配。要用總數守恆，必須選取包含所有相關分子且無進出的系統邊界。","correct":"D","options":[{"id":"A","text":"分子身分保留表示任何開放區域內的分子數都固定","explanation":"錯誤。分子可跨越開口邊界離開指定區域。"},{"id":"B","text":"氣態分子離開杯口後就不再是H₂O","explanation":"錯誤。離開位置不等於改變化學身分。"},{"id":"C","text":"只要發生凝結，離開杯口的分子必全部自動返回","explanation":"錯誤。凝結不保證外流粒子回到原杯。"},{"id":"D","text":"H₂O身分可保留，但杯內總數須計入跨杯口的流失，不能直接用密閉總數守恆","explanation":"正確。化學身分與選定區域的份量是不同問題。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；第1章｜1.2 Classification of Matter｜States of Matter；Figure 1.4；印刷頁 51；部分1 PDF頁 53；已審筆記頁 7。","example":"","pointId":"central-0-1-ch1-sec1-2-topic01-STM-08","schools":["CMU"]}]},{"depth":"精讀","target":150,"questions":[]}],"schoolBanks":{"CMU":[["central-0-1-ch1-sec1-2-topic01-G03-S001","central-0-1-ch1-sec1-2-topic01-G03-S002","central-0-1-ch1-sec1-2-topic01-G03-S003","central-0-1-ch1-sec1-2-topic01-G03-S004","central-0-1-ch1-sec1-2-topic01-G03-S005","central-0-1-ch1-sec1-2-topic01-G03-S006","central-0-1-ch1-sec1-2-topic01-G03-S007","central-0-1-ch1-sec1-2-topic01-G03-S008","central-0-1-ch1-sec1-2-topic01-G03-S009","ce 示兩成分未反應，不能判純。"},{"id":"D","text":"兩瓶都不是純物質，因為都是液體","explanation":"錯誤（本題不選）：液態可為純物質，也可為混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"純水可清澈，糖水也可清澈，分類仍不同。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-S002","stem":"密閉容器中的純物質M被分裝成甲、乙兩份，過程未反應且未混入其他成分。甲為2 g、乙為8 g。哪項必然相同？","concept":"分裝改變拿到的量，不改變M是什麼物質。兩份皆保持M的固定化學組成。質量已不同，體積及粒子總數則與樣品量有關，不能因同為純物質就說這些總量相等。","correct":"C","options":[{"id":"A","text":"總質量","explanation":"錯誤（本題不選）：題幹給2 g與8 g，質量不等。"},{"id":"B","text":"樣品所占體積","explanation":"錯誤（本題不選）：相同物質不同用量不保證體積相同。"},{"id":"C","text":"物質M的化學組成","explanation":"正確（本題應選）：未反應或污染，兩份仍是同一個M。"},{"id":"D","text":"所含粒子總數","explanation":"錯誤（本題不選）：較多M通常含更多粒子，總數不必相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"把一杯純水分成大小兩杯，兩杯仍都是H₂O。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-S003","stem":"已知樣品R是純物質，且由兩種不同元素化學結合而成。R應放在何種分類？","concept":"純物質向下分為元素與化合物。R含兩種元素且彼此化學結合，因此屬化合物；這仍在純物質之內。兩種元素不等於兩種物質各自混放，關鍵是是否形成單一化學物質。","correct":"D","options":[{"id":"A","text":"元素","explanation":"錯誤（本題不選）：元素只含一種元素，與R條件不符。"},{"id":"B","text":"元素物質與化合物的混合物","explanation":"錯誤（本題不選）：題幹只給一種已化學結合的純物質，沒有另一種元素物質共存。"},{"id":"C","text":"混合物","explanation":"錯誤（本題不選）：題幹已說R是單一純物質而非成分共存。"},{"id":"D","text":"化合物","explanation":"正確（本題應選）：兩種元素化學結合的純物質就是化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"純水含氫、氧兩種元素，仍屬純物質。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-S004","stem":"粒子示意中，所有粒子均為X—X；X表示同一種元素，連線表示化學鍵，且沒有其他粒子。樣品是什麼？","concept":"每個粒子雖含兩個原子，兩個原子卻都屬X元素。分類要辨認元素種類，不是只看原子個數。樣品又只有X—X這一種粒子，所以是元素形成的純物質。","correct":"A","options":[{"id":"A","text":"元素形成的純物質","explanation":"正確（本題應選）：全體皆為同種元素構成的單一物質。"},{"id":"B","text":"由兩種元素形成的化合物","explanation":"錯誤（本題不選）：兩個X不是兩種不同元素。"},{"id":"C","text":"兩種元素的混合物","explanation":"錯誤（本題不選）：沒有第二種元素或第二種物質。"},{"id":"D","text":"元素與化合物的混合物","explanation":"錯誤（本題不選）：圖中沒有由不同元素結合的化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"同一種元素可由雙原子粒子構成，仍不是化合物。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-S005","stem":"只含H₂O的水蒸氣在密閉容器內冷卻成純液態水，過程無化學反應。關於前後的水，何者正確？","concept":"狀態改變不等於物質身分改變。題幹明定只有H₂O且無化學反應，因此水蒸氣與液態水均為水這種純物質，H：O原子數比也維持2：1，不會因冷凝而重新決定比例。","correct":"C","options":[{"id":"A","text":"氣態時是混合物，液態時才是純物質","explanation":"錯誤（本題不選）：純物質可以是氣態，不能以氣液判純。"},{"id":"B","text":"氣態H與O分開，液態才結合","explanation":"錯誤（本題不選）：水蒸氣中的水仍是H₂O，不是分離的元素。"},{"id":"C","text":"前後皆以H₂O為化學組成","explanation":"正確（本題應選）：只有狀態改變，水的組成維持H₂O。"},{"id":"D","text":"冷凝使H與O的原子數比從1：1變成2：1","explanation":"錯誤（本題不選）：前後的原子數比皆是2：1。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"純水結成冰時，H₂O的組成也不因此改變。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-S006","stem":"一份未含其他成分的NaCl晶體中有Na⁺與Cl⁻。下列哪個判斷最恰當？","concept":"純NaCl以Na⁺與Cl⁻按固定比例構成離子晶體，屬單一化合物。離子種類與物質種類是不同層次；不能把兩種離子直接算成兩種混合成分，也不宜把整顆晶粒或每個離子叫作NaCl分子。","correct":"B","options":[{"id":"A","text":"有兩種離子，所以必為混合物","explanation":"錯誤（本題不選）：同一離子化合物可由不只一種離子構成。"},{"id":"B","text":"NaCl是具有固定離子比例的化合物","explanation":"正確（本題應選）：NaCl的固定化學組成支持其化合物分類。"},{"id":"C","text":"Na⁺與Cl⁻各自都是NaCl分子","explanation":"錯誤（本題不選）：單一離子不等於NaCl分子。"},{"id":"D","text":"每一顆肉眼可見晶粒都是一個NaCl分子","explanation":"錯誤（本題不選）：晶粒包含大量離子，非單個分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"NaCl的式子表達Na⁺：Cl⁻為1：1的組成比例。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-S007","stem":"將兩種不同的純物質U與V混合後，確認U、V都保留原身分且沒有反應。成品應歸類為何？","concept":"原料各自很純，不代表混合後只有一種物質。題幹指出U與V未反應、仍保留原身分，所以成品中有兩種物質，屬混合物。化合物需要形成固定化學組成的物質，並非把原料放在一起就自動形成。","correct":"D","options":[{"id":"A","text":"元素，因原料都是純的","explanation":"錯誤（本題不選）：元素的判定在元素種類，不在原料純度。"},{"id":"B","text":"化合物，因共有兩種原料","explanation":"錯誤（本題不選）：兩種原料放一起不等於化學結合。"},{"id":"C","text":"純物質，因各原料純度高","explanation":"錯誤（本題不選）：成品仍含U與V，已不是單一物質。"},{"id":"D","text":"混合物，因兩種物質仍共存","explanation":"正確（本題應選）：U、V保有各自身分符合混合物定義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"糖與水未生成新物質時，糖水屬混合物。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-S008","stem":"某糖水已充分混勻，從上、中、下層等質量取樣，均測得相同的糖質量比例。已知成分為糖和水，這項結果支持哪個結論？","concept":"三處糖含量一致表示空間分布均勻；糖與水仍是兩種物質，因此整份液體為均勻混合物。均勻性回答『各處是否相同』，純物質則回答『有幾種物質』，不能把這兩個問題混為一談。","correct":"A","options":[{"id":"A","text":"這是一份組成均勻的混合物","explanation":"正確（本題應選）：兩成分共存且各層比例一致，符合均勻混合物。"},{"id":"B","text":"糖與水已變成同一種元素","explanation":"錯誤（本題不選）：糖與水不是因混勻就轉成同一元素。"},{"id":"C","text":"組成均勻足以證明是純物質","explanation":"錯誤（本題不選）：均勻混合物正好反駁這項推論。"},{"id":"D","text":"只能上層是純物質，下層不是","explanation":"錯誤（本題不選）：各層成分相同，沒有上層獨純的依據。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"充分混合的鹽水也可以各處味道相近而仍是混合物。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-S009","stem":"某廠每次將甲液與乙液以3：2混合，兩成分不反應。『每批比例相同』對成品分類有何意義？","concept":"固定配方是人為重複相同混合比例；固定化學組成則是某一純物質本身的特徵。此處甲、乙不反應且都存在，所以即使每批都是3：2，成品仍是混合物。比例重複不能取代成分身分證據。","correct":"C","options":[{"id":"A","text":"證明成品是化合物","explanation":"錯誤（本題不選）：配比不變沒有證明產生化學結合。"},{"id":"B","text":"證明成品只含一種元素","explanation":"錯誤（本題不選）：混合比例無法推出元素只有一種。"},{"id":"C","text":"只表示配方固定，成品仍可為混合物","explanation":"正確（本題應選）：未反應的兩成分不因固定配方而消失。"},{"id":"D","text":"使成品不再含甲液或乙液","explanation":"錯誤（本題不選）：題幹沒有轉化或移除任一成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"每次用一樣多糖和水配製糖水，仍得到糖水混合物。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-S010","stem":"兩份純水在不同外界壓力下測得不同沸點。若要用沸點比較兩份的物質身分，何種處理最合理？","concept":"沸點需連同測量壓力討論。兩次壓力不同時，沸點差可能來自條件差異，不必代表化學身分不同。先控制相同壓力再比較，才能減少誤判；只調整總質量或觀察先後沸騰，不能消除這個條件缺口。","correct":"B","options":[{"id":"A","text":"直接判為不同物質，不必理會壓力","explanation":"錯誤（本題不選）：壓力差本身可能改變沸點，不能直接歸因身分。"},{"id":"B","text":"先在相同壓力下重新比較","explanation":"正確（本題應選）：控制壓力後才有合適的沸點比較。"},{"id":"C","text":"只把兩份質量調相同，壓力差即可忽略","explanation":"錯誤（本題不選）：總質量相同不會消除壓力不同的影響。"},{"id":"D","text":"只要一份先沸騰，就證明另一份是混合物","explanation":"錯誤（本題不選）：先後沸騰還涉及條件，不能單獨證明混合。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"在不同壓力下量到不同沸點，不能直接判成兩種物質。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-S011","stem":"一份紅色固體已確認全部由同一化合物構成，沒有其他成分。能否因它不是白色而否定其純物質分類？","concept":"顏色可以是物質本身的特性，不必然來自雜質。此固體已確認只有一種化合物，因此屬於純物質。是否純粹要依成分判定；把白色或無色當成必要條件，會錯誤排除有色的純物質。","correct":"D","options":[{"id":"A","text":"能，純物質只能是白色或無色","explanation":"錯誤（本題不選）：純物質沒有只能白色或無色的限制。"},{"id":"B","text":"能，有色代表至少混入兩種物質","explanation":"錯誤（本題不選）：單一物質本身就可能呈現顏色。"},{"id":"C","text":"不能，因為所有有色固體都屬元素","explanation":"錯誤（本題不選）：有色與是否元素沒有這種必然關係。"},{"id":"D","text":"不能，純物質由成分身分判定","explanation":"正確（本題應選）：題幹已給只有一種化合物的充分資訊。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"外觀有顏色，不等於化學成分有兩種物質。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-S012","stem":"哪一組分類由大類到小類的順序正確？","concept":"先把物質分成純物質與混合物，再把純物質分成元素與化合物。因此化合物是純物質中的一支。分類層級要反映包含關係，不能把同層分支串成上下層，也不能把小類置於大類之前。","correct":"B","options":[{"id":"A","text":"化合物→純物質→物質","explanation":"錯誤（本題不選）：順序由小到大，與題意相反。"},{"id":"B","text":"物質→純物質→化合物","explanation":"正確（本題應選）：物質包含純物質，純物質包含化合物。"},{"id":"C","text":"物質→化合物→混合物","explanation":"錯誤（本題不選）：化合物不包含混合物。"},{"id":"D","text":"純物質→混合物→元素","explanation":"錯誤（本題不選）：混合物不是純物質的下位類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"水是化合物，也因此是純物質及物質。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-S013","stem":"示意樣品含彼此分開的X原子與Y原子，X、Y為不同元素，沒有鍵結或其他粒子。下列何者正確？","concept":"要看整份樣品，不是只看單顆粒子。雖然每顆都是單原子，樣品同時含X與Y兩種元素物質，且兩者未化學結合，因此為兩種元素的混合物。化合物需要不同元素形成同一化學物質。","correct":"A","options":[{"id":"A","text":"由兩種元素構成的混合物","explanation":"正確（本題應選）：兩種不同元素以各自身分共存。"},{"id":"B","text":"只有一種化合物","explanation":"錯誤（本題不選）：X與Y未鍵結，不能稱為XY化合物。"},{"id":"C","text":"由同一元素構成的純物質","explanation":"錯誤（本題不選）：題幹明定X和Y不同元素。"},{"id":"D","text":"因每個粒子都只有一個原子，所以整體是元素","explanation":"錯誤（本題不選）：單顆的原子數不能取代全體成分判定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"兩種元素未反應而共存，仍可形成混合物。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-S014","stem":"對H₂O中的下標2，哪項解讀正確？","concept":"分子式下標記錄每個分子內各元素原子數。H₂O中的2修飾H，表示兩個氫原子；O省略下標1。它給的是原子數比例，不能直接當成質量比例，也不表示水中混有游離氫氣。","correct":"C","options":[{"id":"A","text":"表示每份水含2 g氫","explanation":"錯誤（本題不選）：下標不指定一份樣品的克數。"},{"id":"B","text":"表示水中混有H₂氣體","explanation":"錯誤（本題不選）：H表示水分子內的氫原子，不是氫氣成分。"},{"id":"C","text":"表示每個水分子含兩個氫原子","explanation":"正確（本題應選）：H下標2代表一個分子有兩個氫原子。"},{"id":"D","text":"表示水中氫與氧質量比為2：1","explanation":"錯誤（本題不選）：原子數比與質量比不能直接等同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"H₂O共有三個原子，但只涉及兩種元素。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-S015","stem":"把一大塊純NaCl研碎成許多小晶粒，未污染也未反應。最合理的結論為何？","concept":"研碎改變顆粒大小與數量，不表示化學身分改變。題幹排除反應及污染，所以每一小晶粒仍是NaCl，其固定組成和化合物分類保持。不能把粒子或晶粒的數目誤當成物質種類數。","correct":"D","options":[{"id":"A","text":"顆粒變多使物質種類增加","explanation":"錯誤（本題不選）：同一物質的多顆晶粒不等於多種物質。"},{"id":"B","text":"小晶粒不再有固定組成","explanation":"錯誤（本題不選）：粒徑改變不會自行取消固定組成。"},{"id":"C","text":"研碎把NaCl變成Na與Cl的混合物","explanation":"錯誤（本題不選）：研碎條件未使NaCl發生化學分解。"},{"id":"D","text":"前後都仍是NaCl這種純化合物","explanation":"正確（本題應選）：只改變形狀大小，仍為原純化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"一塊純鹽與一匙同樣的純鹽粉，物質分類相同。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-S016","stem":"已知甲只有化合物P，乙含P與Q兩種不同化合物且未反應。對甲、乙的分類何者正確？","concept":"化合物本身可以是單一純物質，因此只有P的甲是純物質。乙同時有P和Q兩種化合物，屬混合物。要區分『一種化合物內有幾種元素』與『樣品有幾種物質』，兩者不是同一計數。","correct":"A","options":[{"id":"A","text":"甲純物質，乙混合物","explanation":"正確（本題應選）：甲只有P；乙同時含P、Q。"},{"id":"B","text":"甲元素，乙化合物","explanation":"錯誤（本題不選）：P已知為化合物，不是元素。"},{"id":"C","text":"甲乙皆化合物型純物質","explanation":"錯誤（本題不選）：乙有兩種化合物而非單一化合物。"},{"id":"D","text":"甲乙皆混合物，因化合物含多種元素","explanation":"錯誤（本題不選）：多種元素化學結合不使化合物成為混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"純水是一種化合物；水與另一化合物共存可成混合物。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-S017","stem":"某液體經充分攪拌後看不見分層。若要判斷它是否純物質，下列哪項補充資訊最直接？","concept":"看不見分層只能說外觀上未見分離，不能證明只有一種物質。判定純物質最直接要查成分身分及種類數。液面、流動性與體積這些資訊主要描述液態表現，不能排除均勻混合物。","correct":"B","options":[{"id":"A","text":"液面是否平坦","explanation":"錯誤（本題不選）：平坦液面不是成分純一的證據。"},{"id":"B","text":"容器內究竟有幾種物質","explanation":"正確（本題應選）：一種或多種物質直接對應純物質或混合物。"},{"id":"C","text":"是否能倒入另一容器","explanation":"錯誤（本題不選）：可倒出是流動性，純液體和溶液都有。"},{"id":"D","text":"液體是否具有固定體積","explanation":"錯誤（本題不選）：固定體積是狀態性質，不能區分此兩類。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"看不見鹽粒的鹽水仍包含鹽與水。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-S018","stem":"純化合物Z的不同樣品皆由A、B兩元素構成。『組成固定』主要表示什麼？","concept":"固定組成關心的是同一物質內的元素種類與比例，而不是取樣大小、形狀或產地。只要確認是相同純化合物Z，樣品可大可小、形狀可異，A與B的化學組成比例仍保持。","correct":"C","options":[{"id":"A","text":"每份樣品總質量相同","explanation":"錯誤（本題不選）：取樣多少可變，總質量不必相同。"},{"id":"B","text":"每份樣品必有相同外形","explanation":"錯誤（本題不選）：形狀並非化學組成的內容。"},{"id":"C","text":"A與B在Z內的化學比例相同","explanation":"正確（本題應選）：元素比例屬固定組成的核心。"},{"id":"D","text":"Z只能由同一個地點製得","explanation":"錯誤（本題不選）：同一化合物可以來自不同來源。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"一小滴純水與一大杯純水的H：O原子數比相同。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-S019","stem":"同一純物質的密度要在可比較的條件下討論。下列何種做法最恰當？","concept":"密度等特性需要附帶狀態與測量條件。同一物質改變溫度、壓力或狀態時，密度不一定相同；故公平比較應先對齊這些條件。樣品總質量不同不會自動使它成為另一種物質。","correct":"B","options":[{"id":"A","text":"把液態與氣態密度直接當成相同數值","explanation":"錯誤（本題不選）：不同狀態的密度不可強迫相等。"},{"id":"B","text":"比較同一狀態、相同溫度與壓力下的結果","explanation":"正確（本題應選）：先控制影響性質的條件才能合理比較。"},{"id":"C","text":"只要名稱相同，就忽略測量條件","explanation":"錯誤（本題不選）：名稱相同不會使條件差異消失。"},{"id":"D","text":"要求每個樣品總質量相等才可稱同一物質","explanation":"錯誤（本題不選）：物質身分不以樣品質量相等為必要條件。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"不能把水蒸氣與液態水的密度差異當成化學組成改變。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-S020","stem":"兩份水分別來自融化的純冰與冷凝的純水蒸氣；都已確認只有H₂O。何項判斷正確？","concept":"題幹已確認兩份水都只有H₂O，分類和化學身分便相同。取得途徑可以不同，卻不會在沒有化學組成改變時形成新物質。比較特性時仍須控制相同條件，不能只憑來源替樣品重新分類。","correct":"D","options":[{"id":"A","text":"來源不同，所以是兩種不同化合物","explanation":"錯誤（本題不選）：不同來源不足以否定相同H₂O身分。"},{"id":"B","text":"融冰所得水是元素，冷凝水是化合物","explanation":"錯誤（本題不選）：融化不把化合物H₂O變成元素。"},{"id":"C","text":"只有冷凝水能算純物質","explanation":"錯誤（本題不選）：已確認只有H₂O的兩份都能算純物質。"},{"id":"D","text":"兩者為同一純物質，來源不改變已確認的身分","explanation":"正確（本題應選）：兩者皆為水這一種化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"純水的身分由H₂O決定，不由取得方法決定。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-S021","stem":"一瓶試劑標示含X 99%與Y 1%，且X、Y為不同物質。若這就是完整成分，應如何分類？","concept":"純物質要求單一物質，不是只要求主要成分很多。此瓶同時含X與Y，即使Y只有1%，仍屬混合物。百分比加總100%只表示成分帳目完整，沒有證明X和Y已化學結合成單一物質。","correct":"C","options":[{"id":"A","text":"X超過一半，所以整瓶是純X","explanation":"錯誤（本題不選）：多數成分不會消除少數成分的存在。"},{"id":"B","text":"含量少的Y不算物質，因此為純物質","explanation":"錯誤（本題不選）：1%的不同物質仍須列入分類。"},{"id":"C","text":"屬混合物，少量Y仍是第二成分","explanation":"正確（本題應選）：完整成分明示兩種物質共存。"},{"id":"D","text":"百分比合計100%，所以是化合物","explanation":"錯誤（本題不選）：所有完整混合配方也可加總100%。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"高純度試劑的日常標示，與理想純物質分類須分清楚。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-S022","stem":"已知純物質E不能以化學方式分解成更簡單的物質。這項描述最符合哪一類？","concept":"元素是不能再以化學方式分解成更簡單物質的純物質。此處『不能分解』是化學意義，並非是否能切小或研磨。含不同元素化學結合的純物質則屬化合物，不符合元素的定義。","correct":"A","options":[{"id":"A","text":"元素","explanation":"正確（本題應選）：這是元素的基本定義特徵。"},{"id":"B","text":"任何混合物","explanation":"錯誤（本題不選）：混合物由多種物質共存，不能由此定義。"},{"id":"C","text":"只限固態化合物","explanation":"錯誤（本題不選）：固態不會使化合物自動成為元素。"},{"id":"D","text":"任何含兩種元素的純物質","explanation":"錯誤（本題不選）：兩種元素組成的純物質屬化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"把元素切成小片並不等於化學分解。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-S023","stem":"模型中只有X—Y—X粒子，X與Y代表不同元素；每個粒子結構相同。整份樣品含幾種物質、幾種元素？","concept":"先辨認粒子種類：所有粒子都是相同的X—Y—X，所以只有一種化學物質。再辨認元素標記：只有X與Y兩種。每個粒子的原子總數雖為3，並不表示有3種元素或3種物質。","correct":"D","options":[{"id":"A","text":"3種物質、3種元素","explanation":"錯誤（本題不選）：把原子總數誤當兩種分類的種類數。"},{"id":"B","text":"1種物質、3種元素","explanation":"錯誤（本題不選）：原子有三個，但元素標記只有兩種。"},{"id":"C","text":"2種物質、2種元素","explanation":"錯誤（本題不選）：兩種元素在同一化合物內，不是兩種物質。"},{"id":"D","text":"1種物質、2種元素","explanation":"正確（本題應選）：同一種粒子由X、Y兩元素構成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"H₂O也是一種物質、兩種元素、每分子三個原子。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-S024","stem":"若一份樣品只含水分子，下列哪種粒子描述與H₂O不相容？","concept":"判斷水分子先核對各元素原子數，H₂O必須是2個H和1個O。空間朝向與分子總數可以不同，但不能把H與O的個數交換。1個H配2個O不符合給定的H₂O化學式。","correct":"B","options":[{"id":"A","text":"每個分子有2個H與1個O","explanation":"錯誤（本題不選）：此原子數正好符合H₂O。"},{"id":"B","text":"每個分子有1個H與2個O","explanation":"正確（本題應選）：H和O的個數顛倒，不是題定水分子。"},{"id":"C","text":"不同水分子可以朝向不同方向","explanation":"錯誤（本題不選）：改變朝向不改變分子組成。"},{"id":"D","text":"樣品可以包含許多相同的水分子","explanation":"錯誤（本題不選）：純物質可含大量相同分子。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"把H₂O模型轉向不會變成另一種物質。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-S025","stem":"NaCl化學式中的1：1最適合表示哪個量的比例？","concept":"NaCl是離子化合物，其式子表達鈉離子與氯離子的固定1：1組成比例。這不是兩元素的質量比，也不限制鹽水的配方。鹽水含水與NaCl成分，其混合比例能變動，不能和NaCl本身的組成混用。","correct":"A","options":[{"id":"A","text":"整塊晶體中Na⁺與Cl⁻的組成數量比例","explanation":"正確（本題應選）：NaCl式子以最簡比例表達兩類離子組成。"},{"id":"B","text":"Na與Cl在任何樣品中的質量比例","explanation":"錯誤（本題不選）：數量比不可直接等同質量比。"},{"id":"C","text":"NaCl所含兩元素各占晶體體積的比例","explanation":"錯誤（本題不選）：化學式的計數比不等於兩元素各占的體積比。"},{"id":"D","text":"一份鹽水中鹽與水的比例","explanation":"錯誤（本題不選）：鹽水配比不是NaCl的化學式含義。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"NaCl與NaCl水溶液要分清：前者是物質，後者是含水的混合物。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-S026","stem":"X、Y代表兩種不同元素。X—Y是一種已形成的純化合物；另有X元素物質與Y元素物質未反應的混合樣品。兩者最關鍵的差異是什麼？","concept":"含哪些元素不是辨認化合物與混合物的唯一線索，還要看元素如何組成物質。X—Y已形成固定化學組成的一種物質；未反應的X與Y則各自存在。均勻性和狀態都不是這兩類的必然分界。","correct":"C","options":[{"id":"A","text":"化合物一定均勻，混合物一定不均勻","explanation":"錯誤（本題不選）：混合物也可能均勻。"},{"id":"B","text":"只要都含X、Y，就屬同一物質","explanation":"錯誤（本題不選）：相同元素清單不保證相同化學物質。"},{"id":"C","text":"化合物中元素已化學結合；混合物中原物質仍保有身分","explanation":"正確（本題應選）：是否形成同一化學物質是此題關鍵。"},{"id":"D","text":"化合物只能是固體，混合物只能是液體","explanation":"錯誤（本題不選）：兩類都可能呈現不同物態。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"水中的氫氧化學結合，與氫、氧物質未反應共存不同。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-S027","stem":"透明樣品甲只含水，透明樣品乙含水與溶解的糖。哪句話正確？","concept":"透明是外觀，純物質與混合物是成分分類。甲只有水，為純物質；乙同時含水和糖，為混合物。溶解的糖即使肉眼看不到仍存在，而水分子內的H、O不能被當作自由混合成分。","correct":"D","options":[{"id":"A","text":"透明性可用來排除乙中的糖","explanation":"錯誤（本題不選）：透明不能證明溶質不存在。"},{"id":"B","text":"兩份都是混合物，因為水含H和O","explanation":"錯誤（本題不選）：水內的H、O屬化合物組成，不是兩種混合成分。"},{"id":"C","text":"兩份都是純物質，因為沒有沉澱","explanation":"錯誤（本題不選）：沒有沉澱也可能有溶解成分。"},{"id":"D","text":"透明性相同不代表兩份的物質分類相同","explanation":"正確（本題應選）：甲乙外觀相似，但物質種類數不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"目視可作觀察起點，不能單獨完成純度判定。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-S028","stem":"某純化合物中A：B原子數比為1：3。若取用的純樣品增加一倍，A：B應是多少？","concept":"樣品增量會使A與B的總數一起增加，不改變兩者的比值。原來1：3可同時倍增成2：6，但約分後仍是1：3。固定組成不要求總原子數固定，而要求不同取樣量仍保有同一比例。","correct":"B","options":[{"id":"A","text":"2：3","explanation":"錯誤（本題不選）：只增加A而不增加B會改變組成。"},{"id":"B","text":"1：3","explanation":"正確（本題應選）：兩種原子同比增量，比值不變。"},{"id":"C","text":"1：6","explanation":"錯誤（本題不選）：只增加B不符合取更多相同純物質。"},{"id":"D","text":"3：1","explanation":"錯誤（本題不選）：3：1把A與B的比例倒置，與原本1：3不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"一份含1個A配3個B，兩份就有2個A配6個B。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-S029","stem":"某純液體在25°C測得密度d₁，在50°C測得密度d₂。未提供其他資料，何者最合理？","concept":"純物質具有特定性質，但數值需連同條件討論。兩次溫度不同，密度差可能來自條件差，不能直接視為混合或物質轉變的證據。應在相同條件重測，並結合成分資訊判斷。","correct":"C","options":[{"id":"A","text":"只要d₁≠d₂，就必含兩種物質","explanation":"錯誤（本題不選）：不同測量條件可使同一物質密度不同。"},{"id":"B","text":"純物質的任何性質均不受溫度影響","explanation":"錯誤（本題不選）：許多性質須指定溫度等條件。"},{"id":"C","text":"溫度不同時，不能只用密度差直接否定同一純物質","explanation":"正確（本題應選）：先排除條件差，才可比較樣品特性。"},{"id":"D","text":"密度較低的那次測量必代表樣品較不純","explanation":"錯誤（本題不選）：密度大小不是通用純度分數，且兩次溫度條件不同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"『有特定性質』不等於『數值在所有條件都一樣』。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-S030","stem":"兩杯液體各自已確認是純物質，但尚未確認兩杯是否為同一種物質。把兩杯合併且沒有反應或污染，能否必定判為混合物？","concept":"各自純只表示每杯原先各有一種物質，尚未說兩杯的化學身分是否相同。若兩杯都是同一純物質，合併仍可純；若是不同物質且保留身分，則形成混合物。因此現有資訊不足以必定判混合，也不足以必定判純。","correct":"A","options":[{"id":"A","text":"不能必定；同一物質合併仍可純，不同物質共存才是混合","explanation":"正確（本題應選）：需區分兩杯化學身分相同或不同這兩種可能。"},{"id":"B","text":"能，因為倒入了兩杯就一定有兩種物質","explanation":"錯誤（本題不選）：杯數不等於不同化學物質的種類數。"},{"id":"C","text":"不能，因為各自純的液體合併後必定純","explanation":"錯誤（本題不選）：若兩杯為不同物質，合併仍會是混合物。"},{"id":"D","text":"能，因為未反應也會形成新的化合物","explanation":"錯誤（本題不選）：未反應不能推出新化合物，且化合物本身也不等於混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"兩杯純水與一杯純水加另一純液體，不能只因都倒了兩杯就作相同分類。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-S031","stem":"某無色氣體已確認只含一種物質G。下列哪項理由足以支持它屬於純物質？","concept":"純物質是由單一物質構成，具有其固定組成與特性。題幹直接提供『只含G』，這才是分類依據。氣體的形狀、粒子間隔或是否有色，不能排除多種氣體混合，因此不足以獨立證明純物質。","correct":"C","options":[{"id":"A","text":"所有氣體都沒有固定形狀","explanation":"錯誤（本題不選）：沒有固定形狀也適用氣體混合物。"},{"id":"B","text":"無色便能排除其他氣體成分","explanation":"錯誤（本題不選）：多種無色氣體可以共存，無色不保證單一成分。"},{"id":"C","text":"只有一種物質G","explanation":"正確（本題應選）：單一物質身分是此分類的直接條件。"},{"id":"D","text":"氣體分子彼此有間隔","explanation":"錯誤（本題不選）：粒子有間隔也可以同時含不同氣體。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"純氣體與空氣都可無色，但空氣由多種物質構成。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-S032","stem":"已知某材料不是混合物，且完整分類只採元素、化合物及混合物。尚未知道其元素組成，能確定什麼？","concept":"在本題完整分類中，排除混合物後可落在純物質這一大類。但純物質下還有元素和化合物，需元素組成才能再分。氣液固等狀態資訊不會代替這個組成條件，也不是判純物質的先決要求。","correct":"B","options":[{"id":"A","text":"必為元素，因已排除混合物","explanation":"錯誤（本題不選）：忽略純化合物也不是混合物。"},{"id":"B","text":"是純物質，但仍可能是元素或化合物","explanation":"正確（本題應選）：排除混合物可確定大類，細分類仍待組成資訊。"},{"id":"C","text":"必為化合物，因只有化合物才具有固定組成","explanation":"錯誤（本題不選）：元素也屬純物質，不能因固定組成概念而排除元素。"},{"id":"D","text":"仍不能列為純物質，必須先知道狀態","explanation":"錯誤（本題不選）：純或混合按成分分類，不需先知道氣液固。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"有時可先確定大類，待元素種類資訊補足後再判細類。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-S033","stem":"一份理想樣品全部是X₂Y分子，另一份全部是XY₂分子，X、Y是不同元素。下列何者正確？","concept":"每份均只有自己的一種分子，故各可為純化合物。X₂Y與XY₂雖有相同元素種類，比例卻不同，因此不能當作同一化合物。判定是否純與判定兩份是否同一物質，是兩個分開的問題。","correct":"A","options":[{"id":"A","text":"兩份各自可為純物質，但不是同一化合物","explanation":"正確（本題應選）：各樣品內單一物質；兩者的化學組成不同。"},{"id":"B","text":"兩份都是混合物，因各有兩種元素","explanation":"錯誤（本題不選）：不同元素化學結合可形成純化合物。"},{"id":"C","text":"兩份必是同一物質，因都含X、Y","explanation":"錯誤（本題不選）：相同元素清單不足以證明相同組成。"},{"id":"D","text":"兩份若等量混合且不反應，仍必為單一純物質","explanation":"錯誤（本題不選）：兩種不同化合物未反應共存，等量也仍是混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"同樣含X和Y的化合物，仍可能因比例不同而不同。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-S034","stem":"一個H₂O分子由氫原子和氧原子構成。下列敘述哪項正確？","concept":"化合物中的組成元素已參與形成該物質，不能直接換成那些元素在單質狀態下的名稱與性質。H₂O是一種化合物；若整份只含水，便是純物質，而非氫氣與氧氣保留身分的混合物。","correct":"D","options":[{"id":"A","text":"水因此是氫氣與氧氣的混合物","explanation":"錯誤（本題不選）：水不是未反應氫氣與氧氣的共存系統。"},{"id":"B","text":"水中的H與O可調成任意原子數比而仍為相同H₂O","explanation":"錯誤（本題不選）：H₂O本身有固定H：O原子數比2：1，不是任意可調配方。"},{"id":"C","text":"水分子含兩種元素，所以不能是純物質","explanation":"錯誤（本題不選）：含兩種元素仍可是一種純化合物。"},{"id":"D","text":"氫與氧是水的組成元素，水本身可是一種化合物","explanation":"正確（本題應選）：元素組成與樣品物質種類被正確區分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"含氫元素不等於含有氫氣這種獨立物質。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-S035","stem":"一份純NaCl與一份NaCl水溶液，已知後者有NaCl成分與水。兩者的分類依序為何？","concept":"純NaCl本身是固定組成的離子化合物；NaCl水溶液另有水這個成分，屬混合物。溶解後各處均勻，並不把水從成分清單中移除，也不使溶液變成只有NaCl的純物質。","correct":"B","options":[{"id":"A","text":"元素、化合物","explanation":"錯誤（本題不選）：NaCl含不同元素，不是元素物質。"},{"id":"B","text":"化合物型純物質、混合物","explanation":"正確（本題應選）：前者單一NaCl；後者還包含水。"},{"id":"C","text":"混合物、元素","explanation":"錯誤（本題不選）：純NaCl不是混合物，鹽水更不是元素。"},{"id":"D","text":"兩者都是單一化合物","explanation":"錯誤（本題不選）：水溶液的『水』不能忽略。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"純鹽與鹽水的名稱相近，但不是同一分類。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-S036","stem":"空氣樣品已知含數種氣體，這些氣體未彼此反應。它為何是混合物？","concept":"空氣的混合物分類來自多種氣體成分共存。氣態本身不決定純或混合：一份只含某一氣體的樣品仍可純。能否肉眼看見成分、是否有固定體積，也不能替代成分種類的證據。","correct":"C","options":[{"id":"A","text":"因為氣體都屬混合物","explanation":"錯誤（本題不選）：單一氣體也能是純物質。"},{"id":"B","text":"因為成分看不見，所以不固定","explanation":"錯誤（本題不選）：看不見不能推出成分數或配比是否固定。"},{"id":"C","text":"因為同一樣品有數種物質保留各自身分","explanation":"正確（本題應選）：多種氣體以各自身分存在符合混合物定義。"},{"id":"D","text":"因為沒有固定體積，所以不能是純物質","explanation":"錯誤（本題不選）：純氣體同樣沒有固定體積。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"空氣即使混合均勻，也不只含一種物質。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-S037","stem":"將兩份配比不同的糖水充分混勻，混合前後均無反應。最合理的結論為何？","concept":"混勻主要改變成分在空間的分布；在無反應且無移除的前提下，糖和水仍都存在。最終即使各處比例一致，也只表示得到更均勻的混合物，並未使兩種成分化學轉化為一種物質。","correct":"A","options":[{"id":"A","text":"仍含糖與水，混勻不會使它變成純物質","explanation":"正確（本題應選）：兩成分仍在，符合題幹無反應的條件。"},{"id":"B","text":"混得越久，物質種類必由兩種降成一種","explanation":"錯誤（本題不選）：攪拌時間不會自行消除成分身分。"},{"id":"C","text":"新的糖水必變成純糖","explanation":"錯誤（本題不選）：沒有移除水，不能得到純糖。"},{"id":"D","text":"兩份配方不同，合併後必有四種物質","explanation":"錯誤（本題不選）：兩份都含相同的糖和水，合併時各身分只計一次，仍是兩種。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"攪拌使濃淡分布平均，並不是純化操作的同義詞。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-S038","stem":"A、B代表兩種不同元素。甲是由A、B形成的固定組成純化合物，乙是A元素物質與B元素物質未反應共存。哪項最能區分兩者？","concept":"純化合物的固定比例屬其化學身分；若改成另一比例，便不是原來單一化合物的相同組成。混合物中成分保留身分，可用不同用量配製。外觀和原子總數無法提供這項本質上的區別。","correct":"B","options":[{"id":"A","text":"甲一定透明，乙一定混濁","explanation":"錯誤（本題不選）：兩類外觀不必有這種固定對應。"},{"id":"B","text":"甲的成分比例由其化學身分決定，乙的混合比例可另行調整","explanation":"正確（本題應選）：固定化學組成與可調配方被正確區分。"},{"id":"C","text":"甲一定含較多原子，乙一定較少","explanation":"錯誤（本題不選）：原子總量取決於樣品用量。"},{"id":"D","text":"甲只可為固態，乙只可為液態","explanation":"錯誤（本題不選）：化合物和混合物都不受這種物態限定。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"NaCl有固定組成，鹽水可有不同濃淡。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-S039","stem":"若要描述某種純物質在指定條件下的特性，而不是樣品取用了多少，下列哪組最合適？","concept":"指定條件下的密度、沸點及化學反應傾向，可用來描述某種物質如何表現。總質量、總體積與粒子總數則受取樣多少影響，不要求同一純物質各份相等。題目要選全部屬前一類的組合。","correct":"A","options":[{"id":"A","text":"密度、沸點、與其他物質反應的傾向","explanation":"正確（本題應選）：包含可受控制條件限定的物理與化學特性。"},{"id":"B","text":"密度、沸點、樣品總質量","explanation":"錯誤（本題不選）：總質量受取樣量影響，不能作這種共同特性值。"},{"id":"C","text":"沸點、樣品總體積、粒子總數","explanation":"錯誤（本題不選）：總體積及粒子總數會隨用量改變。"},{"id":"D","text":"熔點、粒子總數、樣品總質量","explanation":"錯誤（本題不選）：粒子總數及總質量描述取了多少。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"同一純物質可以分成不同用量，密度比較仍須控制條件。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-S040","stem":"瓶內原本只有純物質L，後來確認加入少量不與L反應的不同物質M，且M未被移除。此時應如何描述？","concept":"分類以當下完整成分為準。加入的M不反應且未移除，就以另一物質身分留在瓶內；即使量少，整瓶仍含兩種物質。物態和主要成分比例不能消除已確認存在的另一成分。","correct":"C","options":[{"id":"A","text":"L占大多數，所以仍只有一種物質","explanation":"錯誤（本題不選）：占多數不代表成分種類只有一種。"},{"id":"B","text":"只要保持液態，就仍是純L","explanation":"錯誤（本題不選）：液態與是否單一物質是不同分類面向。"},{"id":"C","text":"已含L與M，整瓶改為混合物","explanation":"正確（本題應選）：新增M後成分種類由一種變兩種。"},{"id":"D","text":"M很少，所以可把M當成L的組成元素","explanation":"錯誤（本題不選）：不同物質不因少量就成為L的化學組成元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"純水混入未反應的另一物質後，不能沿用原本純水結論。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-S041","stem":"P、Q代表兩種不同物質。下列四份理想樣品中，哪份可歸為純物質？","concept":"判斷先看完整成分種類數。只有R的樣品即使R是化合物，仍只有一種物質，屬純物質。其餘三份都含P與Q，無論比例、均勻性或顏色如何，都不能因此刪掉第二種成分。","correct":"B","options":[{"id":"A","text":"含P與Q但P較多的樣品","explanation":"錯誤（本題不選）：成分含量大小不會改變兩種物質共存。"},{"id":"B","text":"只有化合物R的樣品","explanation":"正確（本題應選）：一種化合物可以單獨構成純物質。"},{"id":"C","text":"含等量P與Q的均勻樣品","explanation":"錯誤（本題不選）：等量混合仍有兩種物質。"},{"id":"D","text":"含P與Q且兩者顏色相同的樣品","explanation":"錯誤（本題不選）：成分顏色相同不表示物質身分相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）。","example":"兩種成分看起來相像，仍可以是混合物。","pointId":"PURE-P01","schools":["CMU"]},{"id":"G03-PURE-S042","stem":"某純物質可以經化學反應分成兩種不同元素物質。最恰當的原分類為何？","concept":"原樣品只有一種物質，且能化學分解為不同元素，符合化合物的概念。反應後產物種類增加不會倒推原樣品本來是混合物；元素才具有不能化學分成更簡單物質的定義特徵。","correct":"C","options":[{"id":"A","text":"混合物，因反應產物有兩種","explanation":"錯誤（本題不選）：反應產物種類不等於反應前的物質種類。"},{"id":"B","text":"元素，因原樣品只有一種物質","explanation":"錯誤（本題不選）：單一物質也可能是化合物。"},{"id":"C","text":"化合物，因原物質包含不同元素的化學結合","explanation":"正確（本題應選）：化學分解成不同元素支持原為化合物。"},{"id":"D","text":"無法是純物質，因任何純物質都不能分解","explanation":"錯誤（本題不選）：純物質包含可化學分解的化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序9（正文7）;圖序10（正文8）。","example":"反應前後應分別分類，不能把產物當成原有混合成分。","pointId":"PURE-P02","schools":["CMU"]},{"id":"G03-PURE-S043","stem":"某示意樣品有許多X—Y粒子及少量X—X粒子，X、Y為不同元素；各粒子未互相反應。樣品如何分類？","concept":"X—Y含不同元素，屬化合物粒子；X—X僅含X，屬元素物質粒子。兩者以各自身分共存，所以是元素與化合物的混合物。少量成分仍須計入，不能只用多數粒子的身分代表整份樣品。","correct":"D","options":[{"id":"A","text":"單一化合物，因大多數都是X—Y","explanation":"錯誤（本題不選）：少量X—X仍使物質種類超過一種。"},{"id":"B","text":"單一元素，因兩種粒子都有X","explanation":"錯誤（本題不選）：X—Y還包含Y，不是元素物質。"},{"id":"C","text":"兩種化合物的混合物","explanation":"錯誤（本題不選）：X—X只有一種元素，不是化合物。"},{"id":"D","text":"元素物質與化合物的混合物","explanation":"正確（本題應選）：兩種粒子的分類分別為元素物質與化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序5（正文3）;圖序6（正文4）;圖序9（正文7）;圖序10（正文8）;圖序13（正文11）。","example":"判粒子圖時，要把少數粒子一併檢查。","pointId":"PURE-P03","schools":["CMU"]},{"id":"G03-PURE-S044","stem":"已知所有水分子皆為H₂O。若看到某模型把同一瓶純水畫成部分H₂O、部分H₂O₂，主要問題為何？","concept":"純水可以有很多水分子，但所有水分子需符合H₂O。H₂O₂的元素原子數比例不同，是不同化學組成，不能當成另一種畫法的水分子。因此錯誤在加入第二種物質，而非畫了多顆粒子。","correct":"A","options":[{"id":"A","text":"加入了不同化學組成的粒子，不再符合只有水","explanation":"正確（本題應選）：化學式改變代表不再全為題定的水。"},{"id":"B","text":"模型中原子總數太多，所以不能是純物質","explanation":"錯誤（本題不選）：粒子多寡與物質種類數要分開。"},{"id":"C","text":"H與O不能一起出現在純物質中","explanation":"錯誤（本題不選）：H與O可化學結合成純化合物。"},{"id":"D","text":"純水模型只能畫一個水分子","explanation":"錯誤（本題不選）：純物質可由大量相同分子構成。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序6（正文4）;圖序13（正文11）。","example":"同一樣品中化學式不同的粒子，不能僅因元素相同就合併。","pointId":"PURE-P04","schools":["CMU"]},{"id":"G03-PURE-S045","stem":"說『純NaCl是化合物，但不以獨立NaCl分子描述整個晶體』，這兩句是否矛盾？","concept":"化合物的核心在不同元素形成固定化學組成的物質，不要求一律存在獨立分子。NaCl是離子化合物，可由離子晶體中的固定比例描述。因此其化合物分類與不用NaCl分子描述晶體並不衝突。","correct":"C","options":[{"id":"A","text":"矛盾，所有化合物都必由獨立分子構成","explanation":"錯誤（本題不選）：把分子型結構誤當所有化合物的必要條件。"},{"id":"B","text":"矛盾，離子物質一定是混合物","explanation":"錯誤（本題不選）：不同離子能組成單一離子化合物。"},{"id":"C","text":"不矛盾，化合物可用固定離子組成形成晶體","explanation":"正確（本題應選）：固定離子組成符合化合物概念。"},{"id":"D","text":"不矛盾，因NaCl其實只有一種元素","explanation":"錯誤（本題不選）：NaCl涉及Na與Cl兩種元素。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序7（正文5）;圖序14（正文12）。","example":"純化合物可以是分子型，也可以是離子型。","pointId":"PURE-P05","schools":["CMU"]},{"id":"G03-PURE-S046","stem":"哪一項資訊最能支持『混合後仍為混合物』，而不是已形成單一化合物？","concept":"關鍵在最終成分身分。兩種原物質若仍各自存在，便是多種物質共存；均勻外觀、投入原料數或質量總量本身，都不能獨立區分單一化合物形成與單純混合。判斷應直接追蹤現存物質種類。","correct":"D","options":[{"id":"A","text":"最終樣品的外觀完全均勻","explanation":"錯誤（本題不選）：均勻性不能排除均勻混合物，也不能獨證化合物。"},{"id":"B","text":"最後量到的總質量等於投入總質量","explanation":"錯誤（本題不選）：總質量資訊沒有說明最終物質身分。"},{"id":"C","text":"混合時使用兩種原料","explanation":"錯誤（本題不選）：兩原料可能反應，也可能不反應。"},{"id":"D","text":"混合後可確認兩種原物質仍各自存在","explanation":"正確（本題應選）：兩種原身分共存直接支持混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序10（正文8）;圖序11（正文9）。","example":"先問『成品現在含什麼』，再決定分類。","pointId":"PURE-P06","schools":["CMU"]},{"id":"G03-PURE-S047","stem":"甲液各處組成相同；乙液上、下層組成不同。只靠這些資料，何者正確？","concept":"均勻是純物質常見的組成特徵，但均勻混合物也能具備。甲只有均勻證據，仍無法排除多成分。乙各處化學組成不同，則不能符合此處理想單一純物質各處組成一致的要求。","correct":"B","options":[{"id":"A","text":"甲必純，乙必純","explanation":"錯誤（本題不選）：甲均勻不足證純，乙組成差異更不支持純。"},{"id":"B","text":"甲仍可能是混合物；乙不符合單一純物質的均一組成","explanation":"正確（本題應選）：甲的證據不足；乙的組成差異否定單一純物質。"},{"id":"C","text":"甲必為元素，乙必為化合物","explanation":"錯誤（本題不選）：元素或化合物需要元素組成資訊。"},{"id":"D","text":"甲不可能含兩種成分；乙只能含一種成分","explanation":"錯誤（本題不選）：均勻可多成分，組成不同不能反推只有一成分。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序12（正文10）;圖序14（正文12）。","example":"要區分『足以否定』與『足以證明』兩種證據力。","pointId":"PURE-P07","schools":["CMU"]},{"id":"G03-PURE-S048","stem":"P、Q為兩種不同物質，每份的質量相同。配方甲使用1份P與1份Q，配方乙使用2份P與1份Q；兩者都沒有反應。這最適合說明什麼？","concept":"混合物中的成分仍保有身分，所以可用不同用量配出不同組成。甲乙比例不同卻仍由P與Q共存，正好示範可變配方。整數比只是用量的寫法，不能證明原料已化學結合。","correct":"A","options":[{"id":"A","text":"混合物的成分比例可以調整","explanation":"正確（本題應選）：同兩成分以不同用量形成不同混合配比。"},{"id":"B","text":"配方乙中P較多，因此乙是純P","explanation":"錯誤（本題不選）：P占多數不會使仍存在的Q被排除，乙仍有兩種物質。"},{"id":"C","text":"只要比例使用整數，就形成化合物","explanation":"錯誤（本題不選）：整數混合比也可能只是人為配方。"},{"id":"D","text":"P與Q在兩配方內必須變成新物質","explanation":"錯誤（本題不選）：題幹明定未反應，不能推導新物質。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"糖水可淡可濃，糖與水仍是原來兩個成分。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-S049","stem":"兩個樣品在相同條件下具有相同密度。哪項結論最合乎證據？","concept":"某項性質相同可支持進一步比較，卻不保證物質身分唯一。不同物質或混合物可能在某條件下具有相同密度。若要確認同一純物質，仍須結合成分及其他足以區分候選物的證據。","correct":"C","options":[{"id":"A","text":"必為同一純物質","explanation":"錯誤（本題不選）：單項性質重合不是身分相同的充分條件。"},{"id":"B","text":"必為相同元素","explanation":"錯誤（本題不選）：密度值不直接告訴元素種類。"},{"id":"C","text":"密度相同可作比較線索，但單項相同不足確認身分","explanation":"正確（本題應選）：區分相符線索與充分證據，推論較穩健。"},{"id":"D","text":"兩個樣品都不可能是混合物","explanation":"錯誤（本題不選）：混合物同樣具有可測密度。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序8（正文6）。","example":"物性相符可提示可能相同，不能單靠一值排除所有其他成分。","pointId":"PURE-P09","schools":["CMU"]},{"id":"G03-PURE-S050","stem":"一份材料的成分表只寫『含水』，沒有列出其餘成分。可否因此把整份材料判為純水？","concept":"『含水』只表示水存在，未聲明水是唯一成分，因此不能直接推出純水。這是資訊不足，並不等於已證實混合物：若後續確認只有H₂O即可判純；若另有成分才判混合。","correct":"B","options":[{"id":"A","text":"可以，含水就等於只有水","explanation":"錯誤（本題不選）：存在水與只有水是不同的邏輯條件。"},{"id":"B","text":"不可以，目前資訊未排除其他物質","explanation":"正確（本題應選）：未提供完整成分，不能排除第二種物質。"},{"id":"C","text":"可以，只要水是透明的","explanation":"錯誤（本題不選）：水的外觀不補足其餘成分資訊。"},{"id":"D","text":"不可以，因任何含水材料都必是混合物","explanation":"錯誤（本題不選）：含水可以是純水，也可以是混合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"『只含水』比『含水』提供更強的成分限制。","pointId":"PURE-P10","schools":["CMU"]}]},{"depth":"基礎讀","target":100,"questions":[{"id":"G03-PURE-B001","stem":"純化合物K只含A、B兩種不同元素，A占總質量30%。三份聲稱為純K的樣品：甲10 g含A 3 g；乙20 g含A 6 g；丙20 g含A 9 g。忽略誤差，何者與K固定組成不相容？","concept":"逐份把A質量除以總質量：甲3/10＝30%，乙6/20＝30%，丙9/20＝45%。K固定為30%，故丙不可能依題定條件是相同純K。甲乙只是組成上相容，此一比例仍不能單獨證明其純度。","correct":"C","options":[{"id":"A","text":"只有甲","explanation":"錯誤（本題不選）：甲的30%符合K的必要組成。"},{"id":"B","text":"只有乙","explanation":"錯誤（本題不選）：乙的30%符合K的必要組成。"},{"id":"C","text":"只有丙","explanation":"正確（本題應選）：丙為45%，違反K固定30%的條件。"},{"id":"D","text":"甲乙丙都相容","explanation":"錯誤（本題不選）：丙的比例明顯不符，不能全列相容。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"10 g樣品與20 g樣品不需含相同克數的A，需有相同比例。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B002","stem":"A、B是兩種不同元素。甲、乙樣品各重10 g，甲含A 2 g，乙含A 8 g，剩餘均為B。把兩份合計後A占50%。能否據此說甲、乙原本都是A占50%的同一純化合物？","concept":"合計A有10 g、總質量20 g，所以平均為50%；但原本甲為20%、乙為80%。同一純化合物不同樣品應有相同組成，不能以合併後平均掩蓋差異。否定的是兩份同為該固定組成，不是否定化合物可純。","correct":"A","options":[{"id":"A","text":"不能，合計平均值掩蓋了各份20%與80%的差異","explanation":"正確（本題應選）：分份計算與合計回答不同問題，必須保留差異。"},{"id":"B","text":"能，總體50%會使每份都變成50%","explanation":"錯誤（本題不選）：平均值不會倒改原樣品的成分。"},{"id":"C","text":"能，只要兩份總質量相同","explanation":"錯誤（本題不選）：等質量只讓平均可簡算，不證明組成相同。"},{"id":"D","text":"不能，因所有含A、B的物質都不是純物質","explanation":"錯誤（本題不選）：兩元素化學結合可形成純化合物。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序3（正文1）;圖序4（正文2）;圖序6（正文4）;圖序11（正文9）;圖序15（正文13）。","example":"兩班平均分數的平均值，不代表兩班各自平均相同；組成也要分樣品看。","pointId":"PURE-P10","schools":["CMU"]},{"id":"G03-PURE-B003","stem":"A、B為不同元素。A元素物質與B元素物質未反應的混合物甲中，A：B質量比為2：5；純化合物乙也恰有同樣元素質量比。何者正確？","concept":"數值相等不等於成分以相同方式存在。甲的A、B未反應仍各自存在，乙則是一種已化學結合的純化合物。因此比例只是組成資訊之一，尚須結合物質身分，不能單憑同一比值認定分類與性質完全相同。","correct":"D","options":[{"id":"A","text":"同質量比使甲必轉成乙","explanation":"錯誤（本題不選）：數字相符不是發生反應的證據。"},{"id":"B","text":"乙也必是混合物","explanation":"錯誤（本題不選）：題定乙為純化合物，不由甲比例否定。"},{"id":"C","text":"甲乙一定具有完全相同性質","explanation":"錯誤（本題不選）：身分不同，不能保證全部特性相同。"},{"id":"D","text":"比例相同不足以消除兩者在化學身分上的差異","explanation":"正確（本題應選）：區分配比相同與化學組成身分相同。"}],"source":"Chemistry: The Central Science in SI Units, 15th Global Edition；Chapter 1 / 1.2 Classification of Matter / Pure Substances；印刷頁 51；1 PDF頁 53；已審筆記頁 圖序4（正文2）;圖序11（正文9）;圖序12（正文10）。","example":"相同元素比例可被人為配出，但配方本身不證明化合物形成。","pointId":"PURE-P08","schools":["CMU"]},{"id":"G03-PURE-B004","stem":"完整模型甲只有6個H₂O分子；模型乙只有6個H₂分子與3個O₂分子且未反應。兩模型H：O總原子數比皆為2：1，何者正確？","concept":"甲有12個H、6個O，全部結合成H₂O；乙也有12個H、6個O，但分別在H₂與O₂物質內。總比相同不表示分子種類相同。甲只有水；乙兩種元素物質未反應共存，故是混合物。","correct":"B","optio
